<script>
// Datas por movimento complementam a formula do PCP; nunca substituem sua quantidade.
(function() {
    'use strict';
    const indicesMapa = new WeakMap();
    const resultadosLinha = new WeakMap();
    const camposIdentidade = ['_SOURCE', 'BASE', '_base', 'MARCA_FINAL', 'UNIDADE', 'BR', 'AE',
        'GRAFICA_FINAL', 'GRÁFICA', 'GRAFICA', 'GRÁFICA_MAPA', 'S', 'AD', 'BQ', 'SKU', 'SKU_REAL', 'AJ', 'BW',
        'CD_MAPA', 'CD DESTINO', 'CD_DESTINO', 'CD_FINAL', 'AS', 'ENVIO', 'BT',
        'DT_ENTREGA_DG', 'DG', 'BU', 'G', '_PG_TP_CHAVE_FORECAST', '_PG_TP_FORECAST', '_PG_TP_ORIGEM'];
    const normal = v => String(v ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .trim().replace(/\s+/g, ' ').toUpperCase();
    const textoCompleto = v => !!normal(v) && !['-', 'N/A', 'NA', 'UNDEFINED', 'NULL', '#N/A'].includes(normal(v));
    const numero = v => typeof v === 'number' && Number.isFinite(v) ? v : null;
    const data = v => {
        const s = String(v ?? '').trim();
        const m = /^(\d{4}-\d{2}-\d{2})(?:$|T|\s)/.exec(s);
        if (!m) return null;
        const d = new Date(m[1] + 'T00:00:00Z');
        return Number.isFinite(d.getTime()) && d.toISOString().slice(0, 10) === m[1] ? m[1] : null;
    };
    const primeiro = (linha, nomes) => {
        for (const nome of nomes) {
            const v = linha?.[nome];
            if (v !== null && v !== undefined && String(v).trim() !== '') return v;
        }
        return '';
    };
    const chave = partes => JSON.stringify(partes);
    const identidadeLinha = linha => {
        const acabadora = [linha?._SOURCE, linha?.BASE, linha?._base].some(v => normal(v).includes('ACAB'));
        return {
            acabadora,
            partes: [
                normal(primeiro(linha, ['MARCA_FINAL', 'UNIDADE', acabadora ? 'AE' : 'BR'])),
                normal(primeiro(linha, acabadora ? ['GRAFICA_FINAL', 'GRÁFICA', 'GRAFICA', 'AD']
                    : ['GRÁFICA_MAPA', 'S', 'GRAFICA_FINAL', 'GRÁFICA', 'GRAFICA', 'BQ'])),
                normal(primeiro(linha, acabadora ? ['SKU', 'AJ', 'SKU_REAL'] : ['SKU_REAL', 'SKU', 'BW'])),
                normal(acabadora ? primeiro(linha, ['CD DESTINO', 'CD_DESTINO', 'CD_FINAL', 'AS']) : linha?.CD_MAPA)
            ],
            envio: normal(primeiro(linha, ['ENVIO', 'BT']))
        };
    };
    function indexarMapa(mapa) {
        if (!mapa || typeof mapa !== 'object' || Array.isArray(mapa)) return null;
        const anterior = indicesMapa.get(mapa);
        if (anterior) return anterior;
        const indice = { grupos: new Map(), parciais: new Map(), legado: false,
            forecast: mapa.__forecastTP,
            forecastColeta: new Set((mapa.__forecastTP?.coleta || []).map(normal)),
            forecastEntrega: new Set((mapa.__forecastTP?.entrega || []).map(normal)) };
        const listas = Array.isArray(mapa.__eventosTPAtuais)
            ? [mapa.__eventosTPAtuais] : Object.keys(mapa)
                .filter(k => k !== '__parcelasAgendaSemAP').map(k => mapa[k]);
        listas.forEach(lista => {
            if (!Array.isArray(lista)) return;
            lista.forEach(evento => {
                if (!evento || ![1, 2].includes(evento.eventoTPVersao)) { indice.legado = true; return; }
                const partes = [evento.marca, evento.grafica, evento.sku, evento.destino].map(normal);
                const registro = { evento, partes, envio: normal(evento.envio) };
                const mascara = partes.reduce((m, p, i) => textoCompleto(p) ? m | (1 << i) : m, 0);
                if (mascara !== 15) {
                    // Identidades parciais so bloqueiam linhas com os mesmos campos conhecidos.
                    if (!indice.parciais.has(mascara)) indice.parciais.set(mascara, new Map());
                    const grupos = indice.parciais.get(mascara);
                    const k = chave(partes.filter((p, i) => mascara & (1 << i)));
                    if (!grupos.has(k)) grupos.set(k, []);
                    grupos.get(k).push(registro);
                    return;
                }
                const k = chave(partes);
                if (!indice.grupos.has(k)) indice.grupos.set(k, []);
                indice.grupos.get(k).push(registro);
            });
        });
        indicesMapa.set(mapa, indice);
        return indice;
    }
    function vetorLegado(volume, dt) {
        const n = numero(volume), iso = data(dt);
        return n !== null && n > 0 && iso ? [{ data: iso, volume: n }] : [];
    }
    function comDiagnostico(eventos, detalhe) {
        Object.defineProperty(eventos, 'conciliacao', { value: detalhe, enumerable: false });
        return eventos;
    }
    function temExcecao(linha, identidade) {
        if (linha?._PG_TP_FORECAST || normal(linha?._PG_TP_ORIGEM).includes('FORECAST')) return 'forecast-soberano';
        const graficaFinal = normal(primeiro(linha, ['GRAFICA_FINAL', 'BQ', 'GRÁFICA', 'GRAFICA']));
        if (graficaFinal !== 'POSIGRAF' || !['CQT', 'PIA', 'SPE'].includes(identidade.partes[0])) return '';
        const especial = primeiro(linha, ['DT_ENTREGA_DG', identidade.acabadora ? 'BU' : 'DG']);
        return data(especial) || (typeof especial === 'number' && especial > 0) ? 'excecao-posigraf' : '';
    }
    // Agenda independente de AZ/EB. O matching usa a grafica da quantidade (S).
    const identidadeAgenda = linha => {
        const id = identidadeLinha(linha);
        if (id.acabadora) id.partes[1] = normal(primeiro(linha,
            ['GRÁFICA_MAPA', 'GRÁFICA DE ORIGEM', 'S', 'GRAFICA_FINAL', 'GRÁFICA', 'GRAFICA', 'AD']));
        return { ...id, chave: chave([...id.partes, id.envio]),
            completa: id.partes.every(textoCompleto) && textoCompleto(id.envio) };
    };
    let cacheAgenda;
    function obterAgenda(hoje) {
        const mapa = window.MAPA_SAIDA_CACHE;
        const base = window.dadosGlobais || window.dadosTotalCanonico || [];
        if (cacheAgenda?.mapa === mapa && cacheAgenda.base === base &&
            cacheAgenda.tamanho === base.length && cacheAgenda.hoje === hoje) return cacheAgenda;
        const donos = new Map(), referencias = new WeakSet(), porChave = new Map();
        const ordem = base.map((linha, i) => ({ linha, i, id: identidadeAgenda(linha) }));
        ordem.sort((a, b) => Number(a.id.acabadora) - Number(b.id.acabadora) ||
            (Number(a.linha._PG_TP_LINHA) || a.i + 1) - (Number(b.linha._PG_TP_LINHA) || b.i + 1));
        ordem.forEach(({ linha, id }) => {
            referencias.add(linha);
            if (id.completa && !window.pgSolicitacaoCancelada?.(linha) && !donos.has(id.chave)) donos.set(id.chave, linha);
        });
        const descartes = {}, datasSemPCP = {};
        const descartar = (motivo, volume) => {
            const d = descartes[motivo] || (descartes[motivo] = { motivo, parcelas: 0, volume: 0 });
            d.parcelas++; d.volume += volume;
        };
        const indice = indexarMapa(mapa);
        const listas = Array.isArray(mapa?.__eventosTPAtuais) ? [mapa.__eventosTPAtuais]
            : Object.keys(mapa || {}).filter(k => k !== '__parcelasAgendaSemAP').map(k => mapa[k]);
        listas.push(mapa?.__parcelasAgendaSemAP || []);
        const vistas = new Set();
        const disponivel = !!mapa?.__agendaTPCompleta && !!indice?.forecast?.conferido;
        if (disponivel) listas.forEach(lista => {
            if (!Array.isArray(lista)) return;
            lista.forEach(e => {
                if (!e || e.eventoTPVersao !== 2) return;
                const solicitado = numero(e.volumeSolicitado), coletado = e.volumeColetado == null ? 0 : numero(e.volumeColetado);
                if (solicitado === null || coletado === null || solicitado < 0 || coletado < 0) {
                    descartar('quantidade-invalida', 0); return;
                }
                const volume = Math.max(0, solicitado - coletado);
                if (!volume) return;
                if (Number.isInteger(e.linhaMapa)) {
                    if (vistas.has(e.linhaMapa)) { descartar('parcela-repetida-no-payload', volume); return; }
                    vistas.add(e.linhaMapa);
                }
                const partes = [e.marca, e.grafica, e.sku, e.destino, e.envio].map(normal);
                const k = chave(partes), dono = partes.every(textoCompleto) ? donos.get(k) : null;
                let dt = data(e.dataAgendada);
                if (!dono) {
                    if (dt && dt >= hoje) {
                        descartar('sem-chave-no-pcp', volume);
                        datasSemPCP[dt] = (datasSemPCP[dt] || 0) + volume;
                    }
                    return;
                }
                const id = identidadeAgenda(dono);
                const chaveForecast = normal(primeiro(dono, ['_PG_TP_CHAVE_FORECAST', 'G']) ||
                    id.partes[3] + id.partes[1] + id.partes[2] + id.envio);
                const excecao = temExcecao(dono, id) || (indice.forecastColeta.has(chaveForecast) ? 'forecast-soberano' : '');
                if (excecao) { descartar(excecao, volume); return; }
                if (dt && dt.slice(0, 4) !== '2026') dt = data(primeiro(dono,
                    ['DT_ENTREGA_DG', id.acabadora ? 'BU' : 'DG']));
                if (!dt) { descartar('data-agendada-ausente-ou-invalida', volume); return; }
                if (dt < hoje) return;
                if (!porChave.has(k)) porChave.set(k, []);
                porChave.get(k).push({ data: dt, volume, codigoMapa: e.codigoMapa,
                    linhaMapa: e.linhaMapa, chaveMapa: e.chaveMapa, kit: e.kit || '' });
            });
        });
        cacheAgenda = { mapa, base, tamanho: base.length, hoje, donos, referencias,
            porChave, descartes, datasSemPCP, disponivel, indice };
        return cacheAgenda;
    }
    window.pgEventosAgendaMapaLinha = function(linha, hoje, volumeLegado, dataLegada) {
        const estado = obterAgenda(hoje), id = identidadeAgenda(linha), dono = estado.donos.get(id.chave);
        const resultado = (lista, motivo, modo = 'eventos') => comDiagnostico(lista, {
            tipo: 'agendado', modo, motivo, chaveAgenda: id.chave, volumeLegado, dataLegada });
        if (!id.completa) return resultado([], 'identidade-da-linha-incompleta');
        if (dono !== linha) {
            // Linhas sinteticas das visoes mantem a identidade da primeira linha fisica.
            const assinatura = l => chave([l?._SOURCE, l?._PG_TP_LINHA, l?.Chave,
                l?.['TIRAGEM COLETADA'], l?.['Coleta/Internalização de estoque final (re) plan']]);
            if (!dono || estado.referencias.has(linha) || assinatura(dono) !== assinatura(linha)) {
                return resultado([], 'chave-atribuida-a-primeira-linha');
            }
        }
        const chaveForecast = normal(primeiro(linha, ['_PG_TP_CHAVE_FORECAST', 'G']) ||
            id.partes[3] + id.partes[1] + id.partes[2] + id.envio);
        const excecao = temExcecao(linha, id) ||
            (estado.indice?.forecastColeta.has(chaveForecast) ? 'forecast-soberano' : '');
        if (excecao) return resultado(vetorLegado(volumeLegado, dataLegada), excecao, 'legado');
        if (!estado.disponivel) return resultado([], estado.mapa?.__agendaTPCompleta
            ? 'forecast-nao-conferido' : 'parcelas-indisponiveis', 'indisponivel');
        const eventos = (estado.porChave.get(id.chave) || []).slice().sort((a, b) => a.data.localeCompare(b.data));
        return resultado(eventos, eventos.length ? 'saldo-o-menos-an-por-parcela' : 'sem-parcelas-pendentes');
    };
    window.pgStatusAgendaTP = function() {
        const mapa = window.MAPA_SAIDA_CACHE;
        if (window.PG_MAPA_TP_CARGA_CONCLUIDA === false) return { disponivel: false, aviso: 'Carregando parcelas do mapa…' };
        if (!mapa?.__agendaTPCompleta) return { disponivel: false, aviso: 'Agendamento indisponível: falha ao carregar parcelas do mapa.' };
        if (!mapa.__forecastTP?.conferido) return { disponivel: false, aviso: 'Agendamento indisponível: não foi possível conferir o Forecast.' };
        return { disponivel: true, aviso: '' };
    };
    // Realizados mantem as travas de conciliacao anteriores. A agenda e apurada acima.
    // hoje e sempre o corte atual de conciliacao, mesmo quando o consumidor pede um dia passado.
    function calcularEventosLinha(linha, tipo, hoje, volumeLegado, dataLegada) {
        const dtHoje = data(hoje), dtLegada = data(dataLegada), n = numero(volumeLegado);
        const detalhe = { modo: 'legado', motivo: '', tipo, volumeLegado: n, dataLegada: dtLegada };
        const pendente = tipo === 'agendado-pendente';
        const legado = motivo => comDiagnostico(pendente ? [] : vetorLegado(volumeLegado, dataLegada), { ...detalhe, motivo });
        const agenda = tipo === 'agendado' || pendente;
        if (!['coleta', 'entrega', 'agendado', 'agendado-pendente'].includes(tipo)) return legado('tipo-desconhecido');
        if (n === null || n <= 0 || !dtLegada || !dtHoje || (!agenda && dtLegada > dtHoje)) return legado('sem-realizado-legado-valido');
        const identidade = identidadeLinha(linha);
        if (!identidade.partes.every(textoCompleto) || (!identidade.acabadora && !textoCompleto(identidade.envio))) {
            return legado('identidade-da-linha-incompleta');
        }
        const excecao = temExcecao(linha, identidade);
        if (excecao) return legado(excecao);
        const indice = indexarMapa(window.MAPA_SAIDA_CACHE);
        if (!indice || indice.legado) return legado('cache-sem-contrato-tp');
        if (pendente && !indice.forecast?.conferido) return legado('forecast-nao-conferido');
        if (indice.forecast) {
            if (!indice.forecast.conferido) return legado('forecast-nao-conferido');
            const chaveForecast = normal(primeiro(linha, ['_PG_TP_CHAVE_FORECAST', 'G']) ||
                identidade.partes[3] + identidade.partes[1] + identidade.partes[2] + identidade.envio);
            if ((tipo === 'entrega' ? indice.forecastEntrega : indice.forecastColeta).has(chaveForecast)) {
                return legado('forecast-soberano');
            }
        }
        const mesmaVersao = r => identidade.acabadora || !textoCompleto(r.envio) || r.envio === identidade.envio;
        for (const [mascara, grupos] of indice.parciais) {
            const k = chave(identidade.partes.filter((p, i) => mascara & (1 << i)));
            if ((grupos.get(k) || []).some(mesmaVersao)) return legado('identidade-do-mapa-incompleta');
        }
        const candidatos = (indice.grupos.get(chave(identidade.partes)) || []).filter(mesmaVersao);
        detalhe.candidatos = candidatos.length;
        if (!candidatos.length) return legado('sem-movimentos-da-identidade');
        if (!identidade.acabadora && candidatos.some(r => !textoCompleto(r.envio))) return legado('envio-ax-ausente');
        const eventos = [], linhasFisicas = new Set();
        let soma = 0, somaAgendada = 0;
        for (const { evento } of candidatos) {
            if (agenda && evento.eventoTPVersao !== 2) return legado('cache-sem-data-agendada-ar');
            const quantidade = agenda && !pendente ? evento.volumeSolicitado : evento.volumeColetado;
            const base = quantidade == null ? 0 : numero(quantidade);
            if (base === null || base < 0) return legado('quantidade-do-mapa-invalida');
            soma += base;
            const solicitado = numero(evento.volumeSolicitado);
            if (pendente && (solicitado === null || solicitado < 0)) return legado('quantidade-do-mapa-invalida');
            const volume = pendente ? Math.max(0, solicitado - base) : base;
            // AN vazio nao contribui na formula. AN negativo ou malformado nao e redistribuido.
            if (volume === 0) continue;
            if (volume === null || volume < 0) return legado('quantidade-do-mapa-invalida');
            if (!textoCompleto(evento.codigoMapa) || !textoCompleto(evento.chaveMapa) ||
                !Number.isInteger(evento.linhaMapa) || evento.linhaMapa < 2) return legado('identidade-do-movimento-incompleta');
            if (linhasFisicas.has(evento.linhaMapa)) return legado('linha-do-mapa-duplicada');
            linhasFisicas.add(evento.linhaMapa);
            let dt = data(agenda ? evento.dataAgendada : tipo === 'entrega' ? evento.entregaTP : evento.coletaTP);
            // A regra de ano da planilha continua usando DG, sem corrigir a base.
            if (evento.eventoTPVersao === 2 && dt && dt.slice(0, 4) !== '2026') {
                dt = data(primeiro(linha, ['DT_ENTREGA_DG', identidade.acabadora ? 'BU' : 'DG']));
            }
            if (!dt || (!agenda && dt > dtHoje)) {
                return legado('data-do-movimento-ausente-invalida-ou-futura');
            }
            somaAgendada += volume;
            eventos.push({ data: dt, volume, codigoMapa: evento.codigoMapa, linhaMapa: evento.linhaMapa,
                chaveMapa: evento.chaveMapa, kit: evento.kit || '' });
        }
        detalhe.volumeEventos = soma;
        if (soma !== n) return legado('quantidade-nao-concilia-com-formula');
        eventos.sort((a, b) => a.data.localeCompare(b.data) || a.linhaMapa - b.linhaMapa);
        const extrema = eventos.length && eventos[agenda ? eventos.length - 1 : 0].data;
        // Cache v1 nao informa a origem Forecast: a ancora MINIFS/MAXIFS e obrigatoria.
        if (!pendente && !indice.forecast?.conferido && extrema !== dtLegada) {
            return legado(agenda ? 'data-maxima-diverge-da-formula' : 'data-minima-diverge-da-formula');
        }
        return comDiagnostico(eventos, { ...detalhe, modo: 'eventos',
            volumeAgendadoAdicional: pendente ? somaAgendada : 0,
            motivo: pendente ? 'pendente-adicional-conciliado' : 'quantidade-e-data-conciliadas' });
    }
    window.pgEventosTPLinha = function(linha, tipo, hoje, volumeLegado, dataLegada) {
        if (tipo === 'agendado' || tipo === 'agendado-pendente') {
            return window.pgEventosAgendaMapaLinha(linha, hoje, volumeLegado,
                tipo === 'agendado-pendente' ? null : dataLegada);
        }
        if (!linha || typeof linha !== 'object') return calcularEventosLinha(linha, tipo, hoje, volumeLegado, dataLegada);
        const mapa = window.MAPA_SAIDA_CACHE;
        const valores = camposIdentidade.map(campo => linha[campo]);
        let cache = resultadosLinha.get(linha);
        if (!cache || cache.mapa !== mapa || valores.some((v, i) => v !== cache.identidade[i])) {
            cache = { mapa, identidade: valores, resultados: new Map() };
            resultadosLinha.set(linha, cache);
        }
        const assinatura = JSON.stringify([tipo, hoje, volumeLegado, dataLegada]);
        if (cache.resultados.has(assinatura)) return cache.resultados.get(assinatura);
        const eventos = calcularEventosLinha(linha, tipo, hoje, volumeLegado, dataLegada);
        if (cache.resultados.size >= 16) cache.resultados.clear();
        cache.resultados.set(assinatura, eventos);
        return eventos;
    };
    window.pgSomaEventosTP = function(eventos, corte, modo = 'ate') {
        const limite = data(corte);
        if (!limite || !Array.isArray(eventos) || !['ate', 'dia'].includes(modo)) return 0;
        return eventos.reduce((s, evento) => {
            const dt = data(evento?.data), volume = numero(evento?.volume);
            return dt && volume !== null && volume > 0 && (modo === 'dia' ? dt === limite : dt <= limite) ? s + volume : s;
        }, 0);
    };
    window.pgEventosRealRegistroTP = function(registro) {
        return Array.isArray(registro?.eventosReal) ? registro.eventosReal : vetorLegado(registro?.coletada, registro?.dtReal);
    };
    // Parcela do Plan ja atendida fora de sua data, sem somar outra vez ao Real.
    window.pgColetadoOutroDiaRegistroTP = function(registro, hoje) {
        const dtPlan = data(registro?.dtPlan), corte = data(hoje);
        const plan = numero(registro?.tiragem);
        if (!dtPlan || !corte || plan === null || plan <= 0) return 0;
        const foraDoDia = window.pgEventosRealRegistroTP(registro).reduce((s, e) => {
            const dt = data(e?.data), volume = numero(e?.volume);
            return s + (dt && dt <= corte && dt !== dtPlan && volume !== null && volume > 0 ? volume : 0);
        }, 0);
        return Math.min(plan, foraDoDia);
    };
    window.pgEventosAgendaRegistroTP = function(registro) {
        return Array.isArray(registro?.eventosAgendados) ? registro.eventosAgendados
            : vetorLegado(registro?.volumeMapaAgendado, registro?.dtMapaAgendado);
    };
    window.pgDatasAgendaRegistroTP = function(registro) {
        return [...new Set(window.pgEventosAgendaRegistroTP(registro).map(e => e.data))].join(' / ');
    };
    // Compartilha a requisicao entre o carregamento principal e as abas.
    let mapaPromise;
    window.pgCarregarMapaTPCache = function() {
        if (!mapaPromise) {
            window.PG_MAPA_TP_CARGA_CONCLUIDA = false;
            mapaPromise = new Promise((resolve, reject) => {
                google.script.run.withSuccessHandler(valor => {
                    window.MAPA_SAIDA_CACHE = valor || {};
                    window.PG_MAPA_TP_CARGA_CONCLUIDA = true;
                    resolve(valor);
                }).withFailureHandler(reject).getDadosMapaSaida_Cache();
            }).catch(erro => {
                window.PG_MAPA_TP_CARGA_CONCLUIDA = true;
                window.MAPA_SAIDA_CACHE = window.MAPA_SAIDA_CACHE || {};
                window.MAPA_SAIDA_CACHE.__erroAgendaTP = erro?.message || String(erro);
                window.pgAtualizarDatasTPDoMapa?.();
                mapaPromise = null; throw erro;
            });
        }
        return mapaPromise;
    };
    window.pgTPExportacaoPronta = function() {
        if (window.PG_MAPA_TP_CARGA_CONCLUIDA === false) {
            window.alert('As parcelas do mapa ainda estao carregando. Aguarde a conclusao e repita a exportacao.');
            return false;
        }
        if (window.PG_MAPA_TP_CARGA_CONCLUIDA === true &&
            !window.pgStatusAgendaTP().disponivel) {
            window.alert('As parcelas do mapa nao puderam ser carregadas. Recarregue o portal antes de exportar.');
            return false;
        }
        return true;
    };
    window.pgDiagnosticoTP = async function() {
        if (mapaPromise) { try { await mapaPromise; } catch (e) {} }
        const motivos = {}, meses = {}, porData = {};
        const totais = { antes: 0, depois: 0, diferenca: 0, agendadoAntes: 0, agendadoDepois: 0 };
        const hoje = typeof dtHojeISO !== 'undefined' ? dtHojeISO : new Date().toISOString().slice(0, 10);
        (window.dadosGlobais || []).forEach(linha => {
            const v = window.pgVolumesColetaUnificadosV37(linha, hoje);
            const antes = window.pgNumeroPrazoV35(window.pgCampoPrazoV35(linha, 'TIRAGEM COLETADA'));
            const dtPlan = window.pgNormalizarDataColeta(window.pgCampoPrazoV35(linha,
                'Coleta/Internalização de estoque final (re) plan'), hoje);
            const mes = dtPlan ? dtPlan.slice(0, 7) : 'sem-mes';
            const m = meses[mes] || (meses[mes] = { mes, antes: 0, depois: 0, diferenca: 0 });
            m.antes += antes; m.depois += v.bruto; m.diferenca = m.depois - m.antes;
            totais.antes += antes; totais.depois += v.bruto;
            const acab = identidadeLinha(linha).acabadora;
            totais.agendadoAntes += !acab && !v.coletaTP && v.mapaAgendado >= hoje ? v.bruto : 0;
            totais.agendadoDepois += v.agendado;
            const dia = dt => porData[dt] || (porData[dt] = { data: dt, antes: 0, depois: 0, diferenca: 0 });
            if (!acab && !v.coletaTP && v.mapaAgendado >= hoje) dia(v.mapaAgendado).antes += v.bruto;
            v.eventosAgendados.forEach(e => { if (e.data >= hoje) dia(e.data).depois += e.volume; });
            [['coleta', v.eventosColetaTP], ['entrega', v.eventosEntregaTP], ['agendado', v.eventosAgendados]]
                .forEach(([tipo, eventos]) => {
                    const d = eventos?.conciliacao;
                    const k = tipo + ': ' + (d?.modo || 'legado') + ' / ' + (d?.motivo || 'sem-diagnostico');
                    const r = motivos[k] || (motivos[k] = { tipo, modo: d?.modo || 'legado',
                        motivo: d?.motivo || 'sem-diagnostico', linhas: 0, linhasComVolume: 0 });
                    r.linhas++; if (v.bruto > 0) r.linhasComVolume++;
                });
        });
        totais.diferenca = totais.depois - totais.antes;
        const agenda = obterAgenda(hoje);
        Object.values(porData).forEach(d => { d.diferenca = d.depois - d.antes; });
        const resultado = { cargaConcluida: window.PG_MAPA_TP_CARGA_CONCLUIDA === true,
            parcelasDisponiveis: agenda.disponivel, avisoAgendado: window.pgStatusAgendaTP().aviso,
            erroCargaParcelas: window.MAPA_SAIDA_CACHE?.__erroAgendaTP || window.MAPA_SAIDA_CACHE?.__forecastTP?.erro || '',
            cacheParcelasGeradoEm: window.MAPA_SAIDA_CACHE?.__agendaTPGeradoEm || '',
            motivos: Object.values(motivos), totais, meses: Object.values(meses),
            agendadoPorData: Object.values(porData).sort((a,b) => a.data.localeCompare(b.data)),
            parcelasDescartadas: Object.values(agenda.descartes),
            volumeSemChavePCP: agenda.descartes['sem-chave-no-pcp']?.volume || 0,
            semChavePCPPorData: agenda.datasSemPCP };
        console.table(resultado.motivos); console.table([totais]); console.table(resultado.meses);
        console.table(resultado.agendadoPorData); console.table(resultado.parcelasDescartadas);
        return resultado;
    };
    window.pgAtualizarDatasTPDoMapa = function() {
        const mapa = window.MAPA_SAIDA_CACHE;
        if (!mapa || (!mapa.__erroAgendaTP && !Object.values(mapa).some(lista => Array.isArray(lista) &&
            lista.some(evento => [1, 2].includes(evento?.eventoTPVersao))))) return false;
        window.pgCacheResumoColeta = null;
        window.pgAbasRenderizadas?.clear();
        if (!window.pgCarregamentoInicial && window.dadosGlobais?.length &&
            typeof window.pgAtualizarAbaProducao === 'function') window.pgAtualizarAbaProducao();
        return true;
    };
})();
</script>
