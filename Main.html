    <style>
        /* GLOBAIS */
        .scroller::-webkit-scrollbar { height: 8px; width: 8px; }
        .scroller::-webkit-scrollbar-thumb { background: #525252; border-radius: 4px; }
        .scroller::-webkit-scrollbar-track { background: transparent; }
        
        /* CORES DO MENU LATERAL */
        .menu-btn { color: #9ca3af; transition: all 0.2s; }
        .menu-btn:hover { background-color: #171717; color: white; }
        .menu-active { background-color: #dc2626 !important; color: white !important; font-weight: bold; }

        /* VISIBILIDADE */
        .view-section { width: 100%; height: 100%; display: none; flex-direction: column; }
        .view-visible { display: flex !important; }
        
        /* TOOLTIP GLOBAL */
        .tooltip-container { position: relative; display: inline-flex; }
        .tooltip-text { 
            visibility: hidden; opacity: 0; pointer-events: none;
            width: 200px; background-color: #000; color: #fff; text-align: left; 
            border-radius: 6px; padding: 8px; position: absolute; z-index: 999; 
            bottom: 125%; left: 50%; margin-left: -100px; font-size: 10px; 
            border: 1px solid #333; transition: opacity 0.2s; white-space: normal;
        }
        .tooltip-container:hover .tooltip-text { visibility: visible; opacity: 1; }

        /* ANIMAÇÃO */
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>

    <script>
        var formatarNum = (num) => new Intl.NumberFormat('pt-BR').format(num || 0);
        var parseNumBR = (val) => {
            if (!val) return 0;
            let s = String(val).trim();
            if (s === "" || s === "-") return 0;
            s = s.replace(/\./g, '').replace(',', '.');
            let n = Number(s);
            return isNaN(n) ? 0 : n;
        };

        document.addEventListener('DOMContentLoaded', function() {
            carregarSistema();
            google.script.run.registrarAcessoUsuario();
            try {
                google.script.run.withSuccessHandler(email => { 
                    if(email) document.getElementById('userEmail').innerText = email; 
                }).getEmailUsuario();
            } catch(e) { console.log("Modo local ou erro email"); }
        });

        function carregarSistema() {
            const bar = document.getElementById('loadingBar');
            const msg = document.getElementById('loadingMsg');
            msg.innerText = "Carregando Base PCP...";
            bar.style.width = "20%";

            google.script.run.withSuccessHandler(dadosPCP => {
                window.DADOS_PCP_CACHE = dadosPCP; 
                window.dadosGlobais = dadosPCP || [];
                if(typeof iniciarDashboard === 'function') {
                    try { iniciarDashboard(dadosPCP); } catch(e) { console.warn("Erro Dashboard:", e); }
                }
                bar.style.width = "50%";
                msg.innerText = "Carregando Módulos...";

                let carregados = 0;
                const checkFim = () => {
                    carregados++;
                    if(carregados >= 7) {
                        bar.style.width = "100%";
                        setTimeout(() => { document.getElementById('globalLoading').classList.add('hidden'); }, 500);
                    }
                };

                google.script.run.withSuccessHandler(dadosCK => { if(typeof renderCockpit === 'function') { try { renderCockpit(dadosCK); } catch(e) {} } checkFim(); }).getDadosCockpit();
                google.script.run.withSuccessHandler((dadosPre) => { window.DADOS_PREPROD_CACHE = dadosPre; checkFim(); }).getDadosPreProducao();
                google.script.run.withSuccessHandler((dadosQuali) => { window.DADOS_QUALIDADE_CACHE = dadosQuali; checkFim(); }).withFailureHandler((erro) => { checkFim(); }).getDadosQualidade();
                google.script.run.withSuccessHandler((dadosPPM) => { window.DADOS_PPM_CACHE = dadosPPM; checkFim(); }).withFailureHandler((erro) => { checkFim(); }).getDadosPPM();
                google.script.run.withSuccessHandler((dadosAloc) => { window.DADOS_ALOCACAO_CACHE = dadosAloc; checkFim(); }).withFailureHandler((erro) => { checkFim(); }).getDadosAlocacao();
                google.script.run.withSuccessHandler((dadosChamados) => { window.DADOS_CHAMADOS_CACHE = dadosChamados; checkFim(); }).withFailureHandler((erro) => { checkFim(); }).getDadosChamados();
            }).getDadosDashboard();
                google.script.run.withSuccessHandler((dadosInsp) => { window.DADOS_INSPECOES_CACHE = dadosInsp; checkFim(); }).withFailureHandler((erro) => { checkFim(); }).getDadosInspecaoCDs();
        }

        function navegarView(viewId, btnElement) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('view-visible'));
            document.getElementById(viewId).classList.add('view-visible');
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('menu-active'));
            if(btnElement) btnElement.classList.add('menu-active');
            if(viewId === 'viewPreProd') {
                setTimeout(() => {
                    if(typeof receberDadosPreProd === 'function' && window.DADOS_PREPROD_CACHE) {
                        receberDadosPreProd(window.DADOS_PREPROD_CACHE);
                    } 
                    else if(typeof carregarPreProducao === 'function') {
                        carregarPreProducao();
                    }
                }, 100);
            }
            window.dispatchEvent(new Event('resize'));
        }

        function abrirGrafico(graficoId, btnElement) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('view-visible'));
            document.getElementById('viewDash').classList.add('view-visible');
            document.querySelectorAll('.menu-btn').forEach(b => { b.classList.remove('menu-active'); });
            if(btnElement) btnElement.classList.add('menu-active');
            if(typeof window.alternarAbaDash === 'function') {
                window.alternarAbaDash(graficoId);
            }
        }

        function toggleMenu() {
            var sb = document.getElementById('sidebarMenu');
            if(sb.classList.contains('w-64')) {
                sb.classList.remove('w-64');
                sb.classList.add('w-0');
            } else {
                sb.classList.remove('w-0');
                sb.classList.add('w-64');
            }
            setTimeout(() => window.dispatchEvent(new Event('resize')), 300); 
        }

        function toggleSubmenuMenu(subId, iconId) {
            const sub = document.getElementById(subId);
            const icon = document.getElementById(iconId);
            if (sub.classList.contains('hidden')) {
                sub.classList.remove('hidden');
                sub.classList.add('flex');
                icon.style.transform = 'rotate(180deg)';
            } else {
                sub.classList.add('hidden');
                sub.classList.remove('flex');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        function setLoading(ativo, msg) {
            const el = document.getElementById('globalLoading');
            if(msg) document.getElementById('loadingMsg').innerText = msg;
            if(ativo) el.classList.remove('hidden'); else el.classList.add('hidden');
        }
        
        let toastTimeout;
        function showToast(msg, type = 'success') {
            const box = document.getElementById('toastBox');
            box.classList.remove('hidden');
            document.getElementById('toastTitle').innerText = (type === 'success') ? "Sucesso!" : "Atenção";
            document.getElementById('toastMsg').innerText = msg;
            if(toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => box.classList.add('hidden'), 4000);
        }
        function hideToast() { document.getElementById('toastBox').classList.add('hidden'); }

        window.arredondar = function(valor) {
            if (!valor) return 0;
            if (typeof valor === 'number') return Math.round(valor);
            let textoLimpo = String(valor).replace(/\./g, '').replace(',', '.');
            return Math.round(parseFloat(textoLimpo)) || 0;
        };

        window.formatarBR = function(valor) {
            return window.arredondar(valor).toLocaleString('pt-BR');
        };

        function carregarDataAtualizacao() {
            google.script.run.withSuccessHandler(function(data) {
                let el = document.getElementById('txtDataAtualizacao');
                if(el) el.innerText = data;
            }).getUltimaAtualizacaoPCP();
        }

        document.addEventListener('DOMContentLoaded', function() {
            carregarDataAtualizacao();
            if(typeof recarregarDadosPreProd === 'function') {
                recarregarDadosPreProd('wip', true);
            }
        });
