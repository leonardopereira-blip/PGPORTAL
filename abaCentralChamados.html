<style>
  /* Manual de Marca Arco Educação, pp. 18–20: Poppins e paletas primária/secundária. Escopo exclusivo das novas visões. */
  #ch-central{--ch-navy:#0C2340;--ch-blue:#418EDE;--ch-orange:#FA4616;--ch-indigo:#284081;--ch-sky:#049FEC;--ch-gold:#FCB04E;--ch-coral:#F04E37;--ch-line:#e0e6ed;--ch-muted:#64748b;height:100%;overflow:auto;background:#f3f5f8;color:var(--ch-navy);font:400 13px/1.5 'Poppins',Arial,sans-serif}

  #ch-central h2{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin:0 0 14px;color:var(--ch-navy)}

  #ch-central h3{font-size:13px;font-weight:600;margin:12px 0 7px}
  #ch-central .ch-muted,#ch-central small{color:var(--ch-muted)}
  #ch-central button,#ch-central select,#ch-central input,#ch-central textarea{font-family:inherit}

  #ch-central button:focus-visible,#ch-central select:focus-visible,#ch-central input:focus-visible,#ch-central summary:focus-visible,#ch-central a:focus-visible{outline:2px solid var(--ch-blue);outline-offset:2px}

  #ch-central .ch-primary:hover{background:var(--ch-navy);color:white}
  #ch-central .ch-filter-panel{background:white;border:1px solid var(--ch-line);border-radius:10px;box-shadow:0 2px 8px #0c234009;padding:12px;margin-bottom:16px}

  #ch-central .ch-filter-caption{display:flex;align-items:center;gap:5px;white-space:nowrap;color:#64748b;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
  #ch-central .ch-filter-caption svg{width:14px;height:14px}
  #ch-central label{font-size:11px;font-weight:600;display:grid;gap:4px}
  #ch-central select,#ch-central input,#ch-central textarea{color:var(--ch-navy);background:white;border:1px solid #cdd7e4;border-radius:6px;padding:7px;min-width:0;font-size:12px}
  #ch-central .ch-filterline label{position:relative;display:flex;gap:6px;align-items:center;white-space:nowrap;background:white;border:1px solid #e0e6ed;border-radius:7px;box-shadow:0 2px 5px #0c23400c;padding:5px 8px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.025em;color:var(--ch-navy);min-height:34px}
  #ch-central .ch-filterline label:has(select):hover,#ch-central .ch-filterline label:has(input):hover{border-color:#b0c7e4}
  #ch-central .ch-filterline label:has(select[data-active="true"]),#ch-central .ch-filterline label:has(input[data-active="true"]){background:#eaf2fc;border-color:var(--ch-blue);color:var(--ch-indigo)}
  #ch-central .ch-filterline select{border:0;background:transparent;color:inherit;font-size:11px;font-weight:600;padding:3px 0;max-width:190px;cursor:pointer}
  #ch-central .ch-filterline select option{background:white;color:var(--ch-navy);font-weight:400}
  #ch-central .ch-filterline input{border:0;background:transparent;padding:3px 0;font-size:11px}
  #ch-central .ch-filterline input[type=number]{width:49px}
  #ch-central .ch-filterline input[type=search]{width:clamp(110px,12vw,170px)}
  #ch-central .ch-filterline input[type=date]{width:113px}
  #ch-central .ch-filterline .ch-date-group{border-left:1px solid var(--ch-line);margin:0 2px;height:26px}
  #ch-central .ch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:12px;margin:0 0 16px}
  #ch-central .ch-card,#ch-central .ch-box{border:1px solid var(--ch-line);border-radius:12px;background:white;box-shadow:0 3px 12px #0c234008}
  #ch-central .ch-card{position:relative;overflow:hidden;padding:14px 14px 13px;border-top:3px solid var(--ch-blue);min-width:0}
  #ch-central .ch-card:first-child{border-top-color:var(--ch-indigo)}
  #ch-central .ch-card[data-tone=orange]{border-top-color:var(--ch-orange)}
  #ch-central .ch-card[data-tone=navy]{border-top-color:var(--ch-navy)}
  #ch-central .ch-card[data-tone=green]{border-top-color:#16a34a}
  #ch-central .ch-card[data-tone=yellow]{border-top-color:#d99a14}
  #ch-central .ch-card[data-tone=green] b{color:#16803d}
  #ch-central .ch-card[data-tone=yellow] b{color:#9c650a}
  #ch-central .ch-card[data-tone=orange] b{color:#c43c1a}
  #ch-central .ch-card small{display:block;font-size:10px;font-weight:600;line-height:1.45;min-height:29px;color:#5c7088}
  #ch-central .ch-card b{display:block;font-size:clamp(20px,1.9vw,27px);line-height:1.12;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  #ch-central .ch-box{padding:18px;margin:0 0 16px;min-width:0}
  #ch-central .ch-flex{display:grid;grid-template-columns:minmax(300px,1fr) minmax(460px,1.5fr);gap:16px;align-items:start}
  #ch-central .ch-sub{padding:4px 8px;border-radius:5px;background:#e6effa;color:var(--ch-indigo);font-weight:600}
  #ch-central .ch-link,#ch-central a{color:var(--ch-indigo);font-weight:600;text-decoration:underline;text-underline-offset:3px}
  #ch-central .ch-link:hover{color:var(--ch-orange)}
  #ch-central .ch-frame{overflow-x:auto;border:1px solid #e5eaf1;border-radius:8px}
  #ch-central table{border-collapse:collapse;width:100%;font-size:11px;text-align:left}
  #ch-central th,#ch-central td{padding:9px 10px;border-bottom:1px solid #e8edf3;vertical-align:middle;white-space:nowrap}
  #ch-central th{font-size:10px;font-weight:600;letter-spacing:.025em;text-transform:uppercase;color:var(--ch-indigo);background:#edf3fa}
  #ch-central tbody tr:nth-child(even){background:#f9fbfd}
  #ch-central tbody tr:hover{background:#eaf3fd}
  #ch-central tbody tr:last-child td{border-bottom:0}
  #ch-central .ch-num{font-variant-numeric:tabular-nums;white-space:nowrap}
  #ch-central .ch-funnel{display:flex;flex-direction:column;align-items:center;gap:3px;margin:10px 0 14px}
  #ch-central .ch-portal-layer{min-width:160px;max-width:100%;padding:7px 10px;font-size:11px;font-weight:600;box-sizing:border-box;text-align:center;line-height:1.35;color:white;overflow-wrap:anywhere;border-radius:3px;box-shadow:0 1px 3px #0c23401a}
  #ch-central .ch-status-chip{display:inline-block;white-space:normal;max-width:210px;border-radius:5px;padding:4px 7px;background:#eaf2fc;color:#284081;font-size:10px;font-weight:600;margin:1px}
  #ch-central #ch-parallel{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}#ch-central #ch-parallel .ch-card{padding:10px}#ch-central #ch-parallel .ch-card small{min-height:0}
  #ch-central .ch-funnel-stage{display:grid;grid-template-columns:minmax(118px,0.84fr) minmax(100px,2fr) minmax(104px,.72fr);gap:10px;align-items:center;min-height:30px}
  #ch-central .ch-stage-label{font-size:10px;font-weight:600;color:var(--ch-navy);line-height:1.3}
  #ch-central .ch-stage-label small{font-size:9px;margin-right:5px;color:#64748b}
  #ch-central .ch-stage-track{height:31px;display:flex;align-items:center;justify-content:center;width:100%;position:relative}

  #ch-central .ch-stage-track:has(.ch-stage-shape[style*="width:0%"]):after{content:'—';color:#a8b5c5}
  #ch-central .ch-stage-values{font-size:11px;font-weight:600;text-align:right;color:var(--ch-navy);font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;justify-content:space-between;gap:6px}
  #ch-central .ch-stage-values span{color:#61758d;font-size:10px}
  #ch-central .ch-stage-base .ch-stage-shape{clip-path:polygon(0 0,100% 0,96% 100%,4% 100%);border-radius:6px 6px 0 0}
  #ch-central .ch-stage-base .ch-stage-label,#ch-central .ch-stage-base .ch-stage-values{font-weight:700}
  #ch-central .ch-alert{border-left:3px solid var(--ch-gold);background:#fff5e6;padding:9px 13px;border-radius:5px;margin:8px 0;color:#765018}
  #ch-central .ch-pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:12px 0 0}
  #ch-central button:disabled{opacity:.45;cursor:default}
  #ch-central details{border:1px solid var(--ch-line);border-radius:8px;margin:8px 0;background:white;padding:10px 12px}
  #ch-central summary{cursor:pointer;font-weight:600}
  #ch-central .ch-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 18px}
  #ch-central .ch-fields dt{font-size:10px;color:#64748b}#ch-central .ch-fields dd{margin:0;font-weight:600}
  #ch-central .ch-history{padding-left:18px;list-style:disc}
  #ch-central .ch-note{font-size:10px;line-height:1.6;margin-top:12px;color:#64748b}
  #ch-central .ch-loading{display:flex;align-items:center;gap:8px;padding:14px 0;color:var(--ch-indigo);font-weight:600}
  #ch-central .ch-loading:before{content:'';width:17px;height:17px;border:2px solid #d5e4f5;border-top-color:var(--ch-indigo);border-radius:50%;animation:chSpin .8s linear infinite}
  @keyframes chSpin{to{transform:rotate(360deg)}}
  @media(max-width:1020px){#ch-central .ch-flex{grid-template-columns:1fr}#ch-central .ch-grid{grid-template-columns:repeat(auto-fit,minmax(142px,1fr))}}
  @media(max-width:550px){#ch-central .ch-wrap{padding:12px}#ch-central .ch-stage-funnel{gap:6px}#ch-central .ch-funnel-stage{grid-template-columns:minmax(85px,1fr) minmax(60px,1.2fr) minmax(72px,.7fr);gap:5px}#ch-central .ch-stage-values{display:block}#ch-central .ch-stage-values span{display:block}#ch-central .ch-filter-panel{padding:9px}}
</style>
<section id="ch-central"><div class="ch-wrap">
  <header class="ch-head"><div class="ch-head-main"><span id="ch-title-icon" class="ch-heading-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4z"/><path d="M13 6v3m0 3v1m0 3v2"/></svg></span><div><div class="ch-eyebrow">Produção gráfica · Reentradas</div><h1 id="ch-title">Central de chamados</h1></div></div><div class="ch-tools"><small id="ch-updated"></small><button class="ch-btn" id="ch-refresh"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14-5L3 9m0-5v5h5m-4 4a8 8 0 0 0 14 5l3-3m0 5v-5h-5"/></svg> Recarregar dados</button></div></header>
  <div id="ch-msg" role="status" aria-live="polite"></div>
  <div id="ch-notice" class="ch-alert" hidden></div>

  <div id="ch-list" hidden>
    <div class="ch-filter-panel"><div class="ch-filterline"><span class="ch-filter-caption"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M7 12h10m-7 5h4"/></svg> Filtros:</span><label>Chamado<input id="ch-query" type="search" placeholder="Número do chamado"></label>
      <label>Categoria<select id="ch-cat"></select></label><label>Envio<select id="ch-shipment"></select></label>
      <label>Marca<select id="ch-brand"></select></label><label>Status de produção<select id="ch-production"><option value="">Todos</option></select></label><label>Situação<select id="ch-scope"><option value="ativos">Exceto cancelados</option><option value="abertos">Em aberto</option><option value="concluidos">Concluídos</option><option value="cancelados">Cancelados</option><option value="todos">Todos</option></select></label>
      <button id="ch-clear" class="ch-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 16 10-10 6 6-8 8H8zM10 10l6 6M12 20h8"/></svg> Limpar</button></div>

      <select id="ch-by" aria-label="Agrupar por"><option value="cat">Categoria</option><option value="shipment">Envio</option><option value="brand">Marca</option></select></div><div id="ch-dist"></div></section>
      <section class="ch-box"><h2><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg> Funil de etapas</h2><div id="ch-funnel" class="ch-funnel"></div><small>Produção e logística por chamado, SKU e rota. Custos, OC e mapa solicitado: marcos independentes.</small><div id="ch-parallel" class="ch-grid" style="margin-top:12px"></div></section></div>
    <section class="ch-box"><div class="ch-between"><h2><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 5V3h6v2M9 10h6m-6 4h6m-6 4h4"/></svg> Chamados</h2><small id="ch-count"></small></div><div id="ch-table"></div><div id="ch-pages" class="ch-pager"></div></section>
  </div>
  <div id="ch-detail" hidden></div>
</div></section>
<script>
(function(){
  const root=document.getElementById('ch-central'), el=id=>document.getElementById('ch-'+id);
  const state={view:'carteira',data:null,detail:null,history:[],page:1,itemPage:1,load:0,detailLoad:0,loading:false,pending:null};
  const nf=new Intl.NumberFormat('pt-BR'),num=x=>nf.format(Number(x)||0);
  const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dt=x=>/^\d{4}-\d{2}-\d{2}/.test(x||'')?x.slice(0,10).split('-').reverse().join('/'):'—';
  const stamp=x=>new Date(x).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'});
  const cdLabel=x=>({JDI:'CD JDI',FOR:'CD FOR',CWB:'POSIGRAF',SJR:'RAÍZES',LOV:'KN',RP:'CD RP',CJUN:'CD JDI',CITA:'CD FOR',CCWB:'POSIGRAF',CSJR:'RAÍZES',CLOV:'KN',CRPR:'CD RP',RAIZES:'RAÍZES','TRATTO MANUSEIO':'KN'})[String(x||'').toUpperCase()]||x;
  const opt=(x,label=x)=>'<option value="'+esc(x)+'">'+esc(label)+'</option>';
  const productionCell=t=>(t.production||[]).length?(t.production||[]).map(p=>'<span class="ch-status-chip" title="'+num(p.qty)+' unidades">'+esc(p.label)+'</span>').join(' '):'Atualização da base necessária';
  const cell=x=>x==null||x===''?'—':esc(x);
  const table=(headers,rows,empty='Sem registros vinculados.')=>rows.length?'<div class="ch-frame"><table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'<p class="ch-muted">'+esc(empty)+'</p>';
  const rpc=(name,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));
  const fields=obj=>'<dl class="ch-fields">'+Object.entries(obj).map(([k,v])=>'<div><dt>'+esc(k)+'</dt><dd>'+cell(v)+'</dd></div>').join('')+'</dl>';
  const source=(key,row)=>state.data.links[key] && Number.isInteger(row)?'<a href="'+esc(state.data.links[key]+'&range=A'+row)+'" target="_blank" rel="noopener">Linha '+row+'</a>':'—';
  // CH_OKR_PURE_BEGIN
  const chDays=(a,b)=>a&&b?Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000):null;
  const chAdd=(a,n)=>a?new Date(Date.parse(a+'T00:00:00Z')+n*86400000).toISOString().slice(0,10):'';
  const chPct=(n,d)=>d?100*n/d:null;
  const chBands=[[0,10],[11,20],[21,25],[26,30],[31,40],[41,60],[61,Infinity]];
  const chDimensions=['printer','cd','series','material','feature','cover','finish'];
  function chGroups(t,f){
    return (t.groups||[]).filter(g=>chDimensions.every(k=>!f[k]||(Array.isArray(g[k])?g[k].includes(f[k]):g[k]===f[k])));
  }
  function chFilteredTotals(t,f){
    if(!chDimensions.some(k=>f[k]))return t;
    const groups=chGroups(t,f);if(!groups.length)return null;
    const totals={qty:0,mapped:0,picked:0,delivered:0,balance:0,coverage:t.totals.coverage.map(()=>0)};
    for(const g of groups){
      for(const k of ['qty','mapped','picked','delivered','balance'])totals[k]+=g[k]||0;
      g.coverage.forEach((v,i)=>totals.coverage[i]+=v);
    }
    const by=new Map();groups.forEach(g=>(g.production||[]).forEach(p=>by.set(p.label,(by.get(p.label)||0)+p.qty)));
    return {...t,groups,totals,production:Array.from(by,([label,qty])=>({label,qty})).sort((a,b)=>b.qty-a.qty),eta:groups.map(g=>g.eta).filter(Boolean).sort().pop()||'',partial:groups.some(g=>g.partial)};
  }
  function chAging(t,asof){
    const delivered=t.delivered&&t.delivered<=asof?t.delivered:'';
    const n=chDays(t.created,delivered);return n!==null&&n>=0?n:null;
  }
  function chMatches(t,f,asof){
    if(['cat','shipment','brand'].some(k=>f[k]&&f[k]!==t[k]))return false;
    if(f.openStart&&(!t.created||t.created<f.openStart))return false;
    if(f.openEnd&&(!t.created||t.created>f.openEnd))return false;
    if(chDimensions.some(k=>f[k])&&!chGroups(t,f).length)return false;
    if(f.min!==''&&f.min!=null||f.max!==''&&f.max!=null){
      const age=chAging(t,asof);
      if(age===null||(f.min!==''&&f.min!=null&&age<Number(f.min))||(f.max!==''&&f.max!=null&&age>Number(f.max)))return false;
    }
    return true;
  }
  function chOKR(rows,f){
    const out={cohort:0,den:0,num:0,late:0,pending:0,upcoming:0,missing:0,canceled:0,actual:0,delivery:0,missingActual:0,ages:[],items:[]};
    const inside=v=>!!v&&(!f.start||v>=f.start)&&(!f.end||v<=f.end);
    for(const t of rows){
      if(t.cat!=='REENTRADA'||!chMatches(t,f,f.asof))continue;
      // Não usa a situação de hoje para atribuir cancelamentos futuros.
      if(t.created&&t.created>f.asof)continue;
      const fixed=chAdd(t.created,25);
      let due=f.rule==='fixed'?fixed:f.rule==='desired'?t.desired:f.rule==='pick'?t.pickDue:fixed?[fixed,t.desired].filter(Boolean).sort().pop():'';
      let actual=f.rule==='pick'?t.pickDone:t.closed;
      if(actual&&actual>f.asof)actual='';
      const negative=!!actual&&!!t.created&&actual<t.created;
      if(negative)actual='';
      const canceled=!!(t.canceled&&t.canceled<=f.asof);
      const cancelUnknown=/CANCEL/i.test(t.status||'')&&!t.canceled;
      if(f.basis==='open'?!inside(t.created):due?!inside(due):!!t.created&&!inside(t.created))continue;
      out.cohort++;
      if(canceled||cancelUnknown){out.canceled++;continue;}

  function itemHtml(it){
    return '<p>'+cell(it.desc)+'</p>'+fields({'Status de produção':it.productionStatus?.label,'Tiragem':num(it.qty),'Mapa solicitado':num(it.mapped),'Coletado no mapa':num(it.picked),'Entregue no CD':num(it.delivered),'Saldo':num(Math.max(0,it.qty-it.delivered)),'Previsão de entrega':dt(it.eta)+(it.etaPartial&&it.eta?' · parcial':''),'Origem da previsão':it.forecastSource})+
      '<h3>Etapas do SKU</h3>'+table(['Etapa','Planejado','Realizado','Andamento','Fonte'],it.stages.map((s,i)=>[esc(state.data.phases[i]),dt(s.p),dt(s.r),cell(s.a||(s.r?'Realizado':'Sem registro real')),esc(s.f)]))+
      detailBox('Itens no SPG',table(['Kit','Tiragem','Estoque CD','Subcontratada','OC / NF','Coleta formalizada','Coleta prevista / real','Entrega prevista / real','Origem'],it.spg.map(s=>[cell(s.kit),num(s.q),num(s.stock),num(s.sub),cell(s.oc)+' / '+cell(s.nf),dt(s.formal),dt(s.pickP)+' / '+dt(s.pick),dt(s.deliveryP)+' / '+dt(s.delivery),source('spg',s.row)])))+
      detailBox('Calendário e PCP',table(['Fonte','Kit / OP','Status','Observação','Origem'],it.cal.map(c=>['Calendário',cell(c.kit),cell(c.state),cell(c.note),source('cal',c.row)]).concat(it.pcp.map(p=>['PCP',cell(p.op),'—','—',source('pcp',p.row)]))))+
      '<h3>Mapas de saída</h3>'+table(['Mapa / NF','Kit','Vínculo','Tiragem','Agendamento','Coleta real','Previsão CD','Chegada CD','Qtd. entregue','Origem'],it.maps.map(m=>[cell(m.map)+' / '+cell(m.nf),cell(m.kit),cell(m.method),num(m.qty),dt(m.book),dt(m.pick),dt(m.eta),dt(m.delivery),num(m.delivered),source('map',m.row)]));
  }
  root.addEventListener('toggle',e=>{const d=e.target;if(d.open && d.hasAttribute('data-item') && !d.lastElementChild.childElementCount)d.lastElementChild.innerHTML=itemHtml(state.detail.items[Number(d.dataset.item)]);},true);
  async function save(){
    const ticket=state.detail,st=el('manual-state').value,note=el('note').value.trim(),msg=el('save-msg');
    if(!st){msg.textContent='Selecione o status da tratativa.';return;}
    const base=state.history.at(-1)?.event||'',key=JSON.stringify([ticket.id,st,note,base]);
    if(!state.pending || state.pending.key!==key)state.pending={key,id:crypto.randomUUID()};
    const event=state.pending.id;el('save').disabled=true;msg.textContent='Salvando…';
    try{
      const r=await rpc('salvarTratativaChamadoPortal',ticket.id,st,note,base,event);
      if(state.detail!==ticket)return;
      state.history=r.history;state.pending=null;const last=r.history.at(-1);state.data.manual[ticket.id]=last?.state||'';renderHistory();
      if(r.conflict){msg.textContent='Outra pessoa alterou este chamado. Confira o histórico atualizado e salve novamente se desejar.';}
      else{msg.textContent='Tratativa salva.';el('note').value='';el('manual-state').value=last.state;}
    }catch(err){if(state.detail===ticket)msg.textContent='Falha ao salvar. '+(err.message||err);}finally{if(state.detail===ticket)el('save').disabled=false;}
  }
  root.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.id==='ch-okr-clear'){[...filterKeys.map(k=>'okr-'+k),'okr-brand','okr-shipment'].forEach(k=>el(k).value='');el('okr-scope').value='ativos';renderOKR();return;}
    if(b.id==='ch-refresh'){load(true);return;}if(b.id==='ch-save'){save();return;}
    if(b.id==='ch-back'){state.detailLoad++;state.detail=null;render();show();return;}
    if(b.dataset.ticket){openTicket(b.dataset.ticket);return;}
    if(b.dataset.filter){el(el('by').value).value=b.dataset.filter;state.page=1;render();styleFilters();return;}
    if(b.dataset.page){state.page+=Number(b.dataset.page);render();return;}
    if(b.dataset.itempage){state.itemPage+=Number(b.dataset.itempage);renderItems();return;}
    if(b.id==='ch-clear'){['query','cat','shipment','brand','production',...filterKeys.map(k=>'route-'+k)].forEach(k=>el(k).value='');el('scope').value='ativos';state.page=1;render();styleFilters();}
  });
  el('routefilters').innerHTML=filterMarkup('route-');
  filterKeys.forEach(k=>el('route-'+k).addEventListener('change',()=>{state.page=1;render();}));
  ['cat','brand','shipment','scope','production','by','query'].forEach(k=>el(k).addEventListener(k==='query'?'input':'change',()=>{state.page=1;render();}));
})();
</script>
