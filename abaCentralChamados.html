<style>
  #ch-central{height:100%;overflow:auto;background:#f4f6f8;color:#172937;font:14px/1.45 Inter,Arial,sans-serif}
  #ch-central [hidden]{display:none!important}
  #ch-central .ch-wrap{max-width:1550px;margin:auto;padding:24px clamp(16px,3vw,44px) 44px}
  #ch-central .ch-head,#ch-central .ch-between,#ch-central .ch-actions{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  #ch-central h1{font-size:clamp(24px,3vw,34px);font-weight:750;letter-spacing:-.045em;margin:0}
  #ch-central h2{font-size:19px;font-weight:700;margin:0 0 12px;letter-spacing:-.022em}
  #ch-central h3{font-size:15px;font-weight:700;margin:12px 0 7px}
  #ch-central .ch-muted,#ch-central small{color:#526777}
  #ch-central button,#ch-central select,#ch-central input,#ch-central textarea{font:inherit}
  #ch-central button{cursor:pointer}
  #ch-central button:focus-visible,#ch-central summary:focus-visible,#ch-central a:focus-visible{outline:3px solid #0f938b;outline-offset:2px}
  #ch-central .ch-btn,#ch-central .ch-tabs button{border:1px solid #bdcad4;padding:6px 12px;border-radius:7px;background:#fff;font-weight:600}
  #ch-central .ch-btn:hover,#ch-central .ch-tabs button:hover{background:#edf5f4}
  #ch-central .ch-tabs{display:flex;gap:8px;margin:17px 0}
  #ch-central .ch-tabs button[aria-selected=true],#ch-central .ch-primary{background:#124e51;color:white;border-color:#124e51}
  #ch-central .ch-filters{display:grid;grid-template-columns:1.45fr repeat(4,minmax(105px,1fr)) auto;gap:10px;align-items:end}
  #ch-central label{font-size:12px;font-weight:650;display:grid;gap:3px}
  #ch-central select,#ch-central input,#ch-central textarea{color:#213945;background:white;border:1px solid #bbcbd3;border-radius:6px;padding:7px;min-width:0}
  #ch-central .ch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin:16px 0}
  #ch-central .ch-card,#ch-central .ch-box{border:1px solid #d6e0e5;border-radius:10px;background:white;padding:15px}
  #ch-central .ch-card b{display:block;font-size:23px;font-weight:720;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
  #ch-central .ch-box{margin:13px 0}
  #ch-central .ch-flex{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(340px,1.1fr);gap:12px}
  #ch-central .ch-sub{padding:3px 8px;border-radius:5px;background:#eaf2f1;color:#195d59;font-weight:650}
  #ch-central .ch-link,#ch-central a{color:#155f75;text-decoration:underline;text-underline-offset:2px}
  #ch-central .ch-frame{overflow-x:auto}
  #ch-central table{border-collapse:collapse;width:100%;font-size:12px;text-align:left}
  #ch-central th,#ch-central td{padding:7px 9px;border-bottom:1px solid #e2e9ed;vertical-align:top}
  #ch-central th{font-weight:650;color:#405765;background:#f4f7f9}
  #ch-central .ch-num{font-variant-numeric:tabular-nums;white-space:nowrap}
  #ch-central .ch-bar{background:#e5edef;overflow:hidden;border-radius:3px;height:6px}
  #ch-central .ch-bar i{display:block;height:100%;background:#34817a}
  #ch-central .ch-funnel{display:grid;grid-template-columns:minmax(110px,1.3fr) minmax(60px,1fr) auto;gap:5px 12px;align-items:center;font-size:12px}
  #ch-central .ch-alert{border-left:3px solid #aa671d;background:#fff4de;padding:9px 13px;border-radius:4px;margin:8px 0}
  #ch-central .ch-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  #ch-central .ch-pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:9px 0}
  #ch-central button:disabled{opacity:.45;cursor:default}
  #ch-central details{border:1px solid #d7e1e7;border-radius:7px;margin:7px 0;background:white;padding:8px 10px}
  #ch-central summary{cursor:pointer;font-weight:630}
  #ch-central .ch-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px 16px}
  #ch-central .ch-fields dt{font-size:11px;color:#506875}#ch-central .ch-fields dd{margin:0;font-weight:600}
  #ch-central .ch-history{padding-left:18px;list-style:disc}
  @media(max-width:900px){#ch-central .ch-filters{grid-template-columns:repeat(3,1fr)}#ch-central .ch-flex{grid-template-columns:1fr}}
  @media(max-width:550px){#ch-central .ch-filters{grid-template-columns:1fr 1fr}#ch-central .ch-filters label:first-child{grid-column:1/-1}#ch-central .ch-wrap{padding:14px}}
</style>
<section id="ch-central"><div class="ch-wrap">
  <div class="ch-head"><h1>Central de chamados</h1><div class="ch-tools"><small id="ch-updated"></small><button class="ch-btn" id="ch-refresh">Atualizar bases</button></div></div>
  <nav class="ch-tabs" aria-label="Visões de chamados"><button data-view="carteira" aria-selected="true">Carteira</button><button data-view="okr" aria-selected="false">OKR</button></nav>
  <div id="ch-msg" role="status" aria-live="polite"></div>
  <div id="ch-notice" class="ch-alert" hidden></div>
  <div id="ch-okr" hidden></div>
  <div id="ch-list" hidden>
    <div class="ch-filters"><label>Buscar chamado<input id="ch-query" type="search" placeholder="Número do chamado"></label>
      <label>Categoria<select id="ch-cat"></select></label><label>Envio<select id="ch-shipment"></select></label>
      <label>Marca<select id="ch-brand"></select></label><label>Situação<select id="ch-scope"><option value="ativos">Exceto cancelados</option><option value="abertos">Em aberto</option><option value="concluidos">Concluídos</option><option value="cancelados">Cancelados</option><option value="todos">Todos</option></select></label>
      <button id="ch-clear" class="ch-btn">Limpar</button></div>
    <div id="ch-kpis" class="ch-grid"></div>
    <div class="ch-flex"><section class="ch-box"><div class="ch-between"><h2>Distribuição</h2>
      <select id="ch-by" aria-label="Agrupar por"><option value="cat">Categoria</option><option value="shipment">Envio</option><option value="brand">Marca</option></select></div><div id="ch-dist"></div></section>
      <section class="ch-box"><h2>Funil de etapas</h2><div id="ch-funnel" class="ch-funnel"></div><small>Tiragem com registro em cada etapa. Coleta e entrega usam as quantidades do mapa.</small></section></div>
    <section class="ch-box"><div class="ch-between"><h2>Chamados</h2><small id="ch-count"></small></div><div id="ch-table"></div><div id="ch-pages" class="ch-pager"></div></section>
  </div>
  <div id="ch-detail" hidden></div>
</div></section>
<script>
(function(){
  const root=document.getElementById('ch-central'), el=id=>document.getElementById('ch-'+id);
  const state={view:'carteira',data:null,detail:null,history:[],page:1,itemPage:1,load:0,detailLoad:0,loading:false,pending:null};
  const nf=new Intl.NumberFormat('pt-BR'),num=x=>nf.format(Number(x)||0);
  const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dt=x=>/^\d{4}-\d{2}-\d{2}/.test(x||'')?x.slice(0,10).split('-').reverse().join('/'):'—';
  const stamp=x=>new Date(x).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'});
  const opt=x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>';
  const cell=x=>x==null||x===''?'—':esc(x);
  const table=(headers,rows,empty='Sem registros vinculados.')=>rows.length?'<div class="ch-frame"><table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'<p class="ch-muted">'+esc(empty)+'</p>';
  const rpc=(name,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));
  const fields=obj=>'<dl class="ch-fields">'+Object.entries(obj).map(([k,v])=>'<div><dt>'+esc(k)+'</dt><dd>'+cell(v)+'</dd></div>').join('')+'</dl>';
  const source=(key,row)=>state.data.links[key] && Number.isInteger(row)?'<a href="'+esc(state.data.links[key]+'&range=A'+row)+'" target="_blank" rel="noopener">Linha '+row+'</a>':'—';
  const detailBox=(label,content)=>'<details><summary>'+esc(label)+'</summary>'+content+'</details>';
  function message(s,error){el('msg').textContent=s;el('msg').className=error?'ch-alert':'ch-muted';}
  function show(){
    root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===state.view)));
    el('list').hidden=state.view!=='carteira'||!!state.detail||!state.data;
    el('detail').hidden=state.view!=='carteira'||!state.detail;
    el('okr').hidden=state.view!=='okr';
    if(state.view==='okr')renderOKR();
  }
  function renderOKR(){
    el('okr').innerHTML='<section class="ch-box"><h2>OKR dos chamados</h2><p class="ch-muted">Indicadores e critérios de apuração aguardando a definição da liderança.</p></section>';
  }
  async function load(force){
    if(state.loading)return;
    state.loading=true;el('refresh').disabled=true;const token=++state.load;
    message('Carregando chamados e conferindo as fontes…');
    try{
      const d=await rpc('getChamadosPortal',!!force);if(token!==state.load)return;
      state.data=d;state.detail=null;state.detailLoad++;state.page=1;
      for(const key of ['cat','shipment','brand']){
        const old=el(key).value,options=[...new Set(d.rows.map(r=>r[key]).filter(Boolean))].sort();
        el(key).innerHTML='<option value="">Todos</option>'+options.map(opt).join('');
        if(options.includes(old))el(key).value=old;
      }
      el('updated').textContent='Leitura em '+stamp(d.now);el('notice').textContent=d.notice||'';el('notice').hidden=!d.notice;message('');render();show();
    }catch(err){message('Falha ao atualizar. '+(err.message||err),true);}finally{state.loading=false;el('refresh').disabled=false;}
  }
  window.pgAbrirChamados=function(view){state.view=view;show();if(!state.data && !state.loading && view!=='okr')load(false);};
  function selected(){
    const q=el('query').value.trim().replace(/^#/,'').split(/[^0-9]+/).filter(Boolean),scope=el('scope').value;
    return state.data.rows.filter(t=>{
      const canceled=/CANCEL/.test(t.status), closed=/CONCLU/.test(t.status);
      return (scope==='todos'||(scope==='cancelados'?canceled:scope==='concluidos'?closed:scope==='abertos'?!canceled&&!closed:!canceled))
        && ['cat','shipment','brand'].every(k=>!el(k).value||el(k).value===t[k])
        && (!el('query').value.trim() || (q.length===1?String(t.n).includes(q[0]):q.includes(String(t.n))));
    }).sort((a,b)=>Number(b.n)-Number(a.n));
  }
  function pager(where,page,n,size,type){
    const max=Math.max(1,Math.ceil(n/size));
    where.innerHTML='<button class="ch-btn" data-'+type+'="-1" '+(page<=1?'disabled':'')+'>Anterior</button><small>'+page+' / '+max+'</small><button class="ch-btn" data-'+type+'="1" '+(page>=max?'disabled':'')+'>Próxima</button>';
  }
  function render(){
    if(!state.data)return;
    const rows=selected(),total=k=>rows.reduce((s,r)=>s+r.totals[k],0),by=el('by').value;
    el('kpis').innerHTML=[['Chamados',rows.length],['Tiragem',total('qty')],['Mapa solicitado',total('mapped')],['Coletado no mapa',total('picked')],['Entregue no CD',total('delivered')],['Saldo a entregar',total('balance')]].map(([k,v])=>'<div class="ch-card"><small>'+esc(k)+'</small><b>'+num(v)+'</b></div>').join('');
    const groups=new Map();rows.forEach(t=>{const k=t[by]||'Sem informação',g=groups.get(k)||[0,0,0];g[0]++;g[1]+=t.totals.qty;g[2]+=t.totals.balance;groups.set(k,g);});
    el('dist').innerHTML=table([el('by').selectedOptions[0].text,'Chamados','Tiragem','Saldo'],[...groups].sort((a,b)=>b[1][2]-a[1][2]).map(([k,g])=>['<button class="ch-link" data-filter="'+esc(k)+'">'+esc(k)+'</button>',...g.map(num)]));
    el('funnel').innerHTML=state.data.phases.map((label,i)=>{const v=rows.reduce((s,t)=>s+t.totals.coverage[i],0),qty=total('qty'),pct=qty?100*v/qty:0;return '<span>'+esc(label)+'</span><div class="ch-bar"><i style="width:'+pct+'%"></i></div><span class="ch-num">'+num(v)+' · '+num(Math.round(pct))+'%</span>';}).join('');
    el('table').innerHTML=table(['Chamado','Categoria','Envio','Marca','Status SPG','Tratativa','Meta de entrega','Previsão vigente','Saldo','Conferir'],rows.slice((state.page-1)*30,state.page*30).map(t=>[
      '<button class="ch-link" data-ticket="'+esc(t.id)+'">#'+esc(t.n)+'</button>',cell(t.cat),cell(t.shipment),cell(t.brand),cell(t.status),cell(state.data.manual[t.id]),dt(t.goal),dt(t.eta)+(t.partial&&t.eta?' · parcial':''),num(t.totals.balance),num(t.issues)]),'Nenhum chamado corresponde aos filtros.');
    el('count').textContent=num(rows.length)+' chamados';pager(el('pages'),state.page,rows.length,30,'page');
  }
  async function openTicket(id){
    const seq=++state.detailLoad;message('Carregando o histórico do chamado…');
    try{const res=await rpc('getDetalheChamadoPortal',id,state.data.gen);if(seq!==state.detailLoad)return;
      state.detail=res.ticket;state.history=res.history;state.itemPage=1;state.pending=null;message('');renderDetail();show();root.scrollTop=0;
    }catch(e){if(seq===state.detailLoad)message(e.message||String(e),true);}
  }
  function renderDetail(){
    const t=state.detail;
    el('detail').innerHTML='<button class="ch-link" id="ch-back">Voltar à carteira</button><section class="ch-box"><div class="ch-between"><h2>Chamado #'+esc(t.n)+'</h2><span class="ch-sub">'+cell(t.status)+'</span></div>'+fields({'Categoria':t.cat,'Envio':t.shipment,'Marca':t.brand,'Prioridade SPG':t.priority,'Responsável PG':t.owner,'OP':t.op,'Data desejada':dt(t.desired),'Meta de entrega':dt(t.goal)})+'<h3>Solicitação</h3><p>'+cell(t.why)+'</p>'+(t.obs?'<p>'+esc(t.obs)+'</p>':'')+(t.reason?'<p>Cancelamento · '+esc(t.reason)+'</p>':'')+(t.issues.length?'<p class="ch-alert">'+t.issues.map(esc).join('<br>')+'</p>':'')+'</section>'+
      '<section class="ch-box"><h2>Tratativa do time</h2><div class="ch-tools"><label>Status da tratativa<select id="ch-manual-state"><option value="">Selecionar</option>'+state.data.states.map(opt).join('')+'</select></label><label style="flex:1;min-width:200px">Observação opcional<input id="ch-note" maxlength="1500"></label><button id="ch-save" class="ch-btn ch-primary">Salvar</button></div><p id="ch-save-msg" role="status"></p><div id="ch-history"></div></section>'+
      '<section class="ch-box"><h2>Marcos do chamado</h2>'+table(['Etapa','Planejado','Realizado','Fonte'],Object.entries(t.steps).map(([k,s])=>[esc(k),dt(s.p),dt(s.r),'SPG']))+
      detailBox('Registros do painel de produção ('+t.panel.length+')',table(['Gráfica / CD','Status','Andamento','Início plan. / real','Fim plan. / real','Origem'],t.panel.map(p=>[cell(p.printer)+' / '+cell(p.cd),cell(p.status),cell(p.note),dt(p.startP)+' / '+dt(p.startR),dt(p.endP)+' / '+dt(p.endR),source('panel',p.row)])))+'</section>'+
      '<section class="ch-box"><h2>Validação de custos e ordens de compra</h2>'+detailBox('Validação de custos · '+t.costs.length+' linhas de SKU',table(['Lote','SKU','Gráfica / CD','Tiragem','Valor','Status','Fim','Enviado a Pós','OC','Origem'],t.costs.map(c=>[cell(c.lot),cell(c.sku),cell(c.printer)+' / '+cell(c.cd),cell(c.qty),cell(c.value),cell(c.status),dt(c.date),dt(c.sent),cell(c.oc),source('cost',c.row)])))+
      detailBox('Solicitações de OC · '+t.orders.length+' registros',table(['Sistema','Requisição','OC','OC triangulação','Fornecedor / CD','Status / aprovação','Valor','Abertura / envio','Vínculo','Origem'],t.orders.map(o=>[cell(o.system),cell(o.req),cell(o.oc),cell(o.tri),cell(o.printer)+' / '+cell(o.cd),cell(o.status)+' / '+cell(o.approval),cell(o.value),dt(o.opened)+' / '+dt(o.sent),cell(o.method),source('oc',o.row)])))+'</section>'+
      '<section class="ch-box"><h2>Itens e rotas</h2><div id="ch-items"></div><div id="ch-itempages" class="ch-pager"></div></section>'+
      (t.alerts.length?'<section class="ch-box"><h2>Vínculos a conferir</h2>'+table(['Motivo','SKU','Mapa / OC','Origem'],t.alerts.map(a=>[cell(a.text),cell(a.sku),cell(a.map),source(a.src,a.row)]))+'</section>':'');
    const last=state.history.at(-1);el('manual-state').value=last?last.state:'';renderHistory();renderItems();
  }
  function renderHistory(){
    el('history').innerHTML=detailBox('Histórico de alterações ('+state.history.length+')',table(['Data','Quem alterou','Status','Observação'],state.history.slice().reverse().map(h=>[esc(stamp(h.at)),cell(h.user),cell(h.state),cell(h.note)])));
  }
  function renderItems(){
    const its=state.detail.items,base=(state.itemPage-1)*25;
    el('items').innerHTML=its.slice(base,base+25).map((it,i)=>'<details data-item="'+(base+i)+'"><summary>'+cell(it.sku)+' · '+cell(it.printer)+' → '+cell(it.cd)+' · '+num(it.qty)+' un. · saldo '+num(Math.max(0,it.qty-it.delivered))+'</summary><div></div></details>').join('');pager(el('itempages'),state.itemPage,its.length,25,'itempage');
  }
  function itemHtml(it){
    return '<p>'+cell(it.desc)+'</p>'+fields({'Tiragem':num(it.qty),'Mapa solicitado':num(it.mapped),'Coletado no mapa':num(it.picked),'Entregue no CD':num(it.delivered),'Saldo':num(Math.max(0,it.qty-it.delivered)),'Previsão de entrega':dt(it.eta)+(it.etaPartial&&it.eta?' · parcial':''),'Origem da previsão':it.forecastSource})+
      '<h3>Etapas do SKU</h3>'+table(['Etapa','Planejado','Realizado','Andamento','Fonte'],it.stages.map((s,i)=>[esc(state.data.phases[i]),dt(s.p),dt(s.r),cell(s.a||(s.r?'Realizado':'Sem registro real')),esc(s.f)]))+
      detailBox('Itens no SPG',table(['Kit','Tiragem','Estoque CD','Subcontratada','OC / NF','Coleta formalizada','Coleta prevista / real','Entrega prevista / real','Origem'],it.spg.map(s=>[cell(s.kit),num(s.q),num(s.stock),num(s.sub),cell(s.oc)+' / '+cell(s.nf),dt(s.formal),dt(s.pickP)+' / '+dt(s.pick),dt(s.deliveryP)+' / '+dt(s.delivery),source('spg',s.row)])))+
      detailBox('Calendário e PCP',table(['Fonte','Kit / OP','Status','Observação','Origem'],it.cal.map(c=>['Calendário',cell(c.kit),cell(c.state),cell(c.note),source('cal',c.row)]).concat(it.pcp.map(p=>['PCP',cell(p.op),'—','—',source('pcp',p.row)]))))+
      '<h3>Mapas de saída</h3>'+table(['Mapa / NF','Kit','Vínculo','Tiragem','Agendamento','Coleta real','Previsão CD','Chegada CD','Qtd. entregue','Origem'],it.maps.map(m=>[cell(m.map)+' / '+cell(m.nf),cell(m.kit),cell(m.method),num(m.qty),dt(m.book),dt(m.pick),dt(m.eta),dt(m.delivery),num(m.delivered),source('map',m.row)]));
  }
  root.addEventListener('toggle',e=>{const d=e.target;if(d.open && d.hasAttribute('data-item') && !d.lastElementChild.childElementCount)d.lastElementChild.innerHTML=itemHtml(state.detail.items[Number(d.dataset.item)]);},true);
  async function save(){
    const ticket=state.detail,st=el('manual-state').value,note=el('note').value.trim(),msg=el('save-msg');
    if(!st){msg.textContent='Selecione o status da tratativa.';return;}
    const base=state.history.at(-1)?.event||'',key=JSON.stringify([ticket.id,st,note,base]);
    if(!state.pending || state.pending.key!==key)state.pending={key,id:crypto.randomUUID()};
    const event=state.pending.id;el('save').disabled=true;msg.textContent='Salvando…';
    try{
      const r=await rpc('salvarTratativaChamadoPortal',ticket.id,st,note,base,event);
      if(state.detail!==ticket)return;
      state.history=r.history;state.pending=null;const last=r.history.at(-1);state.data.manual[ticket.id]=last?.state||'';renderHistory();
      if(r.conflict){msg.textContent='Outra pessoa alterou este chamado. Confira o histórico atualizado e salve novamente se desejar.';}
      else{msg.textContent='Tratativa salva.';el('note').value='';el('manual-state').value=last.state;}
    }catch(err){if(state.detail===ticket)msg.textContent='Falha ao salvar. '+(err.message||err);}finally{if(state.detail===ticket)el('save').disabled=false;}
  }
  root.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.view){window.pgAbrirChamados(b.dataset.view);return;}
    if(b.id==='ch-refresh'){load(true);return;}if(b.id==='ch-save'){save();return;}
    if(b.id==='ch-back'){state.detailLoad++;state.detail=null;render();show();return;}
    if(b.dataset.ticket){openTicket(b.dataset.ticket);return;}
    if(b.dataset.filter){el(el('by').value).value=b.dataset.filter;state.page=1;render();return;}
    if(b.dataset.page){state.page+=Number(b.dataset.page);render();return;}
    if(b.dataset.itempage){state.itemPage+=Number(b.dataset.itempage);renderItems();return;}
    if(b.id==='ch-clear'){['query','cat','shipment','brand'].forEach(k=>el(k).value='');el('scope').value='ativos';state.page=1;render();}
  });
  ['cat','brand','shipment','scope','by','query'].forEach(k=>el(k).addEventListener(k==='query'?'input':'change',()=>{state.page=1;render();}));
})();
</script>
