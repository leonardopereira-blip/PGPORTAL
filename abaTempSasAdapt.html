<div id="abaTempSasAdapt" class="aba-conteudo hidden h-full flex flex-col">
  <div class="bg-white border-b border-slate-200 p-4 flex-shrink-0">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <h2 class="text-xl font-black text-slate-800">TEMP SAS ADAPT</h2>
      <button type="button" onclick="window.pgCarregarTempSasAdapt(true)"
        class="bg-slate-800 text-white hover:bg-slate-700 rounded-lg px-4 py-2 text-xs font-bold">Atualizar visão</button>
    </div>
  </div>
  <div class="flex-1 overflow-y-auto scroller bg-neutral-100 p-4 space-y-4">
    <p id="statusTempSasAdapt" role="status" class="text-xs text-slate-600">Aguardando atualização.</p>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4">
        <p class="text-[11px] font-bold uppercase text-slate-500">Saiu das gráficas</p>
        <p id="pgTempSaiuPct" class="text-2xl font-black text-blue-700 mt-2">—</p>
        <p id="pgTempSaiuVolume" class="text-xs text-slate-500 mt-1"></p>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4">
        <p class="text-[11px] font-bold uppercase text-slate-500">PCP Athos · Programado</p>
        <p id="pgTempAthosProgramado" class="text-2xl font-black text-slate-800 mt-2">—</p>
        <p id="pgTempAthosRecebido" class="text-xs text-slate-500 mt-1"></p>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4">
        <p class="text-[11px] font-bold uppercase text-slate-500">Coletado Athos</p>
        <p id="pgTempColetadoPct" class="text-2xl font-black text-emerald-700 mt-2">—</p>
        <p id="pgTempColetadoVolume" class="text-xs text-slate-500 mt-1"></p>
      </div>
    </div>
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
      <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4">
        <div class="flex flex-wrap justify-between items-center gap-2">
          <h3 class="text-sm font-black text-slate-800">Expedições das gráficas</h3>
          <button type="button" onclick="window.pgExportarTempSasAdapt('graficas')"
            class="rounded border border-slate-300 px-3 py-2 text-xs font-bold hover:bg-slate-50">Baixar CSV</button>
        </div>
        <div class="overflow-x-auto mt-3">
          <table class="w-full text-xs whitespace-nowrap"><thead class="text-slate-500 bg-slate-50"><tr>
            <th class="p-2 text-left">Gráfica</th><th class="p-2 text-right">Total</th>
            <th class="p-2 text-right">Saiu</th><th class="p-2 text-right">%</th>
          </tr></thead><tbody id="pgTempTabelaGraficas"></tbody></table>
        </div>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4">
        <div class="flex flex-wrap justify-between items-center gap-2">
          <h3 class="text-sm font-black text-slate-800">Expedições Athos · CD</h3>
          <button type="button" onclick="window.pgExportarTempSasAdapt('expedicoesAthos')"
            class="rounded border border-slate-300 px-3 py-2 text-xs font-bold hover:bg-slate-50">Baixar CSV</button>
        </div>
        <div class="overflow-x-auto mt-3">
          <table class="w-full text-xs whitespace-nowrap"><thead class="text-slate-500 bg-slate-50"><tr>
            <th class="p-2 text-left">CD destino</th><th class="p-2 text-right">Total</th>
            <th class="p-2 text-right">Coletado</th><th class="p-2 text-right">%</th>
          </tr></thead><tbody id="pgTempTabelaExpedicoesAthos"></tbody></table>
        </div>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4 xl:col-span-2">
        <div class="flex flex-wrap justify-between items-center gap-2">
          <h3 class="text-sm font-black text-slate-800">Athos · SKUs</h3>
          <button type="button" onclick="window.pgExportarTempSasAdapt('athos')"
            class="rounded border border-slate-300 px-3 py-2 text-xs font-bold hover:bg-slate-50">Baixar CSV</button>
        </div>
        <div class="flex flex-wrap items-center justify-between gap-2 mt-3 mb-2">
          <input id="pgTempFiltroSku" type="search" aria-label="Filtrar SKU" placeholder="Filtrar SKU"
            oninput="window.pgFiltrarTempSasAdapt()" class="rounded border border-slate-300 px-3 py-2 text-xs">
          <p id="pgTempQtdSku" class="text-[11px] text-slate-500"></p>
        </div>
        <div class="overflow-auto max-h-[460px]">
          <table class="w-full text-xs whitespace-nowrap">
            <thead class="sticky top-0 bg-slate-100 text-slate-600"><tr>
              <th class="p-2 text-left">SKU</th><th class="p-2 text-right">Programado</th>
              <th class="p-2 text-right">Recebido</th><th class="p-2 text-right">Coletado</th>
              <th class="p-2 text-right">% coletado</th>
            </tr></thead><tbody id="pgTempTabelaAthos"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var ultimo = null, carregando = false;
  function el(id) { return document.getElementById(id); }
  function fmt(v) { return Math.round(Number(v) || 0).toLocaleString('pt-BR'); }
  function pct(v, t) { return t > 0 ? ((Number(v) || 0) * 100 / t).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + '%' : '—'; }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function graficas(linhas) {
    el('pgTempTabelaGraficas').innerHTML = linhas.map(function(l) {
      return '<tr class="border-t border-slate-100"><td class="p-2 text-slate-700">' + esc(l.nome) +
        '</td><td class="p-2 text-right tabular-nums">' + fmt(l.total) +
        '</td><td class="p-2 text-right font-bold tabular-nums">' + fmt(l.saiu) +
        '</td><td class="p-2 text-right text-slate-500 tabular-nums">' + pct(l.saiu, l.total) + '</td></tr>';
    }).join('') || '<tr><td colspan="4" class="p-4 text-center text-slate-500">Nenhum registro encontrado</td></tr>';
  }
  function expedicoesAthos(linhas) {
    el('pgTempTabelaExpedicoesAthos').innerHTML = (linhas || []).map(function(l) {
      return '<tr class="border-t border-slate-100"><td class="p-2 text-slate-700">' + esc(l.destino) +
        '</td><td class="p-2 text-right tabular-nums">' + fmt(l.total) +
        '</td><td class="p-2 text-right font-bold tabular-nums">' + fmt(l.coletado) +
        '</td><td class="p-2 text-right text-slate-500 tabular-nums">' + pct(l.coletado, l.total) + '</td></tr>';
    }).join('') || '<tr><td colspan="4" class="p-4 text-center text-slate-500">Nenhum registro encontrado</td></tr>';
  }
  window.pgFiltrarTempSasAdapt = function() {
    if (!ultimo) return;
    var busca = (el('pgTempFiltroSku').value || '').trim().toUpperCase();
    var filtradas = (ultimo.athosPorSku || []).filter(function(s) {
      return !busca || String(s.sku).toUpperCase().indexOf(busca) >= 0;
    });
    el('pgTempQtdSku').textContent = filtradas.length + ' SKUs';
    el('pgTempTabelaAthos').innerHTML = filtradas.map(function(s) {
      return '<tr class="border-t border-slate-100 hover:bg-slate-50">' +
        '<td class="p-2 font-semibold">' + esc(s.sku) + '</td>' +
        '<td class="p-2 text-right tabular-nums">' + fmt(s.total) + '</td>' +
        '<td class="p-2 text-right tabular-nums">' + fmt(s.recebido) + '</td>' +
        '<td class="p-2 text-right tabular-nums">' + fmt(s.coletado) + '</td>' +
        '<td class="p-2 text-right tabular-nums">' + pct(s.coletado, s.total) + '</td></tr>';
    }).join('') || '<tr><td colspan="5" class="p-5 text-center text-slate-500">Sem SKUs para o filtro</td></tr>';
  };
  function csvValor(valor) {
    var texto = String(valor == null ? '' : valor);
    if (/^[=+\-@]/.test(texto) && !/^[+-]?\d+(?:[.,]\d+)?$/.test(texto)) texto = "'" + texto;
    return '"' + texto.replace(/"/g, '""') + '"';
  }
  window.pgExportarTempSasAdapt = function(tipo) {
    if (!ultimo) { alert('Atualize a visão antes de baixar.'); return; }
    var definicoes = {
      graficas: {nome:'SAS_ADAPT_GRAFICAS', colunas:['fonte','linha','id','sku','grafica','destino','rawUnit','envio','caracteristica','total','tiragemRaw','saiuBruto','saiuReconhecido','operacao','totalOperacao','saiuBrutoOperacao','excedenteOperacao','linhasAgrupadas','dataColeta','dataColetaRaw','entregaTP','entregaTPRaw'], linhas:ultimo.linhasGraficas},
      athos: {nome:'SAS_ADAPT_ATHOS', colunas:['fonte','linha','id','sku','grafica','destino','rawUnit','envio','caracteristica','total','recebidoRaw','recebido','recebidoReconhecido','linhasAgrupadas','recebimentoDivergente','dataAcabamento','dataAcabamentoRaw','dataFinalizacao','dataFinalizacaoRaw','statusFinalizacao','produzido','producaoApontada','saidaMapa','codigosMapa'], linhas:ultimo.linhasAthos},
      expedicoesAthos: {nome:'SAS_ADAPT_EXPEDICOES_ATHOS', colunas:['fonte','linha','sku','destino','total','saidaMapa','codigosMapa'], linhas:ultimo.linhasAthos}
    };
    var spec = definicoes[tipo];
    if (!spec || !spec.linhas) return;
    var cabecalho = {
      fonte:'FONTE',linha:'LINHA NA FONTE',id:'ID',sku:'SKU',grafica:'GRÁFICA',destino:'CD DESTINO',
      rawUnit:'UNIDADE ORIGINAL',envio:'ENVIO',caracteristica:'CARACTERÍSTICA DA SOLICITAÇÃO',
      total:tipo === 'graficas' ? 'TIRAGEM TOTAL' : 'TIRAGEM A ENTREGAR (total por CD)',
      tiragemRaw:'TIRAGEM ORIGINAL',saiuBruto:'COLETADO INFORMADO',saiuReconhecido:'COLETADO RECONHECIDO (uma vez por operação)',
      operacao:'OPERAÇÃO',totalOperacao:'TOTAL DA OPERAÇÃO',saiuBrutoOperacao:'COLETADO DA OPERAÇÃO',
      excedenteOperacao:'EXCEDENTE DA OPERAÇÃO',linhasAgrupadas:'LINHAS AGRUPADAS NA FONTE',
      dataColeta:'DATA COLETA',dataColetaRaw:'DATA COLETA ORIGINAL',entregaTP:'ENTREGA TP',entregaTPRaw:'ENTREGA TP ORIGINAL',
      recebidoRaw:'RECEBIDO INFORMADO (Total SKU)',recebido:'RECEBIDO SEM DUPLICIDADE (uma vez por SKU)',
      recebidoReconhecido:'RECEBIDO RECONHECIDO (uma vez por SKU)',recebimentoDivergente:'RECEBIMENTOS DIVERGENTES',
      dataAcabamento:'ACABAMENTO FINAL REAL',dataAcabamentoRaw:'ACABAMENTO FINAL REAL ORIGINAL',
      dataFinalizacao:'FINALIZAÇÃO ATHOS',dataFinalizacaoRaw:'FINALIZAÇÃO ATHOS ORIGINAL',statusFinalizacao:'STATUS FINALIZAÇÃO',
      produzido:'PRODUZIDO COMPROVADO',producaoApontada:'FINALIZAÇÃO COMPROVADA',saidaMapa:'COLETADO ATHOS → CD NO MAPA',codigosMapa:'CÓDIGOS DOS MAPAS'
    };
    var linhas = [spec.colunas.map(function(k) { return csvValor(cabecalho[k] || k); }).join(';')];
    spec.linhas.forEach(function(r) {
      linhas.push(spec.colunas.map(function(k) { return csvValor(r[k]); }).join(';'));
    });
    var blob = new Blob(['\uFEFF' + linhas.join('\r\n')], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url;
    a.download = spec.nome + '_' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  };
  function mostrar(d) {
    ultimo = d;
    el('pgTempSaiuPct').textContent = pct(d.saiuGraficas, d.pcpTotal);
    el('pgTempSaiuVolume').textContent = fmt(d.saiuGraficas) + ' de ' + fmt(d.pcpTotal);
    el('pgTempAthosProgramado').textContent = fmt(d.totalAthos);
    el('pgTempAthosRecebido').textContent = 'Recebido: ' + fmt(d.recebidoAthos);
    el('pgTempColetadoPct').textContent = pct(d.coletadoAthos, d.totalAthos);
    el('pgTempColetadoVolume').textContent = fmt(d.coletadoAthos) + ' de ' + fmt(d.totalAthos);
    graficas(d.graficas);
    expedicoesAthos(d.expedicoesAthos);
    window.pgFiltrarTempSasAdapt();
    var data = d.atualizadoEm ? new Date(d.atualizadoEm) : null;
    el('statusTempSasAdapt').textContent = data && !isNaN(data.getTime()) ? 'Atualizado em ' + data.toLocaleString('pt-BR', {timeZone:'America/Sao_Paulo'}) : 'Atualizado.';
  }
  window.pgCarregarTempSasAdapt = function(forcar) {
    if (carregando) return;
    if (ultimo && !forcar) { mostrar(ultimo); return; }
    carregando = true;
    el('statusTempSasAdapt').textContent = 'Carregando…';
    google.script.run.withSuccessHandler(function(d) {
      carregando = false;
      if (!d || typeof d.pcpTotal !== 'number' || typeof d.totalAthos !== 'number' ||
          !Array.isArray(d.graficas) || !Array.isArray(d.expedicoesAthos) ||
          typeof d.coletadoAthos !== 'number' || !Array.isArray(d.athosPorSku)) {
        el('statusTempSasAdapt').textContent = 'Não foi possível carregar. Tente atualizar a visão.';
        return;
      }
      mostrar(d);
    }).withFailureHandler(function(e) {
      carregando = false;
      el('statusTempSasAdapt').textContent = 'Erro ao atualizar: ' + (e && e.message ? e.message : String(e));
    }).getTempSasAdapt();
  };
})();
</script>
