<script>
// Apuração exclusiva da avaliação por analista. Recebe as parcelas conciliadas
// da Meta Armazém e não altera suas linhas, seus filtros ou suas previsões.
(function () {
  'use strict';
  var CAMPOS = ['total','entregue','noPrazo','foraPrazo','pendente','vencido',
    'aVencer','semPrazo','naoApurado','metaVencida','noPrazoVencido','foraPrazoVencido','linhas'];
  var BASELINE = 'COLETA/INTERNALIZAÇÃO FIM BASELINE';
  var REPLAN = 'Coleta/Internalização de estoque final (re) plan';

  // Somente campos reais e de prazo já existentes no funil. Etapas sem prazo
  // próprio permanecem sem nota em vez de herdar indevidamente a Meta Armazém.
  var ETAPAS = [
    {id:'coleta',nome:'Coleta',tipo:'tp'},
    {id:'coleta_matriz',nome:'Coleta + Matriz',tipo:'tp'},
    {id:'entrega',nome:'Entrega',tipo:'tp'},
    {id:'env',nome:'Envio de arquivo',plano:'ENV ARQUIVO PLAN',base:'ENV ARQUIVO PLAN',real:'ENV ARQUIVO REAL',pcp:true},
    {id:'rec',nome:'Recebimento do boneco',plano:'REC BONECO PLAN',base:'REC BONECO PLAN',real:'REC BONECO REAL',pcp:true},
    {id:'apv',nome:'Aprovação do boneco',plano:'APV BONECO PLAN',base:'APV BONECO PLAN',real:'APV BONECO REAL',pcp:true},
    {id:'imp',nome:'Impressão',plano:'Impressão Final (re) plan',base:'IMPRESSÃO FIM BASELINE',real:'Impressão Final Real.',realAlt:'Impressão Final Real',pcp:true},
    {id:'cus',nome:'Validação de custo',plano:'Validação de Custo final (re) plan',base:'Validação de Custo  FIM BASELINE',real:'Validação de Custo Final Real',pcp:true},
    {id:'oc',nome:'Ordem de compra',plano:'OC final (re) plan',base:'OC FIM BASELINE',real:'OC Final Real',pcp:true},
    {id:'tra',nome:'Transferência à acabadora',plano:'Coleta/Internalização de estoque final (re) plan',base:'COLETA/INTERNALIZAÇÃO FIM BASELINE',real:'Coleta/Internalização de estoque Final Real',origemAcab:true},
    {id:'rec_acab',nome:'Recebimento na acabadora',plano:'Recebimento de material final plan',real:'Recebimento de material final real',acab:true},
    {id:'acab',nome:'Acabamento',plano:'Acbto Final (re) plan',base:'ACABAMENTO FIM BASELINE',real:'Acbto Final Real'},
    {id:'kit',nome:'Formação de kit',plano:'Formação de kit/Encaixotamento Final (re) plan',base:'FORM DE KIT/ENCAIXOTAMENTO FIM BASELINE',real:'Formação de kit/Encaixotamento Final Real'},
    {id:'col_pcp',nome:'Coleta PCP',plano:'Coleta/Internalização de estoque final (re) plan',base:'COLETA/INTERNALIZAÇÃO FIM BASELINE',real:'Coleta/Internalização de estoque Final Real',pcp:true},
    {id:'ent_cd',nome:'Confirmação CD',plano:'META_PCP_POS',base:'META_PCP_POS',real:'_DT_ENTREGUE_CD_REAL',vol:'TIRAGEM CONFIRMADA CD'},
    {id:'int_cd',nome:'Internalização CD',real:'Data Internalizado',vol:'# Tiragem Internalizada'}
  ];
  window.pgRAEtapas = ETAPAS.map(function(e){return {id:e.id,nome:e.nome};});
  function definicaoEtapa(id) {return ETAPAS.find(function(e){return e.id===id;});}
  function valorFase(l,c,alternativo) {
    return data(campo(l,c)) || (alternativo?data(campo(l,alternativo)):null);
  }
  function correspondeEtapa(item,e) {
    if(!e || e.tipo==='tp') return true;
    // Confirmação e internalização pertencem ao CD, nunca à entrada na acabadora.
    if((e.id==='ent_cd'||e.id==='int_cd')&&item.fluxo==='acabadora'&&item.trajeto==='entrada')return false;
    var linhas=linhasOrigem(item);
    if(e.pcp && linhas.every(fonteAcabadora))return false;
    if(e.acab && linhas.every(function(l){return !fonteAcabadora(l);} ))return false;
    if(e.origemAcab && linhas.every(function(l){return !entraAcabadora(l);} ))return false;
    if(typeof window.pgLinhaNaVisaoDaFase === 'function') {
      var faseId=e.id==='col_pcp'?'col':e.id;
      // A fonte da fase é apenas um filtro de aplicabilidade; não altera a base.
      if(linhas.every(function(l){return !window.pgLinhaNaVisaoDaFase(l,faseId);}))return false;
    }
    return true;
  }
  function eventosMarco(item,e,corte) {
    var linhas=linhasOrigem(item),datas=linhas.map(function(l){return valorFase(l,e.real,e.realAlt);});
    if(e.vol){
      var validos=linhas.map(function(l,i){return {data:datas[i],volume:numero(campo(l,e.vol))};})
        .filter(function(x){return x.data&&x.data<=corte&&x.volume>0;});
      // Fontes de volumes parciais reais: nunca substituir pela tiragem integral.
      return {eventos:validos.map(function(v){return {data:v.data,volume:v.volume};}),motivo:''};
    }
    var presentes=datas.filter(Boolean);
    if(!presentes.length)return {eventos:[],motivo:''};
    // Marco de conclusão só equivale à tiragem quando TODAS as linhas agrupadas
    // estão encerradas. Caso contrário, não atribuir porcentagem inventada.
    if(presentes.length!==linhas.length||datas.some(function(d){return d!==datas[0];}))
      return {eventos:[],motivo:'fase: conclusao-parcial-ou-divergente-no-grupo'};
    return {eventos:datas[0]<=corte?[{data:datas[0],volume:numero(item.total)}]:[],motivo:''};
  }


  function texto(v) { return String(v == null ? '' : v).trim(); }
  function normal(v) { return texto(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase(); }
  function numero(v) {
    if (typeof v === 'number') return Number.isFinite(v) ? Math.max(0,v) : 0;
    var s = texto(v);
    if (s.indexOf(',') >= 0) s = s.replace(/\./g,'').replace(',','.');
    var n = Number(s);
    return Number.isFinite(n) ? Math.max(0,n) : 0;
  }
  function campo(l,n) { return typeof window.pgCampoColeta === 'function' ? window.pgCampoColeta(l,n) : l[n]; }
  function linhasOrigem(item) {
    var linhas = item.conciliacao && item.conciliacao.linhas;
    return Array.isArray(linhas) && linhas.length ? linhas : [item.linha || {}];
  }
  function valoresOrigem(item,ler) {
    return Array.from(new Set(linhasOrigem(item).map(ler).map(texto).filter(Boolean))).join(' | ');
  }
  function data(v) {
    var iso = typeof window.pgNormalizarDataColeta === 'function' ? window.pgNormalizarDataColeta(v) : texto(v);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return null;
    var d = new Date(iso+'T12:00:00Z');
    return Number.isFinite(d.getTime()) && d.toISOString().slice(0,10) === iso ? iso : null;
  }
  function domingo(iso) {
    var d = new Date(iso+'T12:00:00Z');
    if (d.getUTCDay() === 0) d.setUTCDate(d.getUTCDate()+1);
    return d.toISOString().slice(0,10);
  }
  // Mesma função de SLA e o mesmo ajuste de domingo da Meta Armazém.
  // Usa a coleta REAL como entrada, nunca a entrega real do caminhão.
  // SLAs informados para rotas PCP -> acabadora ainda sem valor na Matriz_SLA.
  // Somente a visão por analista utiliza esse complemento, e apenas se a Matriz
  // não possuir um prazo para a rota. Zero dia é um SLA explícito, não ausência.
  var SLA_ACABADORA_COMPLEMENTAR = new Map([
    ['FORMA CERTA|ANTILHAS',0],
    ['IMOS|ANTILHAS',0],
    ['IPSIS|ANTILHAS',0],
    ['LOGPRINT|EMBALARTE',0],
    ['MAXI|ANTILHAS',1],
    ['META|ANTILHAS',0],
    ['PIFFER|ANTILHAS',0],
    ['POSIGRAF|ANTILHAS',1],
    ['RONA|ANTILHAS',0],
    ['SAO FRANCISCO|HR',0],
    ['WALPRINT|ANTILHAS',2],
    ['WALPRINT|HR',2]
  ]);
  function slaComplementarAcabadora(l) {
    var origem=normal(l.GRAFICA_FINAL||campo(l,'GRÁFICA')||l.GRAFICA);
    var destino=normal(campo(l,'CD_MAPA'));
    return SLA_ACABADORA_COMPLEMENTAR.get(origem+'|'+destino);
  }
  function chegadaMatriz(linhas,diaColeta,rotaAcabadora) {
    if(!data(diaColeta))return {data:null,motivo:'data-coleta-invalida'};
    if(typeof window.pgDataPlanoEntregaSLA!=='function')
      return {data:null,motivo:'sla-indisponivel'};
    var destinos=(Array.isArray(linhas)?linhas:[]).map(function(l){
      var previsao=null;
      try{
        // A Matriz lê CD_FINAL/CD DESTINO. Na transferência da PCP para a acabadora,
        // o percurso físico é CD_MAPA, sem alterar a linha nem a regra global.
        var destino=texto(campo(l,'CD_MAPA'));
        var rota=rotaAcabadora
          ? (destino?Object.assign({},l,{CD_FINAL:destino,'CD DESTINO':destino}):null) : l;
        previsao=rota?data(window.pgDataPlanoEntregaSLA(rota,diaColeta)):null;
        // Só preencher lacunas reais: SLA já cadastrado na Matriz tem prioridade.
        // Nunca usar o complemento para CD direto ou para outra rota não fornecida.
        if(rotaAcabadora&&rota&&!previsao) {
          var diasComplementares=slaComplementarAcabadora(l);
          var slaOriginal=typeof window.pgDiasSLALinha==='function'
            ? window.pgDiasSLALinha(rota):null;
          if(diasComplementares!==undefined&&slaOriginal===null) {
            var chegada=new Date(diaColeta+'T12:00:00Z');
            chegada.setUTCDate(chegada.getUTCDate()+diasComplementares);
            previsao=chegada.toISOString().slice(0,10);
          }
        }
      }
      catch(_erro){previsao=null;}
      return previsao?domingo(previsao):null;
    });
    if(!destinos.length||destinos.some(function(v){return !v;}))
      return {data:null,motivo:'sla-indisponivel'};
    if(destinos.some(function(v){return v!==destinos[0];}))
      return {data:null,motivo:'rotas-divergentes-no-grupo'};
    return {data:destinos[0],motivo:''};
  }
  function entradaAcabadora(item) {
    return item.fluxo==='acabadora'&&item.trajeto==='entrada';
  }
  // Meta definida pelo destino físico; nunca buscar previsão como substituta
  // da meta contratada. Na entrada da acabadora, adota a maior meta válida
  // das linhas do grupo, sem descartar o grupo por datas distintas.
  function metaDoDestino(item) {
    if(entradaAcabadora(item)) {
      var datas=linhasOrigem(item).map(function(l){
        return data(campo(l,'META DE ENTREGA NO CD'));
      });
      var validas=datas.filter(Boolean).sort();
      if(!validas.length)
        return {prazo:null,motivo:'META DE ENTREGA NO CD ausente ou inválida em todas as linhas do grupo.',fonte:'META DE ENTREGA NO CD'};
      return {prazo:validas[validas.length-1],
        motivo:validas.length<datas.length
          ? 'Meta calculada pela maior data válida do grupo; '+(datas.length-validas.length)+' linha(s) sem data válida.':'',
        fonte:'META DE ENTREGA NO CD'};
    }
    // A meta de CD sempre vem do motor Meta Armazém/combinados do cenário
    // escolhido. Para saída da acabadora, a visão a vincula por linha física.
    var armazem=data(item.metaAplicada);
    return {prazo:armazem,motivo:armazem?'':'Meta armazém/combinados não conciliada para este item.',
      fonte:'Meta Armazém / combinados'};
  }
  // Compatibilidade interna com análises/testes anteriores. Esta opção não
  // existe mais no painel; a avaliação exibida sempre usa armazem/meta destino.
  function prazoLegado(item,referencia,etapa) {
    var col=referencia==='baseline'?BASELINE:REPLAN;
    var datas=linhasOrigem(item).map(function(l){
      var d=data(campo(l,col));
      if(!d)return null;
      if(etapa==='coleta')return d;
      if(item.fluxo==='acabadora'&&etapa==='entrega')return d;
      var projetada=chegadaMatriz([l],d,entradaAcabadora(item));
      return projetada.data;
    });
    var fonte=referencia==='baseline'?'Baseline':'Replan';
    if(!datas.length||datas.some(function(v){return !v;}))
      return {prazo:null,motivo:fonte+' ausente ou inválido na linha de origem.',fonte:fonte};
    if(datas.some(function(v){return v!==datas[0]}))
      return {prazo:null,motivo:'Prazos divergentes entre as linhas de origem.',fonte:fonte};
    return {prazo:datas[0],motivo:'',fonte:fonte};
  }
  function prazoItem(item,referencia,etapa) {
    if(['coleta','coleta_matriz','entrega'].indexOf(etapa)>=0) {
      if(referencia==='baseline'||referencia==='replan')
        return prazoLegado(item,referencia,etapa);
      return metaDoDestino(item);
    }
    // Fases anteriores mantêm o prazo próprio já existente no funil, sem
    // expor opções de Baseline/Replan nesta avaliação.
    var e=definicaoEtapa(etapa);
    if(!e||!e.plano)
      return {prazo:null,motivo:'Etapa sem prazo próprio verificável.',fonte:'Prazo da própria etapa'};
    var prazos=linhasOrigem(item).map(function(l){return valorFase(l,e.plano);});
    if(!prazos.length||prazos.some(function(v){return !v;}))
      return {prazo:null,motivo:'Prazo da etapa ausente ou inválido.',fonte:'Prazo da própria etapa'};
    if(prazos.some(function(v){return v!==prazos[0];}))
      return {prazo:null,motivo:'Prazos divergentes em linhas agrupadas; vincular por KIT.',fonte:'Prazo da própria etapa'};
    return {prazo:prazos[0],motivo:'',fonte:'Prazo da própria etapa'};
  }

  // Recorte independente: transferências PCP -> acabadora e saídas PCP_ACABADORAS -> CD.
  // Não usa a união canônica da Meta Armazém, que excluiria as entradas em acabadoras.
  // Não escreve nos dados de origem nem altera as regras compartilhadas de coleta/funil.
  function quantidade(v) {
    return Math.round(typeof window.pgNumeroPrazoV35 === 'function'
      ? Math.max(0,window.pgNumeroPrazoV35(v) || 0) : numero(v));
  }
  function fonteAcabadora(l) {
    return typeof window.pgEhFonteAcabadora === 'function' ? !!window.pgEhFonteAcabadora(l)
      : [l._SOURCE,l.BASE,l._base].some(function(v){ return normal(v).indexOf('ACAB') >= 0; });
  }
  function entraAcabadora(l) {
    if (fonteAcabadora(l)) return false;
    var resolver = window.pgEhDestinoAcabadora;
    return typeof resolver === 'function' && !!resolver(l);
  }
  function totalAcabadora(l,trajeto) {
    if (trajeto === 'saida') {
      var v = campo(l,'TIRAGEM A ENTREGAR (total por CD)');
      if (v !== undefined && v !== null && texto(v) !== '') return quantidade(v);
    }
    return quantidade(campo(l,'TIRAGEM'));
  }
  function idFisico(e,id,i) {
    if (Number.isInteger(Number(e.linhaMapa)) && Number(e.linhaMapa) >= 2)
      return 'MAPA:'+e.linhaMapa;
    if (e.id != null && texto(e.id)) return 'ID:'+e.id;
    return 'LINHA:'+id+':'+i;
  }
  function criarItemAcabadora(linhas,eventos,diagnosticos,total,trajeto,etapa) {
    var l=linhas[0];
    var usados=0,parcelas=[];
    eventos.slice().sort(function(a,b){return a.data.localeCompare(b.data);})
      .forEach(function(e){
        var v=Math.min(e.volume,Math.max(0,total-usados));
        if(v>0){parcelas.push({data:e.data,volume:v,chave:e.chave||'',kit:e.kit||''});usados+=v;}
      });
    return {linha:l,total:total,marca:texto(l.MARCA_FINAL||l.UNIDADE||l.MARCA),
      grafica:texto(l.GRAFICA_FINAL||campo(l,'GRÁFICA')||l.GRAFICA),
      serie:texto(l.serie_corrigida||campo(l,'SÉRIE')||l.SERIE),
      eventosColeta:etapa==='entrega'?[]:parcelas,
      eventosReal:etapa==='entrega'?parcelas:[],
      fluxo:'acabadora',trajeto:trajeto,
      destinoFluxo:trajeto==='entrada'
        ? texto(l.CD_MAPA) : texto(l['CD DESTINO']||l.CD_FINAL||l.CD),
      conciliacao:{linhas:linhas,agrupado:linhas.length>1,diagnosticos:diagnosticos.slice(),
        filtroParcial:false}};
  }
  window.pgRAItensAcabadoras=function(base,opcoes) {
    opcoes=opcoes||{};
    var trajeto=opcoes.trajeto||'entrada',corte=data(opcoes.corte),etapa=opcoes.etapa||'coleta';
    if(['entrada','saida'].indexOf(trajeto)<0)throw new Error('Etapa de acabadora inválida.');
    if(!corte)throw new Error('Data de corte inválida para acabadoras.');
    if((['coleta','coleta_matriz','entrega'].indexOf(etapa)>=0 && typeof window.pgVolumesColetaUnificadosV37!=='function') ||
        typeof window.pgIdentidadeOperacionalTPLinha!=='function')
      throw new Error('Conciliação do mapa TP ainda indisponível.');
    var candidatas=(Array.isArray(base)?base:[]).filter(function(l){
      return l && !(window.pgSolicitacaoCancelada&&window.pgSolicitacaoCancelada(l)) &&
        (trajeto==='entrada'?entraAcabadora(l):fonteAcabadora(l));
    });
    var linhas=typeof window.pgLinhasUnicas==='function'?window.pgLinhasUnicas(candidatas):Array.from(new Set(candidatas));
    var grupos=new Map();
    linhas.forEach(function(l,i){
      var total=totalAcabadora(l,trajeto);
      if(!total)return;
      var identidade=window.pgIdentidadeOperacionalTPLinha(l)||{};
      var chave=identidade.chave || (typeof window.pgMAIdLinhaRealizado==='function'
        ? window.pgMAIdLinhaRealizado(l) : 'ORIGEM:'+i);
      if(!grupos.has(chave))grupos.set(chave,[]);
      grupos.get(chave).push({linha:l,total:total,id:String(l._ROW_ID||l._PG_TP_LINHA||l.ID||i)});
    });
    var saida=[];
    grupos.forEach(function(registros){
      var fisicos=new Map(),diagnosticos=[];
      registros.forEach(function(r){
        var v=etapa==='coleta'||etapa==='coleta_matriz'||etapa==='entrega'?
          window.pgVolumesColetaUnificadosV37(r.linha,corte)||{}:{};
        var fonte=etapa==='entrega'?'eventosEntregaTP':'eventosColetaTP';
        var lista=Array.isArray(v[fonte])?v[fonte]:[];
        var motivo=lista.conciliacao&&lista.conciliacao.motivo||'';
        if(/indisponivel|cache-sem-contrato|forecast-nao-conferido|nao-concilia|identidade-da-linha-incompleta/.test(motivo))
          diagnosticos.push((etapa==='entrega'?'entrega':'coleta')+': '+motivo);
        lista.forEach(function(e,i){
          var dia=data(e.data),volume=quantidade(e.volume);
          if(!dia||dia>corte||!volume)return;
          var chave=idFisico(e,r.id,i);
          if(registros.length>1&&chave.indexOf('LINHA:')===0) {
            // Sem identificador físico, a mesma entrega pode aparecer em múltiplos owners.
            // Não atribuir volume possivelmente duplicado ao desempenho de alguém.
            diagnosticos.push((etapa==='entrega'?'entrega':'coleta')+': parcelas-sem-identificador-fisico');
            return;
          }
          var anterior=fisicos.get(chave);
          if(anterior){
            if(anterior.data!==dia||anterior.volume!==volume||normal(anterior.kit)!==normal(e.kit))
              throw new Error('Parcela de coleta divergente na acabadora: '+chave);
            return;
          }
          fisicos.set(chave,{data:dia,volume:volume,kit:texto(e.kit),chave:chave});
        });
      });
      diagnosticos=Array.from(new Set(diagnosticos));
      var eventos=Array.from(fisicos.values()),linhasGrupo=registros.map(function(r){return r.linha;});
      var porKit=new Map();
      registros.forEach(function(r){
        var kit=normal(campo(r.linha,'KIT'));
        if(!porKit.has(kit))porKit.set(kit,[]);
        porKit.get(kit).push(r);
      });
      var kitSeguro=eventos.length>0&&eventos.every(function(e){
        return normal(e.kit)&&(porKit.get(normal(e.kit))||[]).length===1;
      })&&registros.every(function(r){
        var kit=normal(campo(r.linha,'KIT'));
        return eventos.filter(function(e){return normal(e.kit)===kit;})
          .reduce(function(s,e){return s+e.volume;},0)<=r.total;
      });
      if(registros.length===1||!eventos.length||kitSeguro){
        registros.forEach(function(r){
          var kit=normal(campo(r.linha,'KIT'));
          var associados=registros.length===1?eventos:!eventos.length?[]:
            eventos.filter(function(e){return normal(e.kit)===kit;});
          saida.push(criarItemAcabadora([r.linha],associados,diagnosticos,r.total,trajeto,etapa));
        });
      } else {
        saida.push(criarItemAcabadora(linhasGrupo,eventos,diagnosticos,
          registros.reduce(function(s,r){return s+r.total;},0),trajeto,etapa));
      }
    });
    return saida;
  };

  function vazio() {
    var out = {};
    CAMPOS.forEach(function(c) { out[c] = 0; });
    return out;
  }
  function somar(out,detalhe) {
    CAMPOS.forEach(function(c) { out[c] += detalhe[c]; });
  }
  function aderencia(out) {
    return out.metaVencida > 0 ? Math.min(100,out.noPrazoVencido/out.metaVencida*100) : null;
  }
  function explicarDiagnostico(d,item) {
    if(d==='matriz: sla-indisponivel') {
      var origem=texto(item.grafica||item.linha&&item.linha.GRAFICA_FINAL)||'Gráfica não identificada';
      var destinos=valoresOrigem(item,function(l) {
        return entradaAcabadora(item)?campo(l,'CD_MAPA'):
          l.CD_FINAL||campo(l,'CD DESTINO')||l.CD;
      });
      return 'Matriz SLA: prazo de transporte indisponível para '+origem+' → '+(destinos||'destino não informado');
    }
    if(d==='matriz: rotas-divergentes-no-grupo')
      return 'Matriz SLA: diferentes prazos de transporte no mesmo agrupamento';
    if(d==='coleta: identidade-da-linha-incompleta')
      return 'Coleta não conciliada: identificação incompleta (marca, gráfica, SKU, destino ou envio)';
    if(d==='coleta: parcelas-sem-identificador-fisico')
      return 'Coleta não conciliada: movimento do mapa sem identificador físico';
    return d;
  }

  // Complemento gerencial Walprint / SAS V1-27. Fonte: lista PCP (montagem
  // HR/Oceano) cruzada com SPG, extração de 16/11/2026.
  // Chave prioritária KIT+SKU; sem match, SKU agregado UMA única vez, com
  // desconto dos kits já encontrados e volumes presentes no PCP canônico.
  // Não altera PCP, SPG, funil, entregas no CD ou origem das linhas.
  var WALPRINT_FONTE='PCP+SPG SAS V1-27 / 16-11-2026';
  var WALPRINT_EXATOS=[["SAS27CA51SD1BRMER00","SAS27LSAAR43101BRPDR00",200,"MONTAGEM HR"],["SAS27CA51SD1BRMER00","SAS27LSAFS43101BRPDR00",200,"MONTAGEM HR"],["SAS27CA51SD1BRMER00","SAS27LSAME43101BRPDR00",200,"MONTAGEM HR"],["SAS27CA51SD1BRMFA00","SAS27LPAIN51101BRPDR00",70,"MONTAGEM HR"],["SAS27CA51SD1BRMFA00","SAS27LPAIN51102BRPDR00",70,"MONTAGEM HR"],["SAS27CA51SD1BRMFS00","SAS27LSAAR43101BRPDR00",160,"MONTAGEM HR"],["SAS27CA51SD1BRMFS00","SAS27LSAFS43101BRPDR00",160,"MONTAGEM HR"],["SAS27CA51SD1BRMFS00","SAS27LSAME43101BRPDR00",160,"MONTAGEM HR"],["SAS27CA51SD1BRNSF00","SAS27LSAAR43101BRPDR00",130,"MONTAGEM HR"],["SAS27CA51SD1BRNSF00","SAS27LSAFS43101BRPDR00",130,"MONTAGEM HR"],["SAS27CA51SD1BRNSF00","SAS27LSAME43101BRPDR00",130,"MONTAGEM HR"],["SAS27CA51SD1BRPAR00","SAS27LSAAR43101BRPDR00",80,"MONTAGEM HR"],["SAS27CA51SD1BRPAR00","SAS27LSAFS43101BRPDR00",80,"MONTAGEM HR"],["SAS27CA51SD1BRPAR00","SAS27LSAME43101BRPDR00",80,"MONTAGEM HR"],["SAS27CA51SD1BRPDR00","SAS27LPAIN51101BRPDR00",31000,"MONTAGEM OCEANO"],["SAS27CA51SD1BRPDR00","SAS27LPAIN51102BRPDR00",31000,"MONTAGEM OCEANO"],["SAS27CA51SD1BRPDR00","SAS27LSAAR43101BRPDR00",31000,"MONTAGEM OCEANO"],["SAS27CA51SD1BRPDR00","SAS27LSAFS43101BRPDR00",31000,"MONTAGEM OCEANO"],["SAS27CA51SD1BRPDR00","SAS27LSAME43101BRPDR00",31000,"MONTAGEM OCEANO"],["SAS27CA51SD1BRPNT00","SAS27LSAAR43101BRPDR00",110,"MONTAGEM HR"],["SAS27CA51SD1BRPNT00","SAS27LSAFS43101BRPDR00",110,"MONTAGEM HR"],["SAS27CA51SD1BRPNT00","SAS27LSAME43101BRPDR00",110,"MONTAGEM HR"],["SAS27CA51SD1BRRBR00","SAS27LSAAR43101BRPDR00",180,"MONTAGEM HR"],["SAS27CA51SD1BRRBR00","SAS27LSAFS43101BRPDR00",180,"MONTAGEM HR"],["SAS27CA51SD1BRRBR00","SAS27LSAME43101BRPDR00",180,"MONTAGEM HR"],["SAS27CA51SD1BRSAF00","SAS27LPAIN51101BRPDR00",900,"MONTAGEM HR"],["SAS27CA51SD1BRSAF00","SAS27LPAIN51102BRPDR00",900,"MONTAGEM HR"],["SAS27CA51SD1BRSAF00","SAS27LSAME43101BRPDR00",900,"MONTAGEM HR"],["SAS27CA51SD1BRSDG00","SAS27LSAAR43101BRPDR00",90,"MONTAGEM HR"],["SAS27CA51SD1BRSDG00","SAS27LSAFS43101BRPDR00",90,"MONTAGEM HR"],["SAS27CA51SD1BRSDG00","SAS27LSAME43101BRPDR00",90,"MONTAGEM HR"],["SAS27CA51SD1BRSER00","SAS27LSAAR43101BRPDR00",30,"MONTAGEM HR"],["SAS27CA51SD1BRSER00","SAS27LSAFS43101BRPDR00",30,"MONTAGEM HR"],["SAS27CA51SD1BRSER00","SAS27LSAME43101BRPDR00",30,"MONTAGEM HR"],["SAS27CA51SD1BRSJE00","SAS27LSAAR43101BRPDR00",110,"MONTAGEM HR"],["SAS27CA51SD1BRSJE00","SAS27LSAFS43101BRPDR00",110,"MONTAGEM HR"],["SAS27CA51SD1BRSJE00","SAS27LSAME43101BRPDR00",110,"MONTAGEM HR"],["SAS27CC51SD1BRPDR00","SAS27LPAIN51101BRPDR00",750,"MONTAGEM HR"],["SAS27CC51SD1BRPDR00","SAS27LPAIN51102BRPDR00",750,"MONTAGEM HR"],["SAS27CC51SD1BRPDR00","SAS27LSAAR43101BRPDR00",750,"MONTAGEM HR"],["SAS27CC51SD1BRPDR00","SAS27LSAFS43101BRPDR00",750,"MONTAGEM HR"],["SAS27CC51SD1BRPDR00","SAS27LSAME43101BRPDR00",750,"MONTAGEM HR"]];
  var WALPRINT_POR_SKU=[["SAS27LSAAR43101BRPDR00",49342,32840,"SAS27CA51SD1BRARB00|SAS27CA51SD1BRBAH00|SAS27CA51SD1BRFOR00"],["SAS27LSAFS43101BRPDR00",52957,32840,"SAS27CA51SD1BRARB00|SAS27CA51SD1BRBAH00|SAS27CA51SD1BRFOR00"],["SAS27LSAME43101BRPDR00",58715,33740,"SAS27CA51SD1BRARB00|SAS27CA51SD1BRBAH00|SAS27CA51SD1BRFOR00"]];
  var WALPRINT_CHAVES=new Set(WALPRINT_EXATOS.map(function(r){return r[0]+'|'+r[1];}));
  function walprintOrigem(item) {
    var l=item.linha||{};
    var grafica=normal(item.grafica||l.GRAFICA_FINAL||campo(l,'GRÁFICA'));
    var marca=normal(item.marca||l.MARCA_FINAL||l.UNIDADE||l.MARCA);
    if(grafica!=='WALPRINT'||marca!=='SAS')return null;
    var sku=normal(l.SKU_REAL||campo(l,'SKU')||l.SKU);
    var kit=normal(campo(l,'KIT')||l.KIT);
    if(!sku)return null;
    return {sku:sku,kit:kit,total:numero(item.total)};
  }
  window.pgRAComplementarWalprint=function(itens,opcoes){
    opcoes=opcoes||{};
    var originais=Array.isArray(itens)?itens:[];
    var etapa=opcoes.etapa||'coleta_matriz';
    if(['coleta','coleta_matriz','entrega'].indexOf(etapa)<0 ||
      opcoes.destino==='cd'||opcoes.destino==='acabadora'&&opcoes.trajeto==='saida')
      return originais;
    // Sem datas de movimentos confiáveis para retroagir o ajuste a cortes
    // anteriores à extração. Nada é retroprojetado em períodos passados.
    if(String(opcoes.corte||'')<'2026-11-16')return originais;
    var presentes=new Map(),porSku=new Map();
    originais.forEach(function(item){
      var x=walprintOrigem(item);
      if(!x)return;
      var id=x.kit+'|'+x.sku;
      presentes.set(id,(presentes.get(id)||0)+x.total);
      if(!WALPRINT_CHAVES.has(id)){
        porSku.set(x.sku,(porSku.get(x.sku)||0)+x.total);
      }
    });
    var extras=[];
    function adicionar(kit,sku,volume,metodo,sub,kitsSemMatch) {
      volume=Math.max(0,Math.round(numero(volume)));
      if(!volume)return;
      var l={KIT:kit,SKU:sku,CICLO:2027,ENVIO:'V1',
        GRAFICA_FINAL:'WALPRINT',MARCA_FINAL:'SAS',UNIDADE:'SAS'};
      var info={fonte:WALPRINT_FONTE,metodo:metodo,
        sku:sku,kit:kit,sub:sub||'Realocação de montagem',origemKits:kitsSemMatch||''};
      extras.push({linha:l,total:volume,grafica:'WALPRINT',marca:'SAS',fluxo:'acabadora',
        trajeto:'entrada',destinoFluxo:sub&&sub.includes('OCEANO')?'OCEANO':'HR',
        ajusteWalprint:info,
        conciliacao:{linhas:[l],diagnosticos:['ajuste-walprint: fora-do-prazo-confirmado-gerencialmente; sem-data-de-movimento']}});
    }
    WALPRINT_EXATOS.forEach(function(r){
      var k=r[0]+'|'+r[1],faltante=r[2]-(presentes.get(k)||0);
      adicionar(r[0],r[1],faltante,'Kit + SKU (SPG quantidade)',r[3],'');
    });
    WALPRINT_POR_SKU.forEach(function(r){
      // SPG SKU somado sobre todos os kits; os kits exatos já são retirados
      // para não multiplicar um SKU pelos três kits sem correspondência.
      var saldo=r[1]-r[2]-(porSku.get(r[0])||0);
      adicionar('',r[0],saldo,'SKU isolado (saldo não duplicado)',
        'MONTAGEM HR',r[3]);
    });
    return originais.concat(extras);
  };
  function detalheExcecaoWalprint(item,etapa) {
    var info=item.ajusteWalprint,total=numero(item.total);
    var responsavel=typeof window.pgResponsavelGraficaGiro==='function'?
      window.pgResponsavelGraficaGiro('WALPRINT')||{}:{};
    return {analista:texto(responsavel.analista)||'Sem responsável',
      time:texto(responsavel.time)||'Não informado',grafica:'WALPRINT',
      marca:'SAS',serie:'',sku:info.sku,kit:info.kit,
      descricao:'Volume realocado para montagem '+(item.destinoFluxo||'')+
        ' — ajuste gerencial Walprint',ciclo:'2027',envio:'V1',
      etapaAvaliada:definicaoEtapa(etapa).nome,
      destinoAvaliado:'Acabadoras',percurso:'Gráfica → acabadora',
      destinoFluxo:item.destinoFluxo,referenciaEfetiva:'Ajuste gerencial Walprint (fora do prazo)',
      idOrigem:WALPRINT_FONTE+' | '+info.metodo+
        (info.origemKits?' | Kits sem combinação: '+info.origemKits:''),
      prazo:null,total:total,entregue:total,noPrazo:0,foraPrazo:total,
      pendente:0,vencido:0,aVencer:0,semPrazo:0,naoApurado:0,
      metaVencida:total,noPrazoVencido:0,foraPrazoVencido:total,linhas:1,
      motivo:'Exceção Walprint: volume não representado na base PCP, realocado à montagem '+
        (item.destinoFluxo||'')+' e classificado como fora do prazo conforme alinhamento com a liderança. '+
        'Não há data individual de movimento nesta fonte. Cruzamento: '+info.metodo+'.',
      diagnosticos:['fonte '+WALPRINT_FONTE,'origem '+info.metodo,
        'sem data individual de internalização; ajuste atribuído ao corte da extração'],
      parcelasColeta:[],dataUltimaColeta:''};
  }

  function detalheItem(item,referencia,corte,etapa) {
    if(item.ajusteWalprint)return detalheExcecaoWalprint(item,etapa);
    var definicao=definicaoEtapa(etapa);
    if(!correspondeEtapa(item,definicao))return null;
    var l = item.linha || {}, grafica = texto(item.grafica || l.GRAFICA_FINAL || campo(l,'GRÁFICA') || l.GRAFICA) || 'Não informada';
    var responsavel = typeof window.pgResponsavelGraficaGiro === 'function' ? window.pgResponsavelGraficaGiro(grafica) : {};
    responsavel = responsavel || {};
    var prazo = prazoItem(item,referencia,etapa), total = numero(item.total),
      entregue = 0, noPrazo = 0, foraPrazo = 0, parcelasColeta=[];
    var marco=etapa!=='coleta'&&etapa!=='coleta_matriz'&&etapa!=='entrega'?eventosMarco(item,definicao,corte):null;
    var diagnosticos = item.conciliacao && item.conciliacao.diagnosticos;
    diagnosticos = Array.isArray(diagnosticos) ? diagnosticos.map(texto).filter(Boolean) : [];
    if(marco && marco.motivo)diagnosticos.push(marco.motivo);
    var calculosMatriz=new Map();
    function projecao(dia) {
      if(!calculosMatriz.has(dia))
        calculosMatriz.set(dia,chegadaMatriz(linhasOrigem(item),dia,entradaAcabadora(item)));
      return calculosMatriz.get(dia);
    }
    if(etapa==='coleta_matriz') {
      (Array.isArray(item.eventosColeta)?item.eventosColeta:[])
        .forEach(function(e){
          var dia=data(e.data);
          if(!dia||dia>corte||!numero(e.volume))return;
          var projeto=projecao(dia);
          if(!projeto.data)diagnosticos.push('matriz: '+projeto.motivo);
        });
    }
    diagnosticos=Array.from(new Set(diagnosticos));
    var fasePrefixo=etapa==='entrega'?'entrega':etapa==='coleta'?'coleta':'fase';
    var falhasColeta = diagnosticos.filter(function(d) {
      var n = normal(d).toLowerCase();
      return (n.indexOf(fasePrefixo+':')===0||
        etapa==='coleta_matriz'&&n.indexOf('matriz:')===0) &&
        /indisponivel|indisponiveis|cache-sem-contrato|forecast-nao-conferido|nao-concilia|identidade-da-linha-incompleta|parcelas-sem-identificador-fisico|conclusao-parcial-ou-divergente|sla-indisponivel|rotas-divergentes|data-coleta-invalida/.test(n);
    });
    var apuravel = falhasColeta.length === 0;
    // Cada etapa usa seu próprio realizado; Coleta + Matriz projeta trânsito a partir da Coleta TP.
    // Cada parcela tem data real; o volume fica limitado à tiragem da própria etapa.
    var eventos=etapa==='coleta'||etapa==='coleta_matriz'?item.eventosColeta:
      etapa==='entrega'?item.eventosReal:marco&&marco.eventos;
    (Array.isArray(eventos) ? eventos : []).map(function(e) {
      return {data:data(e.data),volume:numero(e.volume),
        projetada:etapa==='coleta_matriz'?projecao(data(e.data)).data:null,
        chave:texto(e.chave||(e.linhaMapa!=null?'MAPA:'+e.linhaMapa:e.id!=null?'ID:'+e.id:'')),
        kit:texto(e.kit)};
    }).filter(function(e) { return e.data && e.data <= corte && e.volume > 0; })
      .sort(function(a,b) { return a.data.localeCompare(b.data); })
      .forEach(function(e) {
        var volume = Math.min(e.volume,Math.max(0,total-entregue));
        entregue += volume;
        if(volume>0)parcelasColeta.push({data:e.data,projetada:e.projetada,volume:volume,chave:e.chave,kit:e.kit});
        // SLA ausente não transforma uma parcela coletada em atraso.
        var dataAvaliacao=etapa==='coleta_matriz'?e.projetada:e.data;
        if (prazo.prazo && dataAvaliacao) {
          if (dataAvaliacao <= prazo.prazo) noPrazo += volume;
          else foraPrazo += volume;
        }
      });
    var pendente = Math.max(0,total-entregue), vencida = apuravel && !!prazo.prazo && prazo.prazo <= corte;
    return {
      analista:texto(responsavel.analista) || 'Sem responsável',
      time:texto(responsavel.time) || 'Não informado',grafica:grafica,
      etapaAvaliada:definicao.nome,
      destinoAvaliado:item.fluxo==='acabadora'?'Acabadoras':'Entregas no CD',
      percurso:item.fluxo==='acabadora'?(item.trajeto==='entrada'?'Gráfica → acabadora':'Acabadora → CD'):'Entrega ao CD',
      destinoFluxo:texto(item.destinoFluxo||l.CD_FINAL||l.CD_MAPA||l['CD DESTINO']),
      referenciaEfetiva:prazo.fonte,
      marca:texto(item.marca || l.MARCA_FINAL || l.UNIDADE || l.MARCA),
      serie:texto(item.serie || l.serie_corrigida || campo(l,'SÉRIE') || l.SERIE),
      sku:texto(l.SKU_REAL || l.SKU),kit:texto(campo(l,'KIT')),
      descricao:texto(l.DESC_REAL || campo(l,'DESCRIÇÃO') || l.DESCRICAO),
      ciclo:valoresOrigem(item,function(r) { return campo(r,'CICLO'); }),
      envio:valoresOrigem(item,function(r) { return campo(r,'ENVIO'); }),
      idOrigem:valoresOrigem(item,function(r) { return r._ROW_ID || r.ID; }),
      prazo:prazo.prazo,total:total,entregue:entregue,noPrazo:noPrazo,foraPrazo:foraPrazo,
      pendente:pendente,vencido:vencida ? pendente : 0,
      aVencer:apuravel && prazo.prazo && !vencida ? pendente : 0,
      semPrazo:prazo.prazo ? 0 : total,naoApurado:apuravel ? 0 : total,
      motivo:[prazo.motivo,falhasColeta.length ? definicao.nome+' não conferida: '+
        falhasColeta.map(function(d){return explicarDiagnostico(d,item);}).join('; ')+'.' : ''].filter(Boolean).join(' '),
      parcelasColeta:parcelasColeta,
      dataUltimaColeta:parcelasColeta.length?parcelasColeta[parcelasColeta.length-1].data:'',
      diagnosticos:diagnosticos.map(function(d){return explicarDiagnostico(d,item);}),
      metaVencida:vencida ? total : 0,noPrazoVencido:vencida ? noPrazo : 0,
      foraPrazoVencido:vencida ? foraPrazo : 0,linhas:1
    };
  }

  // Proteção no motor da avaliação, não só nos seletores da interface.
  // Os demais motores e filtros globais continuam inalterados.
  function escopoUsuarioRA() {
    return typeof window.pgRAEscopoUsuario === 'function'
      ? window.pgRAEscopoUsuario() : {tipo:'TODOS'}; // compatibilidade com testes isolados
  }
  function itemVisivelAoUsuario(item,escopo) {
    if(escopo.tipo==='TODOS')return true;
    if(escopo.tipo!=='PROPRIO'||!escopo.analista||!escopo.time||!item)return false;
    var l=item.linha||{};
    var grafica=texto(item.grafica||l.GRAFICA_FINAL||campo(l,'GRÁFICA')||l.GRAFICA);
    var dono=typeof window.pgResponsavelGraficaGiro==='function'
      ? window.pgResponsavelGraficaGiro(grafica):null;
    return !!dono&&normal(dono.analista)===normal(escopo.analista)&&
      normal(dono.time)===normal(escopo.time);
  }
  window.pgRAApurar = function(itens,opcoes) {
    opcoes = opcoes || {};
    var referencia = opcoes.referencia || 'armazem';
    var etapa=opcoes.etapa||'coleta';
    if(!definicaoEtapa(etapa))throw new Error('Etapa de avaliação inválida.');
    var destino=opcoes.destino||'cd',trajeto=opcoes.trajeto||'entrada';
    if(['total','cd','acabadora'].indexOf(destino)<0)throw new Error('Destino de avaliação inválido.');
    if(destino==='acabadora'&&['entrada','saida'].indexOf(trajeto)<0)
      throw new Error('Etapa de acabadora inválida.');
    if (['armazem','baseline','replan'].indexOf(referencia) < 0) throw new Error('Referência de prazo inválida.');
    var hoje = typeof dtHojeISO !== 'undefined' ? dtHojeISO : new Date().toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'});
    var corte = data(opcoes.corte || hoje);
    if (!corte) throw new Error('Data de corte inválida.');
    if (corte > hoje) throw new Error('A data de corte não pode ser futura.');
    var escopo=escopoUsuarioRA();
    var analista = normal(escopo.tipo==='PROPRIO'?escopo.analista:opcoes.analista);
    var time = normal(escopo.tipo==='PROPRIO'?escopo.time:opcoes.time);
    var porAnalista = new Map(), resumo = vazio();
    var itensPermitidos=(Array.isArray(itens)?itens:[]).filter(function(item){
      return itemVisivelAoUsuario(item,escopo);
    });
    var detalhes = itensPermitidos.map(function(item) { return detalheItem(item,referencia,corte,etapa); })
      .filter(function(d) {
        return d && d.total > 0 && (!analista || analista === 'TODOS' || normal(d.analista) === analista) &&
          (!time || time === 'TODOS' || normal(d.time) === time);
      });
    detalhes.forEach(function(d) {
      var chave = JSON.stringify([d.analista,d.time]), grupo = porAnalista.get(chave);
      if (!grupo) {
        grupo = Object.assign(vazio(),{analista:d.analista,time:d.time,graficas:[],semResponsavel:d.analista === 'Sem responsável'});
        porAnalista.set(chave,grupo);
      }
      if (grupo.graficas.indexOf(d.grafica) < 0) grupo.graficas.push(d.grafica);
      somar(grupo,d);somar(resumo,d);
    });
    var porGraficaMarca=new Map();
    detalhes.forEach(function(d){
      var key=JSON.stringify([d.analista,d.time,d.grafica,d.marca,d.percurso]);
      var g=porGraficaMarca.get(key);
      if(!g){g=Object.assign(vazio(),{analista:d.analista,time:d.time,grafica:d.grafica,
          marca:d.marca,percurso:d.percurso});porGraficaMarca.set(key,g);}
      somar(g,d);
    });
    var graficasMarcas=Array.from(porGraficaMarca.values()).map(function(g){
      g.aderencia=aderencia(g);return g;
    }).sort(function(a,b){
      return a.analista.localeCompare(b.analista,'pt-BR')||
        a.grafica.localeCompare(b.grafica,'pt-BR')||
        a.marca.localeCompare(b.marca,'pt-BR')||
        a.percurso.localeCompare(b.percurso,'pt-BR');
    });
    var analistas = Array.from(porAnalista.values()).map(function(g) {
      g.graficas.sort(function(a,b) { return a.localeCompare(b,'pt-BR'); });
      g.aderencia = aderencia(g);
      return g;
    }).sort(function(a,b) { return a.analista.localeCompare(b.analista,'pt-BR'); });
    resumo.aderencia = aderencia(resumo);resumo.analistas = analistas.length;
    return {referencia:referencia,referenciaEfetiva:etapa!=='coleta'&&etapa!=='coleta_matriz'&&etapa!=='entrega'?
      (referencia==='baseline'?'baseline':'replan'):
      destino==='acabadora'?(referencia==='baseline'?'baseline':'replan'):
      (destino==='total'&&referencia==='armazem'?'mista':referencia),
      etapa:etapa,nomeEtapa:definicaoEtapa(etapa).nome,
      destino:destino,trajeto:destino==='acabadora'?trajeto:'',
      corte:corte,resumo:resumo,analistas:analistas,graficasMarcas:graficasMarcas,detalhes:detalhes};
  };
})();
