<script>
(function() {
    'use strict';
    const normal = valor => String(valor ?? '').normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '').trim().replace(/\s+/g, ' ').toUpperCase();
    const preenchido = valor => valor !== undefined && valor !== null && String(valor).trim() !== '';
    const campo = (linha, nome) => typeof window.pgCampoColeta === 'function'
        ? window.pgCampoColeta(linha, nome) : linha?.[nome];
    const primeiro = (linha, nomes) => nomes.map(nome => campo(linha, nome)).find(preenchido) ?? '';
    const numero = valor => {
        if (typeof window.pgNumeroPrazoV35 === 'function') return Math.max(0, window.pgNumeroPrazoV35(valor));
        if (typeof valor === 'number') return Math.max(0, Number.isFinite(valor) ? valor : 0);
        let texto = String(valor ?? '').trim();
        if (texto.includes(',')) texto = texto.replace(/\./g, '').replace(',', '.');
        else if (/^\d{1,3}(\.\d{3})+$/.test(texto)) texto = texto.replace(/\./g, '');
        return Math.max(0, Number(texto) || 0);
    };
    const data = valor => {
        if (!preenchido(valor)) return '';
        const texto = String(valor).trim();
        let iso = /^\d{4}-\d{2}-\d{2}$/.test(texto) ? texto : '';
        const brasileira = texto.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
        if (brasileira) iso = brasileira[3] + '-' + brasileira[2] + '-' + brasileira[1];
        if (!iso) return '';
        const d = new Date(iso + 'T12:00:00Z');
        return Number.isFinite(d.getTime()) && d.toISOString().slice(0, 10) === iso ? iso : '';
    };
    const proximoDia = iso => {
        const d = new Date(iso + 'T12:00:00Z');
        d.setUTCDate(d.getUTCDate() + 1);
        return d.toISOString().slice(0, 10);
    };
    const simNao = valor => {
        const n = normal(valor);
        if (['SIM', 'S', 'TRUE', '1'].includes(n)) return 'Sim';
        if (['NAO', 'N', 'FALSE', '0'].includes(n)) return 'Não';
        return 'Não informado';
    };
    const temFonteAcabadora = linha => typeof window.pgEhFonteAcabadora === 'function'
        ? window.pgEhFonteAcabadora(linha)
        : [linha?._SOURCE, linha?.BASE, linha?._base].some(v => normal(v).includes('ACAB'));
    const previsoesPorChave = previsoes => {
        if (Array.isArray(previsoes)) return Object.fromEntries(previsoes.filter(p => p?.chave).map(p => [p.chave, p]));
        return previsoes?.previsoes || previsoes || {};
    };
    const eventosReais = (volumes, tipo, hoje, usados) => {
        const entrega = tipo === 'entrega';
        const lista = volumes[entrega ? 'eventosEntregaTP' : 'eventosColetaTP'];
        const agregado = entrega ? volumes.entrega : volumes.coleta;
        const dt = data(entrega ? volumes.entregaTP : volumes.coletaTP);
        const origem = Array.isArray(lista) ? lista
            : numero(agregado) > 0 && dt && dt <= hoje ? [{data: dt, volume: numero(agregado)}] : [];
        const saida = [];
        origem.forEach(evento => {
            const dia = data(evento?.data), volume = numero(evento?.volume);
            if (!dia || dia > hoje || volume <= 0) return;
            // A linha física do mapa identifica o movimento. Parcelas diferentes,
            // mesmo com data e quantidade iguais, continuam independentes.
            const identificador = preenchido(evento.linhaMapa) ? 'MAPA:' + evento.linhaMapa
                : preenchido(evento.id) ? 'ID:' + evento.id : '';
            const chave = tipo + '|' + identificador;
            if (identificador && usados.has(chave)) return;
            if (identificador) usados.add(chave);
            saida.push({...evento, data: dia, volume});
        });
        return saida.sort((a, b) => a.data.localeCompare(b.data));
    };
    const entregaSLA = (linha, coleta) => data(typeof window.pgDataPlanoEntregaSLA === 'function'
        ? (coleta === undefined ? window.pgDataPlanoEntregaSLA(linha) : window.pgDataPlanoEntregaSLA(linha, coleta)) : '');

    function montar(base, previsoes, hoje, opcoes = {}) {
        hoje = data(hoje);
        if (!hoje) throw new Error('Informe uma data válida para calcular as entregas.');
        const salvas = previsoesPorChave(previsoes), movimentosUsados = new Set();
        const candidatas = (base || []).filter(linha => linha && !window.pgSolicitacaoCancelada?.(linha));
        let linhas = typeof window.pgLinhasUnicas === 'function'
            ? window.pgLinhasUnicas(candidatas) : Array.from(new Set(candidatas));
        if (opcoes.conciliarRealizado && typeof window.pgMAPrepararLinhas === 'function') {
            linhas = window.pgMAPrepararLinhas(linhas, opcoes.baseOriginal || window.dadosGlobais || candidatas, hoje);
        }
        return linhas.map((linha, indice) => {
            const conciliacao = linha._PG_MA;
            const origem = temFonteAcabadora(linha) ? 'ACABADORA' : 'PCP';
            const cd = normal(primeiro(linha, ['CD_FINAL', 'CD DESTINO', 'CD_DESTINO', 'CD', 'CK']));
            const grafica = normal(primeiro(linha, ['GRAFICA_FINAL', 'GRÁFICA', 'GRAFICA', 'BQ']));
            const marca = String(primeiro(linha, ['MARCA_FINAL', 'UNIDADE', 'MARCA'])).trim();
            const sku = String(primeiro(linha, ['SKU_REAL', 'SKU'])).trim();
            const envio = String(primeiro(linha, ['ENVIO', 'Envio'])).trim();
            const kit = String(primeiro(linha, ['KIT', 'Kit'])).trim();
            const op = String(primeiro(linha, ['OP', 'O.P.'])).trim();
            const join = primeiro(linha, ['JOIN_KEY', 'JOIN KEY']);
            const chavesOrigem = [...new Set((conciliacao?.linhas || [linha]).map(chaveDaLinha))];
            const chave = chavesOrigem[0];
            const rawTotalCD = campo(linha, 'TIRAGEM A ENTREGAR (total por CD)');
            const total = Math.round(numero(!opcoes.volumeCanonico && origem === 'ACABADORA' && preenchido(rawTotalCD)
                ? rawTotalCD : campo(linha, 'TIRAGEM')));
            // A conciliação mantém os movimentos no total operacional do grupo,
            // evitando cortar o TP na tiragem da primeira linha que recebeu o mapa.
            const volumes = conciliacao ? {eventosColetaTP: conciliacao.eventosColeta,
                eventosEntregaTP: conciliacao.eventosEntrega} : window.pgVolumesColetaUnificadosV37?.(linha, hoje) || {};
            const eventosColeta = eventosReais(volumes, 'coleta', hoje, movimentosUsados);
            const eventosEntrega = eventosReais(volumes, 'entrega', hoje, movimentosUsados);
            const coletado = eventosColeta.reduce((s, e) => s + e.volume, 0);
            const entregue = eventosEntrega.reduce((s, e) => s + e.volume, 0);
            const saldo = Math.max(0, total - entregue);
            const pendenteColeta = Math.max(0, total - Math.max(coletado, entregue));
            const aguardandoEntrega = Math.min(saldo, Math.max(0, coletado - entregue));
            const datasColeta = Array.from(new Set(eventosColeta.map(e => e.data)));
            const datasEntrega = Array.from(new Set(eventosEntrega.map(e => e.data)));
            const dtColetaPCP = data(window.pgDataPlanoColetaLinha?.(linha));
            const dtEntregaPCP = entregaSLA(linha);
            const previsoesOrigem = Object.fromEntries(chavesOrigem.map(k => [k,
                typeof salvas[k] === 'string' ? {dataEntrega: salvas[k]} : (salvas[k] || {})]));
            const registros = Object.values(previsoesOrigem), registro = {...registros[0]};
            const coletasManuais = new Set(registros.map(r => String(r.dataColeta || '')));
            const entregasManuais = new Set(registros.map(r => String(r.dataEntrega || r.data || r.dataPrevista || '')));
            const conflitoColeta = coletasManuais.size > 1, conflitoEntrega = entregasManuais.size > 1;
            // Sem KIT seguro, datas individuais diferentes não autorizam ratear
            // uma entrega compartilhada entre as linhas de origem.
            if (conflitoColeta) registro.dataColeta = '';
            if (conflitoEntrega) { registro.dataEntrega = ''; registro.data = ''; registro.dataPrevista = ''; }
            const dtColetaManual = data(registro.dataColeta);
            const dtEntregaManual = data(registro.dataEntrega || registro.data || registro.dataPrevista);
            const manualColetaPreenchida = conflitoColeta || preenchido(registro.dataColeta);
            const manualEntregaPreenchida = conflitoEntrega || preenchido(registro.dataEntrega || registro.data || registro.dataPrevista);
            const coletaManualVencida = !conflitoColeta && manualColetaPreenchida && (!dtColetaManual || dtColetaManual < hoje);
            const entregaManualVencida = !conflitoEntrega && manualEntregaPreenchida && (!dtEntregaManual || dtEntregaManual < hoje);
            let dtColetaPrevista = '', dtPrevisao = '', origemPrevisao = 'Sem previsão';
            let origemColetaPrevisao = 'Sem previsão';
            if (pendenteColeta > 0) {
                if (dtColetaManual && dtColetaManual >= hoje) {
                    dtColetaPrevista = dtColetaManual;
                    origemColetaPrevisao = 'Manual';
                } else if (!manualColetaPreenchida && dtColetaPCP >= hoje) {
                    dtColetaPrevista = dtColetaPCP;
                    origemColetaPrevisao = 'PCP original';
                } else if (conflitoColeta) origemColetaPrevisao = 'Previsões divergentes no grupo';
                else if (coletaManualVencida) origemColetaPrevisao = 'Manual vencida';
            }
            const previsoesEntrega = [];
            const adicionarEntrega = (dataPrevista, volume, origemPrevista) => {
                if (dataPrevista && dataPrevista >= hoje && volume > 0) {
                    previsoesEntrega.push({data: dataPrevista, volume, origem: origemPrevista});
                }
            };
            if (saldo > 0) {
                // Uma previsão manual altera somente o saldo A COLETAR.
                // A parcela com Coleta TP real conserva sua data de SLA original.
                let entregueConsumido = entregue, restanteColetado = aguardandoEntrega;
                eventosColeta.forEach(evento => {
                    const consumido = Math.min(evento.volume, entregueConsumido);
                    entregueConsumido -= consumido;
                    const aberto = Math.min(restanteColetado, Math.max(0, evento.volume - consumido));
                    restanteColetado -= aberto;
                    adicionarEntrega(entregaSLA(linha, evento.data), aberto, 'Coleta TP + SLA');
                });
                if (pendenteColeta > 0 && dtEntregaManual && dtEntregaManual >= hoje) {
                    adicionarEntrega(dtEntregaManual, pendenteColeta, 'Manual');
                } else if (pendenteColeta > 0 && !conflitoEntrega && !entregaManualVencida && dtColetaPrevista) {
                    adicionarEntrega(entregaSLA(linha, dtColetaPrevista), pendenteColeta,
                        origemColetaPrevisao === 'Manual' ? 'Coleta manual + SLA' : 'PCP original + SLA');
                }
            }
            previsoesEntrega.sort((a, b) => a.data.localeCompare(b.data));
            const previstoVolume = previsoesEntrega.reduce((s, p) => s + p.volume, 0);
            const semPrevisaoVolume = Math.max(0, saldo - previstoVolume);
            dtPrevisao = previsoesEntrega[0]?.data || '';
            const origensPrevistas = [...new Set(previsoesEntrega.map(p => p.origem))];
            origemPrevisao = conflitoEntrega ? 'Previsões divergentes no grupo' : origensPrevistas.length === 1 ? origensPrevistas[0]
                : origensPrevistas.length ? 'Múltiplas origens' : entregaManualVencida ? 'Manual vencida' : 'Sem previsão';
            const resumoPrevisoes = previsoesEntrega.map(p => `${p.data}: ${Math.round(p.volume)} (${p.origem})`).join(' / ');
            const clientePersonalizado = simNao(primeiro(linha, ['CLIENTE_PERSONALIZADO', 'Cliente personalizado']));
            const capaPersonalizada = simNao(primeiro(linha, ['CAPA_PERSONALIZADA', 'Capa personalizada']));
            const personalizado = clientePersonalizado === 'Sim' || capaPersonalizada === 'Sim' ? 'Sim'
                : clientePersonalizado === 'Não' && capaPersonalizada === 'Não' ? 'Não' : 'Não informado';
            const serie = typeof window.pgSerieCorrigidaFunil === 'function' ? window.pgSerieCorrigidaFunil(linha)
                : primeiro(linha, ['serie_corrigida', 'SERIE_CORRIGIDA', 'SÉRIE', 'Série', 'SERIE']);
            return {
                linha, chave, chavesOrigem, previsoesOrigem, conflitoColeta, conflitoEntrega,
                id: 'ecd-' + indice, cd, origem, grafica, sku, marca, serie: String(serie || ''),
                descricao: String(primeiro(linha, ['DESC_REAL', 'DESCRIÇÃO', 'DESCRICAO', 'PRODUTO'])),
                personalizado, clientePersonalizado, capaPersonalizada,
                tipo: String(primeiro(linha, ['TIPO', 'Tipo'])), envio, kit, op,
                total, coletado, entregue, saldo, aguardandoEntrega, pendenteColeta,
                excedente: Math.max(0, entregue - total),
                dtPlanoOriginal: dtEntregaPCP, dtColetaPCP, dtEntregaPCP,
                dtColetaManual, dtEntregaManual, dtColetaPrevista, origemColetaPrevisao,
                dtPrevisao, origemPrevisao, previsoesEntrega, resumoPrevisoes, semPrevisaoVolume,
                backlog: saldo > 0 && ((!!dtEntregaPCP && dtEntregaPCP < hoje) || (!!dtColetaPCP && dtColetaPCP < hoje)),
                semPrevisao: semPrevisaoVolume > 0,
                status: saldo === 0 ? 'Coletado e entregue'
                    : coletado > entregue ? 'Coletado e aguardando entrega' : 'Pendente',
                datasColeta, datasEntrega, eventosColeta, eventosEntrega,
                previsao: {...registro, dataColeta: dtColetaManual, dataEntrega: dtEntregaManual,
                    observacao: String(registro.observacao || '')}
            };
        });
    }

    function quadro(itens, inicio, fim) {
        inicio = data(inicio); fim = data(fim);
        if (!inicio || !fim || inicio > fim) throw new Error('Informe um período válido.');
        const dias = [];
        for (let dia = inicio; dia <= fim; dia = proximoDia(dia)) dias.push(dia);
        const cds = Array.from(new Set((itens || []).map(i => i.cd || 'CD não informado')))
            .sort((a, b) => a.localeCompare(b, 'pt-BR', {numeric: true}));
        const indicadores = ['Coleta PCP original', 'Entrega PCP + SLA original', 'Coletado TP', 'Entregue TP',
            'Coleta prevista (saldo)', 'Entrega prevista (saldo)', 'Saldo sem previsão'];
        const linhas = [];
        ['TOTAL GERAL', ...cds].forEach(cd => {
            const grupo = cd === 'TOTAL GERAL' ? (itens || []) : (itens || []).filter(i => (i.cd || 'CD não informado') === cd);
            indicadores.forEach(indicador => {
                const r = {cd, indicador, total: 0, antes: 0, depois: 0, semData: 0, valores: dias.map(() => 0)};
                const somar = (dt, quantidade) => {
                    const volume = numero(quantidade);
                    if (!volume) return;
                    r.total += volume;
                    if (!dt) r.semData += volume;
                    else if (dt < inicio) r.antes += volume;
                    else if (dt > fim) r.depois += volume;
                    else r.valores[dias.indexOf(dt)] += volume;
                };
                grupo.forEach(item => {
                    if (indicador === 'Coleta PCP original') somar(item.dtColetaPCP, item.total);
                    else if (indicador === 'Entrega PCP + SLA original') somar(item.dtEntregaPCP, item.total);
                    else if (indicador === 'Coletado TP') item.eventosColeta.forEach(e => somar(e.data, e.volume));
                    else if (indicador === 'Entregue TP') item.eventosEntrega.forEach(e => somar(e.data, e.volume));
                    else if (indicador === 'Coleta prevista (saldo)') somar(item.dtColetaPrevista, item.pendenteColeta);
                    else if (indicador === 'Entrega prevista (saldo)') item.previsoesEntrega.forEach(p => somar(p.data, p.volume));
                    else somar('', item.semPrevisaoVolume);
                });
                linhas.push(r);
            });
        });
        return {dias, linhas};
    }

    function exportar(itens, inicio, fim) {
        const q = quadro(itens, inicio, fim);
        const quadroCabecalho = ['CD', 'Indicador', 'Total da base', 'Antes do período', ...q.dias, 'Depois do período', 'Sem data'];
        const baseCabecalho = ['SKU', 'Marca', 'Série', 'Descrição', 'Personalizado', 'Tipo', 'Status',
            'Coleta TP (datas reais)', 'Entrega TP (datas reais)', 'CD destino', 'Origem', 'Gráfica', 'Envio', 'Kit', 'OP',
            'Tiragem base CD', 'Coletado', 'Entregue', 'Saldo a entregar', 'Aguardando entrega', 'Pendente de coleta',
            'Excedente de entrega', 'Coleta PCP original', 'Entrega PCP + SLA original', 'Coleta manual', 'Entrega manual',
            'Coleta prevista vigente', 'Entrega prevista vigente', 'Origem da previsão', 'Observação',
            'Cliente personalizado', 'Capa personalizada', 'Backlog', 'Sem previsão', 'Chave da previsão',
            'Origem coleta vigente', 'Parcelas de entrega previstas', 'Saldo sem previsão', 'Versão da previsão',
            'Atualizada em', 'Usuário da previsão', 'Parcelas Coleta TP (data: volume)',
            'Parcelas Entrega TP (data: volume)'];
        return [{
            nome: 'Quadro', cabecalho: quadroCabecalho,
            linhas: q.linhas.map(r => [r.cd, r.indicador, r.total, r.antes, ...r.valores, r.depois, r.semData]),
            colunasData: [], colunasNumero: quadroCabecalho.map((_, i) => i).filter(i => i >= 2)
        }, {
            nome: 'Base_SKUs', cabecalho: baseCabecalho,
            linhas: (itens || []).map(i => [i.sku, i.marca, i.serie, i.descricao, i.personalizado, i.tipo, i.status,
                i.datasColeta.join(' / '), i.datasEntrega.join(' / '), i.cd, i.origem, i.grafica, i.envio, i.kit, i.op,
                i.total, i.coletado, i.entregue, i.saldo, i.aguardandoEntrega, i.pendenteColeta, i.excedente,
                i.dtColetaPCP, i.dtEntregaPCP, i.dtColetaManual, i.dtEntregaManual, i.dtColetaPrevista, i.dtPrevisao,
                i.origemPrevisao, i.previsao.observacao, i.clientePersonalizado, i.capaPersonalizada,
                i.backlog ? 'Sim' : 'Não', i.semPrevisao ? 'Sim' : 'Não', i.chave,
                i.origemColetaPrevisao, i.resumoPrevisoes, i.semPrevisaoVolume,
                Number(i.previsao.versao || 0), i.previsao.atualizadoEm || '', i.previsao.usuario || '',
                i.eventosColeta.map(e => `${e.data}: ${Math.round(e.volume)}`).join(' / '),
                i.eventosEntrega.map(e => `${e.data}: ${Math.round(e.volume)}`).join(' / ')]),
            colunasData: [22, 23, 24, 25, 26, 27],
            colunasNumero: [15, 16, 17, 18, 19, 20, 21,
                baseCabecalho.indexOf('Saldo sem previsão'), baseCabecalho.indexOf('Versão da previsão')]
        }];
    }
    function chaveDaLinha(linha) {
        return JSON.stringify(['ECD1', temFonteAcabadora(linha) ? 'ACABADORA' : 'PCP',
            primeiro(linha, ['MARCA_FINAL', 'UNIDADE', 'MARCA']),
            primeiro(linha, ['GRAFICA_FINAL', 'GRÁFICA', 'GRAFICA', 'BQ']),
            primeiro(linha, ['SKU_REAL', 'SKU']),
            primeiro(linha, ['CD_FINAL', 'CD DESTINO', 'CD_DESTINO', 'CD', 'CK']),
            primeiro(linha, ['ENVIO', 'Envio']), primeiro(linha, ['JOIN_KEY', 'JOIN KEY']),
            primeiro(linha, ['KIT', 'Kit']), primeiro(linha, ['OP', 'O.P.'])].map(normal));
    }
    // Uma parcela representa um movimento real ou o saldo que ainda aguarda coleta.
    // O plano permanece inteiro no denominador, inclusive as parcelas em backlog.
    function calendario(itens, config = {}, filtros = {}) {
        const hoje = data(config.hoje), inicioExplicito = preenchido(config.inicio);
        const inicio = inicioExplicito ? data(config.inicio) : hoje;
        const fim = data(config.fim || (hoje?.slice(0, 4) + '-12-02'));
        if (!hoje || !inicio || !fim || fim < inicio) throw new Error('Defina um período com início e fim válidos.');
        if (Date.parse(fim) - Date.parse(inicio) > 369 * 86400000) throw new Error('Selecione um ciclo de até 370 dias.');
        itens = itens || [];
        const feriados = new Set((config.feriados || ['11-02', '11-20']).map(d => d.length === 5 ? hoje.slice(0, 4) + '-' + d : d));
        const domingo = d => new Date(d + 'T12:00:00Z').getUTCDay() === 0;
        const ajustarDia = d => {
            if (!d) return '';
            let limite = 0;
            while ((domingo(d) || feriados.has(d)) && limite++ < 370) d = proximoDia(d);
            return d;
        };
        const dias = [], semanas = [];
        const datasReais = new Set(itens.flatMap(item => item.eventosEntrega.map(e => e.data)));
        for (let dia = inicio, limite = 0; dia <= fim && limite++ < 370; dia = proximoDia(dia)) {
            // O histórico preserva uma entrega real no domingo na sua própria data.
            // O contrato anterior, sem início explícito, mantém a regra operacional.
            if (domingo(dia) && !(inicioExplicito && datasReais.has(dia))) continue;
            dias.push({data: dia, feriado: feriados.has(dia)});
            const segunda = new Date(dia + 'T12:00:00Z');
            segunda.setUTCDate(segunda.getUTCDate() - ((segunda.getUTCDay() + 6) % 7));
            const semana = segunda.toISOString().slice(0, 10);
            if (semanas.at(-1)?.chave !== semana) semanas.push({chave: semana, inicio: dia, fim: dia, tamanho: 0});
            semanas.at(-1).fim = dia; semanas.at(-1).tamanho++;
        }
        const parcelas = [];
        const adicionar = (item, volume, status, dt, coletaReal, coletaPrevista, fonte) => {
            volume = Math.max(0, volume);
            if (!volume) return;
            const entregue = status === 'ENTREGUE';
            const dataOriginal = dt || '';
            const dia = entregue ? (dt < inicio || !inicioExplicito && dt === hoje && domingo(hoje) ? 'entregue' : dt) : ajustarDia(dt);
            const manualVigente = status === 'AGUARDANDO' && item.dtEntregaManual && item.dtEntregaManual >= hoje;
            const atrasoColeta = status === 'AGUARDANDO' && coletaPrevista && coletaPrevista < hoje;
            // O fim selecionado limita apenas o que se vê no calendário.
            // Uma previsão futura fora da tela continua programada, não vira backlog.
            const backlog = !entregue && (!dt || dt < hoje || (atrasoColeta && !manualVigente));
            const p = {item, chave: item.chave, sku: item.sku, descricao: item.descricao, marca: item.marca,
                serie: item.serie, cd: item.cd, grafica: item.grafica, personalizado: item.personalizado,
                tipo: item.tipo, volume, status, backlog, riscoColetaSLA: !!atrasoColeta, dia: backlog ? '' : dia, dataOriginal,
                coletaReal: coletaReal || '', coletaPrevista: coletaPrevista || '', fonteColeta: coletaReal ? 'TP' : entregue
                    ? item.datasColeta.length ? 'TP (sem vínculo de parcela)' : 'Não informada' : item.dtColetaManual ? 'Manual' : 'PCP',
                fonteEntrega: fonte || (item.dtEntregaManual ? 'Manual' : 'SLA'),
                motivo: !entregue && (item.conflitoEntrega || item.conflitoColeta && !item.dtEntregaManual)
                    ? 'Previsões divergentes no grupo'
                    : dia > fim ? 'Após o fim do ciclo' : !dt ? 'Sem previsão' : atrasoColeta && !manualVigente ? 'Coleta atrasada' : 'Previsão vencida'};
            if (filtros.cd && p.cd !== filtros.cd || filtros.marca && p.marca !== filtros.marca ||
                filtros.serie && p.serie !== filtros.serie || filtros.status && p.status !== filtros.status) return;
            parcelas.push(p);
        };
        (itens || []).forEach(item => {
            let limiteEntrega = item.total;
            item.eventosEntrega.forEach(e => {
                const v = Math.min(limiteEntrega, e.volume); limiteEntrega -= v;
                const correspondente = item.eventosColeta.find(c => preenchido(e.linhaMapa) && c.linhaMapa === e.linhaMapa || preenchido(e.id) && c.id === e.id);
                const coleta = correspondente?.data || (item.datasColeta.length === 1 ? item.datasColeta[0] : '');
                adicionar(item, v, 'ENTREGUE', e.data, coleta, '', 'TP');
            });
            let entregueConsumido = Math.min(item.total, item.entregue);
            let restanteColetado = Math.min(Math.max(0, item.total - item.entregue), item.aguardandoEntrega);
            item.eventosColeta.forEach(e => {
                const consumido = Math.min(e.volume, entregueConsumido); entregueConsumido -= consumido;
                const aberto = Math.min(restanteColetado, Math.max(0, e.volume - consumido)); restanteColetado -= aberto;
                adicionar(item, aberto, 'TRANSITO', entregaSLA(item.linha, e.data), e.data, '', 'Coleta TP + SLA');
            });
            const coleta = item.dtColetaManual || item.dtColetaPCP;
            adicionar(item, item.pendenteColeta, 'AGUARDANDO', item.conflitoEntrega || item.conflitoColeta && !item.dtEntregaManual ? '' : item.dtEntregaManual || entregaSLA(item.linha, coleta), '', coleta,
                item.dtEntregaManual ? 'Manual' : 'SLA');
        });
        const agrupar = detalhado => {
            const grupos = new Map();
            parcelas.forEach(p => {
                const k = JSON.stringify([p.marca, detalhado ? p.serie : '', p.cd]);
                if (!grupos.has(k)) grupos.set(k, {marca: p.marca, serie: detalhado ? p.serie : '', cd: p.cd, total: 0, entregue: 0, entregueAteOntem: 0, acumuladoAnterior: 0, realCD: 0, entregueHoje: 0,
                    backlog: 0, dias: Object.create(null), riscos: Object.create(null), parcelas: []});
                const g = grupos.get(k); g.total += p.volume; g.parcelas.push(p);
                if (p.status === 'ENTREGUE') {
                    g.realCD += p.volume;
                    if (p.dataOriginal < hoje) g.entregueAteOntem += p.volume;
                    if (p.dataOriginal === hoje) g.entregueHoje += p.volume;
                }
                if (!p.backlog && (p.dia === 'entregue' || p.dia && p.dia < inicio)) g.acumuladoAnterior += p.volume;
                if (p.riscoColetaSLA && p.coletaPrevista) (g.riscos[p.coletaPrevista < inicio ? inicio : p.coletaPrevista] ||= []).push(p);
                if (p.backlog) g.backlog += p.volume;
                else if (p.dia === 'entregue') g.entregue += p.volume;
                else { if (!g.dias[p.dia]) g.dias[p.dia] = []; g.dias[p.dia].push(p); }
            });
            // Ocultar uma linha concluída é somente apresentação: a base e o
            // total geral continuam com todos os materiais e movimentos.
            return [...grupos.values()].filter(g => !filtros.ocultarConcluidos || g.entregueAteOntem < g.total)
                .sort((a, b) => (a.marca.localeCompare(b.marca, 'pt-BR', {numeric: true}) ||
                a.serie.localeCompare(b.serie, 'pt-BR', {numeric: true}) || a.cd.localeCompare(b.cd, 'pt-BR', {numeric: true})));
        };
        const total = {marca: 'Total geral', total: 0, entregue: 0, entregueAteOntem: 0, acumuladoAnterior: 0, realCD: 0, entregueHoje: 0, backlog: 0, dias: Object.create(null), riscos: Object.create(null), parcelas};
        parcelas.forEach(p => {
            total.total += p.volume;
            if (p.status === 'ENTREGUE') {
                total.realCD += p.volume;
                if (p.dataOriginal < hoje) total.entregueAteOntem += p.volume;
                if (p.dataOriginal === hoje) total.entregueHoje += p.volume;
            }
            if (!p.backlog && (p.dia === 'entregue' || p.dia && p.dia < inicio)) total.acumuladoAnterior += p.volume;
            if (p.riscoColetaSLA && p.coletaPrevista) (total.riscos[p.coletaPrevista] ||= []).push(p);
            if (p.backlog) total.backlog += p.volume;
            else if (p.dia === 'entregue') total.entregue += p.volume;
            else { if (!total.dias[p.dia]) total.dias[p.dia] = []; total.dias[p.dia].push(p); }
        });
        return {hoje, inicio, fim, dias, semanas, incluiHojeEntregue: !inicioExplicito && domingo(hoje), parcelas, backlog: parcelas.filter(p => p.backlog),
            marcaCD: agrupar(false), marcaSerieCD: agrupar(true), total};
    }
    function exportarCalendario(c) {
        const aba = (nome, linhas, detalhado) => {
            const cabecalho = ['Marca', ...(detalhado ? ['Série'] : []), 'CD', 'Plano', 'Backlog', 'Entregue', '% entregue',
                ...c.dias.flatMap(d => [d.data + (d.feriado ? ' (feriado)' : ''), '% acumulado ' + d.data])];
            const valores = g => {
                let acumulado = g.acumuladoAnterior ?? g.entregue;
                const entregueAtual = g.entregueAteOntem ?? g.entregue;
                return [g.marca, ...(detalhado ? [g.serie || ''] : []), g.cd || '', g.total, g.backlog, entregueAtual,
                    g.total ? entregueAtual / g.total : 0, ...c.dias.flatMap(d => {
                        const v = (g.dias[d.data] || []).reduce((s, p) => s + p.volume, 0); acumulado += v;
                        return [v, g.total ? acumulado / g.total : 0];
                    })];
            };
            return {nome, cabecalho, linhas: [...linhas, c.total].map(valores),
                colunasPercentual: cabecalho.map((titulo, i) => titulo.startsWith('%') ? i : -1).filter(i => i >= 0),
                colunasNumero: cabecalho.map((_, i) => i).filter(i => i >= (detalhado ? 3 : 2))};
        };
        const cabecalho = ['SKU', 'Marca', 'Série', 'Descrição do SKU', 'Personalizado (S/N)', 'Aluno/Professor', 'CD', 'Gráfica',
            'Status', 'Data coleta TP', 'Data entrega TP', 'Prev. coleta', 'Fonte coleta', 'Prev. entrega', 'Fonte entrega', 'Quantidade', 'Data no quadro', 'Pendência', 'Coletas TP do item (auditoria)',
            'Origem', 'Envio', 'Kit', 'OP', 'Tiragem base CD', 'Coletado', 'Entregue', 'Saldo a entregar',
            'Aguardando entrega', 'Pendente de coleta', 'Excedente de entrega', 'Coleta PCP original',
            'Entrega PCP + SLA original', 'Coleta manual', 'Entrega manual', 'Coleta prevista vigente',
            'Entrega prevista vigente', 'Origem da previsão', 'Observação', 'Cliente personalizado',
            'Capa personalizada', 'Chave da previsão', 'Origem coleta vigente', 'Parcelas de entrega previstas',
            'Saldo sem previsão', 'Versão da previsão', 'Atualizada em', 'Usuário da previsão',
            'Entregas TP do item (auditoria)', 'Chaves de origem', 'Previsões individuais do grupo', 'Linhas de origem'];
        return [aba('Quadro_Marca_CD', c.marcaCD, false), aba('Quadro_Marca_Serie_CD', c.marcaSerieCD, true), {
            nome: 'Base_SKUs', cabecalho, linhas: c.parcelas.map(p => [p.sku, p.marca, p.serie, p.descricao,
                p.personalizado === 'Sim' ? 'S' : p.personalizado === 'Não' ? 'N' : '', p.tipo, p.cd, p.grafica,
                p.backlog ? 'Backlog' : p.status === 'ENTREGUE' ? 'Coletado e entregue' : p.status === 'TRANSITO' ? 'Coletado aguardando entrega' : 'Pendente',
                p.coletaReal, p.status === 'ENTREGUE' ? p.dataOriginal : '', p.coletaPrevista, p.fonteColeta,
                p.status === 'ENTREGUE' ? '' : p.dataOriginal, p.fonteEntrega, p.volume, p.dia === 'entregue' ? '' : p.dia,
                p.backlog ? p.motivo : '', p.item.eventosColeta.map(e => e.data + ': ' + Math.round(e.volume)).join(' / '),
                p.item.origem, p.item.envio, p.item.kit, p.item.op, p.item.total, p.item.coletado, p.item.entregue,
                p.item.saldo, p.item.aguardandoEntrega, p.item.pendenteColeta, p.item.excedente,
                p.item.dtColetaPCP, p.item.dtEntregaPCP, p.item.dtColetaManual, p.item.dtEntregaManual,
                p.item.dtColetaPrevista, p.item.dtPrevisao, p.item.origemPrevisao, p.item.previsao.observacao,
                p.item.clientePersonalizado, p.item.capaPersonalizada, p.item.chave, p.item.origemColetaPrevisao,
                p.item.resumoPrevisoes, p.item.semPrevisaoVolume, Number(p.item.previsao.versao || 0),
                p.item.previsao.atualizadoEm || '', p.item.previsao.usuario || '',
                p.item.eventosEntrega.map(e => e.data + ': ' + Math.round(e.volume)).join(' / '),
                p.item.chavesOrigem.join(' / '),
                JSON.stringify(Object.entries(p.item.previsoesOrigem).map(([chave, r]) => ({chave,
                    coleta: r.dataColeta || '', entrega: r.dataEntrega || r.data || r.dataPrevista || '',
                    observacao: String(r.observacao || ''), versao: Number(r.versao || 0),
                    atualizadoEm: r.atualizadoEm || ''}))),
                JSON.stringify((p.item.linha._PG_MA?.linhas || [p.item.linha]).map(l => ({
                    sku: primeiro(l, ['SKU_REAL', 'SKU']), kit: primeiro(l, ['KIT', 'Kit']),
                    op: primeiro(l, ['OP', 'O.P.']), chave: chaveDaLinha(l)})))]),
            colunasData: [9, 10, 11, 13, 16, 30, 31, 32, 33, 34, 35],
            colunasNumero: [15, 23, 24, 25, 26, 27, 28, 29, 43, 44]}];
    }
    window.pgEntregasCDModelo = {montar, quadro, exportar, chave: chaveDaLinha, calendario, exportarCalendario};
})();
