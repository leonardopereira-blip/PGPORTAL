name: Atualizar ambiente de testes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.gs'
      - '*.js'
      - '*.html'
      - appsscript.json
      - .clasp.json
      - PUBLICAR_DEV.json
      - .github/pgportal-base-google.json
      - .github/workflows/atualizar-testes.yml

permissions:
  contents: write

concurrency:
  group: pgportal-testes
  cancel-in-progress: false

jobs:
  atualizar:
    if: ${{ github.ref == 'refs/heads/main' && vars.PGPORTAL_TESTES_ATIVO == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar destino de testes e autenticacao
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          TEST_SCRIPT_ID: ${{ vars.PGPORTAL_TESTES_SCRIPT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          const scriptId = (process.env.TEST_SCRIPT_ID || '').trim();
          if (!/^[A-Za-z0-9_-]{20,}$/.test(scriptId)) {
            throw new Error('Configure PGPORTAL_TESTES_SCRIPT_ID com o ID confirmado do projeto de testes.');
          }
          if (!process.env.CLASPRC_JSON) {
            throw new Error('Configure o segredo CLASPRC_JSON para autorizar o envio aos testes.');
          }
          let auth;
          try {
            auth = JSON.parse(process.env.CLASPRC_JSON);
          } catch {
            throw new Error('O segredo CLASPRC_JSON precisa conter JSON valido.');
          }
          const refreshToken = auth?.tokens?.default?.refresh_token || auth?.token?.refresh_token || auth?.refresh_token;
          if (!refreshToken) {
            throw new Error('CLASPRC_JSON precisa de refresh_token renovavel; um access_token temporario nao sustenta a automacao.');
          }
          const config = JSON.parse(fs.readFileSync('.clasp.json', 'utf8'));
          config.scriptId = scriptId;
          config.rootDir = '.';
          config.skipSubdirectories = true;
          fs.writeFileSync('.clasp.json', JSON.stringify(config));
          fs.writeFileSync(path.join(os.homedir(), '.clasprc.json'), JSON.stringify(auth), {mode: 0o600});
          NODE

      - name: Conciliar Google com GitHub, preservar alterações de outros usuários e publicar DEV
        run: node .github/pgportal-conciliar-dev.mjs

      - name: Remover autenticacao temporaria
        if: always()
        run: rm -f "$HOME/.clasprc.json"
