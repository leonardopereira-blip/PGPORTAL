<style>
#abaEficiencia .ef-contribution{display:flex;gap:10px;align-items:center;justify-content:flex-end}
#abaEficiencia .ef-contribution-bar{width:70px;height:6px;background:#edf2f7;border-radius:4px;overflow:hidden}
#abaEficiencia .ef-contribution-bar i{display:block;height:100%;background:#FA4616;border-radius:4px}
</style>
<div class="ef-panel">
  <div class="ef-toolbar"><div><h3>Participação no atraso</h3><p class="ef-muted" id="efAgingConcentracaoTexto">Peso por gráfica no atraso da visão selecionada: tiragem × dias.</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="ef-button active" id="efAgingConcGrafica" onclick="pgEfAgingConcentracaoModo('grafica')">Gráfica</button><button type="button" class="ef-button" id="efAgingConcMarca" onclick="pgEfAgingConcentracaoModo('marca')">Marca</button></div>
  </div>
  <div class="ef-scroll"><table class="ef-table"><thead><tr><th id="efAgingConcentracaoGrupo">Gráfica</th><th>Tiragem avaliada</th><th>Tiragem atrasada</th><th>% atrasado</th><th>Dias médios · fora</th><th>Peso no atraso</th></tr></thead><tbody id="efAgingConcentracao"></tbody></table></div>
</div>
<script>
(function(){'use strict';var estado={registros:[],modo:'grafica'};function el(id){return document.getElementById(id)}function txt(id,v){var e=el(id);if(e)e.textContent=v}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function qty(r){var v=Number(r.volume);return Number.isFinite(v)&&v>0?v:0}function inteiro(v){return Math.round(v||0).toLocaleString('pt-BR')}function decimal(v){return v==null||!Number.isFinite(v)?'—':v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})}function campo(l,nomes){l=l||{};var norm=function(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toUpperCase()};for(var i=0;i<nomes.length;i++){var nome=nomes[i],valor=l[nome];if((valor===undefined||valor===null||String(valor).trim()==='')&&window.pgCampoPrazoV35)valor=window.pgCampoPrazoV35(l,nome);if(valor===undefined||valor===null||String(valor).trim()===''){var k=Object.keys(l).find(function(x){return norm(x)===norm(nome)});valor=k===undefined?null:l[k]}if(valor!==undefined&&valor!==null&&String(valor).trim()!=='')return String(valor).trim()}return'Sem informação'}function grupo(r){return estado.modo==='marca'?campo(r.linha,['MARCA_FINAL','UNIDADE','MARCA']):campo(r.linha,['GRAFICA_FINAL','GRÁFICA','GRAFICA','FORNECEDOR'])}function render(){var tbody=el('efAgingConcentracao');if(!tbody)return;var rotulo=estado.modo==='marca'?'Marca':'Gráfica';txt('efAgingConcentracaoGrupo',rotulo);txt('efAgingConcentracaoTexto','Peso por '+rotulo.toLowerCase()+' no atraso da visão selecionada: tiragem × dias.');var grupos=new Map(),impactoTotal=0;estado.registros.forEach(function(r){var v=qty(r);if(typeof r.dias!=='number'||!Number.isFinite(r.dias)||!v)return;var nome=grupo(r),g=grupos.get(nome);if(!g){g={nome:nome,volume:0,atrasado:0,impacto:0};grupos.set(nome,g)}g.volume+=v;if(r.dias>0){g.atrasado+=v;g.impacto+=v*r.dias;impactoTotal+=v*r.dias}});var lista=Array.from(grupos.values()).sort(function(a,b){return b.impacto-a.impacto||b.volume-a.volume||a.nome.localeCompare(b.nome,'pt-BR')});tbody.innerHTML=lista.length?lista.map(function(g){var share=impactoTotal>0?100*g.impacto/impactoTotal:0;return'<tr><td>'+esc(g.nome)+'</td><td>'+inteiro(g.volume)+'</td><td>'+inteiro(g.atrasado)+'</td><td>'+decimal(g.volume?100*g.atrasado/g.volume:0)+'%</td><td>'+(g.atrasado?decimal(g.impacto/g.atrasado)+' d':'—')+'</td><td><span class="ef-contribution"><span class="ef-contribution-bar"><i style="width:'+share.toFixed(3)+'%"></i></span>'+decimal(share)+'%</span></td></tr>'}).join(''):'<tr><td colspan="6" class="ef-muted">Nenhum volume com atraso calculável nesta seleção.</td></tr>';var bg=el('efAgingConcGrafica'),bm=el('efAgingConcMarca');if(bg)bg.classList.toggle('active',estado.modo==='grafica');if(bm)bm.classList.toggle('active',estado.modo==='marca')}window.pgEfAgingConcentracaoModo=function(m){if(m!=='grafica'&&m!=='marca')return;estado.modo=m;render()};window.pgEfAgingExtras=function(modelo,registros){estado.registros=Array.isArray(registros)?registros:[];render()}})();
</script>
