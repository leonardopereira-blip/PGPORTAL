<script>
(function () {
    'use strict';
    const estado = { dados: null, grupos: [], pagina: 0, carregando: null, erro: '',
        selecoes: { grafica: null, marca: null, destino: null }, tipoDestino: '' };
    const $ = id => document.getElementById(id);
    const texto = valor => Array.isArray(valor) ? valor.join(', ') : String(valor ?? '').trim();
    const chave = valor => texto(valor).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
    const numero = valor => Number.isFinite(Number(valor)) ? Number(valor) : 0;
    const fmt = valor => Math.ceil(numero(valor)).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
    const esc = valor => texto(valor).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const rotulos = { OK: 'Dados iguais ao PCP', SEM_PCP: 'SKU fora do PCP', DADOS_DIFERENTES: 'Dados diferentes',
        SEM_IDENTIDADE: 'Dados faltando no mapa', SEM_MAPA: 'PCP sem mapa' };
    const status = g => g.statusComparacao || 'SEM_IDENTIDADE';
    const skuNoPCP = g => status(g) !== 'SEM_MAPA' && Boolean(texto(g.sku) && texto(g.sku) !== '-' &&
        (g.candidatosPCP || []).length);
    const dadosDivergentes = g => skuNoPCP(g) && !(g.candidatosPCP || []).some(c =>
        ['destino','grafica','marca'].every(campo => texto(c[campo]) === texto(g[campo])));
    const identidadeCompleta = g => ['sku','destino','grafica','marca'].every(campo =>
        texto(g[campo]) && texto(g[campo]) !== '-');
    const linhasPCP = g => (g.linhasPCP || []).map(l => typeof l === 'object'
        ? [l.origem, l.linha && 'linha ' + l.linha].filter(Boolean).join(' ') : texto(l)).join(', ');
    const horario = valor => valor ? new Date(valor).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' }) : '';
    const contexto = g => (g.candidatosPCP || []).map(c => [c.origem || c.origemPCP, c.linha && 'linha ' + c.linha,
        c.grafica, c.marca, c.destino, c.envio].filter(Boolean).join(' / ')).join(' | ');
    const comparacoes = g => (g.comparacoesPCP || []).map(c => [c.origem,c.statusColeta,
        'Tiragem ' + (c.volumeEsperadoPCP == null ? 'não informada' : fmt(c.volumeEsperadoPCP)),
        'Tiragem coletada ' + (c.volumeColetadoPCP == null ? 'não informada' : fmt(c.volumeColetadoPCP)),
        'Tiragem a mais ' + fmt(c.volumeAMais),'Tiragem a menos ' + fmt(c.volumeAMenos)].join(' / ')).join(' | ');
    const linhasFiltro = new WeakMap();
    const fonte = valor => chave(valor).includes('ACAB') ? 'ACABADORA' : 'PCP';
    function linhaFiltro(g) {
        if (linhasFiltro.has(g)) return linhasFiltro.get(g);
        const referencias = (g.linhasPCP || []).filter(r => r && typeof r === 'object');
        // A comparação principal também prefere PCP quando está nas duas abas.
        const ref = referencias.find(r => fonte(r.origem) === 'PCP') || referencias[0];
        const origem = ref ? fonte(ref.origem) : chave(g.origemPCP).split(/\s*\/\s*/).includes('PCP') ? 'PCP' : fonte(g.origemPCP);
        const linha = { _SOURCE: origem, GRAFICA_FINAL: g.grafica, UNIDADE: g.marca,
            CD_MAPA: g.destino, 'CD DESTINO': g.destino };
        linhasFiltro.set(g, linha);
        return linha;
    }
    function doTipoDestino(g) {
        const tipo = $('pgMapaTipoDestino').value;
        if (tipo === 'TODOS') return true;
        const linha = linhaFiltro(g);
        return tipo === 'ACAB' ? window.pgEhDestinoAcabadora(linha) : window.pgEhDestinoCD(linha);
    }
    function aviso(mensagem) {
        const el = $('pgMapaAviso');
        if (el) { el.textContent = mensagem || ''; el.classList.toggle('hidden', !mensagem); }
    }
    function rpc(nome, ...args) {
        return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[nome](...args));
    }
    function ocupado(valor) {
        if ($('pgMapaAtualizar')) {
            $('pgMapaAtualizar').disabled = valor;
            $('pgMapaAtualizar').textContent = valor ? 'Carregando…' : 'Atualizar acompanhamento';
        }
        if ($('pgMapaBaixar')) $('pgMapaBaixar').disabled = valor || !estado.dados;
    }
    function validar(dados) {
        if (typeof dados === 'string') dados = JSON.parse(dados);
        if (!dados || dados.disponivel === false || dados.erro || dados._ERRO_CRITICO || !Array.isArray(dados.grupos) || !Array.isArray(dados.detalhes)) {
            throw new Error(dados?.erro || dados?._ERRO_CRITICO || dados?.mensagem || 'Acompanhamento indisponível. Atualize os caches do mapa e do PCP.');
        }
        return dados;
    }
    function caixasFiltro(campo) {
        return [...document.querySelectorAll('#pgMapaOpcoes-' + campo + ' input[type="checkbox"]')];
    }
    function opcoes(campo) {
        let selecionadas = estado.selecoes[campo];
        const valores = [...new Set(estado.dados.grupos.filter(doTipoDestino).map(g => texto(g[campo])))].sort((a,b) => a.localeCompare(b, 'pt-BR'));
        if (selecionadas?.size && !valores.some(v => selecionadas.has(v))) selecionadas = null;
        $('pgMapaOpcoes-' + campo).innerHTML = valores.map(v => '<label class="pg-am-opcao"><input type="checkbox" value="' + esc(v) + '" ' +
            (!selecionadas || selecionadas.has(v) ? 'checked ' : '') + 'onchange="pgFiltrarAcompanhamentoMapa()"><span>' + esc(v || 'Não informado') + '</span></label>').join('');
        const busca = $('pgMapaBusca-' + campo);
        if (busca) busca.value = '';
    }
    function lerSelecoes() {
        ['grafica','marca','destino'].forEach(campo => {
            const caixas = caixasFiltro(campo), marcadas = caixas.filter(cb => cb.checked);
            estado.selecoes[campo] = marcadas.length === caixas.length ? null : new Set(marcadas.map(cb => cb.value));
            $('pgMapaRotulo-' + campo).textContent = marcadas.length === caixas.length ? (campo === 'destino' ? 'Todos' : 'Todas') : marcadas.length === 1
                ? (marcadas[0].value || 'Não informado') : marcadas.length + (campo === 'destino' ? ' selecionados' : ' selecionadas');
        });
    }
    window.pgMarcarFiltroMapa = function(campo, marcar) {
        caixasFiltro(campo).forEach(cb => cb.checked = marcar);
        window.pgFiltrarAcompanhamentoMapa();
    };
    window.pgBuscarFiltroMapa = function(campo, busca) {
        caixasFiltro(campo).forEach(cb => cb.closest('label').hidden = !chave(cb.value || 'Não informado').includes(chave(busca)));
    };
    document.addEventListener('click', function(e) {
        const menu = e.target.closest('#abaColetas .pg-am-multifiltro');
        document.querySelectorAll('#abaColetas .pg-am-multifiltro[open]').forEach(el => { if (el !== menu) el.open = false; });
    });
    async function carregar(atualizar) {
        if (estado.carregando) return estado.carregando;
        estado.carregando = (async () => {
            ocupado(true); aviso('');
            try {
                if (atualizar) await rpc('atualizarAcompanhamentoMapa');
                estado.dados = validar(await rpc('getAcompanhamentoMapa'));
                estado.erro = '';
                estado.tipoDestino = $('pgMapaTipoDestino').value;
                ['grafica','marca','destino'].forEach(opcoes);
                const atualizado = horario(estado.dados.geradoEm);
                $('pgMapaAtualizacao').textContent = (atualizado ? 'Conferido em ' + atualizado + '.' : '') + ' Visão geral, sem recorte de data.';
                window.pgFiltrarAcompanhamentoMapa();
                aviso((estado.dados.alertas || []).map(a => a?.tipo === 'QUANTIDADE_MAPA_AUSENTE'
                    ? 'Há tiragem ausente ou inválida no mapa; os totais incluem somente quantidades informadas.'
                    : typeof a === 'string' ? a : a.mensagem || '').filter(Boolean).join(' '));
            } catch (e) {
                estado.erro = e?.message || String(e);
                // Uma falha não permite baixar a base anterior como se estivesse atualizada.
                estado.dados = null; estado.grupos = [];
                $('pgMapaCards').innerHTML = ''; $('pgMapaResumo').innerHTML = '';
                $('pgMapaDetalhes').innerHTML = '<tr><td colspan="16" class="p-5 text-slate-500">Acompanhamento indisponível.</td></tr>';
                $('pgMapaContagem').textContent = ''; $('pgMapaPagina').textContent = '';
                aviso(estado.erro);
            } finally { ocupado(false); estado.carregando = null; }
        })();
        return estado.carregando;
    }
    window.renderizarDashColetas = function () {
        if (!$('abaColetas')) return;
        if (estado.dados) window.pgFiltrarAcompanhamentoMapa();
        else if (!estado.erro) carregar(false);
    };
    window.pgAtualizarAcompanhamentoMapa = () => carregar(true);
    function selecionados() {
        const problema = $('pgMapaFiltroProblema').value, busca = chave($('pgMapaBusca').value);
        return estado.dados.grupos.filter(g => {
            if (!doTipoDestino(g)) return false;
            if (!['grafica','marca','destino'].every(campo => !estado.selecoes[campo] || estado.selecoes[campo].has(texto(g[campo])))) return false;
            if (problema === 'MAIS' && !chave(g.statusColeta).includes('MAIS')) return false;
            if (problema === 'MENOS' && !chave(g.statusColeta).includes('MENOS')) return false;
            if (problema === 'PENDENTE' && !chave(g.statusColeta).includes('PENDENTE')) return false;
            if (problema && !['MAIS','MENOS','PENDENTE'].includes(problema) && status(g) !== problema) return false;
            return !busca || chave([g.sku,g.kit,g.envio,texto(g.codigosMapa)].join(' ')).includes(busca);
        });
    }
    function resumo(grupos, detalhes) {
        const r = { mapa: 0, coletado: 0, comPCP: 0, semPCP: 0, diferentes: 0, mais: 0, menos: 0, semMapa: 0,
            mapas: new Set(detalhes.map(d => texto(d.codigoMapa)).filter(Boolean)).size, linhas: detalhes.length, faltando: 0 };
        grupos.forEach(g => {
            const s = status(g), volume = numero(g.volumeMapa);
            r.mapa += volume;
            if (s === 'OK' && identidadeCompleta(g)) r.coletado += numero(g.volumeColetado);
            if (skuNoPCP(g)) r.comPCP += volume;
            if (s === 'SEM_PCP') r.semPCP += volume;
            if (dadosDivergentes(g)) {
                r.diferentes += volume;
                if (s === 'SEM_IDENTIDADE') r.faltando++;
            }
            if (s === 'SEM_MAPA') r.semMapa += numero(g.volumeEsperadoPCP);
            r.mais += numero(g.volumeAMais); r.menos += numero(g.volumeAMenos);
        });
        return r;
    }
    window.pgFiltrarAcompanhamentoMapa = function () {
        if (!estado.dados) return;
        estado.pagina = 0;
        if (estado.tipoDestino !== $('pgMapaTipoDestino').value) {
            estado.tipoDestino = $('pgMapaTipoDestino').value;
            ['grafica','marca','destino'].forEach(opcoes);
        }
        lerSelecoes();
        const prioridade = { SEM_IDENTIDADE:0, SEM_PCP:1, DADOS_DIFERENTES:2, SEM_MAPA:3, OK:4 };
        estado.grupos = selecionados().sort((a,b) => (prioridade[status(a)] ?? 5) - (prioridade[status(b)] ?? 5) ||
            (numero(b.volumeAMais) + numero(b.volumeAMenos)) - (numero(a.volumeAMais) + numero(a.volumeAMenos)) || texto(a.sku).localeCompare(texto(b.sku)));
        const ids = new Set(estado.grupos.map(g => g.id));
        const detalhes = estado.dados.detalhes.filter(d => ids.has(d.grupoId));
        const r = resumo(estado.grupos, detalhes);
        const contarSKU = tipo => new Set(estado.grupos.filter(g=>status(g) === tipo).map(g=>g.sku).filter(Boolean)).size;
        const skusNoPCP = new Set(estado.grupos.filter(skuNoPCP).map(g => g.sku)).size;
        const cards = [ ['Mapa solicitado',r.mapa,fmt(r.mapas)+' mapas · Tiragem solicitada'], ['Tiragem corresponde ao PCP (cruzando SKU)',r.comPCP,fmt(skusNoPCP)+' SKUs encontrados no PCP ou PCP Acabadora'],
            ['Tiragem fora do PCP',r.semPCP,fmt(contarSKU('SEM_PCP'))+' SKUs não encontrados nas duas abas'], ['Dados divergentes (CD, Gráfica ou Marca)',r.diferentes,r.faltando ? fmt(r.faltando)+' itens com dados faltando · Tiragem' : 'Tiragem com dados divergentes'],
            ['Tiragem coletada a mais',r.mais,fmt(estado.grupos.filter(g=>chave(g.statusColeta).includes('MAIS')).length)+' itens · status coleta do PCP'], ['Tiragem coletada a menos',r.menos,fmt(estado.grupos.filter(g=>chave(g.statusColeta).includes('MENOS')).length)+' itens · status coleta do PCP'],
            ['Tiragem PCP sem mapa',r.semMapa,'Prevista no PCP, sem mapa correspondente'], ['Coletado real',r.coletado,'Tiragem coletada com dados iguais ao PCP'] ];
        $('pgMapaCards').innerHTML = cards.map(([titulo,valor,sub]) => '<div class="pg-am-card"><span class="pg-am-card-title">'+esc(titulo)+'</span><div class="pg-am-card-value">'+fmt(valor)+'</div><p>'+esc(sub)+'</p></div>').join('');
        const graficas = [...new Set(estado.grupos.map(g => texto(g.grafica)))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
        $('pgMapaResumo').innerHTML = graficas.map(g => {
            const rg = resumo(estado.grupos.filter(i => texto(i.grafica) === g), []);
            return '<tr class="border-b border-slate-100"><td class="p-2 font-bold">'+esc(g || 'Não informado')+'</td>'+[rg.mapa,rg.comPCP,rg.semPCP,rg.diferentes,rg.mais,rg.menos,rg.semMapa].map(v=>'<td class="p-2 text-right">'+fmt(v)+'</td>').join('')+'</tr>';
        }).join('') || '<tr><td colspan="8" class="p-4 text-slate-500">Nenhum item para estes filtros.</td></tr>';
        desenharLinhas();
    };
    function desenharLinhas() {
        const inicio = estado.pagina * 100, linhas = estado.grupos.slice(inicio, inicio + 100);
        $('pgMapaDetalhes').innerHTML = linhas.map(g => {
            const s = status(g), cor = s === 'OK' ? 'pg-am-ok' : 'pg-am-conferir';
            const codigos = texto(g.codigosMapa), conferir = [texto(g.diferencas),g.notaFonte,
                g.multiplasFontes ? comparacoes(g) : contexto(g)].filter(Boolean).join(' · ');
            return '<tr class="border-b border-slate-100 align-top"><td class="p-2 font-bold '+cor+'">'+esc(rotulos[s] || s)+'</td>'+
                [g.grafica || 'Não informada',g.marca || 'Não informada',g.destino || 'Não informado',
                    g.sku || 'Não informado',g.kit || 'Não informado',g.envio || 'Não informado']
                    .map(v=>'<td class="p-2">'+esc(v)+'</td>').join('')+
                '<td class="p-2 max-w-xs whitespace-normal">'+esc(codigos || 'Sem mapa')+'</td>'+
                [g.volumeMapa,g.volumeColetado,g.volumeEsperadoPCP,g.volumeColetadoPCP].map(v=>'<td class="p-2 text-right">'+(v === null || v === undefined ? 'Não informado' : fmt(v))+'</td>').join('')+
                '<td class="p-2">'+esc(g.statusColeta || 'Sem status no PCP')+'</td><td class="p-2 text-right font-bold">'+fmt(g.volumeAMais)+'</td><td class="p-2 text-right font-bold">'+fmt(g.volumeAMenos)+'</td>'+
                '<td class="p-2 max-w-sm whitespace-normal">'+esc(conferir || [g.origemPCP,linhasPCP(g)].filter(Boolean).join(' · ') || 'SKU não encontrado no PCP')+'</td></tr>';
        }).join('') || '<tr><td colspan="16" class="p-5 text-slate-500">Nenhum item para estes filtros.</td></tr>';
        $('pgMapaContagem').textContent = fmt(estado.grupos.length) + ' itens';
        $('pgMapaPagina').textContent = estado.grupos.length ? (inicio + 1) + '–' + Math.min(inicio+100,estado.grupos.length) + ' de ' + fmt(estado.grupos.length) : '0 itens';
        $('pgMapaAnterior').disabled = estado.pagina === 0;
        $('pgMapaProxima').disabled = inicio + 100 >= estado.grupos.length;
    }
    window.pgPaginaAcompanhamentoMapa = function (passo) {
        estado.pagina = Math.max(0, Math.min(Math.max(0,Math.ceil(estado.grupos.length/100)-1), estado.pagina + passo)); desenharLinhas();
    };
    window.pgLimparAcompanhamentoMapa = function () {
        ['grafica','marca','destino'].forEach(campo => {
            estado.selecoes[campo] = null;
            caixasFiltro(campo).forEach(cb => cb.checked = true);
            $('pgMapaBusca-' + campo).value = '';
            window.pgBuscarFiltroMapa(campo, '');
        });
        ['pgMapaFiltroProblema','pgMapaBusca'].forEach(id => $(id).value = '');
        $('pgMapaTipoDestino').value = 'CD';
        window.pgFiltrarAcompanhamentoMapa();
    };
    window.pgMontarBaseAcompanhamentoMapa = function () {
        if (!estado.dados || estado.carregando) throw new Error('Aguarde o acompanhamento terminar de carregar.');
        window.pgFiltrarAcompanhamentoMapa();
        const cabecalho = ['Conferência','Gráfica','Marca','CD destino','SKU','Kit','Envio','Código mapa','Linha mapa',
            'Tiragem no mapa','Tiragem coletada no mapa','Data agendada','Data coleta TP','Data entrega TP','Classificação no mapa',
            'Origem PCP','Linhas PCP','Tiragem PCP (uma vez por item)','Tiragem coletada PCP (uma vez por item)',
            'Status coleta PCP','Tiragem a mais (uma vez por item)','Tiragem a menos (uma vez por item)','Diferenças nos dados','Dados no PCP','Atualização da origem',
            'Comparação por aba PCP','Tiragem vencida PCP (uma vez por item)','Tiragem recebida Acabadora (uma vez por item)'];
        const porGrupo = new Map();
        estado.dados.detalhes.forEach(d => { if (!porGrupo.has(d.grupoId)) porGrupo.set(d.grupoId, []); porGrupo.get(d.grupoId).push(d); });
        const linhas = [];
        estado.grupos.forEach(g => {
            const parcelas = porGrupo.get(g.id) || [{}];
            parcelas.forEach((d,i) => linhas.push([rotulos[status(g)] || status(g),d.grafica || g.grafica,d.marca || g.marca,d.destino || g.destino,
                d.sku || g.sku,d.kit || g.kit,d.envio || g.envio,d.codigoMapa || '',d.linhaMapa || '',numero(d.volumeMapa),numero(d.volumeColetado),
                d.dataAgendada || '',d.coletaTP || '',d.entregaTP || '',d.statusNaoGrafico || '',g.origemPCP || '',linhasPCP(g),
                i ? 0 : g.volumeEsperadoPCP == null ? 'Não informado' : numero(g.volumeEsperadoPCP),
                i ? 0 : g.volumeColetadoPCP == null ? 'Não informado' : numero(g.volumeColetadoPCP),g.statusColeta || '',
                i ? 0 : numero(g.volumeAMais),i ? 0 : numero(g.volumeAMenos),texto(g.diferencas),contexto(g),d.atualizadoOrigem || '',
                comparacoes(g),i ? 0 : (g.basesStatus || []).reduce((s,b)=>s + numero(b.vencido),0),
                i ? 0 : (g.basesStatus || []).reduce((s,b)=>s + numero(b.recebido),0)]));
        });
        return [{ nome: 'Acompanhamento mapas', cabecalho, linhas, colunasData:[11,12,13],colunasNumero:[8,9,10,17,18,20,21,26,27] }];
    };
    window.pgBaixarAcompanhamentoMapa = function () {
        try {
            if (typeof window.pgGerarExcelAbas !== 'function') throw new Error('O exportador Excel não carregou. Atualize o portal.');
            const abas = window.pgMontarBaseAcompanhamentoMapa();
            if (!abas[0].linhas.length) throw new Error('Nenhum item para estes filtros.');
            const url = URL.createObjectURL(window.pgGerarExcelAbas(abas));
            const a = document.createElement('a'); a.href = url;
            a.download = 'Acompanhamento_Mapas_' + new Date().toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'}) + '.xlsx';
            document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000);
        } catch (e) { aviso(e?.message || String(e)); }
    };
})();
</script>
