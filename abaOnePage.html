<div id="abaOnePage" class="aba-conteudo hidden">
    <div class="mb-5 flex flex-col md:flex-row justify-between items-start md:items-end gap-3">
        <div>
            <h2 class="text-2xl font-black text-slate-800 tracking-tight">Performance da Produção Gráfica</h2>
            <p class="text-xs text-slate-500 mt-1">Resumo executivo dos principais indicadores da operação.</p>
        </div>
    </div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-5">
        <div id="opCardSku" class="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">SKU produzido</p>
            <p id="opKpiSku" class="text-2xl font-black text-slate-800 mt-1">-</p>
        </div>
        <div id="opCardTiragem" class="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Tiragem total</p>
            <p id="opKpiTiragem" class="text-2xl font-black text-slate-800 mt-1">-</p>
        </div>
        <div id="opCardProducao" class="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">% de produção</p>
            <p id="opKpiProducao" class="text-2xl font-black text-slate-800 mt-1">-</p>
        </div>
        <div id="opCardPrazo" class="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">% entregue no prazo</p>
            <p id="opKpiPrazo" class="text-2xl font-black text-slate-800 mt-1">-</p>
        </div>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 mb-5 overflow-x-auto scroller">
        <h3 class="text-xs font-black text-slate-700 uppercase tracking-wider mb-3 border-b border-slate-100 pb-2">Visão por etapa</h3>
        <table class="w-full text-xs border-collapse whitespace-nowrap">
            <thead><tr id="opEtapasHead" class="bg-slate-50 text-slate-600 uppercase text-[9px] border-b border-slate-200"></tr></thead>
            <tbody id="opEtapasBody" class="text-slate-700"></tbody>
        </table>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-3 gap-5 mb-5">
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
            <h3 class="text-[10px] font-black text-slate-700 uppercase tracking-wider mb-4">% preenchimento PCP</h3>
            <div class="flex items-end gap-2 mb-3">
                <span id="opPcpPct" class="text-4xl font-black text-slate-800">-</span>
            </div>
            <div class="h-3 rounded-full bg-slate-100 overflow-hidden border border-slate-200">
                <div id="opPcpBar" class="h-full bg-emerald-500 rounded-full" style="width:0%"></div>
            </div>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
            <h3 class="text-[10px] font-black text-slate-700 uppercase tracking-wider mb-3">Principais etapas ofensoras</h3>
            <div id="opOfensoras" class="space-y-3"></div>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
            <h3 class="text-[10px] font-black text-slate-700 uppercase tracking-wider mb-3">Ranking entre gráficas</h3>
            <div id="opRanking" class="space-y-2"></div>
        </div>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 mb-6">
        <h3 class="text-[10px] font-black text-slate-700 uppercase tracking-wider mb-3">Pontos de atenção</h3>
        <div id="opPontosAtencao" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
    </div>
</div>
