// ============================================================================
// REPORT EXECUTIVA POR MARCA
// ============================================================================

window.processarReportExecutiva = function() {
    const tbody = document.getElementById('reTabelaMarcas');
    if (!tbody) return;

    // V42 - colunas opcionais, sem interferir nos filtros globais.
    const tabelaRE = tbody.closest('table');
    if (!tabelaRE) return;
    let painelRE = document.getElementById('pgReSeletoresV42');
    if (!painelRE) {
        painelRE = document.createElement('div');
        painelRE.id = 'pgReSeletoresV42';
        painelRE.className = 'flex flex-wrap gap-3 items-center mb-3 text-xs font-semibold text-slate-700';
        painelRE.innerHTML = [
            ['grafica', 'Mostrar Gráfica', false],
            ['marca', 'Mostrar Marca', true],
            ['serie', 'Mostrar Série', false]
        ].map(([id, texto, ligado]) =>
            `<label class="inline-flex items-center gap-2 border border-slate-200 rounded-lg bg-white px-3 py-2 cursor-pointer">` +
            `<input type="checkbox" data-re-coluna="${id}" ${ligado ? 'checked' : ''}>${texto}</label>`
        ).join('');
        tabelaRE.parentNode.insertBefore(painelRE, tabelaRE);
        painelRE.querySelectorAll('input').forEach(cb => {
            cb.addEventListener('change', () => window.processarReportExecutiva());
        });
    }
    // V58 - grupos opcionais da tabela executiva. A escolha vale para a sessão
    // e altera somente a apresentação; nenhum cálculo é refeito ao recolher/abrir.
    window.pgREGruposV58 = Object.assign(
        { acab: true, kit: true, entCD: true, entTP: true, entTodos: false },
        window.pgREGruposV58 || {}
    );

    let gruposReV58 = painelRE.querySelector('[data-pg-re-grupos-v58]');
    if (!gruposReV58) {
        gruposReV58 = document.createElement('div');
        gruposReV58.dataset.pgReGruposV58 = '1';
        gruposReV58.className =
            'inline-flex flex-wrap items-center gap-2 rounded-lg border border-slate-200 bg-slate-50 px-2 py-1';
        gruposReV58.innerHTML =
            '<span class="text-[10px] font-black uppercase text-slate-600">Indicadores</span>' +
            '<label class="inline-flex items-center gap-1.5 rounded-md bg-white border border-slate-200 px-2 py-1 cursor-pointer">' +
                '<input type="checkbox" data-re-grupo-v58="acab"> Acabado</label>' +
            '<label class="inline-flex items-center gap-1.5 rounded-md bg-white border border-slate-200 px-2 py-1 cursor-pointer">' +
                '<input type="checkbox" data-re-grupo-v58="kit"> Form. Kit</label>' +
            '<label class="inline-flex items-center gap-1.5 rounded-md bg-white border border-slate-200 px-2 py-1 cursor-pointer">' +
                '<input type="checkbox" data-re-grupo-v58="entCD"> Coleta</label>' +
            '<label class="inline-flex items-center gap-1.5 rounded-md bg-white border border-slate-200 px-2 py-1 cursor-pointer">' +
                '<input type="checkbox" data-re-grupo-v58="entTP"> Entrega TP</label>' +
            '<label class="inline-flex items-center gap-1.5 rounded-md bg-white border border-slate-200 px-2 py-1 cursor-pointer">' +
                '<input type="checkbox" data-re-grupo-v58="entTodos"> CD + Acabadora</label>';
        painelRE.appendChild(gruposReV58);

        gruposReV58.querySelectorAll('input[data-re-grupo-v58]').forEach(cb => {
            cb.addEventListener('change', () => {
                const id = cb.dataset.reGrupoV58;
                window.pgREGruposV58[id] = cb.checked;
                if (typeof window.pgREAplicarVisibilidadeV58 === 'function') {
                    window.pgREAplicarVisibilidadeV58();
                }
            });
        });
    }

    window.pgREAplicarVisibilidadeV58 = function() {
        const tabela = document.querySelector('#abaReportExecutiva .re-table');
        if (!tabela) return;
        const estado = window.pgREGruposV58 || { acab: true, kit: true, entCD: true, entTP: true, entTodos: false };
        [
            ['acab', !!estado.acab],
            ['kit', !!estado.kit],
            ['enttodos', !!estado.entTodos],
            ['entcd', !!estado.entCD],
            ['enttp', !!estado.entTP]
        ].forEach(([grupo, visivel]) => {
            tabela.querySelectorAll('.re-group-' + grupo).forEach(el => {
                el.style.display = visivel ? '' : 'none';
            });
        });
        const duasColetas = !!estado.entTodos && !!estado.entCD;
        [['enttodos', 'CD + Acabadora'], ['entcd', 'CD']].forEach(([grupo, destino]) => {
            tabela.querySelectorAll('thead th.re-group-' + grupo).forEach(th => {
                const nome = th.textContent.replace(/\s+-\s+.*$/, '');
                if (nome) th.textContent = nome + (duasColetas ? ' - ' + destino : '');
            });
        });
        if (typeof window.pgREFixarAgrupamento === 'function') window.pgREFixarAgrupamento();
    };

    gruposReV58.querySelectorAll('input[data-re-grupo-v58]').forEach(cb => {
        cb.checked = !!window.pgREGruposV58[cb.dataset.reGrupoV58];
    });

    const opcoesRE = ['grafica', 'marca', 'serie'];
    const nomesRE = {grafica:'Gráfica', marca:'Marca', serie:'Série'};
    const colunasRE = opcoesRE.filter(id =>
        painelRE.querySelector(`[data-re-coluna="${id}"]`)?.checked
    );
    // A primeira coluna da tabela é reaproveitada; as outras são dinâmicas.
    const cabecalhoRE = tabelaRE.querySelector('thead tr');
    if (cabecalhoRE) {
        cabecalhoRE.querySelectorAll('[data-pg-re-v42]').forEach(el => el.remove());
        const primeiro = cabecalhoRE.querySelector('th');
        if (primeiro) {
            primeiro.textContent = nomesRE[colunasRE[0]] || 'Agrupamento';
            let anterior = primeiro;
            colunasRE.slice(1).forEach(id => {
                const th = document.createElement('th');
                th.dataset.pgReV42 = '1';
                th.textContent = nomesRE[id];
                th.className = primeiro.className;
                anterior.insertAdjacentElement('afterend', th);
                anterior = th;
            });
        }
    }

    const baseGeral = window.pgBaseGeralReportExecutiva || [];
    // PG_RE_CORTE_D1_HOJE_V57: corte local da Report, sem mexer em dtHojeISO.
    const diaAtualReV57 = (typeof dtHojeISO !== 'undefined' && dtHojeISO)
        ? dtHojeISO
        : (() => {
            const d = new Date();
            return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'),
                String(d.getDate()).padStart(2, '0')].join('-');
        })();

    const ontemReV57 = new Date(diaAtualReV57 + 'T12:00:00Z');
    ontemReV57.setUTCDate(ontemReV57.getUTCDate() - 1);

    const diaAnteriorReV57 = ontemReV57.toISOString().slice(0, 10);

    const modoReV57 = window.pgREModoCorteV57 === 'D-1'
        ? 'D-1'
        : 'HOJE';

    window.pgREModoCorteV57 = modoReV57;

    const hojeIso = modoReV57 === 'D-1'
        ? diaAnteriorReV57
        : diaAtualReV57;

    window.pgREDataCorteV57 = hojeIso;

    // Seletor ao lado das opcoes de colunas da Report Executiva.
    let seletorReV57 = painelRE.querySelector('[data-pg-re-corte-v57]');

    if (!seletorReV57) {
        seletorReV57 = document.createElement('div');
        seletorReV57.dataset.pgReCorteV57 = '1';

        seletorReV57.className =
            'inline-flex flex-wrap items-center gap-1 rounded-lg border border-slate-200 bg-slate-50 p-1 ml-auto';

        seletorReV57.setAttribute(
            'role',
            'group'
        );

        seletorReV57.setAttribute(
            'aria-label',
            'Data de referência da Report Executiva'
        );

        seletorReV57.innerHTML =
            '<span class="px-2 text-[10px] font-black uppercase text-slate-600">Data de referência</span>' +
            '<button type="button" data-pg-re-dia-v57="D-1">D-1</button>' +
            '<button type="button" data-pg-re-dia-v57="HOJE">Hoje</button>' +
            '<span data-pg-re-rotulo-v57 class="px-2 text-[10px] text-slate-500"></span>';

        painelRE.appendChild(seletorReV57);

        seletorReV57.addEventListener('click', event => {
            const botao = event.target.closest(
                'button[data-pg-re-dia-v57]'
            );

            if (!botao) return;

            const proximo = botao.dataset.pgReDiaV57;

            if (!['D-1', 'HOJE'].includes(proximo)) return;

            window.pgREModoCorteV57 = proximo;
            window.processarReportExecutiva();
        });
    }

    seletorReV57.querySelectorAll(
        'button[data-pg-re-dia-v57]'
    ).forEach(botao => {

        const ativo = botao.dataset.pgReDiaV57 === modoReV57;

        botao.className = ativo
            ? 'rounded-md bg-indigo-600 text-white px-3 py-1.5 text-xs font-bold shadow-sm'
            : 'rounded-md bg-white text-slate-700 px-3 py-1.5 text-xs font-bold hover:bg-slate-100';

        botao.setAttribute(
            'aria-pressed',
            String(ativo)
        );
    });

    const rotuloReV57 = seletorReV57.querySelector(
        '[data-pg-re-rotulo-v57]'
    );

    if (rotuloReV57) {
        const [ano, mes, dia] = hojeIso.split('-');

        rotuloReV57.textContent =
            `Corte: ${dia}/${mes}/${ano}`;
    }
    const tRef = document.getElementById('filtroReferencia')?.value || 'replan';

    const norm = v => String(v == null ? '' : v)
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .trim().replace(/\s+/g, ' ').toUpperCase();

    const infoLinhaRECache = new WeakMap();
    const infoLinhaRE = l => {
        let info = infoLinhaRECache.get(l);
        if (info) return info;

        const graficaRaw = norm(l['GRAFICA_FINAL'] || l['GRÁFICA'] || l['GRAFICA'] || l['BQ'] || '');
        info = {
            graficaRaw,
            grafica: graficaRaw || 'N/A',
            marca: norm(l['MARCA_FINAL'] || l['UNIDADE'] || l['MARCA'] || 'N/A') || 'N/A',
            serie: norm(l['SÉRIE'] || l['Série'] || l.SERIE || l['SÉRIES'] || 'N/A') || 'N/A'
        };
        infoLinhaRECache.set(l, info);
        return info;
    };
    const marcaLinha = l => infoLinhaRE(l).marca;
    const graficaLinha = l => infoLinhaRE(l).graficaRaw;
    const serieLinha = l => infoLinhaRE(l).serie;
    const infoGruposRE = new Map();
    const chaveLinha = l => {
        const info = infoLinhaRE(l);
        const chave = colunasRE.length
            ? colunasRE.map(id => info[id]).join('\u001f')
            : 'GERAL';
        if (!infoGruposRE.has(chave)) infoGruposRE.set(chave, info);
        return chave;
    };
    window.reGruposV42 = infoGruposRE;
    window.reLinhaNoGrupoV42 = (l, chave) => {
        if (chave === 'TOTAL GERAL') return true;
        const info = window.reGruposV42?.get(chave);
        if (!info) return marcaLinha(l) === chave;
        const dados = infoLinhaRE(l);
        return colunasRE.every(id => dados[id] === info[id]);
    };


    const numero = v => {
        if (typeof v === 'number') return Number.isFinite(v) ? v : 0;
        let s = String(v ?? '').trim();
        if (!s) return 0;
        if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
        else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
        const n = Number(s);
        return Number.isFinite(n) ? n : 0;
    };

    const tiragemRECache = new WeakMap();
    const tiragemColetadaRECache = new WeakMap();

    const tiragem = l => {
        if (tiragemRECache.has(l)) return tiragemRECache.get(l);
        const valor = Math.max(0, numero(l['TIRAGEM'] ?? l['QUANTIDADE'] ?? 0));
        tiragemRECache.set(l, valor);
        return valor;
    };

    const tiragemColetada = l => {
        if (tiragemColetadaRECache.has(l)) return tiragemColetadaRECache.get(l);
        const valor = Math.max(0, numero(
            window.pgCampoColeta(l, 'TIRAGEM COLETADA') ??
            l['VOLUME_AZ'] ??
            l['GIRO_COLETADA_AZ'] ??
            0
        ));
        tiragemColetadaRECache.set(l, valor);
        return valor;
    };

    const pct = (n, d) => {
        if (!(d > 0)) return 0;
        return Math.max(0, Math.min(100, (Number(n || 0) / d) * 100));
    };
    const pctTxt = v => `${Math.round(Number(v || 0))}%`;

    const status = (real, plan) => {
        // A bolinha e o numero mostrado usam o MESMO arredondamento.
        const realExibido = Math.round(Number(real || 0));
        const planExibido = Math.round(Number(plan || 0));
        if (realExibido >= planExibido) return 'green';
        if (planExibido - realExibido <= 5) return 'yellow';
        return 'red';
    };

    const fmtData = iso => {
        if (!iso || String(iso).length < 10) return '';
        const [a, m, d] = String(iso).slice(0, 10).split('-');
        return `${d}/${m}`;
    };

    const dataAnterior = iso => {
        const d = new Date(`${iso}T12:00:00`);
        d.setDate(d.getDate() - 1);
        return d.toISOString().slice(0, 10);
    };

    const thAcab = document.getElementById('reThAcabPlan');
    const thKit = document.getElementById('reThKitPlan');
    const thEntTodos = document.getElementById('reThEntTodosPlan');
    const thEntCD = document.getElementById('reThEntCDPlan');
    const thEntTP = document.getElementById('reThEntTPPlan');
    if (thAcab) thAcab.textContent = `Acabado (Plan. ${fmtData(hojeIso)})`;
    if (thKit) thKit.textContent = `Form. Kit (Plan. ${fmtData(hojeIso)})`;
    if (thEntTodos) thEntTodos.textContent = `Coleta (Plan. ${fmtData(hojeIso)})`;
    if (thEntCD) thEntCD.textContent = `Coleta (Plan. ${fmtData(hojeIso)})`;
    if (thEntTP) thEntTP.textContent = `Entrega TP (Plan. ${fmtData(hojeIso)})`;

    const novoAgg = () => ({ den: 0, real: 0, plan: 0 });
    const add = (map, marca, campo, valor) => {
        if (!map[marca]) map[marca] = novoAgg();
        map[marca][campo] += Number(valor || 0);
    };

    // V50 - somente Report Executiva, sem alterar o Funil.
    // Para marcas diferentes de SAS, uma coleta parcial comprovada por
    // Coleta_TP (ate hoje) conta somente sua TIRAGEM COLETADA, ate a tiragem
    // da linha; nunca transforma qualquer coleta em 100% da linha.
    // O acabamento registrado permanece integral. A coleta real so complementa
    // o volume faltante, sem transformar coleta parcial em 100% da linha.
    const pgAcabamentoReportV46 = window.pgMetricasAcabamentoRealV46(
        tRef, hojeIso, chaveLinha);
    const acabPorMarca = pgAcabamentoReportV46.porGrupo;
    const acabTotal = pgAcabamentoReportV46.total;
    const faseAcabReportV50 = FASES.find(f => f.id === 'acab');
    if (!faseAcabReportV50) throw new Error('Fase de acabamento ausente.');
    if (typeof window.pgVolumesColetaUnificadosV37 !== 'function') {
        throw new Error('Leitura do volume real de Coleta TP indisponivel.');
    }
    const vistosAcabReportV50 = new Set();
    const auditoriaAcabReportV50 = {
        complementoParcial: 0, ajusteParcial: 0, linhasParciais: 0,
        porMarca: {}
    };

    (window.dadosAcabamentoOrigem || []).forEach(l => {
        const chave = getKey(l);
        if (vistosAcabReportV50.has(chave)) return;
        vistosAcabReportV50.add(chave);
        if (!belongsToPhase(l, 'acab')) return;
        const marca = marcaLinha(l);
        // SAS mantem exclusivamente o calculo V46: PCP_ACABADORAS no
        // destino acabadora; nenhuma inferencia por coleta.
        if (marca === 'SAS') return;

        const tiragemLinha = Math.max(0,
            Number(window.arredondar(l.TIRAGEM || l.QUANTIDADE || 0)) || 0);
        if (!(tiragemLinha > 0)) return;
        const dataAcab = extrairDataISO(l[faseAcabReportV50.colReal]);
        const acabadoRegistrado = dataAcab && dataAcab <= hojeIso &&
            dataFoiPreenchida(l, faseAcabReportV50) ? tiragemLinha : 0;

        const tp = window.pgVolumesColetaUnificadosV37(l, hojeIso);
        // tp.coleta e o NUMERO da coluna TIRAGEM COLETADA, mas somente
        // com data valida em Coleta_TP ate hoje (nunca um booleano).
        const coletadoReal = Math.min(tiragemLinha,
            Math.max(0, Number(tp && tp.coleta) || 0));
        // Nunca subtrai acabamento que ja esta registrado na base.
        // Coleta TP parcial so complementa o que ainda nao foi reconhecido.
        // Exemplo: acabado 1000 e coletado 150 => 1000;
        //          acabado 0 e coletado 150 => 150.
        const acabadoReport = Math.max(acabadoRegistrado, coletadoReal);
        const ajuste = acabadoReport - acabadoRegistrado;
        if (ajuste === 0) return;

        const grupo = chaveLinha(l);
        const agregado = acabPorMarca[grupo];
        if (!agregado) throw new Error('Grupo de acabamento nao localizado: ' + grupo);
        const fonte = window.pgEhFonteAcabadora(l) ? 'acab' : 'pcp';
        agregado.real += ajuste;
        agregado[fonte].real += ajuste;
        acabTotal.real += ajuste;
        acabTotal[fonte].real += ajuste;
        if (coletadoReal > 0 && coletadoReal < tiragemLinha) {
            auditoriaAcabReportV50.linhasParciais++;
            auditoriaAcabReportV50.ajusteParcial += ajuste;
        }
        if (ajuste > 0) auditoriaAcabReportV50.complementoParcial += ajuste;
        auditoriaAcabReportV50.porMarca[marca] =
            (auditoriaAcabReportV50.porMarca[marca] || 0) + ajuste;
    });
    window.pgAuditoriaAcabamentoReportV50 = auditoriaAcabReportV50;
    if (thAcab) thAcab.title = 'Somente nesta tabela: para nao-SAS, contabiliza o maior volume entre acabamento real registrado e Coleta TP real e datada, limitado a tiragem da linha. Coleta parcial nao reduz acabamento registrado. SAS e Funil sem alteracoes.';

    // V58 - Formação de Kit na Report.
    // Mantém a regra operacional do portal: PCP direto ao CD + PCP_ACABADORAS
    // oficiais para o que passa por acabadora, sem empilhar a transferência.
    const faseKitReportV58 = FASES.find(f => f.id === 'kit');
    const baseKitReportV58 = faseKitReportV58
        ? window.pgLinhasUnicas([
            ...baseGeral.filter(l =>
                !window.pgEhFonteAcabadora(l) &&
                !window.pgEhDestinoAcabadora(l)
            ),
            ...baseGeral.filter(l =>
                window.pgEhFonteAcabadora(l) &&
                window.pgAcabadoraDaLista(l)
            )
        ])
        : [];

    const kitPorMarca = {};
    const kitTotal = novoAgg();

    if (faseKitReportV58) {
        baseKitReportV58.forEach(l => {
            const volume = tiragem(l);
            if (!(volume > 0)) return;

            const grupo = chaveLinha(l);
            add(kitPorMarca, grupo, 'den', volume);
            kitTotal.den += volume;

            const dtReal = window.pgDataRealFaseFunil(l, faseKitReportV58);
            if (dtReal && dtReal <= hojeIso && dataFoiPreenchida(l, faseKitReportV58)) {
                add(kitPorMarca, grupo, 'real', volume);
                kitTotal.real += volume;
            }

            const dtPlan = window.pgDataPlanoFaseFunil(l, faseKitReportV58, tRef);
            const dias = dtPlan ? calcDiffDiasISO(dtPlan, hojeIso) : null;
            if (dtPlan && dias !== null && dias >= 3) {
                add(kitPorMarca, grupo, 'plan', volume);
                kitTotal.plan += volume;
            }
        });
    }

    // 2) ENTREGAS — cenários fixos pedidos na Report.
    // TODAS sempre aceita toda a base; não há necessidade de filtrar linha a linha.
    const baseOrigemTodas = baseGeral;
    const baseOrigemGrafica = baseGeral.filter(l => window.pgLinhaDaOrigem(l, 'GRAFICA'));
    const baseCanonicaCenarioCache = new Map();

    const baseCanonicaCenario = (origemCenario, destino) => {
        const chaveCache = origemCenario + '|' + destino;
        if (baseCanonicaCenarioCache.has(chaveCache)) {
            return baseCanonicaCenarioCache.get(chaveCache);
        }

        const baseOrigemCenario = origemCenario === 'GRAFICA'
            ? baseOrigemGrafica
            : baseOrigemTodas;

        let linhas = baseOrigemCenario.filter(l =>
            window.pgLinhaDoDestino(l, destino, origemCenario)
        );

        if (origemCenario === 'TODOS' && destino === 'CD') {
            linhas = linhas.filter(l => {
                if (!window.pgEhFonteAcabadora(l)) return true;
                return !['ATHOS', 'KN', 'RAIZES'].includes(graficaLinha(l));
            });
        }

        const unicas = window.pgLinhasUnicas(linhas);
        baseCanonicaCenarioCache.set(chaveCache, unicas);
        return unicas;
    };

    const calcularEntrega = (origemCenario, destino, tipoReal = 'coleta') => {
        const campoReal = tipoReal === 'entrega' ? 'Entrega_TP' : 'Coleta_TP';
        const porMarca = {};
        const total = novoAgg();
        // Os próprios registros da tabela alimentam a curva semanal.
        const eventosPlano = [];
        const eventosReal = [];
        const baseCenario = baseCanonicaCenario(origemCenario, destino);

        baseCenario.forEach(l => {
            const volume = tiragem(l);
            if (volume <= 0) return;
            const m = chaveLinha(l);
            add(porMarca, m, 'den', volume);
            total.den += volume;
        });

        // V42C - numerador Real da MESMA base usada no denominador.
        // Mantém o Planejado original integralmente.
        const baseReal = baseCenario;
        baseReal.forEach(l => {
            const real = typeof window.pgVolumesColetaUnificadosV37 === 'function'
                ? window.pgVolumesColetaUnificadosV37(l, hojeIso)[tipoReal]
                : (() => {
                    const dt = window.pgNormalizarDataColeta(
                        window.pgCampoColeta(l, campoReal), hojeIso);
                    return dt && dt <= hojeIso ? tiragemColetada(l) : 0;
                  })();
            if (!(real > 0)) return;
            const dataReal = window.pgNormalizarDataColeta(
                window.pgCampoColeta(l, campoReal), hojeIso);
            if (!dataReal || dataReal > hojeIso) return;
            eventosReal.push({ linha: l, pcp: l, dtReal: dataReal, coletada: real });
            const m = chaveLinha(l);
            add(porMarca, m, 'real', real);
            total.real += real;
        });

        // Planejado preservado: mesma fonte, mesmas datas e mesma fórmula.
        let pcp = baseOrigemGrafica;
        if (destino !== 'TODOS') {
            pcp = baseOrigemGrafica.filter(l => window.pgLinhaDoDestino(l, destino, 'GRAFICA'));
        }
        const fEnt = FASES.find(f => f.id === 'ent_tp');
        pcp.forEach(l => {
            const m = chaveLinha(l);
            if (fEnt) {
                const dtPlan = tipoReal === 'entrega'
                    ? window.pgDataPlanoEntregaSLA(l)
                    : window.pgDataPlanoFaseFunil(l, fEnt, tRef);
                const dias = dtPlan ? calcDiffDiasISO(dtPlan, hojeIso) : null;
                const volumePlan = tiragem(l);
                // Inclui o futuro na curva, sem antecipá-lo no total da tabela.
                if (dtPlan && volumePlan > 0) {
                    eventosPlano.push({ linha: l, pcp: l, dtPlan, tiragem: volumePlan });
                }
                if (dtPlan && dias !== null && dias >= 0) {
                    add(porMarca, m, 'plan', volumePlan);
                    total.plan += volumePlan;
                }
            }
        });

        return { porMarca, total, eventosPlano, eventosReal };
    };

    const entTodos = calcularEntrega('GRAFICA', 'TODOS');
    const entCD = calcularEntrega('TODOS', 'CD');
    // Entrega TP usa a base CD, plano de coleta + Matriz_SLA e real datado em Entrega_TP.
    const entTP = calcularEntrega('TODOS', 'CD', 'entrega');

    // Fonte única: as porcentagens do gráfico são as mesmas colunas
    // Coletados (Plan/Real) - CD do TOTAL GERAL da tabela.
    // V44: projeção posterior a hoje = mesma agenda do gráfico diário.
    // O universo CD é independente do seletor Origem/Destino da aba Report.
    // Reproduz a seleção PCP direto + acabadoras oficiais da base TP.
    const contextoOrigem = document.getElementById('pgFiltroOrigem')?.value || 'TODOS';
    const contextoDestino = document.getElementById('pgFiltroDestino')?.value || 'CD';
    const filtroCDAtual = contextoOrigem === 'TODOS' && contextoDestino === 'CD';
    const baseDiariaCD = filtroCDAtual
        ? (window.dadosBaseForecastColeta || [])
        : window.pgLinhasUnicas([
            ...baseGeral.filter(l => !window.pgEhFonteAcabadora(l) &&
                !window.pgEhDestinoAcabadora(l)),
            ...baseGeral.filter(l => window.pgEhFonteAcabadora(l) &&
                window.pgAcabadoraDaLista(l))
        ]);
    // Reutiliza o resumo já calculado quando os filtros exibem Todas / CD.
    const resumoDiarioCD = filtroCDAtual
        ? window.pgObterResumoColeta()
        : window.pgCalcularColetaFunil(baseDiariaCD, hojeIso);
    const eventosCDDia = (resumoDiarioCD.registros || [])
        .filter(r => r.dtPlan && Number(r.tiragem || 0) > 0)
        .map(r => ({
            linha: r.linha || r.pcp, pcp: r.pcp || r.linha,
            dtPlan: r.dtPlan, tiragem: Number(r.tiragem || 0)
        }));
    const somaDiaAte = data => eventosCDDia.reduce((soma, r) =>
        soma + (r.dtPlan <= data ? r.tiragem : 0), 0);
    // O total da tabela (denominador) continua sendo a referência.
    // O ponto futuro utiliza o volume bruto do gráfico diário, sem ajuste
    // por percentual, truncamento de semana ou antecipação de dias.
    if (filtroCDAtual) {
        const diarioHoje = somaDiaAte(hojeIso);
        if (Math.abs(diarioHoje - entCD.total.plan) > 0.01) {
            console.info('[V44] Planejados diferentes no corte de hoje:', {
                report: entCD.total.plan, diario: diarioHoje
            });
        }
    }

    window.reCurvaFonteCDV43 = {
        total: entCD.total.den,
        // O planejado da curva usa a mesma fonte consolidada do gráfico diário:
        // PCP direto + acabadoras oficiais, sem duplicação.
        planejadoHoje: somaDiaAte(hojeIso),
        realizadoHoje: entCD.total.real,
        eventosPlano: eventosCDDia,
        // Histórico usa a mesma base consolidada do gráfico diário para que
        // pontos fechados (ex.: 30/09 após virar 01/10) não voltem ao cálculo antigo.
        eventosPlanoHistorico: eventosCDDia,
        eventosReal: entCD.eventosReal,
        registros: [...eventosCDDia, ...entCD.eventosReal],
        hoje: hojeIso
    };

    const marcas = new Set([
        ...Object.keys(acabPorMarca),
        ...Object.keys(kitPorMarca),
        ...Object.keys(entTodos.porMarca),
        ...Object.keys(entCD.porMarca)
    ]);

    const ordemPreferida = [
        'SAS', 'SPE', 'NAV', 'SAE', 'CQT', 'COC', 'MAR', 'GEE',
        'EI', 'IS', 'PLE', 'GEN', 'NEU', 'PIA', 'MES'
    ];
    const pos = new Map(ordemPreferida.map((m, i) => [m, i]));

    const marcasOrdenadas = Array.from(marcas).sort((a, b) => {
        const ia = infoGruposRE.get(a) || {};
        const ib = infoGruposRE.get(b) || {};
        const ma = ia.marca || '', mb = ib.marca || '';
        const pa = pos.has(ma) ? pos.get(ma) : 999;
        const pb = pos.has(mb) ? pos.get(mb) : 999;
        if (pa !== pb) return pa - pb;
        return [ma, ia.grafica || '', ia.serie || ''].join('|').localeCompare(
            [mb, ib.grafica || '', ib.serie || ''].join('|'), 'pt-BR');
    });

    const dot = cor => `<span class="re-dot re-dot-${cor}"></span>`;

    const linhaHtml = (marca, a, k, et, ec, tp, total = false) => {
        a = a || novoAgg();
        k = k || novoAgg();
        et = et || novoAgg();
        ec = ec || novoAgg();
        tp = tp || novoAgg();

        const acabReal = pct(a.real, a.den);
        const acabPlan = pct(a.plan, a.den);
        const kitReal = pct(k.real, k.den);
        const kitPlan = pct(k.plan, k.den);
        const entTodosReal = pct(et.real, et.den);
        const entTodosPlan = pct(et.plan, et.den);
        const entCDReal = pct(ec.real, ec.den);
        const entCDPlan = pct(ec.plan, ec.den);
        const entTPReal = pct(tp.real, tp.den);
        const entTPPlan = pct(tp.plan, tp.den);

        const info = infoGruposRE.get(marca) || {};
        const exibir = colunasRE.length ? colunasRE : ['agrupamento'];
        const celulas = exibir.map(id => {
            const valor = total ? (id === exibir[0] ? 'TOTAL GERAL' : '') :
                (id === 'agrupamento' ? 'Total filtrado' : info[id] || 'N/A');
            const seguro = String(valor).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            return `<td class="re-key-cell">${seguro}</td>`;
        }).join('');
        const chaveSegura = encodeURIComponent(marca).replace(/'/g, '%27');
        return `
            <tr class="${total ? 're-total' : ''}" data-re-chave="${chaveSegura}">
                ${celulas}
                <td class="re-group-acab">${pctTxt(acabReal)}</td>
                <td class="re-group-acab">${pctTxt(acabPlan)}</td>
                <td class="re-status-cell re-group-acab" data-re-indicador="acab">${dot(status(acabReal, acabPlan))}</td>
                <td class="re-group-kit">${pctTxt(kitReal)}</td>
                <td class="re-group-kit">${pctTxt(kitPlan)}</td>
                <td class="re-status-cell re-group-kit" data-re-indicador="kit">${dot(status(kitReal, kitPlan))}</td>
                <td class="re-group-enttodos">${pctTxt(entTodosReal)}</td>
                <td class="re-group-enttodos">${pctTxt(entTodosPlan)}</td>
                <td class="re-status-cell re-group-enttodos" data-re-indicador="entTodos">${dot(status(entTodosReal, entTodosPlan))}</td>
                <td class="re-group-entcd">${pctTxt(entCDReal)}</td>
                <td class="re-group-entcd">${pctTxt(entCDPlan)}</td>
                <td class="re-status-cell re-group-entcd" data-re-indicador="entCD">${dot(status(entCDReal, entCDPlan))}</td>
                <td class="re-group-enttp">${pctTxt(entTPReal)}</td>
                <td class="re-group-enttp">${pctTxt(entTPPlan)}</td>
                <td class="re-status-cell re-group-enttp" data-re-indicador="entTP">${dot(status(entTPReal, entTPPlan))}</td>
            </tr>`;
    };

    let html = '';
    marcasOrdenadas.forEach(m => {
        html += linhaHtml(m, acabPorMarca[m], kitPorMarca[m],
            entTodos.porMarca[m], entCD.porMarca[m], entTP.porMarca[m], false);
    });

    html += linhaHtml('TOTAL GERAL', acabTotal, kitTotal,
        entTodos.total, entCD.total, entTP.total, true);
    tbody.innerHTML = html || `<tr><td colspan="${15 + Math.max(1, colunasRE.length)}" class="re-empty">Sem dados para os filtros atuais.</td></tr>`;

    window.pgREAplicarVisibilidadeV58();
    window.reAtivarCliquesTabela();
    window.renderReportExecutivaCurvaSemanal();
};


// ============================================================================
// REPORT EXECUTIVA — CURVA DE ENTREGAS PREVISTA / SEMANAL
// Usa pgObterResumoColeta(): mesma regra de Plan/Forecast já existente.
// ============================================================================
window.renderReportExecutivaCurvaSemanal = function() {
    const canvas = document.getElementById('reCurvaEntregas');
    if (!canvas || typeof Chart === 'undefined') return;

    // Em vez do Re-plan de coleta geral, usa os eventos de Entregas CD
    // já apurados no TOTAL GERAL da tabela acima.
    const fonte = window.reCurvaFonteCDV43;
    if (!fonte) return;

    const hojeIso = String(fonte.hoje || (
        (typeof dtHojeISO !== 'undefined' && dtHojeISO)
            ? dtHojeISO
            : new Date().toISOString().slice(0, 10)
    )).slice(0, 10);

    const total = Math.max(0, Number(fonte.total || 0));
    const registros = Array.isArray(fonte.registros) ? fonte.registros : [];
    const eventosHistoricos = Array.isArray(fonte.eventosPlanoHistorico)
        ? fonte.eventosPlanoHistorico : [];

    const isoDate = iso => {
        if (!iso) return null;
        const d = new Date(String(iso).slice(0, 10) + 'T12:00:00');
        return Number.isFinite(d.getTime()) ? d : null;
    };

    const toIso = d => {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const dia = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${dia}`;
    };

    const addDias = (d, dias) => {
        const x = new Date(d.getTime());
        x.setDate(x.getDate() + dias);
        return x;
    };

    const fimMes = d => new Date(d.getFullYear(), d.getMonth() + 1, 0, 12);

    const inicioSemanaSegunda = d => {
        const x = new Date(d.getTime());
        const dow = x.getDay();
        const volta = dow === 0 ? 6 : dow - 1;
        x.setDate(x.getDate() - volta);
        return x;
    };

    const fimSemanaSabado = d => addDias(inicioSemanaSegunda(d), 5);

    const nomesMes = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
    const fmtDiaMes = d => `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;

    const labelPeriodo = (ini, fim) => {
        const mes = nomesMes[ini.getMonth()];
        return `${mes} - ${String(ini.getDate()).padStart(2, '0')} a ${fmtDiaMes(fim)}`;
    };

    const datas = [];
    [...registros, ...eventosHistoricos].forEach(r => {
        const p = isoDate(r.dtPlan);
        const real = isoDate(r.dtReal);
        if (p) datas.push(p);
        if (real) datas.push(real);
    });

    const hoje = isoDate(hojeIso);
    if (!hoje) return;

    let minData = datas.length ? new Date(Math.min(...datas.map(d => d.getTime()))) : hoje;
    let maxData = datas.length ? new Date(Math.max(...datas.map(d => d.getTime()))) : hoje;
    const fimAtual = fimSemanaSabado(hoje);
    if (maxData < fimAtual) maxData = fimAtual;

    let cursor = inicioSemanaSegunda(minData);
    const periodos = [];
    let trava = 0;

    while (cursor <= maxData && trava < 80) {
        trava++;
        const semanaIni = new Date(cursor.getTime());
        const semanaFim = fimSemanaSabado(semanaIni);
        const fimDoMes = fimMes(semanaIni);
        const parte1Fim = semanaFim < fimDoMes ? semanaFim : fimDoMes;
        const parte1Atual = hoje >= semanaIni && hoje <= parte1Fim;

        periodos.push({
            ini: toIso(semanaIni),
            fim: toIso(parte1Fim),
            atual: parte1Atual,
            label: labelPeriodo(semanaIni, parte1Fim)
        });

        if (parte1Fim < semanaFim) {
            const parte2Ini = addDias(parte1Fim, 1);
            const parte2Atual = hoje >= parte2Ini && hoje <= semanaFim;
            periodos.push({
                ini: toIso(parte2Ini),
                fim: toIso(semanaFim),
                atual: parte2Atual,
                label: labelPeriodo(parte2Ini, semanaFim)
            });
        }

        cursor = addDias(semanaIni, 7);
    }

    if (!periodos.length) return;

    // Planejado fecha no fim do período (30/09 para "Set - Sem Atual").
    // Realizado segue limitado a hoje; não antecipa coletas futuras.
    const corteRealPeriodo = p => p.ini <= hojeIso && hojeIso <= p.fim
        ? hojeIso : p.fim;
    const cortePlanoPeriodo = p => p.fim;
    window.reCurvaPeriodos = periodos.map(p => ({
        ...p, corte: cortePlanoPeriodo(p),
        cortePlano: cortePlanoPeriodo(p),
        corteReal: corteRealPeriodo(p)
    }));

    const acumuladoAte = (fimIso, campoData, campoVolume, limitarHoje) => {
        let soma = 0;
        registros.forEach(r => {
            const dt = r[campoData];
            if (!dt || dt > fimIso) return;
            if (limitarHoje && dt > hojeIso) return;
            soma += Math.max(0, Number(r[campoVolume] || 0));
        });
        return soma;
    };

    const metaPct = [];
    const realPct = [];
    const metaVolume = [];
    const realVolume = [];
    const acumuladoHistorico = corte => eventosHistoricos.reduce((soma, r) =>
        soma + (r.dtPlan && r.dtPlan <= corte
            ? Math.max(0, Number(r.tiragem || 0)) : 0), 0);

    // Ajuste executivo da curva: a partir da semana de 16 a 21/11/2026,
    // o Forecast exibido passa a representar 100% da base.
    const forecast100Desde = '2026-11-16';

    periodos.forEach(p => {
        const cortePlano = cortePlanoPeriodo(p);
        const corteReal = corteRealPeriodo(p);
        // Histórico inalterado. A semana corrente considera também os
        // próximos dias planejados, até o fechamento do período (30/09).
        const metaCalculada = cortePlano < hojeIso
            ? acumuladoHistorico(cortePlano)
            : cortePlano === hojeIso
                ? Math.max(0, Number(fonte.planejadoHoje || 0))
                : acumuladoAte(cortePlano, 'dtPlan', 'tiragem', false);

        const meta = p.ini >= forecast100Desde && total > 0
            ? total
            : metaCalculada;

        const real = acumuladoAte(corteReal, 'dtReal', 'coletada', true);
        metaVolume.push(meta);
        realVolume.push(real);

        metaPct.push(total > 0 ? Math.min(100, (meta / total) * 100) : 0);
        realPct.push(
            p.ini <= hojeIso
                ? (total > 0 ? Math.min(100, (real / total) * 100) : 0)
                : null
        );
    });

    const indiceAtual = periodos.findIndex(p => p.atual);
    if (indiceAtual >= 0 && total > 0) {
        const planoFechaHoje = cortePlanoPeriodo(periodos[indiceAtual]) === hojeIso;
        const previsto = (fonte.planejadoHoje / total) * 100;
        const realizado = (fonte.realizadoHoje / total) * 100;
        // Só concilia Plan com o corte de hoje quando os dois pontos têm
        // a mesma data. Antes disso, a curva inclui corretamente o futuro.
        if ((planoFechaHoje && Math.abs(metaPct[indiceAtual] - previsto) > 0.000001) ||
            Math.abs(realPct[indiceAtual] - realizado) > 0.000001) {
            console.warn('[REPORT V43] Curva e tabela divergentes.', {
                metaCurva: metaPct[indiceAtual], planTabelaHoje: previsto,
                cortePlano: cortePlanoPeriodo(periodos[indiceAtual]),
                realCurva: realPct[indiceAtual], realTabela: realizado
            });
        }
    }

    if (window.reCurvaEntregasChart) {
        try { window.reCurvaEntregasChart.destroy(); } catch (e) {}
        window.reCurvaEntregasChart = null;
    }

    const indiceSemanaAtual = periodos.findIndex(p => p.atual);

    const pluginSemanaAtual = {
        id: 'reCurvaSemanaAtual',
        beforeDatasetsDraw(chart) {
            if (indiceSemanaAtual < 0) return;

            const { ctx, chartArea, scales } = chart;
            const x = scales.x;
            if (!x || !chartArea) return;

            const totalPontos = periodos.length;
            const centro = x.getPixelForTick(indiceSemanaAtual);

            let esquerda;
            let direita;

            if (totalPontos <= 1) {
                esquerda = chartArea.left;
                direita = chartArea.right;
            } else {
                const anterior = indiceSemanaAtual > 0
                    ? x.getPixelForTick(indiceSemanaAtual - 1)
                    : null;
                const proximo = indiceSemanaAtual < totalPontos - 1
                    ? x.getPixelForTick(indiceSemanaAtual + 1)
                    : null;

                esquerda = anterior !== null
                    ? (anterior + centro) / 2
                    : centro - (proximo - centro) / 2;

                direita = proximo !== null
                    ? (centro + proximo) / 2
                    : centro + (centro - anterior) / 2;
            }

            esquerda = Math.max(chartArea.left + 1, esquerda + 2);
            direita = Math.min(chartArea.right - 1, direita - 2);

            ctx.save();
            ctx.fillStyle = 'rgba(37, 99, 235, 0.055)';
            ctx.fillRect(
                esquerda,
                chartArea.top + 1,
                Math.max(0, direita - esquerda),
                Math.max(0, chartArea.bottom - chartArea.top - 1)
            );
            ctx.restore();
        },
        afterDraw(chart) {
            if (indiceSemanaAtual < 0) return;

            const { ctx, chartArea, scales } = chart;
            const x = scales.x;
            if (!x || !chartArea) return;

            const totalPontos = periodos.length;
            const centro = x.getPixelForTick(indiceSemanaAtual);

            let esquerda;
            let direita;

            if (totalPontos <= 1) {
                esquerda = chartArea.left;
                direita = chartArea.right;
            } else {
                const anterior = indiceSemanaAtual > 0
                    ? x.getPixelForTick(indiceSemanaAtual - 1)
                    : null;
                const proximo = indiceSemanaAtual < totalPontos - 1
                    ? x.getPixelForTick(indiceSemanaAtual + 1)
                    : null;

                esquerda = anterior !== null
                    ? (anterior + centro) / 2
                    : centro - (proximo - centro) / 2;

                direita = proximo !== null
                    ? (centro + proximo) / 2
                    : centro + (centro - anterior) / 2;
            }

            esquerda = Math.max(chartArea.left + 1, esquerda + 2);
            direita = Math.min(chartArea.right - 1, direita - 2);

            // Inclui o rótulo vertical da semana, mas preserva o título do eixo.
            const topo = chartArea.top + 2;
            const fundo = Math.min(chart.height - 30, (x.bottom || chart.height) - 24);
            const largura = Math.max(0, direita - esquerda);
            const altura = Math.max(0, fundo - topo);
            const raio = 10;

            const roundRect = (cx, cy, w, h, r) => {
                const rr = Math.min(r, w / 2, h / 2);
                ctx.beginPath();
                ctx.moveTo(cx + rr, cy);
                ctx.lineTo(cx + w - rr, cy);
                ctx.quadraticCurveTo(cx + w, cy, cx + w, cy + rr);
                ctx.lineTo(cx + w, cy + h - rr);
                ctx.quadraticCurveTo(cx + w, cy + h, cx + w - rr, cy + h);
                ctx.lineTo(cx + rr, cy + h);
                ctx.quadraticCurveTo(cx, cy + h, cx, cy + h - rr);
                ctx.lineTo(cx, cy + rr);
                ctx.quadraticCurveTo(cx, cy, cx + rr, cy);
                ctx.closePath();
            };

            ctx.save();

            roundRect(esquerda, topo, largura, altura, raio);
            ctx.strokeStyle = 'rgba(37, 99, 235, 0.82)';
            ctx.lineWidth = 2;
            ctx.stroke();

            const texto = 'Semana atual';
            ctx.font = 'bold 11px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const paddingX = 9;
            const pillH = 22;
            const pillW = Math.min(
                Math.max(ctx.measureText(texto).width + paddingX * 2, 82),
                Math.max(82, largura - 8)
            );
            const pillX = centro - pillW / 2;
            const pillY = topo + 7;

            roundRect(pillX, pillY, pillW, pillH, 11);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = 'rgba(37, 99, 235, 0.82)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = '#1d4ed8';
            ctx.fillText(texto, centro, pillY + pillH / 2 + 0.5);

            ctx.restore();
        }
    };

    const pluginLabels = {
        id: 'reCurvaEntregasLabels',
        afterDatasetsDraw(chart) {
            const { ctx } = chart;
            ctx.save();
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';

            chart.data.datasets.forEach((ds, dsIndex) => {
                const meta = chart.getDatasetMeta(dsIndex);
                meta.data.forEach((pt, i) => {
                    const valor = ds.data[i];
                    if (valor === null || valor === undefined || !Number.isFinite(Number(valor))) return;
                    const txt = `${Math.round(Number(valor))}%`;
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#ffffff';
                    ctx.strokeText(txt, pt.x, pt.y - 5);
                    ctx.fillStyle = dsIndex === 0 ? '#2f5597' : '#ff9800';
                    ctx.fillText(txt, pt.x, pt.y - 5);
                });
            });
            ctx.restore();
        }
    };

    window.reCurvaEntregasChart = new Chart(canvas, {
        type: 'line',
        data: {
            labels: periodos.map(p => p.label),
            datasets: [
                {
                    label: 'Forecast',
                    data: metaPct,
                    borderColor: '#2f5597',
                    backgroundColor: 'rgba(83, 111, 157, 0.43)',
                    fill: true,
                    tension: 0.12,
                    borderWidth: 2.2,
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    pointHitRadius: 14,
                    order: 1
                },
                {
                    label: 'Realizado',
                    data: realPct,
                    borderColor: '#ff9800',
                    backgroundColor: 'rgba(255, 152, 0, 0.22)',
                    fill: true,
                    tension: 0.12,
                    borderWidth: 2.2,
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    pointHitRadius: 14,
                    spanGaps: false,
                    order: 0
                }
            ]
        },
        plugins: [pluginSemanaAtual, pluginLabels],
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            interaction: { mode: 'index', intersect: false },

            onHover(event, elements, chart) {
                const alvo = event?.native?.target || chart.canvas;
                const pontos = chart.getElementsAtEventForMode(
                    event,
                    'nearest',
                    { intersect: true },
                    true
                );
                if (alvo && alvo.style) alvo.style.cursor = pontos.length ? 'pointer' : 'default';
            },

            onClick(event, elements, chart) {
                const pontos = chart.getElementsAtEventForMode(
                    event,
                    'nearest',
                    { intersect: true },
                    true
                );
                if (!pontos.length) return;

                const indice = pontos[0].index;
                window.reExtrairCurvaPonto(indice, chart.canvas);
            },

            layout: { padding: { top: 34, left: 10, right: 10, bottom: 0 } },
            plugins: {
                legend: {
                    position: 'top',
                    align: 'center',
                    reverse: true,
                    labels: {
                        boxWidth: 14,
                        boxHeight: 14,
                        padding: 18,
                        color: '#666666',
                        font: { family: 'Arial', size: 14, weight: 'bold' }
                    }
                },
                tooltip: {
                    callbacks: {
                        label(context) {
                            if (context.raw === null) return null;
                            const n = context.datasetIndex === 0
                                ? metaVolume[context.dataIndex]
                                : realVolume[context.dataIndex];
                            const bruto = Math.round(Number(n || 0)).toLocaleString('pt-BR');
                            const base = Math.round(total).toLocaleString('pt-BR');
                            return `${context.dataset.label}: ${Number(context.raw).toFixed(1)}% (${bruto} / ${base})`;
                        }
                    }
                }
            },
            scales: {
                y: {
                    display: false,
                    min: 0,
                    max: 105,
                    grid: { display: false, drawBorder: false }
                },
                x: {
                    offset: false,
                    grid: { display: false, drawBorder: false },
                    border: { display: false },
                    ticks: {
                        autoSkip: false,
                        maxRotation: 90,
                        minRotation: 90,
                        color: '#111111',
                        padding: 8,
                        font: { family: 'Arial', size: 11, weight: 'bold' }
                    }
                }
            }
        }
    });
};

window.reNumero = function(v) {
    if (typeof v === 'number') return Number.isFinite(v) ? v : 0;
    let s = String(v ?? '').trim();
    if (!s) return 0;
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    const n = Number(s);
    return Number.isFinite(n) ? n : 0;
};

window.rePrimeiroValor = function(valores) {
    for (const v of valores) {
        if (v !== undefined && v !== null && String(v).trim() !== '') return v;
    }
    return '';
};

window.reMarcaLinha = function(l) {
    return String(l?.MARCA_FINAL || l?.UNIDADE || l?.MARCA || 'N/A')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .trim().replace(/\s+/g, ' ').toUpperCase() || 'N/A';
};

window.reGraficaLinha = function(l) {
    return String(l?.GRAFICA_FINAL || l?.['GRÁFICA'] || l?.GRAFICA || l?.BQ || '')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .trim().replace(/\s+/g, ' ').toUpperCase();
};

window.reTiragemLinha = function(l) {
    return Math.max(0, window.reNumero(l?.TIRAGEM ?? l?.QUANTIDADE ?? 0));
};

window.reTiragemColetadaLinha = function(l) {
    const campo = window.pgCampoColeta;
    const valor = window.rePrimeiroValor([
        campo ? campo(l, 'TIRAGEM COLETADA') : '',
        l?.VOLUME_AZ,
        l?.GIRO_COLETADA_AZ
    ]);
    return Math.max(0, window.reNumero(valor));
};

window.reUsuarioEmail = function() {
    try {
        if (typeof pgEmailAtual === 'function') {
            const e = pgEmailAtual();
            if (e) return String(e).trim().toLowerCase();
        }
    } catch (e) {}
    return String(window.PG_USER_EMAIL || '').trim().toLowerCase();
};

// A mesma planilha, mesmo cabeçalho e mesma ação da Report Executiva.
// Não faz join por SKU sozinho: cada registro pertence à sua linha de origem.
// Planilha única, usada pelo Funil e Report Executiva.
// Cada linha física mantém sua identidade; nunca associa marcas apenas por SKU.
window.pgExportarVisaoCompletaV37 = function(dataCorte, titulo, elemento, resumoFiltro = null) {
    const resumo = resumoFiltro || window.pgObterResumoColeta();
    const corte = String(dataCorte || dtHojeISO).slice(0, 10);
    const corteReal = corte > dtHojeISO ? dtHojeISO : corte;
    const header = [
        'Grupo','Indicador','Cenário','Acumulado até','Origem','Marca','Gráfica',
        'Série','SKU','Descrição','CD Destino','Envio','Chave',
        'DT Vencido','DT a vencer','Data Planejada','Data Real',
        'Tiragem Vencida','A Vencer','Quantidade','Tiragem Coletada',
        'Coleta TP','Mapa Agendado','Data Replan','Tiragem Replan',
        'Plan na Curva','Realizado','Backlog na Data','Gap'
    ];
    const index = nome => header.indexOf(nome);
    const linhas = [];
    const totais = Array(header.length).fill('');
    totais[0] = 'TOTAL GERAL';
    const numericas = [
        'Tiragem Vencida','A Vencer','Quantidade','Tiragem Coletada',
        'Tiragem Replan','Plan na Curva','Realizado','Backlog na Data','Gap'
    ];
    numericas.forEach(c => totais[index(c)] = 0);
    (resumo.registros || []).forEach(r => {
        const l = r.linha || r.pcp;
        if (!l) return;
        window.pgCorrigirChaveMarcaSasWays?.(l);
        const p = r.prazo || window.pgPrazoLinhaV35(l, dtHojeISO);
        const quantidade = p.vencida + p.aVencer;
        const real = p.dtColeta && p.dtColeta <= corteReal ? p.coletadaBruta : 0;
        const gap = Math.max(0, quantidade - real);
        const saldo = window.pgSaldoPrazoV35(p, corte, dtHojeISO);
        const volumePlanCurva = r.dtPlan && r.dtPlan <= corte
            ? Number(r.tiragem || 0) : 0;
        const tiragemReplan = Number(r.tiragem || 0);
        const bruto = Number(r.mapaSolicitado || 0);
        if (!(quantidade > 0 || bruto > 0 || tiragemReplan > 0)) return;
        const fonte = String(l._SOURCE || l.BASE || 'PCP');
        // DT Vencido e DT a vencer têm colunas próprias: nunca inventar uma
        // data única quando um mesmo registro possui ambas as parcelas.
        const dataPlan = [p.dtVencida, p.dtAVencer]
            .filter((d, i, datas) => d && datas.indexOf(d) === i).join(' / ');
        const row = [
            'Coleta', titulo || 'Visão completa', 'Acumulado', corte,
            fonte, window.reMarcaLinha(l), window.reGraficaLinha(l),
            String(l['SÉRIE'] || l['Série'] || l.SERIE || ''),
            String(l.SKU_REAL || l.SKU || ''),
            String(l.DESC_REAL || l['DESCRIÇÃO'] || l.DESCRICAO || l.PRODUTO || ''),
            String(l.CD_FINAL || l['CD DESTINO'] || l.CD || ''),
            String(l.ENVIO || l.Envio || ''),
            String(l.JOIN_KEY || l.Chave || l.CHAVE || ''),
            p.dtVencida || '', p.dtAVencer || '', dataPlan,
            real > 0 ? p.dtColeta : '',
            p.vencida, p.aVencer, quantidade, bruto,
            p.dtColeta || '', p.dtMapaAgendado || '', r.dtPlan || '',
            tiragemReplan, volumePlanCurva, real, saldo.vencido,
            gap
        ];
        linhas.push(row);
        numericas.forEach(c => totais[index(c)] += Number(row[index(c)] || 0));
    });
    // O rodapé do Sheets é o total da visão completa, nunca de um indicador parcial.
    linhas.push(totais);
    const esperadoPlan = (resumo.registros || []).reduce((sum,r) =>
        sum + (r.dtPlan && r.dtPlan <= corte ? Number(r.tiragem || 0) : 0), 0);
    const esperadoReal = (resumo.registros || []).reduce((sum,r) =>
        sum + (r.dtReal && r.dtReal <= corteReal ? Number(r.coletada || 0) : 0), 0);
    console.info('[EXTRACAO UNICA V37]', {
        titulo, corte, linhas: linhas.length-1,
        planPlanilha: totais[index('Plan na Curva')], esperadoPlan,
        realPlanilha: totais[index('Realizado')], esperadoReal,
        quantidade: totais[index('Quantidade')], gap: totais[index('Gap')]
    });
    if (Math.abs(totais[index('Plan na Curva')] - esperadoPlan) > 0.01 ||
        Math.abs(totais[index('Realizado')] - esperadoReal) > 0.01) {
        console.warn('[CONCILIACAO V37] Diferenca entre itens e curva.', {
            esperadoPlan, esperadoReal, extraido:totais
        });
    }
    window.reCriarSheets(
        'Coleta_' + corte.replaceAll('-',''),
        [{nome:'Visao_Completa',cabecalho:header,linhas}],elemento
    );
};

window.pgExtrairPontoColetaV35 = function(sufixo = '', indice = 0, tipo = 'dia', elemento) {
    const visao = window.pgExtracaoColetaV35?.[sufixo || 'FUNIL'];
    if (!visao) return;
    const tiposResumo = ['base','planPeriodo','realTotal','realPeriodo',
                         'forecastFim','agendadoPeriodo','backlogAtual','semData'];
    const data = tipo === 'realTotal' ? visao.corteRealResumo || visao.fim
        : tiposResumo.includes(tipo) ? visao.fim : visao.pontos[indice];
    if (!data) return;
    if (visao.tipo === 'entrega') {
        window.pgExportarVisaoEntregaCD(data, 'Entregas ' + visao.cd, elemento, visao.resumo);
        return;
    }
    window.pgExportarVisaoCompletaV37(data,
        'Funil de Coleta', elemento, visao.resumo);
};

window.reLinhaExportacao = function(l, extra = {}) {
    window.pgCorrigirChaveMarcaSasWays?.(l);
    const p = window.pgPrazoLinhaV35(l, dtHojeISO);
    return [
        extra.grupo || '', extra.indicador || '', extra.cenario || '', extra.acumuladoAte || '',
        l?._SOURCE || 'PCP', window.reMarcaLinha(l), window.reGraficaLinha(l),
        String(l?.['SÉRIE'] || l?.['Série'] || l?.SERIE || ''),

window.reCriarSheets = function(nome, abas, elemento) {
    abas = (abas || []).filter(a => Array.isArray(a.linhas) && a.linhas.length > 0);

    if (!abas.length) {
        alert('Não há itens para extrair neste ponto.');
        return;
    }

    const novaAba = window.open('about:blank', '_blank');
    const anterior = elemento?.style?.cursor;
    if (elemento?.style) elemento.style.cursor = 'wait';

    const finalizar = () => {
        if (elemento?.style) elemento.style.cursor = anterior || 'pointer';
    };

    const falhar = erro => {
        finalizar();
        if (novaAba) novaAba.close();
        alert('Erro ao gerar planilha: ' + erro);
    };

    google.script.run
        .withSuccessHandler(res => {
            finalizar();

            if (!res || !res.success) {
                falhar(res?.error || 'Erro desconhecido');
                return;
            }

            if (novaAba) novaAba.location.href = res.url;

            if (res.ownerOk === false) {
                alert(
                    'A planilha foi criada, mas o Google Workspace não permitiu confirmar ' +
                    'a propriedade para ' + (res.usuario || 'o usuário atual') +
                    '. Proprietário detectado: ' + (res.ownerEmail || 'não identificado') +
                    (res.ownerWarning ? '\n\n' + res.ownerWarning : '')
                );
            }
        })
        .withFailureHandler(err => falhar(err?.message || err))
        .gerarPlanilhaReportExecutiva({
            nome,
            usuarioEmail: window.reUsuarioEmail(),
            abas
        });
};

window.rePendenciasAcabamento = function(marca) {
    const hojeIso = window.pgREDataCorteV57 ||
        ((typeof dtHojeISO !== 'undefined' && dtHojeISO)
            ? dtHojeISO : new Date().toISOString().slice(0, 10));
    const tRef = document.getElementById('filtroReferencia')?.value || 'replan';
    const f = FASES.find(x => x.id === 'acab');
    const todas = marca === 'TOTAL GERAL';
    if (!f) return [];

    const saida = [];

    (window.dadosAcabamentoOrigem || []).forEach(l => {
        if (!todas && !window.reLinhaNoGrupoV42(l, marca)) return;
        if (!belongsToPhase(l, 'acab')) return;

        const volume = window.reTiragemLinha(l);
        if (volume <= 0) return;

        const dtPlan = window.pgDataPlanoFaseFunil(l, f, tRef);
        const dias = dtPlan ? calcDiffDiasISO(dtPlan, hojeIso) : null;
        if (!(dtPlan && dias !== null && dias >= 3)) return;
        const dtAcabRealV57 = extrairDataISO(l[f.colReal]);
        if (dtAcabRealV57 && dtAcabRealV57 <= hojeIso &&
            dataFoiPreenchida(l, f)) return;

        saida.push(window.reLinhaExportacao(l, {
            grupo: 'Gap',
            indicador: 'Mat. Acabado',
            cenario: 'Mesmo critério do Funil',
            acumuladoAte: hojeIso,
            dtPlan,
            dtReal: '',
            volumePlan: volume,
            volumeReal: 0,
            gap: volume
        }));
    });

    return saida;
};

window.rePendenciasKit = function(marca) {
    const baseGeral = window.pgBaseGeralReportExecutiva || [];
    const hojeIso = window.pgREDataCorteV57 ||
        ((typeof dtHojeISO !== 'undefined' && dtHojeISO)
            ? dtHojeISO : new Date().toISOString().slice(0, 10));
    const tRef = document.getElementById('filtroReferencia')?.value || 'replan';
    const f = FASES.find(x => x.id === 'kit');
    const todas = marca === 'TOTAL GERAL';
    if (!f) return [];

    const base = window.pgLinhasUnicas([
        ...baseGeral.filter(l =>
            !window.pgEhFonteAcabadora(l) &&
            !window.pgEhDestinoAcabadora(l)
        ),
        ...baseGeral.filter(l =>
            window.pgEhFonteAcabadora(l) &&
            window.pgAcabadoraDaLista(l)
        )
    ]);

    const saida = [];

    base.forEach(l => {
        if (!todas && !window.reLinhaNoGrupoV42(l, marca)) return;

        const volume = window.reTiragemLinha(l);
        if (!(volume > 0)) return;

        const dtPlan = window.pgDataPlanoFaseFunil(l, f, tRef);
        const dias = dtPlan ? calcDiffDiasISO(dtPlan, hojeIso) : null;
        if (!(dtPlan && dias !== null && dias >= 3)) return;

        const dtReal = window.pgDataRealFaseFunil(l, f);
        const volumeReal = dtReal && dtReal <= hojeIso && dataFoiPreenchida(l, f)
            ? volume : 0;
        const gap = Math.max(0, volume - volumeReal);
        if (!(gap > 0)) return;

        saida.push(window.reLinhaExportacao(l, {
            grupo: 'Gap',
            indicador: 'Form. Kit',
            cenario: 'PCP direto ao CD + PCP_ACABADORAS oficiais',
            acumuladoAte: hojeIso,
            dtPlan,
            dtReal: dtReal || '',
            volumePlan: volume,
            volumeReal,
            gap
        }));
    });

    return saida;
};

window.rePendenciasEntrega = function(marca, destino, tipoReal = 'coleta') {
    const baseGeral = window.pgBaseGeralReportExecutiva || [];
    const hojeIso = window.pgREDataCorteV57 ||
        ((typeof dtHojeISO !== 'undefined' && dtHojeISO)
            ? dtHojeISO : new Date().toISOString().slice(0, 10));
    const tRef = document.getElementById('filtroReferencia')?.value || 'replan';
    const f = FASES.find(x => x.id === 'ent_tp');
    const todas = marca === 'TOTAL GERAL';
    if (!f) return [];

    let pcp = baseGeral.filter(l => window.pgLinhaDaOrigem(l, 'GRAFICA'));
    if (destino !== 'TODOS') {
        pcp = pcp.filter(l => window.pgLinhaDoDestino(l, destino, 'GRAFICA'));
    }

    const saida = [];

    pcp.forEach(l => {
        if (!todas && !window.reLinhaNoGrupoV42(l, marca)) return;

        const volumePlan = window.reTiragemLinha(l);
        if (volumePlan <= 0) return;

        const dtPlan = tipoReal === 'entrega'
            ? window.pgDataPlanoEntregaSLA(l)
            : window.pgDataPlanoFaseFunil(l, f, tRef);
        const dias = dtPlan ? calcDiffDiasISO(dtPlan, hojeIso) : null;
        if (!(dtPlan && dias !== null && dias >= 0)) return;

        const campoReal = tipoReal === 'entrega' ? 'Entrega_TP' : 'Coleta_TP';
        const dtReal = window.pgNormalizarDataColeta(
            window.pgCampoColeta(l, campoReal), hojeIso
        );
        const volumeReal = window.pgVolumesColetaUnificadosV37(l, hojeIso)[tipoReal];
        const gap = Math.max(0, volumePlan - volumeReal);
        if (gap <= 0) return;

        saida.push(window.reLinhaExportacao(l, {
            grupo: 'Gap',
            indicador: tipoReal === 'entrega'
                ? 'Entrega TP - CD'
                : destino === 'TODOS' ? 'Coletados - CD + Acab.' : 'Coletados - CD',
            cenario: destino === 'TODOS'
                ? 'Origem Gráfica / Destino Todos'
                : 'Origem Todas / Destino CD',
            acumuladoAte: hojeIso,
            dtPlan,
            dtReal: dtReal || '',
            volumePlan,
            volumeReal,
            gap
        }));
    });

    return saida;
};

window.reExtrairPendenciasTabela = function(tipo, marca, elemento) {
    let linhas = [];
    let indicador = '';

    if (tipo === 'acab') {
        indicador = 'Mat_Acabado';
        linhas = window.rePendenciasAcabamento(marca);
    } else if (tipo === 'kit') {
        indicador = 'Formacao_Kit';
        linhas = window.rePendenciasKit(marca);
    } else if (tipo === 'entTodos') {
        indicador = 'Coletados_CD_Acab';
        linhas = window.rePendenciasEntrega(marca, 'TODOS');
    } else if (tipo === 'entCD') {
        indicador = 'Coletados_CD';
        linhas = window.rePendenciasEntrega(marca, 'CD');
    } else if (tipo === 'entTP') {
        indicador = 'Entrega_TP_CD';
        linhas = window.rePendenciasEntrega(marca, 'CD', 'entrega');
    }

    const marcaNome = String(marca || 'TOTAL').replace(/[^A-Za-z0-9_-]+/g, '_');

    window.reCriarSheets(
        `Report_Executiva_${indicador}_${marcaNome}`,
        [{
            nome: 'Pendencias',
            cabecalho: window.reCabecalhoExportacao,
            linhas
        }],
        elemento
    );
};

window.reAtivarCliquesTabela = function() {
    const tbody = document.getElementById('reTabelaMarcas');
    if (!tbody) return;

    tbody.querySelectorAll('.re-dot-yellow, .re-dot-red').forEach(dot => {
        const td = dot.closest('td');
        const tr = dot.closest('tr');
        if (!td || !tr) return;

        const marca = decodeURIComponent(tr.dataset.reChave || '');
        const tipo = td.dataset.reIndicador || '';

        if (!tipo) return;

        td.classList.add('re-status-clickable');
        td.tabIndex = 0;
        td.setAttribute('role', 'button');
        td.setAttribute('title', 'Clique para extrair as pendências deste indicador');

        const executar = () => window.reExtrairPendenciasTabela(tipo, marca, td);

        td.addEventListener('click', executar);
        td.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                executar();
            }
        });
    });
};

// V43C - Extracao independente das versoes V21 e V37.
window.reExtrairCurvaPonto = function(indice, elemento) {
    const periodo = (window.reCurvaPeriodos || [])[indice];
    const fonte = window.reCurvaFonteCDV43;
    if (!periodo || !fonte) return;
    const cortePlano = periodo.cortePlano || periodo.corte || periodo.fim;
    const corteReal = periodo.corteReal || (cortePlano > fonte.hoje ? fonte.hoje : cortePlano);
    const normalizar = v => String(v ?? '').normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '').trim().replace(/\s+/g, ' ').toUpperCase();
    const chave = l => {
        window.pgCorrigirChaveMarcaSasWays?.(l);
        const origem = normalizar(l?._SOURCE || l?.BASE || l?._base || 'PCP');
        const marca = normalizar(l?.MARCA_FINAL || l?.UNIDADE || l?.MARCA);
        const id = normalizar(l?.JOIN_KEY || l?.Chave || l?.CHAVE || '');
        const sku = normalizar(l?.SKU_REAL || l?.SKU || '');
        const grafica = normalizar(l?.GRAFICA_FINAL || l?.['GRÁFICA'] || l?.GRAFICA);
        const cd = normalizar(l?.CD_FINAL || l?.['CD DESTINO'] || l?.CD);
        const serie = normalizar(l?.['SÉRIE'] || l?.['Série'] || l?.SERIE);
        return [origem, marca, id, sku, grafica, cd, serie].join('|');
    };
    const planoFonte = cortePlano <= fonte.hoje
        ? (fonte.eventosPlanoHistorico || fonte.eventosPlano || [])
        : (fonte.eventosPlano || []);
    const planos = planoFonte.filter(r =>
        r.dtPlan && r.dtPlan <= cortePlano && Number(r.tiragem || 0) > 0);
    const reais = (fonte.eventosReal || []).filter(r =>
        r.dtReal && r.dtReal <= corteReal && Number(r.coletada || 0) > 0);
    const saldos = new Map();
    reais.forEach(r => {
        const k = chave(r.linha || r.pcp);
        if (!saldos.has(k)) saldos.set(k, []);
        saldos.get(k).push({r, saldo: Number(r.coletada || 0)});
    });
    const criarLinha = (l, plan, real, dtPlan, dtReal, indicador) =>
        window.reLinhaExportacao(l, {
            grupo: 'Meta', indicador, cenario: 'Origem Todas / Destino CD',
            acumuladoAte: cortePlano, dtPlan: dtPlan || '', dtReal: dtReal || '',
            volumePlan: plan, volumeReal: real, gap: Math.max(0, plan - real)
        });
    const linhas = [];
    planos.forEach(p => {
        const l = p.linha || p.pcp;
        const lista = saldos.get(chave(l)) || [];
        let restante = Number(p.tiragem || 0), alocado = 0, dataReal = '';
        lista.forEach(item => {
            if (restante <= 0 || item.saldo <= 0) return;
            const n = Math.min(restante, item.saldo);
            restante -= n; item.saldo -= n; alocado += n;
            dataReal = item.r.dtReal || dataReal;
        });
        linhas.push(criarLinha(l, Number(p.tiragem || 0), alocado,
            p.dtPlan, dataReal, 'Curva de Entregas Prevista'));
    });
    // Realizado excedente fica explicito em vez de sumir da extracao.
    saldos.forEach(lista => lista.forEach(item => {
        if (item.saldo > 0) linhas.push(criarLinha(item.r.linha || item.r.pcp,
            0, item.saldo, '', item.r.dtReal, 'Realizado excedente'));
    }));
    const cab = window.reCabecalhoExportacao || [];
    const ip = cab.indexOf('Volume Plan'), ir = cab.indexOf('Volume Real');
    if (ip >= 0 && ir >= 0) {
        const soma = idx => linhas.reduce((s, row) => s + Number(row[idx] || 0), 0);
        const p = planos.reduce((s, row) => s + Number(row.tiragem || 0), 0);
        const r = reais.reduce((s, row) => s + Number(row.coletada || 0), 0);
        if (Math.abs(soma(ip) - p) > 0.01 || Math.abs(soma(ir) - r) > 0.01) {
            console.error('[V43C] Divergencia na extracao Meta_Azul.');
            alert('A extracao nao conciliou com a curva. Nenhuma planilha foi gerada.');
            return;
        }
    }
    if (!linhas.length) { alert('Sem itens neste ponto.'); return; }
    window.reCriarSheets('Report_Executiva_Curva_' +
        String(periodo.label || cortePlano).replace(/[^A-Za-z0-9_-]+/g, '_'),
        [{nome: 'Meta_Azul', cabecalho: window.reCabecalhoExportacao, linhas}], elemento);
};
