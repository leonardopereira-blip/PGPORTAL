    // Cache escalar: datas se repetem milhares de vezes entre abas/fases.
    // Mantém exatamente o mesmo parser; apenas evita refazer o trabalho.
    const pgCacheExtrairDataISO = new Map();

    function extrairDataISO(str) {
        if (!str || String(str).trim() === "") return null;

        const chaveCache = typeof str + '\u0001' + String(str);
        if (pgCacheExtrairDataISO.has(chaveCache)) {
            return pgCacheExtrairDataISO.get(chaveCache);
        }

        let s = String(str).trim();
        let resultado = null;

        if (!(s.length < 6 || s.toLowerCase().includes("não") || s.toLowerCase().includes("n/a") || s === "-")) {
            if (s.includes('T')) s = s.split('T')[0];
            if (s.includes(' ')) s = s.split(' ')[0];

            if (s.includes('/')) {
                const pts = s.split('/');
                if (pts.length === 3) resultado = `${pts[2]}-${pts[1].padStart(2,'0')}-${pts[0].padStart(2,'0')}`;
            }
            if (resultado === null && s.includes('-')) {
                const pts = s.split('-');
                if (pts.length === 3 && pts[0].length === 4) resultado = `${pts[0]}-${pts[1].padStart(2,'0')}-${pts[2].padStart(2,'0')}`;
            }
        }

        if (pgCacheExtrairDataISO.size >= 4096) pgCacheExtrairDataISO.clear();
        pgCacheExtrairDataISO.set(chaveCache, resultado);
        return resultado;
    }

    function formatarDataBR(isoStr) {
        if(!isoStr) return "-";
        let p = isoStr.split('-'); return `${p[2]}/${p[1]}/${p[0]}`;

    function calcDiffDiasISO(isoIni, isoFim) {
        if(!isoIni || !isoFim) return null;
        let p1 = isoIni.split('-'); let d1 = new Date(p1[0], p1[1]-1, p1[2]);
        let p2 = isoFim.split('-'); let d2 = new Date(p2[0], p2[1]-1, p2[2]);
        return Math.floor((d2.getTime() - d1.getTime()) / 86400000);
    }

    function sortGMarca(a, b) { 
        let g1 = String((a && (a.grafica || a.g)) || "N/A"); let g2 = String((b && (b.grafica || b.g)) || "N/A");
        let m1 = String((a && (a.marca || a.m)) || "N/A"); let m2 = String((b && (b.marca || b.m)) || "N/A");
        let g = g1.localeCompare(g2); return g !== 0 ? g : m1.localeCompare(m2); 
    }

    // Identidade estável: a linha física preserva lotes/desdobramentos legítimos.
    // Caches antigos usam o conteúdo completo, nunca somente SKU/OP.
    const pgChavesLinhas = new WeakMap();

    window.pgCorrigirChaveMarcaSasWays = function(l) {
        if (!l || typeof l !== 'object') return l;

        const fonte = String(l._SOURCE || l.BASE || l._base || '')
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .trim().toUpperCase();

        if (!fonte.includes('ACAB')) return l;

        const marca = String(l.MARCA_FINAL || l.UNIDADE || l.MARCA || '')
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .trim().toUpperCase();

        const corrigir = valor => {
            const chave = String(valor || '').trim();
            if (!chave) return chave;

            if (marca === 'SAS' && /^WAYS(?=CD)/i.test(chave)) {
                return 'SAS' + chave.slice(4);
            }

            if (marca === 'WAYS' && /^SAS(?=CD)/i.test(chave)) {
                return 'WAYS' + chave.slice(3);
            }

            return chave;
        };

        if (l.JOIN_KEY != null) l.JOIN_KEY = corrigir(l.JOIN_KEY);
        if (l.Chave != null) l.Chave = corrigir(l.Chave);
        if (l.CHAVE != null) l.CHAVE = corrigir(l.CHAVE);

        return l;
    };

    function getKey(l) {
        window.pgCorrigirChaveMarcaSasWays(l);

        if (!pgChavesLinhas.has(l)) {
            const fonte = l._SOURCE || l.BASE || l._base || 'PCP';
            const chave = l._ROW_ID || JSON.stringify(Object.keys(l).sort().map(k => [k, l[k]]));
            pgChavesLinhas.set(l, fonte + '|' + chave);
        }
        return pgChavesLinhas.get(l);
    }

    window.pgLinhasUnicas = function(linhas) {
        const vistas = new Set();
        return (linhas || []).filter(l => {
            const chave = getKey(l);
            if (vistas.has(chave)) return false;
            vistas.add(chave);
            return true;
        });
    };

    function pgBelongsToPhaseSemCache(linha, fId) {
    // FORMAÇÃO DE KIT em TODAS + TODOS:
    // soma literalmente PCP + PCP_ACABADORAS, independente do roteamento.
    if (
        fId === 'kit' &&
        window.pgOrigemAtivaPortal === 'TODOS' &&
        window.pgDestinoAtivoPortal === 'TODOS'
    ) {
        return true;
    }

    if (linha["_SOURCE"] === "ACABADORA") {
        const fasesIgnoradasAcabadora = ['env', 'rec', 'apv', 'imp', 'tra', 'cus_ini', 'cus_fim', 'oc_ini', 'oc_fim'];
        if (fasesIgnoradasAcabadora.includes(fId)) return false;
        return true;
    }
    if (linha["_SOURCE"] === "PCP" || !linha["_SOURCE"]) {
        // Acabamento preserva seu roteamento histórico; demais fases usam a lista atual.
        const vaiParaAcabadora = fId === 'acab'
            ? window.pgDestinoAcabadoraCongelado(linha)
            : window.pgEhDestinoAcabadora(linha);

        if (vaiParaAcabadora) {
            const congelado = String(linha['Congelado'] ?? linha['CONGELADO'] ?? '')
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .trim().toUpperCase();
            const congeladoSim = ['SIM', 'S', 'YES', 'TRUE', '1'].includes(congelado);

            // SAS destinada à acabadora: a conclusão de acabamento deve vir
            // exclusivamente da fonte PCP_ACABADORAS, inclusive se congelada.
            // Outras marcas podem aproveitar o acabamento concluído no PCP.
            if (fId === 'acab') {
                const marca = String(linha.MARCA_FINAL || linha.UNIDADE || linha.MARCA || '')
                    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                    .trim().toUpperCase();
                return marca !== 'SAS';
            }

            const fasesDaAcabadora = ['rec_acab', 'acab', 'kit'];
            if (fasesDaAcabadora.includes(fId)) return false;
        } else {
            if (fId === 'tra' || fId === 'rec_acab') return false;
        }
    }
    return true;
}


    let pgBelongsCacheChave = '';
    let pgBelongsCache = new WeakMap();

    function belongsToPhase(linha, fId) {
        if (!linha || typeof linha !== 'object') {
            return pgBelongsToPhaseSemCache(linha, fId);
        }

        const chaveAtual = [
            window.pgVersaoFiltros || 0,
            window.pgOrigemAtivaPortal || '',
            window.pgDestinoAtivoPortal || ''
        ].join('|');

        if (chaveAtual !== pgBelongsCacheChave) {
            pgBelongsCacheChave = chaveAtual;
            pgBelongsCache = new WeakMap();
        }

        let porFase = pgBelongsCache.get(linha);
        if (!porFase) {
            porFase = new Map();
            pgBelongsCache.set(linha, porFase);
        }

        if (porFase.has(fId)) return porFase.get(fId);

        const resultado = pgBelongsToPhaseSemCache(linha, fId);
        porFase.set(fId, resultado);
        return resultado;
    }

window.pgEstadoColetaMapa = function(l) {
    const campo = nome => window.pgCampoColeta(l, nome);
    const primeiro = valores => valores.find(v => v !== undefined && v !== null && String(v).trim() !== '');
    const numero = v => {
        if (typeof v === 'number') return Number.isFinite(v) ? v : 0;
        let t = String(v ?? '').trim().replace(/\s/g, '');
        if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
        else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
        return Number(t) || 0;
    };
    const ay = String(primeiro([l.GIRO_STATUS_AY, l.AY, campo('STATUS COLETA')]) ?? '')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toUpperCase();
    const total = Math.max(0, numero(primeiro([campo('TIRAGEM'), l.GIRO_TOTAL_BA, campo('TIRAGEM TOTAL'), campo('QUANTIDADE')])));
    const coletada = Math.max(0, numero(primeiro([l.GIRO_COLETADA_AZ, campo('TIRAGEM COLETADA'), l.VOLUME_AZ])));
    const saldo = Math.max(0, total - coletada);
    const statusPendenteAY = /PEND|NAO COLET|NAO SOLICIT|COLETADO A MENOS|PARCIAL/.test(ay);
    // O status textual não reabre uma coleta cujo volume já foi integralmente atendido.
    const volumeConcluido = total > 0 && saldo === 0;
    const pendenteAY = statusPendenteAY && !volumeConcluido;
    return { ay, total, coletada, saldo, pendenteAY,
        pendente: pendenteAY || saldo > 0,
        concluida: total > 0 && saldo === 0 && !pendenteAY,
        parcial: !volumeConcluido && (ay.includes('COLETADO A MENOS') || (coletada > 0 && saldo > 0)) };
};
const pgCacheNormalizarDataColeta = new Map();

window.pgNormalizarDataColeta = function(v, hoje = dtHojeISO) {
    if (v === null || v === undefined || String(v).trim() === '' || Number(v) === 0) return null;

    const hojeRef = String(hoje || dtHojeISO);
    const chaveCache = hojeRef + '\u0001' + typeof v + '\u0001' + String(v);

    if (pgCacheNormalizarDataColeta.has(chaveCache)) {
        return pgCacheNormalizarDataColeta.get(chaveCache);
    }

    let iso;
    if (typeof v === 'number') {
        if (!Number.isFinite(v) || v <= 0) {
            pgCacheNormalizarDataColeta.set(chaveCache, null);
            return null;
        }
        const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(v) * 86400000);
        if (!Number.isFinite(d.getTime())) {
            pgCacheNormalizarDataColeta.set(chaveCache, null);
            return null;
        }
        iso = d.toISOString().slice(0, 10);
    } else {
        const s = String(v).trim();
        let m = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:T|$|\s)/);
        if (m) iso = `${m[1]}-${m[2]}-${m[3]}`;
        else {
            m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:$|\s)/);
            if (m) iso = `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
        }
    }

    let resultado = iso || null;

    if (resultado) {
        const d = new Date(resultado + 'T00:00:00Z');
        if (!Number.isFinite(d.getTime()) || d.getTime() <= 0 || d.toISOString().slice(0, 10) !== resultado) {
            resultado = null;
        }
    }

    if (resultado) {
        // Blindagem da visão mensal preservada integralmente.
        const anoRef = Number(hojeRef.slice(0, 4));
        const ano = Number(resultado.slice(0, 4));
        if (Number.isFinite(anoRef) && (ano < anoRef - 2 || ano > anoRef + 3)) {
            resultado = null;
        }
    }

    if (pgCacheNormalizarDataColeta.size >= 4096) pgCacheNormalizarDataColeta.clear();
    pgCacheNormalizarDataColeta.set(chaveCache, resultado);
    return resultado;
};

// Prazo único da rota, compartilhado pelo planejamento e sua base auditável.
// Zero é um prazo válido; rota ausente não recebe prazo inventado.
window.pgDiasSLALinha = function(l) {
    const matriz = window.PG_MATRIZ_SLA;
    if (!Array.isArray(matriz)) return null;
    const norm = v => String(v ?? '').normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '').trim().replace(/\s+/g, ' ').toUpperCase();
    if (window.pgMatrizSLAReferencia !== matriz) {
        const rotas = new Map();
        const cabecalho = matriz.findIndex(r => norm(r[0]) === 'FORNECEDOR');
        if (cabecalho >= 0) {
            const destinos = matriz[cabecalho].map(norm);
            matriz.slice(cabecalho + 1).forEach(r => {
                const fornecedor = norm(r[0]);
                if (!fornecedor) return;
                destinos.slice(1).forEach((destino, i) => {
                    const valor = r[i + 1];
                    if (!destino || valor == null || String(valor).trim() === '') return;
                    const dias = Number(String(valor).replace(',', '.'));
                    if (Number.isInteger(dias) && dias >= 0) {
                        rotas.set(fornecedor + '\u001f' + destino, dias);
                    }
                });
            });
        }
        window.pgMatrizSLARotas = rotas;
        window.pgMatrizSLAReferencia = matriz;
    }
    const fornecedor = norm(l.GRAFICA_FINAL || window.pgCampoColeta(l, 'GRÁFICA') || l.GRAFICA);
    const destino = norm(l.CD_FINAL || window.pgCampoColeta(l, 'CD DESTINO') || l.CD);
    const dias = window.pgMatrizSLARotas.get(fornecedor + '\u001f' + destino);
    return dias === undefined ? null : dias;
};

// Planejamento de Entrega TP: coleta planejada + dias da rota na Matriz_SLA.
window.pgDataPlanoEntregaSLA = function(l, coletaPlanejada = window.pgDataPlanoColetaLinha(l)) {
    const coleta = coletaPlanejada;
    if (!coleta) return null;
    const dias = window.pgDiasSLALinha(l);
    if (dias === null) return null;
    const entrega = new Date(coleta + 'T12:00:00Z');
    entrega.setUTCDate(entrega.getUTCDate() + dias);
    return entrega.toISOString().slice(0, 10);
};

const pgCacheVolumesColetaV37 = new WeakMap();

window.pgVolumesColetaUnificadosV37 = function(linha, corte = dtHojeISO) {
    let base = linha && typeof linha === 'object'
        ? pgCacheVolumesColetaV37.get(linha)
        : null;

    if (!base) {
        const n = nome => window.pgNumeroPrazoV35(window.pgCampoPrazoV35(linha, nome));
        const d = nome => window.pgNormalizarDataColeta(
            window.pgCampoPrazoV35(linha, nome), dtHojeISO
        );

        base = {
            bruto: n('TIRAGEM COLETADA'),
            coletaTP: d('Coleta_TP'),
            entregaTP: d('Entrega_TP')
        };

        if (linha && typeof linha === 'object') {
            pgCacheVolumesColetaV37.set(linha, base);
        }
    }

    return {
        mapa: base.bruto,
        coleta: base.coletaTP && base.coletaTP <= corte ? base.bruto : 0,
        entrega: base.entregaTP && base.entregaTP <= corte ? base.bruto : 0,
        coletaTP: base.coletaTP,
        entregaTP: base.entregaTP
    };
};

window.getVolFase = function(linha, fObj, tBase) {
    // MAPA SOLICITADO = TIRAGEM COLETADA bruta.
    if (fObj.id === 'col_mapa') {

    if (fObj.id === 'ent_tp') {

    if (!fObj.colVol) return tBase;

    ) {
        val = linha[
            String(fObj.colVol)
                .replace('#', '')
                .trim()
        ];
    }

    if (
        val === undefined ||
        val === null ||
        val === ""
    ) {
        val = linha['Tiragem Internalizada'];
    }

    if (
        val === undefined ||
        val === null ||
        val === ""
    ) {
        val = linha['# Tiragem Internalizada'];
    }

    return window.arredondar(val || 0);
};

    function getCols(fObj, tRef) { return { plan: (tRef === 'baseline' && fObj.colBase) ? fObj.colBase : fObj.colPlan, real: fObj.colReal, realAlt: fObj.colRealAlt, iniReal: fObj.colIniReal }; }
    
    window.pgDataPlanoFaseFunil = function(l, f, tRef) {
        const campo = n => window.pgCampoColeta(l, n);
        if (['col_mapa', 'col_tp', 'ent_tp', 'ent_cd'].includes(f.id)) {
            return window.pgDataPlanoColetaLinha(l);
        }
        if (f.id !== 'kit') return extrairDataISO(l[getCols(f, tRef).plan]);
        const replan = campo(f.colPlan);
        const valor = tRef === 'baseline' || String(replan ?? '').trim() === ''
            ? campo(f.colBase) : replan;
        return extrairDataISO(valor);
    };

    window.pgDataRealFaseFunil = function(l, f) {
        const campo = n => window.pgCampoColeta(l, n);

        if (f.id === 'col_mapa') {
            // Quando uma visão temporal precisa de data real,
            // usa Coleta_TP. Nunca inventa "hoje" para Mapa Solicitado.
            return extrairDataISO(campo('Coleta_TP'));
        }

        if (f.id === 'col_tp') {
            // REGRA OFICIAL: a data válida é exclusivamente Coleta_TP.
            return extrairDataISO(campo('Coleta_TP'));
        }

        if (f.id === 'ent_tp') {
            // REGRA OFICIAL: Entrega TP só existe quando Entrega_TP tem data.
            return extrairDataISO(campo('Entrega_TP'));
        }

        if (f.id === 'ent_cd') {
            return extrairDataISO(l._DT_ENTREGUE_CD_REAL) ||
                extrairDataISO(campo(f.colReal));
        }

        const tRef = document.getElementById('filtroReferencia')?.value || 'replan';
        const cols = getCols(f, tRef);

        return extrairDataISO(campo(cols.real)) ||

    };

    function dataFoiPreenchida(linha, fObj) {
        if (fObj.id === 'col_mapa') return window.getVolFase(linha, fObj, 0) > 0;
        if (fObj.id === 'col_tp') return window.pgTiragemColetadaReal(linha) > 0;
        if (fObj.id === 'ent_tp') return window.pgTiragemEntregueTPReal(linha) > 0;
        let temData = extrairDataISO(linha[fObj.colReal]) !== null || (fObj.colRealAlt ? extrairDataISO(linha[fObj.colRealAlt]) !== null : false);
        if (!temData && fObj.colVol) {
            if (window.getVolFase(linha, fObj, 0) > 0) return true;
        }
        return temData;
    }
    
// V46 — única fonte de realizado/planejado de Acabamento para Funil e Report.
window.pgMetricasAcabamentoRealV46 = function(tRef, hojeIso, agrupar) {
    const fase = FASES.find(f => f.id === 'acab');
    const novo = () => ({ den: 0, real: 0, plan: 0,
        pcp: {den: 0, real: 0, plan: 0}, acab: {den: 0, real: 0, plan: 0} });
    const total = novo();
    const porGrupo = {};
    const vistos = new Set();
    const linhas = window.dadosAcabamentoOrigem || [];
    if (!fase) throw new Error('Fase Acabamento não encontrada.');
    linhas.forEach(l => {
        const chave = getKey(l);
        if (vistos.has(chave)) return;
        vistos.add(chave);  // Não colapsa lotes diferentes pela OP ou SKU.
        const volume = Math.max(0, Number(window.arredondar(l.TIRAGEM || l.QUANTIDADE || 0)) || 0);
        if (volume <= 0) return;
        const grupo = String(agrupar(l));
        if (!porGrupo[grupo]) porGrupo[grupo] = novo();
        const fonte = window.pgEhFonteAcabadora(l) ? 'acab' : 'pcp';
        const permitido = belongsToPhase(l, 'acab');
        // Real = registro explícito da própria etapa, com data até hoje.
        // Nunca se infere acabamento a partir de kit, coleta ou outra fase.
        const dataReal = extrairDataISO(l[fase.colReal]);
        const real = permitido && dataReal && dataReal <= hojeIso &&
            dataFoiPreenchida(l, fase) ? volume : 0;
        const dataPlan = permitido ? window.pgDataPlanoFaseFunil(l, fase, tRef) : null;
        const dias = dataPlan ? calcDiffDiasISO(dataPlan, hojeIso) : null;
        const plan = dataPlan && dias !== null && dias >= 3 ? volume : 0;
        [total, porGrupo[grupo]].forEach(alvo => {
            alvo.den += volume;
            alvo.real += real;
            alvo.plan += plan;
            alvo[fonte].den += volume;
            alvo[fonte].real += real;
            alvo[fonte].plan += plan;
        });
    });
    return {total, porGrupo};
};

    function calcAtraso(linha, fObj, tRef, dataHoje) {
        if (dataFoiPreenchida(linha, fObj)) return 0;
        let dISO = extrairDataISO(linha[getCols(fObj, tRef).plan]); if (!dISO) return null
        let pts = dISO.split('-'); let diff = Math.floor((dataHoje.getTime() - new Date(pts[0], pts[1]-1, pts[2]).getTime()) / 86400000);
        return diff > 0 ? diff : 0;
    }
    
    function foiEntregueNoPrazo(linha, fObj, tRef) {
        let cols = getCols(fObj, tRef);
        let isoReal = extrairDataISO(linha[cols.real]) || (cols.realAlt ? extrairDataISO(linha[cols.realAlt]) : null);
        let isoPlan = extrairDataISO(linha[cols.plan]);
        return (isoReal && isoPlan) ? calcDiffDiasISO(isoPlan, isoReal) <= 0 : false;
    }
    
    function getLeadTimeEmDias(linha, fObj, tRef) {
        let cols = getCols(fObj, tRef);
        let isoReal = extrairDataISO(linha[cols.real]) || (cols.realAlt ? extrairDataISO(linha[cols.realAlt]) : null);
        if (!isoReal) return null; 
        let isoIni = fObj.colIniReal ? extrairDataISO(linha[fObj.colIniReal]) : extrairDataISO(linha[cols.plan]); 
        if (!isoIni) return 0; 
        let diff = calcDiffDiasISO(isoIni, isoReal); 
        return diff >= 0 ? diff : 0;
    }

    function injetarDatasMapa() {
    if (!window.MAPA_SAIDA_CACHE || !window.dadosGlobais) return;
    const mapa = window.MAPA_SAIDA_CACHE;
    
    window.dadosGlobais.forEach(l => {
        if (l._MAPA_INJETADO) return; 

        // 🎯 Lendo pelas colunas informadas BQ (Gráfica) e CK (CD) + Fallbacks de segurança
        const g = String(l["BQ"] || l["GRAFICA_FINAL"] || l["GRÁFICA"] || "N/A").toUpperCase();
        const cd = String(l["CK"] || l["CD_FINAL"] || l["CD DESTINO"] || l["CD"] || "N/A").toUpperCase();
        
        const joinKey = String(l["B"] || l["JOIN_KEY"] || l["Chave"] || "").trim();
        const dtColetaRealPCP = l["DT_ENTREGA_DG"] || null; 

        let dtEntregaReal = "";
        let dtColetaMapa = "";

        if (mapa[joinKey] && mapa[joinKey].length > 0) {
            dtEntregaReal = mapa[joinKey].reduce((max, e) => ((e.dataEntrega && e.dataEntrega > max) ? e.dataEntrega : max), "");
            dtColetaMapa = mapa[joinKey].reduce((max, e) => ((e.dataColeta && e.dataColeta > max) ? e.dataColeta : max), "");
        }
        
        // 🎯 EXCEÇÃO POSIGRAF -> POSIGRAF
        if (g.includes("POSIGRAF") && cd.includes("POSIGRAF")) {
            dtEntregaReal = dtColetaRealPCP;
            dtColetaMapa = dtColetaRealPCP; // Ambas assumem a data da coleta do PCP
        } 
        
        const formatarData = (dt) => {
            if (!dt) return null;
            let str = String(dt).trim();
            if (str.includes('T')) str = str.split('T')[0];
            if (str.includes('/')) { 
                let p = str.split('/'); 
                if (p.length === 3) str = `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`; 
            }
            return str.length >= 10 ? str.substring(0, 10) : null;
        };

        l["_DT_ENTREGUE_CD_REAL"] = formatarData(dtEntregaReal);
        // A referência de data real de coleta agora é exclusivamente Coleta_TP.
        
        l._MAPA_INJETADO = true;
    });
}

                } else {

                    btn.classList.add(...baseColor);
                    btn.classList.remove('bg-indigo-600', 'border-indigo-700', 'text-white');
                }
            }
        });
    }

    injetarDatasMapa(); // 🎯 INJETA AS DATAS DO MAPA DE SAÍDA ANTES DOS GRÁFICOS LEREM

    window.pgSincronizarOrigemDestino();
    const origem = document.getElementById('pgFiltroOrigem')?.value || 'TODOS';
    const destinoExtra = origem === 'ACABADORA' ? 'CD' : (document.getElementById('pgFiltroDestino')?.value || 'CD');
    const categorias = Object.keys(selFilters);
    const passaCategorias = l => categorias.every(k => {
        if (k === 'Prioridade') return selFilters[k].has(window.obterPrioridade(l, tRef));
        let v = String(l[window.mapCamposProducao[k]] || '').trim();
        if (!v || v === 'undefined' || v === '-') v = '(Vazio)';
        return selFilters[k].has(v);
    });
    const baseGeral = window.pgLinhasUnicas((window.dadosGlobais || []).filter(l =>
        !window.pgSolicitacaoCancelada(l) &&
        filtroExtra(l, { ignorarOrigem: true, ignorarDestino: true, ignorarRoteamento: true }) &&
        (!window.filtrosGeraisIniciados || passaCategorias(l))));

    // Base já com todos os filtros globais aplicados, mas antes de Origem/Destino.
    // A Report Executiva usa esta base para montar simultaneamente Todos x Todos e Todos x CD.
    window.pgBaseGeralReportExecutiva = baseGeral.slice();

    const daOrigemFisica = l => origem === 'TODOS' || (window.pgEhFonteAcabadora(l) ? 'ACABADORA' : 'GRAFICA') === origem;
    const daOrigemCongelada = l => daOrigemFisica(l) && (origem === 'ACABADORA' || !window.pgAthosCongelado(l));

    window.dadosTotalPCPBase = baseGeral.filter(l => !window.pgEhFonteAcabadora(l));
    window.dadosTotalAcabadoraBase = baseGeral.filter(window.pgEhFonteAcabadora);
    window.dadosFasesEstaticas = baseGeral.filter(daOrigemCongelada);
    // A base de Acabamento é congelada por Origem/filtros gerais, não por Destino.
    // Apenas SAS PCP -> acabadora fica excluída, mesmo com Congelado=Sim.
    window.dadosAcabamentoOrigem = baseGeral.filter(l => {
        if (!daOrigemCongelada(l)) return false;
        if (window.pgEhFonteAcabadora(l) || !window.pgDestinoAcabadoraCongelado(l)) return true;
        const marca = String(l.MARCA_FINAL || l.UNIDADE || l.MARCA || '')
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .trim().toUpperCase();
        return marca !== 'SAS';
    });
    // Numerador e denominador de acabamento precisam usar o mesmo universo.
    window.dadosTotalAcabamento = window.dadosAcabamentoOrigem.slice();

    const baseOrigem = baseGeral.filter(l => window.pgLinhaDaOrigem(l, origem));
    const graficaAcabadoraExclusivo = origem === 'GRAFICA' && destinoExtra === 'ACAB';

    // Contexto dos filtros para regras específicas das fases.
    window.pgOrigemAtivaPortal = origem;
    window.pgDestinoAtivoPortal = destinoExtra;

    // DESTINO:
    // - Em Todas, primeiro entram as duas abas inteiras; depois o Destino filtra o conjunto.
    // - PCP_ACABADORAS é tratado como fluxo que já saiu da acabadora e segue para CD.
    // - Gráfica x Acabadora mantém EXCLUSIVAMENTE a lista ampliada já aprovada.
    dadosFiltrados = graficaAcabadoraExclusivo
        ? baseOrigem.filter(l => window.pgEhDestinoAcabadoraGraficaFiltro(l))
        : baseOrigem.filter(l => window.pgLinhaDoDestino(l, destinoExtra, origem));

    window.dadosSemFiltroCD = dadosFiltrados.slice();
    window.dadosDenominadorColeta = dadosFiltrados.filter(l => !window.pgEhFonteAcabadora(l));

    window.dadosDestinoCDFinal = baseOrigem.filter(l =>
        window.pgLinhaDoDestino(l, 'CD', origem)
    );
    window.dadosDestinoCDOrigem = window.dadosDestinoCDFinal.slice();

    const basePCP = baseGeral.filter(l => !window.pgEhFonteAcabadora(l));

    // TOTAL BASE:
    // Regra geral: usa exatamente o recorte filtrado.
    // ÚNICA exceção: Origem = Todas + Destino = CD.
    // Nesse caso ATHOS, KN e RAIZES vindos da PCP_ACABADORAS são ignorados,
    // porque esses volumes já estão representados no PCP.
    let totalCanonico = dadosFiltrados.slice();

    if (origem === 'TODOS' && destinoExtra === 'CD') {
        totalCanonico = totalCanonico.filter(l => {
            if (!window.pgEhFonteAcabadora(l)) return true;

            const grafica = String(
                l['GRAFICA_FINAL'] || l['GRÁFICA'] || l['GRAFICA'] || l['BQ'] || ''
            )
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .trim().replace(/\s+/g, ' ').toUpperCase();

            return !['ATHOS', 'KN', 'RAIZES'].includes(grafica);
        });
    }

    window.dadosTotalCanonico = totalCanonico;

    // PLAN / FORECAST usa EXATAMENTE o mesmo recorte do Total Base.
    // O cálculo de volume específico de PCP x PCP_ACABADORAS acontece
    // em pgCalcularColetaFunil(), sem alterar as fases operacionais.
    window.dadosBaseForecastColeta = window.dadosTotalCanonico.slice();

    // Confirmação CD continua seguindo o recorte normal do filtro.
    window.dadosBaseEntCDPortal = window.pgLinhasUnicas(dadosFiltrados);

    // MAPA SOLICITADO / COLETA TP / ENTREGA TP:
    //
    // REGRAS:
    // - PCP: usa TIRAGEM COLETADA.
    // - PCP_ACABADORAS: usa TIRAGEM COLETADA.
    // - Origem = Todas: NÃO soma as duas abas cegamente.
    //   O que o portal considera acabadora entra pela PCP_ACABADORAS;
    //   o restante continua entrando pelo PCP.
    //
    // Lista fechada de acabadoras para Todas:
    // HR, EMBALARTE, TRATTO, FELK e ANTILHAS.
    // ATHOS, KN e RAIZES continuam no PCP.
    let baseTPPortal = [];

    const baseAcabadorasTP = baseGeral.filter(l =>
        window.pgEhFonteAcabadora(l) &&
        window.pgAcabadoraDaLista(l)
    );

    const basePCPDiretoTP = basePCP.filter(l =>
        !window.pgEhDestinoAcabadora(l)
    );

    if (origem === 'TODOS') {
        if (destinoExtra === 'TODOS') {
            // TODAS + TODOS = literalmente tudo.
            // PCP inteiro + PCP_ACABADORAS inteiro.
            baseTPPortal = baseGeral.slice();
        } else if (destinoExtra === 'ACAB') {
            // Mantém a regra já validada para Destino Acabadora.
            baseTPPortal = baseAcabadorasTP.slice();
        } else {
            // Mantém a regra já validada para Destino CD.
            baseTPPortal = [
                ...basePCPDiretoTP,
                ...baseAcabadorasTP
            ];
        }
    } else if (origem === 'ACABADORA') {
        // Origem Acabadora = puramente PCP_ACABADORAS.
        baseTPPortal = baseGeral.filter(window.pgEhFonteAcabadora);
    } else {
        // Origem Gráfica mantém a leitura pura do PCP.
        baseTPPortal = graficaAcabadoraExclusivo
            ? basePCP.filter(l => window.pgEhDestinoAcabadoraGraficaFiltro(l))
            : basePCP.filter(l => window.pgLinhaDoDestino(l, destinoExtra, 'GRAFICA'));
    }

    window.dadosBaseTPPortal =
        window.pgLinhasUnicas(baseTPPortal);

    // O Forecast/Coleta usa a MESMA base híbrida dessas três fases.
    // Assim o realizado total não duplica PCP + PCP_ACABADORAS.
    window.dadosBaseForecastColeta =
        window.dadosBaseTPPortal.slice();

    window.dadosBaseColetaFunil =
        window.dadosBaseTPPortal.slice();

    window.pgBasesVisoesFases = {
        linhas: Array.from(new Set([
            ...dadosFiltrados,
            ...window.dadosBaseTPPortal,
            ...window.dadosFasesEstaticas,
            ...window.dadosAcabamentoOrigem
        ])),
        iniciais: new Set(window.dadosFasesEstaticas),
        acabamento: new Set(window.dadosAcabamentoOrigem),
        tp: new Set(window.dadosBaseTPPortal),
        filtradas: new Set(dadosFiltrados)
    };

    window.pgVersaoFiltros = (window.pgVersaoFiltros || 0) + 1;
    window.pgAtualizarAbaProducao();
    window.PG_PERFORMANCE = window.PG_PERFORMANCE || {};
    window.PG_PERFORMANCE.ultimoFiltroMs = Math.round(performance.now() - inicioPerf);
    console.info('[PERFORMANCE] Filtro completo:', window.PG_PERFORMANCE.ultimoFiltroMs, 'ms');
}

    function atualizarOpcoesFiltroMatriz() {
        let elSelect = document.getElementById("selFaseMatriz");
        if(!elSelect) return;
        let valorSelecionadoAnterior = elSelect.value; 
        let contagem = {}; FASES.forEach(f => contagem[f.id] = 0);
        window.pgDadosParaFases().forEach(l => {
            for(let i = 0; i < FASES.length; i++) {
                let f = FASES[i];
                if((window.pgLinhaNaVisaoDaFase(l, f.id) && belongsToPhase(l, f.id)) && !dataFoiPreenchida(l, f)) { contagem[f.id]++; break; }
            }
        });
        let htmlOptions = `<option value="TODOS">Todas as Fases</option>`;
        FASES.forEach(f => { if(contagem[f.id] > 0) htmlOptions += `<option value="${f.id}">${f.nome} (${window.formatarBR(contagem[f.id])})</option>`; });
        elSelect.innerHTML = htmlOptions;
        if (contagem[valorSelecionadoAnterior] > 0) elSelect.value = valorSelecionadoAnterior; 
        else elSelect.value = "TODOS";
    }

    function processarGeral() {
    let tRef = document.getElementById('filtroReferencia').value; 
    let mapTotal = {}; let met = {};
    (window.dadosTotalCanonico || dadosFiltrados).forEach(l => {
        mapTotal[getKey(l)] = { t: window.arredondar(l.TIRAGEM || l.QUANTIDADE), s: l.SKU };
    });
    let ritmo = {}; 
    
    FASES.forEach(f => { 
        met[f.id] = { skusReais: new Set(), volPlan: 0, volReal: 0, noPrazo: 0, skuPrazo: 0, atrasado: 0, skuAtraso: 0 }; 
        ritmo[f.id] = { baseAtHoje: 0, planAtHoje: 0, realTotal: 0, noPrazo: 0 }; 
    });
    
    window.pgDadosParaFases().forEach(l => {
        let tBase = window.arredondar(l["TIRAGEM"] || l["QUANTIDADE"]); 
        let s = l["SKU"]; let k = getKey(l);
        
        FASES.forEach(f => {
            if (!(window.pgLinhaNaVisaoDaFase(l, f.id) && belongsToPhase(l, f.id))) return;
            
            // 🎯 A MÁGICA DOS VOLUMES DINÂMICOS
            let tFaseReal = window.getVolFase(l, f, tBase);
            
            const dtBase = f.colBase
                ? extrairDataISO(window.pgCampoColeta(l, f.colBase))
                : null;

            // MESMO (RE) PLAN DO FUNIL.
            const dtPlan = window.pgDataPlanoFaseFunil(l, f, tRef);

            if (dtBase && dtBase <= dtHojeISO) ritmo[f.id].baseAtHoje += tBase;
            if (dtPlan && dtPlan <= dtHojeISO) ritmo[f.id].planAtHoje += tBase;

            met[f.id].volPlan += tBase; 
            if(dataFoiPreenchida(l, f)) { 
                if(s) met[f.id].skusReais.add(s); 
                met[f.id].volReal += tFaseReal; 
                ritmo[f.id].realTotal += tFaseReal;
                const dtRealFunil = window.pgDataRealFaseFunil(l, f);
                if (dtRealFunil && dtPlan && calcDiffDiasISO(dtPlan, dtRealFunil) <= 0) {
                    ritmo[f.id].noPrazo += tFaseReal;
                }

            } else { 
                let atr = calcAtraso(l, f, tRef, dtHoje);
                if(atr === null || atr > 0) { met[f.id].atrasado += tBase; met[f.id].skuAtraso++; } 
                else { met[f.id].noPrazo += tBase; met[f.id].skuPrazo++; }
            }
        });
    });
        
        let tTir = 0; let sGer = new Set();
        Object.values(mapTotal).forEach(o => { tTir += o.t; if(o.s) sGer.add(o.s); });
        
        let kpiSku = document.getElementById('kpiSkuTotal'); if(kpiSku) kpiSku.innerText = window.formatarBR(sGer.size); 
        let kpiTir = document.getElementById('kpiTiragemTotal'); if(kpiTir) kpiTir.innerText = window.formatarBR(tTir);
        
        // Mesma fonte para os cards operacionais (não recalcular em dadosFiltrados).
        const unicoGeral = window.pgObterResumoColeta();
        const entregaGeral = (unicoGeral.registros || []).reduce((t,r) =>
            t + window.pgTiragemEntregueTPReal(r.linha || r.pcp), 0);
        [['col_mapa',unicoGeral.mapaSolicitado],
         ['col_tp',unicoGeral.realizado], ['ent_tp',entregaGeral]].forEach(([id,vol]) => {
            if (met[id]) met[id].volReal = vol;
            if (ritmo[id]) ritmo[id].realTotal = vol;
        });
        let hReal = "", hPend = "";
        FASES.forEach(f => {
            let r = met[f.id];
            hReal += `<div class="bg-white p-2 rounded-lg shadow-sm border-t-2" style="border-color:${f.corLinha}"><h3 class="font-bold text-slate-700 mb-1 text-center text-[9px] uppercase truncate" title="${f.nome}">${f.nome}</h3><div class="flex justify-between items-center bg-slate-50 px-1 py-0.5 rounded mb-1 text-[9px] border border-slate-100"><span class="text-slate-500 font-semibold">SKU</span><span class="font-bold text-emerald-600">${window.formatarBR(r.skusReais.size)}</span></div><div class="flex justify-between items-center bg-slate-50 px-1 py-0.5 rounded text-[9px] border border-slate-100"><span class="text-slate-500 font-semibold">Vol</span><span class="font-bold text-emerald-600">${window.formatarBR(r.volReal)}</span></div></div>`;
            hPend += `<div class="bg-white p-2 rounded-lg shadow-sm border-t-2" style="border-color:${f.corLinha}"><h3 class="font-bold text-slate-700 mb-1 text-center text-[9px] uppercase truncate" title="${f.nome}">${f.nome}</h3><div><div class="flex justify-between items-center bg-amber-50 px-1 py-0.5 rounded border border-amber-100 text-[9px] mb-1"><span class="text-amber-700 font-semibold">Prazo</span><div class="text-right"><span class="font-bold text-amber-600">${window.formatarBR(r.noPrazo)}</span><span class="text-[7px] text-amber-500 block leading-none -mt-0.5">(${window.formatarBR(r.skuPrazo)} un)</span></div></div><div class="flex justify-between items-center bg-red-50 px-1 py-0.5 rounded border border-red-100 text-[9px]"><span class="text-red-700 font-semibold">Atraso</span><div class="text-right"><span class="font-bold text-red-600">${window.formatarBR(r.atrasado)}</span><span class="text-[7px] text-red-400 block leading-none -mt-0.5">(${window.formatarBR(r.skuAtraso)} un)</span></div></div></div></div>`;
        });
        let cReal = document.getElementById('containerRealizados'); if(cReal) cReal.innerHTML = hReal; 
        let cPend = document.getElementById('containerPendentes'); if(cPend) cPend.innerHTML = hPend;
        
        let cvPlan = document.getElementById('graficoPlanReal');
        if(cvPlan) {
            if(graficos.planReal) graficos.planReal.destroy();
            graficos.planReal = new Chart(cvPlan, { type: 'bar', data: { labels: FASES.map(f=>f.nome), datasets: [ { label: 'Vol. Planejado', data: FASES.map(f=>met[f.id].volPlan), backgroundColor: '#cbd5e1', borderRadius:4 }, { label: 'Realizado', data: FASES.map(f=>met[f.id].volReal), backgroundColor: '#10b981', borderRadius:4 } ] }, options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } } });
        }

        // Apagamos o graficoPlanReal antigo daqui!
        
        // --- GRÁFICO DE RITMO (100% EM PERCENTUAL E EIXO ÚNICO) ---
        let ctxRitmo = document.getElementById('graficoRitmo');
        if (ctxRitmo) {
            let lbls = FASES.map(f => f.nome);
            let dBaseAbs = FASES.map(f => ritmo[f.id].baseAtHoje);
            let dPlanAbs = FASES.map(f => ritmo[f.id].planAtHoje);
            let dRealAbs = FASES.map(f => ritmo[f.id].realTotal);
            
            let calcPct = (val, total) => total > 0 ? Number(((val / total) * 100).toFixed(1)) : 0;
            let dBasePct = FASES.map(f => calcPct(ritmo[f.id].baseAtHoje, met[f.id].volPlan));
            let dPlanPct = FASES.map(f => calcPct(ritmo[f.id].planAtHoje, met[f.id].volPlan));
            let dRealPct = FASES.map(f => calcPct(ritmo[f.id].realTotal, met[f.id].volPlan));
            
            let dAder = FASES.map(f => {
                let esperado = tRef === 'baseline' ? ritmo[f.id].baseAtHoje : ritmo[f.id].planAtHoje;
                if (esperado === 0) return ritmo[f.id].realTotal > 0 ? 100 : 0;
                let pct = (ritmo[f.id].noPrazo / esperado) * 100;
                return Number((pct > 100 ? 100 : pct).toFixed(1)); 
            });

            const plugRotulos = {
                id: 'plugRotulos',
                afterDatasetsDraw(chart) {
                    const { ctx } = chart;
                    ctx.font = 'bold 9px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    
                    chart.data.datasets.forEach((dataset, i) => {
                        const meta = chart.getDatasetMeta(i);
                        if (meta.hidden) return;
                        meta.data.forEach((element, index) => {
                            const val = dataset.data[index];
                            if (!val || val === 0) return; 
                            let text = val + '%'; 
                            let x = element.x;
                            let y = element.y;
                            if (dataset.type === 'line') {
                                ctx.fillStyle = '#0f172a';
                                ctx.fillText(text, x, y - 8);
                            } else {
                                ctx.fillStyle = '#475569';
                                ctx.fillText(text, x, y - 4);
                            }
                        });
                    });
                }
            };

            if (graficos.ritmo) graficos.ritmo.destroy();
            graficos.ritmo = new Chart(ctxRitmo, {
                type: 'bar',
                data: {
                    labels: lbls,
                    datasets: [
                        { type: 'line', label: 'Aderência (%)', data: dAder, customAbs: null, borderColor: '#0f172a', backgroundColor: '#0f172a', borderWidth: 2, tension: 0.3, pointRadius: 4, order: 1 },
                        { type: 'bar', label: 'Baseline (Até Hoje)', data: dBasePct, customAbs: dBaseAbs, backgroundColor: '#93c5fd', borderRadius: 4, order: 2 },
                        { type: 'bar', label: 'Re-Plan (Até Hoje)', data: dPlanPct, customAbs: dPlanAbs, backgroundColor: '#3b82f6', borderRadius: 4, order: 3 },
                        { type: 'bar', label: 'Realizado (Total)', data: dRealPct, customAbs: dRealAbs, backgroundColor: '#1e3a8a', borderRadius: 4, order: 4 }
                    ]
                },

                options: {

                    layout: { padding: { top: 25 } },
                    interaction: { mode: 'index', intersect: false },

                                    let pctStr = c.parsed.y + '%';
                                    if (c.dataset.type === 'line') return `${c.dataset.label}: ${pctStr}`;
                                    let absVal = c.dataset.customAbs[c.dataIndex];
                                    return `${c.dataset.label}: ${pctStr} (Vol: ${window.formatarBR(absVal)})`; 
                                } 
                            } 
                        }
                    },
                    scales: {
                        y: { type: 'linear', display: true, beginAtZero: true, max: 110, title: { display: true, text: 'Percentual do Volume Total da Fase', color: '#64748b', font: { weight: 'bold' } }, ticks: { callback: v => v + '%' } }
                    }
                }
            });
        }
        
        // =======================================================
        // NOVO: CÁLCULO DE ADERÊNCIA ATÉ ONTEM (D-1) E ATRASOS
        // =======================================================
        let ontem = new Date(dtHoje);
        ontem.setDate(ontem.getDate() - 1);
        let ontemISO = ontem.toISOString().split('T')[0];

        let resG = {}; let resM = {};
        window.dadosExportacaoAderencia = []; // Array global para o Export CSV

        window.pgDadosParaFases().forEach(l => {
            let t = window.arredondar(l["TIRAGEM"] || l["QUANTIDADE"]);
            if (t <= 0) return;
            let g = String(l["GRÁFICA"] || "N/A").trim();
            let m = String(l["UNIDADE"] || "N/A").trim();

            if (!resG[g]) { resG[g] = { label: g }; FASES.forEach(f => resG[g][f.id] = { p: 0, r: 0 }); }
            if (!resM[m]) { resM[m] = { label: m }; FASES.forEach(f => resM[m][f.id] = { p: 0, r: 0 }); }

            let wipEncontrado = false;

            FASES.forEach(f => {

                // 1. Acumuladores Globais da Tabela (O que foi planejado até ontem vs Realizado)
                if (dtP && dtP <= ontemISO) {
                    resG[g][f.id].p += t;
                    resM[m][f.id].p += t;
                    if (isReal) {
                        resG[g][f.id].r += t;
                        resM[m][f.id].r += t;
                    }
                }

                // 2. Identifica o gargalo atual para a Lista Detalhada
                if (!isReal && !wipEncontrado) {
                    wipEncontrado = true; // Esse é o passo em que a mercadoria está travada
                    
                    if (dtP && dtP <= ontemISO) {
                        let dBase = extrairDataISO(l[f.colBase]) || "-";
                        let dReplan = extrairDataISO(l[f.colPlan]) || "-";

                            fase: f.nome, dtBase: dBase, dtReplan: dReplan, dias: diasAtraso, tiragem: t

        const renderAderTable = (dataObj, tbodyId, theadId) => {

window.pgCampoColeta = (function() {
    const indices = new WeakMap(), nomes = new Map();
    const norm = nome => {
        if (!nomes.has(nome)) nomes.set(nome, String(nome).normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().replace(/\s+/g, ' ').toUpperCase());
        return nomes.get(nome);
    };
    return (linha, nome) => {
        if (Object.prototype.hasOwnProperty.call(linha, nome)) return linha[nome] ?? '';
        let indice = indices.get(linha);
        if (!indice) {
            indice = new Map();
            Object.keys(linha).forEach(k => { const n = norm(k); if (!indice.has(n)) indice.set(n, k); });
            indices.set(linha, indice);
        }
        return linha[indice.get(norm(nome))] ?? '';
    };
})();

// V35: leitura explícita dos novos campos, sem confundir TRIAGEM com TIRAGEM.
const pgIndicesPrazoV35 = new WeakMap();
const pgNomesPrazoV35 = new Map();
const pgNormPrazoV35 = nome => {
    if (!pgNomesPrazoV35.has(nome)) {
        pgNomesPrazoV35.set(nome, String(nome ?? '').normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '').replace(/_/g, ' ')
            .trim().replace(/\s+/g, ' ').toUpperCase());
    }
    return pgNomesPrazoV35.get(nome);
};

window.pgCampoPrazoV35 = function(linha, nome) {
    if (!linha || typeof linha !== 'object') return '';
    if (Object.prototype.hasOwnProperty.call(linha, nome)) return linha[nome] ?? '';

    let indice = pgIndicesPrazoV35.get(linha);
    if (!indice) {
        indice = new Map();
        Object.keys(linha).forEach(k => {
            const normalizado = pgNormPrazoV35(k);
            if (!indice.has(normalizado)) indice.set(normalizado, k);
        });
        pgIndicesPrazoV35.set(linha, indice);
    }

    const chave = indice.get(pgNormPrazoV35(nome));
    return chave === undefined ? '' : (linha[chave] ?? '');
};
window.pgNumeroPrazoV35 = function(v) {
    if (typeof v === 'number') return Number.isFinite(v) ? Math.max(0, v) : 0;
    let s = String(v ?? '').trim();
    if (!s) return 0;
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    return Math.max(0, Number(s) || 0);
};
window.pgPrazoLinhaV35 = function(linha, hoje) {
    const c = n => window.pgCampoPrazoV35(linha, n);
    const data = n => window.pgNormalizarDataColeta(c(n), hoje);
    // Cabeçalho REAL: DT_Vencido. Não existe DT_Vencida.
    const dtVencido = data('DT_Vencido');
    return {
        linha,
        vencida: window.pgNumeroPrazoV35(c('TIRAGEM VENCIDA')),
        dtVencida: dtVencido,
        aVencer: window.pgNumeroPrazoV35(c('A_Vencer')),
        dtAVencer: data('Dt_a_vencer'),
        coletadaBruta: window.pgNumeroPrazoV35(c('TIRAGEM COLETADA')),
        dtColeta: data('Coleta_TP'),
        dtMapaAgendado: data('Mapa_Agendado')
    };
};
// A quantidade vencida sem DT_Vencida pertence à categoria Sem data.
// Cada parcela devida entra na sua data, com abatimento SOMENTE por Coleta_TP.
window.pgSaldoPrazoV35 = function(r, limite, hoje = dtHojeISO) {
    // Corte ÚNICO para todas as parcelas: histórico cresce até hoje e
    // fica congelado nos dias futuros (inclusive no modo acumulado).
    const corte = limite > hoje ? hoje : limite;
    const coletada = r.dtColeta && r.dtColeta <= corte
        ? r.coletadaBruta : 0;
    const vencidaSemData = r.vencida > 0 && !r.dtVencida ? r.vencida : 0;
    const vencidaDatada = r.dtVencida && r.dtVencida <= corte ? r.vencida : 0;
    const aVencerDatada = r.dtAVencer && r.dtAVencer <= corte ? r.aVencer : 0;
    // Aloca realizado em Sem data primeiro, sem contar a mesma coleta duas vezes.
    const semData = Math.max(0, vencidaSemData - coletada);
    const coletadaRestante = Math.max(0, coletada - vencidaSemData);
    const vencido = Math.max(0, vencidaDatada + aVencerDatada - coletadaRestante);
    return { vencido, semData, coletada, devido: vencidaDatada + aVencerDatada };
};

window.pgCalcularColetaFunil = function(base, hoje) {
    const norm = v => String(v ?? '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim()
        .replace(/\s+/g, ' ')
        .toUpperCase();

    const campo = window.pgCampoColeta;

    // Leitura flexível APENAS para os campos de backlog.
    // Considera '_' e espaço equivalentes, mas NÃO aceita o typo TRIAGEM.
    const normalizarCampoBacklog = v => String(v ?? '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/_/g, ' ')
        .replace(/^[#\s]+/, '')
        .trim()
        .replace(/\s+/g, ' ')
        .toUpperCase();

    const campoBacklog = (linha, nome) => {
        // Primeiro tenta o cabeçalho literal.
        const direto = campo(linha, nome);

        if (
            direto !== undefined &&
            direto !== null &&
            String(direto).trim() !== ''
        ) {
            return direto;
        }

        const alvo = normalizarCampoBacklog(nome);

        const chave = Object.keys(linha || {}).find(k =>
            normalizarCampoBacklog(k) === alvo &&
            linha[k] !== undefined &&
            linha[k] !== null &&
            String(linha[k]).trim() !== ''
        );

        return chave === undefined
            ? ''
            : linha[chave];
    };

    const numero = v => {
        if (typeof v === 'number') {
            return Number.isFinite(v) ? v : 0;
        }

        let s = String(v ?? '').trim();
        if (!s) return 0;

        if (s.includes(',')) {
            s = s
                .replace(/\./g, '')
                .replace(',', '.');
        } else if (/^\d{1,3}(\.\d{3})+$/.test(s)) {
            s = s.replace(/\./g, '');
        }

        return Number(s) || 0;
    };

    const data = v =>
        window.pgNormalizarDataColeta(v, hoje);

    const ehAcab = l =>
        [l._SOURCE, l.BASE, l._base]
            .some(v => norm(v).includes('ACAB'));

    // PLAN / RE-PLAN:
    // data consolidada do portal.
    const plano = l =>
        data(window.pgValorPlanoColetaLinha(l));

    const novo = () => ({
        total: 0,
        esperadoHoje: 0,
        pendenteVencido: 0,
        realizado: 0
    });

    const out = {
        ...novo(),
        realizadoDatado: 0,
        mapaSolicitado: 0,
        mapaAgendadoTotal: 0,
        mapaSemColetaTP: 0,
        semPlano: 0,
        excluidoReal: 0,
        backlogAtual: 0,
        backlogSemData: 0,
        backlogDebug: {
            linhasComVencida: 0,
            linhasComDtVencido: 0,
            tiragemVencidaTotal: 0,
            saldoAtualCalculado: 0
        },

        // Guarda cada item para reconstruir o backlog em qualquer dia:
        // entra em DT_Vencido e é abatido em Coleta_TP.
        backlogRegistros: [],
        prazosRegistros: [],

        marcas: {},
        graficas: {},
        registros: [],
        dias: new Map()
    };

    const grupo = (l, tipo) => norm(
        tipo === 'marcas'
            ? l.MARCA_FINAL || l.UNIDADE || 'N/A'
            : l.GRAFICA_FINAL || l['GRÁFICA'] || 'N/A'
    );

    const add = (l, campoNome, n) => {
        out[campoNome] += n;

        ['marcas', 'graficas'].forEach(tipo => {
            const g = grupo(l, tipo);

            if (!out[tipo][g]) {
                out[tipo][g] = novo();
            }

            out[tipo][g][campoNome] =
                (out[tipo][g][campoNome] || 0) + n;
        });
    };

    const somar = (dia, tipo, n) => {
        if (!out.dias.has(dia)) {
            out.dias.set(
                dia,
                { esperado: 0, real: 0, agendado: 0 }
            );
        }

        out.dias.get(dia)[tipo] += n;
    };

    (base || []).forEach(l => {
        if (window.pgSolicitacaoCancelada(l)) return;

        window.pgCorrigirChaveMarcaSasWays?.(l);

        const linhaAcabadora = ehAcab(l);

        // DENOMINADOR / BASE:
        // mantém a regra já validada do total.
        const volumeBase = Math.max(
            0,
            numero(
                linhaAcabadora
                    ? campo(
                        l,
                        'TIRAGEM A ENTREGAR (total por CD)'
                    )
                    : campo(l, 'TIRAGEM')
            )
        );

        if (volumeBase > 0) {
            add(l, 'total', volumeBase);
        }

        // PLAN / RE-PLAN:
        // SEMPRE coluna TIRAGEM para PCP e PCP_ACABADORAS.
        const tiragemPlan = Math.max(
            0,
            numero(campo(l, 'TIRAGEM'))
        );

        // MAPA SOLICITADO:
        // volume bruto, independentemente de Coleta_TP.
        const volumeColeta = window.pgVolumesColetaUnificadosV37(l, hoje);
        const mapaSolicitado = volumeColeta.mapa;
        const dtReal = volumeColeta.coletaTP;
        const coletadaReal = volumeColeta.coleta;

        // O mesmo dado alimenta a tabela, o acumulado e as extrações.
        out.mapaSolicitado += mapaSolicitado;

        // Agenda futura é um compromisso, NÃO uma coleta concluída.
        // Somente PCP: usa o volume de Mapa Solicitado ainda sem Coleta_TP.
        const dtMapaAgendado = !linhaAcabadora
            ? data(campo(l, 'Mapa_Agendado'))
            : null;
        const volumeMapaAgendado = (
            dtMapaAgendado && dtMapaAgendado >= hoje && !dtReal
        ) ? mapaSolicitado : 0;
        if (volumeMapaAgendado > 0) {
            out.mapaAgendadoTotal += volumeMapaAgendado;
            somar(dtMapaAgendado, 'agendado', volumeMapaAgendado);
        }

        if (coletadaReal > 0) {
            add(
                l,
                'realizado',
                coletadaReal
            );

            out.realizadoDatado +=
                coletadaReal;

            somar(
                dtReal,
                'real',
                coletadaReal
            );
        } else if (mapaSolicitado > 0) {
            out.mapaSemColetaTP +=
                mapaSolicitado;

            out.excluidoReal +=
                mapaSolicitado;
        }

        // Prazos do PCP/PCP_ACABADORAS: DT_Vencida, Dt_a_vencer e Coleta_TP.
        // O mapa bruto NÃO abate pendência sem Coleta_TP válida.
        const registroPrazo = window.pgPrazoLinhaV35(l, hoje);
        out.prazosRegistros.push(registroPrazo);
        const saldoPrazoHoje = window.pgSaldoPrazoV35(registroPrazo, hoje, hoje);
        out.backlogAtual += saldoPrazoHoje.vencido;
        out.backlogSemData += saldoPrazoHoje.semData;

        const dtPlan = plano(l);

        out.registros.push({
            linha: l,
            pcp: l,
            dtPlan,
            tiragem: tiragemPlan,
            motivo: linhaAcabadora
                ? 'PCP_ACABADORAS: replan coleta + TIRAGEM'
                : 'PCP: replan coleta + TIRAGEM',

            // IMPORTANTE:
            // registros usados pelo Forecast/Report recebem somente coleta REAL.
            coletada: coletadaReal,
            mapaSolicitado,
            dtMapaAgendado,
            volumeMapaAgendado,
            dtReal,
            prazo: registroPrazo
        });

        if (tiragemPlan <= 0) {
            return;
        }

        if (!dtPlan) {
            out.semPlano += tiragemPlan;
            return;
        }

        somar(
            dtPlan,
            'esperado',
            tiragemPlan
        );

        if (dtPlan <= hoje) {
            add(
                l,
                'esperadoHoje',
                tiragemPlan
            );
        }
    });

    window.pgItensColetaDia(
        out,
        hoje,
        hoje,
        hoje,
        true
    ).forEach(item => {
        if (item.dias < 0) {
            add(
                {
                    MARCA_FINAL: item.marca,
                    GRAFICA_FINAL: item.graficaBase
                },
                'pendenteVencido',
                item.tiragem
            );
        }
    });

    // Contagem e volume já apurados a partir dos novos campos.
    return out;
};
window.pgItensColetaDia = function(resumo, dia, hoje, inicioPeriodo = dia, incluirTodas = false) {
    const futuro = dia > hoje;
    const limiteReal = futuro ? hoje : dia;
    if (!resumo._pendenciasPorData) resumo._pendenciasPorData = new Map();
    let pendencias = resumo._pendenciasPorData.get(limiteReal);
    if (!pendencias) {
    const consumido = new Map();
    pendencias = resumo.registros.slice().sort((a, b) => (a.dtPlan || '9999').localeCompare(b.dtPlan || '9999')).flatMap(r => {
        // Rateia o volume PCP entre eventuais divisões da acabadora uma única vez.
        const usado = consumido.get(r.pcp) || 0;
        // No saldo atual, o volume coletado independe da data. A data só
        // limita a reconstrução histórica e os pontos da curva realizada.
        const coletaDisponivel = limiteReal >= hoje || (r.dtReal && r.dtReal <= limiteReal);
        const disponivel = coletaDisponivel ? Math.max(0, r.coletada - usado) : 0;
        const abatido = Math.min(r.tiragem, disponivel);
        if (r.pcp) consumido.set(r.pcp, usado + abatido);
        const saldo = r.tiragem - abatido;
        if (saldo <= 0) return [];
        const l = r.linha, pcp = r.pcp || l;
        return [{ dtPlan: r.dtPlan,
            graficaBase: String(pcp.GRAFICA_FINAL || pcp['GRÁFICA'] || 'N/A'),
            segmento: String(pcp.SEGMENTO || 'N/A'),
            grafica: String(l.GRAFICA_FINAL || l['GRÁFICA'] || 'N/A'),
            marca: String(pcp.MARCA_FINAL || pcp.UNIDADE || 'N/A'),
            serie: String(pcp['SÉRIE'] || pcp['Série'] || pcp.SERIE || '-'),
            sku: String(pcp.SKU_REAL || pcp.SKU || '-'),
            desc: String(pcp.DESC_REAL || pcp['DESCRIÇÃO'] || pcp.PRODUTO || '-'),
            status: 'Em Aberto',
            pendencia: 'Coleta Final',
            dias: r.dtPlan ? Math.round((new Date(r.dtPlan + 'T00:00:00Z') - new Date((futuro ? hoje : dia) + 'T00:00:00Z')) / 86400000) : null,
            tiragem: saldo
        }];
    });
    // Limit historical snapshots retained in memory; the current date is reused most often.
    if (resumo._pendenciasPorData.size >= 4) resumo._pendenciasPorData.delete(resumo._pendenciasPorData.keys().next().value);
    resumo._pendenciasPorData.set(limiteReal, pendencias);
    }
    return pendencias.filter(r => incluirTodas || (r.dtPlan && (futuro ? r.dtPlan >= inicioPeriodo && r.dtPlan <= dia : r.dtPlan <= dia)))
        .map(r => ({ ...r, pendencia: (futuro ? 'Coleta Final — A coletar ' : 'Coleta Final — Backlog em ') + dia.split('-').reverse().join('/') }));
};

        const r = registros.get(l), estado = window.pgEstadoColetaMapa(l);
        const meta = r?.dtPlan ? r.tiragem : 0;
        const motivo = !noFiltro ? 'Fora dos filtros atuais de origem/destino e demais seleções' : r ? (r.dtPlan ? r.motivo : 'Sem data válida: ' + r.motivo) : acab ? 'Sem volume na meta atual' : 'Sem tiragem positiva';
        return [l._SOURCE || 'PCP', l.JOIN_KEY || l.Chave || '', l.GRAFICA_FINAL || l['GRÁFICA'], l.MARCA_FINAL || l.UNIDADE, l.ENVIO || l.Envio,
            l.SKU_REAL || l.SKU, noFiltro ? 'Sim' : 'Não', campo(l, 'TIRAGEM'), noFiltro ? Math.max(0, Number(window.arredondar(campo(l, 'TIRAGEM')))) : 0,
            l.CD_FINAL || l['CD DESTINO'], campo(l, 'CARACTERÍSTICA DA SOLICITAÇÃO'), campo(l, 'Coleta/Internalização de estoque final (re) plan'),
            campo(l, 'COLETA/INTERNALIZAÇÃO FIM BASELINE'), campo(l, 'DATA LIMITE DE COLETA'), r?.dtPlan || '', meta,
            r?.dtPlan && r.dtPlan <= dtHojeISO ? meta : 0, motivo, estado.ay, estado.coletada, campo(l, 'Coleta_TP')];
    });
    const csv = v => {
        let txt = String(v ?? '');
        if (typeof v === 'string' && /^[=+@-]/.test(txt)) txt = "'" + txt;
        return '"' + txt.replace(/"/g, '""') + '"';
    };
    const url = URL.createObjectURL(new Blob(['\uFEFF' + [cabecalho, ...linhas].map(l => l.map(csv).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8;' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'Auditoria_Forecast_Coleta_' + dtHojeISO + '.csv'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
};

// O backend mantém os nomes históricos de Forecast para não quebrar dados já persistidos.

window.pgPodeEditarForecastColeta = function() {
    return String(window.PG_USER_EMAIL || '').trim().toLowerCase() === window.PG_FORECAST_EDITOR_EMAIL;
};

window.pgChaveForecastColeta = function() {
    const ler = (id, padrao = 'TODOS') => document.getElementById(id)?.value || padrao;
    const gerais = {};
    Object.keys(window.listasMultiProducao || {}).sort().forEach(k => {
        const id = k.replace(/\s+/g, '').replace('.', '');
        const caixas = Array.from(document.querySelectorAll(`.chk-geral-${id}`));
        if (!caixas.length) return;
        const selecionados = caixas.filter(cb => cb.checked).map(cb => cb.value).sort();
        gerais[k] = selecionados.length === caixas.length ? '*' : selecionados;
    });
    const cfg = {
        origem: ler('pgFiltroOrigem', 'TODOS'),
        destino: ler('pgFiltroDestino'),
        time: ler('pgFiltroTime'),
        analista: ler('pgFiltroAnalista'),
        grafica: ler('pgFiltroGraficaAnalista'),
        referencia: ler('filtroReferencia', 'replan'),
        gerais
    };
    const raw = JSON.stringify(cfg);
    let h = 2166136261;
    for (let i = 0; i < raw.length; i++) {
        h ^= raw.charCodeAt(i);
        h = Math.imul(h, 16777619);
    }
    return 'FC_' + (h >>> 0).toString(16).padStart(8, '0').toUpperCase();
};

window.pgLerPontosMetaEditor = function(sufixo = '') {
    const chaveView = sufixo || 'FUNIL';
    const view = window.PG_FORECAST_VIEW[chaveView];
    const editor = document.getElementById('editorForecastColetaFunil' + sufixo);
    if (!view || !editor) return null;

    // Meta CD é persistida diretamente em percentual acumulado (0 a 100).
    // Preserva pontos publicados fora da janela que está sendo editada.
    const existentes = new Map(((window.PG_FORECAST_COLETA && window.PG_FORECAST_COLETA[view.chave]) || [])
        .map(p => [p.data, Number(p.valor)]));
    const inputs = Array.from(editor.querySelectorAll('[data-pg-forecast-date]'));
    for (const input of inputs) {
        const data = input.dataset.pgForecastDate;
        const raw = String(input.value || '').trim();
        if (!raw) {
            existentes.delete(data);
            continue;
        }
        const valor = Number(raw.replace(',', '.'));
        if (!Number.isFinite(valor) || valor < 0 || valor > 100) {
            alert('Meta CD inválida em ' + data + '. Informe um percentual entre 0 e 100.');
            return null;
        }
        existentes.set(data, Math.round(valor * 10) / 10);
    }

    const pontos = Array.from(existentes, ([data, valor]) => ({ data, valor }))
        .sort((a, b) => a.data.localeCompare(b.data));
    for (let i = 1; i < pontos.length; i++) {
        if (pontos[i].valor < pontos[i - 1].valor) {
            alert('A Meta CD é acumulada e não pode diminuir entre as datas.');
            return null;
        }
    }
    return pontos;
};

window.pgSalvarForecastColeta = function(sufixo = '') {
    if (!window.pgPodeEditarForecastColeta()) return;

    if (!view) return;
    const pontos = window.pgLerPontosMetaEditor(sufixo);
    if (!pontos) return;

    const finalizar = res => {
        if (!res || !res.success) {
            alert('Não foi possível salvar a Meta CD.');
            return;
        }
        window.PG_FORECAST_COLETA = window.PG_FORECAST_COLETA || {};
        if (res.pontos && res.pontos.length) window.PG_FORECAST_COLETA[view.chave] = res.pontos;
        else delete window.PG_FORECAST_COLETA[view.chave];
        if (window.PG_META_PREVIEW) delete window.PG_META_PREVIEW[chaveView];

        window.renderColetaFinalFunil(sufixo);
