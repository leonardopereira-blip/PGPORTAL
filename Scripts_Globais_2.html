<script>
(function() {
    const PG_ACABADORAS = ['HR', 'EMBALARTE', 'TRATTO', 'FELK', 'ANTILHAS'];

    const PG_PESSOAS = {
        'joao.alberti@arcoeducacao.com.br': {
            nome: 'João Alberti', time: 'CAMILA',
            graficas: ['POSIGRAF', 'WALPRINT', 'LEOGRAF']
        },
        'klaytonmatos@arcoeducacao.com.br': {
            nome: 'Klayton', time: 'CAMILA',
            graficas: ['COAN', 'MAXI', 'MIDIOGRAF', 'REPROSET', 'IMOS', 'ZIT']
        },
        'amanda.costa@arcoeducacao.com.br': {
            nome: 'Amanda Costa', time: 'CAMILA',
            graficas: ['LOGPRINT', 'BERCROM', 'META']
        },
        'elisandraramos@arcoeducacao.com.br': {
            nome: 'Elis', time: 'JAQUELINE',
            graficas: ['PIFFER', 'PITFER', 'SAO FRANCISCO', 'FORMA CERTA', 'EMBALART', 'EMBALARTE', 'FELK', 'HR', 'ANTILHAS', 'TRATTO', 'KN', 'RAIZES']
        },
        'matheus.vasconcelos@arcoeducacao.com.br': {
            nome: 'Matheus', time: 'JAQUELINE',
            graficas: ['RICARGRAF', 'ATHOS', 'RONA', 'STAR 7', 'OCEANO']
        }
    };

    const PG_GESTORES = {
        'camila.pagliuca@arcoeducacao.com.br': 'CAMILA',
        'jaqueline.melo@arcoeducacao.com.br': 'JAQUELINE'
    };

    const PG_LIDERANCA = new Set([
        'leonardo.pereira@arcoeducacao.com.br',
        'priscillabianchi@arcoeducacao.com.br'
    ]);

    function pgNorm(v) {
        const normalizado = String(v == null ? '' : v)
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .trim().replace(/\s+/g, ' ').toUpperCase();

        // Correção de cadastro: "Antihas" é erro de digitação de ANTILHAS.
        if (normalizado === 'ANTIHAS') return 'ANTILHAS';

        return normalizado;
    }

    function pgEsc(v) {
        return String(v == null ? '' : v)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    const pgMetaLinhaCache = new WeakMap();

    function pgMetaLinha(l) {
        if (!l || typeof l !== 'object') {
            return { grafica: '', cd: '', rota: '', fonteAcabadora: false };
        }

        let meta = pgMetaLinhaCache.get(l);
        if (meta) return meta;

        meta = {
            grafica: pgNorm(l['GRAFICA_FINAL'] || l['GRÁFICA'] || l['GRAFICA'] || l['BQ'] || ''),
            cd: pgNorm(l['CD_FINAL'] || l['CD DESTINO'] || l['CD'] || l['CK'] || ''),
            rota: pgNorm(l['CD DESTINO'] || l['CD_FINAL'] || l['CD'] || l['CK'] || ''),
            fonteAcabadora: [l._SOURCE, l.BASE, l._base].some(v => pgNorm(v).includes('ACAB'))
        };

        pgMetaLinhaCache.set(l, meta);
        return meta;
    }

    function pgGraficaLinha(l) {
        return pgMetaLinha(l).grafica;
    }

    function pgCdLinha(l) {
        return pgMetaLinha(l).cd;
    }

    // Para decidir o ROTEAMENTO PCP -> acabadora, a coluna soberana é CD DESTINO.
    // CD_FINAL pode já representar o CD final e esconder KN ACABADORA / RAÍZES ACABADORA.
    function pgCdDestinoRoteamento(l) {
        return pgMetaLinha(l).rota;
    }

    window.pgEhFonteAcabadora = l => pgMetaLinha(l).fonteAcabadora;

    // Lista fechada para Todas/Gráfica. ATHOS, KN e RAÍZES são destino CD.
    function pgEhAcabadora(l) {
        return !window.pgEhFonteAcabadora(l) && PG_ACABADORAS.includes(pgCdDestinoRoteamento(l));
    }
    window.pgEhDestinoAcabadora = pgEhAcabadora;
    window.pgEhDestinoCD = l => !pgEhAcabadora(l);
    window.pgAcabadoraDaLista = l => PG_ACABADORAS.includes(pgGraficaLinha(l));

    // EXCLUSIVO do filtro Origem = Gráfica + Destino = Acabadora.
    // Não altera a classificação dos demais filtros.
    const PG_ACABADORAS_GRAFICA_FILTRO = new Set([
        'HR', 'EMBALARTE', 'TRATTO', 'FELK', 'ATHOS', 'ANTILHAS',
        'RAIZES ACABADORA', 'KN ACABADORA'
    ]);
    window.pgEhDestinoAcabadoraGraficaFiltro = function(l) {
        if (window.pgEhFonteAcabadora(l)) return false;
        return PG_ACABADORAS_GRAFICA_FILTRO.has(pgCdDestinoRoteamento(l));
    };

    // ORIGEM:
    // - Todas = literalmente PCP + PCP_ACABADORAS completos.
    // - Gráfica = somente PCP.
    // - Acabadora = somente PCP_ACABADORAS.
    window.pgLinhaDaOrigem = function(l, origem) {
        const acab = window.pgEhFonteAcabadora(l);
        if (origem === 'ACABADORA') return acab;
        if (origem === 'GRAFICA') return !acab;
        return true;
    };
    window.pgLinhaDoDestino = function(l, destino, origem) {
        if (origem === 'ACABADORA') return window.pgEhFonteAcabadora(l);
        return destino === 'TODOS' || (destino === 'ACAB' ? pgEhAcabadora(l) : !pgEhAcabadora(l));
    };
    // TOTAL BASE — regra exclusiva para ORIGEM = TODAS.
    // Não compensa volume, não tenta parear PCP x PCP_ACABADORAS e não altera fases.
    // HR, EMBALARTE, TRATTO, FELK e ANTILHAS entram pela PCP_ACABADORAS usando
    // "TIRAGEM A ENTREGAR (total por CD)". Todo o restante entra pela PCP.
    window.pgUnirTotalSemDuplicidade = function(linhas) {
        const numero = v => Math.max(0, window.arredondar(v || 0));
        const nomeCampoTotalAcab = 'TIRAGEM A ENTREGAR (TOTAL POR CD)';

        const tiragemTotalAcabadora = l => {
            const chaveCampo = Object.keys(l).find(k => pgNorm(k) === nomeCampoTotalAcab);
            return chaveCampo ? numero(l[chaveCampo]) : 0;
        };

        // PCP: fica somente o que NÃO vai para as cinco acabadoras da lista fechada.
        const linhasPCP = linhas.filter(l =>
            !window.pgEhFonteAcabadora(l) && !pgEhAcabadora(l)
        );

        // PCP_ACABADORAS: entram somente as cinco acabadoras da lista fechada.
        // A cópia existe apenas para o Total, preservando a linha original usada pelas fases.
        const linhasAcabadoras = linhas
            .filter(l => window.pgEhFonteAcabadora(l) && window.pgAcabadoraDaLista(l))
            .map(l => {
                const tiragemTotal = tiragemTotalAcabadora(l);
                if (tiragemTotal <= 0) return null;
                return {
                    ...l,
                    TIRAGEM: tiragemTotal,
                    _ROW_ID: (l._ROW_ID || getKey(l)) + ':total-todas',
                    _PG_TOTAL_HIBRIDO: true
                };
            })
            .filter(Boolean);

        return [...linhasPCP, ...linhasAcabadoras];
    };

    // Regras históricas EXCLUSIVAS das fases congeladas e seu denominador.
    // Não usar esta lista para filtrar coleta/forecast ou classificar Destino.
    window.pgDestinoAcabadoraCongelado = function(l) {
        const cd = pgCdDestinoRoteamento(l);
        return ['ANTILHAS', 'ANTIHAS', 'FELK', 'TRATTO', 'EMBALARTE', 'HR'].includes(cd) || cd.includes('ACABADORA');
    };
    window.pgAthosCongelado = function(l) {
        return window.pgEhFonteAcabadora(l) && (pgGraficaLinha(l).includes('ATHOS') || pgCdLinha(l).includes('ATHOS'));
    };
    window.pgLinhaTotalCongelado = function(l, origem) {
        const acab = window.pgEhFonteAcabadora(l);
        if (origem === 'ACABADORA') return acab;
        if (origem === 'GRAFICA') return !acab;
        return acab ? !window.pgAthosCongelado(l) : !window.pgDestinoAcabadoraCongelado(l);
    };

    function pgCasaGrafica(graficaLinha, graficasPessoa) {
        const g = pgNorm(graficaLinha);
        return (graficasPessoa || []).some(x => {
            const n = pgNorm(x);
            return g === n || g.includes(n) || n.includes(g);
        });
    }

    function pgPessoasDoTime(time) {
        return Object.entries(PG_PESSOAS)
            .filter(([, p]) => p.time === time)
            .map(([email, p]) => ({ email, ...p }));
    }

    function pgGraficasDoTime(time) {
        const out = [];
        pgPessoasDoTime(time).forEach(p => out.push(...p.graficas));
        return out;
    }

    function pgEmailAtual() {
        if (window.PG_USER_EMAIL && String(window.PG_USER_EMAIL).includes('@')) {
            return String(window.PG_USER_EMAIL).trim().toLowerCase();
        }
        const el = document.getElementById('userEmail');
        const txt = el ? String(el.innerText || '').trim().toLowerCase() : '';
        return txt.includes('@') ? txt : '';
    }

    function pgRole(email) {
        if (PG_LIDERANCA.has(email)) return 'LIDERANCA';
        if (PG_GESTORES[email]) return 'GESTOR';
        if (PG_PESSOAS[email]) return 'ANALISTA';
        return 'PADRAO';
    }

    function pgSelect(id, label, options, onChange) {
        return `
            <div class="flex items-center gap-1.5 bg-white border border-slate-300 rounded-lg px-2 py-1.5 shadow-sm">
                <span class="text-[9px] font-black text-slate-500 uppercase whitespace-nowrap">${pgEsc(label)}:</span>
                <select id="${id}" onchange="${onChange}" class="bg-transparent text-[10px] font-bold text-slate-700 outline-none cursor-pointer max-w-[180px]">
                    ${options.map(o => `<option value="${pgEsc(o.value)}">${pgEsc(o.label)}</option>`).join('')}
                </select>
            </div>`;
    }

    window.pgMontarFiltrosExtras = function() {
        const container = document.getElementById('containerFiltrosMultiProducao');
        if (!container) return;

        const antigo = document.getElementById('pgFiltrosExtras');
        const origemAnterior = document.getElementById('pgFiltroOrigem');
        const origemSelecionada = origemAnterior ? origemAnterior.value : 'TODOS';
        const destinoSelecionado = document.getElementById('pgFiltroDestino')?.value || 'CD';
        if (antigo) antigo.remove();

        const email = pgEmailAtual();
        const role = pgRole(email);

        let html = `<div id="pgFiltrosExtras" class="contents">`;

        html += pgSelect(
            'pgFiltroDestino',
            'Destino',
            [
                { value: 'TODOS', label: 'Todos' },
                { value: 'CD', label: 'CD Destino' },
                { value: 'ACAB', label: 'Acabadora' }
            ],
            "window.pgAlterarFiltroExtra('destino')"
        );

        html += pgSelect('pgFiltroOrigem', 'Origem', [
            { value: 'GRAFICA', label: 'Gráfica' },
            { value: 'ACABADORA', label: 'Acabadora' },
            { value: 'TODOS', label: 'Todas' }
        ], "window.pgAlterarFiltroExtra('origem')");

        const todasPessoas = Object.entries(PG_PESSOAS)
            .map(([e, p]) => ({ email: e, ...p }))
            .sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));

        if (role === 'LIDERANCA' || role === 'GESTOR') {
            let opTimes;
            if (role === 'GESTOR') {
                const meu = PG_GESTORES[email];
                const outro = meu === 'CAMILA' ? 'JAQUELINE' : 'CAMILA';
                opTimes = [
                    { value: 'TODOS', label: 'Todos os times' },
                    { value: meu, label: 'Meu time' },
                    { value: outro, label: outro === 'CAMILA' ? 'Time Camila' : 'Time Jaqueline' }
                ];
            } else {
                opTimes = [
                    { value: 'TODOS', label: 'Todos os times' },
                    { value: 'CAMILA', label: 'Time Camila' },
                    { value: 'JAQUELINE', label: 'Time Jaqueline' }
                ];
            }

            html += pgSelect('pgFiltroTime', 'Time', opTimes, "window.pgAlterarFiltroExtra('time')");
            html += pgSelect(
                'pgFiltroAnalista',
                'Analista',
                [{ value: 'TODOS', label: 'Todos os analistas' }].concat(
                    todasPessoas.map(p => ({ value: p.email, label: p.nome }))
                ),
                "window.pgAlterarFiltroExtra('analista')"
            );
        } else if (role === 'ANALISTA') {
            const minhas = PG_PESSOAS[email];
            const graficasBase = window.listasMultiProducao && window.listasMultiProducao['Gráfica']
                ? Array.from(window.listasMultiProducao['Gráfica']).filter(v => v && v !== '(Vazio)').sort((a,b) => String(a).localeCompare(String(b), 'pt-BR'))
                : [];

            const opGraficas = [
                { value: 'TODOS', label: 'Todas as gráficas' },
                { value: 'MINHAS', label: 'Minhas gráficas' }
            ];
            graficasBase.forEach(g => opGraficas.push({ value: 'GRAFICA:' + String(g), label: String(g) }));
            html += pgSelect('pgFiltroGraficaAnalista', 'Gráficas', opGraficas, "window.pgAlterarFiltroExtra('grafica')");
        }

        html += `</div>`;
        container.insertAdjacentHTML('beforeend', html);
        document.getElementById('pgFiltroOrigem').value = origemSelecionada;
        document.getElementById('pgFiltroDestino').value = destinoSelecionado;
        window.pgSincronizarOrigemDestino();
    };

    window.pgSincronizarOrigemDestino = function() {
        const origem = document.getElementById('pgFiltroOrigem')?.value || 'TODOS';
        const destino = document.getElementById('pgFiltroDestino');
        if (!destino) return;
        if (origem === 'ACABADORA') destino.value = 'CD';
        destino.disabled = origem === 'ACABADORA';
    };

    window.pgAlterarFiltroExtra = function(tipo) {
        window.pgSincronizarOrigemDestino();
        if (tipo === 'time') {
            const a = document.getElementById('pgFiltroAnalista');
            if (a) a.value = 'TODOS';
        } else if (tipo === 'analista') {
            const t = document.getElementById('pgFiltroTime');
            if (t) t.value = 'TODOS';
        }
        if (typeof window.aplicarFiltros === 'function') window.aplicarFiltros();
    };

    window.pgCompilarFiltrosExtras = function() {
        const valor = (id, padrao = 'TODOS') => document.getElementById(id)?.value || padrao;
        const origem = valor('pgFiltroOrigem', 'TODOS'), destino = origem === 'ACABADORA' ? 'CD' : valor('pgFiltroDestino', 'CD');
        const email = pgEmailAtual(), role = pgRole(email);
        const time = valor('pgFiltroTime'), analista = valor('pgFiltroAnalista'), grafica = valor('pgFiltroGraficaAnalista');
        const listas = [];
        let unica = null;
        if (role === 'LIDERANCA' || role === 'GESTOR') {
            if (time !== 'TODOS') listas.push(pgGraficasDoTime(time));
            if (analista !== 'TODOS' && PG_PESSOAS[analista]) listas.push(PG_PESSOAS[analista].graficas);
        } else if (role === 'ANALISTA') {
            if (grafica === 'MINHAS' && PG_PESSOAS[email]) listas.push(PG_PESSOAS[email].graficas);
            else if (grafica.startsWith('GRAFICA:')) unica = pgNorm(grafica.substring(8));
        }
        return (l, opcoes = {}) => {
            if (window.pgSolicitacaoCancelada(l)) return false;
            const origemLinha = window.pgEhFonteAcabadora(l) ? 'ACABADORA' : 'GRAFICA';
            if (!opcoes.ignorarOrigem && origem !== 'TODOS' && origem !== origemLinha) return false;
            if (!opcoes.ignorarRoteamento && origem === 'TODOS' && !window.pgLinhaDaOrigem(l, origem)) return false;
            if (!opcoes.ignorarDestino && !window.pgLinhaDoDestino(l, destino, origem)) return false;
            if (unica !== null || listas.length) {
                const g = pgGraficaLinha(l);
                if (unica !== null && unica !== g) return false;
                if (!listas.every(lista => pgCasaGrafica(g, lista))) return false;
            }
            return true;
        };
    };
    window.pgLinhaAtendeFiltrosExtras = function(l, opcoes = {}) {
        return window.pgCompilarFiltrosExtras()(l, opcoes);
    };

    window.pgLimparFiltrosExtras = function() {
        const origem = document.getElementById('pgFiltroOrigem');
        if (origem) origem.value = 'TODOS';
        ['pgFiltroTime', 'pgFiltroAnalista', 'pgFiltroGraficaAnalista'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.value = 'TODOS';
        });
        const destino = document.getElementById('pgFiltroDestino');
        if (destino) destino.value = 'CD';
        window.pgSincronizarOrigemDestino();
    };

    function pgFmtCompacto(n) {
        n = Number(n || 0);
        if (Math.abs(n) >= 1000000) return (n / 1000000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi';
        if (Math.abs(n) >= 1000) return (n / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil';
        return Math.round(n).toLocaleString('pt-BR');
    }

    function pgChave(l, idx) {
        const base = l['JOIN_KEY'] || l['Chave'] || l['CHAVE'] ||
            [l['OP'] || '', l['SKU_REAL'] || l['SKU'] || '', l['CD_FINAL'] || l['CD DESTINO'] || ''].join('|');
        return String(base || ('LINHA_' + idx)).trim();
    }

    function pgCampo(l, nomes) {
        for (const n of nomes) {
            if (l[n] !== undefined && l[n] !== null && String(l[n]).trim() !== '') return l[n];
        }
        return '';
    }

    function pgData(v) {
        if (typeof extrairDataISO === 'function') return extrairDataISO(v);
        if (!v) return null;
        const d = new Date(v);
        if (isNaN(d.getTime())) return null;
        return d.toISOString().slice(0,10);
    }

    function pgDiff(ini, fim) {
        if (!ini || !fim) return null;
        if (typeof calcDiffDiasISO === 'function') return calcDiffDiasISO(ini, fim);
        const a = new Date(ini + 'T00:00:00');
        const b = new Date(fim + 'T00:00:00');
        return Math.floor((b - a) / 86400000);
    }

    function pgFase(id) {
        return (typeof FASES !== 'undefined' && Array.isArray(FASES)) ? FASES.find(f => f.id === id) : null;
    }

    function pgSpecAplicavel(l, spec) {
        if (!window.pgLinhaNaVisaoDaFase(l, spec.custom === 'entrada_maquina' ? 'imp' : spec.id)) return false;
        if (spec.custom === 'entrada_maquina') return l['_SOURCE'] !== 'ACABADORA';
        if (spec.id === 'col_mapa') return true;
        const f = pgFase(spec.id);
        return f ? (typeof belongsToPhase === 'function' ? belongsToPhase(l, f.id) : true) : false;
    }

    function pgDatasSpec(l, spec, tRef) {
        if (spec.custom === 'entrada_maquina') {
            return {
                plan: pgData(pgCampo(l, ['Impressão Inicio (re) plan', 'IMPRESSÃO INÍCIO BASELINE', 'IMPRESSAO INICIO (RE) PLAN'])),
                real: pgData(pgCampo(l, ['Impressão Inicio Real', 'IMPRESSÃO INÍCIO REAL', 'IMPRESSAO INICIO REAL']))
            };
        }

        const f = pgFase(spec.id);
        if (!f) return { plan: null, real: null };
        const cols = (typeof getCols === 'function') ? getCols(f, tRef) : { plan: f.colPlan, real: f.colReal, realAlt: f.colRealAlt };
        let real = null;

        if (spec.id === 'col_mapa') {
            real = pgData(pgCampo(l, 'Coleta_TP'));
        } else {
            real = pgData(l[cols.real]) || (cols.realAlt ? pgData(l[cols.realAlt]) : null);
        }

        return { plan: cols.plan ? pgData(l[cols.plan]) : null, real };
    }

    function pgVolumeReal(l, spec, tBase) {
        if (spec.custom === 'entrada_maquina') return tBase;
        const f = pgFase(spec.id);
        if (!f) return tBase;
        if (typeof window.getVolFase === 'function') return window.getVolFase(l, f, tBase);
        return tBase;
    }

    function pgCalcularEtapa(data, spec, tRef, hojeIso) {
        const vistos = new Set();
        let baseVol = 0, completoVol = 0, onTimeVol = 0;
        let completosSku = 0, atrasosSku = 0, somaAtraso = 0;
        let planEsperado = 0, planPreenchido = 0;

        data.forEach((l, idx) => {
            if (!pgSpecAplicavel(l, spec)) return;
            const chave = pgChave(l, idx) + '|' + String(l['_SOURCE'] || 'PCP') + '|' + spec.key;
            if (vistos.has(chave)) return;
            vistos.add(chave);

            const tBase = Number(window.arredondar ? window.arredondar(l['TIRAGEM'] || l['QUANTIDADE'] || 0) : Number(l['TIRAGEM'] || l['QUANTIDADE'] || 0)) || 0;
            if (tBase <= 0) return;

            baseVol += tBase;
            const datas = pgDatasSpec(l, spec, tRef);

            planEsperado++;
            if (datas.plan) planPreenchido++;

            let concluido = !!datas.real;
            if (!concluido && spec.custom !== 'entrada_maquina') {
                const f = pgFase(spec.id);
                if (f && typeof dataFoiPreenchida === 'function') concluido = dataFoiPreenchida(l, f);
            }

            if (concluido) {
                completosSku++;
                const vReal = Math.max(0, Number(pgVolumeReal(l, spec, tBase)) || tBase);
                completoVol += vReal;

                if (datas.plan && datas.real) {
                    const dif = pgDiff(datas.plan, datas.real);
                    if (dif !== null && dif <= 0) onTimeVol += vReal;
                    if (dif !== null && dif > 0) {
                        atrasosSku++;
                        somaAtraso += dif;
                    }
                }
            } else if (datas.plan && hojeIso > datas.plan) {
                const difHoje = pgDiff(datas.plan, hojeIso);
                if (difHoje !== null && difHoje > 0) {
                    atrasosSku++;
                    somaAtraso += difHoje;
                }
            }
        });

        const aderencia = completoVol > 0 ? Math.max(0, Math.min(100, (onTimeVol / completoVol) * 100)) : null;
        const producao = baseVol > 0 ? Math.max(0, Math.min(100, (completoVol / baseVol) * 100)) : null;

        return {
            ...spec,
            baseVol, completoVol, onTimeVol, completosSku, atrasosSku,
            mediaAtraso: atrasosSku > 0 ? somaAtraso / atrasosSku : 0,
            aderencia, producao, planEsperado, planPreenchido
        };
    }

    function pgCorPct(pct) {
        if (pct === null || pct === undefined || isNaN(pct)) return 'text-slate-400';
        if (pct >= 90) return 'text-emerald-600';
        if (pct >= 75) return 'text-amber-600';
        return 'text-rose-600';
    }

    window.processarOnePage = function() {
        const raiz = document.getElementById('abaOnePage');
        if (!raiz) return;

        const data = window.pgDadosParaFases();
        const tRefEl = document.getElementById('filtroReferencia');
        const tRef = tRefEl ? (tRefEl.value || 'replan') : 'replan';
        const hojeIso = (typeof dtHojeISO !== 'undefined' && dtHojeISO) ? dtHojeISO : new Date().toISOString().slice(0,10);

        const specs = [
            { key: 'apv', id: 'apv', nome: 'Aprovação de boneco' },
            { key: 'entrada', custom: 'entrada_maquina', nome: 'Entrada em máquina' },
            { key: 'imp', id: 'imp', nome: 'Impressão — fim' },
            { key: 'acab', id: 'acab', nome: 'Acabamento' },
            { key: 'kit', id: 'kit', nome: 'Formação de kit' },
            { key: 'coleta', id: 'col_mapa', nome: 'Coleta' }
        ];

        const stats = specs.map(s => pgCalcularEtapa(data, s, tRef, hojeIso));
        const byKey = Object.fromEntries(stats.map(s => [s.key, s]));

        const totalPorChave = new Map();
        (window.dadosTotalCanonico || dadosFiltrados).forEach(l => {
            const chave = getKey(l);
            const tir = Number(window.arredondar ? window.arredondar(l['TIRAGEM'] || l['QUANTIDADE'] || 0) : Number(l['TIRAGEM'] || l['QUANTIDADE'] || 0)) || 0;
            if (!totalPorChave.has(chave)) totalPorChave.set(chave, tir);
        });
        const tiragemTotal = Array.from(totalPorChave.values()).reduce((a,b) => a+b, 0);

        const skuProduzidoSet = new Set();
        data.forEach((l, idx) => {
            const fImp = pgFase('imp');
            if (!fImp || !pgSpecAplicavel(l, { id:'imp', key:'imp' })) return;
            let concluido = false;
            if (typeof dataFoiPreenchida === 'function') concluido = dataFoiPreenchida(l, fImp);
            else concluido = !!pgDatasSpec(l, { id:'imp', key:'imp' }, tRef).real;
            if (concluido) skuProduzidoSet.add(pgChave(l, idx));
        });

        const opKpiSku = document.getElementById('opKpiSku');
        const opKpiTiragem = document.getElementById('opKpiTiragem');
        const opKpiProducao = document.getElementById('opKpiProducao');
        const opKpiPrazo = document.getElementById('opKpiPrazo');

        if (opKpiSku) opKpiSku.innerText = skuProduzidoSet.size.toLocaleString('pt-BR');
        if (opKpiTiragem) opKpiTiragem.innerText = pgFmtCompacto(tiragemTotal);

        const prodPct = byKey.imp ? byKey.imp.producao : null;
        if (opKpiProducao) {
            opKpiProducao.innerText = prodPct === null ? '-' : Math.round(prodPct) + '%';
            opKpiProducao.className = 'text-2xl font-black mt-1 ' + pgCorPct(prodPct);
        }

        const prazoPct = byKey.coleta ? byKey.coleta.aderencia : null;
        if (opKpiPrazo) {
            opKpiPrazo.innerText = prazoPct === null ? '-' : Math.round(prazoPct) + '%';
            opKpiPrazo.className = 'text-2xl font-black mt-1 ' + pgCorPct(prazoPct);
        }

        const head = document.getElementById('opEtapasHead');
        const body = document.getElementById('opEtapasBody');
        if (head && body) {
            head.innerHTML = `<th class="p-2 border-r border-slate-200 text-left min-w-[150px]">Indicador</th>` +
                stats.map(s => `<th class="p-2 border-r border-slate-200 text-center min-w-[130px]">${pgEsc(s.nome)}</th>`).join('');

            const linha = (nome, render) => `<tr class="border-b border-slate-100 hover:bg-slate-50">
                <td class="p-2 border-r border-slate-200 font-bold text-[10px] uppercase text-slate-600">${nome}</td>
                ${stats.map(s => `<td class="p-2 border-r border-slate-200 text-center">${render(s)}</td>`).join('')}
            </tr>`;

            body.innerHTML =
                linha('% cumprimento do prazo', s => s.aderencia === null ? '<span class="text-slate-300">-</span>' : `<span class="font-black ${pgCorPct(s.aderencia)}">${Math.round(s.aderencia)}%</span>`) +
                linha('Volume (SKU)', s => `<span class="font-black text-slate-700">${s.completosSku.toLocaleString('pt-BR')}</span>`) +
                linha('Atrasos (SKU)', s => `<span class="font-black ${s.atrasosSku > 0 ? 'text-rose-600' : 'text-slate-400'}">${s.atrasosSku.toLocaleString('pt-BR')}</span>`) +
                linha('Média de atraso (dias)', s => s.atrasosSku > 0 ? `<span class="font-black text-slate-700">${s.mediaAtraso.toLocaleString('pt-BR', {maximumFractionDigits:1})}</span>` : '<span class="text-slate-300">-</span>');
        }

        const planEsperado = stats.reduce((a,s) => a + s.planEsperado, 0);
        const planPreenchido = stats.reduce((a,s) => a + s.planPreenchido, 0);
        const pcpPct = planEsperado > 0 ? (planPreenchido / planEsperado) * 100 : null;
        const pcpEl = document.getElementById('opPcpPct');
        const pcpBar = document.getElementById('opPcpBar');
        if (pcpEl) pcpEl.innerText = pcpPct === null ? '-' : Math.round(pcpPct) + '%';
        if (pcpBar) pcpBar.style.width = (pcpPct === null ? 0 : Math.max(0, Math.min(100, pcpPct))) + '%';

        const ofensoras = stats.filter(s => s.aderencia !== null).sort((a,b) => a.aderencia - b.aderencia).slice(0,3);
        const opOf = document.getElementById('opOfensoras');
        if (opOf) {
            opOf.innerHTML = ofensoras.length ? ofensoras.map((s, i) => `
                <div>
                    <div class="flex justify-between items-center text-[10px] mb-1">
                        <span class="font-bold text-slate-700">${i+1}. ${pgEsc(s.nome)}</span>
                        <span class="font-black ${pgCorPct(s.aderencia)}">${Math.round(s.aderencia)}%</span>
                    </div>
                    <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
                        <div class="h-full bg-slate-500 rounded-full" style="width:${Math.max(2, Math.min(100, s.aderencia))}%"></div>
                    </div>
                </div>`).join('') : '<p class="text-xs text-slate-400">Sem base calculável para o recorte atual.</p>';
        }

        const rank = {};
        const coletaSpec = specs.find(s => s.key === 'coleta');
        data.forEach((l, idx) => {
            if (!coletaSpec || !pgSpecAplicavel(l, coletaSpec)) return;
            const graf = String(l['GRAFICA_FINAL'] || l['GRÁFICA'] || l['GRAFICA'] || 'N/A').trim() || 'N/A';
            const datas = pgDatasSpec(l, coletaSpec, tRef);
            if (!datas.real || !datas.plan) return;
            const chave = graf + '|' + pgChave(l, idx);
            if (!rank[graf]) rank[graf] = { total:0, ok:0, vistos:new Set() };
            if (rank[graf].vistos.has(chave)) return;
            rank[graf].vistos.add(chave);
            const tir = Number(window.arredondar ? window.arredondar(l['TIRAGEM'] || l['QUANTIDADE'] || 0) : Number(l['TIRAGEM'] || l['QUANTIDADE'] || 0)) || 0;
            rank[graf].total += tir;
            const dif = pgDiff(datas.plan, datas.real);
            if (dif !== null && dif <= 0) rank[graf].ok += tir;
        });

        const ranking = Object.entries(rank)
            .map(([nome, r]) => ({ nome, pct: r.total > 0 ? (r.ok/r.total)*100 : null }))
            .filter(r => r.pct !== null)
            .sort((a,b) => b.pct - a.pct)
            .slice(0,6);

        const opRank = document.getElementById('opRanking');
        if (opRank) {
            opRank.innerHTML = ranking.length ? ranking.map((r,i) => `
                <div class="flex items-center gap-2 text-[10px]">
                    <span class="w-5 font-black text-slate-400">${i+1}º</span>
                    <span class="flex-1 font-bold text-slate-700 truncate" title="${pgEsc(r.nome)}">${pgEsc(r.nome)}</span>
                    <div class="w-24 h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-slate-500 rounded-full" style="width:${Math.max(2, Math.min(100, r.pct))}%"></div></div>
                    <span class="w-9 text-right font-black ${pgCorPct(r.pct)}">${Math.round(r.pct)}%</span>
                </div>`).join('') : '<p class="text-xs text-slate-400">Sem base calculável para o recorte atual.</p>';
        }

        const atencao = stats.filter(s => s.atrasosSku > 0).sort((a,b) => b.atrasosSku - a.atrasosSku).slice(0,3);
        const opAt = document.getElementById('opPontosAtencao');
        if (opAt) {
            opAt.innerHTML = atencao.length ? atencao.map(s => `
                <div class="rounded-lg border border-rose-100 bg-rose-50/60 p-3">
                    <p class="text-[10px] font-black text-slate-700 uppercase">${pgEsc(s.nome)}</p>
                    <p class="text-xl font-black text-rose-600 mt-1">${s.atrasosSku.toLocaleString('pt-BR')} <span class="text-[10px] font-bold">SKUs em atraso</span></p>
                    <p class="text-[9px] text-slate-500 mt-1">Média: ${s.mediaAtraso.toLocaleString('pt-BR', {maximumFractionDigits:1})} dias</p>
                </div>`).join('') : '<div class="text-xs text-slate-400">Sem atrasos identificados no recorte atual.</div>';
        }
    };

    let pgEmailAnterior = '';
    let pgTentativasEmail = 0;
    const pgTimerEmail = setInterval(function() {
        pgTentativasEmail++;
        const email = pgEmailAtual();
        if (email && email !== pgEmailAnterior) {
            pgEmailAnterior = email;
            window.PG_USER_EMAIL = email;
            window.pgMontarFiltrosExtras();
        }
        if (pgTentativasEmail >= 60) clearInterval(pgTimerEmail);
    }, 400);

    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(window.pgMontarFiltrosExtras, 50);
    });
})();
