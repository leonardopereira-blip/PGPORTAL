                htmlFiltros += `
                <div class="relative filtro-container-prod z-[60]">
                    <button id="btn-filtro-${idCat}" onclick="window.toggleFilterMenuProd('${idCat}', event)" class="bg-white border border-slate-300 px-3 py-1.5 rounded-lg text-[10px] font-bold text-slate-700 hover:bg-slate-50 flex items-center gap-1 shadow-sm uppercase tracking-wide transition-colors">
                        ${key} <span class="text-[8px] opacity-60">▼</span>
                    </button>
                    <div id="menu-prod-${idCat}" class="menu-filtro-prod hidden absolute left-0 top-[calc(100%+4px)] bg-white border border-slate-200 shadow-xl rounded-xl w-60 p-2">
                        <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-100">
                            <button onclick="window.checkAllProd('${idCat}', true)" class="text-[9px] font-bold text-emerald-600 hover:underline px-1 py-0.5">Marcar Todos</button>
                            <button onclick="window.checkAllProd('${idCat}', false)" class="text-[9px] font-bold text-red-600 hover:underline px-1 py-0.5">Desmarcar</button>
                        </div>
                        <div class="max-h-48 overflow-y-auto scroller space-y-1 pr-1">
                            ${Array.from(window.listasMultiProd[key]).sort().map(val => `
                                <div class="flex justify-between items-center hover:bg-slate-50 p-1 rounded group/item">
                                    <label class="flex items-start gap-2 text-[10px] cursor-pointer font-semibold text-slate-700 flex-1">
                                        <input type="checkbox" value="${val}" class="chk-prod-${idCat} mt-0.5" checked onchange="window.processarReentradasProducao()">
                                        <span class="whitespace-normal leading-tight">${val}</span>
                                    </label>
                                    <button onclick="window.checkOnlyProd('${idCat}', '${val}')" class="hidden group-hover/item:block text-[8px] bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded font-bold border border-indigo-100">Único</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>`;
            });
            if(container) container.innerHTML = htmlFiltros;
            window.filtrosProdChamadosIniciados = true;
        }

        const getSelectedProd = (idCat) => new Set(Array.from(document.querySelectorAll(`.chk-prod-${idCat}:checked`)).map(cb => cb.value));
        let selFilters = {};
        Object.keys(window.listasMultiProd).forEach(k => { 
            let keySafe = window.catMapProd[k]; 
            selFilters[keySafe] = getSelectedProd(keySafe); 
            let btn = document.getElementById(`btn-filtro-${keySafe}`);
            if (btn) {
                if (selFilters[keySafe].size < window.listasMultiProd[k].size) {
                    btn.classList.add('bg-indigo-50', 'border-indigo-400', 'text-indigo-800');
                    btn.classList.remove('bg-white', 'border-slate-300', 'text-slate-700');
                } else {
                    btn.classList.add('bg-white', 'border-slate-300', 'text-slate-700');
                    btn.classList.remove('bg-indigo-50', 'border-indigo-400', 'text-indigo-800');
                }
            }
        });

        let inputId = document.getElementById('fpId');
        let fIdBusca = (inputId?.value || "").trim().toLowerCase();
        if (fIdBusca !== "") {
            inputId.classList.add('bg-indigo-50', 'border-indigo-400', 'text-indigo-800');
            inputId.classList.remove('bg-neutral-50', 'border-neutral-300');
        } else {
            inputId.classList.add('bg-neutral-50', 'border-neutral-300');
            inputId.classList.remove('bg-indigo-50', 'border-indigo-400', 'text-indigo-800');
        }

        let catP0 = [], catRupturas = [], catPrevDef = [], catManuseios = [], catAdaptados = [], catSpots = [];
        let pivotVol = {}, pivotVolResp = {}; 
        let mapSemanas = {};

        let hojeDate = new Date(); hojeDate.setHours(0,0,0,0);

        const getWeekGroup = (dateObj) => {
            if (!dateObj) return { id: "Sem Data", lbl: "Sem Data", sub: "" };
            if (dateObj < hojeDate) return { id: "Atrasados", lbl: "Atrasados", sub: "(< Hoje)" };
            let d = new Date(dateObj); let day = d.getDay(); 
            let dom = new Date(d); dom.setDate(d.getDate() - day);
            let sab = new Date(dom); sab.setDate(dom.getDate() + 6);
            let dStr = (dt) => `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}`;
            d.setDate(d.getDate() + 4 - (d.getDay()||7));
            let yearStart = new Date(d.getFullYear(),0,1);
            let weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
            return {
                id: `S${String(weekNo).padStart(2,'0')}-${d.getFullYear()}`,
                lbl: `S${String(weekNo).padStart(2,'0')} (${d.getFullYear()})`,
                sub: `${dStr(dom)} a ${dStr(sab)}`
            };
        };

        window.DADOS_CHAMADOS_CACHE.forEach(l => {
            let idLine = window.getStr(l, COL.ID);
            if (!idLine || idLine === "-") return; // ABORTA ID VAZIO

            let statusProd = window.getStr(l, COL.STATUS_PROD);
            let spNorm = window.normText(statusProd);
            let spLow = statusProd.toLowerCase(); // <--- É SÓ DEVOLVER ESSA LINHA AQUI!
            if (spNorm === "cancelado" || spNorm.includes("concluid")) return;

            // --- CÁLCULOS DE SLA E DATAS ---
            let dtZ = window.pegaDataDateSafe(window.getIdx(l, COL.DT_DESEJADA));
            let dtAB = window.pegaDataDateSafe(window.getIdx(l, COL.META_OKR));
            let dtBL = window.pegaDataDateSafe(window.getIdx(l, COL.ENTREGA_FORM));
            let valBM = window.getLow(l, COL.IMPACTO);
            let dtR = window.pegaDataDateSafe(window.getIdx(l, COL.ENTREGA_CD));
            let valAL = window.getLow(l, COL.VAL_CUSTOS);
            let dtAJ = window.pegaDataDateSafe(window.getIdx(l, COL.COLETA_FORM));
            let dtColeta = window.pegaDataDateSafe(window.getIdx(l, COL.COLETA));

            let ic1 = "", ic1Txt = "", tt1 = "";
            if (!dtZ || !dtAB) { ic1 = "⭕"; ic1Txt = "⭕ Faltam Dados"; tt1 = "Faltam dados de data."; } 
            else if (dtZ >= dtAB) { ic1 = "🟢"; ic1Txt = "🟢 No Prazo / Seguro"; tt1 = "No Prazo."; } 
            else { ic1 = "🔴"; ic1Txt = "🔴 Atrasado / Crítico"; tt1 = "Fora do Prazo."; }

            let ic2 = "", ic2Txt = "", tt2 = "";
            if (spLow === "em alocação" || spLow === "em alocacao") { ic2 = "⚫"; ic2Txt = "⚫ Em Alocação"; tt2 = "Status está em alocação."; } 
            else if (!dtBL) { ic2 = "⭕"; ic2Txt = "⭕ Faltam Dados"; tt2 = "Data Formalizada vazia."; } 
            else if (!dtZ) { ic2 = "🔴"; ic2Txt = "🔴 Atrasado / Crítico"; tt2 = "Falta Data Desejada."; } 
            else if (dtBL <= dtZ) { ic2 = "🟢"; ic2Txt = "🟢 No Prazo / Seguro"; tt2 = "No Prazo."; } 
            else { ic2 = "🔴"; ic2Txt = "🔴 Atrasado / Crítico"; tt2 = "Atrasado."; }

            let ic3 = "", ic3Txt = "", tt3 = "";
            if (spLow === "em alocação" || spLow === "em alocacao") { ic3 = "⚫"; ic3Txt = "⚫ Em Alocação"; tt3 = "Em alocação."; } 
            else if (!dtBL) { ic3 = "⭕"; ic3Txt = "⭕ Faltam Dados"; tt3 = "Data Formalizada vazia."; } 
            else if (valBM === "") { ic3 = "🔴"; ic3Txt = "🔴 Atrasado / Crítico"; tt3 = "Falta 'Atraso tem impacto?'."; } 
            else if (!dtR) { ic3 = "🔴"; ic3Txt = "🔴 Atrasado / Crítico"; tt3 = "Falta Dt Entrega CD."; } 
            else if (dtR <= dtBL) { ic3 = "🟢"; ic3Txt = "🟢 No Prazo / Seguro"; tt3 = "No Prazo."; } 
            else if (dtR > dtBL && valBM.includes("nao")) { ic3 = "🟡"; ic3Txt = "🟡 Atenção / Atr. s/ Impacto"; tt3 = "Atraso S/ Impacto."; } 
            else { ic3 = "🔴"; ic3Txt = "🔴 Atrasado / Crítico"; tt3 = "Atraso C/ Impacto."; }

            let ic4 = "", ic4Txt = "", tt4 = "";
            if (valAL.includes("validacao") || valAL.includes("validação")) { ic4 = "🔵"; ic4Txt = "🔵 Em Validação"; tt4 = "Em Validação."; } 
            else if (valAL !== "" && !valAL.includes("pendente")) { ic4 = "✅"; ic4Txt = "✅ Validado"; tt4 = "Validado."; } 
            else if (!dtAJ) { ic4 = "⭕"; ic4Txt = "⭕ Faltam Dados"; tt4 = "Falta Coleta Formalizada."; } 
            else {
                let diffDias = Math.floor((dtAJ - hojeDate) / 86400000);
                if (diffDias >= 10) { ic4 = "🟢"; ic4Txt = "🟢 No Prazo / Seguro"; tt4 = "Seguro."; } 
                else if (diffDias >= 7) { ic4 = "🟡"; ic4Txt = "🟡 Atenção / Atr. s/ Impacto"; tt4 = "Atenção."; } 
                else { ic4 = "🔴"; ic4Txt = "🔴 Atrasado / Crítico"; tt4 = "Crítico."; }
            }

            l._ic1 = ic1; l._ic2 = ic2; l._ic3 = ic3; l._ic4 = ic4;
            l._tt1 = tt1; l._tt2 = tt2; l._tt3 = tt3; l._tt4 = tt4;

            // --- FILTROS DE TELA ---
            let rCat = window.getCategoriaSafe(window.getStr(l, COL.TIPO));
            let rPrazo = window.getPrazoCatSafe(dtColeta);
            let rMarca = window.getStr(l, COL.MARCA).toUpperCase();
            let rGraf = window.getStr(l, COL.GRAFICA).toUpperCase();
            let rResp = window.getStr(l, COL.RESP).toUpperCase();

            if (fIdBusca !== "" && !idLine.toLowerCase().includes(fIdBusca)) return;
            if (selFilters['Categoria'] && !selFilters['Categoria'].has(rCat)) return;
            if (selFilters['PrazoColeta'] && !selFilters['PrazoColeta'].has(rPrazo)) return;
            if (selFilters['Marca'] && !selFilters['Marca'].has(rMarca)) return;
            if (selFilters['Grafica'] && !selFilters['Grafica'].has(rGraf)) return;
            if (selFilters['StatusProd'] && !selFilters['StatusProd'].has(statusProd)) return;
            if (selFilters['RespChamado'] && !selFilters['RespChamado'].has(rResp)) return;
            if (selFilters['SolxSLA'] && !selFilters['SolxSLA'].has(ic1Txt)) return;
            if (selFilters['AlocxSol'] && !selFilters['AlocxSol'].has(ic2Txt)) return;
            if (selFilters['EntxAloc'] && !selFilters['EntxAloc'].has(ic3Txt)) return;
            if (selFilters['Custos'] && !selFilters['Custos'].has(ic4Txt)) return;

            // Formatação p/ HTML
            l._dtColetaStr = window.formataDataBRSafe(window.getIdx(l, COL.COLETA));
            l._dtEntregaStr = window.formataDataBRSafe(window.getIdx(l, COL.ENTREGA_CD));
            l._dtAberturaStr = window.formataDataBRSafe(window.getIdx(l, COL.ABERTURA));
            l._idSafe = idLine;
            l._marcaSafe = rMarca;
            l._graficaSafe = rGraf;
            l._respSafe = rResp;
            l._descSafe = window.getStr(l, COL.DESC) || "-";
            l._tipoSafe = window.getStr(l, COL.TIPO);
            l._tiragemSafe = window.formatarBR(window.getIdx(l, COL.TIRAGEM) || 0);
            l._statusProdSafe = statusProd;
            // --- EXTRAÇÃO BLINDADA PELO NOME DO CABEÇALHO ---
                l._statusProdP = window.getExactSafe(l, "Status Produção") || window.getStr(l, COL.STATUS_PRODUCAO_P) || "-";
                
                l._statusFinalArq = window.getExactSafe(l, "Status final de aprovação dos arquivos") || window.getStr(l, COL.STATUS_FINAL_ARQ) || "-";
                
                let dataCC = window.getExactSafe(l, "última data de arquivo planejado") || window.getIdx(l, COL.ULTIMA_DATA_ARQ_PLAN);
                l._ultDataArqPlan = window.formataDataBRSafe(dataCC);
                
                l._justifAtraso = window.getExactSafe(l, "Justificativa de atraso (Se houver)") || window.getStr(l, COL.JUSTIFICATIVA_ATRASO) || "-";

            

            // CASCATA
            if (rCat === "🚨 Reentradas P0") catP0.push(l);
            else if (rCat === "⚠️ Reentradas Rupturas") catRupturas.push(l);
            else if (rCat === "🛡️ Prev. + Defeito") catPrevDef.push(l);
            else if (rCat === "👐 Manuseios") catManuseios.push(l);
            else if (rCat === "🔠 Adaptados") catAdaptados.push(l);
            else catSpots.push(l);

            // PIVOT DE VOLUME
            let tiragemInt = window.arredondar(window.getIdx(l, COL.TIRAGEM) || 0);
            let weekInfo = getWeekGroup(dtColeta);
            mapSemanas[weekInfo.id] = weekInfo;

            if (!pivotVol[rGraf]) pivotVol[rGraf] = { total: 0, sem: {} };
            if (!pivotVol[rGraf].sem[weekInfo.id]) pivotVol[rGraf].sem[weekInfo.id] = { vol: 0, ids: [] };
            pivotVol[rGraf].total += tiragemInt;
            pivotVol[rGraf].sem[weekInfo.id].vol += tiragemInt;
            pivotVol[rGraf].sem[weekInfo.id].ids.push(idLine);

            if (!pivotVolResp[rResp]) pivotVolResp[rResp] = { total: 0, sem: {} };
            if (!pivotVolResp[rResp].sem[weekInfo.id]) pivotVolResp[rResp].sem[weekInfo.id] = { vol: 0, ids: [] };
            pivotVolResp[rResp].total += tiragemInt;
            pivotVolResp[rResp].sem[weekInfo.id].vol += tiragemInt;
            pivotVolResp[rResp].sem[weekInfo.id].ids.push(idLine);
        });

        // 4. RENDERIZADOR
        const montaTooltip = (icone, texto) => {
            let safeHtml = texto.split('\n').map(linha => `<span class="block mb-1">${linha}</span>`).join('').replace(/'/g, "&apos;").replace(/"/g, "&quot;");
            return `<span class="cursor-help inline-flex items-center justify-center text-lg transition-transform hover:scale-125" onmouseenter="window.showGlobalTooltipProd(event, '${safeHtml}')" onmousemove="window.moveGlobalTooltipProd(event)" onmouseleave="window.hideGlobalTooltipProd()">${icone}</span>`;
        };

        const renderTable = (arrayData, tbodyId) => {
            let html = "";
            arrayData.sort((a, b) => {
                let dA = window.pegaDataDateSafe(window.getIdx(a, COL.COLETA));
                let dB = window.pegaDataDateSafe(window.getIdx(b, COL.COLETA));
                if (!dA && !dB) return 0; if (!dA) return 1; if (!dB) return -1;
                return dA - dB;
            });

            arrayData.forEach(i => {
                let clStatus = 'bg-neutral-200 text-neutral-700';
                let sLow = i._statusProdSafe.toLowerCase();
                if(sLow.includes("atraso") || sLow.includes("risco")) clStatus = 'bg-red-100 text-red-800 border-red-300';
                else if(sLow !== "sem status" && sLow !== "-") clStatus = 'bg-blue-100 text-blue-800 border-blue-300';

                html += `<tr class="border-b border-black/5 hover:bg-black/5 text-[10px] text-neutral-700">
                    <td class="p-2 text-center font-mono align-top">${i._dtColetaStr}</td>
                    <td class="p-2 text-center font-mono align-top">${i._dtEntregaStr}</td>
                    <td class="p-2 text-center text-neutral-500 font-mono align-top">${i._dtAberturaStr}</td>
                    <td class="p-2 font-bold text-neutral-900 align-top">${i._idSafe}</td>
                    <td class="p-2 whitespace-normal min-w-[200px] max-w-[300px] align-top leading-relaxed">${i._descSafe}</td>
                    <td class="p-2 font-semibold align-top">${i._tipoSafe}</td>
                    <td class="p-2 font-semibold align-top">${i._marcaSafe}</td>
                    <td class="p-2 font-semibold text-indigo-700 align-top">${i._graficaSafe}</td>
                    <td class="p-2 text-right font-black text-neutral-800 bg-black/5 align-top">${i._tiragemSafe}</td>
                    <td class="p-2 text-center align-top"><span class="${clStatus} border px-2 py-0.5 rounded shadow-sm text-[9px] font-bold">${i._statusProdSafe}</span></td>
                    
                    <td class="p-2 truncate max-w-[100px] border-r border-black/10 align-top">${i._respSafe}</td>
                    <td class="p-2 text-center border-r border-black/10 bg-white align-top">${montaTooltip(i._ic1, i._tt1)}</td>
                    <td class="p-2 text-center border-r border-black/10 bg-white align-top">${montaTooltip(i._ic2, i._tt2)}</td>
                    <td class="p-2 text-center border-r border-black/10 bg-white align-top">${montaTooltip(i._ic3, i._tt3)}</td>
                    <td class="p-2 text-center border-r border-black/10 bg-white align-top">${montaTooltip(i._ic4, i._tt4)}</td>
                    
                    <td class="p-2 text-center font-bold text-indigo-700 align-top">${i._statusFinalArq}</td>
                    <td class="p-2 text-center font-mono text-slate-500 align-top">${i._ultDataArqPlan}</td>
                    <td class="p-2 text-center font-semibold text-slate-500 whitespace-normal min-w-[150px] max-w-[250px] align-top leading-relaxed">${i._statusProdP}</td>
                    <td class="p-2 text-slate-500 italic whitespace-normal min-w-[200px] max-w-[300px] align-top leading-relaxed">${i._justifAtraso}</td>
                </tr>`;
            });
            document.getElementById(tbodyId).innerHTML = html || `<tr><td colspan="15" class="p-4 text-center font-bold text-neutral-400">Nenhum chamado listado nesta categoria.</td></tr>`;
            let badge = document.getElementById(`badge-${tbodyId}`);
            if(badge) badge.innerText = arrayData.length;
        };

        renderTable(catP0, 'tbProdP0'); renderTable(catRupturas, 'tbProdRupturas'); 
        renderTable(catPrevDef, 'tbProdPrevDef'); renderTable(catManuseios, 'tbProdManuseios'); 
        renderTable(catAdaptados, 'tbProdAdaptados'); renderTable(catSpots, 'tbProdSpots');

        // Renderiza Matrizes Pivot
        let arrSemanasKeys = Object.keys(mapSemanas).sort((a,b) => {
            if(a.includes("Atrasados")) return -1; if(b.includes("Atrasados")) return 1;
            if(a.includes("Sem Data")) return 1; if(b.includes("Sem Data")) return -1;
            return a.localeCompare(b);
        });

        const montaTooltipMatriz = (valorStr, ids) => {
            let listaIds = ids.join(', ');
            let content = `<span class="text-indigo-400 block mb-1 uppercase tracking-wider text-[8px] border-b border-slate-700 pb-1">Chamados neste volume:</span><span class="font-normal text-slate-200">${listaIds}</span>`;
            let safeHtml = content.replace(/'/g, "&apos;").replace(/"/g, "&quot;");
            return `<span class="cursor-help block w-full text-right transition-transform hover:scale-110" onmouseenter="window.showGlobalTooltipProd(event, '${safeHtml}')" onmousemove="window.moveGlobalTooltipProd(event)" onmouseleave="window.hideGlobalTooltipProd()">${valorStr}</span>`;
        };

        const buildMatrizHtml = (dadosPivot, idTh, idTb, lblPrimeiraColuna, baseColorRGB) => {
            let maxVolPorSemana = {};
            arrSemanasKeys.forEach(wk => {
                let max = 0; Object.values(dadosPivot).forEach(r => { if(r.sem[wk] && r.sem[wk].vol > max) max = r.sem[wk].vol; });
                maxVolPorSemana[wk] = max;
            });
            let thVol = `<tr><th class="p-2 border-r border-black/10">${lblPrimeiraColuna}</th><th class="p-2 border-r border-black/10 text-right font-black bg-black/10">Total Tiragem</th>`;
            arrSemanasKeys.forEach(k => {
                let info = mapSemanas[k];
                thVol += `<th class="p-2 border-r border-black/10 text-center leading-tight"><span class="block">${info.lbl}</span><span class="block text-[8px] text-slate-500 font-normal mt-0.5">${info.sub}</span></th>`;
            });
            thVol += `</tr>`;
            let elTh = document.getElementById(idTh); if(elTh) elTh.innerHTML = thVol;

            let tbVol = ""; let totColSemanas = {}; arrSemanasKeys.forEach(k => totColSemanas[k] = 0); let totalGeralVol = 0;
            Object.keys(dadosPivot).sort((a,b) => dadosPivot[b].total - dadosPivot[a].total).forEach(k => {
                let row = dadosPivot[k]; totalGeralVol += row.total;
                tbVol += `<tr class="border-b border-neutral-100 hover:bg-neutral-50"><td class="p-2 border-r border-neutral-200 font-bold text-neutral-800 text-[10px]">${k}</td><td class="p-2 border-r border-neutral-200 text-right font-black text-neutral-800 bg-neutral-100 text-[10px]">${window.formatarBR(row.total)}</td>`;
                arrSemanasKeys.forEach(wk => {
                    let cell = row.sem[wk]; let v = cell ? cell.vol : 0; totColSemanas[wk] += v;
                    if (v === 0) { tbVol += `<td class="p-2 border-r border-neutral-200 text-right text-neutral-300 text-[9px]">-</td>`; } 
                    else {
                        let opacity = maxVolPorSemana[wk] > 0 ? (v / maxVolPorSemana[wk]) * 0.7 : 0;
                        let bgStyle = `background-color: rgba(${baseColorRGB}, ${opacity});`;
                        let textColor = opacity > 0.4 ? 'text-indigo-950 font-black' : 'text-neutral-700 font-bold';
                        tbVol += `<td class="p-2 border-r border-white text-right text-[9px] ${textColor}" style="${bgStyle}">${montaTooltipMatriz(window.formatarBR(v), cell.ids)}</td>`;
                    }
                });
                tbVol += `</tr>`;
            });
            if(Object.keys(dadosPivot).length > 0) {
                tbVol += `<tr class="bg-slate-800 text-white"><td class="p-2 border-r border-slate-700 font-black text-right text-[10px]">TOTAL GERAL</td><td class="p-2 border-r border-slate-700 text-right font-black text-[10px]">${window.formatarBR(totalGeralVol)}</td>`;
                arrSemanasKeys.forEach(wk => { tbVol += `<td class="p-2 border-r border-slate-700 text-right font-bold text-slate-300 text-[9px]">${totColSemanas[wk]===0?'-':window.formatarBR(totColSemanas[wk])}</td>`; });
                tbVol += `</tr>`;
            }
            let elTb = document.getElementById(idTb); if(elTb) elTb.innerHTML = tbVol || `<tr><td colspan="${arrSemanasKeys.length+2}" class="p-4 text-center text-neutral-500">Sem dados filtrados.</td></tr>`;
        };
        buildMatrizHtml(pivotVol, 'thVolumeSemanas', 'tbVolumeSemanas', 'Gráfica', '79, 70, 229');
        buildMatrizHtml(pivotVolResp, 'thVolumeSemanasResp', 'tbVolumeSemanasResp', 'Resp. Chamado', '2, 132, 199');

        const calcSumario = (nomeCat, arrayData, estiloLinha) => {
            let c1 = {'🟢':[], '🔴':[], '⭕':[]}; let c2 = {'🟢':[], '🔴':[], '⚫':[], '⭕':[]};
            let c3 = {'🟢':[], '🟡':[], '🔴':[], '⚫':[], '⭕':[]}; let c4 = {'✅':[], '🔵':[], '🟢':[], '🟡':[], '🔴':[]};
            arrayData.forEach(i => {
               if(c1[i._ic1] !== undefined) c1[i._ic1].push(i._idSafe); if(c2[i._ic2] !== undefined) c2[i._ic2].push(i._idSafe);
               if(c3[i._ic3] !== undefined) c3[i._ic3].push(i._idSafe); if(c4[i._ic4] !== undefined) c4[i._ic4].push(i._idSafe);
            });
            const montaTooltipResumo = (icone, count, ids) => {
                let listaIds = ids.join(', ');
                let content = `<span class="text-indigo-400 block mb-1 uppercase tracking-wider text-[8px] border-b border-slate-700 pb-1">IDs atrelados:</span><span class="font-normal text-slate-200">${listaIds}</span>`;
                let safeHtml = content.replace(/'/g, "&apos;").replace(/"/g, "&quot;");
                return `<div class="inline-flex items-center justify-center cursor-help transition-transform hover:scale-110 mr-3" onmouseenter="window.showGlobalTooltipProd(event, '${safeHtml}')" onmousemove="window.moveGlobalTooltipProd(event)" onmouseleave="window.hideGlobalTooltipProd()"><span class="mr-1">${icone}</span> <b class="text-neutral-800">${count}</b></div>`;
            };
            const drawIcons = (obj) => {
                let r = ""; Object.keys(obj).forEach(k => { if (obj[k].length > 0) r += montaTooltipResumo(k, obj[k].length, obj[k]); });
                return r === "" ? '<span class="opacity-30 font-bold">-</span>' : r;
            };
            return `<tr class="border-b ${estiloLinha.border} hover:bg-slate-50"><td class="p-2 font-bold border-r ${estiloLinha.borderCell} text-slate-700">${nomeCat}</td><td class="p-2 border-r ${estiloLinha.borderCell} text-center">${drawIcons(c1)}</td><td class="p-2 border-r ${estiloLinha.borderCell} text-center">${drawIcons(c2)}</td><td class="p-2 border-r ${estiloLinha.borderCell} text-center">${drawIcons(c3)}</td><td class="p-2 text-center">${drawIcons(c4)}</td></tr>`;
        };

        const estSlate = { border: "border-slate-200", borderCell: "border-slate-200" };
        let htmlResumoGeral = "";
        htmlResumoGeral += calcSumario("🚨 P0", catP0, estSlate); htmlResumoGeral += calcSumario("⚠️ Rupturas", catRupturas, estSlate);
        htmlResumoGeral += calcSumario("🛡️ Prev. + Defeito", catPrevDef, estSlate); htmlResumoGeral += calcSumario("👐 Manuseios", catManuseios, estSlate);
        htmlResumoGeral += calcSumario("🔠 Adaptados", catAdaptados, estSlate); htmlResumoGeral += calcSumario("📌 Spots / Demais", catSpots, estSlate);
        document.getElementById('tbResumoGeral').innerHTML = htmlResumoGeral;
    };


    // =========================================================================
    // 2. TELA ACOMPANHAMENTO DE PENDÊNCIAS
    // =========================================================================
    window.processarPendenciasProducao = function() {
        if (!window.DADOS_CHAMADOS_CACHE) return;

        if (!window.filtrosPendIniciados) {
            let container = document.getElementById('containerFiltrosMultiPend');
            let htmlFiltros = "";
            
            window.DADOS_CHAMADOS_CACHE.forEach(l => {
                let idLine = window.getStr(l, COL.ID);
                if (!idLine || idLine === "-") return; 
                
                let statusProd = window.getStr(l, COL.STATUS_PROD);
                // Usa o normText para arrancar os acentos e jogar pra minúsculo
                let spNorm = window.normText(statusProd);
                
                // NOVA REGRA BLINDADA CONTRA ACENTOS
                if (spNorm === "cancelado" || spNorm.includes("concluid")) return;
                
                window.listasMultiProd['Marca'].add(window.getStr(l, COL.MARCA));
                window.listasMultiProd['Gráfica'].add(window.getStr(l, COL.GRAFICA));
                window.listasMultiProd['Status Prod.'].add(statusProd);
                window.listasMultiProd['Resp. Chamado'].add(window.getStr(l, COL.RESP));
            });

            Object.keys(window.listasMultiProd).forEach(key => {
                let idCat = window.catMapProd[key]; 
                htmlFiltros += `
                <div class="relative filtro-container-prod z-[60]">
                    <button id="btn-filtro-pend-${idCat}" onclick="window.toggleFilterMenuPend('${idCat}', event)" class="bg-white border border-slate-300 px-3 py-1.5 rounded-lg text-[10px] font-bold text-slate-700 hover:bg-slate-50 flex items-center gap-1 shadow-sm uppercase tracking-wide transition-colors">
                        ${key} <span class="text-[8px] opacity-60">▼</span>
                    </button>
                    <div id="menu-pend-${idCat}" class="menu-filtro-prod hidden absolute left-0 top-[calc(100%+4px)] bg-white border border-slate-200 shadow-xl rounded-xl w-60 p-2">
                        <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-100">
                            <button onclick="window.checkAllPend('${idCat}', true)" class="text-[9px] font-bold text-emerald-600 hover:underline px-1 py-0.5">Marcar Todos</button>
                            <button onclick="window.checkAllPend('${idCat}', false)" class="text-[9px] font-bold text-red-600 hover:underline px-1 py-0.5">Desmarcar</button>
                        </div>
                        <div class="max-h-48 overflow-y-auto scroller space-y-1 pr-1">
                            ${Array.from(window.listasMultiProd[key]).sort().map(val => `
                                <div class="flex justify-between items-center hover:bg-slate-50 p-1 rounded group/item">
                                    <label class="flex items-start gap-2 text-[10px] cursor-pointer font-semibold text-slate-700 flex-1">
                                        <input type="checkbox" value="${val}" class="chk-pend-${idCat} mt-0.5" checked onchange="window.processarPendenciasProducao()">
                                        <span class="whitespace-normal leading-tight">${val}</span>
                                    </label>
                                    <button onclick="window.checkOnlyPend('${idCat}', '${val}')" class="hidden group-hover/item:block text-[8px] bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded font-bold border border-indigo-100">Único</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>`;
            });
            if(container) container.innerHTML = htmlFiltros;
            window.filtrosPendIniciados = true;
        }

        const getSelectedPend = (idCat) => new Set(Array.from(document.querySelectorAll(`.chk-pend-${idCat}:checked`)).map(cb => cb.value));
        let selFilters = {};
        Object.keys(window.listasMultiProd).forEach(k => { 
            let keySafe = window.catMapProd[k]; 
            selFilters[keySafe] = getSelectedPend(keySafe); 
            let btn = document.getElementById(`btn-filtro-pend-${keySafe}`);
            if (btn) {
                if (selFilters[keySafe].size < window.listasMultiProd[k].size) {
                    btn.classList.add('bg-red-50', 'border-red-400', 'text-red-800');
                    btn.classList.remove('bg-white', 'border-slate-300', 'text-slate-700');
                } else {
                    btn.classList.add('bg-white', 'border-slate-300', 'text-slate-700');
                    btn.classList.remove('bg-red-50', 'border-red-400', 'text-red-800');
                }
            }
        });

        let inputId = document.getElementById('pendId');
        let fIdBusca = (inputId?.value || "").trim().toLowerCase();
        if (fIdBusca !== "") {
            inputId.classList.remove('bg-white', 'border-neutral-300');
            inputId.classList.add('bg-red-50', 'border-red-400', 'text-red-800');
        } else {
            inputId.classList.add('bg-neutral-50', 'border-neutral-300');
            inputId.classList.remove('bg-red-50', 'border-red-400', 'text-red-800');
        }

        let pendAloc = [], pendArq = [], pendCustos = [], pendOC = [];

        window.DADOS_CHAMADOS_CACHE.forEach(l => {
            let idLine = window.getStr(l, COL.ID);
            if (!idLine || idLine === "-") return; // ABORTA ID VAZIO

            let statusProd = window.getStr(l, COL.STATUS_PROD);
            let spLow = statusProd.toLowerCase();
            
            // NOVA REGRA: Aborta Cancelados e Concluídos na contagem principal!
            if (spLow === "cancelado" || spLow.includes("concluid")) return; 

            let lCategorias = [];

            // 🎯 TABELA 1: Alocação Pendente (APENAS "Em alocação")
            if (spLow === "em alocação" || spLow === "em alocacao") {
                lCategorias.push("Alocação");
                pendAloc.push(l);
            }

            // 🎯 TABELA 2: Arquivos Pendentes
            let stFinalArq = window.getLow(l, COL.APV_ARQ);
            if (stFinalArq.includes("pendente")) {
                lCategorias.push("Arquivos");
                pendArq.push(l);
            }

            // 🎯 TABELA 3: Validação de Custos Pendente
            let dtValCustos = window.getLow(l, COL.VAL_CUSTOS);
            if (dtValCustos === "" || dtValCustos.includes("pendente") || dtValCustos.includes("em valida")) {
                let dtColForm = window.pegaDataDateSafe(window.getIdx(l, COL.COLETA_FORM));
                let urgenciaObj = { dias: null, label: "Sem Data de Coleta", cor: "bg-slate-100 text-slate-500 border border-slate-200" };
                
                if (dtColForm) {
                    let diffDias = Math.ceil((dtColForm - globalHojeDate) / 86400000);
                    urgenciaObj.dias = diffDias;
                    if (diffDias <= 3) urgenciaObj = { label: `Crítico (${diffDias}d)`, cor: "bg-red-100 text-red-800 font-black border border-red-300 shadow-sm" };
                    else if (diffDias <= 10) urgenciaObj = { label: `Urgente (${diffDias}d)`, cor: "bg-orange-100 text-orange-800 font-bold border border-orange-300" };
                    else urgenciaObj = { label: `No Prazo (${diffDias}d)`, cor: "bg-blue-50 text-blue-700 font-semibold border border-blue-200" };
                }
                
                l._urgenciaCustos = urgenciaObj;
                l._dtColFormStr = window.formataDataBRSafe(window.getIdx(l, COL.COLETA_FORM));
                lCategorias.push("Custos");
                pendCustos.push(l);
            }

            // 🎯 TABELA 4: Ordens de Compra (OC) Pendentes
            let stOC = window.getLow(l, COL.STATUS_OC);
            let stApvOC = window.getLow(l, COL.APV_OC);
            
            if (!stOC.includes("concluid") && !stApvOC.includes("aprovad")) {
                lCategorias.push("Ordens de Compra");
                pendOC.push(l);
            }

            if (lCategorias.length === 0) return;

            let dtColeta = window.pegaDataDateSafe(window.getIdx(l, COL.COLETA));
            let rCat = window.getCategoriaSafe(window.getStr(l, COL.TIPO));
            let rPrazo = window.getPrazoCatSafe(dtColeta);

            let filtraLinha = false;
            if (fIdBusca !== "" && !idLine.toLowerCase().includes(fIdBusca)) filtraLinha = true;
            if (selFilters['Categoria'] && !selFilters['Categoria'].has(rCat)) filtraLinha = true;
            if (selFilters['PrazoColeta'] && !selFilters['PrazoColeta'].has(rPrazo)) filtraLinha = true;
            if (selFilters['Marca'] && !selFilters['Marca'].has(window.getStr(l, COL.MARCA))) filtraLinha = true;
            if (selFilters['Grafica'] && !selFilters['Grafica'].has(window.getStr(l, COL.GRAFICA))) filtraLinha = true;
            if (selFilters['StatusProd'] && !selFilters['StatusProd'].has(statusProd)) filtraLinha = true;
            if (selFilters['RespChamado'] && !selFilters['RespChamado'].has(window.getStr(l, COL.RESP))) filtraLinha = true;


            if (filtraLinha) {
                if (lCategorias.includes("Alocação")) pendAloc.pop();
                if (lCategorias.includes("Arquivos")) pendArq.pop();
                if (lCategorias.includes("Custos")) pendCustos.pop();
                if (lCategorias.includes("Ordens de Compra")) pendOC.pop();
            } else {
                l._dtColetaStr = window.formataDataBRSafe(dtColeta);
                // Extraindo as novas colunas de datas solicitadas
                l._dtEntregaStr = window.formataDataBRSafe(window.getIdx(l, COL.ENTREGA_CD));
                l._dtAberturaStr = window.formataDataBRSafe(window.getIdx(l, COL.ABERTURA));
                
                l._idSafe = idLine;
                l._marcaSafe = window.getStr(l, COL.MARCA);
                l._graficaSafe = window.getStr(l, COL.GRAFICA);
                l._tiragemSafe = window.formatarBR(window.getIdx(l, COL.TIRAGEM) || 0);
                l._catWip = rCat;
                l._prazoColeta = rPrazo;
                l._statusProdSafe = statusProd;
                l._respSafe = window.getStr(l, COL.RESP);
                
                // Extraindo Tipo e Descrição
                l._tipoSafe = window.getStr(l, COL.TIPO) || "-";
                l._descSafe = window.getStr(l, COL.DESC) || "-";

                // --- EXTRAÇÃO DAS DEMAIS COLUNAS ---
                l._statusProdP = window.getStr(l, COL.STATUS_PRODUCAO_P) || "-";
                l._statusFinalArq = window.getStr(l, COL.STATUS_FINAL_ARQ) || "-";
                l._ultDataArqPlan = window.formataDataBRSafe(window.getIdx(l, COL.ULTIMA_DATA_ARQ_PLAN));
                l._justifAtraso = window.getStr(l, COL.JUSTIFICATIVA_ATRASO) || "-";
            }
        });


        // ====================================================
        // ORDENAÇÃO: DT COLETA (MAIOR PARA MENOR - DESCENDENTE)
        // ====================================================
        const ordenarPorColetaDesc = (a, b) => {
            let dA = window.pegaDataDateSafe(window.getIdx(a, COL.COLETA));
            let dB = window.pegaDataDateSafe(window.getIdx(b, COL.COLETA));
            
            if (!dA && !dB) return 0;
            if (!dA) return 1;  // Joga os "Sem Data" pro final da lista
            if (!dB) return -1;
            
            return dA.getTime() - dB.getTime(); // Ordem decrescente (Maior para Menor)
        };

        // Aplica a nova ordenação em todas as 4 listas de pendências
        pendAloc.sort(ordenarPorColetaDesc);
        pendArq.sort(ordenarPorColetaDesc);
        pendCustos.sort(ordenarPorColetaDesc);
        pendOC.sort(ordenarPorColetaDesc);

        // ----------------------------------------------------
        // Renderizadores Padronizados das Pendências
        // ----------------------------------------------------
        const buildStandardCols = (i) => {
            let clPrazo = 'bg-slate-100 text-slate-600 border-slate-200';
            if (i._prazoColeta.includes("Atraso")) clPrazo = 'bg-red-100 text-red-800 border-red-300 shadow-sm';
            else if (i._prazoColeta.includes("Essa Semana")) clPrazo = 'bg-amber-100 text-amber-800 border-amber-300 shadow-sm';
            else if (i._prazoColeta.includes("Semana Seguinte")) clPrazo = 'bg-blue-100 text-blue-800 border-blue-300 shadow-sm';

            // Colunas padronizadas exigidas em TODAS as abas de pendências
            return `<td class="p-2 text-center font-mono text-slate-500">${i._dtColetaStr}</td>
                    <td class="p-2 text-center font-mono text-slate-500">${i._dtEntregaStr}</td>
                    <td class="p-2 text-center font-mono text-slate-500">${i._dtAberturaStr}</td>
                    <td class="p-2 text-center"><span class="px-2 py-0.5 rounded text-[8px] font-black border ${clPrazo} uppercase tracking-widest">${i._prazoColeta}</span></td>
                    <td class="p-2 font-semibold text-indigo-700">${i._catWip}</td>
                    <td class="p-2 font-bold text-neutral-900">${i._idSafe}</td>
                    <td class="p-2 truncate max-w-[150px]" title="${i._descSafe}">${i._descSafe}</td>
                    <td class="p-2 font-semibold text-slate-600">${i._tipoSafe}</td>
                    <td class="p-2 font-semibold text-slate-600">${i._marcaSafe}</td>
                    <td class="p-2 font-semibold text-indigo-700">${i._graficaSafe}</td>
                    <td class="p-2 text-right font-black text-neutral-800 bg-black/5">${i._tiragemSafe}</td>
                    <td class="p-2 text-center"><span class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded font-bold border border-slate-300">${i._statusProdSafe}</span></td>
                    <td class="p-2 truncate max-w-[100px] border-r border-slate-200">${i._respSafe}</td>`;
        };

        // Renderização Alocação
        let hAloc = "";
        pendAloc.forEach(i => {
            hAloc += `<tr class="border-b border-slate-100 hover:bg-slate-50 text-[10px] text-neutral-700">
                ${buildStandardCols(i)}
            </tr>`;
        });
        document.getElementById('tbPendAloc').innerHTML = hAloc || `<tr><td colspan="13" class="p-5 text-center font-bold text-emerald-600 bg-emerald-50/50">Nenhuma alocação pendente. 🎉</td></tr>`;
        let badgeAloc = document.getElementById('badge-tbPendAloc'); if(badgeAloc) badgeAloc.innerText = pendAloc.length;

        // Renderização Arquivos
        let hArq = "";
        pendArq.forEach(i => {
            let stEnvio = window.getV_fallback(i, "status envio");
            let stRecBon = window.getV_fallback(i, "status rec. boneco");
            let stPrzPre = window.getV_fallback(i, "status prazo pre impressão");

            const colorirSt = (st) => {
                let s = st.toLowerCase();
                if(s.includes("atraso")) return `<span class="text-red-600 font-bold">${st}</span>`;
                if(s.includes("ok") || s.includes("prazo") || s.includes("concluído") || s.includes("concluido")) return `<span class="text-emerald-600 font-bold">${st}</span>`;
                return `<span class="text-slate-500 font-semibold">${st || "-"}</span>`;
            };

            hArq += `<tr class="border-b border-slate-100 hover:bg-slate-50 text-[10px] text-neutral-700">
                ${buildStandardCols(i)}
                <td class="p-2 text-center border-l border-slate-200">${colorirSt(stEnvio)}</td>
                <td class="p-2 text-center border-l border-slate-200">${colorirSt(stRecBon)}</td>
                <td class="p-2 text-center border-l border-slate-200 bg-slate-50">${colorirSt(stPrzPre)}</td>
            </tr>`;
        });
        document.getElementById('tbPendArq').innerHTML = hArq || `<tr><td colspan="16" class="p-5 text-center font-bold text-emerald-600 bg-emerald-50/50">Nenhum arquivo pendente. 🎉</td></tr>`;
        let badgeArq = document.getElementById('badge-tbPendArq'); if(badgeArq) badgeArq.innerText = pendArq.length;

        // Renderização Custos
        let hCusto = "";
        pendCustos.forEach(i => {
            let urg = i._urgenciaCustos;
            hCusto += `<tr class="border-b border-slate-100 hover:bg-slate-50 text-[10px] text-neutral-700">
                ${buildStandardCols(i)}
                <td class="p-2 text-center font-mono text-slate-600 border-l border-slate-200">${i._dtColFormStr}</td>
                <td class="p-2 text-center"><span class="px-2 py-0.5 rounded text-[9px] ${urg.cor}">${urg.label}</span></td>
            </tr>`;
        });
        document.getElementById('tbPendCustos').innerHTML = hCusto || `<tr><td colspan="15" class="p-5 text-center font-bold text-emerald-600 bg-emerald-50/50">Nenhuma validação de custo pendente. 🎉</td></tr>`;
        let badgeCusto = document.getElementById('badge-tbPendCustos'); if(badgeCusto) badgeCusto.innerText = pendCustos.length;

        // Renderização Ordens de Compra
        let hOC = "";
        pendOC.forEach(i => {
            let idxOC = window.getStr(i, COL.DESC);
            let stOC = window.getStr(i, COL.STATUS_OC) || "-";
            let stApv = window.getStr(i, COL.APV_OC) || "-";
            let corStOC = stOC.toLowerCase().includes("atraso") ? "text-red-700 bg-red-50 border-red-200" : "text-orange-700 bg-orange-50 border-orange-200";
            let corStApv = stApv.toLowerCase().includes("atraso") ? "text-red-700 bg-red-50 border-red-200" : "text-blue-700 bg-blue-50 border-blue-200";
            
            hOC += `<tr class="border-b border-slate-100 hover:bg-slate-50 text-[10px] text-neutral-700">
                ${buildStandardCols(i)}
                <td class="p-2 font-mono text-indigo-800 font-bold border-l border-slate-200 truncate max-w-[200px]" title="${idxOC}">${idxOC || "-"}</td>
                <td class="p-2 text-center"><span class="px-2 py-0.5 rounded font-bold border ${corStOC}">${stOC}</span></td>
                <td class="p-2 text-center"><span class="px-2 py-0.5 rounded font-bold border ${corStApv}">${stApv}</span></td>
            </tr>`;
        });
        document.getElementById('tbPendOC').innerHTML = hOC || `<tr><td colspan="16" class="p-5 text-center font-bold text-emerald-600 bg-emerald-50/50">Nenhuma OC pendente. 🎉</td></tr>`;
        let badgeOC = document.getElementById('badge-tbPendOC'); if(badgeOC) badgeOC.innerText = pendOC.length;

        window.pendenciasExportarGlobais = { aloc: pendAloc, arq: pendArq, cus: pendCustos, oc: pendOC };
    };

    window.exportarPendenciasCSV = function() {
        let exportData = window.pendenciasExportarGlobais;
        if (!exportData) { alert("Nenhuma base calculada para exportar."); return; }

        // 1. Lê a opção selecionada no dropdown
        let selExport = document.getElementById('selExportPend').value;

        // 2. Calcula se a opção escolhida tem dados para exportar
        let countL = 0;
        if (selExport === "TODAS" || selExport === "ALOCACAO") countL += exportData.aloc.length;
        if (selExport === "TODAS" || selExport === "ARQUIVOS") countL += exportData.arq.length;
        if (selExport === "TODAS" || selExport === "CUSTOS") countL += exportData.cus.length;
        if (selExport === "TODAS" || selExport === "OC") countL += exportData.oc.length;

        if(countL === 0) { alert("Sua lista de pendências está limpa para este filtro! 🎉 Não há o que baixar."); return; }

        let c = "\uFEFFID;Data Coleta;Prazo Coleta;Categoria WIP;Marca;Gráfica;Tiragem;Categoria da Pendência;Motivo / Status Principal\n";
        
        const buildRow = (i, cat, descExtra) => {
            let id = i._idSafe || "-"; let dt = i._dtColetaStr || "-"; let prazo = i._prazoColeta || "-";
            let catWip = i._catWip || "-"; let m = i._marcaSafe || "-"; let g = i._graficaSafe || "-";
            let t = String(i._tiragemSafe || "0").replace(/\./g, ""); 
            let descSafe = String(descExtra || "").replace(/;/g, ",");
            return `${id};${dt};${prazo};${catWip};${m};${g};${t};${cat};${descSafe}\n`;
        };

        // 3. Monta as linhas apenas para o que foi selecionado
        if (selExport === "TODAS" || selExport === "ALOCACAO") {
            exportData.aloc.forEach(i => { c += buildRow(i, "Alocação Pendente", i._statusProdSafe); });
        }
        if (selExport === "TODAS" || selExport === "ARQUIVOS") {
            exportData.arq.forEach(i => { c += buildRow(i, "Arquivos Pendentes", window.getStr(i, COL.APV_ARQ) || "Pendente"); });
        }
        if (selExport === "TODAS" || selExport === "CUSTOS") {
            exportData.cus.forEach(i => { c += buildRow(i, "Validação de Custos Pendente", i._urgenciaCustos ? i._urgenciaCustos.label : "Sem Data"); });
        }
        if (selExport === "TODAS" || selExport === "OC") {
            exportData.oc.forEach(i => { c += buildRow(i, "Ordem de Compra (OC) Pendente", `Status OC: ${window.getStr(i, COL.STATUS_OC) || "Pendente"}`); });
        }

        // 4. Nome dinâmico para o arquivo de acordo com o filtro
        let nomeArquivo = `Pendencias_${selExport}_${new Date().toISOString().split('T')[0]}.csv`;

        let a = document.createElement("a"); 
        a.href = URL.createObjectURL(new Blob([c], {type:'text/csv;charset=utf-8;'})); 
        a.download = nomeArquivo; 
        a.click();
    };

    // --- FUNÇÕES DE FILTRO DA ABA PRODUÇÃO E PENDÊNCIAS ---

    window.checkAllPend = function(idCat, checkStatus) {
        document.querySelectorAll(`.chk-pend-${idCat}`).forEach(cb => cb.checked = checkStatus);
        window.processarPendenciasProducao();
    };
    window.checkOnlyPend = function(idCat, valToKeep) {

    // =========================================================================

    // =========================================================================
    if (!window.escutadorFiltrosProd) {
        window.escutadorFiltrosProd = true;

            // Se o clique não foi dentro de um botão ou menu de filtro, ele esconde todos

    // -------------------------------------------------------------------------
    // ABA: PAINEL GERENCIAL DE REENTRADAS (VERSÃO BLINDADA)
    // -------------------------------------------------------------------------
    window.listasMultiGer = {
        'Categoria': new Set(['🚨 Reentradas P0', '⚠️ Reentradas Rupturas', '🛡️ Prev. + Defeito', '👐 Manuseios', '🔠 Adaptados', '📌 Spots / Demais']), 
        'Prazo Coleta': new Set(['⚠️ Em Atraso (< Hoje)', '📅 Essa Semana', '⏭️ Semana Seguinte', '⏳ Futuro / Sem Data']),
        'Marca': new Set(), 'Gráfica': new Set(), 'Status Prod.': new Set(), 'Resp. Chamado': new Set()
    };
    
    // Mapa seguro sem acentos para os IDs do HTML
    const mapFiltrosGer = {
        'Categoria': 'Categoria', 'Prazo Coleta': 'PrazoColeta', 'Marca': 'Marca', 
        'Gráfica': 'Grafica', 'Status Prod.': 'StatusProd', 'Resp. Chamado': 'RespChamado'
    };

    window.toggleFilterMenuGer = (id, e) => { e.stopPropagation(); document.querySelectorAll('.menu-filtro-ger').forEach(m => m.id !== `menu-ger-${id}` && m.classList.add('hidden')); document.getElementById(`menu-ger-${id}`).classList.toggle('hidden'); };

    window.iniciarAbaReentradasGerencial = function(forcar) {
        // BLINDAGEM: Garante que só vai no servidor se for explicitamente TRUE
        // Ignora eventos de clique de mouse que caem aqui sem querer
        let forcarAtualizacao = (forcar === true); 

        if (!window.DADOS_CHAMADOS_CACHE || window.DADOS_CHAMADOS_CACHE.length === 0 || forcarAtualizacao) {
            if(window.setLoading) window.setLoading(true, "Carregando Dados...");
            google.script.run.withSuccessHandler((dados) => {
                window.DADOS_CHAMADOS_CACHE = dados;
                window.filtrosGerIniciados = false; // Resetar para repopular listas
                window.processarReentradasGerencial();
                if(window.setLoading) window.setLoading(false);
            }).getDadosChamados();
        } else {
            window.processarReentradasGerencial();
        }
    };

window.processarReentradasGerencial = function() {
        if (!window.DADOS_CHAMADOS_CACHE) return;

        if (!window.filtrosGerIniciados) {
            ['Marca','Gráfica','Status Prod.','Resp. Chamado'].forEach(k => window.listasMultiGer[k].clear());
            
            window.DADOS_CHAMADOS_CACHE.forEach(l => {
                let id = window.getStr(l, COL.ID); if (!id || id === "-") return;
                
                let m = window.getStr(l, COL.MARCA).toUpperCase(); window.listasMultiGer['Marca'].add(m || "(Vazio)");
                let g = window.getStr(l, COL.GRAFICA).toUpperCase(); window.listasMultiGer['Gráfica'].add(g || "(Vazio)");
                let s = window.getStr(l, COL.STATUS_PROD); window.listasMultiGer['Status Prod.'].add(s || "(Vazio)");
                let r = window.getStr(l, COL.RESP).toUpperCase(); window.listasMultiGer['Resp. Chamado'].add(r || "(Vazio)");
            });

            let htmlFiltros = "";
            Object.keys(window.listasMultiGer).forEach(key => {
                let id = mapFiltrosGer[key];
                htmlFiltros += `<div class="relative filtro-container-ger z-[60]"><button id="btn-filtro-ger-${id}" onclick="window.toggleFilterMenuGer('${id}', event)" class="bg-white border border-slate-300 px-3 py-1.5 rounded-lg text-[10px] font-bold text-slate-700 hover:bg-slate-50 flex items-center gap-1 shadow-sm uppercase transition-colors">${key} <span class="text-[8px] opacity-60">▼</span></button><div id="menu-ger-${id}" class="menu-filtro-ger hidden absolute left-0 top-[calc(100%+4px)] bg-white border border-slate-200 shadow-xl rounded-xl w-60 p-2 z-[70]"><div class="flex justify-between items-center mb-2 pb-2 border-b"><button onclick="window.checkAllGer('${id}', true)" class="text-[9px] font-bold text-emerald-600">Todos</button><button onclick="window.checkAllGer('${id}', false)" class="text-[9px] font-bold text-red-600">Nenhum</button></div><div class="max-h-48 overflow-y-auto scroller">${Array.from(window.listasMultiGer[key]).sort().map(v => `<div class="flex justify-between items-center hover:bg-slate-50 p-1 group/item"><label class="flex items-start gap-2 text-[10px] cursor-pointer flex-1"><input type="checkbox" value="${v}" class="chk-ger-${id} mt-0.5" checked onchange="window.processarReentradasGerencial()"><span>${v}</span></label><button onclick="window.checkOnlyGer('${id}', '${v}')" class="hidden group-hover/item:block text-[8px] bg-indigo-50 px-1 py-0.5 rounded">Único</button></div>`).join('')}</div></div></div>`;
            });
            document.getElementById('containerFiltrosMultiGer').innerHTML = htmlFiltros;
            window.filtrosGerIniciados = true;
        }

        const getSel = (id) => new Set(Array.from(document.querySelectorAll(`.chk-ger-${id}:checked`)).map(cb => cb.value));
        let sel = { cat: getSel('Categoria'), prz: getSel('PrazoColeta'), mar: getSel('Marca'), gra: getSel('Grafica'), st: getSel('StatusProd'), res: getSel('RespChamado') };
        let buscaId = (document.getElementById('gerBuscaId')?.value || "").trim().toLowerCase();

        let reqMap = new Map();
        let totTodos = 0, totAbertos = 0, totConcluidos = 0, totCancelados = 0;
        
        let slaColOk = 0, slaColTot = 0, slaAbOk = 0, slaAbTot = 0;
        let slaGrafOk = 0, slaGrafTot = 0; 
        
        let catCounts = { '🚨 Reentradas P0': 0, '⚠️ Reentradas Rupturas': 0, '🛡️ Prev. + Defeito': 0, '👐 Manuseios': 0, '🔠 Adaptados': 0, '📌 Spots / Demais': 0 };
        let prazosCounts = { '⚠️ Em Atraso (< Hoje)': 0, '📅 Essa Semana': 0, '⏭️ Semana Seguinte': 0, '⏳ Futuro / Sem Data': 0 };
        let mapMarcaCat = {}, mapGraficaCat = {}, mapStatusCat = {};
        let mapColetaDiaria = {}; 
        
        let linhasTabela = []; // Array da Tabela para não quebrar o HTML

        window.DADOS_CHAMADOS_CACHE.forEach(l => {
            let idLine = window.getStr(l, COL.ID); if (!idLine || idLine === "-") return;
            
            let statusProd = window.getStr(l, COL.STATUS_PROD) || "(Vazio)";
            let spNorm = window.normText(statusProd);
            let macroSt = spNorm === "cancelado" ? "Cancelado" : (spNorm.includes("concluid") ? "Concluído" : "Aberto");

            let dtColeta = window.pegaDataDateSafe(window.getIdx(l, COL.COLETA));
            let rCat = window.getCategoriaSafe(window.getStr(l, COL.TIPO));
            let rPrazo = window.getPrazoCatSafe(dtColeta);
            let rMarca = window.getStr(l, COL.MARCA).toUpperCase() || "(Vazio)";
            let rGraf = window.getStr(l, COL.GRAFICA).toUpperCase() || "(Vazio)";
            let rResp = window.getStr(l, COL.RESP).toUpperCase() || "(Vazio)";

            if (buscaId !== "" && !idLine.toLowerCase().includes(buscaId)) return;
            if (!sel.cat.has(rCat) || !sel.prz.has(rPrazo) || !sel.mar.has(rMarca) || !sel.gra.has(rGraf) || !sel.st.has(statusProd) || !sel.res.has(rResp)) return;

            let reqKey = (window.getStr(l, COL.DESC) !== "-" ? window.getStr(l, COL.DESC) : idLine);
            if (!reqMap.has(reqKey)) {
                l._macroSt = macroSt; l._catWip = rCat; l._prazoColeta = rPrazo;
                reqMap.set(reqKey, l);
            }
        });

        reqMap.forEach(l => {
            totTodos++;
            if (l._macroSt === "Cancelado") totCancelados++;
            else if (l._macroSt === "Concluído") totConcluidos++;
            else totAbertos++;

            let dtA = window.pegaDataDateSafe(window.getIdx(l, COL.ABERTURA));
            let dtC = window.pegaDataDateSafe(window.getIdx(l, COL.COLETA));
            let dtD = window.pegaDataDateSafe(window.getIdx(l, COL.DT_DESEJADA));
            
            let strPrevReal = window.getStr(l, 17) || l[17] || "";
            let strFormalizada = window.getStr(l, 36) || l[36] || "";
            let dtPrevReal = window.pegaDataDateSafe(strPrevReal);
            let dtFormalizada = window.pegaDataDateSafe(strFormalizada);

            let m = window.getStr(l, COL.MARCA).toUpperCase() || "N/A";
            let g = window.getStr(l, COL.GRAFICA).toUpperCase() || "N/A";
            let s = window.getStr(l, COL.STATUS_PROD) || "N/A";

            if (l._macroSt !== "Cancelado") {
                if (dtA && dtC) { slaColTot++; if (Math.floor((dtC.getTime() - dtA.getTime())/86400000) <= 21) slaColOk++; }
                if (dtA && dtD) { slaAbTot++; if (Math.floor((dtD.getTime() - dtA.getTime())/86400000) >= 25) slaAbOk++; }
                
                // NOVO SLA BLINDADO (Garante que só faz a conta se a data for válida e numérica)
                if (dtPrevReal && dtFormalizada && !isNaN(dtPrevReal.getTime()) && !isNaN(dtFormalizada.getTime())) {
                    slaGrafTot++;
                    dtPrevReal.setHours(0,0,0,0); dtFormalizada.setHours(0,0,0,0);
                    if (dtPrevReal.getTime() <= dtFormalizada.getTime()) slaGrafOk++;
                }
            }

            if (l._macroSt === "Aberto") {
                catCounts[l._catWip]++;
                prazosCounts[l._prazoColeta]++;

                if(!mapMarcaCat[m]) mapMarcaCat[m] = { total: 0, cats: {} };
                mapMarcaCat[m].total++; mapMarcaCat[m].cats[l._catWip] = (mapMarcaCat[m].cats[l._catWip] || 0) + 1;

                if(!mapGraficaCat[g]) mapGraficaCat[g] = { total: 0, cats: {} };
                mapGraficaCat[g].total++; mapGraficaCat[g].cats[l._catWip] = (mapGraficaCat[g].cats[l._catWip] || 0) + 1;

                if(!mapStatusCat[s]) mapStatusCat[s] = { total: 0, cats: {} };
                mapStatusCat[s].total++; mapStatusCat[s].cats[l._catWip] = (mapStatusCat[s].cats[l._catWip] || 0) + 1;

                // GRÁFICO DE COLETAS BLINDADO (Ignora datas com erro de conversão)
                if (dtPrevReal && !isNaN(dtPrevReal.getTime())) {
                    let dtStr = dtPrevReal.toISOString().split('T')[0]; 
                    if(!mapColetaDiaria[dtStr]) mapColetaDiaria[dtStr] = { total: 0, marcas: {} };
                    mapColetaDiaria[dtStr].total++;
                    mapColetaDiaria[dtStr].marcas[m] = (mapColetaDiaria[dtStr].marcas[m] || 0) + 1;
                }
                
                let resC = dtA && dtC ? (Math.floor((dtC.getTime() - dtA.getTime())/86400000) <= 21 ? '✅ Sim':'❌ Não') : '-';
                
                linhasTabela.push(`<tr class="border-b border-slate-100 hover:bg-slate-50 text-[10px]">
                    <td class="p-2 border-r border-slate-200 font-bold">${window.getStr(l, COL.ID)}</td>
                    <td class="p-2 border-r border-slate-200 truncate max-w-[150px] font-semibold text-indigo-700" title="${window.getStr(l, COL.DESC)}">${window.getStr(l, COL.DESC) !== "-" ? window.getStr(l, COL.DESC) : "-"}</td>
                    <td class="p-2 border-r border-slate-200 text-slate-700 font-semibold">${window.getStr(l, 9) || "-"}</td>
                    <td class="p-2 border-r border-slate-200 font-semibold">${l._catWip}</td>
                    <td class="p-2 border-r border-slate-200">${m}</td>
                    <td class="p-2 border-r border-slate-200">${g}</td>
                    <td class="p-2 border-r border-slate-200 text-center font-mono">${window.formataDataBRSafe(dtA)}</td>
                    <td class="p-2 border-r border-slate-200 text-center font-mono">${window.formataDataBRSafe(dtC)}</td>
                    <td class="p-2 border-r border-slate-200 text-center font-mono font-bold">${window.formataDataBRSafe(dtPrevReal)}</td>
                    <td class="p-2 border-r border-slate-200 text-center font-mono font-bold text-purple-700 bg-purple-50/50">${window.formataDataBRSafe(dtFormalizada)}</td>
                    <td class="p-2 border-r border-slate-200 text-center font-bold ${resC.includes('✅')?'text-emerald-600':'text-red-600'}">${resC}</td>
                    <td class="p-2 text-slate-600">${s}</td>
                </tr>`);
            }
        });

        // 5. ATUALIZAR INTERFACE
        document.getElementById('kpiGerTodos').innerText = totTodos;
        document.getElementById('kpiGerAbertos').innerText = totAbertos;
        document.getElementById('kpiGerConcluidos').innerText = totConcluidos;
        document.getElementById('kpiGerCancelados').innerText = totCancelados;

        const setSla = (ok, tot, id, colorClass) => { let el = document.getElementById(id); if(tot===0){ el.innerText="-"; el.className="text-2xl font-black text-slate-400"; return; } let p = (ok/tot)*100; el.innerText = p.toFixed(1)+"%"; el.className=`text-2xl font-black ${p>=90?'text-emerald-600':(p>=80?'text-amber-500':'text-red-600')} ${colorClass||''}`; };
        setSla(slaColOk, slaColTot, 'kpiGerSlaCol');
        setSla(slaAbOk, slaAbTot, 'kpiGerSlaAbe');
        setSla(slaGrafOk, slaGrafTot, 'kpiGerSlaGrafica', '!text-purple-700');

        let hCats = "";
        const cCard = (lbl, val, cl) => `<div class="bg-white p-3 rounded-lg border shadow-sm flex flex-col items-center"><span class="text-[9px] font-bold text-slate-400 uppercase truncate w-full text-center">${lbl.substring(3)}</span><span class="text-2xl font-black ${cl}">${val}</span></div>`;
        hCats += cCard('🚨 P0', catCounts['🚨 Reentradas P0'], 'text-red-600');
        hCats += cCard('⚠️ Rupturas', catCounts['⚠️ Reentradas Rupturas'], 'text-rose-600');
        hCats += cCard('🛡️ Prev+Def', catCounts['🛡️ Prev. + Defeito'], 'text-amber-500');
        hCats += cCard('👐 Manuseios', catCounts['👐 Manuseios'], 'text-emerald-500');
        hCats += cCard('🔠 Adaptados', catCounts['🔠 Adaptados'], 'text-indigo-600');
        hCats += cCard('📌 Spots', catCounts['📌 Spots / Demais'], 'text-slate-600');
        document.getElementById('cardsGerCategorias').innerHTML = hCats;

        // INJEÇÃO DA TABELA (SEM LIMITE DE LINHAS)
        document.getElementById('tbGerencialBase').innerHTML = linhasTabela.length > 0 ? linhasTabela.join('') : `<tr><td colspan="12" class="p-4 text-center">Nenhum registro encontrado.</td></tr>`;

        // 6. GRÁFICOS
        const coresCat = { '🚨 Reentradas P0': '#ef4444', '⚠️ Reentradas Rupturas': '#e11d48', '🛡️ Prev. + Defeito': '#f59e0b', '👐 Manuseios': '#10b981', '🔠 Adaptados': '#4f46e5', '📌 Spots / Demais': '#64748b' };
        const coresMarcas = ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#64748b', '#06b6d4', '#f43f5e', '#84cc16', '#a855f7']; 

        const plugTop = { id:'pTop', afterDatasetsDraw(c){ const {ctx,data,scales:{y}}=c; ctx.font='bold 10px sans-serif'; ctx.fillStyle='#1e293b'; ctx.textAlign='center'; ctx.textBaseline='bottom'; for(let i=0; i<data.labels.length; i++){ let s=0; data.datasets.forEach(ds=>{if(!ds.hidden) s+=ds.data[i];}); if(s>0){ let m=c.getDatasetMeta(data.datasets.length-1); if(m.data[i]) ctx.fillText(s, m.data[i].x, y.getPixelForValue(s)-4); } } } };

        const drawStack = (id, obj, corObj) => {
            let ctx = document.getElementById(id); if(!ctx) return;
            let lbs = Object.keys(obj).sort((a,b)=>obj[b].total - obj[a].total);
            let ds = []; 
            Object.keys(corObj).forEach(c => { 
                let d = lbs.map(l => (obj[l].cats ? obj[l].cats[c] : obj[l].marcas[c]) || 0); 
                if(d.some(v=>v>0)) ds.push({label: c.replace(/[^\w\sÀ-ú]/gi, '').trim(), data:d, backgroundColor:corObj[c]}); 
            });
            if(window['chart_'+id]) window['chart_'+id].destroy();
            window['chart_'+id] = new Chart(ctx, { type:'bar', data:{labels:lbs, datasets:ds}, plugins:[plugTop], options:{ maintainAspectRatio:false, layout:{padding:{top:20}}, interaction: { mode: 'index', intersect: false }, plugins:{legend:{position:'bottom', labels:{boxWidth:8, font:{size:10}}}}, scales:{x:{stacked:true}, y:{stacked:true, display:false}} } });
        };

        drawStack('grafGerMarca', mapMarcaCat, coresCat);
        drawStack('grafGerGrafica', mapGraficaCat, coresCat);
        drawStack('grafGerStatus', mapStatusCat, coresCat);

        let ctxColeta = document.getElementById('grafGerColetaDiaria');
        if(ctxColeta) {
            let labelsDatas = Object.keys(mapColetaDiaria).sort();
            let todasAsMarcasUnicas = new Set();
            labelsDatas.forEach(dt => Object.keys(mapColetaDiaria[dt].marcas).forEach(m => todasAsMarcasUnicas.add(m)));
            
            let corMarcaDiaria = {};
            Array.from(todasAsMarcasUnicas).forEach((m, idx) => { corMarcaDiaria[m] = coresMarcas[idx % coresMarcas.length]; });
            
            let labelsFormatadas = labelsDatas.map(iso => { let [y,m,d] = iso.split('-'); return `${d}/${m}`; });

            let dsColeta = [];
            Array.from(todasAsMarcasUnicas).forEach(m => {
                let d = labelsDatas.map(dt => mapColetaDiaria[dt].marcas[m] || 0);
                if(d.some(v=>v>0)) dsColeta.push({label: m, data:d, backgroundColor:corMarcaDiaria[m]});
            });

            if(window.chart_grafGerColetaDiaria) window.chart_grafGerColetaDiaria.destroy();
            window.chart_grafGerColetaDiaria = new Chart(ctxColeta, { type:'bar', data:{labels:labelsFormatadas, datasets:dsColeta}, plugins:[plugTop], options:{ maintainAspectRatio:false, layout:{padding:{top:20}}, interaction: { mode: 'index', intersect: false }, plugins:{legend:{position:'bottom', labels:{boxWidth:8, font:{size:10}}}}, scales:{x:{stacked:true}, y:{stacked:true, display:false}} } });
        }

        let ctxP = document.getElementById('grafGerPrazos');
        if(ctxP) {
            if(window.chart_grafGerPrazos) window.chart_grafGerPrazos.destroy();
