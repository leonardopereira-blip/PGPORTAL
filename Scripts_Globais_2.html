    function getCorHeatmap(pct) {
        if(pct === '-') return 'bg-slate-100 text-slate-400';
        if(pct >= 100) return 'bg-emerald-500 text-white'; 
        if(pct >= 80) return 'bg-yellow-400 text-slate-800';
        if(pct >= 50) return 'bg-orange-500 text-white'; 
        return 'bg-rose-500 text-white';
    }

    function extrairDataISO(str) {
        if (!str || String(str).trim() === "") return null;
        let s = String(str).trim();
        if (s.length < 6 || s.toLowerCase().includes("não") || s.toLowerCase().includes("n/a") || s === "-") return null;
        if (s.includes('T')) s = s.split('T')[0]; if (s.includes(' ')) s = s.split(' ')[0];
        if (s.includes('/')) { let pts = s.split('/'); if(pts.length === 3) return `${pts[2]}-${pts[1].padStart(2,'0')}-${pts[0].padStart(2,'0')}`; }
        if (s.includes('-')) { let pts = s.split('-'); if(pts.length === 3 && pts[0].length === 4) return `${pts[0]}-${pts[1].padStart(2,'0')}-${pts[2].padStart(2,'0')}`; }
        return null; 
    }

    function formatarDataBR(isoStr) {
        if(!isoStr) return "-";
        let p = isoStr.split('-'); return `${p[2]}/${p[1]}/${p[0]}`;
    }

    function calcDiffDiasISO(isoIni, isoFim) {
        if(!isoIni || !isoFim) return null;
        let p1 = isoIni.split('-'); let d1 = new Date(p1[0], p1[1]-1, p1[2]);
        let p2 = isoFim.split('-'); let d2 = new Date(p2[0], p2[1]-1, p2[2]);
        return Math.floor((d2.getTime() - d1.getTime()) / 86400000);
    }

    function sortGMarca(a, b) { 
        let g1 = String((a && (a.grafica || a.g)) || "N/A"); let g2 = String((b && (b.grafica || b.g)) || "N/A");
        let m1 = String((a && (a.marca || a.m)) || "N/A"); let m2 = String((b && (b.marca || b.m)) || "N/A");
        let g = g1.localeCompare(g2); return g !== 0 ? g : m1.localeCompare(m2); 
    }

    function getKey(l) { return (l["OP"]||"") + "_" + (l["SKU"]||"") + "_" + (l["ID"]||Math.random().toString()); }

    function belongsToPhase(linha, fId) {
    if (linha["_SOURCE"] === "ACABADORA") {
        const fasesIgnoradasAcabadora = ['env', 'rec', 'apv', 'imp', 'tra', 'cus_ini', 'cus_fim', 'oc_ini', 'oc_fim'];
        if (fasesIgnoradasAcabadora.includes(fId)) return false;
        return true;
    }
    if (linha["_SOURCE"] === "PCP" || !linha["_SOURCE"]) {
        let cd = String(linha["CD_FINAL"] || linha["CD DESTINO"] || "").toUpperCase();
        let vaiParaAcabadora = cd.includes("FELK") || cd.includes("ATHOS") || cd.includes("HR");

        if (vaiParaAcabadora) {
            // 🎯 Etapas 12 a 16 retiradas da trava
            const fasesDaAcabadora = ['rec_acab', 'acab', 'kit', 'col'];
            if (fasesDaAcabadora.includes(fId)) return false;
        } else {
            if (fId === 'tra' || fId === 'rec_acab') return false;
        }
    }
    return true;
}

window.getVolFase = function(linha, fObj, tBase) {
    // 🎯 Trava do mapa de saída removida para pegar tudo da aba PCP
    if (!fObj.colVol) return tBase;
    
    // 🎯 Busca o volume na coluna correspondente
    let val = linha[fObj.colVol];
    if (val === undefined || val === null || val === "") val = linha[String(fObj.colVol).replace('#', '').trim()];
    if (val === undefined || val === null || val === "") val = linha['Tiragem Internalizada'];
    if (val === undefined || val === null || val === "") val = linha['# Tiragem Internalizada'];
    
    return window.arredondar(val || 0);
};

    function getCols(fObj, tRef) { return { plan: (tRef === 'baseline' && fObj.colBase) ? fObj.colBase : fObj.colPlan, real: fObj.colReal, realAlt: fObj.colRealAlt, iniReal: fObj.colIniReal }; }
    
    function dataFoiPreenchida(linha, fObj) { 
        let temData = extrairDataISO(linha[fObj.colReal]) !== null || (fObj.colRealAlt ? extrairDataISO(linha[fObj.colRealAlt]) !== null : false); 
        // 🎯 A MÁGICA: Se não tem data no PCP, mas tem volume no Mapa/CD, força como preenchido!
        if (!temData && fObj.colVol) {
            if (window.getVolFase(linha, fObj, 0) > 0) return true;
        }
        return temData; 
    }
    
    function calcAtraso(linha, fObj, tRef, dataHoje) {
        if (dataFoiPreenchida(linha, fObj)) return 0;
        let dISO = extrairDataISO(linha[getCols(fObj, tRef).plan]); if (!dISO) return null
        let pts = dISO.split('-'); let diff = Math.floor((dataHoje.getTime() - new Date(pts[0], pts[1]-1, pts[2]).getTime()) / 86400000);
        return diff > 0 ? diff : 0;
    }
    
    function foiEntregueNoPrazo(linha, fObj, tRef) {
        let cols = getCols(fObj, tRef);
        let isoReal = extrairDataISO(linha[cols.real]) || (cols.realAlt ? extrairDataISO(linha[cols.realAlt]) : null);
        let isoPlan = extrairDataISO(linha[cols.plan]);
        return (isoReal && isoPlan) ? calcDiffDiasISO(isoPlan, isoReal) <= 0 : false;
    }
    
    function getLeadTimeEmDias(linha, fObj, tRef) {
        let cols = getCols(fObj, tRef);
        let isoReal = extrairDataISO(linha[cols.real]) || (cols.realAlt ? extrairDataISO(linha[cols.realAlt]) : null);
        if (!isoReal) return null; 
        let isoIni = fObj.colIniReal ? extrairDataISO(linha[fObj.colIniReal]) : extrairDataISO(linha[cols.plan]); 
        if (!isoIni) return 0; 
        let diff = calcDiffDiasISO(isoIni, isoReal); 
        return diff >= 0 ? diff : 0;
    }

    // 2. FUNÇÃO QUE CALCULA A PRIORIDADE (Reage a Baseline / Replan dinamicamente)
    window.obterPrioridade = function(l, tRef) {
        let fCol = FASES.find(f => f.id === 'col');
        if (!fCol) return "5. ⚪ (Sem Data)";
        
        let colPlan = getCols(fCol, tRef).plan;
        let dtColIso = extrairDataISO(l[colPlan]);
        
        if (!dtColIso) return "5. ⚪ (Sem Data)";

        let diff = calcDiffDiasISO(dtHojeISO, dtColIso); 
        
        if (diff < 0) return "1. 🚨 Backlog (Atrasado)";
        if (diff <= 7) return "2. 🔴 0 a 7 Dias";
        if (diff <= 15) return "3. 🟡 8 a 15 Dias";
        return "4. 🟢 +15 Dias";
    };

    function preencherOpcoesFiltros() {
        if (window.filtrosGeraisIniciados) return;

        Object.keys(window.listasMultiProducao).forEach(k => {
            if(k !== 'Prioridade') window.listasMultiProducao[k].clear();
        });
        
        if(window.dadosGlobais) {
            window.dadosGlobais.forEach(l => {
                Object.keys(window.mapCamposProducao).forEach(k => {
                    let val = String(l[window.mapCamposProducao[k]] || "").trim();
                    if(!val || val === "undefined" || val === "-") val = "(Vazio)"; 
                    window.listasMultiProducao[k].add(val);
                });

                ? 'border-amber-500 bg-amber-100 text-amber-900 shadow-md hover:bg-amber-200' 
                : 'bg-white border-slate-400 text-slate-800 hover:bg-slate-100 shadow-md';
            
            htmlFiltros += `
            <div class="relative filtro-container-geral ${extraClass}">
                <button id="btn-filtro-geral-${idCat}" onclick="window.toggleFilterMenuGeral('${idCat}', event)" class="${customBtnClass} px-3 py-2 rounded-lg text-xs font-black flex items-center gap-2 uppercase tracking-wide transition-colors">
                    ${key} <span class="text-[10px] opacity-80">▼</span>
                </button>
                <div id="menu-geral-${idCat}" class="menu-filtro-geral hidden absolute left-0 top-[calc(100%+4px)] bg-white border border-slate-300 shadow-xl rounded-xl w-60 p-2 z-[90]">
                    <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-200">
                        <button onclick="window.checkAllGeral('${idCat}', true)" class="text-[10px] font-black text-emerald-600 hover:underline px-1 py-0.5">Marcar Todos</button>
                        <button onclick="window.checkAllGeral('${idCat}', false)" class="text-[10px] font-black text-red-600 hover:underline px-1 py-0.5">Desmarcar</button>
                    </div>
                    <div class="max-h-48 overflow-y-auto scroller space-y-1 pr-1">
                        ${Array.from(window.listasMultiProducao[key]).sort().map(val => `
                            <div class="flex justify-between items-center hover:bg-slate-100 p-1 rounded border border-transparent hover:border-slate-200 group/item transition-colors">
                                <label class="flex items-start gap-2 text-[11px] cursor-pointer font-bold text-slate-700 flex-1">
                                    <input type="checkbox" value="${val}" class="chk-geral-${idCat} mt-0.5" checked onchange="window.aplicarFiltros()">
                                    <span class="whitespace-normal leading-tight">${val}</span>
                                </label>
                                <button onclick="window.checkOnlyGeral('${idCat}', '${val}')" class="hidden group-hover/item:block text-[9px] bg-indigo-100 text-indigo-800 px-1.5 py-0.5 rounded font-black border border-indigo-200 hover:bg-indigo-600 hover:text-white transition-colors">Único</button>
                            </div>
                        `).join('')}

        });
        container.innerHTML = htmlFiltros;
        window.filtrosGeraisIniciados = true;
    }

    function injetarDatasMapa() {
    if (!window.MAPA_SAIDA_CACHE || !window.dadosGlobais) return;
    const mapa = window.MAPA_SAIDA_CACHE;
    
    window.dadosGlobais.forEach(l => {
        if (l._MAPA_INJETADO) return; 

        // 🎯 Lendo pelas colunas informadas BQ (Gráfica) e CK (CD) + Fallbacks de segurança
        const g = String(l["BQ"] || l["GRAFICA_FINAL"] || l["GRÁFICA"] || "N/A").toUpperCase();
        const cd = String(l["CK"] || l["CD_FINAL"] || l["CD DESTINO"] || l["CD"] || "N/A").toUpperCase();
        
        const joinKey = String(l["B"] || l["JOIN_KEY"] || l["Chave"] || "").trim();
        const dtColetaRealPCP = l["DT_ENTREGA_DG"] || null; 

        let dtEntregaReal = "";
        let dtColetaMapa = "";

        if (mapa[joinKey] && mapa[joinKey].length > 0) {
            dtEntregaReal = mapa[joinKey].reduce((max, e) => ((e.dataEntrega && e.dataEntrega > max) ? e.dataEntrega : max), "");
            dtColetaMapa = mapa[joinKey].reduce((max, e) => ((e.dataColeta && e.dataColeta > max) ? e.dataColeta : max), "");
        }
        
        // 🎯 EXCEÇÃO POSIGRAF -> POSIGRAF
        if (g.includes("POSIGRAF") && cd.includes("POSIGRAF")) {
            dtEntregaReal = dtColetaRealPCP;
            dtColetaMapa = dtColetaRealPCP; // Ambas assumem a data da coleta do PCP
        } 
        
        const formatarData = (dt) => {
            if (!dt) return null;
            let str = String(dt).trim();
            if (str.includes('T')) str = str.split('T')[0];
            if (str.includes('/')) { 
                let p = str.split('/'); 
                if (p.length === 3) str = `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`; 
            }
            return str.length >= 10 ? str.substring(0, 10) : null;
        };

        l["_DT_ENTREGUE_CD_REAL"] = formatarData(dtEntregaReal);
        l["_DT_COLETA_MAPA_REAL"] = formatarData(dtColetaMapa);
        
        l._MAPA_INJETADO = true;
    });
}

function aplicarFiltros() {
    const getSelectedGeral = (idCat) => new Set(Array.from(document.querySelectorAll(`.chk-geral-${idCat}:checked`)).map(cb => cb.value));
    let selFilters = {};

            if (dtColetaReal) {
                if (metaISO && dtColetaReal <= metaISO) {
                    marcasData[m].prazo += t; totais.prazo += t;
                } else {
                    marcasData[m].atraso += t; totais.atraso += t;
                }

            let dtBase = extrairDataISO(l[f.colBase]);
            let dtPlan = extrairDataISO(l[cols.plan]);
            
            aderFases[f.id].volPlan += t;
            if (dtBase && dtBase <= hojeISO) aderFases[f.id].baseAtHoje += t;
            if (dtPlan && dtPlan <= hojeISO) aderFases[f.id].planAtHoje += t;
            
            if (dataFoiPreenchida(l, f)) {
                aderFases[f.id].realTotal += tFaseReal;
                if (foiEntregueNoPrazo(l, f, tRef)) aderFases[f.id].noPrazo += tFaseReal;
            }
        });
    });

// 2. Montar KPI D-1
    let pctD1 = efD1.baseVencida > 0 ? (efD1.noPrazo / efD1.baseVencida) * 100 : 0;
    let efPendente = efD1.baseVencida - efD1.noPrazo;
    let baseTotalColeta = totais.prazo + totais.atraso + totais.pendente; // Soma geral da fase Coleta
    
    document.getElementById('giroEfPz').innerText = window.formatarBR(efD1.noPrazo);
    if(document.getElementById('giroEfPend')) document.getElementById('giroEfPend').innerText = window.formatarBR(efPendente);
    document.getElementById('giroEfBase').innerText = window.formatarBR(efD1.baseVencida);
    if(document.getElementById('giroEfTotal')) document.getElementById('giroEfTotal').innerText = window.formatarBR(baseTotalColeta);
    
    let elPct = document.getElementById('giroEfPct');
    elPct.innerText = efD1.baseVencida > 0 ? pctD1.toFixed(1) + "%" : "-";
    
    // Cores Dinâmicas
    if (pctD1 >= 90) elPct.className = "text-5xl font-black text-green-700 transition-colors";
    else if (pctD1 >= 80) elPct.className = "text-5xl font-black text-green-500 transition-colors";
    else if (pctD1 >= 65) elPct.className = "text-5xl font-black text-amber-500 transition-colors";
    else elPct.className = "text-5xl font-black text-red-600 transition-colors";

    // 3. Montar Arrays para Gráficos Superiores
    let labelsM = Object.keys(marcasData).sort();
    labelsM.push('Total geral');
    
    let dTir = [], dPz = [], dAt = [], dPd = [];
    
    labelsM.forEach(m => {
        let valTiragem = m === 'Total geral' ? totais.tiragem : marcasData[m].tiragem;
        let valPrazo = m === 'Total geral' ? totais.prazo : marcasData[m].prazo;
        let valAtraso = m === 'Total geral' ? totais.atraso : marcasData[m].atraso;
        let valPendente = m === 'Total geral' ? totais.pendente : marcasData[m].pendente;
        
        dTir.push(valTiragem);
        let totS = valPrazo + valAtraso + valPendente;
        dPz.push(totS > 0 ? (valPrazo/totS)*100 : 0);
        dPd.push(totS > 0 ? (valPendente/totS)*100 : 0);
        dAt.push(totS > 0 ? (valAtraso/totS)*100 : 0);
    });

    // 4. Desenhar Gráficos
    if (window.chartGiroTir) window.chartGiroTir.destroy();
    if (window.chartGiroSt) window.chartGiroSt.destroy();
    if (window.chartGiroAd) window.chartGiroAd.destroy();

    Chart.defaults.font.family = "sans-serif";
    Chart.defaults.color = "#475569";


const drawLabelPct = {
        id: 'drawLabelPct',
        afterDatasetsDraw(chart) {
            const { ctx, data } = chart;
            const qtdBarras = data.labels.length;
            const fontSize = qtdBarras <= 6 ? 14 : 10;
            
            ctx.font = `bold ${fontSize}px sans-serif`; 
            ctx.textAlign = 'right'; 
            ctx.textBaseline = 'middle';
            
            chart.data.datasets.forEach((dataset, i) => {
                const bg = dataset.backgroundColor;
                const isLight = bg === '#4ade80' || bg === '#fbbf24'; // Finalizado com Atraso ou Pendente
                ctx.fillStyle = isLight ? '#0f172a' : '#ffffff';

                chart.getDatasetMeta(i).data.forEach((bar, index) => {
                    const val = dataset.data[index];
                    if (val > 5) ctx.fillText(val.toFixed(0) + '%', bar.x - 6, bar.y);
                });
            });
        }
    };
    

let ctxTir = document.getElementById('grafGiroTiragem');
    if (ctxTir) {
        // --- NOVO PLUGIN PARA OS RÓTULOS CUSTOMIZADOS (K, mi e %) ---
        const plugRotulosTiragem = {
            id: 'plugRotulosTiragem',
            afterDatasetsDraw(chart) {
                const { ctx, data } = chart;
                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';

                const dataset = data.datasets[0];
                const totalGeralVal = dataset.data[dataset.data.length - 1] || 1;
                const qtdBarras = dataset.data.length;

                // Definindo tamanhos de fonte e espaçamentos dinâmicos
                const fontNumber = qtdBarras <= 6 ? 'bold 13px sans-serif' : 'bold 10px sans-serif';
                const fontPct = qtdBarras <= 6 ? 'bold 11px sans-serif' : 'bold 9px sans-serif'; // Agora em negrito também
                const offsetNum = qtdBarras <= 6 ? 18 : 14;
                const offsetPct = qtdBarras <= 6 ? 5 : 4;

                chart.getDatasetMeta(0).data.forEach((bar, index) => {
                    const val = dataset.data[index];
                    if (!val || val === 0) return;

                    // Função auxiliar local para cortar na 1ª casa decimal sem arredondar
                    const truncar1Casa = (num) => {
                        let match = num.toString().match(/^-?\d+(?:\.\d{0,1})?/);
                        return match ? match[0] : num.toString();
                    };

                    // 1. Regra de Formatação do Número Bruto (K / mi)
                    let numeroFormatado = "";
                    if (val >= 1000000) {
                        numeroFormatado = truncar1Casa(val / 1000000).replace(/\.0$/, '') + 'mi';
                    } else if (val >= 1000) {
                        numeroFormatado = truncar1Casa(val / 1000).replace(/\.0$/, '') + 'k';
                    } else {
                        numeroFormatado = val.toString();
                    }

                    // 2. Regra de Cálculo do Percentual
                    const pct = ((val / totalGeralVal) * 100).toFixed(0) + '%';
                    
                    const textoPct = (index === dataset.data.length - 1) ? "" : `(${pct})`;

                    let x = bar.x;
                    let y = bar.y;

                    // Texto do número
                    ctx.font = fontNumber;
                    ctx.fillStyle = '#475569';
                    ctx.fillText(numeroFormatado, x, y - offsetNum);

                    // Texto do percentual
                    if (textoPct) {
                        ctx.font = fontPct;
                        ctx.fillStyle = '#64748b';
                        ctx.fillText(textoPct, x, y - offsetPct);
                    }
                });
                ctx.restore();
            }
        };

        window.chartGiroTir = new Chart(ctxTir, {
            type: 'bar',
            data: { labels: labelsM, datasets: [{ data: dTir, backgroundColor: '#312e81', borderRadius: 4 }] },
            plugins: [plugRotulosTiragem],
            options: { 
                    maintainAspectRatio: false, 
                    layout: { padding: { top: 40 } }, // Aumentado um pouco para caber a fonte maior sem cortar
                    plugins: { legend: { display: false } }, 
                    scales: { y: { display: false }, x: { grid: { display: false }, ticks: { font: { weight: 'bold', size: labelsM.length <= 6 ? 13 : 9 } } } } 
                }
        });
    }

let ctxSt = document.getElementById('grafGiroStatus');
    if (ctxSt) {
        window.chartGiroSt = new Chart(ctxSt, {
            type: 'bar',
            data: {
                labels: labelsM,
                datasets: [
                    { label: 'Finalizado no Prazo', data: dPz, backgroundColor: '#1e40af', maxBarThickness: 45 },
                    { label: 'Finalizado com Atraso', data: dAt, backgroundColor: '#3b82f6', maxBarThickness: 45 },
                    { label: 'Pendente', data: dPd, backgroundColor: '#93c5fd', maxBarThickness: 45 }
                ]
            },
            plugins: [drawLabelPct],
            options: {
                    indexAxis: 'y', maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.raw.toFixed(1)}%` } } },
                    scales: { x: { stacked: true, max: 100, display: false }, y: { stacked: true, grid: { display: false }, ticks: { font: { weight: 'bold', size: labelsM.length <= 6 ? 14 : 10 } } } }
                }
        });
    }

let ctxAd = document.getElementById('grafGiroAderencia');
    if (ctxAd) {
        let activeFases = FASES.filter(f => aderFases[f.id].volPlan > 0 || aderFases[f.id].baseAtHoje > 0 || aderFases[f.id].planAtHoje > 0 || aderFases[f.id].realTotal > 0);
        let lblsAd = activeFases.map(f => f.nome);
        
        let calcP = (v, t) => t > 0 ? Number(((v / t) * 100).toFixed(1)) : 0;
        let dBase = activeFases.map(f => calcP(aderFases[f.id].baseAtHoje, aderFases[f.id].volPlan));
        let dPlan = activeFases.map(f => calcP(aderFases[f.id].planAtHoje, aderFases[f.id].volPlan));
        let dReal = activeFases.map(f => calcP(aderFases[f.id].realTotal, aderFases[f.id].volPlan));
        let dAder = activeFases.map(f => {
            let esp = tRef === 'baseline' ? aderFases[f.id].baseAtHoje : aderFases[f.id].planAtHoje;
            if (esp === 0) return aderFases[f.id].realTotal > 0 ? 100 : 0;
            let p = (aderFases[f.id].noPrazo / esp) * 100;
            return Number((p > 100 ? 100 : p).toFixed(1));
        });

        // --- PLUGIN BLINDADO PARA RÓTULOS (LINHA E BARRAS) ---
        const plugRotulosAderencia = {
            id: 'plugRotulosAderencia',
            afterDatasetsDraw(chart) {
                try {
                    const { ctx } = chart;
                    ctx.save();
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    
                    chart.data.datasets.forEach((dataset, i) => {
                        const meta = chart.getDatasetMeta(i);
                        if (meta.hidden || !meta.data) return;
                        
                        meta.data.forEach((element, index) => {
                            const val = dataset.data[index];
                            if (!val || val === 0) return; 
                            
                            let text = val + '%';
                            let x = element.x;
                            let y = element.y;
                            
                            if (x === undefined || y === undefined) return;
                            
                            if (dataset.type === 'line' || meta.type === 'line') {
                                ctx.font = 'bold 12px sans-serif';
                                ctx.fillStyle = '#0f172a'; // Cor escura para a linha
                                ctx.fillText(text, x, y - 8);
                            } else {
                                ctx.font = 'bold 10px sans-serif';
                                ctx.fillStyle = '#475569'; // Cor suave para as barras
                                ctx.fillText(text, x, y - 2);
                            }
                        });
                    });
                    ctx.restore();
                } catch (e) {
                    console.error("Erro ignorado no plugin de rótulos:", e);
                }
            }
        };

        window.chartGiroAd = new Chart(ctxAd, {
            type: 'bar',
            data: {
                labels: lblsAd,
                datasets: [
                    { type: 'line', label: 'Aderência (%)', data: dAder, borderColor: '#0f172a', backgroundColor: '#0f172a', borderWidth: 2, tension: 0.3, pointRadius: 4, order: 1 },
                    { type: 'bar', label: 'Baseline', data: dBase, backgroundColor: '#93c5fd', borderRadius: 4, order: 2 },
                    { type: 'bar', label: 'Re-Plan', data: dPlan, backgroundColor: '#3b82f6', borderRadius: 4, order: 3 },
                    { type: 'bar', label: 'Realizado', data: dReal, backgroundColor: '#1e3a8a', borderRadius: 4, order: 4 }
                ]
            },
            plugins: [plugRotulosAderencia],
            options: {
                maintainAspectRatio: false,
                layout: { padding: { top: 25 } }, 
                plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
                scales: { 
                    x: { 
                        grid: { display: false },
                        ticks: { font: { size: 10, weight: 'bold' } }
                    }, 
                    y: { 
                        max: 120, 
                        grid: { display: false, drawBorder: false }, 
                        ticks: { display: false } 
                    } 
                }
            }
        });
        // GATILHO DA TABELA DE ATENÇÃO
if (typeof window.renderizarPontosAtencaoGiro === 'function') {
    window.renderizarPontosAtencaoGiro(dadosFiltrados, tRef);
}
    }

    
};


window.processarFunil = function() {
    let tRef = document.getElementById('filtroReferencia').value;
    let mGrid = {}; let gGrid = {}; let fTotais = {}; 
    
    let elsCb = document.querySelectorAll('.chk-fase-funil:checked');
    let fasesAtivasIds = Array.from(elsCb).map(cb => cb.value);
    if(fasesAtivasIds.length === 0) fasesAtivasIds = FASES.map(f => f.id);
    
    let fasesAtivas = FASES.filter(f => fasesAtivasIds.includes(f.id));
    
    // Novo construtor de Fase com divisão PCP vs ACAB
    const initFase = () => ({ base: 0, real: 0, planAtHoje: 0, pcp: {base: 0, real: 0, planAtHoje: 0}, acab: {base: 0, real: 0, planAtHoje: 0} });
    fasesAtivas.forEach(f => fTotais[f.id] = initFase());
    
    let mapTotal = {}; let seriesGlobais = {}; 

    dadosFiltrados.forEach(l => {
        let tBase = window.arredondar(l["TIRAGEM"] || l["QUANTIDADE"]); if(tBase<=0) return;
        let k = getKey(l); 
        let m = String(l["MARCA_FINAL"] || l["UNIDADE"] || "N/A").toUpperCase(); 
        let g = String(l["GRAFICA_FINAL"] || l["GRÁFICA"] || "N/A").toUpperCase();
        let nomeSerie = String(l["SÉRIE"] || l["Série"] || l["SERIE"] || l["SÉRIES"] || "").trim();
        
        let src = l["_SOURCE"] === "ACABADORA" ? "acab" : "pcp";

        if(!mGrid[m]) { 
            mGrid[m] = { total: 0, pcp: {total:0}, acab: {total:0}, series: {} }; 
            fasesAtivas.forEach(f => mGrid[m][f.id] = initFase()); 
        }
        if(!gGrid[g]) { 
            gGrid[g] = { total: 0, pcp: {total:0}, acab: {total:0}, series: {} }; 
            fasesAtivas.forEach(f => gGrid[g][f.id] = initFase()); 
        }
        
        if(!mapTotal[k]) { 
            mapTotal[k] = tBase; 
            mGrid[m].total += tBase; mGrid[m][src].total += tBase;
            gGrid[g].total += tBase; gGrid[g][src].total += tBase;
        }
        
        if (nomeSerie !== "") {
            if (!seriesGlobais[nomeSerie]) seriesGlobais[nomeSerie] = { base: 0, real: 0, planAtHoje: 0 };
            if (!mGrid[m].series[nomeSerie]) mGrid[m].series[nomeSerie] = { base: 0, real: 0, planAtHoje: 0 };
            if (!gGrid[g].series[nomeSerie]) gGrid[g].series[nomeSerie] = { base: 0, real: 0, planAtHoje: 0 };
        }

        fasesAtivas.forEach(f => {
            let passaFase = belongsToPhase(l, f.id);
            if (f.id === 'col_mapa') passaFase = true; 

            if(passaFase) {
                let tFaseReal = window.getVolFase(l, f, tBase);
                if (f.id === 'col_mapa' || f.id === 'col_tp' || f.id === 'ent_tp') {
                    tFaseReal = window.arredondar(l["VOLUME_AZ"] || l["TIRAGEM COLETADA"] || l["COLETADA_MAPA"] || 0);
                }

                fTotais[f.id].base += tBase; 
                mGrid[m][f.id].base += tBase; 
                gGrid[g][f.id].base += tBase;

                fTotais[f.id][src].base += tBase; 
                mGrid[m][f.id][src].base += tBase; 
                gGrid[g][f.id][src].base += tBase;
                
                let isReal = dataFoiPreenchida(l, f) || (tFaseReal > 0 && (f.id === 'col_mapa' || f.id === 'ent_cd'));
                
                // TRAVA RESTRITA: COLETA TP (DZ) e ENTREGA TP (EA)
                if (f.id === 'col_tp') isReal = (l["DATA_DZ"] && String(l["DATA_DZ"]).trim() !== "");
                if (f.id === 'ent_tp') isReal = (l["DATA_EA"] && String(l["DATA_EA"]).trim() !== "");

                if(isReal || (f.id === 'col_mapa' && tFaseReal > 0)) { 
                    fTotais[f.id].real += tFaseReal; 
                    mGrid[m][f.id].real += tFaseReal; 
                    gGrid[g][f.id].real += tFaseReal; 

                    fTotais[f.id][src].real += tFaseReal; 
                    mGrid[m][f.id][src].real += tFaseReal; 
                    gGrid[g][f.id][src].real += tFaseReal; 
                }

                let cols = getCols(f, tRef);
                let dtP = extrairDataISO(l[cols.plan]);
                let diasAtrasoFunil = dtP ? calcDiffDiasISO(dtP, dtHojeISO) : 0;
                let isMetaVencida = (dtP && diasAtrasoFunil >= 3);
                
                if (isMetaVencida) {
                    fTotais[f.id].planAtHoje += tBase;
                    mGrid[m][f.id].planAtHoje += tBase;
                    gGrid[g][f.id].planAtHoje += tBase;

                    fTotais[f.id][src].planAtHoje += tBase;
                    mGrid[m][f.id][src].planAtHoje += tBase;
                    gGrid[g][f.id][src].planAtHoje += tBase;
                }
                
                if (f.id === 'col' && nomeSerie !== "") {
                    seriesGlobais[nomeSerie].base += tBase;
                    mGrid[m].series[nomeSerie].base += tBase;
                    gGrid[g].series[nomeSerie].base += tBase;
                    if (isReal) { 
                        seriesGlobais[nomeSerie].real += tFaseReal; 
                        mGrid[m].series[nomeSerie].real += tFaseReal; 
                        gGrid[g].series[nomeSerie].real += tFaseReal; 
                    }
                    if (isMetaVencida) {
                        seriesGlobais[nomeSerie].planAtHoje += tBase;
                        mGrid[m].series[nomeSerie].planAtHoje += tBase;
                        gGrid[g].series[nomeSerie].planAtHoje += tBase;
                    }
                }
            }
        });
    });
    
    let calcSeries = (seriesObj) => {
        let tot = 0; let fin = 0; let atrasadas = 0;
        Object.values(seriesObj).forEach(s => {
            if (s.base > 0) {
                tot++;
                if (s.real >= s.base) { fin++; } else if (s.real < s.planAtHoje) { atrasadas++; }
            }
        });
        return { total: tot, finalizadas: fin, atrasadas: atrasadas };
    };
    
    let seriesGeral = calcSeries(seriesGlobais);
    let tGeral = Object.values(mapTotal).reduce((a,b)=>a+b, 0);
    
    let hFunil = `<div class="funnel-layer bg-black w-full shadow-lg rounded-t-md text-white text-center py-1">00 - Total Base (${window.formatarBR(tGeral)} | 100%)</div>`;
    
    fasesAtivas.forEach((f, index) => {
        let tReal = fTotais[f.id].real; let tBase = fTotais[f.id].base;
        let pct = tBase > 0 ? (tReal / tBase) * 100 : 0;
        let tPct = pct.toFixed(1); if (tPct === "100.0" && tReal < tBase) tPct = "99.9"; 
        
        let widthCss = Math.min(Math.max(pct, 15), 100);
        hFunil += `<div class="funnel-layer text-center text-white py-1" style="width: ${widthCss}%; background-color: ${f.corLinha};">0${index+1} - ${f.nome} (${tPct}%)</div>`;
    });
    
    let pctSeriesGlobais = seriesGeral.total > 0 ? (seriesGeral.finalizadas / seriesGeral.total) * 100 : 0;
    hFunil += `<div class="funnel-layer text-center text-white py-1 rounded-b-md bg-indigo-900 mt-0.5" style="width: ${Math.max(pctSeriesGlobais, 15)}%;">🌟 Séries 100% Finalizadas (${seriesGeral.finalizadas}/${seriesGeral.total} | ${pctSeriesGlobais.toFixed(1)}%)</div>`;
    
    document.getElementById('containerFunilVisual').innerHTML = hFunil;
    
    const geraTh = (arrIds) => { 
        let h = `<th class="p-2 border-r border-slate-300 sticky left-0 bg-slate-100 z-10 shadow-[1px_0_0_#cbd5e1]">Indicador</th>`; 
        arrIds.forEach(id => h+=`<th class="p-2 border-r border-slate-300 text-center min-w-[90px]">${id}</th>`); 
        return h + `<th class="p-2 text-center font-black bg-slate-200">Total Geral</th>`; 
    };

    const getCorComparativo = (realPct, planPct, hasMeta = true) => {
        if (!hasMeta) {
            if (realPct === 0) return 'bg-slate-50 text-slate-400 border border-slate-200';
            if (realPct >= 100) return 'bg-emerald-50 text-emerald-700 border border-emerald-200';
            return 'bg-blue-50 text-blue-700 border border-blue-200';
        }
        if (planPct === 0 && realPct === 0) return 'bg-slate-50 text-slate-400 border border-slate-200'; 
        if (realPct >= 100) return 'bg-emerald-50 text-emerald-700 border border-emerald-200'; 
        if (realPct >= planPct) return 'bg-blue-50 text-blue-700 border border-blue-200'; 
        return 'bg-rose-50 text-rose-700 border border-rose-200'; 
    };
    
    // Função para montar o bloco split (Gráfica vs Acabadora) blindada contra NaN
    const buildCellBox = (vR, vB, vP, title, totalDivisor, hasMeta) => {
        if (!vB || vB === 0) return "";
        if (!totalDivisor || totalDivisor === 0) totalDivisor = vB; 
        
        let pctR = totalDivisor > 0 ? Math.round((vR/totalDivisor)*100) : 0; 
        if(pctR === 100 && vR < totalDivisor) pctR = 99;
        if(isNaN(pctR)) pctR = 0; // Se der ruim na matemática, vira 0

        let pctP = totalDivisor > 0 ? Math.round((vP/totalDivisor)*100) : 0; 
        if(pctP === 100 && vP < totalDivisor) pctP = 99;
        if(isNaN(pctP)) pctP = 0; // Se der ruim na matemática, vira 0

        let corCaixa = getCorComparativo(pctR, pctP, hasMeta);
        
        let planHtml = hasMeta ? `<span class="text-[7px] opacity-75 font-bold tracking-tight uppercase">Plan: ${pctP}%</span>` : ``;
        
        return `<div class="flex-1 flex flex-col items-center justify-center p-1 rounded shadow-sm ${corCaixa} w-full min-w-[60px]">
                    <span class="text-[7px] font-bold text-slate-500 uppercase leading-none mb-0.5">${title}</span>
                    <span class="font-black text-[12px] leading-none mb-0.5">${pctR}%</span>
                    ${planHtml}
                </div>`;
    };

    const geraBody = (arrIds, gridObj, isPct) => {
        let h = `<tr class="border-b border-slate-200 hover:bg-slate-50"><td class="p-2 border-r border-slate-200 font-bold sticky left-0 bg-white shadow-[1px_0_0_#e2e8f0]">00 - Tiragem Total</td>`;
        let sumTotRow = 0; 
        arrIds.forEach(id => { 
            sumTotRow += gridObj[id].total; 
            h += `<td class="p-2 border-r border-slate-200 text-center font-semibold">${window.formatarBR(gridObj[id].total)}</td>`; 
        });
        h += `<td class="p-2 text-center font-black bg-slate-50">${window.formatarBR(sumTotRow)}</td></tr>`;
        
        fasesAtivas.forEach((f, idx) => {
            let label = idx + 1 < 10 ? `0${idx+1}` : `${idx+1}`;
            h += `<tr class="border-b border-slate-200 hover:bg-slate-50"><td class="p-2 border-r border-slate-200 font-semibold sticky left-0 bg-white shadow-[1px_0_0_#e2e8f0]">${label} - ${f.nome}</td>`;
            
            let hasMeta = (f.colPlan !== null); 
            
            arrIds.forEach(id => {
                let cellData = gridObj[id][f.id];
                let valB = cellData.base;
                
                if (valB === 0) {
                    h += `<td class="p-2 border-r border-slate-200 text-center text-slate-300 bg-white">-</td>`;
                } else {
                    if (isPct) {

            }
        });
        
        let idSerieFase = String(fasesAtivas.length + 1).padStart(2, '0');
        h += `<tr class="border-b border-indigo-200 hover:bg-indigo-50 bg-indigo-50/30">
                <td class="p-2 border-r border-indigo-200 font-bold text-indigo-900 sticky left-0 bg-indigo-50 shadow-[1px_0_0_#c7d2fe]">${idSerieFase} - Séries Finalizadas</td>`;
        
        arrIds.forEach(id => {

            if (sData.total === 0) {
                h += `<td class="p-2 border-r border-indigo-200 text-center text-slate-400">-</td>`;

                    let cor = 'text-blue-700 bg-blue-50 border border-blue-200'; 
                    if (pct === 100) cor = 'text-emerald-700 bg-emerald-50 border border-emerald-200'; 
                    else if (sData.atrasadas > 0) cor = 'text-rose-700 bg-rose-50 border border-rose-200';

                } else {
                    h += `<td class="p-2 border-r border-indigo-200 text-center text-indigo-900 font-bold">${sData.finalizadas} <span class="text-indigo-400 text-[10px] font-normal">/ ${sData.total}</span></td>`;

            }
        });
        
        if (seriesGeral.total === 0) {
            h += `<td class="p-2 text-center text-slate-400 font-black bg-indigo-100/50">-</td></tr>`;
        } else {
            if (isPct) {
                let pctG = Math.round((seriesGeral.finalizadas / seriesGeral.total) * 100);
                let corG = 'text-blue-700 bg-blue-50 border border-blue-200'; 
                if (pctG === 100) corG = 'text-emerald-700 bg-emerald-50 border border-emerald-200'; 
                else if (seriesGeral.atrasadas > 0) corG = 'text-rose-700 bg-rose-50 border border-rose-200'; 
                
                h += `<td class="p-2 text-center font-black bg-indigo-100/50"><div class="inline-block px-2 py-1 rounded shadow-sm font-black text-[11px] ${corG}">${pctG}%</div></td></tr>`;
            } else {
                h += `<td class="p-2 text-center font-black bg-indigo-100/50 text-indigo-900">${seriesGeral.finalizadas} <span class="text-indigo-500 text-[10px] font-normal">/ ${seriesGeral.total}</span></td></tr>`;
            }
        }
        return h;
    };

};

    function renderCurvaAcumulada() {
        let elsCb = document.querySelectorAll('.chk-fase-curva:checked');
        let cbFases = elsCb.length > 0 ? Array.from(elsCb).map(cb => cb.value) : ['imp', 'col']; 
        let tRef = document.getElementById('filtroReferencia').value;
        let hojeISO = dtHojeISO; // Usa a variável global do Index
        let unifiedDates = new Set(); let dataSeries = {}; 
        cbFases.forEach(fId => { dataSeries[fId] = { plan: {}, real: {}, total: 0 }; });

        dadosFiltrados.forEach(l => {
            let tBase = window.arredondar(l["TIRAGEM"] || l["QUANTIDADE"]); if(tBase <= 0) return;
            
            cbFases.forEach(fId => {
                if (!belongsToPhase(l, fId)) return;
                
                let fObj = FASES.find(f => f.id === fId); 
                
                // 🎯 EXTRAÇÃO BLINDADA DO VOLUME DA FASE
                let tFaseReal = tBase;
                if (fObj.colVol) {
                    let val = l[fObj.colVol];
                    if (val === undefined || val === null || val === "") val = l[fObj.colVol.replace(/_/g, ' ')];
                    if (val === undefined || val === null || val === "") val = window.getVSafe(l, fObj.colVol.replace(/_/g, ' '));
                    tFaseReal = window.arredondar(val || 0);
                }

                dataSeries[fId].total += tBase; 
                
                let cols = getCols(fObj, tRef);
                let dtP = extrairDataISO(l[cols.plan]); 
                let dtR = extrairDataISO(l[cols.real]) || (cols.realAlt ? extrairDataISO(l[cols.realAlt]) : null);
                
                // 🎯 SE NÃO TEM DATA REAL, MAS TEM VOLUME EXTRAÍDO (MAPA), COLOCAMOS HOJE COMO DATA REAL PARA APARECER NA CURVA
                if (!dtR && fObj.colVol && tFaseReal > 0) {
                    dtR = dtHojeISO; // Força a data de hoje para a curva S desenhar o que foi preenchido de volume
                }

                if(dtP) { dataSeries[fId].plan[dtP] = (dataSeries[fId].plan[dtP] || 0) + tBase; unifiedDates.add(dtP); }
                if(dtR) { dataSeries[fId].real[dtR] = (dataSeries[fId].real[dtR] || 0) + tFaseReal; unifiedDates.add(dtR); }
            });
        });

        let dtOrd = Array.from(unifiedDates).sort();
        let cvS = document.getElementById('graficoCurvaS');
        if(!cvS) return;
        if(dtOrd.length === 0) { if(graficos.curvaS) graficos.curvaS.destroy(); return; }

        let lbs = dtOrd.map(d => { let p = d.split('-'); return `${p[2]}/${p[1]}`; });
        let datasets = [];

        cbFases.forEach(fId => {
            let fObj = FASES.find(f => f.id === fId);
            let sP = 0, sR = 0, aP = [], aR = []; 
            let tFase = dataSeries[fId].total;

            dtOrd.forEach(d => {
                sP += (dataSeries[fId].plan[d] || 0); 
                sR += (dataSeries[fId].real[d] || 0);
                
                let ptP = tFase > 0 ? ((sP/tFase)*100).toFixed(1) : "0.0"; 
                if(ptP === "100.0" && sP < tFase) ptP = "99.9"; 
                aP.push(ptP);

                if (d <= hojeISO) {
                    let ptR = tFase > 0 ? ((sR/tFase)*100).toFixed(1) : "0.0"; 
                    if(ptR === "100.0" && sR < tFase) ptR = "99.9"; 
                    aR.push(ptR);
                } else {
                    aR.push(null);
                }
            });

            datasets.push({ label: `[Plan] ${fObj.nome}`, data: aP, borderColor: fObj.corLinha, backgroundColor: 'transparent', borderDash: [5, 5], borderWidth: 2, pointRadius: 0, tension: 0.3 });
            datasets.push({ label: `[Real] ${fObj.nome}`, data: aR, borderColor: fObj.corLinha, backgroundColor: 'transparent', borderWidth: 3, pointRadius: 1, tension: 0.3, spanGaps: false });
        });

        if(graficos.curvaS) graficos.curvaS.destroy();
        graficos.curvaS = new Chart(cvS, { type: 'line', data: { labels: lbs, datasets: datasets }, options: { maintainAspectRatio: false, scales: { y: { min: 0, max: 105 } }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } }, tooltip: { mode: 'index', intersect: false, callbacks: { label: function(c) { if (c.raw === null) return null; return c.dataset.label + ': ' + c.parsed.y + '%'; } } } }, interaction: { mode: 'nearest', axis: 'x', intersect: false } } });
    }

    function processarMatriz() {
        let tRef = document.getElementById('filtroReferencia').value;
        let filtroFaseGargalo = document.getElementById('selFaseMatriz') ? document.getElementById('selFaseMatriz').value : 'TODOS';
        let dts = {}; let tGeral = 0; let tGeralSku = 0;
        const TOLERANCIA_FIXA = 3; 
        
        // Fases consideradas "Editoriais" (antes de iniciar a impressão propriamente dita)
        const fasesEditoriaisIds = ['env', 'rec', 'apv'];
        
        let somasFase = {}; FASES.forEach(f => somasFase[f.id] = { okV:0, okS:0, warnV:0, warnS:0, critV:0, critS:0, ndV:0, ndS:0, iniV:0, iniS:0 });
        let listaCriticos = [];
        
        dadosFiltrados.forEach(l => {
            let t = window.arredondar(l["TIRAGEM"] || l["QUANTIDADE"]); 
            if (t <= 0) return;
            
            let g = l["GRÁFICA"] || "N/A"; 
            let m = l["UNIDADE"] || "N/A"; 
            let cd = l["CD DESTINO"] || l["CD"] || "N/A"; 
            let cv = g + "|" + m;

            if(!dts[cv]) { 
                dts[cv] = { grafica: g, marca: m, total: 0, totalSku: 0 };
                FASES.forEach(f => dts[cv][f.id] = { okV:0, okS:0, warnV:0, warnS:0, critV:0, critS:0, ndV:0, ndS:0, iniV:0, iniS:0 });
            }
            
            // 1. DESCOBRE ONDE O ITEM ESTÁ TRAVADO (SEM PULAR FASE)
            let wipFase = null; let wipIndex = -1;
            for(let i = 0; i < FASES.length; i++) {
                let f = FASES[i];
                if(belongsToPhase(l, f.id) && !dataFoiPreenchida(l, f)) { wipFase = f; wipIndex = i; break; } 
            }
            
            if(!wipFase) return; 
            if (filtroFaseGargalo !== 'TODOS' && wipFase.id !== filtroFaseGargalo) return;
            
            dts[cv].total += t; dts[cv].totalSku += 1; tGeral += t; tGeralSku += 1;
            let diasAtraso = calcAtraso(l, wipFase, tRef, dtHoje);
            
            // 2. LÓGICA DO IMPACTO PREVISTO (Próxima Fase ou Início da Impressão)
            let nomeFaseImpacto = "-";
            let dataFaseImpacto = "-";

            if (fasesEditoriaisIds.includes(wipFase.id)) {
                // Se é editorial, o impacto é na Impressão
                let faseImp = FASES.find(f => f.id === 'imp');
                if (faseImp) {
                    nomeFaseImpacto = "Início Impressão";
                    let dtIsoImp = extrairDataISO(l[getCols(faseImp, tRef).plan]);
                    dataFaseImpacto = dtIsoImp ? formatarDataBR(dtIsoImp) : "S/ Data";
                }
            } else {
                // Se já passou do editorial, o impacto é na próxima fase natural
                let nextFase = null;
                for (let k = wipIndex + 1; k < FASES.length; k++) {
                    if (belongsToPhase(l, FASES[k].id)) {
                        nextFase = FASES[k];
                        break;
                    }
                }
                if (nextFase) {
                    nomeFaseImpacto = nextFase.nome;
                    let dtIsoNext = extrairDataISO(l[getCols(nextFase, tRef).plan]);
                    dataFaseImpacto = dtIsoNext ? formatarDataBR(dtIsoNext) : "S/ Data";
                }
            }

            // 3. CÁLCULO DE STATUS (Atraso vs Tolerância)
            let cor = 'preto';
            let statusTexto = "No Prazo";
            
            if(diasAtraso === null) {
              cor = 'laranja'; statusTexto = "S/ Data";
            } else if(diasAtraso <= 0) {
              let colIniPlan = null;
              if (wipFase.id === 'imp') colIniPlan = 'Impressão Inicio (re) plan';
              else if (wipFase.id === 'acab') colIniPlan = 'Acbto Inicio (re) plan';
              else if (wipFase.id === 'kit') colIniPlan = 'Formação de kit/Encaixotamento início (re) plan';
              else if (wipFase.id === 'col' || wipFase.id === 'col_mapa' || wipFase.id === 'tra') colIniPlan = 'Coleta/Internalização de estoque inicial (re) plan';
              
              let atrasoInicio = false;
              if (colIniPlan) {
                  let dtIniPlan = extrairDataISO(l[colIniPlan]);
                  if (dtIniPlan) {
                      let pts = dtIniPlan.split('-');
                      let diffIni = Math.floor((dtHoje.getTime() - new Date(pts[0], pts[1]-1, pts[2]).getTime()) / 86400000);
                      let colIniRealVal = wipFase.colIniReal ? extrairDataISO(l[wipFase.colIniReal]) : null;
                      if (diffIni > 0 && !colIniRealVal) atrasoInicio = true;
                  }
              }
              
              if (atrasoInicio) {
                  cor = 'roxo'; statusTexto = "Início de fase";
              } else {
                  cor = 'preto'; statusTexto = "No Prazo";
              }
            } else {
                let gapBuffer = null;
                for (let k = wipIndex + 1; k < FASES.length; k++) {
                    let proxFase = FASES[k];
                    if (belongsToPhase(l, proxFase.id)) {
                        let colsAtual = getCols(wipFase, tRef); 
                        let colsProx = getCols(proxFase, tRef);
                        let dtPlanAtual = extrairDataISO(l[colsAtual.plan]); 
                        let dtPlanProx = extrairDataISO(l[colsProx.plan]);
                        if (dtPlanAtual && dtPlanProx) {
                            gapBuffer = calcDiffDiasISO(dtPlanAtual, dtPlanProx);
                        }
                        break; 
                    }
                }
                
                if (gapBuffer !== null) { 
                    if (diasAtraso >= gapBuffer) { cor = 'vermelho'; statusTexto = "Impacta Próx. Fase"; }
                    else { cor = 'amarelo'; statusTexto = "Atraso"; }
                } else { 
                    if (diasAtraso > TOLERANCIA_FIXA) { cor = 'vermelho'; statusTexto = "Impacta Próx. Fase"; }
                    else { cor = 'amarelo'; statusTexto = "Atraso"; }
                }
            }
            
            // Incrementa os contadores da matriz
            if(cor === 'preto') { dts[cv][wipFase.id].okV += t; dts[cv][wipFase.id].okS += 1; somasFase[wipFase.id].okV += t; somasFase[wipFase.id].okS += 1; }
            else if (cor === 'amarelo') { dts[cv][wipFase.id].warnV += t; dts[cv][wipFase.id].warnS += 1; somasFase[wipFase.id].warnV += t; somasFase[wipFase.id].warnS += 1; }
            else if (cor === 'laranja') { dts[cv][wipFase.id].ndV += t; dts[cv][wipFase.id].ndS += 1; somasFase[wipFase.id].ndV += t; somasFase[wipFase.id].ndS += 1; }
            else if (cor === 'roxo') { dts[cv][wipFase.id].iniV += t; dts[cv][wipFase.id].iniS += 1; somasFase[wipFase.id].iniV += t; somasFase[wipFase.id].iniS += 1; }
            else { dts[cv][wipFase.id].critV += t; dts[cv][wipFase.id].critS += 1; somasFase[wipFase.id].critV += t; somasFase[wipFase.id].critS += 1; }

            listaCriticos.push({ 
                grafica: g, marca: m, cd: cd, 
                op: l["OP"]||"-", sku: l["SKU"]||"-", 
                desc: l["DESC_REAL"] || l["DESCRIÇÃO"] || "-", 
                fase: wipFase.nome, dias: diasAtraso, tiragem: t,
                status: statusTexto, corStatus: cor,
                nomeFaseImpacto: nomeFaseImpacto,
                dataFaseImpacto: dataFaseImpacto
            });
        });

        // Montagem HTML da Matriz
        let hH = `<th class="p-2 border-r border-slate-200 sticky left-0 bg-slate-100 z-10 shadow-[1px_0_0_#cbd5e1]">Gráfica</th><th class="p-2 border-r border-slate-200">Marca</th><th class="p-2 border-r border-slate-200 text-right bg-slate-200 text-slate-800 font-bold">Total WIP</th>`;
        FASES.forEach(f => hH += `<th class="p-2 text-center border-r border-slate-200 min-w-[100px]">${f.nome}</th>`);
        document.getElementById('tbTabelonaCabecalho').innerHTML = hH;
        let arr = Object.values(dts).sort(sortGMarca); let hB = "";
        
        const hC = (d) => {
        if(d.okS === 0 && d.warnS === 0 && d.critS === 0 && d.ndS === 0 && d.iniS === 0) return `<td class="p-2 border-b text-center border-r border-slate-200 text-slate-300">-</td>`;
        let html = `<td class="p-2 border-b text-right border-r border-slate-200 align-top">`;
        if(d.critS > 0) html += `<div class="text-red-600 font-bold tracking-tight text-[10px] mb-1 border-b border-red-100 pb-0.5">🔴 ${window.formatarBR(d.critV)} <span class="text-[8px] opacity-70 block leading-none uppercase">${window.formatarBR(d.critS)} skus</span></div>`;
        if(d.ndS > 0) html += `<div class="text-orange-500 font-bold tracking-tight text-[10px] mb-1 border-b border-orange-50 pb-0.5">🟠 ${window.formatarBR(d.ndV)} <span class="text-[8px] opacity-70 block leading-none uppercase">${window.formatarBR(d.ndS)} skus</span></div>`;
        if(d.warnS > 0) html += `<div class="text-amber-500 font-bold tracking-tight text-[10px] mb-1 border-b border-amber-50 pb-0.5">🟡 ${window.formatarBR(d.warnV)} <span class="text-[8px] opacity-70 block leading-none uppercase">${window.formatarBR(d.warnS)} skus</span></div>`;
        if(d.iniS > 0) html += `<div class="text-purple-600 font-bold tracking-tight text-[10px] mb-1 border-b border-purple-100 pb-0.5">🟣 ${window.formatarBR(d.iniV)} <span class="text-[8px] opacity-70 block leading-none uppercase">${window.formatarBR(d.iniS)} skus</span></div>`;
        if(d.okS > 0) html += `<div class="text-slate-600 font-bold tracking-tight text-[10px]">⚫ ${window.formatarBR(d.okV)} <span class="text-[8px] text-slate-400 block leading-none uppercase">${window.formatarBR(d.okS)} skus</span></div>`;
        return html + `</td>`;
        };

        arr.forEach(d => {
            if (d.total === 0 && d.totalSku === 0) return;
            hB += `<tr class="hover:bg-slate-50 border-b border-slate-100"><td class="p-2 font-semibold border-r border-slate-200 sticky left-0 bg-white shadow-[1px_0_0_#e2e8f0] text-xs">${d.grafica}</td><td class="p-2 border-r border-slate-200 text-xs">${d.marca}</td><td class="p-2 border-r border-slate-200 text-right bg-slate-50 font-black text-indigo-700 text-xs leading-tight">${window.formatarBR(d.total)}<span class="block text-[9px] text-indigo-400 font-semibold uppercase">${window.formatarBR(d.totalSku)} skus</span></td>`;
            FASES.forEach(f => hB += hC(d[f.id])); hB += `</tr>`;
        });
        
        let msgVazia = filtroFaseGargalo === 'TODOS' ? "Nenhum dado WIP encontrado." : `Nenhum WIP encontrado na fase: ${filtroFaseGargalo}.`;
        document.getElementById('tbTabelona').innerHTML = hB || `<tr><td colspan="12" class="p-4 text-center text-slate-500">${msgVazia}</td></tr>`;
        
        let hF = `<tr class="bg-slate-800 text-white font-bold text-[10px]"><td colspan="2" class="p-2 border-r border-slate-700 text-right sticky left-0 bg-slate-800 shadow-[1px_0_0_#334155]">TOTAL GERAL</td><td class="p-2 border-r border-slate-700 text-right text-emerald-400 font-black text-sm leading-tight">${window.formatarBR(tGeral)}<span class="block text-[9px] text-emerald-600 font-normal uppercase">${window.formatarBR(tGeralSku)} skus</span></td>`;
        FASES.forEach(f => {
            let d = somasFase[f.id];
            let cell = `<td class="p-2 border-r border-slate-700 text-right align-top">`;
            if(d.critS > 0) cell += `<div class="text-red-400 mb-1">🔴 ${window.formatarBR(d.critV)}</div>`;

function processarMetaCD() {
        let tRef = document.getElementById('filtroReferencia').value;
        
        // Ler Filtros
        let tipoMeta = document.getElementById('filtroTipoMeta')?.value || "ARMAZEM";
        let fRisco = document.getElementById('filtroRiscoNivel')?.value || "";
        let fFase = document.getElementById('filtroRiscoFase')?.value || "";
        let busca = (document.getElementById('buscaRiscoSku')?.value || "").trim().toLowerCase();
        
        let kpis = { estourado: { sku: 0, tir: 0 }, projetado: { sku: 0, tir: 0 }, operacional: { sku: 0, tir: 0 } };
        let lsEstourados = [], lsProjetados = [], lsOperacional = [];
        window.dadosMetaCSV = []; 
        
        let mapMarca = {}; let mapGrafica = {};
        let fasesUnicas = new Set();

        let lblHeaderMeta = tipoMeta === "ARMAZEM" ? "Meta Armazém" : "Meta PG";

        dadosFiltrados.forEach(l => {
            let t = window.arredondar(l["TIRAGEM"] || l["QUANTIDADE"]); 
            if (t <= 0) return;
            
            let fCol = FASES.find(f => f.id === 'col'); 
            if (dataFoiPreenchida(l, fCol)) return;
            
            let isAcabadora = (l.BASE === "PCP_ACABADORAS" || l._base === "PCP_ACABADORAS" || l["BASE"] === "PCP_ACABADORAS");
            
            let metaStr = "";
            if (tipoMeta === "ARMAZEM") {
                metaStr = isAcabadora ? (l[7] || l["META ARMAZÉM"]) : (l[46] || l["META DE ENTREGA NO CD"]);
            } else {
                metaStr = isAcabadora ? (l[49] || l["DATA LIMITE DE COLETA"]) : (l[90] || l["DATA LIMITE DE COLETA"]);
            }

            let metaISO = extrairDataISO(metaStr);
            if (!metaISO) return; 

            // Extrair Gráfica e CD
            let g = l["GRÁFICA"]||"N/A"; 
            let m = l["UNIDADE"]||"N/A"; 
            let cd = l["CD DESTINO"]||l[9]||"N/A";
            let sku = l["SKU"]||"-"; 
            let op = l["OP"]||"-"; 
            let desc = l[39] || l["DESCRIÇÃO"] || "-";

            let cdUpper = cd.toUpperCase();
            let isCdFelkAthos = cdUpper.includes("FELK") || cdUpper.includes("ATHOS");
            
            let gUpper = g.toUpperCase();
            let isGrafFelkAthos = gUpper.includes("FELK") || gUpper.includes("ATHOS");

            // ESTEIRA DE FASES (BLINDADA CONTRA ABREVIAÇÕES)
            let fasesDaLinha = FASES.filter(f => {
                let fNome = f.nome.toLowerCase();
                let isTransf = fNome.includes("transf");
                // Agora ele pega "receb", "rec.", ou "rec acab"
                let isReceb = fNome.includes("receb") || fNome.includes("rec. ") || (fNome.includes("rec") && fNome.includes("acab"));
                
                if (isTransf && !isCdFelkAthos) return false;
                if (isReceb && !isGrafFelkAthos) return false;
                return true;
            });

            // Onde travou? 
            let fAtual = fasesDaLinha.find(f => belongsToPhase(l, f.id) && !dataFoiPreenchida(l, f));
            if (!fAtual) return;

            let atrFase = calcAtraso(l, fAtual, tRef, dtHoje); 
            let dMeta = calcDiffDiasISO(dtHojeISO, metaISO);
            let estourou = (dMeta < 0);
            
            if (estourou || atrFase > 0) {
                fasesUnicas.add(fAtual.nome);
                
                let dtPlanAtual = extrairDataISO(l[getCols(fAtual, tRef).plan]);
                let idxFase = fasesDaLinha.indexOf(fAtual);
                let nextFase = (idxFase >= 0 && idxFase < fasesDaLinha.length - 1) ? fasesDaLinha[idxFase + 1] : null;
                let nmNextFase = nextFase ? nextFase.nome : "-";
                let dtPlanNext = nextFase ? extrairDataISO(l[getCols(nextFase, tRef).plan]) : null;
                
                let impactaNext = false;
                if (dtPlanNext && dtHojeISO > dtPlanNext) impactaNext = true;

                let dtColetaPlan = extrairDataISO(l[getCols(fCol, tRef).plan]);
                let dtProjColeta = null;

window.processarOTIF = function() {
        let tTotal = 0, tEntregue = 0, tDentroMeta = 0, tForaMeta = 0, tPendForaMeta = 0;
        let otGrid = {}; let ifGrid = {}; 
        
        let ifCols = [ 
            {id: 'c05', label: '05 - Total Inspecionado', prefixo: '05 - Total Inspecionado'}, 
            {id: 'c051', label: '05.1 - Total Inspecionado Entregue', prefixo: '05.1 - Total Inspecionado Entregue'}, 
            {id: 'c052', label: '05.2 - Total Inspecionado Pendente Entrega', prefixo: '05.2 - Total Inspecionado Pendente Entrega'}, 
            {id: 'c06', label: '06 - Total Inspecionado (-) Reprovado Dentro Meta', prefixo: '06 - Total Inspecionado (-) Reprovado'}, 
            {id: 'c07', label: '07 - INDICADOR 2 - Capacidade de Recebimento', prefixo: '07 - INDICADOR 2'}, 
            {id: 'c09', label: '09 - INDICADOR 5 - Qualidade Aprovada Dentro da Meta', prefixo: '09 - INDICADOR 5 - Qualidade Aprovada Dentro'}, 
            {id: 'c10', label: '10 - INDICADOR 5 - Qualidade Aprovada Fora da Meta', prefixo: '10 - INDICADOR 5 - Qualidade Aprovada Fora'}, 
            {id: 'c11', label: '11 - INDICADOR 5 - Qualidade Reprovada Dentro da Meta', prefixo: '11 - INDICADOR 5 - Qualidade Reprovada Dentro'}, 
            {id: 'c12', label: '12 - INDICADOR 5 - Qualidade Reprovada Fora da Meta', prefixo: '12 - INDICADOR 5 - Qualidade Reprovada Fora'}, 
            {id: 'c13', label: '13 - Saldo Pendente Inspeção', prefixo: '13 - Saldo Pendente Inspeção'} 
        ];

        // MARCAS OFICIAIS COM CONTROLE DE IF (IN FULL)
        const marcasComIF = ["COC", "SAE", "SAS"];

        dadosFiltrados.forEach(l => {
            // O AJUSTE DE OURO AQUI: Lê igual ao Funil (sem usar o TIRAGEM TOTAL)
            let v00 = window.arredondar(l["TIRAGEM"] || l["QUANTIDADE"]); 
            if (v00 <= 0) return;
            
            let v01 = window.arredondar(l["TIRAGEM CONFIRMADA CD"]); 
            let v02 = window.arredondar(l["TIRAGEM CONFIRMADA DENTRO DA META"]); 
            let v03 = window.arredondar(l["TIRAGEM CONFIRMADA FORA DA META"]); 
            let v04 = window.arredondar(l["PENDENTE ENTREGA FORA DA META"]);
            
            if (v04 < 0) v04 = 0;
            
            let m = l["UNIDADE"] ? String(l["UNIDADE"]).trim().toUpperCase() : "N/A";
            
            if(!otGrid[m]) otGrid[m] = { v00:0, v01:0, v02:0, v03:0, v04:0 };
            if(!ifGrid[m]) { ifGrid[m] = {}; ifCols.forEach(c => ifGrid[m][c.id] = 0); }

            // Soma linha a linha perfeitamente
            tTotal += v00;
            otGrid[m].v00 += v00;
            
            ifCols.forEach(c => { 
                let chaveReal = Object.keys(l).find(key => key.startsWith(c.prefixo) || key.includes(c.prefixo));
                if(chaveReal) {
                    ifGrid[m][c.id] += window.arredondar(l[chaveReal]);
                }
            });

            tEntregue += v01; 
            tDentroMeta += v02; 
            tForaMeta += v03; 
            tPendForaMeta += v04;
            
            otGrid[m].v01 += v01; 
            otGrid[m].v02 += v02; 
            otGrid[m].v03 += v03; 
            otGrid[m].v04 += v04;
        });

        let marcas = Object.keys(otGrid).sort(); 

        marcas.forEach(m => {
            let tiragem = otGrid[m].v00 || 0;
            let inspecionado = ifGrid[m]['c05'] || 0;
            let saldo = tiragem - inspecionado;
            ifGrid[m]['c13'] = saldo > 0 ? saldo : 0;
        });

        document.getElementById('otifTirTotal').innerText = window.formatarBR(tTotal); 
        document.getElementById('otifTirEntregue').innerText = window.formatarBR(tEntregue); 
        document.getElementById('otifTirDentro').innerText = window.formatarBR(tDentroMeta); 
        document.getElementById('otifTirFora').innerText = window.formatarBR(tForaMeta); 
        document.getElementById('otifTirPendFora').innerText = window.formatarBR(tPendForaMeta);
        
        // TOTAL GERAL DO IF (Somente marcas autorizadas)
        let tC06 = 0, tC07 = 0, tC09 = 0;
        Object.keys(ifGrid).forEach(m => { 
            if (marcasComIF.includes(m)) {
                tC06 += ifGrid[m]['c06']; 
                tC07 += ifGrid[m]['c07']; 
                tC09 += ifGrid[m]['c09']; 
            }
        });
        
        let valOtAtual = tEntregue > 0 ? (tDentroMeta / tEntregue) * 100 : 0; 
        let valIfAtual = tC06 > 0 ? (Math.min(tC07, tC09) / tC06) * 100 : 0; 
        
        // Regra Global do OTIF
        let valOtifAtual = tC06 > 0 ? (valOtAtual + valIfAtual) / 2 : valOtAtual; 
        
        let valOtPrevisto = tTotal > 0 ? (((tTotal - (tForaMeta + tPendForaMeta)) / tTotal) * 100) : 0;
        
        if(valOtAtual === 100 && tDentroMeta < tEntregue) valOtAtual = 99.9; 
        if(valIfAtual === 100 && Math.min(tC07, tC09) < tC06) valIfAtual = 99.9; 
        if(valOtifAtual === 100 && (valOtAtual < 100 || valIfAtual < 100)) valOtifAtual = 99.9; 
        if(valOtPrevisto === 100 && (tForaMeta + tPendForaMeta) > 0) valOtPrevisto = 99.9;
        
        document.getElementById('otifPctAtual').innerText = (tEntregue > 0 ? valOtAtual.toFixed(1) : "-") + '%'; 
        document.getElementById('ifPctAtual').innerText = (tC06 > 0 ? valIfAtual.toFixed(1) : "-") + '%'; 
        document.getElementById('otifFinalAtual').innerText = (tEntregue > 0 ? valOtifAtual.toFixed(1) : "-") + '%'; 
        document.getElementById('otifPctPrevisto').innerText = (tTotal > 0 ? valOtPrevisto.toFixed(1) : "-") + '%';
        
        let thHTML = `<th class="p-2 border-r border-slate-300 sticky left-0 bg-slate-100 z-10">FASE / INDICADOR</th>`; 
        marcas.forEach(m => thHTML += `<th class="p-2 border-r border-slate-300 text-right min-w-[90px]">${m}</th>`); 
        thHTML += `<th class="p-2 text-right font-black bg-slate-200">Total Geral</th>`;
        
        document.getElementById('thOtVolumes').innerHTML = thHTML; 
        document.getElementById('thOtPct').innerHTML = thHTML; 
        document.getElementById('thIfVolumes').innerHTML = thHTML;
        
        let otRows = [ 
            {id: 'v00', name: '00 - Tiragem Total'}, 
            {id: 'v01', name: '01 - Tiragem Total Entregue nos CDs'}, 
            {id: 'v02', name: '02 - Tiragem Entregue Dentro da Meta'}, 
            {id: 'v03', name: '03 - Tiragem Entregue Fora da Meta'}, 
            {id: 'v04', name: '04 - Tiragem Pendente Fora da Meta'} 
        ];
        
        let tbOtVol = "";
        otRows.forEach(r => {
            tbOtVol += `<tr class="border-b border-slate-200 hover:bg-slate-50"><td class="p-2 border-r border-slate-200 font-semibold sticky left-0 bg-white">${r.name}</td>`;
            let totalRow = 0; marcas.forEach(m => { let v = otGrid[m][r.id]; totalRow += v; tbOtVol += `<td class="p-2 border-r border-slate-200 text-right">${window.formatarBR(v)}</td>`; });
            tbOtVol += `<td class="p-2 text-right font-black bg-slate-50">${window.formatarBR(totalRow)}</td></tr>`;
        });
        document.getElementById('tbOtVolumes').innerHTML = tbOtVol;
        
        let rowOT = `<tr class="border-b border-slate-200 hover:bg-slate-50"><td class="p-2 border-r border-slate-200 font-semibold sticky left-0 bg-white">% OT Atual</td>`; 
        let rowIF = `<tr class="border-b border-slate-200 hover:bg-slate-50"><td class="p-2 border-r border-slate-200 font-semibold sticky left-0 bg-white">% IF Atual</td>`; 
        let rowOTIF = `<tr class="border-b border-slate-200 hover:bg-slate-50"><td class="p-2 border-r border-slate-200 font-bold text-indigo-800 sticky left-0 bg-indigo-50">% OTIF Final</td>`; 
        let rowPrev = `<tr class="border-b border-slate-200 hover:bg-slate-50"><td class="p-2 border-r border-slate-200 font-semibold sticky left-0 bg-white">% OT Previsto</td>`;
        
        marcas.forEach(m => {
            let temIF = marcasComIF.includes(m); // Verifica a lista VIP
            
            let v01 = otGrid[m].v01, v02 = otGrid[m].v02; 
            let mOT = v01 > 0 ? (v02 / v01) * 100 : null; 
            if(mOT === 100 && v02 < v01) mOT = 99.9;
            
            let mIF = null;
            if (temIF) {
                let c06 = ifGrid[m]['c06'], c07 = ifGrid[m]['c07'], c09 = ifGrid[m]['c09']; 
                mIF = c06 > 0 ? (Math.min(c07, c09) / c06) * 100 : null; 
                if(mIF === 100 && Math.min(c07, c09) < c06) mIF = 99.9;
            } else {
                ifCols.forEach(c => ifGrid[m][c.id] = 0);
            }
            
            let mOTIF = null;
            if (temIF && mOT !== null && mIF !== null) {
                mOTIF = (mOT + mIF) / 2;
                if(mOTIF === 100 && (mOT < 100 || mIF < 100)) mOTIF = 99.9;
            } else {
                mOTIF = mOT; 
            }
            
            let v00 = otGrid[m].v00, v03 = otGrid[m].v03, v04 = otGrid[m].v04; 
            let mPrev = v00 > 0 ? (((v00 - (v03+v04)) / v00) * 100) : null;

        rowPrev += fmtG(tTotal > 0 ? valOtPrevisto : null, 'text-blue-700') + '</tr>';
        
        document.getElementById('tbOtPct').innerHTML = rowOT + rowIF + rowOTIF + rowPrev;
        
        let tbIfVol = ""; 
        ifCols.forEach(c => {
