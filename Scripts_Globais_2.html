window.iniciarAbaOKRQ2 = function() {
    try {
        // Escuta os filtros globais do cabeçalho
        if (!window.okrFiltroListener) {
            document.querySelectorAll('select').forEach(sel => {
                if (sel.id && sel.id.toLowerCase().includes('filtro') && !sel.id.includes('OKR')) {
                    sel.addEventListener('change', () => {
                        if (document.getElementById('abaOKRQ2') && !document.getElementById('abaOKRQ2').classList.contains('hidden')) {
                            setTimeout(window.processarOKRQ2, 500); 
                        }
                    });
                }
            });
            window.okrFiltroListener = true;
        }

        // CARREGAMENTO DO MAPA DE SAÍDA COM DETECTOR DE ERROS
        if (!window.MAPA_SAIDA_CACHE) {
            let loading = document.getElementById('statusCarregamentoMapa');
            if(loading) {
                loading.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200');
                loading.classList.add('bg-amber-50', 'text-amber-600', 'border-amber-200', 'animate-pulse');
                loading.innerText = '⏳ Sincronizando Mapa de Saída...';
            }
            
            google.script.run
                .withSuccessHandler(function(dados) {
                    // Verifica se o backend mandou um erro disfarçado
                    if (dados && dados._ERRO_CRITICO) {
                        if(loading) {
                            loading.classList.remove('animate-pulse', 'bg-amber-50', 'text-amber-600', 'border-amber-200');
                            loading.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
                            loading.innerText = '❌ ' + dados._ERRO_CRITICO;
                        }
                        console.error(dados._ERRO_CRITICO);
                        return;
                    }
                    
                    window.MAPA_SAIDA_CACHE = dados || {};
                    if(loading) loading.classList.add('hidden');
                    window.processarOKRQ2(); // Processa os dados
                })
                .withFailureHandler(function(erro) {
                    // Se o Google Script der Timeout ou erro fatal de conexão
                    if(loading) {
                        loading.classList.remove('animate-pulse', 'bg-amber-50', 'text-amber-600', 'border-amber-200');
                        loading.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
                        loading.innerText = '❌ Falha de conexão com o Google Sheets.';
                    }
                    console.error("Erro Fatal no Google Script:", erro);
                })
                .getDadosMapaSaida();
        } else {
            window.processarOKRQ2();
        }
    } catch(e) {
        console.error("Erro ao iniciar a aba OKR:", e);
    }
};

window.processarOKRQ2 = function() {
    try {
        if (!window.MAPA_SAIDA_CACHE) return; 
        if (typeof dadosFiltrados === 'undefined' || !dadosFiltrados || dadosFiltrados.length === 0) return;

        const mapa = window.MAPA_SAIDA_CACHE;
        const qMetaOkr = document.getElementById('filtroOKRQuarterColeta')?.value || "TODOS";
        
        const dHoje = new Date();
        const dOntem = new Date(); dOntem.setDate(dHoje.getDate() - 1);
        const ontemIso = dOntem.toISOString().split('T')[0];
        
        let vFisico = { baseGeral: 0, baseOKR: 0, coletadaPrazo: 0, entreguePrazo: 0 };
        const initAder = () => ({ base: 0, entregueReal: 0, baseVencida: 0, noPrazoVencido: 0 });
        let totais = { col: initAder(), okr: initAder() };
        
        let aggGrafica = {}; let aggMarca = {}; 
        let aggResumo = {}; 
        let htmlTabela = "";
        let mapUnicoBase = {}; 
        let mapUnicoOKR = {};  

        const getQuarter = (dateStr) => {
            if(!dateStr) return "";
            const m = parseInt(dateStr.split('-')[1]);
            return m <= 3 ? "Q1" : m <= 6 ? "Q2" : m <= 9 ? "Q3" : "Q4";
        };

        const parseMeta = (v) => {
            if (!v) return null;
            let str = String(v).trim();
            if (str.includes('T')) str = str.split('T')[0];
            if (str.includes('/')) { 
                let p = str.split('/'); 
                if (p.length === 3) return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`; 
            }
            return str.substring(0, 10);
        };
        
        const fmtData = (d) => d ? d.split('-').reverse().join('/') : '-';

        dadosFiltrados.forEach(l => {
            const tiragem = window.arredondar(l["TIRAGEM"] || 0);
            if (tiragem <= 0) return;

            const metas = { okr: parseMeta(l["META_OKR_POS"] || null), col: parseMeta(l["META_COLETA_D"] || null) };

            if (qMetaOkr !== "TODOS" && (!metas.okr || getQuarter(metas.okr) !== qMetaOkr)) return;

            const kUnico = getKey(l);

            if (!mapUnicoBase[kUnico]) { mapUnicoBase[kUnico] = true; vFisico.baseGeral += tiragem; }

            if (!belongsToPhase(l, 'col')) return; 

            if (!mapUnicoOKR[kUnico]) { mapUnicoOKR[kUnico] = true; vFisico.baseOKR += tiragem; }

            const sku = l["SKU_REAL"] || l["SKU"] || "-";
            const desc = l["DESC_REAL"] || l["DESCRIÇÃO"] || l["PRODUTO"] || "";
            const g = l["GRAFICA_FINAL"] || l["GRÁFICA"] || "N/A";
            const m = l["MARCA_FINAL"] || l["UNIDADE"] || "N/A";
            const cd = l["CD_FINAL"] || l["CD"] || "N/A";
            const serie = String(l["SÉRIE"] || l["Série"] || l["SERIE"] || l["SÉRIES"] || "-").trim();
            const joinKey = String(l["JOIN_KEY"] || "").trim();

            const dtColetaReal = parseMeta(l["DT_ENTREGA_DG"] || null);

            let dtEntregaReal = "";
            if (g.includes("POSIGRAF") && cd.includes("POSIGRAF")) { 
                dtEntregaReal = dtColetaReal; 
            } else if (mapa[joinKey] && mapa[joinKey].length > 0) { 
                // 🎯 AJUSTADO PARA LER 'e.dataEntrega'
                dtEntregaReal = mapa[joinKey].reduce((max, e) => ((e.dataEntrega && e.dataEntrega > max) ? e.dataEntrega : max), ""); 
            }
            dtEntregaReal = parseMeta(dtEntregaReal);

            if(!aggGrafica[g]) aggGrafica[g] = { col: initAder(), okr: initAder() };
            if(!aggMarca[m]) aggMarca[m] = { col: initAder(), okr: initAder() };
            
            let kResumo = `${m}|${g}|${serie}|${cd}`;
            if(!aggResumo[kResumo]) aggResumo[kResumo] = { m, g, serie, cd, tiragemTotal: 0, col: initAder(), okr: initAder() };
            aggResumo[kResumo].tiragemTotal += tiragem;

            if (metas.col) {
                totais.col.base += tiragem;
                aggGrafica[g].col.base += tiragem;
                aggMarca[m].col.base += tiragem;
                aggResumo[kResumo].col.base += tiragem;
                
                if (dtColetaReal) {
                    totais.col.entregueReal += tiragem;
                    aggGrafica[g].col.entregueReal += tiragem;
                    aggMarca[m].col.entregueReal += tiragem;
                    aggResumo[kResumo].col.entregueReal += tiragem;
                }
                
                if (metas.col <= ontemIso) {
                    totais.col.baseVencida += tiragem;
                    aggGrafica[g].col.baseVencida += tiragem;
                    aggMarca[m].col.baseVencida += tiragem;
                    aggResumo[kResumo].col.baseVencida += tiragem;
                    
                    if (dtColetaReal && dtColetaReal <= metas.col) {
                        totais.col.noPrazoVencido += tiragem;
                        aggGrafica[g].col.noPrazoVencido += tiragem;
                        aggMarca[m].col.noPrazoVencido += tiragem;
                        aggResumo[kResumo].col.noPrazoVencido += tiragem;
                    }
                }
            }

            if (metas.okr) {
                totais.okr.base += tiragem;
                aggGrafica[g].okr.base += tiragem;
                aggMarca[m].okr.base += tiragem;
                aggResumo[kResumo].okr.base += tiragem;
                
                if (dtEntregaReal) {
                    totais.okr.entregueReal += tiragem;
                    aggGrafica[g].okr.entregueReal += tiragem;
                    aggMarca[m].okr.entregueReal += tiragem;
                    aggResumo[kResumo].okr.entregueReal += tiragem;
                }
                
                if (metas.okr <= ontemIso) {
                    totais.okr.baseVencida += tiragem;
                    aggGrafica[g].okr.baseVencida += tiragem;
                    aggMarca[m].okr.baseVencida += tiragem;
                    aggResumo[kResumo].okr.baseVencida += tiragem;
                    
                    if (dtEntregaReal && dtEntregaReal <= metas.okr) {
                        totais.okr.noPrazoVencido += tiragem;
                        aggGrafica[g].okr.noPrazoVencido += tiragem;
                        aggMarca[m].okr.noPrazoVencido += tiragem;
                        aggResumo[kResumo].okr.noPrazoVencido += tiragem;
                    }
                }
            }

            const statusCol = !metas.col ? "S/ Meta" : (dtColetaReal ? (dtColetaReal <= metas.col ? "No Prazo":"Atrasado") : "Pendente");
            const statusOkr = !metas.okr ? "S/ Meta" : (dtEntregaReal ? (dtEntregaReal <= metas.okr ? "No Prazo":"Atrasado") : "Pendente");
            let corStCol = statusCol === 'No Prazo' ? 'text-emerald-600' : (statusCol === 'Atrasado' ? 'text-rose-600' : 'text-slate-400');
            let corStOkr = statusOkr === 'No Prazo' ? 'text-emerald-600' : (statusOkr === 'Atrasado' ? 'text-rose-600' : 'text-slate-400');

            htmlTabela += `<tr class="border-b border-slate-100 hover:bg-slate-50">
                <td class="p-2 font-bold text-slate-400">${l["_SOURCE"] || "PCP"}</td>
                <td class="p-2 font-bold">${sku}</td>
                <td class="p-2 truncate max-w-[150px]" title="${desc}">${desc}</td>
                <td class="p-2">${g}</td><td class="p-2">${cd}</td>
                <td class="p-2 text-right font-bold border-r">${window.formatarBR(tiragem)}</td>
                <td class="p-2 text-center font-mono">${fmtData(dtColetaReal)}</td>
                <td class="p-2 text-center border-r bg-amber-50/30"><span class="font-mono text-slate-700">${fmtData(metas.col)}</span><br><span class="text-[9px] font-bold uppercase tracking-wider ${corStCol}">${statusCol}</span></td>
                <td class="p-2 text-center font-mono">${fmtData(dtEntregaReal)}</td>
                <td class="p-2 text-center bg-indigo-50/30"><span class="font-mono text-slate-700">${fmtData(metas.okr)}</span><br><span class="text-[9px] font-bold uppercase tracking-wider ${corStOkr}">${statusOkr}</span></td>
            </tr>`;
        });

        const setVal = (id, val) => { if(document.getElementById(id)) document.getElementById(id).innerText = val; };
        
        setVal('volBaseGeral', window.formatarBR(vFisico.baseGeral));
        setVal('volOkrTotal', window.formatarBR(vFisico.baseOKR));
        setVal('volOkrPendente', window.formatarBR(vFisico.baseOKR - totais.col.entregueReal));
        setVal('volOkrColetada', window.formatarBR(totais.col.entregueReal));
        setVal('volOkrCD', window.formatarBR(totais.okr.entregueReal));

        setVal('volOkrColetadaPrazo', window.formatarBR(totais.col.noPrazoVencido)); 
        setVal('volOkrEntreguePrazo', window.formatarBR(totais.okr.noPrazoVencido));

        ['COL', 'OKR'].forEach(key => {
            const k = key.toLowerCase();
            const bVencida = totais[k].baseVencida;
            const pzVencido = totais[k].noPrazoVencido;
            const pct = bVencida > 0 ? (pzVencido / bVencida) * 100 : 0;
            
            setVal(`okrAtual_${key}`, bVencida > 0 ? pct.toFixed(1) + "%" : "-");
            setVal(`volCompare_${key}_Pz`, window.formatarBR(pzVencido));
            setVal(`volCompare_${key}_Base`, window.formatarBR(bVencida));
        });

        document.getElementById('tbCorpoOKR').innerHTML = htmlTabela;
        window.gerarTabelasMatrizOKR(aggGrafica, aggMarca, aggResumo);

    } catch(e) { console.error("Erro OKR:", e); }
};

window.gerarTabelasMatrizOKR = function(aggGrafica, aggMarca, aggResumo) {
    const build = (obj, idTable) => {
        let keys = Object.keys(obj).sort();
        let h = `<thead class="bg-slate-100 border-b"><tr>
            <th class="p-2 sticky left-0 bg-slate-100 shadow-[1px_0_0_#e2e8f0]">Nome</th>
            <th class="p-2 text-right">Tiragem Total</th>
            <th class="p-2 text-right bg-amber-50">Meta Coleta (Até D-1)</th>
            <th class="p-2 text-right bg-amber-50">Coleta Pz (D-1)</th>
            <th class="p-2 text-center leading-tight bg-amber-50 border-r">% Coleta<br><span class="text-[8px] font-normal text-slate-500 uppercase tracking-widest">D-1</span></th>
            
            <th class="p-2 text-right bg-indigo-50">Meta Entrega (Até D-1)</th>
            <th class="p-2 text-right bg-indigo-50">Entrega Pz (D-1)</th>
            <th class="p-2 text-center leading-tight bg-indigo-50">% Entrega<br><span class="text-[8px] font-normal text-slate-500 uppercase tracking-widest">D-1</span></th>
        </tr></thead><tbody>`;

        keys.forEach(k => {
            const d = obj[k];
            
            const pCol = d.col.baseVencida > 0 ? ((d.col.noPrazoVencido / d.col.baseVencida) * 100).toFixed(1) : "-";
            const pOkr = d.okr.baseVencida > 0 ? ((d.okr.noPrazoVencido / d.okr.baseVencida) * 100).toFixed(1) : "-";
            
            const corCol = pCol !== "-" ? (pCol >= 90 ? 'text-emerald-600' : (pCol >= 75 ? 'text-amber-500' : 'text-rose-600')) : 'text-slate-400';
            const corOkr = pOkr !== "-" ? (pOkr >= 90 ? 'text-emerald-600' : (pOkr >= 75 ? 'text-indigo-500' : 'text-rose-600')) : 'text-slate-400';

            h += `<tr class="border-b hover:bg-slate-50">
                <td class="p-2 font-bold sticky left-0 bg-white shadow-[1px_0_0_#f1f5f9]">${k}</td>
                <td class="p-2 text-right text-slate-400 font-mono">${window.formatarBR(Math.max(d.col.base, d.okr.base))}</td>
                <td class="p-2 text-right text-amber-700 font-mono bg-amber-50/30">${window.formatarBR(d.col.baseVencida)}</td>
                <td class="p-2 text-right text-emerald-600 font-mono font-bold bg-amber-50/30">${window.formatarBR(d.col.noPrazoVencido)}</td>
                <td class="p-2 text-center font-black ${corCol} bg-amber-50/60 border-r">${pCol}${pCol !== '-' ? '%' : ''}</td>
                
                <td class="p-2 text-right text-indigo-700 font-mono bg-indigo-50/30">${window.formatarBR(d.okr.baseVencida)}</td>
                <td class="p-2 text-right text-emerald-600 font-mono font-bold bg-indigo-50/30">${window.formatarBR(d.okr.noPrazoVencido)}</td>
                <td class="p-2 text-center font-black ${corOkr} bg-indigo-50/60">${pOkr}${pOkr !== '-' ? '%' : ''}</td>
            </tr>`;
        });
        document.getElementById(idTable).innerHTML = h + "</tbody>";
    };

    const buildResumo = (obj, idTable) => {
        // 🎯 LÊ SE O FILTRO ESTÁ ATIVADO
        let chkFilter = document.getElementById('chkFiltroImpactadosOKR');
        let soImpactados = chkFilter ? chkFilter.checked : false;

        let keys = Object.keys(obj).sort(); 
        let h = `<thead class="bg-slate-100 border-b text-[9px] uppercase tracking-wider text-slate-500"><tr>
            <th class="p-2 sticky left-0 bg-slate-100 shadow-[1px_0_0_#e2e8f0] z-10">Marca</th>
            <th class="p-2 border-r border-slate-200">Gráfica</th>
            <th class="p-2 border-r border-slate-200">Série</th>
            <th class="p-2 border-r border-slate-200">CD Destino</th>
            <th class="p-2 text-right border-r border-slate-300">Tiragem Total</th>
            
            <th class="p-2 text-right bg-amber-50">Coleta (Meta D-1)</th>
            <th class="p-2 text-right bg-amber-50">Coletado Real</th>
            <th class="p-2 text-right bg-amber-50">No Prazo (D-1)</th>
            <th class="p-2 text-center bg-amber-50 border-r">% Col (D-1)</th>

            <th class="p-2 text-right bg-indigo-50">Entrega (Meta D-1)</th>
            <th class="p-2 text-right bg-indigo-50">Entregue CD</th>
            <th class="p-2 text-right bg-indigo-50">No Prazo (D-1)</th>
            <th class="p-2 text-center bg-indigo-50">% Ent (D-1)</th>
        </tr></thead><tbody>`;

        let linhasDesenhadas = 0;

        keys.forEach(k => {
            const d = obj[k];
            
            // 🎯 LÓGICA DO FILTRO: Verifica se a linha tem meta vencida E perdeu prazo
            let colImpactada = d.col.baseVencida > 0 && d.col.noPrazoVencido < d.col.baseVencida;
            let okrImpactada = d.okr.baseVencida > 0 && d.okr.noPrazoVencido < d.okr.baseVencida;

            // Se o filtro está ativo e a linha NÃO tem impacto, pula ela!
            if (soImpactados && !colImpactada && !okrImpactada) return;

            linhasDesenhadas++;
            
            const pCol = d.col.baseVencida > 0 ? ((d.col.noPrazoVencido / d.col.baseVencida) * 100).toFixed(1) : "-";
            const pOkr = d.okr.baseVencida > 0 ? ((d.okr.noPrazoVencido / d.okr.baseVencida) * 100).toFixed(1) : "-";
            
            const corCol = pCol !== "-" ? (pCol >= 90 ? 'text-emerald-600' : (pCol >= 75 ? 'text-amber-500' : 'text-rose-600')) : 'text-slate-400';
            const corOkr = pOkr !== "-" ? (pOkr >= 90 ? 'text-emerald-600' : (pOkr >= 75 ? 'text-indigo-500' : 'text-rose-600')) : 'text-slate-400';

            h += `<tr class="border-b border-slate-100 hover:bg-slate-50 text-[10px]">
                <td class="p-2 font-bold text-slate-700 sticky left-0 bg-white shadow-[1px_0_0_#f1f5f9]">${d.m}</td>
                <td class="p-2 font-semibold text-slate-600 border-r border-slate-100">${d.g}</td>
                <td class="p-2 text-slate-500 border-r border-slate-100">${d.serie}</td>
                <td class="p-2 text-slate-500 border-r border-slate-100">${d.cd}</td>
                <td class="p-2 text-right font-black text-slate-700 border-r border-slate-200 bg-slate-50/50">${window.formatarBR(d.tiragemTotal)}</td>

                <td class="p-2 text-right text-amber-700 font-mono bg-amber-50/30">${window.formatarBR(d.col.baseVencida)}</td>
                <td class="p-2 text-right text-blue-600 font-mono bg-amber-50/30">${window.formatarBR(d.col.entregueReal)}</td>
                <td class="p-2 text-right text-emerald-600 font-mono font-bold bg-amber-50/30">${window.formatarBR(d.col.noPrazoVencido)}</td>
                <td class="p-2 text-center font-black ${corCol} bg-amber-50/60 border-r">${pCol}${pCol !== '-' ? '%' : ''}</td>
                
                <td class="p-2 text-right text-indigo-700 font-mono bg-indigo-50/30">${window.formatarBR(d.okr.baseVencida)}</td>
                <td class="p-2 text-right text-blue-600 font-mono bg-indigo-50/30">${window.formatarBR(d.okr.entregueReal)}</td>
                <td class="p-2 text-right text-emerald-600 font-mono font-bold bg-indigo-50/30">${window.formatarBR(d.okr.noPrazoVencido)}</td>
                <td class="p-2 text-center font-black ${corOkr} bg-indigo-50/60">${pOkr}${pOkr !== '-' ? '%' : ''}</td>
            </tr>`;
        });
        
        // Mensagem bacana caso o filtro não ache nenhum erro
        if (linhasDesenhadas === 0 && soImpactados) {
            h += `<tr><td colspan="13" class="p-8 text-center font-black text-emerald-600 bg-emerald-50/50 text-sm">Tudo 100%! Nenhuma perda encontrada. 🎉</td></tr>`;
        } else if (linhasDesenhadas === 0) {
            h += `<tr><td colspan="13" class="p-8 text-center text-slate-400">Nenhum dado encontrado.</td></tr>`;
        }
        
        document.getElementById(idTable).innerHTML = h + "</tbody>";
    };

    build(aggGrafica, 'tbOkrMatrizGrafica');
    build(aggMarca, 'tbOkrMatrizMarca');
    if (aggResumo) buildResumo(aggResumo, 'tbOkrMatrizResumo'); 
};

// BOTÃO EXPORTAR CSV
window.exportarCSV_OKR = function() {
    let tabela = document.getElementById("tabelaAuditoriaOKR");
    if (!tabela) return;

    let csvContent = "\uFEFF"; 
    let linhas = tabela.querySelectorAll("tr");
    
    linhas.forEach(row => {
        let cols = row.querySelectorAll("th, td");
        let dadosLinha = Array.from(cols).map(c => `"${c.innerText.replace(/"/g, '""')}"`);
        csvContent += dadosLinha.join(";") + "\r\n";
    });

    let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `Auditoria_Metas_${new Date().toISOString().split('T')[0]}.csv`;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
};

document.addEventListener("DOMContentLoaded", function() {
    window.MAPA_SAIDA_CACHE = null;
    console.log("Iniciando busca do Mapa de Saída em background...");
    
    google.script.run
        .withSuccessHandler(function(dados) {
            if (dados && dados._ERRO_CRITICO) {
                console.error("Erro no background: ", dados._ERRO_CRITICO);
                return;
            }
            window.MAPA_SAIDA_CACHE = dados || {};
            console.log("✅ Mapa de Saída pronto em segundo plano!");
            
            // 🎯 CORREÇÃO 3: Verificando se a variável existe corretamente
            if (typeof window.processarOKRQ2 === 'function' && typeof dadosFiltrados !== 'undefined' && dadosFiltrados && dadosFiltrados.length > 0) {
                window.processarOKRQ2();
            }
        })

];

function getValFromCols(row, cols) {
    for (let c of cols) { if (row[c] !== undefined && row[c] !== null) return row[c]; }
    return null;
}
function isDateFilled(val) {
    if (val === null || val === undefined) return false;
    let s = String(val).trim().toUpperCase();
    return s !== '' && s !== '-' && s !== 'N/A' && s !== '#N/A' && !s.includes('SEM DATA') && !s.includes('#REF!');
}
function parseValidDate(val) {
    if (!isDateFilled(val)) return null;
    if (typeof val.getTime === 'function') return val;
    let str = String(val).trim();
    if (str.includes('/')) {
        let p = str.split(' ')[0].split('/');
        if (p.length === 3) return new Date(p[2], p[1]-1, p[0], 0, 0, 0);
    }
    let d = new Date(str);
    return isNaN(d.getTime()) ? null : d;
}

window.ordenarTabelaGiro = function(col) {
    let ruleIndex = window.GIRO_SORT_RULES.findIndex(r => r.col === col);
    let dir = 'asc';
    if (ruleIndex > -1) {
        dir = window.GIRO_SORT_RULES[ruleIndex].dir === 'asc' ? 'desc' : 'asc';
        window.GIRO_SORT_RULES.splice(ruleIndex, 1); // Remove para colocar no topo da prioridade
    }
    window.GIRO_SORT_RULES.unshift({ col: col, dir: dir });
    window.reFiltrarTabelaGiro();
};

window.construirBotoesEtapasGiro = function() {
  const container = document.getElementById('filtroEtapasGiro');
  if (!container) return;

  // Definição exata dos macro-grupos baseada no seu pedido
  const macroGrupos = {
    'Pré produção': ['Env. Arquivo', 'Rec. Boneco', 'Apv. Boneco'],
    'Produção': ['Impressão (Início)', 'Impressão (Fim)', 'Acabamento (Início)', 'Acabamento (Fim)', 'Form. Kit (Início)', 'Form. Kit (Fim)', 'Coleta Inicial', 'Coleta Final'],
    'Custos': ['Val. Custos (Início)', 'Val. Custos (Fim)', 'O.C. (Início)', 'O.C. (Fim)']
  };

  function renderizarFiltrosGiro() {
    container.innerHTML = '';

    // 1. Renderiza a linha de Macro Grupos (Filtro Combinado)
    const divMacros = document.createElement('div');
    divMacros.className = "flex flex-wrap gap-2 w-full mb-3 pb-2 border-b border-slate-200";
    
    Object.keys(macroGrupos).forEach(gNome => {
      const subEtapas = macroGrupos[gNome];
      const todosMarcados = subEtapas.every(e => window.GIRO_ETAPAS_SELECIONADAS.has(e));
      const btnG = document.createElement('button');
      btnG.type = 'button';
      
      if (todosMarcados) {
        btnG.className = "px-3 py-1.5 text-xs font-black rounded-lg border transition-all shadow-md bg-slate-800 text-white border-slate-800";
      } else {
        btnG.className = "px-3 py-1.5 text-xs font-black rounded-lg border transition-all shadow-sm bg-slate-100 text-slate-600 border-slate-300 hover:bg-slate-200";
      }
      btnG.innerText = `📁 ${gNome}`;
      
      btnG.onclick = function() {
        if (todosMarcados) {
          subEtapas.forEach(e => window.GIRO_ETAPAS_SELECIONADAS.delete(e));
        } else {
          subEtapas.forEach(e => window.GIRO_ETAPAS_SELECIONADAS.add(e));
        }
        renderizarFiltrosGiro();
        window.reFiltrarTabelaGiro();
      };
      divMacros.appendChild(btnG);
    });
    container.appendChild(divMacros);

    // 2. Renderiza as Etapas Individuais (Filtro Separado)
    const divEtapas = document.createElement('div');
    divEtapas.className = "flex flex-wrap gap-2 w-full";

    ETAPAS_MAPA.forEach(f => {
      const btn = document.createElement('button');
      btn.type = 'button';
      const ativo = window.GIRO_ETAPAS_SELECIONADAS.has(f.nome);
      
      if (ativo) {
        btn.className = "px-3 py-1.5 text-xs font-bold rounded-lg border transition-all shadow-sm bg-indigo-600 text-white border-indigo-600";
      } else {
        btn.className = "px-3 py-1.5 text-xs font-bold rounded-lg border transition-all shadow-sm bg-white text-slate-600 border-slate-200 hover:bg-slate-50";
      }
      btn.innerText = f.nome;
      
      btn.onclick = function() {
        if (ativo) {
          window.GIRO_ETAPAS_SELECIONADAS.delete(f.nome);
        } else {
          window.GIRO_ETAPAS_SELECIONADAS.add(f.nome);
        }
        renderizarFiltrosGiro();
        window.reFiltrarTabelaGiro();
      };
      divEtapas.appendChild(btn);
    });
    container.appendChild(divEtapas);
  }

  renderizarFiltrosGiro();
};

window.salvarObsFront = function(tipo, chave, inputEl) {
    let obs = inputEl.value.trim();
    let dictCheck = (tipo === 'SKU') ? window.HISTORICO_OBS_GIRO.sku : window.HISTORICO_OBS_GIRO.master;
    let lastObs = (dictCheck[chave] && dictCheck[chave].length > 0) ? dictCheck[chave][0].obs : "";
    if (!obs || obs === lastObs) return;

    inputEl.disabled = true;
    inputEl.classList.add('opacity-50', 'bg-slate-100');
    let placeholderOriginal = inputEl.placeholder;
    inputEl.placeholder = "Salvando...";

    let contexto = window.CONTEXTOS_TEMP[chave] || "{}";

    google.script.run
        .withSuccessHandler(function(res) {
            inputEl.disabled = false;
            inputEl.classList.remove('opacity-50', 'bg-slate-100');
            inputEl.placeholder = placeholderOriginal;

            if(res && res.success) {
                if(typeof showToast === 'function') showToast("Observação salva com sucesso no histórico!");
                let dict = (res.tipo === 'SKU') ? window.HISTORICO_OBS_GIRO.sku : window.HISTORICO_OBS_GIRO.master;
                if(!dict[res.chave]) dict[res.chave] = [];
                dict[res.chave].unshift({ data: res.data, user: res.user, obs: res.obs });
                
                window.reFiltrarTabelaGiro();
            } else {
                alert("Erro ao salvar observação: " + (res ? res.error : "Erro desconhecido"));
            }
        })
        .salvarObsGiro(tipo, chave, obs, contexto);
};

window.reFiltrarTabelaGiro = function() {
    const tbody = document.getElementById('tbodyPontosAtencaoGiro');
    if (!tbody) return;

    const optAberto = document.getElementById('chkGiroAberto').checked;
    const optConcluido = document.getElementById('chkGiroConcluido').checked;
    const optCancelado = document.getElementById('chkGiroCancelado').checked;
    const minDias = parseInt(document.getElementById('sldGiroDiasMin').value);
    const maxDias = parseInt(document.getElementById('sldGiroDiasMax').value);
    const minRange = Math.min(minDias, maxDias);
    const maxRange = Math.max(minDias, maxDias);

    const grupos = {};

    window.GIRO_DADOS_RAW.forEach(l => {
        // ---> 1. TRAVA DA COLUNA EE <---
        // Se a coluna EE for OK ou Não Coletado, ignora a linha e pula para a próxima
        let statusEE = String(l["STATUS_EE"] || "").trim().toUpperCase();
        if (statusEE === "OK" || statusEE === "NÃO COLETADO" || statusEE === "NAO COLETADO") {
            return;
        }

        let statusFinalStr = 'Em Aberto';
        let ultEtapaStatus = String(l["Última Etapa"] || l["STATUS"] || l["Etapa Atual"] || "").toUpperCase();
        
        // Reconhecimento fiel de conclusão baseado na data real final
        let coletaReal = getValFromCols(l, ['Coleta/Internalização de estoque Final Real', 'Coleta Real PCP', 'Data coleta', 'Data da coleta realizada', 'DT_ENTREGA_DG']);
        
        if (ultEtapaStatus.includes("CANCEL")) {
            statusFinalStr = 'Cancelado';
        } else if (ultEtapaStatus.includes("CONCLU") || ultEtapaStatus.includes("FINALIZADO") || isDateFilled(coletaReal)) {
            statusFinalStr = 'Concluído';
        }

        // Se a checkbox comanda que não deve mostrar, ignora.
        if (statusFinalStr === 'Concluído' && !optConcluido) return;
        if (statusFinalStr === 'Cancelado' && !optCancelado) return;
        if (statusFinalStr === 'Em Aberto' && !optAberto) return;

        let etapaPendente = '-';
        let diasAtraso = 0;
        let pendenciasFormatadas = []; 

        if (statusFinalStr === 'Em Aberto') {
            let etapaProd = null;
            let diasProd = 0;
            
            // 1. Encontra a pendência de PRODUÇÃO
            for (let i = 0; i < ETAPAS_MAPA.length; i++) {
                let e = ETAPAS_MAPA[i];
                if (e.nome.includes('Val. Custos') || e.nome.includes('O.C.')) continue;
                
                let valReal = getValFromCols(l, e.real);
                let valPlan = getValFromCols(l, e.plan);

                if (!isDateFilled(valReal) && isDateFilled(valPlan)) {
                    let dPlan = parseValidDate(valPlan);
                    if (dPlan) {
                        let dHoje = new Date(); dHoje.setHours(0,0,0,0); dPlan.setHours(0,0,0,0);
                        diasProd = Math.floor((dHoje - dPlan) / (1000 * 60 * 60 * 24));
                        etapaProd = e.nome;
                        break;
                    }
                }
            }

            // 2. Encontra a pendência de Validação de Custos
            let etapaCustos = null;
            let diasCustos = 0;
            const mtCustos = ETAPAS_MAPA.filter(e => e.nome.includes('Val. Custos'));
            for (let e of mtCustos) {
                let valReal = getValFromCols(l, e.real);
                let valPlan = getValFromCols(l, e.plan);
                if (!isDateFilled(valReal) && isDateFilled(valPlan)) {
                    let dPlan = parseValidDate(valPlan);
                    if (dPlan) {
                        let dHoje = new Date(); dHoje.setHours(0,0,0,0); dPlan.setHours(0,0,0,0);
                        diasCustos = Math.floor((dHoje - dPlan) / (1000 * 60 * 60 * 24));
                        etapaCustos = e.nome;
                        break;
                    }
                }
            }

            // 3. Verifica a O.C.
            let etapaOC = null;
            let diasOC = 0;
            if (!etapaCustos) {
                const mtOC = ETAPAS_MAPA.filter(e => e.nome.includes('O.C.'));
                for (let e of mtOC) {
                    let valReal = getValFromCols(l, e.real);
                    let valPlan = getValFromCols(l, e.plan);
                    if (!isDateFilled(valReal) && isDateFilled(valPlan)) {
                        let dPlan = parseValidDate(valPlan);
                        if (dPlan) {
                            let dHoje = new Date(); dHoje.setHours(0,0,0,0); dPlan.setHours(0,0,0,0);
                            diasOC = Math.floor((dHoje - dPlan) / (1000 * 60 * 60 * 24));
                            etapaOC = e.nome;
                            break;
                        }
                    }
                }
            }

            // 4. O SEGREDO: Aplica o filtro de botões E o SLIDER numérico individualmente para cada etapa
            let selecionadas = [];
            
            const validaNoSlider = (d) => {
                let esc = -d;
                return (esc >= minRange && esc <= maxRange);
            };

            if (etapaProd && window.GIRO_ETAPAS_SELECIONADAS.has(etapaProd) && validaNoSlider(diasProd)) {
                selecionadas.push({ nome: etapaProd, dias: diasProd });
            }
            if (etapaCustos && window.GIRO_ETAPAS_SELECIONADAS.has(etapaCustos) && validaNoSlider(diasCustos)) {
                selecionadas.push({ nome: etapaCustos, dias: diasCustos });
            } else if (etapaOC && window.GIRO_ETAPAS_SELECIONADAS.has(etapaOC) && validaNoSlider(diasOC)) {
                selecionadas.push({ nome: etapaOC, dias: diasOC });
            }

            // Se NENHUMA pendência passar nos botões + slider simultaneamente, oculta a linha inteira!
            if (selecionadas.length === 0) return; 

            etapaPendente = selecionadas.map(s => s.nome).join(' + ');
            diasAtraso = Math.max(...selecionadas.map(s => s.dias)); // Pior atraso serve apenas para ordenação da tabela

            // Monta o visual apenas para o que passou rigorosamente pelos dois filtros
            selecionadas.forEach(s => {
                let lbl = '';
                let escala = -s.dias;
                if (escala <= -3) lbl = `<span class="font-bold text-red-600 block text-[9px] mt-0.5 mb-1">Vencido há ${Math.abs(escala)} dias</span>`;
                else if (escala < 0) lbl = `<span class="font-bold text-amber-600 block text-[9px] mt-0.5 mb-1">Vencido há ${Math.abs(escala)} dias</span>`;
                else if (escala > 0) lbl = `<span class="font-bold text-blue-600 block text-[9px] mt-0.5 mb-1">Vence em ${escala} dias</span>`;
                else lbl = `<span class="font-bold text-emerald-600 block text-[9px] mt-0.5 mb-1">Vence hoje</span>`;
                
                // ---> 2. CÁLCULO DE DIAS DA COLETA PCP <---
                if (s.nome === 'Coleta Mapa' || s.nome === 'Entrega TP') {
                    let dtColetaPCP = extrairDataISO(l["DT_ENTREGA_DG"] || l["Coleta/Internalização de estoque Final Real"]);
                    if (dtColetaPCP) {
                        let diasDesdeColetaPCP = calcDiffDiasISO(dtColetaPCP, dtHojeISO);
                        lbl += `<span class="text-[9px] text-indigo-600 font-bold block mt-0.5 mb-1">(Há ${diasDesdeColetaPCP} dias da Coleta PCP)</span>`;
                    }
                }

                // ---> 3. CÁLCULO DA DIFERENÇA DE INTERNALIZAÇÃO <---
                let tBase = window.arredondar(l["TIRAGEM"] || l["QUANTIDADE"]);
                let fInt = FASES.find(f => f.id === 'int_cd');
                if (fInt) {
                    let volInternalizado = window.getVolFase ? window.getVolFase(l, fInt, tBase) : tBase;
                    let difInternalizacao = tBase - volInternalizado;
                    
                    if (difInternalizacao > 0) {
                        lbl += `<span class="text-[9px] text-rose-500 font-bold block mt-0.5 mb-1">(Faltam ${window.formatarBR(difInternalizacao)} un. na Internalização)</span>`;
                    }
                }

                pendenciasFormatadas.push(`<div class="leading-tight">${s.nome}${lbl}</div>`);
            });
        }

        let escalaSlider = -diasAtraso;

        if (statusFinalStr === 'Em Aberto') {
            // Redundância de segurança geral da linha
            if (escalaSlider < minRange || escalaSlider > maxRange) return;
        }

        let grafica = String(l["GRAFICA_FINAL"] || l["GRÁFICA"] || "N/A").trim();
        let marca = String(l["UNIDADE"] || l["MARCA_FINAL"] || "N/A").trim();
        let serie = String(l["SÉRIE"] || l["Série"] || l["SERIE"] || "-").trim();
        let envio = String(l["ENVIO"] || l["Envio"] || "-").trim();
        let cd = String(l["CD DESTINO"] || l["CD_FINAL"] || l["CD"] || "-").trim();
        let sku = String(l["SKU_REAL"] || l["SKU"] || "-").trim();
        let tiragemBase = window.arredondar ? window.arredondar(l["TIRAGEM"] || l["QUANTIDADE"] || 0) : 0;

    window.calcularTempoObs = function(dataString) {
    if (!dataString) return { texto: "Sem observação", dias: Infinity };
    
    let parts = String(dataString).split(/[\s/:]+/);
    let dataObs = new Date();
    if(parts.length >= 3) {
        dataObs = new Date(parts[2], parts[1]-1, parts[0], parts[3]||0, parts[4]||0);
    } else {
        dataObs = new Date(dataString);
    }

    if (isNaN(dataObs)) return { texto: "Sem observação", dias: Infinity };

    let hoje = new Date();
    let diffMs = Math.abs(hoje - dataObs);
    let diffDias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    
    let texto = "";
    if (diffDias === 0) texto = "Atualizado hoje";
    else if (diffDias === 1) texto = "Atualizado há 1 dia";
    else if (diffDias < 30) texto = `Atualizado há ${diffDias} dias`;
    else if (diffDias < 365) {
        let meses = Math.floor(diffDias / 30);
        texto = `Atualizado há ${meses} ${meses === 1 ? 'mês' : 'meses'}`;
    } else {
        let anos = Math.floor(diffDias / 365);
        texto = `Atualizado há ${anos} ${anos === 1 ? 'ano' : 'anos'}`;
    }
    
    return { texto: texto, dias: diffDias };
};

window.renderizarDashColetas = function() {
    if (!document.getElementById('abaColetas') || !dadosFiltrados) return;

    let resGrafica = {};
    let resMarca = {};
    let listaSkus = [];
    
    let fStatus = document.getElementById('filtroStatusColeta') ? document.getElementById('filtroStatusColeta').value : 'TODOS';
    let fPrazo = document.getElementById('filtroPrazoColeta') ? document.getElementById('filtroPrazoColeta').value : 'TODOS';
    let tRef = document.getElementById('filtroReferencia').value || 'replan';

    // 1. Processamento da Base
    dadosFiltrados.forEach(l => {
        let tPCP = window.arredondar(l["TIRAGEM"] || l["QUANTIDADE"]);
        if (tPCP <= 0) return;
        
        let tMapa = window.arredondar(l["TIRAGEM COLETADA"] || l["COLETADA_MAPA"] || 0);
        let statusColeta = String(l["STATUS COLETA"] || l["Status Coleta"] || "Não Analisado").trim();
        
        let dataRealPcp = extrairDataISO(l["DT_ENTREGA_DG"] || l["Coleta/Internalização de estoque Final Real"]);
        let tColPcp = dataRealPcp ? tPCP : 0; 

        if (fStatus !== 'TODOS') {
            if (fStatus === 'MAIS' && !statusColeta.includes('Mais')) return;
            if (fStatus === 'MENOS' && !statusColeta.includes('Menos')) return;
            if (fStatus === 'PENDENTE' && !statusColeta.includes('Pendente')) return;
            if (fStatus === 'OK' && !statusColeta.includes('OK')) return;
        }

        let fCol = FASES.find(f => f.id === 'col_mapa');
        let colPlanilha = tRef === 'baseline' ? fCol.colBase : fCol.colPlan;
        let dtPlan = extrairDataISO(l[colPlanilha]);
        
        let prazoStatus = "FUTURO";
        let isVencido = false;
        if (dtPlan && dtPlan <= dtHojeISO) {
            prazoStatus = "VENCIDO";
            isVencido = true;
        } else if (!dtPlan) {
            prazoStatus = "SEM_DATA";
        }

        if (fPrazo !== 'TODOS') {
            if (fPrazo === 'VENCIDO' && prazoStatus !== 'VENCIDO') return;
            if (fPrazo === 'FUTURO' && prazoStatus !== 'FUTURO') return;
        }

        let g = String(l["GRÁFICA"] || l["GRAFICA_FINAL"] || "N/A").toUpperCase().trim();

        let cd = String(l["CD DESTINO"] || l["CD"] || "N/A").toUpperCase().trim();
        let sku = String(l["SKU"] || "-").trim();
        let desc = String(l["DESCRIÇÃO"] || l["DESC_REAL"] || "-").trim();
        
        let tVencido = isVencido ? tPCP : 0;
        let difTotal = tMapa - tPCP; 
        let difPcp = tMapa - tColPcp;
        
        if (!resGrafica[g]) resGrafica[g] = { tirPcp: 0, tirVencido: 0, tirColPcp: 0, tirMapa: 0, skus: 0 };
        resGrafica[g].tirPcp += tPCP;
        resGrafica[g].tirVencido += tVencido;
        resGrafica[g].tirColPcp += tColPcp;
        resGrafica[g].tirMapa += tMapa;
        resGrafica[g].skus++;

        let keyM = m + " / " + cd;
        if (!resMarca[keyM]) resMarca[keyM] = { marca: m, cd: cd, tirPcp: 0, tirColPcp: 0, tirMapa: 0 };
        resMarca[keyM].tirPcp += tPCP;
        resMarca[keyM].tirColPcp += tColPcp;
        resMarca[keyM].tirMapa += tMapa;

        listaSkus.push({
            grafica: g, marcaCd: keyM, sku: sku, desc: desc,
            tPCP: tPCP, tColPcp: tColPcp, tMapa: tMapa,
            difTotal: difTotal, difPcp: difPcp,
            status: statusColeta, dtPlan: dtPlan ? formatarDataBR(dtPlan) : "S/ Data",
            isAtrasado: isVencido
        });
    });

    let htmlGraf = "";

        let d = resGrafica[g];
        
        let pctPcpTotal = d.tirPcp > 0 ? (d.tirColPcp / d.tirPcp) * 100 : 0;

        let pctMapaPcp = d.tirColPcp > 0 ? (d.tirMapa / d.tirColPcp) * 100 : 0;
        
        htmlGraf += `<tr class="border-b border-slate-100 hover:bg-slate-50">

            <td class="p-2 border-r border-slate-200 text-right font-bold text-indigo-700 bg-indigo-50/50">${window.formatarBR(d.tirMapa)}</td>
            <td class="p-2 border-r border-slate-200 text-center font-bold text-slate-600">${pctMapaTotal.toFixed(1)}%</td>
            <td class="p-2 border-r border-slate-200 text-center font-bold ${pctMapaVencido < 100 ? 'text-amber-600' : 'text-emerald-600'}">${pctMapaVencido.toFixed(1)}%</td>
            <td class="p-2 text-center font-black ${pctMapaPcp < 100 ? 'text-red-600' : (pctMapaPcp > 100 ? 'text-blue-600' : 'text-emerald-600')}">${pctMapaPcp.toFixed(1)}%</td>
        </tr>`;
    });
    document.getElementById('tbodyColetaResumo').innerHTML = htmlGraf || `<tr><td colspan="10" class="p-4 text-center font-bold text-slate-500 bg-slate-50">Nenhum dado atende aos filtros atuais.</td></tr>`;

    // 3. Renderiza Listas MICRO (SKU a SKU)
    let htmlMais = ""; let htmlMenos = ""; let countMais = 0; let countMenos = 0;

    listaSkus.sort((a, b) => Math.abs(b.difTotal) - Math.abs(a.difTotal));
    window.dadosExportacaoColetas = listaSkus; 

    listaSkus.forEach(i => {
        let tagAtraso = i.isAtrasado ? `<span class="bg-red-100 text-red-700 px-1.5 py-0.5 rounded ml-2 shadow-sm text-[8px] tracking-wider uppercase font-black border border-red-300">Vencido (${i.dtPlan})</span>` : `<span class="text-slate-400 ml-2 text-[8px] tracking-wider uppercase">Prazo: ${i.dtPlan}</span>`;
        
        let row = `<tr class="border-b border-slate-100 hover:bg-slate-50">
            <td class="p-2 border-r border-slate-100">${i.grafica}</td>
            <td class="p-2 border-r border-slate-100">${i.marcaCd}</td>
            <td class="p-2 border-r border-slate-100">
                <span class="font-bold text-slate-700">${i.sku}</span> ${tagAtraso}<br>
                <span class="text-[9px] text-slate-500">${i.desc}</span><br>
                <span class="text-[9px] font-black uppercase tracking-wider ${i.status.includes('Menos') || i.status.includes('Pendente') ? 'text-red-600' : (i.status.includes('Mais') ? 'text-emerald-600' : 'text-indigo-600')}">Status: ${i.status}</span>
            </td>
            <td class="p-2 border-r border-slate-100 text-right bg-slate-50">${window.formatarBR(i.tPCP)}</td>
            <td class="p-2 border-r border-slate-100 text-right font-bold text-emerald-700 bg-emerald-50">${window.formatarBR(i.tColPcp)}</td>
            <td class="p-2 border-r border-slate-100 text-right font-bold text-indigo-700 bg-indigo-50/50">${window.formatarBR(i.tMapa)}</td>
            <td class="p-2 border-r border-slate-100 text-right font-black ${i.difTotal < 0 ? 'text-red-600' : 'text-emerald-600'}">${i.difTotal > 0 ? '+' : ''}${window.formatarBR(i.difTotal)}</td>
            <td class="p-2 text-right font-black ${i.difPcp < 0 ? 'text-rose-600' : 'text-emerald-600'}">${i.difPcp > 0 ? '+' : ''}${window.formatarBR(i.difPcp)}</td>
        </tr>`;

        if (i.difTotal > 0 || fStatus === 'MAIS') { htmlMais += row; countMais++; }
        else if (i.difTotal < 0 || i.status.includes('Pendente') || fStatus === 'MENOS' || fStatus === 'PENDENTE') { htmlMenos += row; countMenos++; }
        else { htmlMenos += row; countMenos++; } 
    });

    document.getElementById('tbodyColetaMais').innerHTML = htmlMais || `<tr><td colspan="8" class="p-4 text-center text-slate-500 font-bold bg-slate-50">Tudo limpo nesta visão.</td></tr>`;
    document.getElementById('tbodyColetaMenos').innerHTML = htmlMenos || `<tr><td colspan="8" class="p-4 text-center text-slate-500 font-bold bg-slate-50">Tudo limpo nesta visão.</td></tr>`;
    
    let elBadgeMais = document.getElementById('badgeAMais'); if(elBadgeMais) elBadgeMais.innerText = `${countMais} OPs`;
    let elBadgeMenos = document.getElementById('badgeAMenos'); if(elBadgeMenos) elBadgeMenos.innerText = `${countMenos} OPs`;

    // 4. Tabelas Menores de Aderência
    let theadAderencia = `<tr class="bg-slate-800 text-white uppercase text-[9px]"><th class="p-2 border-r border-slate-600">Identificação</th><th class="p-2 text-right border-r border-slate-600">Vol Total PCP</th><th class="p-2 text-right border-r border-slate-600 text-emerald-200">Col. PCP</th><th class="p-2 text-right border-r border-slate-600 text-indigo-200">Col. Mapa</th><th class="p-2 text-center">% Mapa vs Total</th></tr>`;
    document.getElementById('theadColetaMarca').innerHTML = theadAderencia;
    document.getElementById('theadColetaGrafica').innerHTML = theadAderencia;

    const renderTbAder = (obj, tBodyId) => {
        let htmlAder = "";
        Object.keys(obj).sort().forEach(k => {
            let d = obj[k];
            let pct = d.tirPcp > 0 ? ((d.tirMapa / d.tirPcp) * 100) : 0;
            htmlAder += `<tr class="border-b border-slate-100 hover:bg-slate-50">
                <td class="p-2 border-r border-slate-200 font-bold">${k}</td>
                <td class="p-2 text-right border-r border-slate-200">${window.formatarBR(d.tirPcp)}</td>
                <td class="p-2 text-right border-r border-slate-200 text-emerald-700 bg-emerald-50">${window.formatarBR(d.tirColPcp)}</td>
                <td class="p-2 text-right border-r border-slate-200 font-bold text-indigo-700 bg-indigo-50/50">${window.formatarBR(d.tirMapa)}</td>
                <td class="p-2 text-center font-black ${pct < 100 ? 'text-amber-600' : 'text-emerald-600'}">${pct.toFixed(1)}%</td>
            </tr>`;
        });
        document.getElementById(tBodyId).innerHTML = htmlAder;
    };
    renderTbAder(resMarca, 'tbodyColetaMarca');
    renderTbAder(resGrafica, 'tbodyColetaGrafica');
};

// A Função de exportação permanece quase idêntica, mas adicionei o Campo do Prazo no CSV
window.exportarDivergenciasColetas = function() {
    if (!window.dadosExportacaoColetas || window.dadosExportacaoColetas.length === 0) { 
        alert("Nenhum dado na tela para exportar."); return; 
    }
    let csv = "\uFEFFGráfica;Marca/CD;SKU;Descrição;Status da Coluna AY;Data do PCP;Prazo Vencido;Tiragem PCP;Tiragem Mapa;Sobra/Falta (Dif)\n";
    window.dadosExportacaoColetas.forEach(i => {
        let descSafe = String(i.desc).replace(/;/g, ","); 
        let isAtrasado = i.isAtrasado ? "SIM" : "NAO";
        csv += `${i.grafica};${i.marcaCd};${i.sku};${descSafe};${i.status};${i.dtPlan};${isAtrasado};${i.tPCP};${i.tMapa};${i.dif}\n`;
    });
    let a = document.createElement("a"); 
    a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8;'})); 
    a.download = `Auditoria_Coletas_${new Date().toISOString().split('T')[0]}.csv`; 
    a.click();
};

</script>
