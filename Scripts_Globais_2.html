    window.iniciarAbaReentradasGerencial = function(forcar) {
        // BLINDAGEM: Garante que só vai no servidor se for explicitamente TRUE
        // Ignora eventos de clique de mouse que caem aqui sem querer
        let forcarAtualizacao = (forcar === true); 

        if (!window.DADOS_CHAMADOS_CACHE || window.DADOS_CHAMADOS_CACHE.length === 0 || forcarAtualizacao) {
            if(window.setLoading) window.setLoading(true, "Carregando Dados...");
            google.script.run.withSuccessHandler((dados) => {
                window.DADOS_CHAMADOS_CACHE = dados;
                window.filtrosGerIniciados = false; // Resetar para repopular listas
                window.processarReentradasGerencial();
                if(window.setLoading) window.setLoading(false);
            }).getDadosChamados();
        } else {
            window.processarReentradasGerencial();
        }
    };

window.processarReentradasGerencial = function() {
        if (!window.DADOS_CHAMADOS_CACHE) return;

        if (!window.filtrosGerIniciados) {
            ['Marca','Gráfica','Status Prod.','Resp. Chamado'].forEach(k => window.listasMultiGer[k].clear());
            
            window.DADOS_CHAMADOS_CACHE.forEach(l => {
                let id = window.getStr(l, COL.ID); if (!id || id === "-") return;
                
                let m = window.getStr(l, COL.MARCA).toUpperCase(); window.listasMultiGer['Marca'].add(m || "(Vazio)");
                let g = window.getStr(l, COL.GRAFICA).toUpperCase(); window.listasMultiGer['Gráfica'].add(g || "(Vazio)");
                let s = window.getStr(l, COL.STATUS_PROD); window.listasMultiGer['Status Prod.'].add(s || "(Vazio)");
                let r = window.getStr(l, COL.RESP).toUpperCase(); window.listasMultiGer['Resp. Chamado'].add(r || "(Vazio)");
            });

            let htmlFiltros = "";
            Object.keys(window.listasMultiGer).forEach(key => {
                let id = mapFiltrosGer[key];
                htmlFiltros += `<div class="relative filtro-container-ger z-[60]"><button id="btn-filtro-ger-${id}" onclick="window.toggleFilterMenuGer('${id}', event)" class="bg-white border border-slate-300 px-3 py-1.5 rounded-lg text-[10px] font-bold text-slate-700 hover:bg-slate-50 flex items-center gap-1 shadow-sm uppercase transition-colors">${key} <span class="text-[8px] opacity-60">▼</span></button><div id="menu-ger-${id}" class="menu-filtro-ger hidden absolute left-0 top-[calc(100%+4px)] bg-white border border-slate-200 shadow-xl rounded-xl w-60 p-2 z-[70]"><div class="flex justify-between items-center mb-2 pb-2 border-b"><button onclick="window.checkAllGer('${id}', true)" class="text-[9px] font-bold text-emerald-600">Todos</button><button onclick="window.checkAllGer('${id}', false)" class="text-[9px] font-bold text-red-600">Nenhum</button></div><div class="max-h-48 overflow-y-auto scroller">${Array.from(window.listasMultiGer[key]).sort().map(v => `<div class="flex justify-between items-center hover:bg-slate-50 p-1 group/item"><label class="flex items-start gap-2 text-[10px] cursor-pointer flex-1"><input type="checkbox" value="${v}" class="chk-ger-${id} mt-0.5" checked onchange="window.processarReentradasGerencial()"><span>${v}</span></label><button onclick="window.checkOnlyGer('${id}', '${v}')" class="hidden group-hover/item:block text-[8px] bg-indigo-50 px-1 py-0.5 rounded">Único</button></div>`).join('')}</div></div></div>`;
            });
            document.getElementById('containerFiltrosMultiGer').innerHTML = htmlFiltros;
            window.filtrosGerIniciados = true;
        }

        const getSel = (id) => new Set(Array.from(document.querySelectorAll(`.chk-ger-${id}:checked`)).map(cb => cb.value));
        let sel = { cat: getSel('Categoria'), prz: getSel('PrazoColeta'), mar: getSel('Marca'), gra: getSel('Grafica'), st: getSel('StatusProd'), res: getSel('RespChamado') };
        let buscaId = (document.getElementById('gerBuscaId')?.value || "").trim().toLowerCase();

        let reqMap = new Map();
        let totTodos = 0, totAbertos = 0, totConcluidos = 0, totCancelados = 0;
        
        let slaColOk = 0, slaColTot = 0, slaAbOk = 0, slaAbTot = 0;
        let slaGrafOk = 0, slaGrafTot = 0; 
        
        let catCounts = { '🚨 Reentradas P0': 0, '⚠️ Reentradas Rupturas': 0, '🛡️ Prev. + Defeito': 0, '👐 Manuseios': 0, '🔠 Adaptados': 0, '📌 Spots / Demais': 0 };
        let prazosCounts = { '⚠️ Em Atraso (< Hoje)': 0, '📅 Essa Semana': 0, '⏭️ Semana Seguinte': 0, '⏳ Futuro / Sem Data': 0 };
        let mapMarcaCat = {}, mapGraficaCat = {}, mapStatusCat = {};
        let mapColetaDiaria = {}; 
        
        let linhasTabela = []; // Array da Tabela para não quebrar o HTML

        window.DADOS_CHAMADOS_CACHE.forEach(l => {
            let idLine = window.getStr(l, COL.ID); if (!idLine || idLine === "-") return;
            
            let statusProd = window.getStr(l, COL.STATUS_PROD) || "(Vazio)";
            let spNorm = window.normText(statusProd);
            let macroSt = spNorm === "cancelado" ? "Cancelado" : (spNorm.includes("concluid") ? "Concluído" : "Aberto");

            let dtColeta = window.pegaDataDateSafe(window.getIdx(l, COL.COLETA));
            let rCat = window.getCategoriaSafe(window.getStr(l, COL.TIPO));
            let rPrazo = window.getPrazoCatSafe(dtColeta);
            let rMarca = window.getStr(l, COL.MARCA).toUpperCase() || "(Vazio)";
            let rGraf = window.getStr(l, COL.GRAFICA).toUpperCase() || "(Vazio)";
            let rResp = window.getStr(l, COL.RESP).toUpperCase() || "(Vazio)";

            if (buscaId !== "" && !idLine.toLowerCase().includes(buscaId)) return;
            if (!sel.cat.has(rCat) || !sel.prz.has(rPrazo) || !sel.mar.has(rMarca) || !sel.gra.has(rGraf) || !sel.st.has(statusProd) || !sel.res.has(rResp)) return;

            let reqKey = (window.getStr(l, COL.DESC) !== "-" ? window.getStr(l, COL.DESC) : idLine);
            if (!reqMap.has(reqKey)) {
                l._macroSt = macroSt; l._catWip = rCat; l._prazoColeta = rPrazo;
                reqMap.set(reqKey, l);
            }
        });

        reqMap.forEach(l => {
            totTodos++;
            if (l._macroSt === "Cancelado") totCancelados++;
            else if (l._macroSt === "Concluído") totConcluidos++;
            else totAbertos++;

            let dtA = window.pegaDataDateSafe(window.getIdx(l, COL.ABERTURA));
            let dtC = window.pegaDataDateSafe(window.getIdx(l, COL.COLETA));
            let dtD = window.pegaDataDateSafe(window.getIdx(l, COL.DT_DESEJADA));
            
            let strPrevReal = window.getStr(l, 17) || l[17] || "";
            let strFormalizada = window.getStr(l, 36) || l[36] || "";
            let dtPrevReal = window.pegaDataDateSafe(strPrevReal);
            let dtFormalizada = window.pegaDataDateSafe(strFormalizada);

            let m = window.getStr(l, COL.MARCA).toUpperCase() || "N/A";
            let g = window.getStr(l, COL.GRAFICA).toUpperCase() || "N/A";
            let s = window.getStr(l, COL.STATUS_PROD) || "N/A";

            if (l._macroSt !== "Cancelado") {
                if (dtA && dtC) { slaColTot++; if (Math.floor((dtC.getTime() - dtA.getTime())/86400000) <= 21) slaColOk++; }
                if (dtA && dtD) { slaAbTot++; if (Math.floor((dtD.getTime() - dtA.getTime())/86400000) >= 25) slaAbOk++; }
                
                // NOVO SLA BLINDADO (Garante que só faz a conta se a data for válida e numérica)
                if (dtPrevReal && dtFormalizada && !isNaN(dtPrevReal.getTime()) && !isNaN(dtFormalizada.getTime())) {
                    slaGrafTot++;
                    dtPrevReal.setHours(0,0,0,0); dtFormalizada.setHours(0,0,0,0);
                    if (dtPrevReal.getTime() <= dtFormalizada.getTime()) slaGrafOk++;
                }
            }

            if (l._macroSt === "Aberto") {
                catCounts[l._catWip]++;
                prazosCounts[l._prazoColeta]++;

                if(!mapMarcaCat[m]) mapMarcaCat[m] = { total: 0, cats: {} };
                mapMarcaCat[m].total++; mapMarcaCat[m].cats[l._catWip] = (mapMarcaCat[m].cats[l._catWip] || 0) + 1;

                if(!mapGraficaCat[g]) mapGraficaCat[g] = { total: 0, cats: {} };
                mapGraficaCat[g].total++; mapGraficaCat[g].cats[l._catWip] = (mapGraficaCat[g].cats[l._catWip] || 0) + 1;

                if(!mapStatusCat[s]) mapStatusCat[s] = { total: 0, cats: {} };
                mapStatusCat[s].total++; mapStatusCat[s].cats[l._catWip] = (mapStatusCat[s].cats[l._catWip] || 0) + 1;

                // GRÁFICO DE COLETAS BLINDADO (Ignora datas com erro de conversão)
                if (dtPrevReal && !isNaN(dtPrevReal.getTime())) {
                    let dtStr = dtPrevReal.toISOString().split('T')[0]; 
                    if(!mapColetaDiaria[dtStr]) mapColetaDiaria[dtStr] = { total: 0, marcas: {} };
                    mapColetaDiaria[dtStr].total++;
                    mapColetaDiaria[dtStr].marcas[m] = (mapColetaDiaria[dtStr].marcas[m] || 0) + 1;
                }
                
                let resC = dtA && dtC ? (Math.floor((dtC.getTime() - dtA.getTime())/86400000) <= 21 ? '✅ Sim':'❌ Não') : '-';
                
                linhasTabela.push(`<tr class="border-b border-slate-100 hover:bg-slate-50 text-[10px]">
                    <td class="p-2 border-r border-slate-200 font-bold">${window.getStr(l, COL.ID)}</td>
                    <td class="p-2 border-r border-slate-200 truncate max-w-[150px] font-semibold text-indigo-700" title="${window.getStr(l, COL.DESC)}">${window.getStr(l, COL.DESC) !== "-" ? window.getStr(l, COL.DESC) : "-"}</td>
                    <td class="p-2 border-r border-slate-200 text-slate-700 font-semibold">${window.getStr(l, 9) || "-"}</td>
                    <td class="p-2 border-r border-slate-200 font-semibold">${l._catWip}</td>
                    <td class="p-2 border-r border-slate-200">${m}</td>
                    <td class="p-2 border-r border-slate-200">${g}</td>
                    <td class="p-2 border-r border-slate-200 text-center font-mono">${window.formataDataBRSafe(dtA)}</td>
                    <td class="p-2 border-r border-slate-200 text-center font-mono">${window.formataDataBRSafe(dtC)}</td>
                    <td class="p-2 border-r border-slate-200 text-center font-mono font-bold">${window.formataDataBRSafe(dtPrevReal)}</td>
                    <td class="p-2 border-r border-slate-200 text-center font-mono font-bold text-purple-700 bg-purple-50/50">${window.formataDataBRSafe(dtFormalizada)}</td>
                    <td class="p-2 border-r border-slate-200 text-center font-bold ${resC.includes('✅')?'text-emerald-600':'text-red-600'}">${resC}</td>
                    <td class="p-2 text-slate-600">${s}</td>
                </tr>`);
            }
        });

        // 5. ATUALIZAR INTERFACE
        document.getElementById('kpiGerTodos').innerText = totTodos;
        document.getElementById('kpiGerAbertos').innerText = totAbertos;
        document.getElementById('kpiGerConcluidos').innerText = totConcluidos;
        document.getElementById('kpiGerCancelados').innerText = totCancelados;

        const setSla = (ok, tot, id, colorClass) => { let el = document.getElementById(id); if(tot===0){ el.innerText="-"; el.className="text-2xl font-black text-slate-400"; return; } let p = (ok/tot)*100; el.innerText = p.toFixed(1)+"%"; el.className=`text-2xl font-black ${p>=90?'text-emerald-600':(p>=80?'text-amber-500':'text-red-600')} ${colorClass||''}`; };
        setSla(slaColOk, slaColTot, 'kpiGerSlaCol');
        setSla(slaAbOk, slaAbTot, 'kpiGerSlaAbe');
        setSla(slaGrafOk, slaGrafTot, 'kpiGerSlaGrafica', '!text-purple-700');

        let hCats = "";
        const cCard = (lbl, val, cl) => `<div class="bg-white p-3 rounded-lg border shadow-sm flex flex-col items-center"><span class="text-[9px] font-bold text-slate-400 uppercase truncate w-full text-center">${lbl.substring(3)}</span><span class="text-2xl font-black ${cl}">${val}</span></div>`;
        hCats += cCard('🚨 P0', catCounts['🚨 Reentradas P0'], 'text-red-600');
        hCats += cCard('⚠️ Rupturas', catCounts['⚠️ Reentradas Rupturas'], 'text-rose-600');
        hCats += cCard('🛡️ Prev+Def', catCounts['🛡️ Prev. + Defeito'], 'text-amber-500');
        hCats += cCard('👐 Manuseios', catCounts['👐 Manuseios'], 'text-emerald-500');
        hCats += cCard('🔠 Adaptados', catCounts['🔠 Adaptados'], 'text-indigo-600');
        hCats += cCard('📌 Spots', catCounts['📌 Spots / Demais'], 'text-slate-600');
        document.getElementById('cardsGerCategorias').innerHTML = hCats;

        // INJEÇÃO DA TABELA (SEM LIMITE DE LINHAS)
        document.getElementById('tbGerencialBase').innerHTML = linhasTabela.length > 0 ? linhasTabela.join('') : `<tr><td colspan="12" class="p-4 text-center">Nenhum registro encontrado.</td></tr>`;

        // 6. GRÁFICOS
        const coresCat = { '🚨 Reentradas P0': '#ef4444', '⚠️ Reentradas Rupturas': '#e11d48', '🛡️ Prev. + Defeito': '#f59e0b', '👐 Manuseios': '#10b981', '🔠 Adaptados': '#4f46e5', '📌 Spots / Demais': '#64748b' };
        const coresMarcas = ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#64748b', '#06b6d4', '#f43f5e', '#84cc16', '#a855f7']; 

        const plugTop = { id:'pTop', afterDatasetsDraw(c){ const {ctx,data,scales:{y}}=c; ctx.font='bold 10px sans-serif'; ctx.fillStyle='#1e293b'; ctx.textAlign='center'; ctx.textBaseline='bottom'; for(let i=0; i<data.labels.length; i++){ let s=0; data.datasets.forEach(ds=>{if(!ds.hidden) s+=ds.data[i];}); if(s>0){ let m=c.getDatasetMeta(data.datasets.length-1); if(m.data[i]) ctx.fillText(s, m.data[i].x, y.getPixelForValue(s)-4); } } } };

        const drawStack = (id, obj, corObj) => {
            let ctx = document.getElementById(id); if(!ctx) return;
            let lbs = Object.keys(obj).sort((a,b)=>obj[b].total - obj[a].total);
            let ds = []; 
            Object.keys(corObj).forEach(c => { 
                let d = lbs.map(l => (obj[l].cats ? obj[l].cats[c] : obj[l].marcas[c]) || 0); 
                if(d.some(v=>v>0)) ds.push({label: c.replace(/[^\w\sÀ-ú]/gi, '').trim(), data:d, backgroundColor:corObj[c]}); 
            });
            if(window['chart_'+id]) window['chart_'+id].destroy();
            window['chart_'+id] = new Chart(ctx, { type:'bar', data:{labels:lbs, datasets:ds}, plugins:[plugTop], options:{ maintainAspectRatio:false, layout:{padding:{top:20}}, interaction: { mode: 'index', intersect: false }, plugins:{legend:{position:'bottom', labels:{boxWidth:8, font:{size:10}}}}, scales:{x:{stacked:true}, y:{stacked:true, display:false}} } });
        };

        drawStack('grafGerMarca', mapMarcaCat, coresCat);
        drawStack('grafGerGrafica', mapGraficaCat, coresCat);
        drawStack('grafGerStatus', mapStatusCat, coresCat);

        let ctxColeta = document.getElementById('grafGerColetaDiaria');
        if(ctxColeta) {
            let labelsDatas = Object.keys(mapColetaDiaria).sort();
            let todasAsMarcasUnicas = new Set();
            labelsDatas.forEach(dt => Object.keys(mapColetaDiaria[dt].marcas).forEach(m => todasAsMarcasUnicas.add(m)));
            
            let corMarcaDiaria = {};
            Array.from(todasAsMarcasUnicas).forEach((m, idx) => { corMarcaDiaria[m] = coresMarcas[idx % coresMarcas.length]; });
            
            let labelsFormatadas = labelsDatas.map(iso => { let [y,m,d] = iso.split('-'); return `${d}/${m}`; });

            let dsColeta = [];
            Array.from(todasAsMarcasUnicas).forEach(m => {
                let d = labelsDatas.map(dt => mapColetaDiaria[dt].marcas[m] || 0);
                if(d.some(v=>v>0)) dsColeta.push({label: m, data:d, backgroundColor:corMarcaDiaria[m]});
            });

            if(window.chart_grafGerColetaDiaria) window.chart_grafGerColetaDiaria.destroy();
            window.chart_grafGerColetaDiaria = new Chart(ctxColeta, { type:'bar', data:{labels:labelsFormatadas, datasets:dsColeta}, plugins:[plugTop], options:{ maintainAspectRatio:false, layout:{padding:{top:20}}, interaction: { mode: 'index', intersect: false }, plugins:{legend:{position:'bottom', labels:{boxWidth:8, font:{size:10}}}}, scales:{x:{stacked:true}, y:{stacked:true, display:false}} } });
        }

        let ctxP = document.getElementById('grafGerPrazos');
        if(ctxP) {
            if(window.chart_grafGerPrazos) window.chart_grafGerPrazos.destroy();
            window.chart_grafGerPrazos = new Chart(ctxP, { type:'bar', data:{labels:['Atrasado','Essa Sem','Próx Sem','Futuro'], datasets:[{label: 'Solicitações Abertas', data:[prazosCounts['⚠️ Em Atraso (< Hoje)'], prazosCounts['📅 Essa Semana'], prazosCounts['⏭️ Semana Seguinte'], prazosCounts['⏳ Futuro / Sem Data']], backgroundColor:['#ef4444','#f59e0b','#3b82f6','#cbd5e1'], borderRadius:4}]}, plugins:[plugTop], options:{ maintainAspectRatio:false, layout:{padding:{top:20}}, plugins:{legend:{display:false}}, scales:{y:{display:false}} } });
        }
    };


  // METAS OKR Q2
window.iniciarAbaOKRQ2 = function() {
    try {
        // Escuta os filtros globais do cabeçalho
        if (!window.okrFiltroListener) {
            document.querySelectorAll('select').forEach(sel => {
                if (sel.id && sel.id.toLowerCase().includes('filtro') && !sel.id.includes('OKR')) {
                    sel.addEventListener('change', () => {
                        if (document.getElementById('abaOKRQ2') && !document.getElementById('abaOKRQ2').classList.contains('hidden')) {
                            setTimeout(window.processarOKRQ2, 500); 
                        }
                    });
                }
            });
            window.okrFiltroListener = true;
        }

        // CARREGAMENTO DO MAPA DE SAÍDA COM DETECTOR DE ERROS
        if (!window.MAPA_SAIDA_CACHE) {
            let loading = document.getElementById('statusCarregamentoMapa');
            if(loading) {
                loading.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200');
                loading.classList.add('bg-amber-50', 'text-amber-600', 'border-amber-200', 'animate-pulse');
                loading.innerText = '⏳ Sincronizando Mapa de Saída...';
            }
            
            google.script.run
                .withSuccessHandler(function(dados) {
                    // Verifica se o backend mandou um erro disfarçado
                    if (dados && dados._ERRO_CRITICO) {
                        if(loading) {
                            loading.classList.remove('animate-pulse', 'bg-amber-50', 'text-amber-600', 'border-amber-200');
                            loading.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
                            loading.innerText = '❌ ' + dados._ERRO_CRITICO;
                        }
                        console.error(dados._ERRO_CRITICO);
                        return;
                    }
                    
                    window.MAPA_SAIDA_CACHE = dados || {};
                    if(loading) loading.classList.add('hidden');
                    window.processarOKRQ2(); // Processa os dados
                })
                .withFailureHandler(function(erro) {
                    // Se o Google Script der Timeout ou erro fatal de conexão
                    if(loading) {
                        loading.classList.remove('animate-pulse', 'bg-amber-50', 'text-amber-600', 'border-amber-200');
                        loading.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
                        loading.innerText = '❌ Falha de conexão com o Google Sheets.';
                    }
                    console.error("Erro Fatal no Google Script:", erro);
                })
                .getDadosMapaSaida_Cache();
        } else {
            window.processarOKRQ2();
        }
    } catch(e) {
        console.error("Erro ao iniciar a aba OKR:", e);
    }
};

window.processarOKRQ2 = function() {
    try {
        if (!window.MAPA_SAIDA_CACHE) return; 
        if (typeof dadosFiltrados === 'undefined' || !dadosFiltrados || dadosFiltrados.length === 0) return;

        const mapa = window.MAPA_SAIDA_CACHE;
        const qMetaOkr = document.getElementById('filtroOKRQuarterColeta')?.value || "TODOS";
        
        const dHoje = new Date();
        const dOntem = new Date(); dOntem.setDate(dHoje.getDate() - 1);
        const ontemIso = dOntem.toISOString().split('T')[0];
        
        let vFisico = { baseGeral: 0, baseOKR: 0, coletadaPrazo: 0, entreguePrazo: 0 };
        const initAder = () => ({ base: 0, entregueReal: 0, baseVencida: 0, noPrazoVencido: 0 });
        let totais = { col: initAder(), okr: initAder() };
        
        let aggGrafica = {}; let aggMarca = {}; 
        let aggResumo = {}; 
        let htmlTabela = "";
        let mapUnicoBase = {}; 
        let mapUnicoOKR = {};  

        const getQuarter = (dateStr) => {
            if(!dateStr) return "";
            const m = parseInt(dateStr.split('-')[1]);
            return m <= 3 ? "Q1" : m <= 6 ? "Q2" : m <= 9 ? "Q3" : "Q4";
        };

        const parseMeta = (v) => {
            if (!v) return null;
            let str = String(v).trim();
            if (str.includes('T')) str = str.split('T')[0];
            if (str.includes('/')) { 
                let p = str.split('/'); 
                if (p.length === 3) return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`; 
            }
            return str.substring(0, 10);
        };
        
        const fmtData = (d) => d ? d.split('-').reverse().join('/') : '-';

        dadosFiltrados.forEach(l => {
            const tiragem = window.arredondar(l["TIRAGEM"] || 0);
            if (tiragem <= 0) return;

            const metas = { okr: parseMeta(l["META_OKR_POS"] || null), col: parseMeta(l["META_COLETA_D"] || null) };

            if (qMetaOkr !== "TODOS" && (!metas.okr || getQuarter(metas.okr) !== qMetaOkr)) return;

            const kUnico = getKey(l);

            if (!mapUnicoBase[kUnico]) { mapUnicoBase[kUnico] = true; vFisico.baseGeral += tiragem; }

            if (!belongsToPhase(l, 'col')) return; 

            if (!mapUnicoOKR[kUnico]) { mapUnicoOKR[kUnico] = true; vFisico.baseOKR += tiragem; }

            const sku = l["SKU_REAL"] || l["SKU"] || "-";
            const desc = l["DESC_REAL"] || l["DESCRIÇÃO"] || l["PRODUTO"] || "";
            const g = l["GRAFICA_FINAL"] || l["GRÁFICA"] || "N/A";
            const m = l["MARCA_FINAL"] || l["UNIDADE"] || "N/A";
            const cd = l["CD_FINAL"] || l["CD"] || "N/A";
            const serie = String(l["SÉRIE"] || l["Série"] || l["SERIE"] || l["SÉRIES"] || "-").trim();
            const joinKey = String(l["JOIN_KEY"] || "").trim();

            const dtColetaReal = parseMeta(l["DT_ENTREGA_DG"] || null);

            let dtEntregaReal = "";
            if (g.includes("POSIGRAF") && cd.includes("POSIGRAF")) { 
                dtEntregaReal = dtColetaReal; 
            } else if (mapa[joinKey] && mapa[joinKey].length > 0) { 
                // 🎯 AJUSTADO PARA LER 'e.dataEntrega'
                dtEntregaReal = mapa[joinKey].reduce((max, e) => ((e.dataEntrega && e.dataEntrega > max) ? e.dataEntrega : max), ""); 
            }
            dtEntregaReal = parseMeta(dtEntregaReal);

            if(!aggGrafica[g]) aggGrafica[g] = { col: initAder(), okr: initAder() };
            if(!aggMarca[m]) aggMarca[m] = { col: initAder(), okr: initAder() };
            
            let kResumo = `${m}|${g}|${serie}|${cd}`;
            if(!aggResumo[kResumo]) aggResumo[kResumo] = { m, g, serie, cd, tiragemTotal: 0, col: initAder(), okr: initAder() };
            aggResumo[kResumo].tiragemTotal += tiragem;

            if (metas.col) {
                totais.col.base += tiragem;
                aggGrafica[g].col.base += tiragem;
                aggMarca[m].col.base += tiragem;
                aggResumo[kResumo].col.base += tiragem;
                
                if (dtColetaReal) {
                    totais.col.entregueReal += tiragem;
                    aggGrafica[g].col.entregueReal += tiragem;
                    aggMarca[m].col.entregueReal += tiragem;
                    aggResumo[kResumo].col.entregueReal += tiragem;
                }
                
                if (metas.col <= ontemIso) {
                    totais.col.baseVencida += tiragem;
                    aggGrafica[g].col.baseVencida += tiragem;
                    aggMarca[m].col.baseVencida += tiragem;
                    aggResumo[kResumo].col.baseVencida += tiragem;
                    
                    if (dtColetaReal && dtColetaReal <= metas.col) {
                        totais.col.noPrazoVencido += tiragem;
                        aggGrafica[g].col.noPrazoVencido += tiragem;
                        aggMarca[m].col.noPrazoVencido += tiragem;
                        aggResumo[kResumo].col.noPrazoVencido += tiragem;
                    }
                }
            }

            if (metas.okr) {
                totais.okr.base += tiragem;
                aggGrafica[g].okr.base += tiragem;
                aggMarca[m].okr.base += tiragem;
                aggResumo[kResumo].okr.base += tiragem;
                
                if (dtEntregaReal) {
                    totais.okr.entregueReal += tiragem;
                    aggGrafica[g].okr.entregueReal += tiragem;
                    aggMarca[m].okr.entregueReal += tiragem;
                    aggResumo[kResumo].okr.entregueReal += tiragem;
                }
                
                if (metas.okr <= ontemIso) {
                    totais.okr.baseVencida += tiragem;
                    aggGrafica[g].okr.baseVencida += tiragem;
                    aggMarca[m].okr.baseVencida += tiragem;
                    aggResumo[kResumo].okr.baseVencida += tiragem;
                    
                    if (dtEntregaReal && dtEntregaReal <= metas.okr) {
                        totais.okr.noPrazoVencido += tiragem;
                        aggGrafica[g].okr.noPrazoVencido += tiragem;
                        aggMarca[m].okr.noPrazoVencido += tiragem;
                        aggResumo[kResumo].okr.noPrazoVencido += tiragem;
                    }
                }
            }

            const statusCol = !metas.col ? "S/ Meta" : (dtColetaReal ? (dtColetaReal <= metas.col ? "No Prazo":"Atrasado") : "Pendente");
            const statusOkr = !metas.okr ? "S/ Meta" : (dtEntregaReal ? (dtEntregaReal <= metas.okr ? "No Prazo":"Atrasado") : "Pendente");
            let corStCol = statusCol === 'No Prazo' ? 'text-emerald-600' : (statusCol === 'Atrasado' ? 'text-rose-600' : 'text-slate-400');
            let corStOkr = statusOkr === 'No Prazo' ? 'text-emerald-600' : (statusOkr === 'Atrasado' ? 'text-rose-600' : 'text-slate-400');

            htmlTabela += `<tr class="border-b border-slate-100 hover:bg-slate-50">
                <td class="p-2 font-bold text-slate-400">${l["_SOURCE"] || "PCP"}</td>
                <td class="p-2 font-bold">${sku}</td>
                <td class="p-2 truncate max-w-[150px]" title="${desc}">${desc}</td>
                <td class="p-2">${g}</td><td class="p-2">${cd}</td>
                <td class="p-2 text-right font-bold border-r">${window.formatarBR(tiragem)}</td>
                <td class="p-2 text-center font-mono">${fmtData(dtColetaReal)}</td>
                <td class="p-2 text-center border-r bg-amber-50/30"><span class="font-mono text-slate-700">${fmtData(metas.col)}</span><br><span class="text-[9px] font-bold uppercase tracking-wider ${corStCol}">${statusCol}</span></td>
                <td class="p-2 text-center font-mono">${fmtData(dtEntregaReal)}</td>
                <td class="p-2 text-center bg-indigo-50/30"><span class="font-mono text-slate-700">${fmtData(metas.okr)}</span><br><span class="text-[9px] font-bold uppercase tracking-wider ${corStOkr}">${statusOkr}</span></td>
            </tr>`;
        });

        const setVal = (id, val) => { if(document.getElementById(id)) document.getElementById(id).innerText = val; };
        
        setVal('volBaseGeral', window.formatarBR(vFisico.baseGeral));
        setVal('volOkrTotal', window.formatarBR(vFisico.baseOKR));
        setVal('volOkrPendente', window.formatarBR(vFisico.baseOKR - totais.col.entregueReal));
        setVal('volOkrColetada', window.formatarBR(totais.col.entregueReal));
        setVal('volOkrCD', window.formatarBR(totais.okr.entregueReal));

        setVal('volOkrColetadaPrazo', window.formatarBR(totais.col.noPrazoVencido)); 
        setVal('volOkrEntreguePrazo', window.formatarBR(totais.okr.noPrazoVencido));

        ['COL', 'OKR'].forEach(key => {
            const k = key.toLowerCase();
            const bVencida = totais[k].baseVencida;
            const pzVencido = totais[k].noPrazoVencido;
            const pct = bVencida > 0 ? (pzVencido / bVencida) * 100 : 0;
            
            setVal(`okrAtual_${key}`, bVencida > 0 ? pct.toFixed(1) + "%" : "-");
            setVal(`volCompare_${key}_Pz`, window.formatarBR(pzVencido));
            setVal(`volCompare_${key}_Base`, window.formatarBR(bVencida));
        });

        document.getElementById('tbCorpoOKR').innerHTML = htmlTabela;
        window.gerarTabelasMatrizOKR(aggGrafica, aggMarca, aggResumo);

    } catch(e) { console.error("Erro OKR:", e); }
};

window.gerarTabelasMatrizOKR = function(aggGrafica, aggMarca, aggResumo) {
    const build = (obj, idTable) => {
        let keys = Object.keys(obj).sort();
        let h = `<thead class="bg-slate-100 border-b"><tr>
            <th class="p-2 sticky left-0 bg-slate-100 shadow-[1px_0_0_#e2e8f0]">Nome</th>
            <th class="p-2 text-right">Tiragem Total</th>
            <th class="p-2 text-right bg-amber-50">Meta Coleta (Até D-1)</th>
            <th class="p-2 text-right bg-amber-50">Coleta Pz (D-1)</th>
            <th class="p-2 text-center leading-tight bg-amber-50 border-r">% Coleta<br><span class="text-[8px] font-normal text-slate-500 uppercase tracking-widest">D-1</span></th>
            
            <th class="p-2 text-right bg-indigo-50">Meta Entrega (Até D-1)</th>
            <th class="p-2 text-right bg-indigo-50">Entrega Pz (D-1)</th>
            <th class="p-2 text-center leading-tight bg-indigo-50">% Entrega<br><span class="text-[8px] font-normal text-slate-500 uppercase tracking-widest">D-1</span></th>
        </tr></thead><tbody>`;

        keys.forEach(k => {
            const d = obj[k];
            
            const pCol = d.col.baseVencida > 0 ? ((d.col.noPrazoVencido / d.col.baseVencida) * 100).toFixed(1) : "-";
            const pOkr = d.okr.baseVencida > 0 ? ((d.okr.noPrazoVencido / d.okr.baseVencida) * 100).toFixed(1) : "-";
            
            const corCol = pCol !== "-" ? (pCol >= 90 ? 'text-emerald-600' : (pCol >= 75 ? 'text-amber-500' : 'text-rose-600')) : 'text-slate-400';
            const corOkr = pOkr !== "-" ? (pOkr >= 90 ? 'text-emerald-600' : (pOkr >= 75 ? 'text-indigo-500' : 'text-rose-600')) : 'text-slate-400';

            h += `<tr class="border-b hover:bg-slate-50">
                <td class="p-2 font-bold sticky left-0 bg-white shadow-[1px_0_0_#f1f5f9]">${k}</td>
                <td class="p-2 text-right text-slate-400 font-mono">${window.formatarBR(Math.max(d.col.base, d.okr.base))}</td>
                <td class="p-2 text-right text-amber-700 font-mono bg-amber-50/30">${window.formatarBR(d.col.baseVencida)}</td>
                <td class="p-2 text-right text-emerald-600 font-mono font-bold bg-amber-50/30">${window.formatarBR(d.col.noPrazoVencido)}</td>
                <td class="p-2 text-center font-black ${corCol} bg-amber-50/60 border-r">${pCol}${pCol !== '-' ? '%' : ''}</td>
                
                <td class="p-2 text-right text-indigo-700 font-mono bg-indigo-50/30">${window.formatarBR(d.okr.baseVencida)}</td>
                <td class="p-2 text-right text-emerald-600 font-mono font-bold bg-indigo-50/30">${window.formatarBR(d.okr.noPrazoVencido)}</td>
                <td class="p-2 text-center font-black ${corOkr} bg-indigo-50/60">${pOkr}${pOkr !== '-' ? '%' : ''}</td>
            </tr>`;
        });
        document.getElementById(idTable).innerHTML = h + "</tbody>";
    };

    const buildResumo = (obj, idTable) => {
        // 🎯 LÊ SE O FILTRO ESTÁ ATIVADO
        let chkFilter = document.getElementById('chkFiltroImpactadosOKR');
        let soImpactados = chkFilter ? chkFilter.checked : false;

        let keys = Object.keys(obj).sort(); 
        let h = `<thead class="bg-slate-100 border-b text-[9px] uppercase tracking-wider text-slate-500"><tr>
            <th class="p-2 sticky left-0 bg-slate-100 shadow-[1px_0_0_#e2e8f0] z-10">Marca</th>
            <th class="p-2 border-r border-slate-200">Gráfica</th>
            <th class="p-2 border-r border-slate-200">Série</th>
            <th class="p-2 border-r border-slate-200">CD Destino</th>
            <th class="p-2 text-right border-r border-slate-300">Tiragem Total</th>
            
            <th class="p-2 text-right bg-amber-50">Coleta (Meta D-1)</th>
            <th class="p-2 text-right bg-amber-50">Coletado Real</th>
            <th class="p-2 text-right bg-amber-50">No Prazo (D-1)</th>
            <th class="p-2 text-center bg-amber-50 border-r">% Col (D-1)</th>

            <th class="p-2 text-right bg-indigo-50">Entrega (Meta D-1)</th>
            <th class="p-2 text-right bg-indigo-50">Entregue CD</th>
            <th class="p-2 text-right bg-indigo-50">No Prazo (D-1)</th>
            <th class="p-2 text-center bg-indigo-50">% Ent (D-1)</th>
        </tr></thead><tbody>`;

        let linhasDesenhadas = 0;

        keys.forEach(k => {
            const d = obj[k];
            
            // 🎯 LÓGICA DO FILTRO: Verifica se a linha tem meta vencida E perdeu prazo
            let colImpactada = d.col.baseVencida > 0 && d.col.noPrazoVencido < d.col.baseVencida;
            let okrImpactada = d.okr.baseVencida > 0 && d.okr.noPrazoVencido < d.okr.baseVencida;

            // Se o filtro está ativo e a linha NÃO tem impacto, pula ela!
            if (soImpactados && !colImpactada && !okrImpactada) return;

            linhasDesenhadas++;
            
            const pCol = d.col.baseVencida > 0 ? ((d.col.noPrazoVencido / d.col.baseVencida) * 100).toFixed(1) : "-";
            const pOkr = d.okr.baseVencida > 0 ? ((d.okr.noPrazoVencido / d.okr.baseVencida) * 100).toFixed(1) : "-";
            
            const corCol = pCol !== "-" ? (pCol >= 90 ? 'text-emerald-600' : (pCol >= 75 ? 'text-amber-500' : 'text-rose-600')) : 'text-slate-400';

            h += `<tr class="border-b border-slate-100 hover:bg-slate-50 text-[10px]">
                <td class="p-2 font-bold text-slate-700 sticky left-0 bg-white shadow-[1px_0_0_#f1f5f9]">${d.m}</td>
                <td class="p-2 font-semibold text-slate-600 border-r border-slate-100">${d.g}</td>
                <td class="p-2 text-slate-500 border-r border-slate-100">${d.serie}</td>
                <td class="p-2 text-slate-500 border-r border-slate-100">${d.cd}</td>
                <td class="p-2 text-right font-black text-slate-700 border-r border-slate-200 bg-slate-50/50">${window.formatarBR(d.tiragemTotal)}</td>

function getValFromCols(row, cols) {
    for (let c of cols) { if (row[c] !== undefined && row[c] !== null) return row[c]; }
    return null;
}
function isDateFilled(val) {
    if (val === null || val === undefined) return false;
    let s = String(val).trim().toUpperCase();
    return s !== '' && s !== '-' && s !== 'N/A' && s !== '#N/A' && !s.includes('SEM DATA') && !s.includes('#REF!');
}
function parseValidDate(val) {
    if (!isDateFilled(val)) return null;
    if (typeof val.getTime === 'function') return val;
    let str = String(val).trim();
    if (str.includes('/')) {
        let p = str.split(' ')[0].split('/');
        if (p.length === 3) return new Date(p[2], p[1]-1, p[0], 0, 0, 0);
    }
    let d = new Date(str);
    return isNaN(d.getTime()) ? null : d;
}

// Chaves estáveis: sem tiragem, status, origem Principal/Congelados ou linha do PCP.
window.pgGiroChaveObs = function(tipo, chave) {
    const partes=String(chave == null ? '' : chave).split('|').map(v =>
        String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
            .replace(/\s+/g,' ').trim().toUpperCase());
    // Migração da chave anterior: gráfica|marca|SKU|tiragem|envio|CD.
    if (tipo==='SKU' && partes.length===6 && /^\d[\d.,]*$/.test(partes[3])) partes.splice(3,1);
    return partes.join('|');
};
window.pgGiroEscaparChaveObs = function(chave) {
    return String(chave).replace(/\\/g,'\\\\').replace(/'/g,"\\'")
        .replace(/&/g,'&amp;').replace(/"/g,'&quot;')
        .replace(/</g,'&lt;').replace(/>/g,'&gt;');
};
// Codifica a chave inteira para evitar colisão entre IDs antes truncados em 40 caracteres.
window.pgGiroIdCampoObs = function(prefixo,chave,sufixo) {
    return prefixo+'_'+Array.from(String(chave)).map(c => c.codePointAt(0).toString(16)).join('_')+
        (sufixo == null ? '' : '_'+sufixo);
};

// PG_GIRO_PRAZOS_V41
// TIRAGEM VENCIDA / A_Vencer e Coleta_TP. Sem usar Coleta Inicial/Final do PCP.
window.pgGiroSaldoPrazosV41 = function(linha, hoje) {
    const p = window.pgPrazoLinhaV35(linha, hoje);
    const n = v => Math.max(0, Number(v || 0));
    const v = n(p.vencida), a = n(p.aVencer);
    const temCampos = ['TIRAGEM VENCIDA', 'A_Vencer'].some(nome => {
        const x = window.pgCampoPrazoV35(linha, nome);
        return x !== null && x !== undefined && String(x).trim() !== '';
    });
    // A coleta só abate depois de Coleta_TP efetivamente preenchida.
    let disponivel = p.dtColeta && p.dtColeta <= hoje ? n(p.coletadaBruta) : 0;
    const eventos = [];
    const dias = data => data ? Math.round(
        (Date.parse(hoje + 'T00:00:00Z') - Date.parse(data + 'T00:00:00Z')) / 86400000
    ) : null;
    const incluir = (categoria, volume, data) => {
        if (volume > 0) eventos.push({ categoria, volume, data: data || '', dias: dias(data) });
    };
    // A alocação é sequencial; o coletado nunca é abatido duas vezes.
    const parcelas = [
        ['Tiragem vencida sem data', v && !p.dtVencida ? v : 0, null],
        ['Tiragem vencida', p.dtVencida && p.dtVencida <= hoje ? v : 0, p.dtVencida],
        ['A vencer - prazo já atingido', p.dtAVencer && p.dtAVencer <= hoje ? a : 0, p.dtAVencer],
        ['Tiragem vencida - prazo futuro', p.dtVencida && p.dtVencida > hoje ? v : 0, p.dtVencida],
        ['A vencer', p.dtAVencer && p.dtAVencer > hoje ? a : 0, p.dtAVencer],
        ['A vencer sem data', a && !p.dtAVencer ? a : 0, null]
    ];
    parcelas.forEach(([categoria, volume, data]) => {
        const saldo = Math.max(0, volume - disponivel);
        disponivel = Math.max(0, disponivel - volume);
        incluir(categoria, saldo, data);
    });
    const vencido = eventos.filter(e => e.dias !== null && e.dias >= 0)
        .reduce((s, e) => s + e.volume, 0);
    const futuro = eventos.filter(e => e.dias !== null && e.dias < 0)
        .reduce((s, e) => s + e.volume, 0);
    const semData = eventos.filter(e => e.dias === null)
        .reduce((s, e) => s + e.volume, 0);
    return { temCampos, eventos, vencido, futuro, semData,
        totalPendente: vencido + futuro + semData, coletaTP: p.dtColeta || '' };
};

    if (!tbody) return;

    const optAberto = document.getElementById('chkGiroAberto').checked;
    const optPos = document.getElementById('chkGiroPos') ? document.getElementById('chkGiroPos').checked : true;
    const optConcluido = document.getElementById('chkGiroConcluido').checked;
    const optCancelado = document.getElementById('chkGiroCancelado').checked;
    const minDias = parseInt(document.getElementById('sldGiroDiasMin').value);
    const maxDias = parseInt(document.getElementById('sldGiroDiasMax').value);
    const minRange = Math.min(minDias, maxDias);
    const maxRange = Math.max(minDias, maxDias);

    const grupos = {};
    const planosFinais = new Map();
    (window.pgObterResumoColeta().registros || []).forEach(r => {
        if (r.pcp && r.dtPlan && (!planosFinais.has(r.pcp) || planosFinais.get(r.pcp) < r.dtPlan)) planosFinais.set(r.pcp, r.dtPlan);
    });
    window.GIRO_DADOS_RAW.forEach(l => {
        const estadoMapa = window.pgEstadoColetaMapa(l);
        const prazoGiro = window.pgGiroSaldoPrazosV41(l, dtHojeISO);
        const statusColetaFonte = String(window.pgCampoColeta(l, 'STATUS COLETA') || '')
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
        const pendenteMapa = estadoMapa.pendente || prazoGiro.totalPendente > 0;
        const saldoColeta = prazoGiro.temCampos ? prazoGiro.totalPendente : estadoMapa.saldo;
        const coletadoAMenos = saldoColeta > 0 &&
            (estadoMapa.parcial || statusColetaFonte.includes('COLETADO A MENOS'));
        // ---> 1. TRAVA DA COLUNA EE <---
        // AY e saldo do mapa prevalecem sobre EE e sobre a data PCP para pendências de coleta
        let statusEE = String(l["STATUS_EE"] || "").trim().toUpperCase();
        if (!pendenteMapa && (statusEE === "OK" || statusEE === "NÃO COLETADO" || statusEE === "NAO COLETADO")) {
            return;
        }

        let statusFinalStr = 'Em Aberto';
        let ultEtapaStatus = String(l["Última Etapa"] || l["STATUS"] || l["Etapa Atual"] || "").toUpperCase();
        
        // Data real da coleta. No Pós, o tempo é contado desde a coleta realizada.
        let coletaReal = window.pgCampoColeta(l, 'Coleta_TP');

        if (ultEtapaStatus.includes("CANCEL")) {
            statusFinalStr = 'Cancelado';
        } else if (coletadoAMenos) {
            statusFinalStr = 'Coletado a menos';
        } else if (pendenteMapa) {
            statusFinalStr = 'Em Aberto';
        } else if (estadoMapa.concluida || ultEtapaStatus.includes("CONCLU") || ultEtapaStatus.includes("FINALIZADO") || isDateFilled(coletaReal)) {
            statusFinalStr = 'Concluído';
        }

        if (statusFinalStr === 'Concluído' && !optConcluido) return;
        if (statusFinalStr === 'Cancelado' && !optCancelado) return;
        if (statusFinalStr === 'Em Aberto' && !optAberto) return;
        if (statusFinalStr === 'Coletado a menos' && !optPos) return;

        let etapaPendente = '-';
        let diasAtraso = 0;
        let pendenciasFormatadas = []; 

        if (statusFinalStr === 'Coletado a menos') {
            if (!window.GIRO_ETAPAS_SELECIONADAS.has('Coletado a menos') && !window.GIRO_ETAPAS_SELECIONADAS.has('Coleta Mapa')) return;

            let dtColetaPos = parseValidDate(coletaReal);
            let diasDesdeColeta = null;
            if (dtColetaPos) {
                const hojePos = new Date();
                hojePos.setHours(0, 0, 0, 0);
                dtColetaPos.setHours(0, 0, 0, 0);
                diasDesdeColeta = Math.max(0, Math.floor((hojePos - dtColetaPos) / 86400000));
            }

            // V42: Pós respeita o filtro de dias por parcela, inclusive futuro.
            // Converter dias de atraso em escala do seletor (atraso = negativo).
            const eventosPosVisiveis = prazoGiro.eventos.filter(e => {
                const escala = e.dias === null ? 0 : -e.dias;
                return escala >= minRange && escala <= maxRange;
            });
            if (!eventosPosVisiveis.length && prazoGiro.temCampos) return;
            if (!prazoGiro.temCampos && !(minRange <= 0 && maxRange >= 0)) return;
            etapaPendente = 'Coletado a menos + Coleta Mapa';
            diasAtraso = eventosPosVisiveis.length
                ? Math.max(...eventosPosVisiveis.map(e => e.dias === null ? 0 : e.dias)) : 0;
            pendenciasFormatadas.push(
                `<div class="leading-tight">Coletado a menos${
                    diasDesdeColeta === null
                        ? '<span class="block text-[9px] text-slate-500 mt-0.5">Data da coleta não disponível</span>'
                        : `<span class="block text-[9px] text-rose-600 font-bold mt-0.5">Coleta realizada há ${diasDesdeColeta} ${diasDesdeColeta === 1 ? 'dia' : 'dias'}</span>`
                }</div>`
            );
            // Exibir as parcelas vencidas, futuras e sem data no Pós.
            eventosPosVisiveis.forEach(e => {
                const qtd = window.formatarBR ? window.formatarBR(e.volume) : e.volume;
                const prazoTexto = e.dias === null ? 'sem data' :
                    (e.dias > 0 ? `vencido há ${e.dias} dias` :
                    e.dias < 0 ? `vence em ${Math.abs(e.dias)} dias` : 'vence hoje');
                pendenciasFormatadas.push(`<div class="text-[9px] mt-0.5 ${e.dias !== null && e.dias >= 0 ? 'text-rose-600' : 'text-blue-600'}">${e.categoria}: ${qtd} un. (${prazoTexto})</div>`);
            });
            l.__GIRO_DIAS_POS = diasDesdeColeta;
        }

        if (statusFinalStr === 'Em Aberto') {
            let etapaProd = null;
            let diasProd = 0;
            
            // 1. Encontra a pendência de PRODUÇÃO
            for (let i = 0; i < ETAPAS_MAPA.length; i++) {
                let e = ETAPAS_MAPA[i];
                if (e.nome === 'Coleta Mapa' || e.nome.includes('Val. Custos') || e.nome.includes('O.C.')) continue;
                
                let valReal = getValFromCols(l, e.real);
                let valPlan = getValFromCols(l, e.plan);

                if (!isDateFilled(valReal) && isDateFilled(valPlan)) {
                    let dPlan = parseValidDate(valPlan);
                    if (dPlan) {
                        let dHoje = new Date(); dHoje.setHours(0,0,0,0); dPlan.setHours(0,0,0,0);
                        diasProd = Math.floor((dHoje - dPlan) / (1000 * 60 * 60 * 24));
                        etapaProd = e.nome;
                        break;
                    }
                }
            }

            // 2. Encontra a pendência de Validação de Custos
            let etapaCustos = null;
            let diasCustos = 0;
            const mtCustos = ETAPAS_MAPA.filter(e => e.nome.includes('Val. Custos'));
            for (let e of mtCustos) {
                let valReal = getValFromCols(l, e.real);
                let valPlan = getValFromCols(l, e.plan);
                if (!isDateFilled(valReal) && isDateFilled(valPlan)) {
                    let dPlan = parseValidDate(valPlan);
                    if (dPlan) {
                        let dHoje = new Date(); dHoje.setHours(0,0,0,0); dPlan.setHours(0,0,0,0);
                        diasCustos = Math.floor((dHoje - dPlan) / (1000 * 60 * 60 * 24));
                        etapaCustos = e.nome;
                        break;
                    }
                }
            }

            // 3. Verifica a O.C.
            let etapaOC = null;
            let diasOC = 0;
            if (!etapaCustos) {
                const mtOC = ETAPAS_MAPA.filter(e => e.nome.includes('O.C.'));
                for (let e of mtOC) {
                    let valReal = getValFromCols(l, e.real);
                    let valPlan = getValFromCols(l, e.plan);
                    if (!isDateFilled(valReal) && isDateFilled(valPlan)) {
                        let dPlan = parseValidDate(valPlan);
                        if (dPlan) {
                            let dHoje = new Date(); dHoje.setHours(0,0,0,0); dPlan.setHours(0,0,0,0);
                            diasOC = Math.floor((dHoje - dPlan) / (1000 * 60 * 60 * 24));
                            etapaOC = e.nome;
                            break;
                        }
                    }
                }
            }

            // 4. O SEGREDO: Aplica o filtro de botões E o SLIDER numérico individualmente para cada etapa
            let selecionadas = [];
            
            const validaNoSlider = (d) => {
                let esc = -d;
                return (esc >= minRange && esc <= maxRange);
            };

            if (etapaProd && window.GIRO_ETAPAS_SELECIONADAS.has(etapaProd) && validaNoSlider(diasProd)) {
                selecionadas.push({ nome: etapaProd, dias: diasProd });
            }
            if (etapaCustos && window.GIRO_ETAPAS_SELECIONADAS.has(etapaCustos) && validaNoSlider(diasCustos)) {
                selecionadas.push({ nome: etapaCustos, dias: diasCustos });
            } else if (etapaOC && window.GIRO_ETAPAS_SELECIONADAS.has(etapaOC) && validaNoSlider(diasOC)) {
                selecionadas.push({ nome: etapaOC, dias: diasOC });
            }

            if (pendenteMapa && window.GIRO_ETAPAS_SELECIONADAS.has('Coleta Mapa')) {
                const itensPrazo = prazoGiro.temCampos ? prazoGiro.eventos :
                    [{ categoria:'Saldo de coleta sem data', volume:estadoMapa.saldo, data:'', dias:null }];
                itensPrazo.forEach(e => {
                    if (!(e.volume > 0)) return;
                    const atraso = e.dias === null ? 0 : e.dias;
                    if (e.dias !== null && !validaNoSlider(atraso)) return;
                    selecionadas.push({ nome:'Coleta Mapa', dias:atraso,
                        semPrazo:e.dias === null, tipoPrazo:e.categoria,
                        volume:e.volume });
                });
            }

            // Se NENHUMA pendência passar nos botões + slider simultaneamente, oculta a linha inteira!
            if (selecionadas.length === 0) return; 

            etapaPendente = selecionadas.map(s => s.nome).join(' + ');
            diasAtraso = Math.max(...selecionadas.map(s => s.dias)); // Pior atraso serve apenas para ordenação da tabela

            // Monta o visual apenas para o que passou rigorosamente pelos dois filtros
            selecionadas.forEach(s => {
                let lbl = '';
                let escala = -s.dias;
                if (escala <= -3) lbl = `<span class="font-bold text-red-600 block text-[9px] mt-0.5 mb-1">Vencido há ${Math.abs(escala)} dias</span>`;
                else if (escala < 0) lbl = `<span class="font-bold text-amber-600 block text-[9px] mt-0.5 mb-1">Vencido há ${Math.abs(escala)} dias</span>`;
                else if (escala > 0) lbl = `<span class="font-bold text-blue-600 block text-[9px] mt-0.5 mb-1">Vence em ${escala} dias</span>`;
                else lbl = `<span class="font-bold text-emerald-600 block text-[9px] mt-0.5 mb-1">Vence hoje</span>`;
                
                if (s.semPrazo) lbl = '<span class="block text-xs">Sem prazo de coleta</span>';
                // ---> 2. CÁLCULO DE DIAS DA COLETA PCP <---
                if (s.nome === 'Coleta Mapa' || s.nome === 'Entrega TP') {
                    let dtColetaPCP = window.pgNormalizarDataColeta(window.pgCampoColeta(l, 'Coleta_TP'), dtHojeISO);
                    if (dtColetaPCP) {
                        let diasDesdeColetaPCP = calcDiffDiasISO(dtColetaPCP, dtHojeISO);
                        lbl += `<span class="text-[9px] text-indigo-600 font-bold block mt-0.5 mb-1">(Há ${diasDesdeColetaPCP} dias da Coleta PCP)</span>`;
                    }
                }

                // ---> 3. CÁLCULO DA DIFERENÇA DE INTERNALIZAÇÃO <---
                let tBase = window.arredondar(l["TIRAGEM"] || l["QUANTIDADE"]);
                let fInt = FASES.find(f => f.id === 'int_cd');
                if (fInt && s.nome !== 'Coleta Mapa') {
                    let volInternalizado = window.getVolFase ? window.getVolFase(l, fInt, tBase) : tBase;
                    let difInternalizacao = tBase - volInternalizado;
                    
                    if (difInternalizacao > 0) {
                        lbl += `<span class="text-[9px] text-rose-500 font-bold block mt-0.5 mb-1">(Faltam ${window.formatarBR(difInternalizacao)} un. na Internalização)</span>`;
                    }
                }

                const volLabel = s.volume > 0 ?
                    `<span class="block text-[9px] text-slate-600">${window.formatarBR ? window.formatarBR(s.volume) : s.volume} un.</span>` : '';
                pendenciasFormatadas.push(`<div class="leading-tight">${s.nome}${s.tipoPrazo ? ' — ' + s.tipoPrazo : ''}${lbl}${volLabel}</div>`);
            });
        }

        let escalaSlider = -diasAtraso;

        if (statusFinalStr === 'Em Aberto') {
            // Redundância de segurança geral da linha
            if (!(etapaPendente.includes('Coleta Mapa') && !(planosFinais.get(l) || window.pgDataPlanoColetaLinha(l))) && (escalaSlider < minRange || escalaSlider > maxRange)) return;
        }

        let grafica = String(l["GRAFICA_FINAL"] || l["GRÁFICA"] || "N/A").trim();
        let marca = String(l["UNIDADE"] || l["MARCA_FINAL"] || "N/A").trim();
        let serie = String(l["SÉRIE"] || l["Série"] || l["SERIE"] || "-").trim();
        let envio = String(l["ENVIO"] || l["Envio"] || "-").trim();
        let cd = String(l["CD DESTINO"] || l["CD_FINAL"] || l["CD"] || "-").trim();
        let sku = String(l["SKU_REAL"] || l["SKU"] || "-").trim();
        let tiragemBase = window.arredondar ? window.arredondar(l["TIRAGEM"] || l["QUANTIDADE"] || 0) : 0;
        let ehLinhaColeta = coletadoAMenos || etapaPendente.includes('Coleta Mapa');
        let tiragemExibida = ehLinhaColeta ? saldoColeta : tiragemBase;

        // CHAVE DE AGRUPAMENTO 100% BLINDADA (Identidade Absoluta)
        let chaveGrupo = window.pgGiroChaveObs('MASTER', `${grafica}|${marca}|${serie}|${envio}|${cd}`);

        if (!grupos[chaveGrupo]) {
            grupos[chaveGrupo] = { 
                grafica: grafica, marca: marca, serie: serie, envio: envio, cd: cd,
                skus: [], tiragemTotal: 0, tiragemNormal: 0, piorEscala: 999, diasPos: null,
                statusGrupo: statusFinalStr, pendencias: new Set() 
            };
        }

        if (ehLinhaColeta) {
            const grupoSaldo = grupos[chaveGrupo];
            grupoSaldo.coletadoAMenos = true;
            if (!grupoSaldo.saldosColeta) grupoSaldo.saldosColeta = new Map();

            // BA/AZ repetidos na mesma JOIN_KEY contam uma única vez no total do grupo.
            const chaveSaldo = String(l["JOIN_KEY"] || `${grafica}|${marca}|${sku}|${envio}|${cd}`);
            grupoSaldo.saldosColeta.set(chaveSaldo, Math.max(grupoSaldo.saldosColeta.get(chaveSaldo) || 0, tiragemExibida));

            if (Number.isFinite(l.__GIRO_DIAS_POS)) {
                grupoSaldo.diasPos = grupoSaldo.diasPos === null
                    ? l.__GIRO_DIAS_POS
                    : Math.max(grupoSaldo.diasPos, l.__GIRO_DIAS_POS);
            }
        } else {
            grupos[chaveGrupo].tiragemNormal += tiragemExibida;
        }

        const prioridadeStatus = { 'Concluído': 1, 'Em Aberto': 2, 'Coletado a menos': 3, 'Cancelado': 4 };
        if ((prioridadeStatus[statusFinalStr] || 0) > (prioridadeStatus[grupos[chaveGrupo].statusGrupo] || 0)) {
            grupos[chaveGrupo].statusGrupo = statusFinalStr;
        }
        if (etapaPendente !== '-') {
            let partes = etapaPendente.split(' + ');
            partes.forEach(p => grupos[chaveGrupo].pendencias.add(p));
        }
        if (escalaSlider < grupos[chaveGrupo].piorEscala && statusFinalStr === 'Em Aberto') grupos[chaveGrupo].piorEscala = escalaSlider;

        // CHAVE DO SKU BLINDADA
        let superChaveSku = window.pgGiroChaveObs('SKU', `${grafica}|${marca}|${sku}|${envio}|${cd}`);

        grupos[chaveGrupo].skus.push({
            chaveUnica: superChaveSku,
            sku: sku,
            grafica: grafica,
            cd: cd,
            descricao: l["DESC_REAL"] || l["DESCRIÇÃO"] || l["PRODUTO"] || "-",
            tiragem: tiragemExibida,
            statusLinha: statusFinalStr,
            pendencia: etapaPendente,
            pendenciaHtml: pendenciasFormatadas.length > 0 ? pendenciasFormatadas.join('') : '-',
            escala: escalaSlider
        });

        const grupoAtual = grupos[chaveGrupo];
        const saldosUnicos = grupoAtual.saldosColeta ?
            Array.from(grupoAtual.saldosColeta.values()).reduce((s, v) => s + v, 0) : 0;
        grupoAtual.tiragemTotal = grupoAtual.tiragemNormal + saldosUnicos;
    });

    window.calcularTempoObs = function(dataString) {
    if (!dataString) return { texto: "Sem observação", dias: Infinity };
    
    let parts = String(dataString).split(/[\s/:]+/);
    let dataObs = new Date();
    if(parts.length >= 3) {
        dataObs = new Date(parts[2], parts[1]-1, parts[0], parts[3]||0, parts[4]||0);
    } else {
        dataObs = new Date(dataString);
    }

    if (isNaN(dataObs)) return { texto: "Sem observação", dias: Infinity };

    let hoje = new Date();
    let diffMs = Math.abs(hoje - dataObs);
    let diffDias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    
    let texto = "";
    if (diffDias === 0) texto = "Atualizado hoje";
    else if (diffDias === 1) texto = "Atualizado há 1 dia";
    else if (diffDias < 30) texto = `Atualizado há ${diffDias} dias`;
    else if (diffDias < 365) {
        let meses = Math.floor(diffDias / 30);
        texto = `Atualizado há ${meses} ${meses === 1 ? 'mês' : 'meses'}`;
    } else {
        let anos = Math.floor(diffDias / 365);
        texto = `Atualizado há ${anos} ${anos === 1 ? 'ano' : 'anos'}`;
    }
    
    return { texto: texto, dias: diffDias };
};

let arrGrupos = Object.values(grupos);

    const obsStatusFiltro = document.getElementById('filtroObsStatus') ? document.getElementById('filtroObsStatus').value : 'TODOS';
    const obsDiasMinFiltro = document.getElementById('filtroObsDiasMin') ? document.getElementById('filtroObsDiasMin').value : '';
    const obsDiasMaxFiltro = document.getElementById('filtroObsDiasMax') ? document.getElementById('filtroObsDiasMax').value : '';
    const minDiasObs = obsDiasMinFiltro === "" ? null : parseInt(obsDiasMinFiltro);
    const maxDiasObs = obsDiasMaxFiltro === "" ? null : parseInt(obsDiasMaxFiltro);

    arrGrupos = arrGrupos.filter(g => {
        let chaveMaster = window.pgGiroChaveObs('MASTER', `${g.grafica}|${g.marca}|${g.serie}|${g.envio}|${g.cd}`);
        let histMaster = (window.HISTORICO_OBS_GIRO && window.HISTORICO_OBS_GIRO.master && window.HISTORICO_OBS_GIRO.master[chaveMaster]) ? window.HISTORICO_OBS_GIRO.master[chaveMaster] : [];
        let ultimaObsObj = histMaster.length > 0 ? histMaster[0] : null;
        let tempoObs = window.calcularTempoObs(ultimaObsObj ? ultimaObsObj.data : null);

        if (obsStatusFiltro === "ATUALIZADO" && !ultimaObsObj) return false;
        if (obsStatusFiltro === "NAO_ATUALIZADO" && ultimaObsObj) return false;
        
        if (ultimaObsObj) {
            if (minDiasObs !== null && tempoObs.dias < minDiasObs) return false;
            if (maxDiasObs !== null && tempoObs.dias > maxDiasObs) return false;
        }
        return true;
    });

    window.pgGiroLinhasExportar = arrGrupos.flatMap(g => g.skus.map(l => ({
        grafica: g.grafica, marca: g.marca, serie: g.serie, sku: l.sku, desc: l.descricao,
        status: l.statusLinha, pendencia: l.pendencia, dias: l.escala, tiragem: l.tiragem
    })));

    if (arrGrupos.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="p-6 text-center text-slate-500 font-bold bg-slate-50">Nenhum registro atende aos filtros atuais.</td></tr>`;
        return;
    }

    // APLICA ORDENAÇÃO MÚLTIPLA
    arrGrupos.sort((a, b) => {
        if (window.GIRO_SORT_RULES.length === 0) return b.tiragemTotal - a.tiragemTotal; 
        
        for (let rule of window.GIRO_SORT_RULES) {
            let valA, valB;
            if (rule.col === 'grafica') { valA = a.grafica; valB = b.grafica; }
            else if (rule.col === 'marca') { valA = a.marca; valB = b.marca; }
            else if (rule.col === 'serie') { valA = a.serie; valB = b.serie; }
            else if (rule.col === 'qtd') { valA = a.skus.length; valB = b.skus.length; }
            else if (rule.col === 'status') { valA = a.statusGrupo; valB = b.statusGrupo; }
            else if (rule.col === 'pendencia') { valA = a.piorEscala; valB = b.piorEscala; }
            else { valA = a.tiragemTotal; valB = b.tiragemTotal; }
            
            if (valA < valB) return rule.dir === 'asc' ? -1 : 1;
            if (valA > valB) return rule.dir === 'asc' ? 1 : -1;
        }
        return 0;
    });

    ['grafica', 'marca', 'serie', 'status', 'pendencia', 'qtd', 'tiragemTotal'].forEach(k => {
        let el = document.getElementById(`sort_${k}`);
        if (el) {
            let ruleIndex = window.GIRO_SORT_RULES.findIndex(r => r.col === k);
            if (ruleIndex === 0) {
                el.innerHTML = window.GIRO_SORT_RULES[ruleIndex].dir === 'asc' ? ' 🔼' : ' 🔽';
            } else if (ruleIndex > 0) {
                el.innerHTML = window.GIRO_SORT_RULES[ruleIndex].dir === 'asc' ? ` <span class="text-[9px] text-indigo-400 font-bold">(↑${ruleIndex+1})</span>` : ` <span class="text-[9px] text-indigo-400 font-bold">(↓${ruleIndex+1})</span>`;
            } else {
                el.innerHTML = '';
            }
        }
    });

    let html = '';
    arrGrupos.forEach((g, indexGrupo) => {
        const idSubTabela = `detalhe_giro_${indexGrupo}`;
        let pendenciasStr = g.pendencias.size > 0 ? Array.from(g.pendencias).join(', ') : '-';

        let prazoMasterLabel = '';
        let corStatusMaster =
            g.statusGrupo === 'Concluído' ? 'bg-emerald-100 text-emerald-800' :
            g.statusGrupo === 'Cancelado' ? 'bg-slate-200 text-slate-700' :
            g.statusGrupo === 'Coletado a menos' ? 'bg-rose-100 text-rose-700' :
            'bg-indigo-100 text-indigo-800';

        if (g.statusGrupo === 'Coletado a menos') {
            prazoMasterLabel = g.diasPos === null
                ? `<span class="text-xs font-bold text-slate-500 block mt-0.5">Data da coleta não disponível</span>`
                : `<span class="text-xs font-black text-rose-600 block mt-0.5">Coleta realizada há ${g.diasPos} ${g.diasPos === 1 ? 'dia' : 'dias'}</span>`;
        } else if (g.statusGrupo === 'Em Aberto' && g.piorEscala !== 999) {
            if (g.piorEscala <= -3) prazoMasterLabel = `<span class="text-xs font-black text-red-600 block mt-0.5">Vencido há ${Math.abs(g.piorEscala)} dias</span>`;

            let histSku = (window.HISTORICO_OBS_GIRO && window.HISTORICO_OBS_GIRO.sku && window.HISTORICO_OBS_GIRO.sku[chaveSku]) ? window.HISTORICO_OBS_GIRO.sku[chaveSku] : [];
            let ultimaObsSku = histSku.length > 0 ? histSku[0].obs.replace(/"/g, '&quot;') : "";

};
window.renderizarDashColetas = function() {
    if (!document.getElementById('abaColetas') || !dadosFiltrados) return;

    let resGrafica = {};
    let resMarca = {};
    let listaSkus = [];
    
    let fStatus = document.getElementById('filtroStatusColeta') ? document.getElementById('filtroStatusColeta').value : 'TODOS';
    let fPrazo = document.getElementById('filtroPrazoColeta') ? document.getElementById('filtroPrazoColeta').value : 'TODOS';
    let tRef = document.getElementById('filtroReferencia').value || 'replan';

    // 1. Processamento da Base
    dadosFiltrados.forEach(l => {
        let tPCP = window.arredondar(l["TIRAGEM"] || l["QUANTIDADE"]);
        if (tPCP <= 0) return;
        
        let tMapa = window.arredondar(l["TIRAGEM COLETADA"] || l["COLETADA_MAPA"] || 0);
        let statusColeta = String(l["STATUS COLETA"] || l["Status Coleta"] || "Não Analisado").trim();
        
        let dataRealPcp = extrairDataISO(l["DT_ENTREGA_DG"] || l["Coleta/Internalização de estoque Final Real"]);
        let tColPcp = dataRealPcp ? tPCP : 0; 

        if (fStatus !== 'TODOS') {
            if (fStatus === 'MAIS' && !statusColeta.includes('Mais')) return;
            if (fStatus === 'MENOS' && !statusColeta.includes('Menos')) return;
            if (fStatus === 'PENDENTE' && !statusColeta.includes('Pendente')) return;
            if (fStatus === 'OK' && !statusColeta.includes('OK')) return;
        }

        let fCol = FASES.find(f => f.id === 'col_mapa');
        let colPlanilha = tRef === 'baseline' ? fCol.colBase : fCol.colPlan;
        let dtPlan = extrairDataISO(l[colPlanilha]);
        
        let prazoStatus = "FUTURO";
        let isVencido = false;
        if (dtPlan && dtPlan <= dtHojeISO) {
            prazoStatus = "VENCIDO";
            isVencido = true;
        } else if (!dtPlan) {
            prazoStatus = "SEM_DATA";
        }

        if (fPrazo !== 'TODOS') {
            if (fPrazo === 'VENCIDO' && prazoStatus !== 'VENCIDO') return;
            if (fPrazo === 'FUTURO' && prazoStatus !== 'FUTURO') return;
        }

        let g = String(l["GRÁFICA"] || l["GRAFICA_FINAL"] || "N/A").toUpperCase().trim();
        let m = String(l["UNIDADE"] || l["MARCA_FINAL"] || "N/A").toUpperCase().trim();
        let cd = String(l["CD DESTINO"] || l["CD"] || "N/A").toUpperCase().trim();
        let sku = String(l["SKU"] || "-").trim();
        let desc = String(l["DESCRIÇÃO"] || l["DESC_REAL"] || "-").trim();
        
        let tVencido = isVencido ? tPCP : 0;
        let difTotal = tMapa - tPCP; 
        let difPcp = tMapa - tColPcp;
        
        if (!resGrafica[g]) resGrafica[g] = { tirPcp: 0, tirVencido: 0, tirColPcp: 0, tirMapa: 0, skus: 0 };
        resGrafica[g].tirPcp += tPCP;
        resGrafica[g].tirVencido += tVencido;
        resGrafica[g].tirColPcp += tColPcp;
        resGrafica[g].tirMapa += tMapa;
        resGrafica[g].skus++;

        let keyM = m + " / " + cd;
        if (!resMarca[keyM]) resMarca[keyM] = { marca: m, cd: cd, tirPcp: 0, tirColPcp: 0, tirMapa: 0 };
        resMarca[keyM].tirPcp += tPCP;
        resMarca[keyM].tirColPcp += tColPcp;
        resMarca[keyM].tirMapa += tMapa;

        listaSkus.push({
            grafica: g, marcaCd: keyM, sku: sku, desc: desc,
            tPCP: tPCP, tColPcp: tColPcp, tMapa: tMapa,
            difTotal: difTotal, difPcp: difPcp,
            status: statusColeta, dtPlan: dtPlan ? formatarDataBR(dtPlan) : "S/ Data",
            isAtrasado: isVencido
        });
    });

    // 2. Renderiza Resumo MACRO por Gráfica (COM AS 9 COLUNAS SIMPLES)
    let htmlGraf = "";
    Object.keys(resGrafica).sort().forEach(g => {
        let d = resGrafica[g];
        
        let pctPcpTotal = d.tirPcp > 0 ? (d.tirColPcp / d.tirPcp) * 100 : 0;
        let pctPcpVencido = d.tirVencido > 0 ? (d.tirColPcp / d.tirVencido) * 100 : 0;
        
        let pctMapaTotal = d.tirPcp > 0 ? (d.tirMapa / d.tirPcp) * 100 : 0;
        let pctMapaVencido = d.tirVencido > 0 ? (d.tirMapa / d.tirVencido) * 100 : 0;
        let pctMapaPcp = d.tirColPcp > 0 ? (d.tirMapa / d.tirColPcp) * 100 : 0;
        
        htmlGraf += `<tr class="border-b border-slate-100 hover:bg-slate-50">
            <td class="p-2 border-r border-slate-200 font-bold text-slate-700">${g}</td>
            <td class="p-2 border-r border-slate-200 text-right bg-slate-50">${window.formatarBR(d.tirPcp)}</td>
            <td class="p-2 border-r border-slate-200 text-right font-bold text-rose-700 bg-rose-50">${window.formatarBR(d.tirVencido)}</td>
            
            <td class="p-2 border-r border-slate-200 text-right font-bold text-emerald-700 bg-emerald-50">${window.formatarBR(d.tirColPcp)}</td>
            <td class="p-2 border-r border-slate-200 text-center font-bold text-slate-600">${pctPcpTotal.toFixed(1)}%</td>
            <td class="p-2 border-r border-slate-200 text-center font-bold ${pctPcpVencido < 100 ? 'text-amber-600' : 'text-emerald-600'}">${pctPcpVencido.toFixed(1)}%</td>
            
            <td class="p-2 border-r border-slate-200 text-right font-bold text-indigo-700 bg-indigo-50/50">${window.formatarBR(d.tirMapa)}</td>
            <td class="p-2 border-r border-slate-200 text-center font-bold text-slate-600">${pctMapaTotal.toFixed(1)}%</td>
            <td class="p-2 border-r border-slate-200 text-center font-bold ${pctMapaVencido < 100 ? 'text-amber-600' : 'text-emerald-600'}">${pctMapaVencido.toFixed(1)}%</td>
            <td class="p-2 text-center font-black ${pctMapaPcp < 100 ? 'text-red-600' : (pctMapaPcp > 100 ? 'text-blue-600' : 'text-emerald-600')}">${pctMapaPcp.toFixed(1)}%</td>
        </tr>`;
    });
    document.getElementById('tbodyColetaResumo').innerHTML = htmlGraf || `<tr><td colspan="10" class="p-4 text-center font-bold text-slate-500 bg-slate-50">Nenhum dado atende aos filtros atuais.</td></tr>`;

    // 3. Renderiza Listas MICRO (SKU a SKU)
    let htmlMais = ""; let htmlMenos = ""; let countMais = 0; let countMenos = 0;

    listaSkus.sort((a, b) => Math.abs(b.difTotal) - Math.abs(a.difTotal));
    window.dadosExportacaoColetas = listaSkus; 

    listaSkus.forEach(i => {
        let tagAtraso = i.isAtrasado ? `<span class="bg-red-100 text-red-700 px-1.5 py-0.5 rounded ml-2 shadow-sm text-[8px] tracking-wider uppercase font-black border border-red-300">Vencido (${i.dtPlan})</span>` : `<span class="text-slate-400 ml-2 text-[8px] tracking-wider uppercase">Prazo: ${i.dtPlan}</span>`;
        
        let row = `<tr class="border-b border-slate-100 hover:bg-slate-50">
            <td class="p-2 border-r border-slate-100">${i.grafica}</td>
            <td class="p-2 border-r border-slate-100">${i.marcaCd}</td>
            <td class="p-2 border-r border-slate-100">
                <span class="font-bold text-slate-700">${i.sku}</span> ${tagAtraso}<br>
                <span class="text-[9px] text-slate-500">${i.desc}</span><br>
                <span class="text-[9px] font-black uppercase tracking-wider ${i.status.includes('Menos') || i.status.includes('Pendente') ? 'text-red-600' : (i.status.includes('Mais') ? 'text-emerald-600' : 'text-indigo-600')}">Status: ${i.status}</span>
            </td>
            <td class="p-2 border-r border-slate-100 text-right bg-slate-50">${window.formatarBR(i.tPCP)}</td>
            <td class="p-2 border-r border-slate-100 text-right font-bold text-emerald-700 bg-emerald-50">${window.formatarBR(i.tColPcp)}</td>
            <td class="p-2 border-r border-slate-100 text-right font-bold text-indigo-700 bg-indigo-50/50">${window.formatarBR(i.tMapa)}</td>
            <td class="p-2 border-r border-slate-100 text-right font-black ${i.difTotal < 0 ? 'text-red-600' : 'text-emerald-600'}">${i.difTotal > 0 ? '+' : ''}${window.formatarBR(i.difTotal)}</td>
            <td class="p-2 text-right font-black ${i.difPcp < 0 ? 'text-rose-600' : 'text-emerald-600'}">${i.difPcp > 0 ? '+' : ''}${window.formatarBR(i.difPcp)}</td>
        </tr>`;

        if (i.difTotal > 0 || fStatus === 'MAIS') { htmlMais += row; countMais++; }
        else if (i.difTotal < 0 || i.status.includes('Pendente') || fStatus === 'MENOS' || fStatus === 'PENDENTE') { htmlMenos += row; countMenos++; }
        else { htmlMenos += row; countMenos++; } 
    });

    document.getElementById('tbodyColetaMais').innerHTML = htmlMais || `<tr><td colspan="8" class="p-4 text-center text-slate-500 font-bold bg-slate-50">Tudo limpo nesta visão.</td></tr>`;
    document.getElementById('tbodyColetaMenos').innerHTML = htmlMenos || `<tr><td colspan="8" class="p-4 text-center text-slate-500 font-bold bg-slate-50">Tudo limpo nesta visão.</td></tr>`;
    
    let elBadgeMais = document.getElementById('badgeAMais'); if(elBadgeMais) elBadgeMais.innerText = `${countMais} OPs`;
    let elBadgeMenos = document.getElementById('badgeAMenos'); if(elBadgeMenos) elBadgeMenos.innerText = `${countMenos} OPs`;

    // 4. Tabelas Menores de Aderência
    let theadAderencia = `<tr class="bg-slate-800 text-white uppercase text-[9px]"><th class="p-2 border-r border-slate-600">Identificação</th><th class="p-2 text-right border-r border-slate-600">Vol Total PCP</th><th class="p-2 text-right border-r border-slate-600 text-emerald-200">Col. PCP</th><th class="p-2 text-right border-r border-slate-600 text-indigo-200">Col. Mapa</th><th class="p-2 text-center">% Mapa vs Total</th></tr>`;
    document.getElementById('theadColetaMarca').innerHTML = theadAderencia;
    document.getElementById('theadColetaGrafica').innerHTML = theadAderencia;

    const renderTbAder = (obj, tBodyId) => {
        let htmlAder = "";
        Object.keys(obj).sort().forEach(k => {
            let d = obj[k];
            let pct = d.tirPcp > 0 ? ((d.tirMapa / d.tirPcp) * 100) : 0;
            htmlAder += `<tr class="border-b border-slate-100 hover:bg-slate-50">
                <td class="p-2 border-r border-slate-200 font-bold">${k}</td>
                <td class="p-2 text-right border-r border-slate-200">${window.formatarBR(d.tirPcp)}</td>
                <td class="p-2 text-right border-r border-slate-200 text-emerald-700 bg-emerald-50">${window.formatarBR(d.tirColPcp)}</td>
                <td class="p-2 text-right border-r border-slate-200 font-bold text-indigo-700 bg-indigo-50/50">${window.formatarBR(d.tirMapa)}</td>
                <td class="p-2 text-center font-black ${pct < 100 ? 'text-amber-600' : 'text-emerald-600'}">${pct.toFixed(1)}%</td>
            </tr>`;
        });
        document.getElementById(tBodyId).innerHTML = htmlAder;
    };
    renderTbAder(resMarca, 'tbodyColetaMarca');
    renderTbAder(resGrafica, 'tbodyColetaGrafica');
};
