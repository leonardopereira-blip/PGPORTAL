// Comparativo unico do grafico: diario = PLAN do dia x REAL do dia;
// acumulado = PLAN acumulado x REAL acumulado. Futuro nao vira atraso.
// Mantem o saldo historico apenas na visao acumulada.
window.pgComparativoColetaVisao = function(o) {
    const plan = Math.max(0, Number(o.acumulado ? o.planAcumulado : o.planDia) || 0);
    const real = Math.max(0, Number(o.acumulado ? o.realAcumulado : o.realDia) || 0);
    const futuro = o.dia > o.hoje;
    const gap = futuro
        ? (o.acumulado ? Math.max(0, Number(o.backlogAtual) || 0) : 0)
        : Math.max(0, plan - real);
    return {
        plan,
        real,
        gap,
        percentual: futuro || plan <= 0 ? null : real / plan * 100
    };
};

window.renderColetaFinalFunil = function(sufixo = '') {
    const elemento = id => document.getElementById(id + sufixo);
    const chaveGrafico = 'coletaFinalFunil' + sufixo;
    const canvas = elemento('grafColetaFinalFunil');
    if (!canvas) return;
    const contextoEntrega = window.pgContextosEntregasCD?.[sufixo];
    const entregaCD = !!contextoEntrega;


    // V40B - Filtro exclusivo do Funil.
    // Não altera os filtros globais.

    const filtroId =
        'pgFiltroStatusColetaFunil' + sufixo;

    let filtroStatus =
        document.getElementById(filtroId);

    if (!filtroStatus && !entregaCD) {

        const wrapper =
            document.createElement('div');

        wrapper.id = filtroId + 'Wrapper';

        wrapper.className =
            'inline-flex flex-col gap-1 mb-3 ml-2';

        wrapper.innerHTML = `
            <span class="text-xs font-semibold text-slate-600">
                STATUS COLETA
            </span>

            <select
                id="${filtroId}"
                class="border border-slate-200 rounded-lg
                       px-3 py-2 bg-white text-slate-700
                       text-xs"
            >
                <option value="TODOS">Todos</option>
                <option value="COLETADO A MENOS">Coletado a menos</option>
                <option value="COLETA OK">Coleta Ok</option>
                <option value="COLETA PENDENTE">Coleta Pendente</option>
                <option value="COLETADO A MAIS">Coletado a Mais</option>
            </select>
        `;

        const ancora =
            elemento('acumuladaColetaFunil')?.closest('label') ||
            elemento('periodoColetaFunil') ||
            canvas;

        ancora.insertAdjacentElement(
            'afterend',
            wrapper
        );

        filtroStatus =
            document.getElementById(filtroId);
    }

    if (filtroStatus) filtroStatus.onchange = () => {
        window.renderColetaFinalFunil(sufixo);
    };

    const statusSelecionado =
        filtroStatus?.value || 'TODOS';

    const normalizarStatus = valor =>
        String(valor ?? '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .trim()
            .replace(/\s+/g, ' ')
            .toUpperCase();

    const baseOriginal =
        contextoEntrega?.base ||
        window.dadosBaseForecastColeta ||
        window.dadosTotalCanonico ||
        [];

    const baseStatus =
        statusSelecionado === 'TODOS'
            ? baseOriginal
            : baseOriginal.filter(linha => {

                const status = normalizarStatus(
                    window.pgCampoColeta(
                        linha,
                        'STATUS COLETA'
                    )
                );

                return status === statusSelecionado;
            });

    // Fonte filtrada apenas para este gráfico.
    // O cache global permanece intacto.

    const resumo = entregaCD
        ? window.pgCalcularEntregaCDFunil(baseStatus, dtHojeISO)
        : statusSelecionado === 'TODOS'
            ? window.pgObterResumoColeta()
            : window.pgCalcularColetaFunil(
                baseStatus,
                dtHojeISO
            );

    if (!entregaCD) window.pgResumoColetaFunil = resumo;

    const modo = document.querySelector(`input[name="visaoColetaFunil${sufixo}"]:checked`)?.value || 'mes';
    const acumulado = !!elemento('acumuladaColetaFunil')?.checked;
    const blocoMes = elemento('periodoColetaFunil');
    const inputMes = elemento('mesColetaFunil');
    const nota = elemento('notaColetaFinalFunil');
    const faixa = elemento('diasColetaFunil');

    const fmt = n => Math.round(Number(n || 0)).toLocaleString('pt-BR');
    const pctBase = n => (resumo.total > 0 ? Number(n || 0) / resumo.total * 100 : 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';
    const addDays = (iso, dias) => {
        const d = new Date(iso + 'T00:00:00Z');
        d.setUTCDate(d.getUTCDate() + dias);
        return d.toISOString().slice(0, 10);
    };
    const ultimoDia = m => new Date(Date.UTC(Number(m.slice(0, 4)), Number(m.slice(5, 7)), 0)).toISOString().slice(0, 10);
    const labelData = iso => iso.slice(8, 10) + '/' + iso.slice(5, 7);
    const origemAtual = document.getElementById('pgFiltroOrigem')?.value || 'TODOS';
    const destinoAtual = document.getElementById('pgFiltroDestino')?.value || 'TODOS';
    const nomeBase = entregaCD ? contextoEntrega.cd : destinoAtual === 'CD' ? 'Destino CD' : origemAtual === 'ACABADORA' ? 'Acabadora' : origemAtual === 'TODOS' ? 'filtro atual' : 'PCP';
    const nomeAgendado = entregaCD ? 'Entrega agendada' : 'Mapa agendado';
    const nomeAgendadoAcumulado = nomeAgendado + (entregaCD ? ' acumulada' : ' acumulado');

    if (inputMes && !inputMes.value) inputMes.value = dtHojeISO.slice(0, 7);
    if (blocoMes) blocoMes.classList.toggle('hidden', modo !== 'mes');

    let inicio = dtHojeISO;
    let fim = dtHojeISO;
    if (modo === 'semana') {
        // Segunda-feira a domingo, preservando dias passados da semana atual.
        const dow = new Date(dtHojeISO + 'T00:00:00Z').getUTCDay();
        inicio = addDays(dtHojeISO, -((dow + 6) % 7));
        fim = addDays(inicio, 6);
    } else if (modo === '7d') {
        inicio = dtHojeISO;
        fim = addDays(dtHojeISO, 6);
    } else if (modo === '30d') {
        inicio = dtHojeISO;
        fim = addDays(dtHojeISO, 29);
    } else {
        const mesRef = (inputMes?.value || dtHojeISO.slice(0, 7));
        inicio = mesRef + '-01';
        fim = ultimoDia(mesRef);
    }

    if (!inicio || !fim || inicio > fim) {
        if (nota) {
            nota.textContent = '';
            nota.classList.add('hidden');
        }

        if (graficos[chaveGrafico]) {
            graficos[chaveGrafico].destroy();
            graficos[chaveGrafico] = null;
        }

        return;
    }

    const todosPontos = [];
    for (let d = inicio; d <= fim; d = addDays(d, 1)) {
        todosPontos.push(d);
    }

    const mapaDias = new Map(Array.from(resumo.dias.entries()));

    // Dias sem planejado e sem realizado não precisam aparecer.
    const pontos = todosPontos.filter(d => {
        const evt = mapaDias.get(d) || {};
        const plan = Math.max(0, Number(evt.esperado || 0));
        const real = Math.max(0, Number(evt.real || 0));
        const agendado = Math.max(0, Number(evt.agendado || 0));
        return plan > 0 || real > 0 || agendado > 0;
    });
    const somaAte = (campo, limite, estritoMenor = false) => {
        let total = 0;
        mapaDias.forEach((obj, data) => {
            if (estritoMenor ? data < limite : data <= limite) total += Number(obj?.[campo] || 0);
        });
        return total;
    };

    // O gráfico e a extração consultam a mesma composição linha a linha.
    const prazos = Array.isArray(resumo.prazosRegistros)
        ? resumo.prazosRegistros : [];

    // V40B - BACKLOG LÍQUIDO
    //
    // Compensa coleta excedente de um registro
    // com coleta faltante de outros registros.
    //
    // Nunca considera planejado futuro como vencido.

    const backlogAte = limite => {

        const corte =
            limite > dtHojeISO
                ? dtHojeISO
                : limite;

        const planejado =
            somaAte('esperado', corte);

        const realizado =
            somaAte('real', corte);

        return Math.max(
            0,
            planejado - realizado
        );
    };

    const semDataAte = limite => prazos.reduce((s, r) =>
        s + window.pgSaldoPrazoV35(r, limite, dtHojeISO).semData, 0);
    const backlogAtual = backlogAte(dtHojeISO);

    const planejadoDia = [];
    const realizadoDia = [];
    const agendadoDia = [];

    pontos.forEach(d => {
        const evt = mapaDias.get(d) || {};
        planejadoDia.push(Math.max(0, Number(evt.esperado || 0)));
        realizadoDia.push(d <= dtHojeISO ? Math.max(0, Number(evt.real || 0)) : 0);
        agendadoDia.push(Math.max(0, Number(evt.agendado || 0)));
    });

    // Cada ponto usa a MESMA referencia para o plano e o realizado.
    // Na visao diaria, o vermelho e somente o gap daquela data.
    // Na acumulada, o vermelho e o gap entre os dois acumulados.
    const comparativoVisao = pontos.map((d, i) => window.pgComparativoColetaVisao({
        acumulado,
        dia: d,
        hoje: dtHojeISO,
        planDia: planejadoDia[i],
        realDia: realizadoDia[i],
        planAcumulado: somaAte('esperado', d),
        realAcumulado: somaAte('real', d <= dtHojeISO ? d : dtHojeISO),
        backlogAtual
    }));
    const planejadoVisao = comparativoVisao.map(p => p.plan);
    const realizadoVisao = comparativoVisao.map(p => p.real);
    const backlogVisao = comparativoVisao.map(p => p.gap);
    const percentualVisao = comparativoVisao.map(p => p.percentual);
    const agendadoVisao = pontos.map((d, i) =>
        acumulado ? somaAte('agendado', d) : agendadoDia[i]
    );
    // Denominador da aderencia e sempre o PLAN da propria visualizacao.
    const demandaVisao = planejadoVisao.slice();

    const totalAgendadoPeriodo = agendadoDia.reduce((a, b) => a + b, 0);
    if (!entregaCD) {
        const chaveMeta = window.pgChaveForecastColeta();
        const chaveView = sufixo || 'FUNIL';
        window.PG_FORECAST_VIEW[chaveView] = { chave: chaveMeta, pontos: pontos.slice(), total: resumo.total, modo, inicio, fim };
        window.pgAtualizarBotaoForecastColeta(sufixo);
    }

    // V39: planejado acumulado até hoje, igual ao tooltip.
    // Não inclui datas futuras, mesmo quando o filtro vai até o fim do mês.
    const cortePlanejado = fim <= dtHojeISO ? fim : dtHojeISO;
    const planoNoPonto = somaAte('esperado', cortePlanejado);
    const tituloPlanejado = `Planejado acumulado até ${labelData(cortePlanejado)}`;
    // PG_RESUMO_FORECAST_FIM_V53_20260925: o forecast e acumulado ate o fim do filtro.
    const forecastFim = somaAte('esperado', fim);
    const tituloForecastFim = `Forecast acumulado até ${labelData(fim)}`;
    const corteRealResumo = fim <= dtHojeISO ? fim : dtHojeISO;
    const realizadoResumo = somaAte('real', corteRealResumo);
    const tituloRealizado = `${entregaCD ? 'Entregue' : 'Coletado'} acumulado até ${labelData(corteRealResumo)}`;
    elemento('resumoColetaFinalFunil').innerHTML =
        `<span>Base ${nomeBase}: <b>${fmt(resumo.total)}</b></span>` +
        `<span>${tituloPlanejado}: <b>${fmt(planoNoPonto)} (${pctBase(planoNoPonto)})</b></span>` +
        `<span>${tituloRealizado}: <b>${fmt(realizadoResumo)} (${pctBase(realizadoResumo)})</b></span>` +
        `<span>${tituloForecastFim}: <b>${fmt(forecastFim)} (${pctBase(forecastFim)})</b></span>` +
        `<span>${acumulado ? nomeAgendadoAcumulado + ' até ' + labelData(fim) : nomeAgendado + ' no período'}: <b>${fmt(acumulado ? somaAte('agendado', fim) : totalAgendadoPeriodo)}</b></span>` +
        `<span>Backlog líquido: <b>${fmt(backlogAtual)}</b></span>`;

    // Números-resumo também extraem seu próprio período com o mesmo formato.
    const resumoElementos = Array.from(elemento('resumoColetaFinalFunil')?.children || []);
    const tiposResumo = ['base', 'planPeriodo', 'realTotal', 'forecastFim', 'agendadoPeriodo', 'backlogAtual'];
    resumoElementos.forEach((span, i) => {
        const tipo = tiposResumo[i];
        if (!tipo) return;
        span.title = 'Clique para extrair ' + tipo;
        span.style.cursor = 'pointer';
        span.setAttribute('role', 'button');
        span.setAttribute('tabindex', '0');
        span.onclick = () => window.pgExtrairPontoColetaV35(sufixo, 0, tipo, span);
        span.onkeydown = e => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                span.click();
            }
        };
    });
    if (nota) {
        nota.textContent = '';
        nota.classList.add('hidden');
    }

    const larguraColeta = elemento('larguraColetaFunil');
    // Indicador discreto, fora da escala do gráfico: não distorce as barras.
    const paiSemData = larguraColeta.parentElement;
    const idSemData = 'pgSemDataV35' + sufixo;
    let painelSemData = document.getElementById(idSemData);
    if (!painelSemData) {
        painelSemData = document.createElement('div');
        painelSemData.id = idSemData;
        painelSemData.className = 'flex flex-wrap items-center gap-2 mb-2 text-xs text-slate-600';
        paiSemData.parentElement.insertBefore(painelSemData, paiSemData);
    }
    const qtdSemData = semDataAte(dtHojeISO);
    const chaveSemData = sufixo || 'FUNIL';
    window.pgMostrarSemDataV35 = window.pgMostrarSemDataV35 || {};
    if (window.pgMostrarSemDataV35[chaveSemData] === undefined) {
        window.pgMostrarSemDataV35[chaveSemData] = true;
    }
    const visivelSemData = window.pgMostrarSemDataV35[chaveSemData];
    painelSemData.innerHTML =
        `<button type="button" data-pg-sem-extrair class="rounded border border-amber-200 bg-amber-50 px-2 py-1 font-semibold text-amber-900" title="${entregaCD ? 'Extrair itens sem previsão válida de entrega' : 'Extrair itens vencidos sem DT_Vencida'}">${entregaCD ? 'Sem previsão' : 'Sem data'}: ${visivelSemData ? fmt(qtdSemData) : '•••'}</button>` +
        `<button type="button" data-pg-sem-alternar class="rounded border border-slate-200 px-2 py-1 text-slate-600">${visivelSemData ? 'Ocultar sem data' : 'Mostrar sem data'}</button>`;
    painelSemData.querySelector('[data-pg-sem-alternar]').onclick = () => {
        window.pgMostrarSemDataV35[chaveSemData] = !visivelSemData;
        window.renderColetaFinalFunil(sufixo);
    };
    painelSemData.querySelector('[data-pg-sem-extrair]').onclick = e =>
        window.pgExtrairPontoColetaV35(sufixo, 0, 'semData', e.currentTarget);


    // Cada dia ocupa uma faixa fixa. O gráfico usa essa mesma referência
    // e depois o plugin ajusta os cards exatamente à chartArea real.
    const larguraDiaColeta = 132;
    const margemEixosColeta = 96;
    const larguraTotalColeta = Math.max(
        980,
        (pontos.length * larguraDiaColeta) + margemEixosColeta
    );

    larguraColeta.style.width = larguraTotalColeta + 'px';
    larguraColeta.style.minWidth = larguraTotalColeta + 'px';

    faixa.style.display = 'grid';
    faixa.style.boxSizing = 'border-box';
    faixa.style.gridTemplateColumns =
        `repeat(${pontos.length}, ${larguraDiaColeta}px)`;

    faixa.style.padding = '8px 48px 0';
    faixa.style.marginTop = '6px';
    faixa.style.columnGap = '0';
    faixa.innerHTML = pontos.map((d, idx) => {
        const perc = percentualVisao[idx];
        const bot = (tipo, texto, classe = '') => `<button type="button" data-pg-tipo="${tipo}" data-pg-idx="${idx}" class="block w-full text-center ${classe}" title="Extrair ${tipo} deste ponto">${texto}</button>`;
        return `<div class="rounded-lg border border-slate-200 bg-slate-50 px-2 py-2 text-center">
            ${bot('dia', labelData(d), 'text-[11px] font-bold text-slate-700')}
            ${bot('plan', 'Plan' + (acumulado ? ' acum.' : '') + ' ' + fmt(planejadoVisao[idx]), 'text-[10px] text-blue-700')}
            ${bot('backlog', (acumulado ? 'Backlog acum. ' : 'Gap do dia ') + fmt(backlogVisao[idx]), 'text-[10px] text-red-600')}
            ${d <= dtHojeISO ? bot('real', 'Real' + (acumulado ? ' acum.' : '') + ' ' + fmt(realizadoVisao[idx]), 'text-[10px] text-emerald-700') : ''}
            ${agendadoVisao[idx] > 0 ? bot('agendado', nomeAgendado + (acumulado ? ' acum.' : '') + ' ' + fmt(agendadoVisao[idx]), 'text-[10px] font-bold text-violet-700') : ''}
            ${d <= dtHojeISO ? bot('dia', perc === null ? '—' : perc.toFixed(0) + '%', 'text-[10px] font-black ' + (perc === null ? 'text-slate-400' : perc >= 100 ? 'text-emerald-700' : 'text-amber-700')) : ''}
        </div>`;
    }).join('');
    faixa.onclick = e => {
        const alvo = e.target.closest('[data-pg-tipo]');
        if (!alvo || !faixa.contains(alvo)) return;
        window.pgExtrairPontoColetaV35(sufixo, Number(alvo.dataset.pgIdx), alvo.dataset.pgTipo, alvo);
    };
    faixa.onkeydown = e => { /* os elementos são botões nativos */ };

    // O mesmo recorte e o mesmo livro de linhas alimentam gráfico e Sheets.
    window.pgExtracaoColetaV35 = window.pgExtracaoColetaV35 || {};
    window.pgExtracaoColetaV35[sufixo || 'FUNIL'] = {
        pontos: pontos.slice(), acumulado, resumo, inicio, fim, corteRealResumo,
        tipo: entregaCD ? 'entrega' : 'coleta', cd: contextoEntrega?.cd || ''
    };
    const labels = pontos.map(d => labelData(d));

    // Colunas em escala real, sem backlog acumulado no modo dia a dia.
    // Vermelho = parcela ainda nao realizada do mesmo PLAN (nunca soma ao azul).
    // Verde = volume REAL sem compressao ou compensacao visual.
    const backlogVisual = backlogVisao.map((gap, i) =>
        Math.min(planejadoVisao[i], gap)
    );
    const azulLiquido = planejadoVisao.map((plan, i) =>
        Math.max(0, plan - backlogVisual[i])
    );
    const realizadoVisual = realizadoVisao.map((real, i) =>
        pontos[i] <= dtHojeISO ? real : null
    );

    const pluginColunasCompactasV37 = {
        id: 'pgColunasCompactasV37',
        beforeDatasetsDraw(chart) {
            const planMeta = chart.getDatasetMeta(0);
            const backlogMeta = chart.getDatasetMeta(1);
            const agendaMeta = chart.getDatasetMeta(3);
            pontos.forEach((dia, i) => {
                const temPlan = Number(planejadoVisao[i] || 0) > 0;
                const temReal = dia <= dtHojeISO && Number(realizadoVisao[i] || 0) > 0;
                const temAgenda = Number(agendadoVisao[i] || 0) > 0;
                if (!temPlan || temReal || !temAgenda) return;
                const pl = planMeta.data[i];
                const bk = backlogMeta.data[i];
                const ag = agendaMeta.data[i];
                if (!pl || !ag) return;
                const centro = chart.scales.x.getPixelForValue(i);
                const largura = Math.max(Number(pl.width || 0), Number(ag.width || 0), 8);
                const desvio = largura * 0.55;
                pl.x = centro - desvio;
                if (bk) bk.x = pl.x;
                ag.x = centro + desvio;
            });
        }
    };

    const pluginAlinhamentoCards = {
        id: 'pgAlinhamentoCardsColetaV32',

        afterLayout(chart) {
            if (!faixa || !pontos.length) return;

            const area = chart.chartArea;
            if (!area || !(area.width > 0)) return;

            // O centro de cada card passa a ser exatamente o centro
            // da categoria do Chart.js, portanto fica sob o par de barras.
            const larguraCategoria =
                area.width / pontos.length;

            const paddingEsquerda =
                Math.max(0, area.left);

            const paddingDireita =
                Math.max(
                    0,
                    chart.width - area.right
                );

            faixa.style.width = chart.width + 'px';
            faixa.style.boxSizing = 'border-box';
            faixa.style.paddingLeft =
                paddingEsquerda + 'px';
            faixa.style.paddingRight =
                paddingDireita + 'px';

            faixa.style.gridTemplateColumns =
                `repeat(${pontos.length}, ${larguraCategoria}px)`;
        }
    };

    const pluginConexao = {
        id: 'pgColetaConexaoV24',

        afterDatasetsDraw(chart) {
            const ctx = chart.ctx;
            const metaPlan = chart.getDatasetMeta(0);
            const metaBacklog = chart.getDatasetMeta(1);
            const metaReal = chart.getDatasetMeta(2);

            ctx.save();
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            labels.forEach((_, idx) => {
                // Sem ponte ou bolha de aderência a uma coleta futura inexistente.
                if (pontos[idx] > dtHojeISO) return;
                const demanda = demandaVisao[idx];
                const perc = percentualVisao[idx];

                const elPlan = metaPlan.data[idx];
                const elBack = metaBacklog.data[idx];
                const elReal = metaReal.data[idx];

                if (!elPlan || !elReal || !demanda) return;

                const xEsq = elBack?.x ?? elPlan.x;
                const yEsq =
                    backlogVisual[idx] > 0 && elBack
                        ? elBack.y
                        : elPlan.y;

                const xDir = elReal.x;
                const yDir = elReal.y;

                ctx.beginPath();
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 3]);
                ctx.moveTo(xEsq, yEsq);
                ctx.lineTo(xDir, yDir);
                ctx.stroke();
                ctx.setLineDash([]);

                const xm = (xEsq + xDir) / 2;
                const ym = (yEsq + yDir) / 2;
                const raio = 13;

                ctx.beginPath();
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 1.25;
                ctx.arc(xm, ym, raio, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle =
                    perc >= 100 ? '#047857' : '#b45309';

                ctx.fillText(
                    (perc || 0).toFixed(0) + '%',
                    xm,
                    ym + 0.5
                );
            });

            ctx.restore();
        }
    };

    const config = {
        type: 'bar',

        data: {
            labels,

            datasets: [
                {
                    type: 'bar',
                    label: acumulado ? 'Planejado acumulado' : 'Planejado do dia',
                    data: azulLiquido,
                    backgroundColor: '#3b82f6',
                    borderColor: '#2563eb',
                    borderWidth: 1,
                    stack: 'demanda',
                    order: 2,
                    borderRadius: 4,
                    categoryPercentage: 0.82,
                    barPercentage: 0.88
                },
                {
                    type: 'bar',
                    label: acumulado ? 'Backlog acumulado' : 'Gap do dia',
                    data: backlogVisual,
                    backgroundColor: '#ef4444',
                    borderColor: '#dc2626',
                    borderWidth: 1,
                    stack: 'demanda',
                    order: 1,
                    borderRadius: 4,
                    categoryPercentage: 0.82,
                    barPercentage: 0.88
                },
                {
                    type: 'bar',
                    label: acumulado ? 'Realizado acumulado' : 'Realizado no dia',
                    data: realizadoVisual,
                    backgroundColor: '#10b981',
                    borderColor: '#059669',
                    borderWidth: 1,
                    stack: 'realizado',
                    order: 2,
                    borderRadius: 4,
                    categoryPercentage: 0.82,
                    barPercentage: 0.88
                },
                {
                    // Terceira coluna, separada do Plan e do Real.
                    // Mapa_Agendado é compromisso futuro, nunca coleta realizada.
                    type: 'bar',
                    label: acumulado ? nomeAgendadoAcumulado : nomeAgendado,
                    data: pontos.map((d, i) =>
                        d >= dtHojeISO && agendadoVisao[i] > 0
                            ? agendadoVisao[i]
                            : null
                    ),
                    backgroundColor: '#7c3aed',
                    borderColor: '#6d28d9',
                    borderWidth: 1,
                    stack: 'agendado',
                    order: 2,
                    borderRadius: 4,
                    categoryPercentage: 0.82,
                    barPercentage: 0.88
                }
            ]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            onClick(event, active, chart) {
                const items = chart.getElementsAtEventForMode(event, 'nearest', {intersect:true}, true);
                if (!items.length) return;
                const el = items[0];
                const tipo = ['plan', 'backlog', 'real', 'agendado'][el.datasetIndex];
                if (!tipo) return;
                window.pgExtrairPontoColetaV35(sufixo, el.index, tipo, chart.canvas);
            },

            interaction: {
                mode: 'index',
                intersect: false
            },

            plugins: {
                legend: {
                    position: 'top',
                    labels: {
                        boxWidth: 14,
                        usePointStyle: false
                    }
                },

                tooltip: {
                    callbacks: {
                        label(c) {
                            // PG_TOOLTIP_PERCENTUAL_V54
                            const idx = c.dataIndex;

                            if (c.datasetIndex === 0) {
                                return (acumulado ? 'Planejado acumulado: ' : 'Planejado do dia: ') +
                                    fmt(planejadoVisao[idx]) + ' (' + pctBase(planejadoVisao[idx]) + ')';
                            }

                            if (c.datasetIndex === 1) {
                                return (acumulado ? 'Backlog acumulado: ' : 'Gap do dia: ') +
                                    fmt(backlogVisao[idx]) + ' (' + pctBase(backlogVisao[idx]) + ')';
                            }

                            if (c.datasetIndex === 3) {
                                return (acumulado ? nomeAgendadoAcumulado + ': ' : nomeAgendado + ' no dia: ') +
                                    fmt(agendadoVisao[idx]) + ' (' + pctBase(agendadoVisao[idx]) + ')';
                            }
                            if (pontos[idx] > dtHojeISO) return null;
                            return (acumulado ? 'Realizado acumulado: ' : 'Realizado no dia: ') +
                                fmt(realizadoVisao[idx]) + ' (' + pctBase(realizadoVisao[idx]) + ')';
                        },

                        afterBody(items) {
                            const idx =
                                items?.[0]?.dataIndex ?? 0;

                            return [
                                (acumulado ? 'Referência acumulada (Plan): ' : 'Referência do dia (Plan): ') +
                                    fmt(demandaVisao[idx]) + ' (' + pctBase(demandaVisao[idx]) + ')',

                                ...(pontos[idx] <= dtHojeISO ? [
                                    (acumulado ? 'Aderência acumulada: ' : 'Aderência do dia: ') +
                                        (percentualVisao[idx] == null
                                            ? '—'
                                            : percentualVisao[idx].toFixed(1) + '%')
                                ] : []),

                                (acumulado ? 'Saldo de backlog acumulado: ' : 'Gap do dia: ') +
                                    fmt(backlogVisao[idx]) + ' (' + pctBase(backlogVisao[idx]) + ')',
                                nomeAgendado + ': ' + fmt(agendadoVisao[idx]) + ' (' + pctBase(agendadoVisao[idx]) + ')'
                            ];
                        }
                    }
                }
            },

            scales: {
                x: {
                    // Dois stacks ficam lado a lado:
                    // demanda = azul + vermelho
                    // realizado = verde
                    stacked: true,
                    grid: { display: false },

                    ticks: {
                        maxRotation: 90,
                        minRotation: 90,
                        color: '#334155',
                        font: { size: 10 }
                    }
                },

                y: {
                    stacked: true,
                    beginAtZero: true,

                    ticks: {
                        color: '#334155',
                        callback: value => fmt(value)
                    }
                }
            }
        },

        plugins: [
            pluginColunasCompactasV37,
            pluginConexao,
            pluginAlinhamentoCards
        ]
    };

    if (graficos[chaveGrafico]) graficos[chaveGrafico].destroy();
    graficos[chaveGrafico] = new Chart(canvas.getContext('2d'), config);
};

window.pgAtributosCaixaFunil = function(contexto, cor) {
    if (!contexto) return '';
    const id = window.pgCaixasFunil.push({ ...contexto, atrasados: cor.includes('rose') || cor.includes('amber') }) - 1;
    return `role="button" tabindex="0" title="Extrair pendências" onclick="extrairCaixaFunil(${id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();extrairCaixaFunil(${id});}" style="cursor:pointer"`;
};
window.pgPendenciasCaixaFunil = function(contexto) {
    if (contexto.coletaConcluida) return [];
    const norm = v => String(v || 'N/A').trim().toUpperCase();
    const casa = (g, m) => !contexto.grupo || norm(contexto.grupo) === norm(contexto.tipo === 'marca' ? m : g);
    if (contexto.fase === 'col' || contexto.fase === 'col_mapa') {
        return window.pgItensColetaDia(window.pgResumoColetaFunil, dtHojeISO, dtHojeISO, dtHojeISO, true)
            .filter(i => casa(i.graficaBase, i.marca) && (!contexto.atrasados || (i.dias !== null && i.dias < 0)));
    }
    const f = FASES.find(f => f.id === (contexto.fase === 'series' ? 'col_mapa' : contexto.fase));
    if (!f) return [];
    const tRef = document.getElementById('filtroReferencia').value;
    const basePendencias = ['col_tp', 'ent_tp'].includes(f.id) ? (window.dadosBaseTPPortal || [])
        : f.id === 'ent_cd' ? (window.dadosBaseEntCDPortal || dadosFiltrados)
        : ['imp', 'cus', 'oc'].includes(f.id) ? (window.dadosFasesEstaticas || [])
        : f.id === 'acab' ? (window.dadosAcabamentoOrigem || []) : dadosFiltrados;
    return basePendencias.flatMap(l => {
        const g = l.GRAFICA_FINAL || l['GRÁFICA'], m = l.MARCA_FINAL || l.UNIDADE;
        if (!casa(g, m) || (f.id !== 'col_mapa' && !belongsToPhase(l, f.id))) return [];
        const base = window.arredondar(l.TIRAGEM || l.QUANTIDADE || 0);
        const volume = window.getVolFase(l, f, base);
        const real = dataFoiPreenchida(l, f) || (volume > 0 && ['col_mapa', 'ent_cd'].includes(f.id));
        const saldo = Math.max(0, base - (real ? volume : 0));
        const dtPlan = window.pgDataPlanoFaseFunil(l, f, tRef);
        const dias = dtPlan ? -calcDiffDiasISO(dtPlan, dtHojeISO) : null;
        const serie = String(l['SÉRIE'] || l['Série'] || l.SERIE || '-');
        if (saldo <= 0 || (contexto.atrasados && (dias === null || dias >= 0)) || (contexto.fase === 'series' && serie === '-')) return [];
        return [{grafica:String(g || 'N/A'), marca:String(m || 'N/A'), serie,
            sku:String(l.SKU_REAL || l.SKU || '-'), desc:String(l.DESC_REAL || l['DESCRIÇÃO'] || l.PRODUTO || '-'),
            status:'Em Aberto', pendencia: contexto.fase === 'series' ? 'Série pendente — Coleta Final' : f.nome,
            dias, tiragem:saldo}];
    });
};
window.extrairCaixaFunil = function(id) {
    if (window.pgExtraindoColeta) return;
    const contexto = window.pgCaixasFunil[id];
    if (!contexto) return;
    const itens = window.pgPendenciasCaixaFunil(contexto);
    if (!itens.length) { alert('Nenhuma pendência para este recorte.'); return; }
    window.pgExtraindoColeta = true;
    const aba = window.open('about:blank', '_blank');
    const falha = e => { window.pgExtraindoColeta = false; if (aba) aba.close(); alert('Erro ao gerar planilha: ' + e); };
    google.script.run.withSuccessHandler(res => {
        if (!res || !res.success) { falha(res?.error || 'Erro desconhecido'); return; }
        window.pgExtraindoColeta = false;
        if (aba) aba.location.href = res.url;
        const link = document.getElementById('linkExtracaoColetaFunil');
        if (link) { link.href = res.url; link.hidden = false; }
    }).withFailureHandler(falha).gerarPlanilhaGiroFiltrado(itens);
};

window.processarFunil = function() {
    window.pgCaixasFunil = [];
    window.renderColetaFinalFunil();
let tRef = document.getElementById('filtroReferencia').value;
    let mGrid = {}; let gGrid = {}; let fTotais = {};

    let elsCb = document.querySelectorAll('.chk-fase-funil:checked');
    let fasesAtivasIds = Array.from(elsCb).map(cb => cb.value);
    if(fasesAtivasIds.length === 0) fasesAtivasIds = FASES.map(f => f.id);

    let fasesAtivas = FASES.filter(f => fasesAtivasIds.includes(f.id));

    const initFase = () => ({ pendenciasMapaAY: 0, base: 0, real: 0, planAtHoje: 0, pendenteVencido: 0, pcp: {pendenciasMapaAY: 0, base: 0, real: 0, planAtHoje: 0, pendenteVencido: 0}, acab: {pendenciasMapaAY: 0, base: 0, real: 0, planAtHoje: 0, pendenteVencido: 0} });
    fasesAtivas.forEach(f => fTotais[f.id] = initFase());

    let mapTotal = {}; let seriesGlobais = {};
    const destinoCDAtivo = document.getElementById('pgFiltroDestino')?.value === 'CD';
    const dadosPadrao = dadosFiltrados || [];
    const dadosInicio = destinoCDAtivo ? (window.dadosSemFiltroCD || []) : dadosPadrao;
    const dadosFinalTotal = destinoCDAtivo ? (window.dadosDestinoCDFinal || []) : dadosPadrao;
    const dadosFinalOrigem = destinoCDAtivo ? (window.dadosDestinoCDOrigem || []) : dadosPadrao;
    const dadosAcabamentoOrigem = window.dadosAcabamentoOrigem || [];
    const dadosFasesEstaticas = window.dadosFasesEstaticas || [];
    const setFasesEstaticas = new Set(dadosFasesEstaticas);

    const setPadrao = new Set(dadosPadrao);
    const setInicio = new Set(dadosInicio);
    const setFinalTotal = new Set(dadosFinalTotal);
    const setFinalOrigem = new Set(dadosFinalOrigem);
    const setAcabamentoOrigem = new Set(dadosAcabamentoOrigem);
    const setColeta = new Set(window.dadosBaseColetaFunil || []);
    const setTP = new Set(window.dadosBaseTPPortal || []);
    const idsInicioSemDestino = new Set(['env', 'rec', 'apv', 'imp', 'cus', 'oc']);
    const idsDaBaseFinal = new Set(['acab', 'kit', 'col', 'col_mapa', 'col_tp', 'ent_tp', 'ent_cd', 'int_cd']);

    const linhaPermitidaNaFase = (l, id) => {
        // De Env. Arquivo até O.C., o seletor Destino NÃO interfere.
        if (['env', 'rec', 'apv', 'imp', 'cus', 'oc'].includes(id)) return setFasesEstaticas.has(l);

        // Acabamento também é soberano ao Destino e mantém sua regra própria.
        if (id === 'acab') return setAcabamentoOrigem.has(l);

        // Estas três fases são exclusivamente PCP.
        if (['col_mapa', 'col_tp', 'ent_tp'].includes(id)) return setTP.has(l);

        // Confirmação CD preserva a lógica anterior do próprio fluxo.
        if (!destinoCDAtivo) return setPadrao.has(l);
        if (idsInicioSemDestino.has(id)) return setInicio.has(l);       // Base inicial já recortada por Origem e Destino.
        if (idsDaBaseFinal.has(id)) return setFinalOrigem.has(l);       // Kit em diante mantém a lógica atual de Origem + Destino.
        return setPadrao.has(l);                                       // Transf./Rec. Acab. preservados.
    };

    const dadosProcessamento = destinoCDAtivo
        ? Array.from(new Set([...dadosInicio, ...dadosFinalTotal, ...dadosFinalOrigem, ...dadosAcabamentoOrigem, ...dadosFasesEstaticas, ...dadosPadrao]))
        : Array.from(new Set([...dadosPadrao, ...dadosAcabamentoOrigem, ...dadosFasesEstaticas]));

    dadosProcessamento.forEach(l => {
        let tBase = window.arredondar(l["TIRAGEM"] || l["QUANTIDADE"]); if(tBase<=0) return;
        let k = getKey(l);
        let m = String(l["MARCA_FINAL"] || l["UNIDADE"] || "N/A").toUpperCase();
        let g = String(l["GRAFICA_FINAL"] || l["GRÁFICA"] || "N/A").toUpperCase();
        let nomeSerie = String(l["SÉRIE"] || l["Série"] || l["SERIE"] || l["SÉRIES"] || "").trim();
        let src = l["_SOURCE"] === "ACABADORA" ? "acab" : "pcp";

        if(!mGrid[m]) {
            mGrid[m] = { total: 0, pcp: {total:0}, acab: {total:0}, series: {} };
            fasesAtivas.forEach(f => mGrid[m][f.id] = initFase());
        }
        if(!gGrid[g]) {
            gGrid[g] = { total: 0, pcp: {total:0}, acab: {total:0}, series: {} };
            fasesAtivas.forEach(f => gGrid[g][f.id] = initFase());
        }

        // Total Base:
        // - Destino = CD: soma PCP_ACABADORAS + PCP direto ao CD; por isso a fonte faz parte da chave.
        // - Demais destinos (inclusive Todos/Todas): PCP e PCP_ACABADORAS NÃO podem duplicar a mesma chave.
        //   Mantém a regra original do Funil: uma mesma chave entra uma única vez no Total Geral.
        if(setFinalTotal.has(l)) {
            let kTotal = destinoCDAtivo ? (src + '|' + k) : k;
            if(!mapTotal[kTotal]) {
                mapTotal[kTotal] = tBase;
                mGrid[m].total += tBase; mGrid[m][src].total += tBase;
                gGrid[g].total += tBase; gGrid[g][src].total += tBase;
            }
        }

        if (nomeSerie !== "") {
            if (!seriesGlobais[nomeSerie]) seriesGlobais[nomeSerie] = { base: 0, real: 0, planAtHoje: 0, pendenteVencido: 0 };
            if (!mGrid[m].series[nomeSerie]) mGrid[m].series[nomeSerie] = { base: 0, real: 0, planAtHoje: 0, pendenteVencido: 0 };
            if (!gGrid[g].series[nomeSerie]) gGrid[g].series[nomeSerie] = { base: 0, real: 0, planAtHoje: 0, pendenteVencido: 0 };
        }

        fasesAtivas.forEach(f => {
            if (!linhaPermitidaNaFase(l, f.id)) return;

            // Nenhuma etapa é concluída por consequência de outra etapa.
            let passaFase = belongsToPhase(l, f.id);
            if (f.id === 'col_mapa') passaFase = true;

            if(passaFase) {
                let tFaseReal = window.getVolFase(l, f, tBase);

                fTotais[f.id].base += tBase;
                mGrid[m][f.id].base += tBase;
                gGrid[g][f.id].base += tBase;

                fTotais[f.id][src].base += tBase;
                mGrid[m][f.id][src].base += tBase;
                gGrid[g][f.id][src].base += tBase;

                if (f.id === 'col_mapa' && window.pgEstadoColetaMapa(l).pendenteAY) {
                    [fTotais[f.id], mGrid[m][f.id], gGrid[g][f.id]].forEach(c => { c.pendenciasMapaAY++; c[src].pendenciasMapaAY++; });
                }
                let isReal = dataFoiPreenchida(l, f) ||
                    (tFaseReal > 0 && (f.id === 'col_mapa' || f.id === 'ent_cd'));

                if(isReal || (f.id === 'col_mapa' && tFaseReal > 0)) {
                    fTotais[f.id].real += tFaseReal;
                    mGrid[m][f.id].real += tFaseReal;
                    gGrid[g][f.id].real += tFaseReal;

                    fTotais[f.id][src].real += tFaseReal;
                    mGrid[m][f.id][src].real += tFaseReal;
                    gGrid[g][f.id][src].real += tFaseReal;
                }

                let dtP = window.pgDataPlanoFaseFunil(l, f, tRef);
                let diasAtrasoFunil = dtP ? calcDiffDiasISO(dtP, dtHojeISO) : 0;
                const planoTP = ['col_mapa', 'col_tp', 'ent_tp', 'ent_cd'].includes(f.id);
                const tPlan = planoTP ? window.arredondar(l['TIRAGEM'] || 0) : tBase;
                let isMetaVencida = dtP && diasAtrasoFunil >= (planoTP ? 0 : 3);
                if (dtP && dtP < dtHojeISO && (!isReal || tFaseReal < tBase)) {
                    const pendente = Math.max(0, tBase - (isReal ? tFaseReal : 0));
                    [fTotais[f.id], mGrid[m][f.id], gGrid[g][f.id]].forEach(c => {
                        c.pendenteVencido += pendente;
                        c[src].pendenteVencido += pendente;
                    });
                }

                if (isMetaVencida) {
                    fTotais[f.id].planAtHoje += tPlan;
                    mGrid[m][f.id].planAtHoje += tPlan;
                    gGrid[g][f.id].planAtHoje += tPlan;

                    fTotais[f.id][src].planAtHoje += tPlan;
                    mGrid[m][f.id][src].planAtHoje += tPlan;
                    gGrid[g][f.id][src].planAtHoje += tPlan;
                }

                if (f.id === 'col' && nomeSerie !== "") {
                    seriesGlobais[nomeSerie].base += tBase;
                    mGrid[m].series[nomeSerie].base += tBase;
                    gGrid[g].series[nomeSerie].base += tBase;
                    if (isReal) {
                        seriesGlobais[nomeSerie].real += tFaseReal;
                        mGrid[m].series[nomeSerie].real += tFaseReal;
                        gGrid[g].series[nomeSerie].real += tFaseReal;
                    }
                    if (isMetaVencida) {
                        seriesGlobais[nomeSerie].planAtHoje += tBase;
                        mGrid[m].series[nomeSerie].planAtHoje += tBase;
                        gGrid[g].series[nomeSerie].planAtHoje += tBase;
                    }
                }
            }
        });
    });

    // V46: Acabamento real e base vêm da MESMA conta usada na Report.
    // As outras fases não são modificadas por este alinhamento.
    const pgAcabPorMarcaV46 = window.pgMetricasAcabamentoRealV46(
        tRef, dtHojeISO, l => String(l.MARCA_FINAL || l.UNIDADE || 'N/A').toUpperCase());
    const pgAcabPorGraficaV46 = window.pgMetricasAcabamentoRealV46(
        tRef, dtHojeISO, l => String(l.GRAFICA_FINAL || l['GRÁFICA'] || 'N/A').toUpperCase());
    const pgAplicarAcabV46 = (celula, agregado) => {
        if (!celula) return;
        const a = agregado || {den:0,real:0,plan:0,
            pcp:{den:0,real:0,plan:0}, acab:{den:0,real:0,plan:0}};
        celula.base = a.den;
        celula.real = a.real;
        celula.planAtHoje = a.plan;
        ['pcp','acab'].forEach(fonte => {
            celula[fonte].base = a[fonte].den;
            celula[fonte].real = a[fonte].real;
            celula[fonte].planAtHoje = a[fonte].plan;
        });
    };
    if (fTotais.acab) pgAplicarAcabV46(fTotais.acab, pgAcabPorMarcaV46.total);
    Object.entries(pgAcabPorMarcaV46.porGrupo).forEach(([m, a]) => {
        if (!mGrid[m]) {
            mGrid[m] = {total:0,pcp:{total:0},acab:{total:0},series:{}};
            fasesAtivas.forEach(f => mGrid[m][f.id] = initFase());
        }
        pgAplicarAcabV46(mGrid[m].acab, a);
    });
    Object.entries(pgAcabPorGraficaV46.porGrupo).forEach(([g, a]) => {
        if (!gGrid[g]) {
            gGrid[g] = {total:0,pcp:{total:0},acab:{total:0},series:{}};
            fasesAtivas.forEach(f => gGrid[g][f.id] = initFase());
        }
        pgAplicarAcabV46(gGrid[g].acab, a);
    });

    const coletaResumo = window.pgResumoColetaFunil;
    const aplicarPlanoColeta = (grid, resumo) => {
        ['col_mapa'].forEach(id => {
            if (grid[id]) grid[id].planoColetaFinal = resumo || { total: 0, esperadoHoje: 0 };
        });
    };
    aplicarPlanoColeta(fTotais, coletaResumo);
    Object.keys(mGrid).forEach(g => aplicarPlanoColeta(mGrid[g], coletaResumo.marcas[g]));
    Object.keys(gGrid).forEach(g => aplicarPlanoColeta(gGrid[g], coletaResumo.graficas[g]));

    let calcSeries = (seriesObj) => {
        let tot = 0; let fin = 0; let atrasadas = 0;
        Object.values(seriesObj).forEach(s => {
            if (s.base > 0) {
                tot++;
                if (s.real >= s.base) { fin++; } else if (s.real < s.planAtHoje) { atrasadas++; }
            }
        });
        return { total: tot, finalizadas: fin, atrasadas: atrasadas };
    };
    
    let seriesGeral = calcSeries(seriesGlobais);

    // BASE CANÔNICA DO TOTAL / TABELAS
    // A tiragem reage a Origem e Destino; Acabamento mantém seu denominador anterior.
    // Ela já foi montada em aplicarFiltros() pela Origem:
    // Gráfica = PCP | Acabadora = PCP_ACABADORAS | Todas = PCP direto + PCP_ACABADORAS.
    const linhasBaseCanonica = window.dadosTotalCanonico || [];

    // Denominador estático para Env. Arq / Rec. Bon / Apv. Bon: o Destino não pode alterá-lo.
    const linhasBaseFasesIniciais = (document.getElementById('pgFiltroOrigem')?.value === 'ACABADORA'
        ? (window.dadosTotalAcabadoraBase || [])
        : (window.dadosTotalPCPBase || []));
    const baseTotalFasesIniciais = new Map();
    const baseMarcaFasesIniciais = {};
    const baseGraficaFasesIniciais = {};
    linhasBaseFasesIniciais.forEach(l => {
        const volume = window.arredondar(l['TIRAGEM'] || l['QUANTIDADE'] || 0);
        const chave = getKey(l);
        if (volume <= 0 || baseTotalFasesIniciais.has(chave)) return;
        baseTotalFasesIniciais.set(chave, volume);
        const marca = String(l['MARCA_FINAL'] || l['UNIDADE'] || 'N/A').toUpperCase();
        const grafica = String(l['GRAFICA_FINAL'] || l['GRÁFICA'] || 'N/A').toUpperCase();
        baseMarcaFasesIniciais[marca] = (baseMarcaFasesIniciais[marca] || 0) + volume;
        baseGraficaFasesIniciais[grafica] = (baseGraficaFasesIniciais[grafica] || 0) + volume;
    });
    const totalFasesIniciais = Array.from(baseTotalFasesIniciais.values()).reduce((a, b) => a + b, 0);

    // V46: denominadores idênticos aos da Report, inclusive por marca/gráfica.
    const baseMarcaAcabamento = Object.fromEntries(
        Object.entries(pgAcabPorMarcaV46.porGrupo).map(([k, v]) => [k, v.den]));
    const baseGraficaAcabamento = Object.fromEntries(
        Object.entries(pgAcabPorGraficaV46.porGrupo).map(([k, v]) => [k, v.den]));
    const totalAcabamento = pgAcabPorMarcaV46.total.den;

    const baseTotalCanonica = {};
    const baseMarcaCanonica = {};
    const baseGraficaCanonica = {};

    linhasBaseCanonica.forEach(l => {
        const tBaseCanon = window.arredondar(l["TIRAGEM"] || l["QUANTIDADE"] || 0);
        if (tBaseCanon <= 0) return;

        const srcCanon = l["_SOURCE"] === "ACABADORA" ? "acab" : "pcp";
        const chaveOperacional = getKey(l);
        // O roteamento já retirou a transferência PCP. A identidade da linha
        // evita reenvios sem colapsar lotes distintos da mesma OP/SKU.
        const chaveCanon = chaveOperacional;
        if (baseTotalCanonica[chaveCanon] !== undefined) return;

        baseTotalCanonica[chaveCanon] = tBaseCanon;
        const marcaCanon = String(l["MARCA_FINAL"] || l["UNIDADE"] || "N/A").toUpperCase();
        const graficaCanon = String(l["GRAFICA_FINAL"] || l["GRÁFICA"] || "N/A").toUpperCase();
        baseMarcaCanonica[marcaCanon] = (baseMarcaCanonica[marcaCanon] || 0) + tBaseCanon;
        baseGraficaCanonica[graficaCanon] = (baseGraficaCanonica[graficaCanon] || 0) + tBaseCanon;
    });

    // IMPORTANTE: não altera a lógica/volumes das fases do Funil.
    // Apenas faz Funil e tabelas compartilharem exatamente a mesma tiragem canônica.
    // Cria também linhas de Marca/Gráfica que existam na tiragem, mesmo que o Destino
    // atualmente selecionado não tenha volume em alguma fase.
    Object.keys(baseMarcaCanonica).forEach(m => {
        if (!mGrid[m]) {
            mGrid[m] = { total: 0, pcp: {total:0}, acab: {total:0}, series: {} };
            fasesAtivas.forEach(f => mGrid[m][f.id] = initFase());
        }
    });
    Object.keys(baseGraficaCanonica).forEach(g => {
        if (!gGrid[g]) {
            gGrid[g] = { total: 0, pcp: {total:0}, acab: {total:0}, series: {} };
            fasesAtivas.forEach(f => gGrid[g][f.id] = initFase());
        }
    });
    Object.keys(mGrid).forEach(m => { mGrid[m].total = baseMarcaCanonica[m] || 0; });
    Object.keys(gGrid).forEach(g => { gGrid[g].total = baseGraficaCanonica[g] || 0; });

    let tGeral = Object.values(baseTotalCanonica).reduce((a,b)=>a+b, 0);

    // ORIGEM = ACABADORA: a aba começa operacionalmente após O.C.
    // Portanto Env. Arq até O.C. aparecem como 100% do Total Base da PCP_ACABADORAS.
    const origemAcabadoraAtiva = document.getElementById('pgFiltroOrigem')?.value === 'ACABADORA';
    const fases100Acabadora = new Set(['env', 'rec', 'apv', 'imp', 'cus', 'oc']);
    const forcarFase100Acabadora = (cell, total) => {
        if (!cell) return;
        const v = Math.max(0, Number(total || 0));
        cell.base = v;
        cell.real = v;
        cell.planAtHoje = v;
        cell.pendenteVencido = 0;
        cell.pendenciasMapaAY = 0;
        cell.pcp.base = 0;
        cell.pcp.real = 0;
        cell.pcp.planAtHoje = 0;
        cell.pcp.pendenteVencido = 0;
        cell.pcp.pendenciasMapaAY = 0;
        cell.acab.base = v;
        cell.acab.real = v;
        cell.acab.planAtHoje = v;
        cell.acab.pendenteVencido = 0;
        cell.acab.pendenciasMapaAY = 0;
    };
    if (origemAcabadoraAtiva) {
        fases100Acabadora.forEach(id => {
            forcarFase100Acabadora(fTotais[id], tGeral);
            Object.keys(mGrid).forEach(m => forcarFase100Acabadora(mGrid[m][id], mGrid[m].total));
            Object.keys(gGrid).forEach(g => forcarFase100Acabadora(gGrid[g][id], gGrid[g].total));
        });
    }
    
    // V37: quadro bruto, matrizes e curva NÃO recalculam Coleta TP em universos diferentes.
    // O recorte único é resumo.registros, obtido por dadosBaseForecastColeta.
    const resumoColetaUnico = window.pgObterResumoColeta();
    const idsUnificados = ['col_mapa', 'col_tp', 'ent_tp'];
    const camposUnificados = {col_mapa: 'mapa', col_tp: 'coleta', ent_tp: 'entrega'};
    const totaisUnificados = {};
    const marcasUnificadas = {};
    const graficasUnificadas = {};
    const zeroUnificado = () => ({mapa:0, coleta:0, entrega:0, plan:0,
                                  pcp:{mapa:0,coleta:0,entrega:0,plan:0},
                                  acab:{mapa:0,coleta:0,entrega:0,plan:0}});
    const acumularUnificado = (destino, chave, fonte, volumes, plan) => {
        const k = chave || 'N/A';
        if (!destino[k]) destino[k] = zeroUnificado();
        ['mapa','coleta','entrega'].forEach(id => {
            destino[k][id] += volumes[id];
            destino[k][fonte][id] += volumes[id];
        });
        destino[k].plan += plan;
        destino[k][fonte].plan += plan;
    };
    (resumoColetaUnico.registros || []).forEach(r => {
        const l = r.linha || r.pcp;
        if (!l) return;
        const fonte = String(l._SOURCE || '').toUpperCase().includes('ACAB') ? 'acab' : 'pcp';
        const v = window.pgVolumesColetaUnificadosV37(l, dtHojeISO);
        const plan = r.dtPlan && r.dtPlan <= dtHojeISO ? Number(r.tiragem || 0) : 0;
        acumularUnificado(totaisUnificados, 'GERAL', fonte, v, plan);
        acumularUnificado(marcasUnificadas,
            String(l.MARCA_FINAL || l.UNIDADE || 'N/A').trim().toUpperCase(), fonte, v, plan);
        acumularUnificado(graficasUnificadas,
            String(l.GRAFICA_FINAL || l['GRÁFICA'] || 'N/A').trim().toUpperCase(), fonte, v, plan);
    });
    const aplicarUnificado = (cell, valores, id) => {
        if (!cell) return;
        const v = valores || zeroUnificado();
        const campo = camposUnificados[id];
        cell.real = v[campo];
        cell.pcp.real = v.pcp[campo];
        cell.acab.real = v.acab[campo];
        cell.planAtHoje = v.plan;
        cell.pcp.planAtHoje = v.pcp.plan;
        cell.acab.planAtHoje = v.acab.plan;
    };
    idsUnificados.forEach(id => {
        aplicarUnificado(fTotais[id], totaisUnificados.GERAL, id);
        Object.entries(marcasUnificadas).forEach(([k,v]) => {
            if (!mGrid[k]) {
                mGrid[k] = {total:0,pcp:{total:0},acab:{total:0},series:{}};
                fasesAtivas.forEach(f => mGrid[k][f.id] = initFase());
            }
            aplicarUnificado(mGrid[k][id], v, id);
        });
        Object.entries(graficasUnificadas).forEach(([k,v]) => {
            if (!gGrid[k]) {
                gGrid[k] = {total:0,pcp:{total:0},acab:{total:0},series:{}};
                fasesAtivas.forEach(f => gGrid[k][f.id] = initFase());
            }
            aplicarUnificado(gGrid[k][id], v, id);
        });
    });
    console.info('[CONCILIACAO V37]', {
        quadroColeta: fTotais.col_tp?.real,
        curvaColeta: resumoColetaUnico.realizado,
        mapa: fTotais.col_mapa?.real,
        entrega: fTotais.ent_tp?.real
    });

    // PG_BRUTO_REFERENCIA_FONTES_V56_20260925
    // Leitura independente de REFERENCIA BRUTA, sem recalcular os percentuais.
    // PCP: Env. Arq. ate Acabamento, inclusive materiais que seguem para acabadora.
    // SAS: acabamento permanece EXCLUSIVAMENTE na PCP_ACABADORAS (regra de fase).
    // PCP_ACABADORAS: encaminhamento de Form. Kit em diante; nao soma outra
    // vez o mesmo lote no Total. Os percentuais continuam com as bases antigas.
    const pgFonteAcabV56 = l => window.pgEhFonteAcabadora(l);
    const pgNormV56 = v => String(v == null ? '' : v)
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .trim().replace(/\s+/g, ' ').toUpperCase();
    const pgVolumeBaseV56 = l => Math.max(0,
        Number(window.arredondar(l['TIRAGEM'] || l['QUANTIDADE'] || 0)) || 0);
    const pgMarcaV56 = l => pgNormV56(l.MARCA_FINAL || l.UNIDADE || l.MARCA || 'N/A');
    const pgGraficaV56 = l => pgNormV56(l.GRAFICA_FINAL || l['GRÁFICA'] || l.GRAFICA || 'N/A');
    const pgFonteV56 = l => pgFonteAcabV56(l) ? 'ACABADORA' : 'PCP';
    const pgLoteV56 = l => {
        // JOIN_KEY relaciona a passagem entre abas; _ROW_ID/getKey evita
        // unir lotes distintos quando esse campo nao existe.
        const chave = pgNormV56(l.JOIN_KEY || l['JOIN KEY'] || l.B || '');
        return pgMarcaV56(l) + '|' + (chave || 'LINHA:' + getKey(l));
    };
    const pgFasesBrutasV56 = new Set([
        'env', 'rec', 'apv', 'imp', 'acab', 'tra', 'rec_acab',
        'kit', 'col', 'ent_cd', 'int_cd'
    ]);
    const pgCandidatasV56 = FASES.filter(f => pgFasesBrutasV56.has(f.id));
    // Usa as MESMAS listas filtradas ja construidas pelo portal. Independente
    // de quais checkbox de fase estao marcados na interface.
    const pgLinhasBrutasV56 = window.pgLinhasUnicas(
        dadosProcessamento.filter(l =>
            setFinalTotal.has(l) || pgCandidatasV56.some(f =>
                linhaPermitidaNaFase(l, f.id) && belongsToPhase(l, f.id))
        )
    );
    const pgAgregadosV56 = {marca:new Map(), grafica:new Map(), geral:new Map()};
    const pgAdicionarV56 = (mapa, grupo, l) => {
        if (!mapa.has(grupo)) mapa.set(grupo, new Map());
        const lotes = mapa.get(grupo);
        const k = pgLoteV56(l);
        if (!lotes.has(k)) lotes.set(k, {PCP:new Map(), ACABADORA:new Map()});
        // Uma linha pode aparecer em mais de uma fase, mas sua tiragem so entra uma vez.
        lotes.get(k)[pgFonteV56(l)].set(getKey(l), pgVolumeBaseV56(l));
    };
    pgLinhasBrutasV56.forEach(l => {
        if (!pgVolumeBaseV56(l)) return;
        pgAdicionarV56(pgAgregadosV56.marca, pgMarcaV56(l), l);
        pgAdicionarV56(pgAgregadosV56.grafica, pgGraficaV56(l), l);
        pgAdicionarV56(pgAgregadosV56.geral, 'GERAL', l);
    });
    const pgSomarV56 = mapa => {
        let total = 0;
        (mapa || new Map()).forEach(lote => {
            const pcp = Array.from(lote.PCP.values()).reduce((s,v) => s+v,0);
            const acab = Array.from(lote.ACABADORA.values()).reduce((s,v) => s+v,0);

        if (!th || !tb) return;
        const contexto = (fase, grupo = null) => ({ fase, grupo, tipo: sufixo.startsWith('Marca') ? 'marca' : 'grafica' });
        const ativos = grupos.filter(g => grid[g] && (grid[g].total > 0 || ['env', 'rec', 'apv', 'imp', 'cus', 'oc', 'acab'].some(id => grid[g][id]?.base > 0)));
        const esc = v => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const header = texto => `<th class="p-2 border-r border-slate-300 text-center min-w-[92px]">${esc(texto)}</th>`;
        th.innerHTML = '<th class="p-2 border-r border-slate-300 sticky left-0 bg-slate-100 z-20 min-w-[150px]">Indicador</th>'
            + ativos.map(header).join('') + header('Total Geral');
        const inicio = nome => `<tr class="border-b border-slate-100 hover:bg-slate-50"><td class="p-2 border-r border-slate-200 font-black sticky left-0 bg-white z-10">${esc(nome)}</td>`;
        const volume = n => `<td class="p-2 border-r border-slate-200 ${percentual ? 'text-center' : 'text-right'} font-black bg-slate-50">${percentual ? fmtCompactoFunil(n) : window.formatarBR(n)}</td>`;
        let h = inicio('00 - Tiragem Total') + ativos.map(g => volume(percentual ? grid[g].total : pgBrutoGrupoV56(contexto('total', g)))).join('') + volume(percentual ? tGeral : pgTotalBrutoV56) + '</tr>';
        fasesAtivas.forEach((f, idx) => {
            h += inicio(String(idx + 1).padStart(2, '0') + ' - ' + nomeFaseTabelaFunil(f));
            ativos.forEach(g => {
                h += percentual ? montarCelulaPctFunil(grid[g][f.id], grid[g].total, f.colPlan !== null, contexto(f.id, g)) : montarCelulaBrutaFunil(grid[g][f.id]);
            });
            h += (percentual ? montarCelulaPctFunil(fTotais[f.id], tGeral, f.colPlan !== null, contexto(f.id)) : montarCelulaBrutaFunil(fTotais[f.id])) + '</tr>';
        });
        h += inicio(String(fasesAtivas.length + 1).padStart(2, '0') + ' - Séries Finalizadas');
        const totalSeries = { finalizadas: 0, total: 0 };
        ativos.forEach(g => {
            const resumo = pgResumoSeries(mapaSeries, String(g).trim().toUpperCase());
            totalSeries.finalizadas += resumo.finalizadas;
            totalSeries.total += resumo.total;
            h += percentual ? montarCelulaSeriesPct(resumo, contexto('series', g)) : montarCelulaSeriesBruta(resumo);
        });
        totalSeries.pct = totalSeries.total > 0 ? Math.round(totalSeries.finalizadas / totalSeries.total * 100) : 0;
        h += (percentual ? montarCelulaSeriesPct(totalSeries, contexto('series')) : montarCelulaSeriesBruta(totalSeries)) + '</tr>';
        tb.innerHTML = h;
    };
    const aG = Object.keys(gGrid).sort((a, b) => gGrid[b].total - gGrid[a].total);
    renderResumoTransposto('MarcaTiragem', aM, mGrid, pgSeriesPorMarca, false);
    renderResumoTransposto('MarcaPct', aM, mGrid, pgSeriesPorMarca, true);
    renderResumoTransposto('GraficaTiragem', aG, gGrid, pgSeriesPorGrafica, false);
    renderResumoTransposto('GraficaPct', aG, gGrid, pgSeriesPorGrafica, true);
};

    function renderCurvaAcumulada() {
        const elsCb = document.querySelectorAll('.chk-fase-curva:checked');
        const cbFases = elsCb.length > 0
            ? Array.from(elsCb).map(cb => cb.value)
            : ['imp', 'col'];

        const tRef = document.getElementById('filtroReferencia').value;
        const hojeISO = dtHojeISO;
        const unifiedDates = new Set();
        const dataSeries = {};

        cbFases.forEach(fId => {
            dataSeries[fId] = { plan: {}, real: {}, total: 0 };
        });

        window.pgDadosParaFases().forEach(l => {
            const tBase = window.arredondar(l['TIRAGEM'] || l['QUANTIDADE']);
            if (tBase <= 0) return;

            cbFases.forEach(fId => {
                const fObj = FASES.find(f => f.id === fId);
                if (!fObj) return;

                if (!(window.pgLinhaNaVisaoDaFase(l, fId) && belongsToPhase(l, fId))) {
                    return;
                }

                // Exatamente a mesma base e volume real usados pelo Funil.
                const tFaseReal = window.getVolFase(l, fObj, tBase);
                dataSeries[fId].total += tBase;

                // Exatamente a mesma regra de (re) plan / fallback usada pelo Funil.
                const dtP = window.pgDataPlanoFaseFunil(l, fObj, tRef);

                // Exatamente a mesma regra de realizado.
                const temReal = dataFoiPreenchida(l, fObj);
                const dtR = temReal
                    ? window.pgDataRealFaseFunil(l, fObj)
                    : null;

                if (dtP) {
                    dataSeries[fId].plan[dtP] =
                        (dataSeries[fId].plan[dtP] || 0) + tBase;
                    unifiedDates.add(dtP);
                }

                if (dtR && tFaseReal > 0) {
                    dataSeries[fId].real[dtR] =
                        (dataSeries[fId].real[dtR] || 0) + tFaseReal;
                    unifiedDates.add(dtR);
                }
            });
        });

        const dtOrd = Array.from(unifiedDates).sort();
        const cvS = document.getElementById('graficoCurvaS');

        if (!cvS) return;

        if (dtOrd.length === 0) {
            if (graficos.curvaS) graficos.curvaS.destroy();
            return;
        }

        const lbs = dtOrd.map(d => {
            const p = d.split('-');
            return `${p[2]}/${p[1]}`;
        });

        const datasets = [];

        cbFases.forEach(fId => {
            const fObj = FASES.find(f => f.id === fId);
            if (!fObj) return;

            let sP = 0;
            let sR = 0;
            const aP = [];
            const aR = [];
            const tFase = dataSeries[fId].total;

            dtOrd.forEach(d => {
                sP += dataSeries[fId].plan[d] || 0;
                sR += dataSeries[fId].real[d] || 0;

                let ptP = tFase > 0
                    ? ((sP / tFase) * 100).toFixed(1)
                    : '0.0';

                if (ptP === '100.0' && sP < tFase) ptP = '99.9';
                aP.push(ptP);

                if (d <= hojeISO) {
                    let ptR = tFase > 0
                        ? ((sR / tFase) * 100).toFixed(1)
                        : '0.0';

                    if (ptR === '100.0' && sR < tFase) ptR = '99.9';
                    aR.push(ptR);
                } else {
                    aR.push(null);
                }
            });

            datasets.push({
                label: `[Plan] ${fObj.nome}`,
                data: aP,
                borderColor: fObj.corLinha,
                backgroundColor: 'transparent',
                borderDash: [5, 5],
                borderWidth: 2,
                pointRadius: 0,
                tension: 0.3
            });

            datasets.push({
                label: `[Real] ${fObj.nome}`,
                data: aR,
                borderColor: fObj.corLinha,
                backgroundColor: 'transparent',
                borderWidth: 3,
                pointRadius: 1,
                tension: 0.3,
                spanGaps: false
            });
        });

        if (graficos.curvaS) graficos.curvaS.destroy();

        graficos.curvaS = new Chart(cvS, {
            type: 'line',
            data: {
                labels: lbs,
                datasets
            },
            options: {
                maintainAspectRatio: false,
                scales: {
                    y: {
                        min: 0,
                        max: 105
                    }
                },
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            boxWidth: 12
                        }
                    },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        callbacks: {
                            label(c) {
                                if (c.raw === null) return null;
                                return c.dataset.label + ': ' + c.parsed.y + '%';
                            }
                        }
                    }
                },
                interaction: {
                    mode: 'nearest',
                    axis: 'x',
                    intersect: false
                }
            }
        });
    }

    function processarMatriz() {
        let tRef = document.getElementById('filtroReferencia').value;
        let filtroFaseGargalo = document.getElementById('selFaseMatriz') ? document.getElementById('selFaseMatriz').value : 'TODOS';
        let dts = {}; let tGeral = 0; let tGeralSku = 0;
        const TOLERANCIA_FIXA = 3; 
        
        // Fases consideradas "Editoriais" (antes de iniciar a impressão propriamente dita)
        const fasesEditoriaisIds = ['env', 'rec', 'apv'];
        
        let somasFase = {}; FASES.forEach(f => somasFase[f.id] = { okV:0, okS:0, warnV:0, warnS:0, critV:0, critS:0, ndV:0, ndS:0, iniV:0, iniS:0 });
        let listaCriticos = [];
        
        window.pgDadosParaFases().forEach(l => {
            let t = window.arredondar(l["TIRAGEM"] || l["QUANTIDADE"]); 
            if (t <= 0) return;
            
            let g = l["GRÁFICA"] || "N/A"; 
            let m = l["UNIDADE"] || "N/A"; 
            let cd = l["CD DESTINO"] || l["CD"] || "N/A"; 
            let cv = g + "|" + m;

            if(!dts[cv]) { 
                dts[cv] = { grafica: g, marca: m, total: 0, totalSku: 0 };
                FASES.forEach(f => dts[cv][f.id] = { okV:0, okS:0, warnV:0, warnS:0, critV:0, critS:0, ndV:0, ndS:0, iniV:0, iniS:0 });
            }
            
            // 1. DESCOBRE ONDE O ITEM ESTÁ TRAVADO (SEM PULAR FASE)
            let wipFase = null; let wipIndex = -1;
            for(let i = 0; i < FASES.length; i++) {
                let f = FASES[i];
                if((window.pgLinhaNaVisaoDaFase(l, f.id) && belongsToPhase(l, f.id)) && !dataFoiPreenchida(l, f)) { wipFase = f; wipIndex = i; break; }
            }
            
            if(!wipFase) return; 
            if (filtroFaseGargalo !== 'TODOS' && wipFase.id !== filtroFaseGargalo) return;
            
            dts[cv].total += t; dts[cv].totalSku += 1; tGeral += t; tGeralSku += 1;
            let diasAtraso = calcAtraso(l, wipFase, tRef, dtHoje);
            
            // 2. LÓGICA DO IMPACTO PREVISTO (Próxima Fase ou Início da Impressão)
            let nomeFaseImpacto = "-";
            let dataFaseImpacto = "-";

            if (fasesEditoriaisIds.includes(wipFase.id)) {
                // Se é editorial, o impacto é na Impressão
                let faseImp = FASES.find(f => f.id === 'imp');
                if (faseImp) {
                    nomeFaseImpacto = "Início Impressão";
                    let dtIsoImp = extrairDataISO(l[getCols(faseImp, tRef).plan]);
                    dataFaseImpacto = dtIsoImp ? formatarDataBR(dtIsoImp) : "S/ Data";
                }
            } else {
                // Se já passou do editorial, o impacto é na próxima fase natural
                let nextFase = null;
                for (let k = wipIndex + 1; k < FASES.length; k++) {
                    if (belongsToPhase(l, FASES[k].id)) {
                        nextFase = FASES[k];
                        break;
                    }
                }
                if (nextFase) {
                    nomeFaseImpacto = nextFase.nome;
                    let dtIsoNext = extrairDataISO(l[getCols(nextFase, tRef).plan]);
                    dataFaseImpacto = dtIsoNext ? formatarDataBR(dtIsoNext) : "S/ Data";
                }
            }

            // 3. CÁLCULO DE STATUS (Atraso vs Tolerância)
            let cor = 'preto';
            let statusTexto = "No Prazo";
            
            if(diasAtraso === null) {
              cor = 'laranja'; statusTexto = "S/ Data";
            } else if(diasAtraso <= 0) {
              let colIniPlan = null;
              if (wipFase.id === 'imp') colIniPlan = 'Impressão Inicio (re) plan';
              else if (wipFase.id === 'acab') colIniPlan = 'Acbto Inicio (re) plan';
              else if (wipFase.id === 'kit') colIniPlan = 'Formação de kit/Encaixotamento início (re) plan';
              else if (wipFase.id === 'col' || wipFase.id === 'col_mapa' || wipFase.id === 'tra') colIniPlan = 'Coleta/Internalização de estoque inicial (re) plan';
              
              let atrasoInicio = false;
              if (colIniPlan) {
                  let dtIniPlan = extrairDataISO(l[colIniPlan]);
                  if (dtIniPlan) {
                      let pts = dtIniPlan.split('-');
                      let diffIni = Math.floor((dtHoje.getTime() - new Date(pts[0], pts[1]-1, pts[2]).getTime()) / 86400000);
                      let colIniRealVal = wipFase.colIniReal ? extrairDataISO(l[wipFase.colIniReal]) : null;
                      if (diffIni > 0 && !colIniRealVal) atrasoInicio = true;
                  }
              }
              
              if (atrasoInicio) {
                  cor = 'roxo'; statusTexto = "Início de fase";
              } else {
                  cor = 'preto'; statusTexto = "No Prazo";
              }
            } else {
                let gapBuffer = null;
                for (let k = wipIndex + 1; k < FASES.length; k++) {
                    let proxFase = FASES[k];
                    if (belongsToPhase(l, proxFase.id)) {
                        let colsAtual = getCols(wipFase, tRef); 
                        let colsProx = getCols(proxFase, tRef);
                        let dtPlanAtual = extrairDataISO(l[colsAtual.plan]); 
                        let dtPlanProx = extrairDataISO(l[colsProx.plan]);
                        if (dtPlanAtual && dtPlanProx) {
                            gapBuffer = calcDiffDiasISO(dtPlanAtual, dtPlanProx);
                        }
                        break; 
                    }
                }
                
                if (gapBuffer !== null) { 
                    if (diasAtraso >= gapBuffer) { cor = 'vermelho'; statusTexto = "Impacta Próx. Fase"; }
                    else { cor = 'amarelo'; statusTexto = "Atraso"; }
                } else { 
                    if (diasAtraso > TOLERANCIA_FIXA) { cor = 'vermelho'; statusTexto = "Impacta Próx. Fase"; }
                    else { cor = 'amarelo'; statusTexto = "Atraso"; }
                }
            }
            
            // Incrementa os contadores da matriz
            if(cor === 'preto') { dts[cv][wipFase.id].okV += t; dts[cv][wipFase.id].okS += 1; somasFase[wipFase.id].okV += t; somasFase[wipFase.id].okS += 1; }
            else if (cor === 'amarelo') { dts[cv][wipFase.id].warnV += t; dts[cv][wipFase.id].warnS += 1; somasFase[wipFase.id].warnV += t; somasFase[wipFase.id].warnS += 1; }
            else if (cor === 'laranja') { dts[cv][wipFase.id].ndV += t; dts[cv][wipFase.id].ndS += 1; somasFase[wipFase.id].ndV += t; somasFase[wipFase.id].ndS += 1; }
            else if (cor === 'roxo') { dts[cv][wipFase.id].iniV += t; dts[cv][wipFase.id].iniS += 1; somasFase[wipFase.id].iniV += t; somasFase[wipFase.id].iniS += 1; }
            else { dts[cv][wipFase.id].critV += t; dts[cv][wipFase.id].critS += 1; somasFase[wipFase.id].critV += t; somasFase[wipFase.id].critS += 1; }

            listaCriticos.push({ 
                grafica: g, marca: m, cd: cd, 
                op: l["OP"]||"-", sku: l["SKU"]||"-", 
                desc: l["DESC_REAL"] || l["DESCRIÇÃO"] || "-", 
                fase: wipFase.nome, dias: diasAtraso, tiragem: t,
                status: statusTexto, corStatus: cor,
                nomeFaseImpacto: nomeFaseImpacto,
                dataFaseImpacto: dataFaseImpacto
            });
        });

        // Montagem HTML da Matriz
        let hH = `<th class="p-2 border-r border-slate-200 sticky left-0 bg-slate-100 z-10 shadow-[1px_0_0_#cbd5e1]">Gráfica</th><th class="p-2 border-r border-slate-200">Marca</th><th class="p-2 border-r border-slate-200 text-right bg-slate-200 text-slate-800 font-bold">Total WIP</th>`;
        FASES.forEach(f => hH += `<th class="p-2 text-center border-r border-slate-200 min-w-[100px]">${f.nome}</th>`);
        document.getElementById('tbTabelonaCabecalho').innerHTML = hH;
        let arr = Object.values(dts).sort(sortGMarca); let hB = "";
        
        const hC = (d) => {
        if(d.okS === 0 && d.warnS === 0 && d.critS === 0 && d.ndS === 0 && d.iniS === 0) return `<td class="p-2 border-b text-center border-r border-slate-200 text-slate-300">-</td>`;
        let html = `<td class="p-2 border-b text-right border-r border-slate-200 align-top">`;
        if(d.critS > 0) html += `<div class="text-red-600 font-bold tracking-tight text-[10px] mb-1 border-b border-red-100 pb-0.5">🔴 ${window.formatarBR(d.critV)} <span class="text-[8px] opacity-70 block leading-none uppercase">${window.formatarBR(d.critS)} skus</span></div>`;
        if(d.ndS > 0) html += `<div class="text-orange-500 font-bold tracking-tight text-[10px] mb-1 border-b border-orange-50 pb-0.5">🟠 ${window.formatarBR(d.ndV)} <span class="text-[8px] opacity-70 block leading-none uppercase">${window.formatarBR(d.ndS)} skus</span></div>`;
        if(d.warnS > 0) html += `<div class="text-amber-500 font-bold tracking-tight text-[10px] mb-1 border-b border-amber-50 pb-0.5">🟡 ${window.formatarBR(d.warnV)} <span class="text-[8px] opacity-70 block leading-none uppercase">${window.formatarBR(d.warnS)} skus</span></div>`;
        if(d.iniS > 0) html += `<div class="text-purple-600 font-bold tracking-tight text-[10px] mb-1 border-b border-purple-100 pb-0.5">🟣 ${window.formatarBR(d.iniV)} <span class="text-[8px] opacity-70 block leading-none uppercase">${window.formatarBR(d.iniS)} skus</span></div>`;
        if(d.okS > 0) html += `<div class="text-slate-600 font-bold tracking-tight text-[10px]">⚫ ${window.formatarBR(d.okV)} <span class="text-[8px] text-slate-400 block leading-none uppercase">${window.formatarBR(d.okS)} skus</span></div>`;
        return html + `</td>`;
        };

        arr.forEach(d => {
            if (d.total === 0 && d.totalSku === 0) return;
            hB += `<tr class="hover:bg-slate-50 border-b border-slate-100"><td class="p-2 font-semibold border-r border-slate-200 sticky left-0 bg-white shadow-[1px_0_0_#e2e8f0] text-xs">${d.grafica}</td><td class="p-2 border-r border-slate-200 text-xs">${d.marca}</td><td class="p-2 border-r border-slate-200 text-right bg-slate-50 font-black text-indigo-700 text-xs leading-tight">${window.formatarBR(d.total)}<span class="block text-[9px] text-indigo-400 font-semibold uppercase">${window.formatarBR(d.totalSku)} skus</span></td>`;
            FASES.forEach(f => hB += hC(d[f.id])); hB += `</tr>`;
        });
        
        let msgVazia = filtroFaseGargalo === 'TODOS' ? "Nenhum dado WIP encontrado." : `Nenhum WIP encontrado na fase: ${filtroFaseGargalo}.`;
        document.getElementById('tbTabelona').innerHTML = hB || `<tr><td colspan="12" class="p-4 text-center text-slate-500">${msgVazia}</td></tr>`;
        
        let hF = `<tr class="bg-slate-800 text-white font-bold text-[10px]"><td colspan="2" class="p-2 border-r border-slate-700 text-right sticky left-0 bg-slate-800 shadow-[1px_0_0_#334155]">TOTAL GERAL</td><td class="p-2 border-r border-slate-700 text-right text-emerald-400 font-black text-sm leading-tight">${window.formatarBR(tGeral)}<span class="block text-[9px] text-emerald-600 font-normal uppercase">${window.formatarBR(tGeralSku)} skus</span></td>`;
        FASES.forEach(f => {
            let d = somasFase[f.id];
            let cell = `<td class="p-2 border-r border-slate-700 text-right align-top">`;
            if(d.critS > 0) cell += `<div class="text-red-400 mb-1">🔴 ${window.formatarBR(d.critV)}</div>`;
            if(d.ndS > 0) cell += `<div class="text-orange-400 mb-1">🟠 ${window.formatarBR(d.ndV)}</div>`;
            if(d.warnS > 0) cell += `<div class="text-amber-400 mb-1">🟡 ${window.formatarBR(d.warnV)}</div>`;
            if(d.iniS > 0) cell += `<div class="text-purple-400 mb-1">🟣 ${window.formatarBR(d.iniV)}</div>`;
            if(d.okS > 0) cell += `<div class="text-slate-400">⚫ ${window.formatarBR(d.okV)}</div>`;
            hF += cell + `</td>`;
        });
        document.getElementById('tbTabelonaRodape').innerHTML = hF + `</tr>`;

        // Renderiza a Lista TOP 50
        listaCriticos.sort((a,b) => {
            if (a.dias === null && b.dias !== null) return -1;
            if (a.dias !== null && b.dias === null) return 1;
            return b.dias - a.dias;
        }); 
        dadosCascataCSV = listaCriticos; 

        let hD = ""; 
        listaCriticos.slice(0,50).forEach(i => {
            let corDias = (i.dias > 0 || i.dias === null) ? "text-red-600 font-bold" : "text-slate-500 font-semibold";
            let corFase = (i.dias > 0 || i.dias === null) ? "text-slate-700 font-bold" : "text-slate-500 font-semibold";

            let badgeClass = "bg-slate-100 text-slate-500 border border-slate-200";
            if (i.corStatus === 'laranja') badgeClass = "bg-orange-100 text-orange-700 border border-orange-300 font-bold";
            else if(i.corStatus === 'amarelo') badgeClass = "bg-amber-100 text-amber-700 border border-amber-300 font-bold";
            else if(i.corStatus === 'roxo') badgeClass = "bg-purple-100 text-purple-700 border border-purple-300 font-bold";
            else if (i.corStatus === 'vermelho') badgeClass = "bg-red-100 text-red-700 border border-red-300 font-black";

            hD += `<tr class="border-b border-slate-100 hover:bg-slate-50">
                <td class="p-2">${i.grafica}</td>
                <td class="p-2">${i.marca}</td>
                <td class="p-2 text-indigo-700 font-semibold">${i.cd}</td>
                <td class="p-2 text-[9px]"><span class="font-bold">${i.sku}</span><br>${i.desc}</td>
                <td class="p-2 ${corFase}">${i.fase}</td>
                
                <td class="p-2 text-xs bg-slate-50/50">
                    <span class="font-bold text-slate-700">${i.nomeFaseImpacto}</span><br>
                    <span class="text-[9px] text-slate-500">Lim: ${i.dataFaseImpacto}</span>
                </td>
                
                <td class="p-2 text-center"><span class="px-1.5 py-0.5 rounded text-[8px] uppercase tracking-wider shadow-sm ${badgeClass}">${i.status}</span></td>
                <td class="p-2 text-right ${corDias}">${i.dias === null ? 'S/ Data' : i.dias + ' d'}</td>
                <td class="p-2 text-right font-bold text-slate-700">${window.formatarBR(i.tiragem)}</td>
            </tr>`;
        });
        document.getElementById('tabelaCriticos').innerHTML = hD || `<tr><td colspan="9" class="p-3 text-center text-slate-500">Limpo! Nenhum item travado nesta visão.</td></tr>`;
    }

    function processarEficiencia() {
        const fasesEficiencia = FASES.filter(f => !['oc','col_mapa','ent_cd','int_cd'].includes(f.id));
