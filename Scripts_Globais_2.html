    let totGrafica = initObj({ label: "TOTAIS" });
    let totMarca = initObj({ label: "TOTAIS" });
    let totGeral = initObj({ label: "TOTAIS" });

    dadosFiltrados.forEach(l => {
        let t = window.arredondar(l["TIRAGEM"] || l["QUANTIDADE"]); 
        if (t <= 0) return; 
        
        let fObj = null;
        
        // Se for "Visão Geral", descobre a fase exata onde o material está parado agora
        if (fId === 'TODOS') {
            for(let i = 0; i < FASES.length; i++) {
                let f = FASES[i];
                if(belongsToPhase(l, f.id) && !dataFoiPreenchida(l, f)) { 
                    fObj = f; 
                    break; 
                }
            }
        } else {
            // Se for uma fase específica, apenas checa ela
            let f = FASES.find(x => x.id === fId);
            if (belongsToPhase(l, f.id) && !dataFoiPreenchida(l, f)) {
                fObj = f;
            }
        }
        
        // Se o item já concluiu tudo ou não pertence à fase filtrada, pula
        if (!fObj) return; 
        
        let cols = getCols(fObj, tRef); 
        
        let g = l["GRÁFICA"]||"N/A", m = l["UNIDADE"]||"N/A", seg = l["SEGMENTO"]||"N/A", ser = l["SÉRIE"]||"N/A";
        let cv = g+"|"+m+"|"+seg+"|"+ser;
        
        if(!plan[cv]) plan[cv] = initObj({ grafica: g, marca: m, segmento: seg, serie: ser });
        if(!planGrafica[g]) planGrafica[g] = initObj({ label: g });
        if(!planMarca[m]) planMarca[m] = initObj({ label: m });
        
        let dAtr = calcAtraso(l, fObj, tRef, dtHoje);
        let tgt = null; 

        // NOVA REGRA: Atraso NULL vai para S/ Data
        if (dAtr === null) {
            tgt = 'bNd';
        } else if (dAtr > 0) {
            if (dAtr > 14) tgt = 'bRet';       // Antigas
            else if (dAtr > 7) tgt = 'bPas';   // Semana Passada (8 a 14)
            else if (dAtr > 3) tgt = 'bAtu';   // Semana Atual (4 a 7)
            else tgt = 'bRec';                 // Últimos 3 dias
        } 
        else {
            let dISO = extrairDataISO(l[cols.plan]);
            if(dISO) {
                let pts = dISO.split('-'); let dp = new Date(pts[0], pts[1]-1, pts[2]);
                let df = Math.floor((dp.getTime() - dtHoje.getTime()) / 86400000);
                
                if (df <= 3) tgt = 'pRec';         // Próximos 3 dias
                else if (df <= 7) tgt = 'pAtu';    // Semana Atual
                else if (df <= 14) tgt = 'pPrx';   // Próxima Sem
                else tgt = 'pLon';                 // Futuro
            } else {
                tgt = 'bNd'; // Prevenção caso a data fure o parse de cima
            }
        }
        if(tgt) {
            // Soma na Linha Específica
            plan[cv][tgt] += t; plan[cv][tgt+'S'] += 1;
            planGrafica[g][tgt] += t; planGrafica[g][tgt+'S'] += 1;
            planMarca[m][tgt] += t; planMarca[m][tgt+'S'] += 1;
            // Soma no Rodapé (Acumulado)
            totGrafica[tgt] += t; totGrafica[tgt+'S'] += 1;
            totMarca[tgt] += t; totMarca[tgt+'S'] += 1;
            totGeral[tgt] += t; totGeral[tgt+'S'] += 1;
        }
    });

    const fmt = (v, s, cV, cS, bg) => {  
        if(s===0) return `<td class="p-2 border-r border-slate-300 text-center ${bg} text-slate-300">-</td>`; 
        return `<td class="p-2 border-r border-slate-200 text-right ${bg}"><div class="font-black ${cV} leading-tight">${window.formatarBR(v)}</div><div class="text-[8px] ${cS} uppercase">${window.formatarBR(s)} skus</div></td>`; 
    };

    // Função que agora renderiza o Corpo E o Rodapé
    const renderTBody = (objData, objTotais, elIdBody, elIdFoot, isSummary = false) => {
        let arr = Object.values(objData).sort((a,b) => (a.grafica||a.label).localeCompare(b.grafica||b.label));
        let h = "";
        
        arr.forEach(p => {
            h += `<tr class="border-b border-slate-100 hover:bg-slate-50">`;
            if(isSummary) {
                h += `<td class="p-2 border-r border-slate-200 font-bold">${p.label}</td>`;
            } else {
                h += `<td class="p-2 border-r border-slate-200 font-bold">${p.grafica}</td><td class="p-2 border-r border-slate-200 font-semibold">${p.marca}</td><td class="p-2 border-r border-slate-200 text-[10px]">${p.segmento}</td><td class="p-2 border-r border-slate-200 text-[10px]">${p.serie}</td>`;
            }
            
            h += fmt(p.bNd, p.bNdS, 'text-orange-700', 'text-orange-500 font-bold', 'bg-orange-50');
            h += fmt(p.bRet, p.bRetS, 'text-red-700', 'text-red-500 font-bold', 'bg-red-50/50'); 
            h += fmt(p.bPas, p.bPasS, 'text-red-600', 'text-red-400 font-bold', 'bg-red-50/50'); 
            h += fmt(p.bAtu, p.bAtuS, 'text-red-500', 'text-red-400 font-bold', 'bg-red-50/50'); 
            
            h += fmt(p.bRec, p.bRecS, 'text-amber-700', 'text-amber-600 font-bold', 'bg-yellow-50 border-l-2 border-l-yellow-300'); 
            h += fmt(p.pRec, p.pRecS, 'text-amber-700', 'text-amber-600 font-bold', 'bg-yellow-50 border-r-2 border-r-yellow-300'); 

            h += fmt(p.pAtu, p.pAtuS, 'text-blue-500', 'text-blue-400 font-bold', 'bg-blue-50/50'); 
            h += fmt(p.pPrx, p.pPrxS, 'text-blue-600', 'text-blue-500 font-bold', 'bg-blue-50/50'); 
            h += fmt(p.pLon, p.pLonS, 'text-blue-700', 'text-blue-500 font-bold', 'bg-blue-50/50'); 
            
            h += `</tr>`;
        });

        // Aplica o HTML do corpo da tabela
        document.getElementById(elIdBody).innerHTML = h || `<tr><td colspan="${isSummary ? 10 : 13}" class="p-5 text-center">Nenhum registro.</td></tr>`;

        // ==========================================
        // GERAÇÃO DO RODAPÉ COM OS TOTAIS (TFOOT)
        // ==========================================
        let f = `<tr>`;
        if(isSummary) {
            f += `<td class="p-2 border-r border-slate-300 font-black text-right uppercase text-slate-600">TOTAIS</td>`;
        } else {
            f += `<td colspan="4" class="p-2 border-r border-slate-300 font-black text-right uppercase text-slate-600">TOTAL GERAL</td>`;
        }
        
        let p = objTotais;
        // Os totais recebem um fundo um pouco mais forte (bg-*_100 ou bg-*_200) para destacar
        f += fmt(p.bNd, p.bNdS, 'text-orange-900', 'text-orange-700 font-black', 'bg-orange-100');
        f += fmt(p.bRet, p.bRetS, 'text-red-900', 'text-red-700 font-black', 'bg-red-200'); 
        f += fmt(p.bPas, p.bPasS, 'text-red-900', 'text-red-700 font-black', 'bg-red-100'); 
        f += fmt(p.bAtu, p.bAtuS, 'text-red-800', 'text-red-600 font-black', 'bg-red-100'); 
        
        f += fmt(p.bRec, p.bRecS, 'text-yellow-900', 'text-yellow-700 font-black', 'bg-yellow-200 border-l-2 border-l-yellow-400'); 
        f += fmt(p.pRec, p.pRecS, 'text-yellow-900', 'text-yellow-700 font-black', 'bg-yellow-200 border-r-2 border-r-yellow-400'); 

        f += fmt(p.pAtu, p.pAtuS, 'text-blue-800', 'text-blue-600 font-black', 'bg-blue-100'); 
        f += fmt(p.pPrx, p.pPrxS, 'text-blue-900', 'text-blue-700 font-black', 'bg-blue-100'); 
        f += fmt(p.pLon, p.pLonS, 'text-blue-900', 'text-blue-700 font-black', 'bg-blue-200'); 
        
        f += `</tr>`;
        
        let footEl = document.getElementById(elIdFoot);
        if(footEl) footEl.innerHTML = arr.length > 0 ? f : ""; // Só mostra rodapé se tiver linhas
    };

    // Chamadas de renderização (Corpo e Rodapé)
    renderTBody(planGrafica, totGrafica, 'tabelaPlanGrafica', 'tfootPlanGrafica', true);
    renderTBody(planMarca, totMarca, 'tabelaPlanMarca', 'tfootPlanMarca', true);
    renderTBody(plan, totGeral, 'tabelaPlan', 'tfootPlan', false);
}

      function processarFalhasPlan() {
        let vR = 0, vB = 0, vC = 0; 
        exportFalhasCSV = []; 
        let objR = {};
        
        // Pega os valores dos dois filtros
        let filtroFase = document.getElementById('filtroFaseFalhas') ? document.getElementById('filtroFaseFalhas').value : 'TODOS';
        let filtroTipo = document.getElementById('filtroTipoFalha') ? document.getElementById('filtroTipoFalha').value : 'TODOS';
        
        let fasesComErro = new Set(); 

        dadosFiltrados.forEach(l => {
            let t = window.arredondar(l["TIRAGEM"] || l["QUANTIDADE"]); 
            let s = l["SKU"] || "S/N";
            let d = l["DESC_REAL"] || l["DESCRIÇÃO"] || "-";
            
            let datasPlan = {};
            FASES.forEach(f => {
                if (belongsToPhase(l, f.id)) {
                    datasPlan[f.id] = extrairDataISO(l[f.colPlan]);
                }
            });

            FASES.forEach(f => {
                if (!belongsToPhase(l, f.id)) return;
                
                let colB = f.colBase || f.colPlan; 
                let dtRepIso = datasPlan[f.id];
                let dtBasIso = extrairDataISO(l[colB]);

                let isMissingRep = false;
                let isMissingBas = false;
                let isCronoError = false;
                let msgCrono = "";

                if (!dataFoiPreenchida(l, f)) { 
                    if (!dtRepIso) isMissingRep = true;
                    if (!dtBasIso) isMissingBas = true;
                }

                if (dtRepIso) {
                    if (f.id === 'imp' && datasPlan['apv'] && dtRepIso < datasPlan['apv']) {
                        isCronoError = true; msgCrono = "Impressão finalizada antes da Aprovação";
                    }
                    else if (f.id === 'acab' && datasPlan['imp'] && dtRepIso < datasPlan['imp']) {
                        isCronoError = true; msgCrono = "Acabamento finalizado antes da Impressão";
                    }
                    else if (f.id === 'kit' && datasPlan['acab'] && dtRepIso < datasPlan['acab']) {
                        isCronoError = true; msgCrono = "Kit finalizado antes do Acabamento";
                    }
                    else if (f.id === 'col' && datasPlan['acab'] && dtRepIso < datasPlan['acab']) {
                        isCronoError = true; msgCrono = "Coleta finalizada antes do Acabamento";
                    }
                }

                if (isMissingRep || isMissingBas || isCronoError) {
                    fasesComErro.add(f.nome); 
                    
                    // Verifica se atende aos dois filtros
                    let matchFase = (filtroFase === 'TODOS' || filtroFase === f.nome);
                    let matchTipo = (filtroTipo === 'TODOS') || 
                                    (filtroTipo === 'SEM_REPLAN' && isMissingRep) || 
                                    (filtroTipo === 'SEM_BASELINE' && isMissingBas) || 
                                    (filtroTipo === 'ERRO_CRONO' && isCronoError);
                    
                    if (matchFase && matchTipo) {
                        let g = String(l["GRÁFICA"]||"N/A"); let m = String(l["UNIDADE"]||"N/A"); let cv = g+"|"+m;
                        if(!objR[cv]) objR[cv] = { grafica:g, marca:m, sR:new Set(), tR:0, sB:new Set(), tB:0, sC:new Set(), tC:0 };
                        
                        let ft = []; 
                        if(isMissingRep) { ft.push("Sem Re-Plan"); vR+=t; objR[cv].sR.add(s); objR[cv].tR+=t; } 
                        if(isMissingBas) { ft.push("Sem Baseline"); vB+=t; objR[cv].sB.add(s); objR[cv].tB+=t; }
                        if(isCronoError) { ft.push("Erro Cronológico"); vC+=t; objR[cv].sC.add(s); objR[cv].tC+=t; }
                        
                        let txtFalta = ft.join(" | ");
                        if(isCronoError) txtFalta += ` (${msgCrono})`;

                        exportFalhasCSV.push({ grafica:g, marca:m, op:l["OP"]||"-", sku:s, desc:d, etapa:f.nome, falta:txtFalta, tiragem:t });
                    }
                }
            });
        });

        let elSelectFase = document.getElementById('filtroFaseFalhas');
        if (elSelectFase && elSelectFase.options.length <= 1) {
            let htmlOptions = `<option value="TODOS">Todas as Fases</option>`;
            Array.from(fasesComErro).sort().forEach(fNome => htmlOptions += `<option value="${fNome}">${fNome}</option>`);
            elSelectFase.innerHTML = htmlOptions;
            elSelectFase.value = filtroFase; 
        }

        // Atualiza KPIs
        let elReplan = document.getElementById('kpiFalhaReplan'); if(elReplan) elReplan.innerText = window.formatarBR(vR);
        let elBase = document.getElementById('kpiFalhaBase'); if(elBase) elBase.innerText = window.formatarBR(vB);
        let elCrono = document.getElementById('kpiFalhaCrono'); if(elCrono) elCrono.innerText = window.formatarBR(vC);
        
        // Renderiza Matriz de Resumo
        let aR = Object.values(objR).sort(sortGMarca); let hR = "";
        aR.forEach(r => hR += `<tr class="border-b border-slate-100 hover:bg-slate-50">
            <td class="p-2 border-r border-slate-200 font-semibold">${r.grafica}</td>
            <td class="p-2 border-r border-slate-200 font-semibold">${r.marca}</td>
            <td class="p-2 border-r border-slate-200 text-center font-bold text-rose-800 bg-rose-50/50">${window.formatarBR(r.sR.size)}</td>
            <td class="p-2 border-r border-slate-200 text-right font-black text-rose-600 bg-rose-50/50">${window.formatarBR(r.tR)}</td>
            <td class="p-2 border-r border-slate-200 text-center font-bold text-amber-800 bg-amber-50/50">${window.formatarBR(r.sB.size)}</td>
            <td class="p-2 border-r border-slate-200 text-right font-black text-amber-600 bg-amber-50/50">${window.formatarBR(r.tB)}</td>
            <td class="p-2 border-r border-slate-200 text-center font-bold text-violet-800 bg-violet-50/50">${window.formatarBR(r.sC.size)}</td>
            <td class="p-2 text-right font-black text-violet-600 bg-violet-50/50">${window.formatarBR(r.tC)}</td>
        </tr>`);
        let elTabelaRes = document.getElementById('tabelaResumoFalhas'); if(elTabelaRes) elTabelaRes.innerHTML = hR || `<tr><td colspan="8" class="p-4 text-center">Nenhuma falha encontrada! 🎉</td></tr>`;
        
        // Renderiza Lista Top 100
        let hD = ""; exportFalhasCSV.slice(0,100).forEach(i => {
            let cl = i.falta.includes("Cronológico") ? "bg-violet-100 text-violet-800 border border-violet-200" : (i.falta.includes("Base") ? "bg-amber-100 text-amber-800 border border-amber-200" : "bg-rose-100 text-rose-800 border border-rose-200");
            hD += `<tr class="border-b border-slate-100 hover:bg-slate-50">
                <td class="p-2 border-r border-slate-100">${i.grafica}</td>
                <td class="p-2 border-r border-slate-100">${i.marca}</td>
                <td class="p-2 text-[9px] border-r border-slate-100"><span class="font-bold">${i.sku}</span><br>${i.desc}</td>
                <td class="p-2 font-bold text-slate-600 border-r border-slate-100">${i.etapa}</td>
                <td class="p-2 border-r border-slate-100"><span class="${cl} px-1.5 py-0.5 rounded text-[10px] font-bold shadow-sm">${i.falta}</span></td>
                <td class="p-2 text-right font-bold text-slate-700">${window.formatarBR(i.tiragem)}</td>
            </tr>`;
        });
        let elTabelaFalhas = document.getElementById('tabelaFalhas'); if(elTabelaFalhas) elTabelaFalhas.innerHTML = hD || `<tr><td colspan="6" class="p-4 text-center">Tudo certo! 🎉</td></tr>`;
    }

    function processarQualidade() {
        let dadosICP = {}; let dadosFase = {}; let totalGeral = { vol: 0, sniper: 0, ajustado: 0, drift: 0 };
        FASES.forEach(f => { dadosFase[f.id] = { nome: f.nome, vol: 0, sniper: 0, ajustado: 0, drift: 0 }; });
        dadosFiltrados.forEach(l => {
            let t = window.arredondar(l["TIRAGEM"] || l["QUANTIDADE"]); let g = l["GRÁFICA"] || "N/A";
            if (!dadosICP[g]) dadosICP[g] = { vol: 0, sniper: 0, ajustado: 0, drift: 0 };
            FASES.forEach(f => {
                if(!belongsToPhase(l, f.id)) return;
                let cols = { plan: f.colPlan, real: f.colReal, base: f.colBase || f.colPlan };
                let dtBase = extrairDataISO(l[cols.base]); let dtPlan = extrairDataISO(l[cols.plan]); let dtReal = extrairDataISO(l[cols.real]);
                if (!dtBase && !dtPlan) return; 
                let status = 'drift'; let dtComparacao = dtReal ? dtReal : dtPlan; 
                if (dtBase && dtComparacao && dtComparacao <= dtBase) status = 'sniper';
                else if (dtPlan && dtComparacao && dtComparacao <= dtPlan) status = 'ajustado';
                else {
                    if (!dtReal && dtPlan) { let diff = calcDiffDiasISO(dtPlan, dtHojeISO); status = (diff > 0) ? 'drift' : 'ajustado'; } else status = 'drift';
                }
                dadosFase[f.id].vol += t;
                if(status === 'sniper') dadosFase[f.id].sniper += t; else if(status === 'ajustado') dadosFase[f.id].ajustado += t; else dadosFase[f.id].drift += t;
                dadosICP[g].vol += t; totalGeral.vol += t;
                if(status === 'sniper') { dadosICP[g].sniper += t; totalGeral.sniper += t; } else if(status === 'ajustado') { dadosICP[g].ajustado += t; totalGeral.ajustado += t; } else { dadosICP[g].drift += t; totalGeral.drift += t; }
            });
        });
        let ptsGeral = (totalGeral.sniper * 1) + (totalGeral.ajustado * 0.5);
        let icpGeral = totalGeral.vol > 0 ? (ptsGeral / totalGeral.vol) * 100 : 0;
        let elKpi = document.getElementById('kpiICP');
        if(elKpi) { elKpi.innerText = icpGeral.toFixed(1) + '%'; elKpi.className = `text-6xl font-black tracking-tighter ${icpGeral >= 85 ? 'text-emerald-600' : (icpGeral >= 70 ? 'text-amber-500' : 'text-red-600')}`; }
        let arr = Object.keys(dadosICP).map(g => ({ nome: g, ...dadosICP[g] }));
        arr.forEach(d => {
            let pts = (d.sniper * 1) + (d.ajustado * 0.5); d.nota = d.vol > 0 ? (pts / d.vol) * 100 : 0;
            d.pS = d.vol > 0 ? (d.sniper/d.vol)*100 : 0; d.pA = d.vol > 0 ? (d.ajustado/d.vol)*100 : 0; d.pD = d.vol > 0 ? (d.drift/d.vol)*100 : 0;
        });
        arr.sort((a,b) => b.nota - a.nota);

        let hTb = "";
        arr.forEach(d => {
            if(d.vol > 0) {
                // Removi a parte do 'span' que trazia o d.sniper / d.ajustado / d.drift em formato de volume
                hTb += `<tr class="border-b border-slate-100 hover:bg-slate-50"><td class="p-2 font-bold text-slate-700 border-r border-slate-100">${d.nome}</td><td class="p-2 text-right border-r border-slate-100 text-emerald-600 font-bold">${d.pS.toFixed(0)}%</td><td class="p-2 text-right border-r border-slate-100 text-amber-500 font-bold">${d.pA.toFixed(0)}%</td><td class="p-2 text-right border-r border-slate-100 text-red-600 font-bold bg-red-50/30">${d.pD.toFixed(0)}%</td><td class="p-2 text-right font-black bg-slate-50 border-l border-slate-200 ${d.nota>=85?'text-emerald-600':(d.nota>=70?'text-amber-500':'text-red-600')} text-lg">${d.nota.toFixed(1)}</td></tr>`;
            }
        });
        let elTbRank = document.getElementById('tbQualidadeRanking'); if(elTbRank) elTbRank.innerHTML = hTb || '<tr><td colspan="5" class="p-4 text-center">Sem dados.</td></tr>';
        let hFases = "";
        FASES.forEach(f => {
            let d = dadosFase[f.id];
            if(d.vol > 0) {
                let pts = (d.sniper * 1) + (d.ajustado * 0.5); let nota = (pts / d.vol) * 100; let pS = (d.sniper / d.vol) * 100; let pA = (d.ajustado / d.vol) * 100; let pD = (d.drift / d.vol) * 100;
                const barra = (w, cor) => `<div style="width:${w}%;" class="h-1.5 rounded-full ${cor}"></div>`;
                hFases += `<tr class="border-b border-slate-200 hover:bg-slate-50"><td class="p-2 border-r border-slate-200 font-bold text-slate-700 text-[10px]">${d.nome}</td><td class="p-2 border-r border-slate-200 text-right font-mono text-slate-600">${window.formatarBR(d.vol)}</td><td class="p-2 border-r border-slate-200"><div class="flex justify-between text-[9px] mb-1"><span class="font-bold text-emerald-700">${pS.toFixed(0)}%</span></div><div class="w-full bg-slate-200 rounded-full h-1.5">${barra(pS, 'bg-emerald-500')}</div></td><td class="p-2 border-r border-slate-200"><div class="flex justify-between text-[9px] mb-1"><span class="font-bold text-amber-600">${pA.toFixed(0)}%</span></div><div class="w-full bg-slate-200 rounded-full h-1.5">${barra(pA, 'bg-amber-400')}</div></td><td class="p-2 border-r border-slate-200"><div class="flex justify-between text-[9px] mb-1"><span class="font-bold text-red-600">${pD.toFixed(0)}%</span></div><div class="w-full bg-slate-200 rounded-full h-1.5">${barra(pD, 'bg-red-500')}</div></td><td class="p-2 text-center border-l border-slate-200 font-black text-sm ${nota>=85?'text-emerald-600':(nota>=70?'text-amber-500':'text-red-600')}">${nota.toFixed(1)}</td></tr>`;
            }
        });
        let elTbFases = document.getElementById('tbQualidadeFases'); if(elTbFases) elTbFases.innerHTML = hFases;
        let ctx = document.getElementById('graficoQualidadeBarra');
        if(ctx) {
            if(graficos.qualidade) graficos.qualidade.destroy();
            graficos.qualidade = new Chart(ctx, { type: 'bar', data: { labels: ['Média Geral'], datasets: [ { label: 'Sniper (1.0)', data: [totalGeral.sniper], backgroundColor: '#10b981', barPercentage: 0.6 }, { label: 'Ajustado (0.5)', data: [totalGeral.ajustado], backgroundColor: '#f59e0b', barPercentage: 0.6 }, { label: 'Drift (0.0)', data: [totalGeral.drift], backgroundColor: '#ef4444', barPercentage: 0.6 } ] }, options: { indexAxis: 'y', maintainAspectRatio: false, scales: { x: { stacked: true, grid: {display: false}, ticks:{display:false} }, y: { stacked: true, grid: {display: false} } }, plugins: { legend: { position: 'bottom' }, tooltip: { mode: 'index', intersect: false } } } });
        }

function renderizarDashColetas() {
    let mMarca = {}; let mGrafica = {}; let colunasSet = new Set();
    let itensAMais = []; let itensAMenos = [];
    let resumoGrafica = {};

    dadosFiltrados.forEach(l => {
        // DECLARAMOS TODAS AS VARIÁVEIS AQUI EM CIMA UMA ÚNICA VEZ
        let vMapa = window.arredondar(l["COLETADA_MAPA"]);
        let vPcp = window.arredondar(l["COLETADA_PCP"]);
        let grafica = l["GRÁFICA"] || "N/A";
        let marca = l["UNIDADE"] || "N/A";
        let cd = l["CD DESTINO"] || l["CD"] || "N/A";
        let serie = l["SÉRIE"] || "N/A";
        let tipo = l["TIPO"] || "N/A";
        let sku = l["SKU_REAL"] || l["SKU"] || "S/ SKU";
        let desc = l["DESC_REAL"] || l["DESCRIÇÃO"] || "-";

        // ==========================================
        // 1. ACUMULADOR DA TABELA DE RESUMO
        // ==========================================
        if (vMapa > 0 || vPcp > 0) {
            if(!resumoGrafica[grafica]) {
                resumoGrafica[grafica] = { pcp: 0, mapa: 0, dtIniReais: [], dtFimPlans: [], dtFimReais: [], hasPendenteFim: false };
            }
            resumoGrafica[grafica].pcp += vPcp;
            resumoGrafica[grafica].mapa += vMapa;

            let parseDt = (dStr) => {
                if(!dStr || typeof dStr !== 'string') return null;
                let p = dStr.split(" ")[0].split("/");
                return p.length === 3 ? new Date(p[2], p[1]-1, p[0]).getTime() : null;
            };

            let dtIni = parseDt(l["DT_INI_COL_REAL"]);
            let dtFimP = parseDt(l["DT_FIM_COL_PLAN"]);
            let dtFimR_str = l["DT_FIM_COL_REAL"];

            if(dtIni) resumoGrafica[grafica].dtIniReais.push(dtIni);
            if(dtFimP) resumoGrafica[grafica].dtFimPlans.push(dtFimP);

            if(!dtFimR_str || dtFimR_str.trim() === "" || dtFimR_str.trim() === "-") {
                if (vPcp > 0) resumoGrafica[grafica].hasPendenteFim = true;
            } else {
                let dtFim = parseDt(dtFimR_str);
                if(dtFim) resumoGrafica[grafica].dtFimReais.push(dtFim);
            }
        }

        // ==========================================
        // 2. MATRIZES E DIVERGÊNCIAS
        // ==========================================
        if(vMapa === 0 && vPcp === 0) return; // Pula se não tem coleta para as matrizes abaixo

        let colKey = `${serie} - ${tipo}`;
        colunasSet.add(colKey);

        let rowMarca = `${marca} / ${cd}`;
        if(!mMarca[rowMarca]) mMarca[rowMarca] = { label: rowMarca, cols: {} };
        if(!mMarca[rowMarca].cols[colKey]) mMarca[rowMarca].cols[colKey] = { mapa: 0, pcp: 0 };
        mMarca[rowMarca].cols[colKey].mapa += vMapa; mMarca[rowMarca].cols[colKey].pcp += vPcp;

        let rowGrafica = grafica; // Aqui não usamos mais "let" pois já foi declarado lá em cima
        if(!mGrafica[rowGrafica]) mGrafica[rowGrafica] = { label: rowGrafica, cols: {} };
        if(!mGrafica[rowGrafica].cols[colKey]) mGrafica[rowGrafica].cols[colKey] = { mapa: 0, pcp: 0 };
        mGrafica[rowGrafica].cols[colKey].mapa += vMapa; mGrafica[rowGrafica].cols[colKey].pcp += vPcp;

        let diff = vMapa - vPcp;
        if(diff !== 0) {
            let obj = { grafica, marcaCd: rowMarca, skuDesc: `${sku} - ${desc}`, pcp: vPcp, mapa: vMapa, diff };
            if(diff > 0) {
                itensAMais.push(obj); 
            } else if (diff < 0 && vMapa > 0) {
                itensAMenos.push(obj); 
            }
        }
    }); // <-- FIM DO FOR EACH

    divergenciasExport = [...itensAMais, ...itensAMenos]; 
    let colunas = Array.from(colunasSet).sort();

    // ==========================================
    // 3. RENDERIZAÇÃO DAS MATRIZES (DOM)
    // ==========================================
    function buildMatrix(dataObj, theadId, tbodyId, tituloColuna) {
        let thead = `<tr><th class="p-2 border-r border-slate-600">${tituloColuna}</th>`;
        colunas.forEach(c => thead += `<th class="p-2 border-r border-slate-600 text-center">${c}</th>`);
        thead += `<th class="p-2 text-center bg-indigo-900">Total Geral</th></tr>`;
        document.getElementById(theadId).innerHTML = thead;

        let tbody = "";
        Object.values(dataObj).sort((a,b) => a.label.localeCompare(b.label)).forEach(row => {
            tbody += `<tr class="border-b border-slate-100 hover:bg-slate-50"><td class="p-2 font-bold border-r border-slate-200">${row.label}</td>`;
            let tMapa = 0; let tPcp = 0;
            
            colunas.forEach(c => {
                let cell = row.cols[c] || {mapa: 0, pcp: 0};
                tMapa += cell.mapa; tPcp += cell.pcp;
                tbody += getCellHtml(cell.mapa, cell.pcp);
            });
            tbody += getCellHtml(tMapa, tPcp, true);
            tbody += `</tr>`;
        });
        document.getElementById(tbodyId).innerHTML = tbody || `<tr><td class="p-4 text-center" colspan="10">Sem dados</td></tr>`;
    }
  
    function getCellHtml(m, p, isTotal = false) {
        if(m === 0 && p === 0) return `<td class="p-2 border-r border-slate-200 text-center text-slate-300">-</td>`;
        let perc = p > 0 ? (m / p) * 100 : (m > 0 ? 100 : 0);
        let bg = "bg-red-100/80"; let text = "text-red-700";
        if(perc >= 100) { bg = "bg-emerald-100"; text = "text-emerald-700"; }
        else if(perc >= 90) { bg = "bg-green-50"; text = "text-green-600"; }
        else if(perc >= 80) { bg = "bg-amber-100"; text = "text-amber-600"; }
        let extraClass = isTotal ? "border-l-2 border-indigo-100 font-black" : "border-r border-slate-200 font-bold";
        return `<td class="p-2 text-center ${bg} ${extraClass}"><div class="${text} text-[11px]">${perc.toFixed(1)}%</div><div class="text-[8px] text-slate-500 mt-0.5">${window.formatarBR(m)} / ${window.formatarBR(p)}</div></td>`;
    }

    buildMatrix(mMarca, 'theadColetaMarca', 'tbodyColetaMarca', 'Marca / CD Destino');
    buildMatrix(mGrafica, 'theadColetaGrafica', 'tbodyColetaGrafica', 'Gráfica');

    // ==========================================
    // 4. RENDERIZAÇÃO DAS DIVERGÊNCIAS (DOM)
    // ==========================================
    function buildDivTable(arr, tbodyId, badgeId) {
        arr.sort((a,b) => Math.abs(b.diff) - Math.abs(a.diff)); 
        document.getElementById(badgeId).innerText = `${arr.length} itens`;
        let html = "";
        arr.forEach(i => {
            let corDiff = i.diff > 0 ? "text-emerald-600" : "text-red-600";
            let sinal = i.diff > 0 ? "+" : "";
            html += `<tr class="border-b border-slate-50 hover:bg-slate-50"><td class="p-2 text-[10px] font-semibold">${i.grafica}</td><td class="p-2 text-[10px]">${i.marcaCd}</td><td class="p-2 text-[10px] truncate max-w-[200px]" title="${i.skuDesc}">${i.skuDesc}</td><td class="p-2 text-right font-medium text-slate-500">${window.formatarBR(i.pcp)}</td><td class="p-2 text-right font-bold text-slate-700">${window.formatarBR(i.mapa)}</td><td class="p-2 text-right font-black ${corDiff} bg-slate-50">${sinal}${window.formatarBR(i.diff)}</td></tr>`;
        });
        document.getElementById(tbodyId).innerHTML = html || `<tr><td colspan="6" class="p-4 text-center text-slate-400">Tudo batendo 100%! 🎉</td></tr>`;
    }

    buildDivTable(itensAMais, 'tbodyColetaMais', 'badgeAMais');
    buildDivTable(itensAMenos, 'tbodyColetaMenos', 'badgeAMenos');

    // ==========================================
    // 5. RENDERIZAÇÃO DO RESUMO GERAL (DOM)
    // ==========================================
    let htmlResumo = "";
    Object.keys(resumoGrafica).sort().forEach(g => {
        let r = resumoGrafica[g];
        let pctColetado = r.pcp > 0 ? (r.mapa / r.pcp) * 100 : (r.mapa > 0 ? 100 : 0);
        let desvio = r.mapa - r.pcp;
        let pctDesvio = r.pcp > 0 ? (desvio / r.pcp) * 100 : 0;

        let minIni = r.dtIniReais.length > 0 ? Math.min(...r.dtIniReais) : null;
        let maxFimP = r.dtFimPlans.length > 0 ? Math.max(...r.dtFimPlans) : null;
        let maxFimR = r.dtFimReais.length > 0 ? Math.max(...r.dtFimReais) : null;

        let fmtDtBR = (ts) => ts ? new Date(ts).toLocaleDateString('pt-BR') : "-";

        let strIni = fmtDtBR(minIni);
        let strFimP = fmtDtBR(maxFimP);
        
        let strFimR = r.hasPendenteFim 
            ? `<span class="text-amber-700 font-bold bg-amber-100 border border-amber-300 px-2 py-0.5 rounded text-[9px] uppercase tracking-wider shadow-sm">Pendente</span>` 
            : fmtDtBR(maxFimR);

        let corPct = pctColetado >= 100 ? "text-emerald-600" : (pctColetado >= 90 ? "text-green-600" : (pctColetado >= 80 ? "text-amber-500" : "text-red-600"));
        let corDesvio = desvio === 0 ? "text-slate-500" : (desvio > 0 ? "text-emerald-600" : "text-red-600");
        let sinal = desvio > 0 ? "+" : "";

        htmlResumo += `<tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
            <td class="p-2 border-r border-slate-200 font-bold text-slate-700">${g}</td>
            <td class="p-2 border-r border-slate-200 text-right text-slate-500">${window.formatarBR(r.pcp)}</td>
            <td class="p-2 border-r border-slate-200 text-right font-bold text-slate-800">${window.formatarBR(r.mapa)}</td>
            <td class="p-2 border-r border-slate-200 text-center font-black ${corPct}">${pctColetado.toFixed(1)}%</td>
            <td class="p-2 border-r border-slate-200 text-right font-bold ${corDesvio} bg-slate-50/50">${sinal}${window.formatarBR(desvio)}</td>
            <td class="p-2 border-r border-slate-200 text-center font-bold ${corDesvio} bg-slate-50">${sinal}${pctDesvio.toFixed(1)}%</td>
            <td class="p-2 border-r border-slate-200 text-center text-[10px] text-slate-600">${strIni}</td>
            <td class="p-2 border-r border-slate-200 text-center text-[10px] text-slate-500">${strFimP}</td>
            <td class="p-2 text-center text-[10px] text-slate-800 font-semibold">${strFimR}</td>
        </tr>`;
    });
    document.getElementById('tbodyColetaResumo').innerHTML = htmlResumo || `<tr><td colspan="9" class="p-4 text-center text-slate-400">Nenhum dado encontrado</td></tr>`;
}

window.processarEvolucao = function() {
        let elPeriodo = document.getElementById('evoPeriodo');
        if(!elPeriodo) return;

        let periodo = elPeriodo.value;
        let granul = document.getElementById('evoGranul').value;
        let fId = document.getElementById('evoFase').value;
        let tRef = document.getElementById('filtroReferencia').value;

        // 1. Calcular Janela de Datas do Filtro
        let dHoje = new Date(); dHoje.setHours(0,0,0,0);
        let dIni = new Date(dHoje);
        let dFim = new Date(dHoje);

        if(periodo === 'd-1') { dIni.setDate(dIni.getDate()-1); dFim.setDate(dFim.getDate()-1); }
        else if(periodo === 'd-2') { dIni.setDate(dIni.getDate()-2); dFim.setDate(dFim.getDate()-2); }
        else if(periodo === 'd-3') { dIni.setDate(dIni.getDate()-3); dFim.setDate(dFim.getDate()-3); }
        else if(periodo === 'u7d') { dIni.setDate(dIni.getDate()-7); }
        else if(periodo === 'u30d') { dIni.setDate(dIni.getDate()-30); }
        else if(periodo === 'tudo') { dIni = new Date(2000,0,1); dFim = new Date(2100,0,1); }

        let strIni = dIni.toISOString().split('T')[0];
        let strFim = dFim.toISOString().split('T')[0];

        let formatarGrupo = (isoStr) => {
            if(!isoStr) return null;
            if(granul === 'dia') {
                let p = isoStr.split('-'); return `${p[2]}/${p[1]}`; 
            } else {
                let d = new Date(isoStr + 'T00:00:00');
                d.setDate(d.getDate() + 4 - (d.getDay()||7));
                let yearStart = new Date(d.getFullYear(),0,1);
                let weekNo = Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7);
                return `Sem ${weekNo.toString().padStart(2,'0')}`;
            }
        };

        // Objetos para Tabela Master, Cards e Gráfico
        let tblResumo = {};
        FASES.forEach(f => tblResumo[f.id] = { nome: f.nome, plan: 0, realDoPlan: 0, realAntecipado: 0, realAtrasado: 0 });
        let chartData = {}; 

        // Objetos para o Detalhamento Específico da Fase Selecionada
        let detGrafica = {};
        let detMarca = {};
        let detGM = {};
        let detSku = [];
        window.dadosExportacaoEvoSku = []; // Para o botão de exportar

        // 2. Motor de Cálculo
        dadosFiltrados.forEach(l => {
            let tBase = window.arredondar(l["TIRAGEM"] || l["QUANTIDADE"]);
            if(tBase <= 0) return;

            FASES.forEach(f => {
                if(!belongsToPhase(l, f.id)) return;
                
                let tFaseReal = window.getVolFase(l, f, tBase);
                
                let cols = getCols(f, tRef);
                let dtP = extrairDataISO(l[cols.plan]);
                let dtR = extrairDataISO(l[cols.real]) || (cols.realAlt ? extrairDataISO(l[cols.realAlt]) : null);
                
                let isInPlan = dtP && dtP >= strIni && dtP <= strFim;
                let isInReal = dtR && dtR >= strIni && dtR <= strFim;

                if (!isInPlan && !isInReal) return; // Só processa se tocou no período

                // A. Cálculos Globais (Resumo Todas as Fases)
                let rDoPlan = 0, rAnt = 0, rAtr = 0;
                
                if (isInPlan) {
                    tblResumo[f.id].plan += tBase;
                }
                if (isInReal) {
                    if (isInPlan) {
                        tblResumo[f.id].realDoPlan += tFaseReal; rDoPlan = tFaseReal;
                    } else {
                        if (dtP && dtP < strIni) {
                            tblResumo[f.id].realAtrasado += tFaseReal; rAtr = tFaseReal;
                        } else {
                            tblResumo[f.id].realAntecipado += tFaseReal; rAnt = tFaseReal;
                        }
                    }
                }
                
                // B. Cálculos Específicos para a Fase Selecionada (Gráfico e Tabelas Detalhadas)
                if (f.id === fId) {
                    // Gráfico
                    let grP = dtP ? formatarGrupo(dtP) : null;
                    let grR = dtR ? formatarGrupo(dtR) : null;

                    if (isInPlan && grP) {
                        if(!chartData[grP]) chartData[grP] = { plan:0, realDoPlan:0, realAntecipado:0, realAtrasado:0 };
                        chartData[grP].plan += tBase; // CORRIGIDO t -> tBase
                    }
                    if (isInReal && grR) {
                        if(!chartData[grR]) chartData[grR] = { plan:0, realDoPlan:0, realAntecipado:0, realAtrasado:0 };
                        if (grP && grP === grR) chartData[grR].realDoPlan += tFaseReal; 
                        else if (dtP && dtP < dtR) chartData[grR].realAtrasado += tFaseReal; 
                        else chartData[grR].realAntecipado += tFaseReal; 
                    }

                    // Tabelas de Detalhamento
                    let g = l["GRÁFICA"] || "N/A";
                    let m = l["UNIDADE"] || "N/A";
                    let sku = l["SKU"] || "S/N";
                    let desc = l["DESC_REAL"] || l["DESCRIÇÃO"] || "-";

                    // Helper para agrupar
                    let agruparDet = (obj, key, label1, label2 = null) => {
                        if (!obj[key]) obj[key] = { label1: label1, label2: label2, plan: 0, realDoPlan: 0, realAntecipado: 0, realAtrasado: 0 };
                        if (isInPlan) obj[key].plan += tBase; // CORRIGIDO t -> tBase
                        obj[key].realDoPlan += rDoPlan; obj[key].realAntecipado += rAnt; obj[key].realAtrasado += rAtr;
                    };

                    agruparDet(detGrafica, g, g);
                    agruparDet(detMarca, m, m);
                    agruparDet(detGM, g+"|"+m, g, m);

                    // Agrupamento de SKU 
                    let skuKey = g+"|"+m+"|"+sku;
                    let objSku = detSku.find(x => x.key === skuKey);
                    if (!objSku) {
                        objSku = { key: skuKey, grafica: g, marca: m, sku: sku, desc: desc, plan: 0, realDoPlan: 0, realAntecipado: 0, realAtrasado: 0 };
                        detSku.push(objSku);
                    }
                    if (isInPlan) objSku.plan += tBase; // CORRIGIDO t -> tBase
                    objSku.realDoPlan += rDoPlan; objSku.realAntecipado += rAnt; objSku.realAtrasado += rAtr;
                }
            });
        });

        // 3. Renderizar CARDS e TABELA MASTER
        let hTbl = "", hCards = "";
        let fObjSel = FASES.find(f => f.id === fId);
        document.getElementById('tituloDetalheEvo').innerText = `🔍 Detalhamento Nível Operacional (Fase: ${fObjSel ? fObjSel.nome : ''})`;

        FASES.forEach(f => {
            let r = tblResumo[f.id];
            let totRealizado = r.realDoPlan + r.realAntecipado + r.realAtrasado;
            let pctTot = r.plan > 0 ? (totRealizado / r.plan) * 100 : (totRealizado > 0 ? 100 : 0);
            let corPctTot = pctTot >= 100 ? 'text-indigo-600' : 'text-slate-600';
            if (r.plan === 0 && totRealizado === 0) corPctTot = 'text-slate-300';
            let strPctTot = (r.plan === 0 && totRealizado === 0) ? '-' : pctTot.toFixed(1) + '%';

    // NOVA FUNÇÃO: Preenche as datas da aba Qualidade via atalho
    window.mudarPeriodoQualidade = function() {
        let fData = document.getElementById('filtroQualData').value;
        let elIni = document.getElementById('qualDataIni');
        let elFim = document.getElementById('qualDataFim');
        let dHoje = new Date(); dHoje.setHours(0,0,0,0);
        let dIni = null, dFim = null;
        
        if (fData === 'MES_ATUAL') { 
            dIni = new Date(dHoje.getFullYear(), dHoje.getMonth(), 1); 
            dFim = new Date(dHoje.getFullYear(), dHoje.getMonth() + 1, 0); 
        } 
        else if (fData === 'MES_PASSADO') { 
            dIni = new Date(dHoje.getFullYear(), dHoje.getMonth() - 1, 1); 
            dFim = new Date(dHoje.getFullYear(), dHoje.getMonth(), 0); 
        } 
        else if (fData === 'U7D') { 
            dIni = new Date(dHoje); dIni.setDate(dIni.getDate() - 7); 
            dFim = new Date(dHoje); 
        }
        
        if (dIni && dFim && elIni && elFim) { 
            elIni.value = dIni.toISOString().split('T')[0]; 
            elFim.value = dFim.toISOString().split('T')[0]; 
        } else { 
            if(elIni) elIni.value = ""; 
            if(elFim) elFim.value = ""; 
        }
        window.processarQualidadeReclamacoes();
    };
        //====================================

        window.processarQualidadeReclamacoes = function() {
    if (!window.DADOS_QUALIDADE_CACHE) return;

    // 1º PEDIDO: Fonte 12
    Chart.defaults.font.family = "sans-serif";

    let strFim = document.getElementById('qualDataFim') && document.getElementById('qualDataFim').value !== "" ? document.getElementById('qualDataFim').value : "2100-01-01";

    const getDistinctCount = (arr, field) => new Set(arr.map(x => x[field]).filter(x => x)).size;

    let compMes = { '01':{25:0,26:0}, '02':{25:0,26:0}, '03':{25:0,26:0}, '04':{25:0,26:0}, '05':{25:0,26:0}, '06':{25:0,26:0}, '07':{25:0,26:0}, '08':{25:0,26:0}, '09':{25:0,26:0}, '10':{25:0,26:0}, '11':{25:0,26:0}, '12':{25:0,26:0} };
    let compMarca = {}; let compGrafica = {}; let compDesvio = {};
    let dadosFiltradosRec = [];

    window.DADOS_QUALIDADE_CACHE.forEach(l => {
        let dtKey = Object.keys(l).find(k => k.toLowerCase().includes("data") || k.toLowerCase().includes("carimbo"));
        let dataRaw = l[dtKey];
        if(!dataRaw) return;
        let dateObj = new Date(dataRaw);
        if(isNaN(dateObj)) return;

        let anoLinha = String(dateObj.getFullYear()); let mesLinha = String(dateObj.getMonth() + 1).padStart(2, '0');
        let marca = l["Marca"] ? String(l["Marca"]).trim() : "Outros"; let grafica = l["Gráfica"] ? String(l["Gráfica"]).trim() : "Outros";
        let desvio = l["Desvio"] ? String(l["Desvio"]).trim() : "Não Informado"; let status = l["Parecer"] || l["Status"] ? String(l["Parecer"] || l["Status"]).trim().toLowerCase() : "valido";

        let isValido = !(status.includes("improcedente") || status.includes("cancelado") || desvio.toLowerCase() === "reclassificado");
        let dtCaso = dataRaw ? String(dataRaw).trim().split('T')[0] : null;
        
        let marcaOk = fMarca === 'TODAS' || marca === fMarca;
        let graficaOk = fGrafica === 'TODAS' || grafica === fGrafica;
        let dataOk = (dtCaso && dtCaso >= strIni && dtCaso <= strFim); 
        let anoOk = (filtroAno === 'TODOS') || (anoLinha === filtroAno);

        if (marcaOk && graficaOk && dataOk && anoOk) dadosFiltradosRec.push(l);

        if (isValido && (anoLinha === '2025' || anoLinha === '2026')) {
            let yKey = anoLinha === '2025' ? 25 : 26;
            if(compMes[mesLinha]) compMes[mesLinha][yKey]++;
            if(!compMarca[marca]) compMarca[marca] = {25:0, 26:0}; compMarca[marca][yKey]++;
            if(!compGrafica[grafica]) compGrafica[grafica] = {25:0, 26:0}; compGrafica[grafica][yKey]++;

    function iniciarAbaQualidadePPM() {
        if (!window.DADOS_PPM_CACHE || window.DADOS_PPM_CACHE.length === 0) {
            console.log("Dados de PPM vazios.");
            return;
        }

// --- FUNÇÃO ATUALIZADA: PPM V1/26 + COLUNAS EMPILHADAS E FILTROS ---
    window.filtrosPpmEnvioIniciados = false;

    function processarQualidadePPM() {
        if (!window.DADOS_PPM_CACHE) return;

        let elFiltroEnvio = document.getElementById('filtroPpmEnvio');
        if (elFiltroEnvio && !window.filtrosPpmEnvioIniciados) {
            let enviosSet = new Set();
            window.DADOS_PPM_CACHE.forEach(l => {
                let env = String(l["Envio"] || "").trim();
                if(env !== "" && env !== "undefined") enviosSet.add(env);
            });
            let opts = `<option value="TODOS">Consolidado (Todos)</option>`;
            Array.from(enviosSet).sort().forEach(e => {
                opts += `<option value="${e}">${e}</option>`;
            });
            elFiltroEnvio.innerHTML = opts;
            window.filtrosPpmEnvioIniciados = true;
        }

        let fEnvio = elFiltroEnvio ? elFiltroEnvio.value : "TODOS";

        let tTiragem = 0, tDesvGraf = 0, tDesvCD = 0, tLivros = 0;
        let arrRank = {};

        window.DADOS_PPM_CACHE.forEach(l => {
            let env = String(l["Envio"] || "").trim();
            if (fEnvio !== "TODOS" && env !== fEnvio) return;

            let g = String(l["Gráfica"] || "N/A").trim();
            let tir = Number(l["Tiragem"]) || 0;
            let desG = Number(l["Desvios Gráfica"]) || 0;
            let desC = Number(l["Desvios CDs"]) || 0;
            let liv = Number(l["Livros Reclamados"]) || 0;

            if (tir === 0 && desG === 0 && desC === 0 && liv === 0) return;

            tTiragem += tir; 
            tDesvGraf += desG; 
            tDesvCD += desC; 
            tLivros += liv;

            if(!arrRank[g]) arrRank[g] = { grafica: g, tir: 0, desG: 0, desC: 0, liv: 0 };
            arrRank[g].tir += tir;
            arrRank[g].desG += desG;
            arrRank[g].desC += desC;
            arrRank[g].liv += liv;
        });

        let formatarPpm = (valor) => valor.toLocaleString('pt-BR', {minimumFractionDigits: 1, maximumFractionDigits: 1});
        let ppmGlobal = tTiragem > 0 ? ((tDesvGraf + tDesvCD + tLivros) / tTiragem) * 1000000 : 0;

        let elKpiTiragem = document.getElementById('kpiPpmTiragem'); if(elKpiTiragem) elKpiTiragem.innerText = window.formatarBR(tTiragem);
        let elKpiDesvGraf = document.getElementById('kpiPpmDesviosGraf'); if(elKpiDesvGraf) elKpiDesvGraf.innerText = window.formatarBR(tDesvGraf);
        let elKpiDesvCD = document.getElementById('kpiPpmDesviosCD'); if(elKpiDesvCD) elKpiDesvCD.innerText = window.formatarBR(tDesvCD);
        let elKpiLivros = document.getElementById('kpiPpmLivros'); if(elKpiLivros) elKpiLivros.innerText = window.formatarBR(tLivros);
        
        let elPpmGlobal = document.getElementById('kpiPpmGlobal');
        let boxPpmGlobal = document.getElementById('boxPpmGlobal');
        if(elPpmGlobal && boxPpmGlobal) {
            elPpmGlobal.innerText = formatarPpm(ppmGlobal);
            boxPpmGlobal.className = "bg-white p-4 rounded-xl border-l-4 shadow-sm flex flex-col justify-center transition-colors";
            if (ppmGlobal <= 100) {
                boxPpmGlobal.classList.add("bg-emerald-50", "border-emerald-500");
                elPpmGlobal.className = "text-3xl font-black text-emerald-700 tracking-tighter";
            } else if (ppmGlobal <= 200) {
                boxPpmGlobal.classList.add("bg-amber-50", "border-amber-500");
                elPpmGlobal.className = "text-3xl font-black text-amber-700 tracking-tighter";
            } else {
                boxPpmGlobal.classList.add("bg-red-50", "border-red-500");
                elPpmGlobal.className = "text-3xl font-black text-red-700 tracking-tighter";
            }
        }

        let arrayRank = Object.values(arrRank);
        arrayRank.forEach(r => { r.ppm = r.tir > 0 ? ((r.desG + r.desC + r.liv) / r.tir) * 1000000 : 0; });
        arrayRank.sort((a, b) => b.ppm - a.ppm);

        let hTb = "";
        arrayRank.forEach((r, index) => {
            let bgRank = index < 3 ? 'bg-slate-800 text-white font-black rounded-full w-6 h-6 flex items-center justify-center mx-auto' : 'text-slate-500 font-bold';
            let corPpm = 'bg-red-100 text-red-700'; 
            if (r.ppm <= 100) corPpm = 'bg-emerald-100 text-emerald-700';
            else if (r.ppm <= 200) corPpm = 'bg-amber-100 text-amber-700';

            hTb += `<tr class="border-b border-slate-100 hover:bg-slate-50">
                <td class="p-2 border-r border-slate-200 text-center"><div class="${bgRank}">${index + 1}º</div></td>
                <td class="p-2 border-r border-slate-200 font-bold text-slate-700">${r.grafica}</td>
                <td class="p-2 border-r border-slate-200 text-right font-medium text-slate-600">${window.formatarBR(r.tir)}</td>
                <td class="p-2 border-r border-slate-200 text-right font-black text-amber-600 bg-amber-50/30">${window.formatarBR(r.desG)}</td>
                <td class="p-2 border-r border-slate-200 text-right font-black text-rose-600 bg-rose-50/30">${window.formatarBR(r.desC)}</td>
                <td class="p-2 border-r border-slate-200 text-right font-black text-orange-600 bg-orange-50/30">${window.formatarBR(r.liv)}</td>
                <td class="p-2 text-center font-black ${corPpm}">${formatarPpm(r.ppm)}</td>
            </tr>`;
        });
        let tbRank = document.getElementById('tbPpmRanking'); if(tbRank) tbRank.innerHTML = hTb || `<tr><td colspan="7" class="p-4 text-center">Sem dados.</td></tr>`;

        // ==================================================
        // BLOCO 2: DADOS DE RECLAMAÇÕES (QUALIDADE) COM FILTROS
        // ==================================================
        if (window.DADOS_QUALIDADE_CACHE) {
            
            // 1. POPULA O MENU DE GRÁFICAS (Apenas na 1ª vez)
            let elFiltroGraf = document.getElementById('ppmFiltroGraf');
            if (elFiltroGraf && elFiltroGraf.options.length <= 1) {
                let sGraf = new Set();
                window.DADOS_QUALIDADE_CACHE.forEach(l => {
                    let g = String(l["Gráfica"] || l["Fornecedor"] || "N/A").trim();
                    if(g !== "N/A" && g !== "") sGraf.add(g);
                });
                Array.from(sGraf).sort().forEach(g => {
                    let opt = document.createElement('option');
                    opt.value = g; opt.text = g;
                    elFiltroGraf.appendChild(opt);
                });
            }

            // 2. LÊ OS FILTROS DA TELA
            let fIni = document.getElementById('ppmDataIni') ? document.getElementById('ppmDataIni').value : "";
            let fFim = document.getElementById('ppmDataFim') ? document.getElementById('ppmDataFim').value : "";
            let fGraf = elFiltroGraf ? elFiltroGraf.value : "TODAS";
            let granulTempo = document.getElementById('ppmGranulTempo') ? document.getElementById('ppmGranulTempo').value : 'mes';

            let aggGraficasDesvios = {}; let aggDesviosGlobal = {};
            let timeSeries = {}; 
            let graficasSet = new Set();
            
            let formatarGrupoTempo = (isoStr, granul) => {
                if(!isoStr) return "S/D";
                let p = isoStr.split('T')[0].split('-'); 
                if(p.length < 3) return "S/D";
                if(granul === 'dia') return `${p[2]}/${p[1]}`; // DD/MM
                if(granul === 'mes') return `${p[1]}/${p[0]}`; // MM/YYYY
                let d = new Date(isoStr.split('T')[0] + 'T00:00:00'); d.setDate(d.getDate() + 4 - (d.getDay()||7));
                let yearStart = new Date(d.getFullYear(),0,1); let weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
                return `S${String(weekNo).padStart(2,'0')}/${d.getFullYear()}`;
            };
            
            let formatarDataMaq = (isoStr) => {
                if(!isoStr) return "S/D";
                let p = isoStr.split('T')[0].split('-'); 
                return `${p[0]}-${p[1]}-${p[2]}`; // YYYY-MM-DD
            };
            
            window.DADOS_QUALIDADE_CACHE.forEach(l => {
                let g = String(l["Gráfica"] || "N/A").trim();
                let desvio = String(l["Desvio"] || "Não Informado").trim();
                let qtdDefeitos = Number(l["Defeitos"]) || 1; 
                
                let chaveData = Object.keys(l).find(k => k.includes("data") || k.includes("Data") || k.includes("Carimbo"));
                let dataRaw = chaveData ? l[chaveData] : null;
                
                if(dataRaw && g !== "N/A") {
                    let dataStr = typeof dataRaw === 'string' && dataRaw.includes('T') ? dataRaw : new Date(dataRaw).toISOString();
                    let dataComparacao = formatarDataMaq(dataStr);

                    // APLICAÇÃO DOS FILTROS (Data, Gráfica e Envio)
                    if (fIni && dataComparacao < fIni) return;
                    if (fFim && dataComparacao > fFim) return;
                    if (fGraf !== "TODAS" && g !== fGraf) return;
                    
                    // NOVO: FILTRA PARA MOSTRAR APENAS DADOS DO ANO DE 2026
                    if (!dataComparacao.startsWith("2026")) return;
                    
                    // NOVO: TRÁFEGO DINÂMICO DE ENVIO NA BASE DE RECLAMAÇÕES
                    let envRec = String(l["Envio"] || l["ENVIO"] || "").trim();
                    if (fEnvio !== "TODOS" && envRec !== fEnvio) return;

                    // Lógica Temporal
                    let periodo = formatarGrupoTempo(dataStr, granulTempo);
                    // Chave oculta para ordenar cronologicamente perfeito
                    let chaveSort = granulTempo === 'dia' ? dataComparacao : (granulTempo === 'mes' ? dataComparacao.substring(0,7) : dataStr);
                    let chaveFinal = chaveSort + "|" + periodo;

                    graficasSet.add(g);
                    if(!timeSeries[chaveFinal]) timeSeries[chaveFinal] = {};
                    if(!timeSeries[chaveFinal][g]) timeSeries[chaveFinal][g] = 0;
                    timeSeries[chaveFinal][g] += qtdDefeitos;

                    // Lógica de Desvios (Oculta reclassificados)
                    if (desvio.toLowerCase() !== "reclassificado" && qtdDefeitos > 0) {
                        if (!aggDesviosGlobal[desvio]) aggDesviosGlobal[desvio] = 0;
                        aggDesviosGlobal[desvio] += qtdDefeitos;

                        if (!aggGraficasDesvios[g]) aggGraficasDesvios[g] = { total: 0 };
                        if (!aggGraficasDesvios[g][desvio]) aggGraficasDesvios[g][desvio] = 0;

                        aggGraficasDesvios[g][desvio] += qtdDefeitos;
                        aggGraficasDesvios[g].total += qtdDefeitos;
                    }
                }
            });

            // --- RENDERIZA O GRÁFICO TEMPORAL EM COLUNAS EMPILHADAS ---
            let periodosOrdenadosKeys = Object.keys(timeSeries).sort(); // Ordena cronologicamente
            let graficasT = Array.from(graficasSet).sort();
            let labelsGraficoT = periodosOrdenadosKeys.map(k => k.split("|")[1]); // Pega só o rótulo bonito
            
            const coresCuringa = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316', '#0ea5e9', '#6366f1'];
            let datasetsGraficoT = [];
            
            graficasT.forEach((grafica, index) => {
                let dataArr = [];
                periodosOrdenadosKeys.forEach(p => { dataArr.push(timeSeries[p][grafica] || 0); });
                datasetsGraficoT.push({ 
                    label: grafica, 
                    data: dataArr, 
                    backgroundColor: coresCuringa[index % coresCuringa.length], 
                    borderRadius: 2 
                });
            });

            let ctxTempo = document.getElementById('graficoPpmTemporal');
            if(ctxTempo) {
                if(window.graficoPPMT) window.graficoPPMT.destroy();
                window.graficoPPMT = new Chart(ctxTempo, { 
                    type: 'bar', // Mudou para COLUNAS
                    data: { labels: labelsGraficoT, datasets: datasetsGraficoT }, 
                    options: { 
                        maintainAspectRatio: false, 
                        interaction: { mode: 'index', intersect: false }, 
                        plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8 } } }, 
                        scales: { 
                            x: { stacked: true }, // EMPILHADO
                            y: { stacked: true, beginAtZero: true, title: { display: true, text: 'Qtd de Reclamações' } } 
                        } 
                    } 
                });
            }

            // --- RENDERIZA O GRÁFICO DE BARRAS EMPILHADAS (DESVIOS) ---
            let labelsGraficas = Object.keys(aggGraficasDesvios).sort((a,b) => aggGraficasDesvios[b].total - aggGraficasDesvios[a].total);

    window.mudarPeriodoReentradas = function() {
        let fData = document.getElementById('filtroReData').value;
        let elIni = document.getElementById('reDataIni');
        let elFim = document.getElementById('reDataFim');
        let dHoje = new Date(); dHoje.setHours(0,0,0,0);
        let dIni = null, dFim = null;
        if (fData === 'MES_ATUAL') { dIni = new Date(dHoje.getFullYear(), dHoje.getMonth(), 1); dFim = new Date(dHoje.getFullYear(), dHoje.getMonth() + 1, 0); } 
        else if (fData === 'MES_PASSADO') { dIni = new Date(dHoje.getFullYear(), dHoje.getMonth() - 1, 1); dFim = new Date(dHoje.getFullYear(), dHoje.getMonth(), 0); } 
        else if (fData === 'U7D') { dIni = new Date(dHoje); dIni.setDate(dIni.getDate() - 7); dFim = new Date(dHoje); }
        if (dIni && dFim && elIni && elFim) { elIni.value = dIni.toISOString().split('T')[0]; elFim.value = dFim.toISOString().split('T')[0]; } 
        else { if(elIni) elIni.value = ""; if(elFim) elFim.value = ""; }
        processarReentradas();
    };

    window.processarReentradas = function() {
        if (!window.DADOS_ALOCACAO_CACHE) return;
        const getSelected = (idCat) => { let cbs = Array.from(document.querySelectorAll(`.chk-re-${idCat}:checked`)); return new Set(cbs.map(cb => cb.value)); };
        let selFilters = {};
        Object.keys(listasMultiSelect).forEach(k => { selFilters[k] = getSelected(k.replace(/\s+/g, '')); });

        let dtIniStr = document.getElementById('reDataIni') ? document.getElementById('reDataIni').value : "";
        let dtFimStr = document.getElementById('reDataFim') ? document.getElementById('reDataFim').value : "";
        let granulTempo = document.getElementById('reGranulTempo') ? document.getElementById('reGranulTempo').value : 'mes';

        let kpiTotal = 0, kpiAlocado = 0, kpiCancel = 0, kpiWip = 0;
        let mapStatus = {}; let mapUn = {}; let mapMotivo = {}; 
        let slaOk = 0, slaAtrasado = 0;
        let ppgGroup = { '0':{ok:0, atr:0}, '1':{ok:0, atr:0}, '2':{ok:0, atr:0}, '3':{ok:0, atr:0}, '4+':{ok:0, atr:0} };
        let timeSeries = {};

        let formatarGrupoTempo = (isoStr, granul) => {
            if(!isoStr) return "S/D";
            let p = isoStr.split('-');
            if(granul === 'dia') return `${p[0]}-${p[1]}-${p[2]}`; 
            if(granul === 'mes') return `${p[0]}-${p[1]}`; 
            let d = new Date(isoStr + 'T00:00:00'); d.setDate(d.getDate() + 4 - (d.getDay()||7));
            let yearStart = new Date(d.getFullYear(),0,1); let weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
            return `${d.getFullYear()}-S${String(weekNo).padStart(2,'0')}`;
        };
        
        dadosReentradasFiltrados = [];

        window.DADOS_ALOCACAO_CACHE.forEach(l => {
            let dtCasoStr = l["Carimbo de data/hora"] ? String(l["Carimbo de data/hora"]).trim().split('T')[0] : null;
            if (dtIniStr && dtFimStr && dtCasoStr) { if (dtCasoStr < dtIniStr || dtCasoStr > dtFimStr) return; }
            let matchAll = true;
            Object.keys(selFilters).forEach(k => {
                let valPlanilha = String(l[dpFiltros[k]] || "").trim();
                if(!valPlanilha || valPlanilha === "undefined") valPlanilha = "(Vazio)"; 
                if (!selFilters[k].has(valPlanilha)) matchAll = false;
            });
            if (!matchAll) return;

            let statusRaw = String(l["Status alocação"] || "").trim();
            let statusCat = "Outros";
            if (statusRaw === "Alocado") statusCat = "Alocado";
            else if (statusRaw === "Cancelado") statusCat = "Cancelado";
            else if (["Solicitação em aberto", "Em negociação", "Aguardando ajuste de PPG"].includes(statusRaw) || statusRaw === "") statusCat = "Em Alocação";
            
            kpiTotal++;
            if(statusCat === "Alocado") kpiAlocado++;
            else if(statusCat === "Cancelado") kpiCancel++;
            else if(statusCat === "Em Alocação") kpiWip++;

            let mapStatusName = statusRaw === "" ? "Sem Status" : statusRaw;
            if(!mapStatus[mapStatusName]) mapStatus[mapStatusName] = 0; mapStatus[mapStatusName]++;
            
            let un = String(l["UN"] || "N/A"); if(!mapUn[un]) mapUn[un] = 0; mapUn[un]++;
            let mot = String(l["Motivo da solicitação"] || "Não Inf."); if(!mapMotivo[mot]) mapMotivo[mot] = 0; mapMotivo[mot]++;

            let statusSla = "N/A"; let dtCriacaoStr = l["Carimbo de data/hora"]; let ppgsCount = Number(l["PPG's Enviadas"]) || 0;

            if (dtCriacaoStr && statusCat !== "Cancelado") {
                let dtCriacao = new Date(dtCriacaoStr); let hora = dtCriacao.getHours(); 
                let diasSla = hora < 12 ? 1 : 2;
                let dataLimiteSla = adicionarDiasUteis(dtCriacao, diasSla); dataLimiteSla.setHours(23, 59, 59); 

                let dataFechamento = new Date(); 
                if (statusCat === "Alocado" && l["Data da alocação"]) { dataFechamento = new Date(l["Data da alocação"]); }

                if (dataFechamento <= dataLimiteSla) { statusSla = "No Prazo"; slaOk++; } 
                else { statusSla = "Atrasado"; slaAtrasado++; }
                
                let grp = ppgsCount >= 4 ? '4+' : String(ppgsCount);
                if(statusSla === "No Prazo") ppgGroup[grp].ok++; else ppgGroup[grp].atr++;

                if(dtCasoStr) {
                    let keyTempo = formatarGrupoTempo(dtCasoStr, granulTempo);
                    if(!timeSeries[keyTempo]) timeSeries[keyTempo] = { vol: 0, ok: 0 };
                    timeSeries[keyTempo].vol++;
                    if(statusSla === "No Prazo") timeSeries[keyTempo].ok++;
                }
            }
            l["_SLA_CALC"] = statusSla; l["_STATUS_CAT"] = statusCat;
            dadosReentradasFiltrados.push(l);
        });

        let pctA = kpiTotal>0 ? (kpiAlocado/kpiTotal)*100 : 0; let pctC = kpiTotal>0 ? (kpiCancel/kpiTotal)*100 : 0; let pctW = kpiTotal>0 ? (kpiWip/kpiTotal)*100 : 0;
        let elKpiT = document.getElementById('kpiReTotal'); if(elKpiT) elKpiT.innerText = window.formatarBR(kpiTotal);
        let elKpiA = document.getElementById('kpiReAlocado'); if(elKpiA) elKpiA.innerText = window.formatarBR(kpiAlocado); 
        let elPctA = document.getElementById('pctReAlocado'); if(elPctA) elPctA.innerText = pctA.toFixed(1) + "% do total";
        let elKpiC = document.getElementById('kpiReCancelado'); if(elKpiC) elKpiC.innerText = window.formatarBR(kpiCancel); 
        let elPctC = document.getElementById('pctReCancelado'); if(elPctC) elPctC.innerText = pctC.toFixed(1) + "% do total";
        let elKpiW = document.getElementById('kpiReWip'); if(elKpiW) elKpiW.innerText = window.formatarBR(kpiWip); 
        let elPctW = document.getElementById('pctReWip'); if(elPctW) elPctW.innerText = pctW.toFixed(1) + "% do total";

        let totalSla = slaOk + slaAtrasado; let pctSla = totalSla > 0 ? (slaOk / totalSla) * 100 : 0;
        let elKpiSla = document.getElementById('kpiReSLA');
        if(elKpiSla) {
            elKpiSla.innerText = totalSla > 0 ? pctSla.toFixed(1) + "%" : "-";
            elKpiSla.className = `text-3xl font-black mt-1 tracking-tighter ${pctSla >= 90 ? 'text-emerald-600' : (pctSla >= 80 ? 'text-amber-500' : 'text-red-600')}`;
        }

        const desenharGrafico = (id, type, mapDados, label, cor) => {
            let ctx = document.getElementById(id); if(!ctx) return;
            let sorted = Object.keys(mapDados).sort((a,b)=>mapDados[b]-mapDados[a]); let vals = sorted.map(k => mapDados[k]);
            if(window['grafico_'+id]) window['grafico_'+id].destroy();
            window['grafico_'+id] = new Chart(ctx, { type: type, data: { labels: sorted, datasets: [{ label: label, data: vals, backgroundColor: cor }] }, options: { maintainAspectRatio: false, plugins: { legend: { display: type === 'doughnut', position: 'right' } } } });
        };

        desenharGrafico('graficoReStatus', 'doughnut', mapStatus, 'Chamados', ['#10b981', '#f59e0b', '#ef4444', '#3b82f6', '#8b5cf6', '#64748b']);
        desenharGrafico('graficoReUN', 'bar', mapUn, 'Volume', '#8b5cf6');
        
        let ctxMot = document.getElementById('graficoReMotivos');
        if(ctxMot) {
            let sortedMot = Object.keys(mapMotivo).sort((a,b)=>mapMotivo[b]-mapMotivo[a]).slice(0,10); let valsMot = sortedMot.map(k => mapMotivo[k]);
            if(window.graficoMotivos) window.graficoMotivos.destroy();
            window.graficoMotivos = new Chart(ctxMot, { type: 'bar', data: { labels: sortedMot, datasets: [{ label: 'Chamados', data: valsMot, backgroundColor: '#f97316', borderRadius: 4 }] }, options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend:{display:false} } } });
        }

        let ctxSLA = document.getElementById('graficoReSLA');
        if(ctxSLA) {
            if(window.graficoSLA) window.graficoSLA.destroy();
            window.graficoSLA = new Chart(ctxSLA, { type: 'pie', data: { labels: ['No Prazo', 'SLA Estourado'], datasets: [{ data: [slaOk, slaAtrasado], backgroundColor: ['#10b981', '#ef4444'] }] }, options: { maintainAspectRatio: false, plugins: { legend: { position: 'right' } } } });
        }

        let ctxImp = document.getElementById('graficoReImpacto');
        if(ctxImp) {
            let labelsPpg = ['0 PPGs', '1 PPG', '2 PPGs', '3 PPGs', '4+ PPGs'];
            let dOk = [ppgGroup['0'].ok, ppgGroup['1'].ok, ppgGroup['2'].ok, ppgGroup['3'].ok, ppgGroup['4+'].ok];
            let dAt = [ppgGroup['0'].atr, ppgGroup['1'].atr, ppgGroup['2'].atr, ppgGroup['3'].atr, ppgGroup['4+'].atr];
            if(window.graficoImp) window.graficoImp.destroy();
            window.graficoImp = new Chart(ctxImp, { type: 'bar', data: { labels: labelsPpg, datasets: [ { label: 'Alocado No Prazo', data: dOk, backgroundColor: '#10b981', borderRadius: 4 }, { label: 'Atrasado', data: dAt, backgroundColor: '#ef4444', borderRadius: 4 } ] }, options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, scales: { x: { stacked: false }, y: { beginAtZero: true } } } });
        }

        let ctxTempo = document.getElementById('graficoReTemporal');
        if(ctxTempo) {
            let keysTempo = Object.keys(timeSeries).sort(); let labelsTempo = []; let dataVol = []; let dataSlaPct = [];
            keysTempo.forEach(k => {
                let v = timeSeries[k].vol; let ok = timeSeries[k].ok;
                dataVol.push(v); dataSlaPct.push(v > 0 ? ((ok / v) * 100).toFixed(1) : 0);
                if(k === "S/D") labelsTempo.push("Sem Data"); else if(granulTempo === 'mes') { let p = k.split('-'); labelsTempo.push(`${p[1]}/${p[0]}`); } else if (granulTempo === 'dia') { let p = k.split('-'); labelsTempo.push(`${p[2]}/${p[1]}`); } else { labelsTempo.push(k); }
            });
            if(window.graficoTempo) window.graficoTempo.destroy();
            window.graficoTempo = new Chart(ctxTempo, { type: 'bar', data: { labels: labelsTempo, datasets: [ { type: 'line', label: '% SLA No Prazo', data: dataSlaPct, borderColor: '#4f46e5', backgroundColor: '#4f46e5', borderWidth: 2, tension: 0.3, pointRadius: 4, yAxisID: 'y1', order: 1 }, { type: 'bar', label: 'Vol. Chamados', data: dataVol, backgroundColor: '#cbd5e1', borderRadius: 4, yAxisID: 'y', order: 2 } ] }, options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: (c) => c.dataset.type === 'line' ? `${c.parsed.y}%` : `${c.parsed.y} casos` } } }, scales: { y: { type: 'linear', display: true, position: 'left', beginAtZero: true, title: { display: true, text: 'Volume' } }, y1: { type: 'linear', display: true, position: 'right', beginAtZero: true, max: 105, grid: { drawOnChartArea: false }, ticks: { callback: v => v + '%' } } } } });
        }

        let hTb = "";
        dadosReentradasFiltrados.slice(0, 100).forEach(l => {
            let dtFmt = l["Carimbo de data/hora"] ? new Date(l["Carimbo de data/hora"]).toLocaleDateString('pt-BR') : "-";
            let cSla = l["_SLA_CALC"] === 'No Prazo' ? 'text-emerald-600 font-bold' : (l["_SLA_CALC"] === 'Atrasado' ? 'text-red-600 font-bold' : 'text-slate-400');
            let cSt = l["_STATUS_CAT"] === 'Alocado' ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : (l["_STATUS_CAT"] === 'Cancelado' ? 'bg-red-100 text-red-800 border border-red-200' : 'bg-amber-100 text-amber-800 border border-amber-200');
            
            hTb += `<tr class="border-b border-slate-100 hover:bg-slate-50">
                <td class="p-2 border-r border-slate-200 font-bold text-slate-600">${l["ID"]||"-"}</td>
                <td class="p-2 border-r border-slate-200 text-center text-slate-500">${dtFmt}</td>
                <td class="p-2 border-r border-slate-200 font-bold">${l["UN"]||"-"}</td>
                <td class="p-2 border-r border-slate-200 truncate max-w-[200px]" title="${l["Indexador de tiragem"]||""}">${l["Indexador de tiragem"]||"-"}</td>
                <td class="p-2 border-r border-slate-200">${l["Tipo de solicitação"]||"-"}</td>
                <td class="p-2 border-r border-slate-200 text-center ${cSla}">${l["_SLA_CALC"]}</td>
                <td class="p-2 border-r border-slate-200 text-center"><span class="px-2 py-0.5 rounded text-[9px] font-bold shadow-sm ${cSt}">${l["Status alocação"]||"Sem Status"}</span></td>
                <td class="p-2 border-r border-slate-200 text-slate-600">${l["Responsável alocação"]||"-"}</td>
                <td class="p-2 border-r border-slate-200 font-semibold text-slate-700">${l["Gráfica"]||"-"}</td>
                <td class="p-2 text-right font-black text-indigo-700 bg-indigo-50/50">${l["PPG's Enviadas"]||"0"}</td>
            </tr>`;
        });
        let tb = document.getElementById('tbReentradas'); if(tb) tb.innerHTML = hTb || `<tr><td colspan="10" class="p-4 text-center">Nenhum chamado encontrado.</td></tr>`;
    }

        if (!window.filtrosProdChamadosIniciados) {
            let container = document.getElementById('containerFiltrosMultiProd');
            let htmlFiltros = "";
            
            // 1. Limpar os filtros dinâmicos antes de popular (Evita bugar a tela)

            window.listasMultiProd['Status Prod.'].clear();
            window.listasMultiProd['Resp. Chamado'].clear();
            
            window.DADOS_CHAMADOS_CACHE.forEach(l => {

                let status = window.getStr(l, COL.STATUS_PROD);

                window.listasMultiProd['Marca'].add(window.getStr(l, COL.MARCA).toUpperCase());

            Object.keys(window.listasMultiProd).forEach(key => {
