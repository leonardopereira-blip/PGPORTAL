<script>
(function () {
    'use strict';
    const $ = id => document.getElementById(id);
    const normal = v => String(v ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().replace(/\s+/g, ' ').toUpperCase();
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
    const hoje = () => typeof dtHojeISO !== 'undefined' ? dtHojeISO : new Date().toLocaleDateString('en-CA');
    const k = v => {
        const n = Number(v || 0), milhoes = Math.abs(n) >= 1000000;
        return (n / (milhoes ? 1000000 : 1000)).toLocaleString('pt-BR', {maximumFractionDigits: milhoes ? 2 : 1}) + (milhoes ? 'M' : 'k');
    };
    const exato = v => Math.round(Number(v || 0)).toLocaleString('pt-BR');
    const br = d => d ? d.slice(8, 10) + '/' + d.slice(5, 7) : '—';
    const ontem = dia => new Date(Date.parse(dia + 'T12:00:00Z') - 86400000).toISOString().slice(0, 10);
    const entregueAteOntem = grupo => Number(grupo.entregueAteOntem || 0);
    const pct = (v, t) => (t ? Math.min(100, v * 100 / t) : 0).toLocaleString('pt-BR', {maximumFractionDigits: 1}) + '%';
    const volume = ps => (ps || []).reduce((s, p) => s + p.volume, 0);
    const chavesItem = item => [...new Set(item.chavesOrigem?.length ? item.chavesOrigem : [item.chave])];
    const itemSalvando = item => chavesItem(item).some(chave => estado.salvando.has(chave));
    const legado = window.processarEntregasCD;
    const paletaArco = ['#418EDE', '#FA4616', '#284081', '#049FEC', '#FCB04E', '#F04E37', '#0C2340'];
    const estado = {base: [], itens: [], previsoes: {}, calendario: null, cds: [], marcas: new Map(), salvando: new Set(), falhas: new Map(), rodada: 0};
    const aviso = (texto, erro = false) => {
        if (!$('ecdAviso')) return;
        $('ecdAviso').textContent = texto;
        $('ecdAviso').style.color = erro ? '#FA4616' : '#0C2340';
    };
    function mesclarPrevisoes(novas, forcar = false) {
        const antes = estado.previsoes, mescladas = {...antes};
        const aplicar = (entradas, force) => Object.entries(entradas || {}).forEach(([chave, nova]) => {
            const atual = mescladas[chave];
            if (!force && Number(nova.versao || 0) < Number(atual?.versao || 0)) return;
            if (!force && atual?._pgRequestId && !nova._pgRequestId && Number(nova.versao || 0) <= Number(atual.versao || 0)) return;
            mescladas[chave] = nova;
        });
        aplicar(window.PG_ECD_PREVISOES, false); aplicar(novas, forcar);
        const mudou = Object.entries(mescladas).some(([chave, registro]) => !antes[chave] ||
            ['dataColeta', 'dataEntrega', 'versao', 'observacao'].some(campo => (antes[chave][campo] || '') !== (registro[campo] || '')));
        estado.previsoes = mescladas; window.PG_ECD_PREVISOES = mescladas;
        return mudou;
    }
    function notificarPrevisoes() {
        if (typeof CustomEvent !== 'undefined' && window.dispatchEvent) window.dispatchEvent(new CustomEvent('pgportal-previsoes-atualizadas', {detail: {previsoes: estado.previsoes}}));
    }
    const rotuloGrupo = item => [item.grafica, item.marca, item.serie || 'Sem série', item.cd].join(' · ');
    function mostrarFalhas() {
        const el = $('ecdFalhas'); if (!el) return;
        el.innerHTML = [...estado.falhas.values()].map((falha, n) => '<p style="color:#FA4616;margin:4px 0">' + esc(rotuloGrupo(falha.item)) + ': data ' + esc(br(falha.payload.dataEntrega)) + ' não salva. ' + esc(falha.erro) + ' <button type="button" class="ecd-button" onclick="pgECDReenviar(' + n + ')">Reenviar</button></p>').join('');
    }
    function estrutura() {
        const root = $('ecdNovaVisao');
        if (!root || $('ecdQuadroSerie')) return;
        root.innerHTML = `<style>
          #ecdNovaVisao{font-family:Poppins,Arial,sans-serif;color:#0C2340;font-size:12px;--ecd-marinho:#0C2340;--ecd-azul:#418EDE;--ecd-verde:#C0DD97;--ecd-amarelo:#FAC775}
          .ecd-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.ecd-tabs button,.ecd-controls select,.ecd-controls input,.ecd-button{border:1px solid #cbd5df;border-radius:8px;padding:8px 12px;background:#fff;color:#0C2340;font:inherit}
          .ecd-tabs button.ativo,.ecd-button{background:#0C2340;color:white;border-color:#0C2340;font-weight:600}.ecd-controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap;padding:16px;background:white;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:16px}.ecd-controls label{display:flex;flex-direction:column;gap:5px;font-weight:600}.ecd-controls .ecd-button{margin-left:auto}.ecd-controls p{flex-basis:100%;margin:0}
          .ecd-section{border:1px solid #d5dee7;border-radius:12px;background:#fff;margin-bottom:18px;overflow:hidden}.ecd-section>summary{list-style:none;cursor:pointer;padding:12px 16px;background:#0C2340;color:white;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center}.ecd-section>summary::-webkit-details-marker{display:none}.ecd-section>summary:before{content:'▸';font-size:12px}.ecd-section[open]>summary:before{content:'▾'}.ecd-section>summary>span:last-child{margin-left:auto;font-size:12px}.ecd-backlog>summary{background:#FA4616}.ecd-backlog-content{padding:12px}.ecd-backlog label{display:flex;align-items:center;gap:7px;margin-bottom:10px}.ecd-scroll{overflow-x:auto;overflow-y:hidden;max-height:none;position:relative;isolation:isolate}
          .ecd-table{border-collapse:separate;border-spacing:0;min-width:100%;table-layout:fixed;font-size:11px}.ecd-table th,.ecd-table td{border-right:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;padding:7px 8px;min-width:95px;vertical-align:middle;box-sizing:border-box}.ecd-table td{height:53px;background:#fff}.ecd-table th{background:#418EDE;color:white;font-weight:600;text-align:center}.ecd-table thead th{position:sticky;z-index:6}.ecd-table .ecd-week th{top:0;height:33px;background:#0C2340;line-height:18px;border-bottom:6px solid #f1f5f9}.ecd-table .ecd-day th{top:33px;height:52px;line-height:17px}.ecd-table .ecd-week .ecd-freeze{vertical-align:middle}.ecd-table .ecd-left{position:sticky;background:white;z-index:3;text-align:left}.ecd-table .ecd-freeze{position:sticky;z-index:8;background:#0C2340}.ecd-table .ecd-frozen-end{border-right:3px solid #aebdca}.ecd-table .ecd-delivered{background:#d9e8f8;color:#0C2340;text-align:center}.ecd-table thead .ecd-delivered{background:#0C2340;color:white}.ecd-table .ecd-today{background:#FA4616}.ecd-table .ecd-holiday{background:repeating-linear-gradient(45deg,#f4f6f8,#f4f6f8 5px,#dce2e8 5px,#dce2e8 6px)}.ecd-table thead .ecd-holiday{background:#8595a5;color:white}.ecd-table .ecd-group-end td{border-bottom:2px solid var(--brand)}.ecd-table .ecd-brand{font-weight:600;border-left:4px solid var(--brand)}.ecd-table .ecd-sub{display:block;font-weight:400;opacity:.8;font-size:10px}.ecd-table .ecd-cell{text-align:center;position:relative}.ecd-table .ecd-cell>span{display:flex;justify-content:space-between;gap:5px}.ecd-table .ecd-pill{display:inline-block;margin:0 2px 3px;padding:1px 4px;border-radius:4px;font-weight:600;font-size:10px}.ecd-table .ecd-progress{height:3px;background:#e6ebef;border-radius:3px;margin-top:4px}.ecd-table .ecd-progress>i{display:block;height:3px;background:var(--brand);max-width:100%;border-radius:3px}.ecd-table tfoot td{position:sticky;bottom:0;background:#0C2340!important;color:white;font-weight:600;z-index:5;height:51px}.ecd-table tfoot .ecd-left{z-index:7}.ecd-table .ecd-label{white-space:normal;word-break:normal}.ecd-table .ecd-qty{font-weight:600}.ecd-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:14px 0;font-size:11px}.ecd-legend>span{display:flex;gap:6px;align-items:center}.ecd-legend i{display:inline-block;width:13px;height:13px;border-radius:3px}.ecd-input-date{border:1px solid #c5d2de;border-radius:7px;padding:6px;background:white;max-width:150px;font:inherit}.ecd-backlog-table{width:100%;border-collapse:collapse;white-space:nowrap}.ecd-backlog-table th,.ecd-backlog-table td{padding:9px 12px;text-align:left;border-bottom:1px solid #f5ded6}.ecd-backlog-table th{background:#fee4dc}.ecd-backlog-table td{background:#fff7f4}.ecd-input-date[disabled]{opacity:.6}.ecd-empty{padding:20px;color:#60758b}.ecd-save-state{display:block;font-size:10px;white-space:normal;max-width:150px}.ecd-note{font-size:10px;color:#60758b;margin:8px 0}
          #abaEntregasCD{font-family:Poppins,Arial,sans-serif;color:#0C2340}
          /* Só a página rola verticalmente. A tabela pode rolar na horizontal,
             com colunas de tamanho fixo, sem comprimir datas e quantidades. */
          #ecdNovaVisao .ecd-scroll{overflow-x:auto;overflow-y:hidden;max-height:none;scrollbar-gutter:auto}
          #ecdNovaVisao .ecd-table{width:max-content;table-layout:fixed;min-width:100%}
          #ecdNovaVisao .ecd-table .ecd-week th{height:36px;top:0;border-bottom:6px solid #f1f5f9}
          #ecdNovaVisao .ecd-table .ecd-day th{height:58px;top:36px}
          #ecdNovaVisao .ecd-table .ecd-week-corner{position:sticky;left:0;z-index:13;background:#0C2340}
          #ecdNovaVisao .ecd-table .ecd-day .ecd-freeze{z-index:12;background:#0C2340}
          #ecdNovaVisao .ecd-table .ecd-day .ecd-delivered{background:#0C2340;color:#fff}
          /* .ecd-cell define position:relative no legado e anulava o sticky de
             Entregue. Fixar também cada célula e o total geral, até essa coluna. */
          #ecdNovaVisao .ecd-table tbody .ecd-left.ecd-delivered{position:sticky;z-index:9;background:#d9e8f8;color:#0C2340}
          #ecdNovaVisao .ecd-table tfoot .ecd-left{position:sticky;bottom:0;z-index:14}
          #ecdNovaVisao .ecd-table tfoot .ecd-left.ecd-delivered{position:sticky;bottom:0;z-index:15;background:#d9e8f8!important;color:#0C2340}
          #ecdNovaVisao .ecd-table th,#ecdNovaVisao .ecd-table td{overflow-wrap:normal;word-break:normal}
          .ecd-toolbar{display:flex;justify-content:flex-end;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
          .ecd-toolbar #ecdAviso{flex:1;margin:0}
          .ecd-table .ecd-brand{border-bottom:2px solid var(--brand)}
        </style>
        <div class="ecd-toolbar">
          <p id="ecdAviso" role="status"></p>
          <button id="ecdPrint" type="button" class="ecd-button" onclick="pgECDCapturar(this)" title="Captura os dois quadros completos, incluindo linhas e colunas fora da rolagem">📸 Capturar painel (PNG)</button>
          <button id="ecdExportarXLSX" type="button" class="ecd-button" onclick="pgECDExportarXLSX(this)">Baixar XLSX</button>
          <button id="ecdExportar" type="button" class="ecd-button" style="background:#fff;color:#0C2340" onclick="pgECDExportar(this)">Exportar para Sheets</button>
        </div>
        <p id="ecdSheetsStatus" class="ecd-note" role="status"></p>
        <div class="ecd-controls">
          <label>Início<input id="ecdInicio" type="date" onchange="pgECDRender()"></label>
          <label>Fim<input id="ecdFim" type="date" onchange="pgECDRender()"></label>
          <label style="flex-direction:row;align-items:center;gap:8px"><input id="ecdOcultarConcluidos" type="checkbox" onchange="pgECDRender()">Ocultar linhas 100% entregues</label>
        </div>
        <div id="ecdFalhas" role="alert"></div>
        <details id="ecdPendencias" class="ecd-section ecd-backlog">
          <summary><span>Backlog · pendências para registrar</span><span id="ecdBacklogTotal"></span></summary>
          <div class="ecd-backlog-content"><label><input id="ecdTodasPendencias" type="checkbox" onchange="pgECDRender()">Mostrar também as pendências com previsão</label><div id="ecdBacklog" class="ecd-scroll"></div></div>
        </details>
        <div class="ecd-legend"><span><i style="background:#b3d2f1"></i><span id="ecdLegendaEntregue">Entregue até ontem</span></span><span><i style="background:#C0DD97"></i>Coletado · em trânsito</span><span><i style="background:#FAC775"></i>Aguardando coleta</span><span>% = acumulado da linha · hachurado = feriado</span></div>
        <p id="ecdNotaDomingo" class="ecd-note"></p>
        <details id="ecdPorMarca" class="ecd-section" open><summary><span>Quadro 1 · marca e CD</span><span id="ecdInfoMarca"></span></summary><div id="ecdQuadroMarca" class="ecd-scroll"></div></details>
        <details id="ecdDetalhado" class="ecd-section" open><summary><span>Quadro 2 · marca, série e CD</span><span id="ecdInfoSerie"></span></summary><div id="ecdQuadroSerie" class="ecd-scroll"></div></details>
        <p class="ecd-note">Os filtros da tabela alteram apenas a exibição; o Total Geral mantém a base completa. Entregue mostra sempre o acumulado até ontem, independente do período. Os percentuais diários mostram o acumulado até cada data. O plano inclui o backlog. Previsões em domingos e feriados aparecem no próximo dia de operação; a data informada permanece na exportação. Datas após o período ficam nas pendências.</p>`;
        $('ecdInicio').value = hoje();
        const fimPadrao = window.PG_ENTREGAS_CD_CONFIG?.fimCiclo || hoje().slice(0,4) + '-12-02';
        $('ecdFim').value = fimPadrao >= hoje() ? fimPadrao : hoje();
    }
    const filtro = id => $(id)?.value || '';
    function montarItens() {
        estado.previsoes = window.PG_ECD_PREVISOES || estado.previsoes;
        estado.itens = window.pgEntregasCDModelo.montar(estado.base, estado.previsoes, hoje(), {
            volumeCanonico: true, conciliarRealizado: true, baseOriginal: window.dadosGlobais || estado.base});
        const marcas = [...new Set(estado.itens.map(i => i.marca))].sort();
        estado.marcas = new Map(marcas.map((m, i) => [m, paletaArco[i % paletaArco.length]]));
        window.pgECDRender();
    }
    const statusTexto = p => p.backlog ? 'Backlog' : p.status === 'TRANSITO' ? 'Coletado · em trânsito' : p.status === 'ENTREGUE' ? 'Entregue' : 'Aguardando coleta';
    function tooltip(ps) {
        const totais = new Map();
        (ps || []).forEach(p => totais.set(statusTexto(p), (totais.get(statusTexto(p)) || 0) + p.volume));
        return ['Total: ' + exato(volume(ps)), ...[...totais].map(([status, v]) => status + ': ' + exato(v))].join('\n');
    }
    function quadro(linhas, c, detalhado) {
        const widths = detalhado ? [160, 145, 145, 135] : [175, 155, 135];
        const larguraDia = 136;
        const labels = detalhado ? ['Marca', 'Série', 'CD', 'Entregue'] : ['Marca', 'CD', 'Entregue'];
        const left = widths.map((_, i) => widths.slice(0, i).reduce((a, b) => a + b, 0));
        const fixo = i => 'left:' + left[i] + 'px;width:' + widths[i] + 'px;min-width:' + widths[i] + 'px;max-width:' + widths[i] + 'px';
        const col = labels.length;
        // A primeira faixa é exclusivamente da semana. O espaço entre semana
        // e datas atravessa também Marca, Série, CD e Entregue, como na referência.
        const cantoSemana = '<th colspan="' + col + '" class="ecd-week-corner" style="width:' + widths.reduce((a,b)=>a+b,0) + 'px"></th>';
        const header = labels.map((label, i) => '<th class="ecd-freeze ' + (i === col - 1 ? 'ecd-frozen-end ecd-delivered' : '') + '" style="' + fixo(i) + '">' + label + (i === col - 1 ? '<span class="ecd-sub">até ontem · ' + br(ontem(c.hoje)) + '</span>' : '') + '</th>').join('');
        const atual = c.semanas.findIndex(s => s.inicio <= c.hoje && s.fim >= c.hoje);
        const semanas = c.semanas.map((s, n) => '<th colspan="' + s.tamanho + '">' + (n === atual ? 'Semana atual · ' : atual >= 0 && n === atual + 1 ? 'Próxima semana · ' : '') + br(s.inicio) + ' a ' + br(s.fim) + (n === c.semanas.length - 1 ? ' · fim' : '') + '</th>').join('');
        const dias = c.dias.map(d => '<th class="' + (d.feriado ? 'ecd-holiday' : d.data === c.hoje ? 'ecd-today' : '') + '">' + ['dom','seg','ter','qua','qui','sex','sáb'][new Date(d.data + 'T12:00:00Z').getUTCDay()] + ' ' + br(d.data) + '<span class="ecd-sub">' + (d.feriado ? 'feriado' + (volume(c.total.dias[d.data]) ? ' · ' + k(volume(c.total.dias[d.data])) : '') : (d.data === c.hoje ? 'hoje · ' : '') + k(volume(c.total.dias[d.data]))) + '</span></th>').join('');
        const marcaPlano = new Map(); linhas.forEach(g => marcaPlano.set(g.marca, (marcaPlano.get(g.marca) || 0) + g.total));
        const linhasMarca = (idx, serie) => { let n = 1; while (idx + n < linhas.length && linhas[idx + n].marca === linhas[idx].marca && (!serie || linhas[idx + n].serie === linhas[idx].serie)) n++; return n; };
        function celulas(g, total = false) {
            let acumulado = g.acumuladoAnterior ?? g.entregue;
            const entreguePs = g.parcelas.filter(p => p.status === 'ENTREGUE' && p.dataOriginal < c.hoje && !p.backlog);
            const realizado = entregueAteOntem(g);
            let h = '<td class="ecd-left ecd-delivered ecd-frozen-end ecd-cell" style="' + fixo(col - 1) + '" title="' + esc(tooltip(entreguePs)) + '"><b>' + k(realizado) + '</b><span class="ecd-sub">' + pct(realizado, g.total) + '</span></td>';
            c.dias.forEach(d => {
                const ps = g.dias[d.data] || [], v = volume(ps); acumulado += v;
                const transito = volume(ps.filter(p => p.status === 'TRANSITO')), entregas = volume(ps.filter(p => p.status === 'ENTREGUE'));
                const parte = v ? Math.round(transito * 100 / v) : 0;
                let fundo = '';
                if (!total && v) fundo = entregas === v ? '#d9e8f8' : transito === v ? '#e6f1d9' : !transito ? '#fdf0da' : 'linear-gradient(90deg,#e6f1d9 ' + parte + '%,#fdf0da ' + parte + '%)';
                const pills = !detalhado && !total ? [...new Set(ps.map(p => p.serie))].map(serie => {
                    const sub = ps.filter(p => p.serie === serie), sv = volume(sub), st = volume(sub.filter(p => p.status === 'TRANSITO'));
                    const cor = sub.every(p => p.status === 'ENTREGUE') ? '#b3d2f1' : st === sv ? '#C0DD97' : !st ? '#FAC775' : 'linear-gradient(90deg,#C0DD97 ' + Math.round(st * 100 / sv) + '%,#FAC775 0)';
                    return '<i class="ecd-pill" style="background:' + cor + '">' + esc(serie || 'Sem série') + '</i>';
                }).join('') : '';
                h += '<td class="ecd-cell ' + (d.feriado ? 'ecd-holiday' : '') + '"' + (fundo ? ' style="background:' + fundo + '"' : '') + ' title="' + esc(g.marca + ' · ' + (g.serie ? g.serie + ' · ' : '') + (g.cd || '') + ' · ' + br(d.data) + '\n' + tooltip(ps)) + '">' +
                    (d.feriado && !v ? '—' : v ? pills + '<span><b>' + k(v) + '</b><em style="font-style:normal">' + pct(acumulado, g.total) + (acumulado >= g.total && g.total ? ' ✓' : '') + '</em></span>' + (!detalhado && !total ? '<div class="ecd-progress"><i style="width:' + (g.total ? acumulado * 100 / g.total : 0) + '%"></i></div>' : '') : '<span class="ecd-sub">' + (acumulado ? pct(acumulado, g.total) : '—') + '</span>') + '</td>';
            }); return h;
        }
        const body = linhas.map((g, n) => {
            const inicioMarca = !n || linhas[n - 1].marca !== g.marca;
            const inicioSerie = inicioMarca || linhas[n - 1].serie !== g.serie;
            const fimMarca = n === linhas.length - 1 || linhas[n + 1].marca !== g.marca;
            let h = '<tr class="' + (fimMarca ? 'ecd-group-end' : '') + '" style="--brand:' + (estado.marcas.get(g.marca) || '#418EDE') + '">';
            if (inicioMarca) h += '<td rowspan="' + linhasMarca(n, false) + '" class="ecd-left ecd-brand ecd-label" style="' + fixo(0) + '">' + esc(g.marca) + '<span class="ecd-sub">' + k(marcaPlano.get(g.marca)) + ' no ciclo</span></td>';
            if (detalhado && inicioSerie) h += '<td rowspan="' + linhasMarca(n, true) + '" class="ecd-left ecd-label" style="' + fixo(1) + '">' + esc(g.serie || 'Sem série') + '</td>';
            h += '<td class="ecd-left ecd-label" style="' + fixo(col - 2) + '">' + esc(g.cd) + '</td>' + celulas(g) + '</tr>'; return h;
        }).join('');
        const footerLabels = labels.slice(0, -1).map((_, i) => '<td class="ecd-left" style="' + fixo(i) + '">' + (i ? '' : 'Total geral<span class="ecd-sub">' + k(c.total.total) + ' no ciclo</span>') + '</td>').join('');
        const largura = widths.reduce((a,b) => a+b,0) + c.dias.length * larguraDia;
        return '<table class="ecd-table" style="width:' + largura + 'px;min-width:100%"><colgroup>' + widths.map(w => '<col style="width:' + w + 'px">').join('') + c.dias.map(() => '<col style="width:' + larguraDia + 'px">').join('') + '</colgroup><thead><tr class="ecd-week">' + cantoSemana + semanas + '</tr><tr class="ecd-day">' + header + dias + '</tr></thead><tbody>' + body + '</tbody><tfoot><tr>' + footerLabels + celulas(c.total, true) + '</tr></tfoot></table>' + (!linhas.length ? '<p class="ecd-empty">Nenhuma linha para exibir. O Total Geral permanece completo.</p>' : '');
    }
    window.pgECDRender = function () {
        if (!$('ecdQuadroSerie')) return;
        mostrarFalhas();
        let c;
        try { c = window.pgEntregasCDModelo.calendario(estado.itens, {hoje: hoje(),
            inicio: filtro('ecdInicio') || hoje(), fim: filtro('ecdFim') || hoje(),
            feriados: window.PG_ENTREGAS_CD_CONFIG?.feriados}, {ocultarConcluidos: !!$('ecdOcultarConcluidos')?.checked}); }
        catch (e) { estado.calendario = null; aviso('Período inválido: ' + e.message, true); return; }
        estado.calendario = c;
        $('ecdLegendaEntregue').textContent = 'Entregue até ontem';
        $('ecdNotaDomingo').textContent = 'Realizado TP até ontem (' + br(ontem(c.hoje)) + '): ' + k(entregueAteOntem(c.total)) + ' de ' + k(c.total.total) + ' · ' + pct(entregueAteOntem(c.total), c.total.total) +
            ' · Origem: ' + (estado.origem === 'GRAFICA' ? 'Gráficas' : estado.origem === 'ACABADORA' ? 'Acabadoras' : 'Todas') + ' · Filtros da tabela alteram apenas a exibição; Total Geral da base completa.';
        $('ecdQuadroSerie').innerHTML = quadro(c.marcaSerieCD, c, true);
        $('ecdQuadroMarca').innerHTML = quadro(c.marcaCD, c, false);
        $('ecdInfoSerie').textContent = c.marcaSerieCD.length + ' linhas · ' + k(c.total.total);
        $('ecdInfoMarca').textContent = c.marcaCD.length + ' linhas · ' + k(c.total.total);
        $('ecdBacklogTotal').textContent = 'falta ' + k(c.total.backlog);
        const pendencias = new Map();
        c.parcelas.filter(p => p.status !== 'ENTREGUE' && ($('ecdTodasPendencias')?.checked || p.backlog)).forEach(p => {
            const chaveGrupo = JSON.stringify([p.grafica, p.marca, p.serie, p.cd]);
            if (!pendencias.has(chaveGrupo)) pendencias.set(chaveGrupo, {itens: new Set(), volume: 0, motivos: new Set()});
            const grupo = pendencias.get(chaveGrupo); grupo.itens.add(p.item); grupo.volume += p.volume; if (p.backlog) grupo.motivos.add(p.motivo);
        });
        estado.pendencias = [...pendencias.values()].map(g => {
            const itens = [...g.itens], chavesOrigem = [...new Set(itens.flatMap(chavesItem))];
            const previsoesOrigem = Object.assign({}, ...itens.map(i => i.previsoesOrigem || {[i.chave]: i.previsao || {}}));
            const entregas = new Set(itens.map(i => i.dtEntregaManual || ''));
            const coletas = new Set(itens.map(i => i.dtColetaManual || i.dtColetaPCP || ''));
            const total = itens.reduce((s, i) => s + i.total, 0), coletado = itens.reduce((s, i) => s + i.coletado, 0);
            return {...g, total, coletado, coleta: coletas.size > 1 ? 'Datas variadas' : br([...coletas][0]),
                item: {...itens[0], chave: chavesOrigem[0], chavesOrigem, previsoesOrigem, total, coletado,
                    dtEntregaManual: entregas.size === 1 ? [...entregas][0] : ''}};
        });
        $('ecdBacklog').innerHTML = estado.pendencias.length ? '<table class="ecd-backlog-table"><thead><tr>' +
            ['Gráfica', 'Marca', 'Série', 'CD', 'Coleta prevista', 'Plano', 'Coletado', 'Falta', 'Nova previsão'].map(t => '<th>' + t + '</th>').join('') + '</tr></thead><tbody>' + estado.pendencias.map((g, n) => {
                const i = g.item; return '<tr title="' + esc([...g.motivos].join(' · ')) + '"><td>' + esc(i.grafica) + '</td><td>' + esc(i.marca) + '</td><td>' + esc(i.serie) + '</td><td>' + esc(i.cd) + '</td><td>' + esc(g.coleta) + '</td><td title="' + exato(g.total) + '">' + k(g.total) + '</td><td>' + k(g.coletado) + ' (' + pct(g.coletado, g.total) + ')</td><td title="' + exato(g.volume) + '">' + k(g.volume) + '</td><td><input class="ecd-input-date" type="date" aria-label="Nova previsão ' + esc(rotuloGrupo(i)) + '" min="' + hoje() + '" value="' + esc(i.dtEntregaManual) + '" onchange="pgECDSalvar(' + n + ',this)" ' + (itemSalvando(i) ? 'disabled' : '') + '><span class="ecd-save-state" id="ecdSalvo' + n + '"></span></td></tr>';
            }).join('') + '</tbody></table>' : '<p class="ecd-empty">Nenhuma pendência nos filtros selecionados.</p>';
    };
    function enviarPrevisao(pedido) {
        const {item, payload} = pedido;
        const entradas = payload.previsoes || [payload], chaves = entradas.map(p => p.chave);
        if (chaves.some(chave => estado.salvando.has(chave))) return;
        mesclarPrevisoes({});
        const anteriores = Object.fromEntries(chaves.map(chave => [chave, estado.previsoes[chave] || {}]));
        const otimistas = entradas.filter(p => Number(anteriores[p.chave].versao || 0) <= Number(p.versaoEsperada || 0));
        mesclarPrevisoes(Object.fromEntries(otimistas.map(p => [p.chave, {...anteriores[p.chave], chave: p.chave,
            dataEntrega: p.dataEntrega, _pgRequestId: payload.requestId}])));
        chaves.forEach(chave => estado.salvando.add(chave)); estado.falhas.delete(item.chave);
        montarItens(); notificarPrevisoes(); aviso('Salvando nova previsão...');
        const falhar = erro => {
            chaves.forEach(chave => estado.salvando.delete(chave)); mesclarPrevisoes({});
            const reverter = Object.fromEntries(chaves.filter(chave => estado.previsoes[chave]?._pgRequestId === payload.requestId)
                .map(chave => [chave, anteriores[chave]]));
            mesclarPrevisoes(reverter, true);
            const texto = erro?.message || String(erro || 'Sem confirmação do servidor');
            estado.falhas.set(item.chave, {...pedido, erro: texto});
            montarItens(); notificarPrevisoes(); aviso('Não foi possível salvar: ' + texto, true);
        };
        if (typeof google === 'undefined' || !google.script?.run) { falhar('Sem conexão'); return; }
        const servidor = google.script.run.withSuccessHandler(resp => {
            const confirmadas = payload.previsoes ? resp?.previsoes : {[chaves[0]]: resp?.previsao};
            if (!resp?.success || chaves.some(chave => !confirmadas?.[chave])) { falhar(resp?.error); return; }
            chaves.forEach(chave => estado.salvando.delete(chave)); estado.falhas.delete(item.chave);
            mesclarPrevisoes(confirmadas); montarItens(); notificarPrevisoes();
            aviso('Nova previsão salva e compartilhada com o Giro.');
        }).withFailureHandler(falhar);
        if (payload.previsoes) servidor.salvarPrevisoesEntregaCDPortal(payload);
        else servidor.salvarPrevisaoEntregaCDPortal(payload);
    }
    window.pgECDSalvar = function (indice, input) {
        const item = estado.pendencias?.[indice]?.item;
        if (!item || !input || itemSalvando(item)) return;
        const valor = input.value;
        if (valor && valor < hoje()) { aviso('Informe uma data a partir de hoje.', true); input.value = item.dtEntregaManual; return; }
        const requestId = 'ecd-' + Date.now() + '-' + Math.random().toString(36).slice(2), chaves = chavesItem(item);
        const entradas = chaves.map(chave => ({chave, campos: ['dataEntrega'], dataEntrega: valor,
            versaoEsperada: Number(estado.previsoes[chave]?.versao || 0)}));
        enviarPrevisao({item, payload: chaves.length > 1 ? {requestId, dataEntrega: valor, previsoes: entradas}
            : {...entradas[0], requestId}});
    };
    window.pgECDReenviar = indice => { const pedido = [...estado.falhas.values()][indice]; if (pedido) enviarPrevisao(pedido); };
    // Mesmo padrão dos outros painéis: PNG desenhado do modelo completo em canvas.
    // Inclui todo o calendário, sem alterar a rolagem, os filtros ou as previsões.
    window.pgECDCapturar = async function (botao) {
        const c = estado.calendario;
        if (!c) { aviso('Período inválido. Confira Início e Fim antes de capturar.', true); return; }
        if (!c?.parcelas.length) { aviso('Não há parcelas nos filtros selecionados.', true); return; }
        if (estado.capturando) return;
        estado.capturando = true;
        const anterior = botao?.textContent;
        if (botao) { botao.disabled = true; botao.textContent = 'Gerando PNG…'; }
        try {
            const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
            if (!ctx) throw new Error('Não foi possível preparar a imagem.');
            const quadros = [{nome: 'marca-cd', titulo: 'Quadro 1 · marca e CD', linhas: c.marcaCD, detalhado: false},
                {nome: 'marca-serie-cd', titulo: 'Quadro 2 · marca, série e CD', linhas: c.marcaSerieCD, detalhado: true}];
            for (const q of quadros) {
                const larguras = q.detalhado ? [160, 145, 145, 135] : [175, 155, 135];
                const fixas = larguras.reduce((a, b) => a + b, 0), largura = fixas + c.dias.length * 136;
                const escala = Math.min(2, 16000 / largura), topo = 112, cab = 84, alturaLinha = 53;
                const porPagina = Math.max(1, Math.floor((Math.min(8000, 16000000 / (largura * escala * escala)) - topo - cab - alturaLinha) / alturaLinha));
                const paginas = Math.max(1, Math.ceil(q.linhas.length / porPagina));
                const texto = (s, x, y, w, cor = '#0C2340', negrito = false) => {
                    ctx.fillStyle = cor; ctx.font = (negrito ? 'bold ' : '') + '12px Poppins,Arial,sans-serif';
                    ctx.fillText(String(s), x + 8, y, Math.max(1, w - 16));
                };
                for (let pagina = 0; pagina < paginas; pagina++) {
                    const linhas = q.linhas.slice(pagina * porPagina, (pagina + 1) * porPagina);
                    const altura = topo + cab + (linhas.length + 1) * alturaLinha;
                    canvas.width = Math.ceil(largura * escala); canvas.height = Math.ceil(altura * escala);
                    ctx.scale(escala, escala); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, largura, altura);
                    ctx.fillStyle = '#0C2340'; ctx.fillRect(0, 0, largura, topo);
                    texto('Entregas no CD · ' + q.titulo + ' · ' + br(c.hoje), 8, 28, largura - 16, '#fff', true);
                    texto('Entregue até ontem · Coletado em trânsito · Aguardando coleta | Total Geral da base completa', 8, 55, largura - 16, '#fff');
                    texto('Período ' + br(c.inicio || c.hoje) + ' a ' + br(c.fim) + ' · Plano ' + exato(c.total.total) + ' · Backlog ' + exato(c.total.backlog) +
                        (paginas > 1 ? ' · Parte ' + (pagina + 1) + '/' + paginas : ''), 8, 82, largura - 16, '#fff');
                    let x = fixas;
                    c.semanas.forEach(s => { ctx.fillStyle = '#0C2340'; ctx.fillRect(x, topo, s.tamanho * 136, 32);
                        texto(br(s.inicio) + ' a ' + br(s.fim), x, topo + 21, s.tamanho * 136, '#fff', true); x += s.tamanho * 136; });
                    x = 0;
                    const labels = ['Marca', ...(q.detalhado ? ['Série'] : []), 'CD', 'Entregue'];
                    labels.forEach((label, i) => { ctx.fillStyle = '#0C2340'; ctx.fillRect(x, topo, larguras[i], cab);
                        texto(label, x, topo + 53, larguras[i], '#fff', true);
                        if (i === labels.length - 1) texto('até ontem · ' + br(ontem(c.hoje)), x, topo + 72, larguras[i], '#fff');
                        x += larguras[i]; });
                    c.dias.forEach(d => { ctx.fillStyle = d.feriado ? '#8595a5' : d.data === c.hoje ? '#FA4616' : '#418EDE';
                        ctx.fillRect(x, topo + 32, 136, cab - 32);
                        texto(br(d.data) + (d.feriado ? ' · feriado' : ''), x, topo + 54, 136, '#fff', true);
                        texto(k(volume(c.total.dias[d.data])), x, topo + 74, 136, '#fff'); x += 136; });
                    [...linhas, c.total].forEach((g, n) => {
                        const total = n === linhas.length, y = topo + cab + n * alturaLinha;
                        ctx.fillStyle = total ? '#0C2340' : '#fff'; ctx.fillRect(0, y, largura, alturaLinha);
                        const valores = [total ? 'Total geral' : g.marca, ...(q.detalhado ? [total ? '' : g.serie] : []), total ? '' : g.cd];
                        x = 0; valores.forEach((v, i) => { texto(v, x, y + 29, larguras[i], total ? '#fff' : '#0C2340', total); x += larguras[i]; });
                        ctx.fillStyle = '#d9e8f8'; ctx.fillRect(x, y, larguras.at(-1), alturaLinha);
                        texto(k(entregueAteOntem(g)), x, y + 23, larguras.at(-1), '#0C2340', true);
                        texto(pct(entregueAteOntem(g), g.total), x, y + 42, larguras.at(-1)); x += larguras.at(-1);
                        let acumulado = g.acumuladoAnterior ?? g.entregue;
                        c.dias.forEach(d => {
                            const ps = g.dias[d.data] || [], v = volume(ps); acumulado += v;
                            const entregas = volume(ps.filter(p => p.status === 'ENTREGUE')), transito = volume(ps.filter(p => p.status === 'TRANSITO'));
                            if (!total) {
                                ctx.fillStyle = d.feriado && !v ? '#edf0f3' : !v ? '#fff' : entregas === v ? '#d9e8f8' : '#fdf0da';
                                ctx.fillRect(x, y, 136, alturaLinha);
                                if (v && entregas !== v && transito) { ctx.fillStyle = '#e6f1d9'; ctx.fillRect(x, y, 136 * transito / v, alturaLinha); }
                            }
                            texto(v ? k(v) : d.feriado ? '—' : '', x, y + 23, 136, total ? '#fff' : '#0C2340', true);
                            texto(pct(acumulado, g.total), x, y + 42, 136, total ? '#fff' : '#0C2340');
                            ctx.strokeStyle = '#d5dee7'; ctx.strokeRect(x, y, 136, alturaLinha); x += 136;
                        });
                        if (!total) { ctx.fillStyle = estado.marcas.get(g.marca) || '#418EDE'; ctx.fillRect(0, y, 4, alturaLinha); }
                    });
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                    if (!blob) throw new Error('Não foi possível gerar o PNG.');
                    const url = URL.createObjectURL(blob), link = document.createElement('a');
                    link.download = 'Entregas_CD_' + q.nome + '_' + c.hoje + (paginas > 1 ? '_parte-' + (pagina + 1) : '') + '.png';
                    link.href = url; link.click(); setTimeout(() => URL.revokeObjectURL(url), 10000);
                }
            }
            aviso('Captura dos dois quadros concluída.');
        } catch (erro) { aviso('Não foi possível capturar o painel: ' + (erro?.message || erro), true); }
        finally { estado.capturando = false; if (botao) { botao.disabled = false; botao.textContent = anterior; } }
    };
    window.pgECDExportarXLSX = async function (botao) {
        if (estado.gerandoXLSX) return;
        const snapshot = estado.calendario;
        if (!snapshot) { aviso('Período inválido. Confira Início e Fim antes de baixar XLSX.', true); return; }
        if (!snapshot.parcelas.length) { aviso('Não há parcelas nos filtros selecionados para baixar XLSX.', true); return; }
        if (window.pgTPExportacaoPronta && !window.pgTPExportacaoPronta()) return;
        if (typeof window.pgGerarExcelAbas !== 'function') { aviso('Gerador XLSX indisponível. Recarregue o portal e tente novamente.', true); return; }
        estado.gerandoXLSX = true;
        const anterior = botao?.textContent || 'Baixar XLSX';
        if (botao) { botao.disabled = true; botao.textContent = 'Preparando XLSX…'; }
        aviso('Preparando o XLSX com os dois quadros e a base completa…');
        try {
            await new Promise(resolve => setTimeout(resolve, 30));
            const abas = window.pgEntregasCDModelo.exportarCalendario(snapshot).map(aba =>
                aba.nome.startsWith('Quadro_Marca_') ? {...aba, colunasCongeladas: aba.cabecalho.indexOf('Entregue') + 1} : aba);
            const blob = window.pgGerarExcelAbas(abas), url = URL.createObjectURL(blob);
            try {
                const link = document.createElement('a');
                link.download = 'Entregas_CD_' + snapshot.hoje + '.xlsx'; link.href = url; link.click();
            } finally { setTimeout(() => URL.revokeObjectURL(url), 10000); }
            aviso('XLSX pronto: download dos dois quadros e da base completa iniciado.');
        } catch (erro) { aviso('Não foi possível gerar o XLSX: ' + (erro?.message || erro), true); }
        finally { estado.gerandoXLSX = false; if (botao) { botao.disabled = false; botao.textContent = anterior; } }
    };
    const avisoSheets = (texto, erro = false) => {
        const el = $('ecdSheetsStatus'); if (!el) return;
        el.textContent = texto; el.style.color = erro ? '#FA4616' : '#0C2340';
    };
    window.pgECDExportar = function (botao) {
        if (estado.sheetsPendente) {
            avisoSheets('A solicitação do Google continua em andamento. Você pode baixar XLSX enquanto aguarda.'); return;
        }
        if (!estado.calendario) { aviso('Período inválido. Confira Início e Fim antes de exportar.', true); return; }
        if (!estado.calendario?.parcelas.length) { aviso('Não há parcelas nos filtros selecionados.', true); return; }
        if (window.pgTPExportacaoPronta && !window.pgTPExportacaoPronta()) return;
        if (typeof google === 'undefined' || !google.script?.run) { avisoSheets('Conexão com o Google indisponível. Você pode baixar XLSX.', true); return; }
        let abas;
        try { abas = window.pgEntregasCDModelo.exportarCalendario(estado.calendario); }
        catch (erro) { avisoSheets('Erro ao preparar os dados para Sheets: ' + (erro?.message || erro), true); return; }
        const operacao = {botao, anterior: botao?.textContent || 'Exportar para Sheets'};
        estado.sheetsPendente = operacao;
        if (botao) { botao.disabled = true; botao.textContent = 'Criando no Google…'; }
        avisoSheets('Criando a planilha no Google. Você pode baixar XLSX enquanto aguarda.');
        operacao.timeout = setTimeout(() => {
            if (estado.sheetsPendente !== operacao) return;
            if (botao) botao.textContent = 'Aguardando Google…';
            avisoSheets('O Google ainda não confirmou; você pode baixar XLSX. A solicitação continua em andamento.');
        }, 60000);
        const concluir = () => {
            if (estado.sheetsPendente !== operacao) return false;
            clearTimeout(operacao.timeout); estado.sheetsPendente = null;
            if (botao) { botao.disabled = false; botao.textContent = operacao.anterior; }
            return true;
        };
        const falhar = erro => {
            if (concluir()) avisoSheets('Erro ao exportar para Sheets: ' + (erro?.message || erro || 'O Google não confirmou a criação da planilha.') + ' Você pode baixar XLSX.', true);
        };
        try {
            google.script.run.withSuccessHandler(resp => {
                if (!concluir()) return;
                if (!resp?.success) { avisoSheets('O Google não confirmou a criação da planilha: ' + (resp?.error?.message || resp?.error || 'resposta sem confirmação') + '. Você pode baixar XLSX.', true); return; }
                if (!/^https:\/\/docs\.google\.com\/spreadsheets\//.test(resp.url || '')) { avisoSheets('O Google respondeu sem um link válido. A criação da planilha não foi confirmada; você pode baixar XLSX.', true); return; }
                $('ecdSheetsStatus').innerHTML = 'Planilha criada: <a href="' + esc(resp.url) + '" target="_blank" rel="noopener noreferrer" style="color:#418EDE;text-decoration:underline">Abrir os dois quadros e a base por parcela</a>';
            }).withFailureHandler(falhar).gerarPlanilhaEntregasCD({nome: 'Entregas_CD_' + hoje(), abas});
        } catch (erro) { falhar(erro); }
    };
    window.processarEntregasCD = function () {
        estrutura(); if (!$('ecdQuadroSerie')) return;
        const origem = filtro('pgFiltroOrigem') || 'TODOS';
        const global = window.pgBaseGeralReportExecutiva || window.dadosDestinoCDFinal || [];
        estado.origem = origem;
        // Mesma base e exclusão por destino da Meta Armazém. A origem explícita
        // recorta somente a fonte física, antes da união canônica de CD.
        estado.base = global.filter(l => {
            if (window.pgSolicitacaoCancelada?.(l)) return false;
            const acabadora = typeof window.pgEhFonteAcabadora === 'function' ? window.pgEhFonteAcabadora(l)
                : [l._SOURCE, l.BASE, l._base].some(v => normal(v).includes('ACAB'));
            const destino = acabadora ? (l['CD DESTINO'] || l.CD_FINAL || l.CD || l.CK || '') : (l.CD_MAPA ?? '');
            return normal(destino) !== 'WALPRINT' && (origem !== 'ACABADORA' || acabadora) && (origem !== 'GRAFICA' || !acabadora);
        });
        if (typeof window.pgUnirTotalSemDuplicidade === 'function') estado.base = window.pgUnirTotalSemDuplicidade(estado.base);
        montarItens();
        // Os gráficos anteriores permanecem no final, sob os novos quadros.
        if (typeof legado === 'function') legado();

        google.script.run.withSuccessHandler(resp => {
            if (rodada !== estado.rodada) return;
            if (!resp?.success) { aviso('Não foi possível atualizar as previsões compartilhadas.', true); return; }
            mesclarPrevisoes(resp.previsoes || {}); window.PG_ECD_PREVISOES_LIDAS = true; montarItens();
        }).withFailureHandler(erro => aviso('Não foi possível atualizar as previsões: ' + (erro?.message || erro), true)).getPrevisoesEntregaCDPortal();
    };
    window.addEventListener?.('pgportal-previsoes-atualizadas', evento => {
        const alterado = mesclarPrevisoes(evento.detail?.previsoes || {});
        if (alterado && $('ecdQuadroSerie') && !$('abaEntregasCD')?.classList.contains('hidden')) montarItens();
    });
})();
