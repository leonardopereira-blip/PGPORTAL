<div id="abaEntregasCD" class="aba-conteudo hidden h-full flex flex-col">
    <div class="bg-white p-4 shadow-sm border-b border-slate-200 flex-shrink-0">
        <h2 class="text-xl font-black text-slate-800 tracking-tight">Entregas por CD</h2>
    </div>
    <div class="flex-1 overflow-y-auto p-2 scroller bg-neutral-100">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4">
            <div class="flex flex-wrap items-center gap-3 text-xs text-slate-600">
                <label class="border border-slate-200 rounded-lg px-3 py-2 cursor-pointer"><input type="radio" name="visaoEntregasCD" value="mes" checked onchange="window.pgAtualizarPeriodoEntregasCD('periodo')"> Mês</label>
                <label class="border border-slate-200 rounded-lg px-3 py-2 cursor-pointer"><input type="radio" name="visaoEntregasCD" value="30d" onchange="window.pgAtualizarPeriodoEntregasCD('periodo')"> Próximos 30 dias</label>
                <label class="border border-slate-200 rounded-lg px-3 py-2 cursor-pointer"><input type="radio" name="visaoEntregasCD" value="7d" onchange="window.pgAtualizarPeriodoEntregasCD('periodo')"> Próximos 7 dias</label>
                <label class="border border-slate-200 rounded-lg px-3 py-2 cursor-pointer"><input type="radio" name="visaoEntregasCD" value="semana" onchange="window.pgAtualizarPeriodoEntregasCD('periodo')"> Semana atual</label>
                <label class="border border-violet-200 bg-violet-50 rounded-lg px-3 py-2 cursor-pointer"><input type="checkbox" id="acumuladaEntregasCD" checked onchange="window.pgAtualizarPeriodoEntregasCD('modo-global')"> Visão acumulada (todos)</label>
                <label id="periodoEntregasCD">Mês <input id="mesEntregasCD" type="month" class="border rounded px-2 py-1" onchange="window.pgAtualizarPeriodoEntregasCD('periodo')"></label>
                <button type="button" class="border border-slate-300 bg-white hover:bg-slate-50 rounded-lg px-3 py-2 font-bold text-slate-700" onclick="window.pgBaixarBaseEntregasCD(this)">Baixar base CSV</button>
            </div>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4">
            <div class="flex flex-wrap items-start justify-between gap-3 mb-3">
                <div>
                    <h3 class="text-sm font-black text-slate-800">Visão geral dos CDs</h3>
                    <p class="text-[11px] text-slate-500 mt-1">Linha = planejado · coluna = realizado · mesma cor = mesmo CD.</p>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <div id="modoGeralEntregasCD" class="inline-flex rounded-lg border border-slate-200 bg-slate-50 p-1 text-[11px] font-bold">
                        <button type="button" data-pg-modo="dia" onclick="window.pgDefinirModoGeralEntregasCD(false)" class="rounded-md px-3 py-1.5 transition-colors">Dia a dia</button>
                        <button type="button" data-pg-modo="acumulado" onclick="window.pgDefinirModoGeralEntregasCD(true)" class="rounded-md px-3 py-1.5 transition-colors">Acumulada</button>
                    </div>
                    <span id="notaGraficoGeralEntregasCD" class="text-[11px] font-semibold text-slate-500"></span>
                </div>
            </div>
            <div id="flagsEntregasCD" class="flex flex-wrap items-center gap-2 mb-3"></div>
            <div class="relative h-[420px]"><canvas id="grafLinhaEntregasCD"></canvas></div>
        </div>
        <div id="graficosEntregasCD" class="space-y-4"></div>
    </div>
</div>
<script>
(function() {
    const normalizar = valor => String(valor ?? '').normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '').trim().replace(/\s+/g, ' ').toUpperCase();
    const escapar = valor => String(valor ?? '').replace(/[&<>"']/g, c =>
        ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
    const campo = (linha, nome) => typeof window.pgCampoColeta === 'function'
        ? window.pgCampoColeta(linha, nome) : linha?.[nome];
    const numero = valor => {
        if (typeof window.pgNumeroPrazoV35 === 'function') return window.pgNumeroPrazoV35(valor);
        if (typeof valor === 'number') return Math.max(0, Number.isFinite(valor) ? valor : 0);
        let texto = String(valor ?? '').trim();
        if (texto.includes(',')) texto = texto.replace(/\./g, '').replace(',', '.');
        else if (/^\d{1,3}(\.\d{3})+$/.test(texto)) texto = texto.replace(/\./g, '');
        return Math.max(0, Number(texto) || 0);
    };
    const hojePortal = () => typeof dtHojeISO !== 'undefined' ? dtHojeISO :
        new Date().toLocaleDateString('en-CA');
    const ehAcabadora = linha => typeof window.pgEhFonteAcabadora === 'function'
        ? window.pgEhFonteAcabadora(linha)
        : [linha._SOURCE, linha.BASE, linha._base].some(v => normalizar(v).includes('ACAB'));
    const cacheResumos = new WeakMap();
    let sufixosAtivos = [];
    let baseAtivaEntregasCD = [];
    let gruposAtivosEntregasCD = new Map();
    let graficoGeralEntregasCD = null;
    let acumuladoGeralEntregasCD = true;
    const cdsOcultosEntregasCD = new Set();
    const paletaEntregasCD = [
        '#0C2340', '#418EDE', '#FA4616', '#FCB04E', '#284081',
        '#10B981', '#7C3AED', '#BE123C', '#0F766E', '#9333EA'
    ];

    const cdFinalEntrega = linha => normalizar(
        linha.CD_FINAL || campo(linha, 'CD DESTINO') || linha.CD || linha.CK
    );
    const destinoRoteamentoEntrega = linha => normalizar(
        campo(linha, 'CD DESTINO') || linha.CD || linha.CK || linha.CD_FINAL
    );
    const graficaEntrega = linha => normalizar(
        linha.GRAFICA_FINAL || campo(linha, 'GRÁFICA') || linha.GRAFICA || linha.BQ
    );
    const ehAthosNome = valor => {
        const nome = normalizar(valor);
        return nome === 'ATHOS' || nome.startsWith('ATHOS ');
    };
    const ehPcpParaAthos = linha =>
        !ehAcabadora(linha) && ehAthosNome(destinoRoteamentoEntrega(linha));

    // Regra exclusiva desta visão:
    // ATHOS deixa de ser tratado como CD e passa a entrar pelo fluxo de PCP_ACABADORAS,
    // representando o que efetivamente seguirá da ATHOS para os CDs.
    const ajustarBaseEntregasCD = (linhas, origem) => (linhas || []).filter(linha => {
        if (ehPcpParaAthos(linha)) return false;
        if (ehAthosNome(cdFinalEntrega(linha))) return false;

        if (origem === 'TODOS' && ehAcabadora(linha)) {
            const grafica = graficaEntrega(linha);
            // Preserva a regra já existente de KN e RAIZES em "Todas";
            // ATHOS deixa de ser excluída somente nesta visão.
            if (['KN', 'RAIZES'].includes(grafica)) return false;
        }
        return true;
    });

    const addDaysEntregaCD = (iso, dias) => {
        const d = new Date(iso + 'T00:00:00Z');
        d.setUTCDate(d.getUTCDate() + dias);
        return d.toISOString().slice(0, 10);
    };
    const ultimoDiaEntregaCD = mes =>
        new Date(Date.UTC(Number(mes.slice(0, 4)), Number(mes.slice(5, 7)), 0))
            .toISOString().slice(0, 10);
    const labelDataEntregaCD = iso => iso.slice(8, 10) + '/' + iso.slice(5, 7);
    const fmtEntregaCD = n => Math.round(Number(n || 0)).toLocaleString('pt-BR');

    const periodoAtualEntregasCD = (acumuladoOverride = null) => {
        const hoje = hojePortal();
        const modo = document.querySelector('input[name="visaoEntregasCD"]:checked')?.value || 'mes';
        const acumulado = acumuladoOverride === null
            ? !!document.getElementById('acumuladaEntregasCD')?.checked
            : !!acumuladoOverride;
        const inputMes = document.getElementById('mesEntregasCD');
        if (inputMes && !inputMes.value) inputMes.value = hoje.slice(0, 7);

        let inicio = hoje;
        let fim = hoje;
        if (modo === 'semana') {
            const dow = new Date(hoje + 'T00:00:00Z').getUTCDay();
            inicio = addDaysEntregaCD(hoje, -((dow + 6) % 7));
            fim = addDaysEntregaCD(inicio, 6);
        } else if (modo === '7d') {
            fim = addDaysEntregaCD(hoje, 6);
        } else if (modo === '30d') {
            fim = addDaysEntregaCD(hoje, 29);
        } else {
            const mes = inputMes?.value || hoje.slice(0, 7);
            inicio = mes + '-01';
            fim = ultimoDiaEntregaCD(mes);
        }
        return {hoje, modo, acumulado, inicio, fim};
    };

    const somarAteEntregaCD = (mapa, campoNome, limite) => {
        let total = 0;
        mapa.forEach((evento, data) => {
            if (data <= limite) total += Number(evento?.[campoNome] || 0);
        });
        return total;
    };

    const atualizarBotoesModoEntregaCD = (id, acumulado) => {
        const bloco = document.getElementById(id);
        if (!bloco) return;
        bloco.querySelectorAll('[data-pg-modo]').forEach(botao => {
            const ativo = botao.dataset.pgModo === (acumulado ? 'acumulado' : 'dia');
            botao.className = 'rounded-md px-3 py-1.5 transition-colors ' +
                (ativo ? 'bg-white text-indigo-700 shadow-sm border border-indigo-200' : 'text-slate-500 hover:text-slate-800');
        });
    };

    const corCDEntrega = cd => {
        const cds = Array.from(gruposAtivosEntregasCD.keys())
            .sort((a, b) => a.localeCompare(b, 'pt-BR', {numeric: true}));
        const indice = Math.max(0, cds.indexOf(cd));
        return paletaEntregasCD[indice % paletaEntregasCD.length];
    };

    const renderFlagsEntregasCD = () => {
        const bloco = document.getElementById('flagsEntregasCD');
        if (!bloco) return;
        const cds = Array.from(gruposAtivosEntregasCD.keys())
            .sort((a, b) => a.localeCompare(b, 'pt-BR', {numeric: true}));
        bloco.innerHTML =
            '<button type="button" onclick="window.pgMostrarTodosCDsEntregas()" class="rounded-full border border-slate-300 bg-white px-3 py-1.5 text-[11px] font-bold text-slate-600 hover:bg-slate-50">Todos</button>' +
            cds.map(cd => {
                const ativo = !cdsOcultosEntregasCD.has(cd);
                const cor = corCDEntrega(cd);
                return '<button type="button" data-pg-cd="' + escapar(cd) + '" onclick="window.pgAlternarCDGeralEntregasCD(\'' +
                    String(cd).replace(/\\/g, '\\\\').replace(/'/g, "\\'") +
                    '\')" class="inline-flex items-center gap-2 rounded-full border px-3 py-1.5 text-[11px] font-bold transition-opacity ' +
                    (ativo ? 'bg-white text-slate-700 opacity-100' : 'bg-slate-50 text-slate-400 opacity-45') +
                    '" style="border-color:' + cor + '"><span class="inline-block h-2.5 w-2.5 rounded-full" style="background:' + cor + '"></span>' +
                    escapar(cd) + '</button>';
            }).join('');
    };

    window.pgAlternarCDGeralEntregasCD = function(cd) {
        if (cdsOcultosEntregasCD.has(cd)) cdsOcultosEntregasCD.delete(cd);
        else cdsOcultosEntregasCD.add(cd);
        window.pgRenderGraficoGeralEntregasCD();
    };

    window.pgMostrarTodosCDsEntregas = function() {
        cdsOcultosEntregasCD.clear();
        window.pgRenderGraficoGeralEntregasCD();
    };

    window.pgDefinirModoGeralEntregasCD = function(acumulado) {
        acumuladoGeralEntregasCD = !!acumulado;
        atualizarBotoesModoEntregaCD('modoGeralEntregasCD', acumuladoGeralEntregasCD);
        window.pgRenderGraficoGeralEntregasCD();
    };

    window.pgDefinirModoIndividualEntregasCD = function(sufixo, acumulado) {
        const chk = document.getElementById('acumuladaColetaFunil' + sufixo);
        if (chk) chk.checked = !!acumulado;
        atualizarBotoesModoEntregaCD('modoIndividual' + sufixo, !!acumulado);
        window.renderColetaFinalFunil(sufixo);
    };

    window.pgRenderGraficoGeralEntregasCD = function() {
        const canvas = document.getElementById('grafLinhaEntregasCD');
        const nota = document.getElementById('notaGraficoGeralEntregasCD');
        if (!canvas) return;

        if (graficoGeralEntregasCD) {
            graficoGeralEntregasCD.destroy();
            graficoGeralEntregasCD = null;
        }

        if (typeof Chart === 'undefined' || !gruposAtivosEntregasCD.size) {
            if (nota) nota.textContent = gruposAtivosEntregasCD.size ? 'Gráfico indisponível.' : 'Nenhum CD nos filtros selecionados.';
            return;
        }

        const periodo = periodoAtualEntregasCD(acumuladoGeralEntregasCD);
        atualizarBotoesModoEntregaCD('modoGeralEntregasCD', periodo.acumulado);
        renderFlagsEntregasCD();

        const contextos = Array.from(gruposAtivosEntregasCD.entries())
            .sort((a, b) => a[0].localeCompare(b[0], 'pt-BR', {numeric: true}))
            .filter(([cd]) => !cdsOcultosEntregasCD.has(cd))
            .map(([cd, linhas]) => {
                const resumo = window.pgCalcularEntregaCDFunil(linhas, periodo.hoje);
                return {cd, mapa: new Map(Array.from(resumo.dias.entries()))};
            });

        if (!contextos.length) {
            if (nota) nota.textContent = 'Selecione ao menos um CD nas flags acima.';
            return;
        }

        const todosDias = [];
        for (let d = periodo.inicio; d <= periodo.fim; d = addDaysEntregaCD(d, 1)) {
            todosDias.push(d);
        }

        const pontos = todosDias.filter(d => contextos.some(ctx => {
            const evt = ctx.mapa.get(d) || {};
            return Number(evt.esperado || 0) > 0 ||
                (d <= periodo.hoje && Number(evt.real || 0) > 0);
        }));

        if (!pontos.length) {
            if (nota) nota.textContent = 'Sem planejado ou realizado no período selecionado.';
            return;
        }

        const datasets = [];

        contextos.forEach(ctx => {
            const cor = corCDEntrega(ctx.cd);
            const planejado = pontos.map(d => {
                if (periodo.acumulado) return somarAteEntregaCD(ctx.mapa, 'esperado', d);
                return Math.max(0, Number(ctx.mapa.get(d)?.esperado || 0));
            });
            const realizado = pontos.map(d => {
                if (d > periodo.hoje) return null;
                if (periodo.acumulado) return somarAteEntregaCD(ctx.mapa, 'real', d);
                return Math.max(0, Number(ctx.mapa.get(d)?.real || 0));
            });

            datasets.push({
                type: 'line',
                label: ctx.cd + ' · Planejado',
                data: planejado,
                borderColor: cor,
                backgroundColor: cor,
                borderWidth: 2.5,
                borderDash: [7, 5],
                pointRadius: pontos.length > 31 ? 0 : 2,
                pointHoverRadius: 4,
                tension: 0.2,
                fill: false,
                spanGaps: false,
                order: 1
            });
            datasets.push({
                type: 'bar',
                label: ctx.cd + ' · Realizado',
                data: realizado,
                borderColor: cor,
                backgroundColor: cor + '99',
                borderWidth: 1,
                borderRadius: 3,
                categoryPercentage: 0.82,
                barPercentage: 0.86,
                order: 2
            });
        });

        graficoGeralEntregasCD = new Chart(canvas.getContext('2d'), {
            type: 'bar',
            data: {
                labels: pontos.map(labelDataEntregaCD),
                datasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                interaction: {mode: 'index', intersect: false},
                plugins: {
                    legend: {display: false},
                    tooltip: {
                        callbacks: {
                            label: contexto => contexto.dataset.label + ': ' + fmtEntregaCD(contexto.parsed.y)
                        }
                    }
                },
                scales: {
                    x: {
                        grid: {display: false},
                        ticks: {maxRotation: 0, autoSkip: true, maxTicksLimit: 16}
                    },
                    y: {
                        beginAtZero: true,
                        ticks: {callback: valor => Number(valor || 0).toLocaleString('pt-BR')}
                    }
                }
            }
        });

        if (nota) {
            nota.textContent = periodo.acumulado
                ? 'Visão acumulada'
                : 'Visão dia a dia';
        }
    };

    window.pgBaixarBaseEntregasCD = function() {
        if (!baseAtivaEntregasCD.length) {
            alert('Nenhum registro disponível para exportar nesta visão.');
            return;
        }

        const hoje = hojePortal();
        const cabecalho = [
            'CD destino', 'Origem', 'Gráfica', 'Marca', 'Série', 'Kit', 'SKU', 'Descrição',
            'OP', 'Envio', 'Coleta planejada', 'SLA (dias)', 'Entrega prevista', 'Entrega TP',
            'Tiragem base CD', 'Tiragem linha', 'Entregue', 'Fonte original', 'Tratamento'
        ];

        const linhas = baseAtivaEntregasCD.map(linha => {
            const acabadora = ehAcabadora(linha);
            const volumes = window.pgVolumesColetaUnificadosV37?.(linha, hoje) || {};
            const tiragemLinha = numero(campo(linha, 'TIRAGEM'));
            const tiragemBase = acabadora
                ? numero(campo(linha, 'TIRAGEM A ENTREGAR (total por CD)'))
                : tiragemLinha;
            const grafica = graficaEntrega(linha);

            return [
                cdFinalEntrega(linha),
                acabadora ? 'ACABADORA' : 'GRAFICA',
                grafica,
                linha.MARCA_FINAL || campo(linha, 'MARCA') || linha.UNIDADE || '',
                campo(linha, 'SÉRIE') || campo(linha, 'Série') || linha.SERIE || '',
                campo(linha, 'KIT') || campo(linha, 'Kit') || '',
                linha.SKU_REAL || campo(linha, 'SKU') || '',
                linha.DESC_REAL || campo(linha, 'DESCRIÇÃO') || linha.DESCRICAO || linha.PRODUTO || '',
                campo(linha, 'OP') || '',
                campo(linha, 'ENVIO') || campo(linha, 'Envio') || '',
                window.pgDataPlanoColetaLinha?.(linha) || '',
                window.pgDiasSLALinha?.(linha) ?? '',
                window.pgDataPlanoEntregaSLA?.(linha) || '',
                volumes.entregaTP || '',
                Math.round(tiragemBase),
                Math.round(tiragemLinha),
                Math.round(Number(volumes.entrega || 0)),
                linha._SOURCE || linha.BASE || linha._base || '',
                acabadora && ehAthosNome(grafica) ? 'ATHOS como acabadora nesta visão' : ''
            ];
        }).sort((a, b) =>
            String(a[0]).localeCompare(String(b[0]), 'pt-BR', {numeric: true}) ||
            String(a[2]).localeCompare(String(b[2]), 'pt-BR', {numeric: true}) ||
            String(a[6]).localeCompare(String(b[6]), 'pt-BR', {numeric: true})
        );

        const celula = valor => {
            let texto = String(valor ?? '');
            if (/^[=+@-]/.test(texto)) texto = "'" + texto;
            return '"' + texto.replace(/"/g, '""') + '"';
        };
        const csv = '\uFEFF' + [cabecalho].concat(linhas)
            .map(linha => linha.map(celula).join(';'))
            .join('\r\n');
        const url = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
        const link = document.createElement('a');
        link.href = url;
        link.download = 'Entregas_CD_base_' + hoje.replaceAll('-', '') + '.csv';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    };

    window.pgCalcularEntregaCDFunil = function(base, hoje) {
        const anterior = cacheResumos.get(base);
        if (anterior && anterior.hoje === hoje && anterior.matriz === window.PG_MATRIZ_SLA) return anterior.resumo;
        const resumo = {
            tipo: 'entrega', total: 0, esperadoHoje: 0, pendenteVencido: 0,
            realizado: 0, realizadoDatado: 0, mapaSolicitado: 0,
            mapaAgendadoTotal: 0, mapaSemColetaTP: 0, semPlano: 0,
            excluidoReal: 0, backlogAtual: 0, backlogSemData: 0,
            marcas: {}, graficas: {}, registros: [], prazosRegistros: [],
            backlogRegistros: [], dias: new Map()
        };
        const somarDia = (dia, tipo, volume) => {
            if (!dia || volume <= 0) return;
            if (!resumo.dias.has(dia)) resumo.dias.set(dia, {esperado: 0, real: 0, agendado: 0});
            resumo.dias.get(dia)[tipo] += volume;
        };
        (base || []).forEach(linha => {
            if (window.pgSolicitacaoCancelada?.(linha)) return;
            const acabadora = ehAcabadora(linha);
            const volumeBase = numero(campo(linha, acabadora ? 'TIRAGEM A ENTREGAR (total por CD)' : 'TIRAGEM'));
            const tiragem = numero(campo(linha, 'TIRAGEM'));
            const dtPlan = window.pgDataPlanoEntregaSLA?.(linha) || null;
            const volumes = window.pgVolumesColetaUnificadosV37(linha, hoje);
            const dtReal = volumes.entregaTP;
            const entregue = volumes.entrega;
            const dtAgendaColeta = !acabadora
                ? volumes.mapaAgendado : null;
            const dtMapaAgendado = dtAgendaColeta
                ? window.pgDataPlanoEntregaSLA(linha, dtAgendaColeta) : null;
            const volumeMapaAgendado = dtMapaAgendado && dtMapaAgendado >= hoje && !dtReal
                ? volumes.mapa : 0;
            // Mantém o contrato do gráfico compartilhado; dtColeta representa Entrega_TP nesta visão.
            const prazo = {
                linha, vencida: !dtPlan || dtPlan <= hoje ? tiragem : 0,
                dtVencida: dtPlan && dtPlan <= hoje ? dtPlan : null,
                aVencer: dtPlan && dtPlan > hoje ? tiragem : 0,
                dtAVencer: dtPlan && dtPlan > hoje ? dtPlan : null,
                coletadaBruta: volumes.bruto, dtColeta: dtReal, dtMapaAgendado
            };
            const saldo = window.pgSaldoPrazoV35(prazo, hoje, hoje);
            resumo.total += volumeBase;
            resumo.realizado += entregue;
            resumo.realizadoDatado += entregue;
            resumo.mapaSolicitado += volumes.mapa;
            resumo.mapaAgendadoTotal += volumeMapaAgendado;
            resumo.backlogAtual += saldo.vencido;
            resumo.backlogSemData += saldo.semData;
            resumo.pendenteVencido += saldo.vencido;
            resumo.prazosRegistros.push(prazo);
            resumo.registros.push({
                linha, pcp: linha, dtPlan, dtReal, tiragem, volumeBase,
                coletada: entregue, entregue, mapaSolicitado: volumes.mapa,
                dtMapaAgendado, volumeMapaAgendado, prazo,
                motivo: dtPlan ? 'Coleta (re)plan ou baseline + Matriz_SLA' : 'Sem previsão de entrega: verificar coleta planejada e rota Matriz_SLA'
            });
            somarDia(dtReal, 'real', entregue);
            somarDia(dtMapaAgendado, 'agendado', volumeMapaAgendado);
            if (!dtPlan) resumo.semPlano += tiragem;
            else {
                somarDia(dtPlan, 'esperado', tiragem);
                if (dtPlan <= hoje) resumo.esperadoHoje += tiragem;
            }
        });
        cacheResumos.set(base, {hoje, matriz: window.PG_MATRIZ_SLA, resumo});
        return resumo;
    };

    window.pgExportarVisaoEntregaCD = function(dataCorte, titulo, elemento, resumo) {
        const corte = String(dataCorte || hojePortal()).slice(0, 10);
        const corteReal = corte > hojePortal() ? hojePortal() : corte;
        const cabecalho = ['Marca', 'Gráfica', 'Série', 'SKU', 'Descrição', 'CD destino',
            'Kit', 'OP', 'Envio', 'Coleta planejada', 'SLA (dias)', 'Entrega prevista',
            'Entrega TP', 'Tiragem', 'Planejado acumulado', 'Entregue acumulado', 'Gap'];
        const linhas = (resumo?.registros || []).map(r => {
            const l = r.linha || r.pcp;
            const plan = r.dtPlan && r.dtPlan <= corte ? r.tiragem : 0;
            const real = r.dtReal && r.dtReal <= corteReal ? r.coletada : 0;
            return [
                l.MARCA_FINAL || campo(l, 'MARCA') || l.UNIDADE || '',
                l.GRAFICA_FINAL || campo(l, 'GRÁFICA') || l.GRAFICA || '',
                campo(l, 'SÉRIE') || campo(l, 'Série') || l.SERIE || '',
                l.SKU_REAL || campo(l, 'SKU') || '',
                l.DESC_REAL || campo(l, 'DESCRIÇÃO') || l.DESCRICAO || l.PRODUTO || '',
                l.CD_FINAL || campo(l, 'CD DESTINO') || l.CD || '',
                campo(l, 'KIT') || campo(l, 'Kit') || '',
                campo(l, 'OP') || '', campo(l, 'ENVIO') || campo(l, 'Envio') || '',
                window.pgDataPlanoColetaLinha(l) || '',
                window.pgDiasSLALinha(l) ?? '', r.dtPlan || '', r.dtReal || '',
                Math.round(r.tiragem), Math.round(plan), Math.round(real),
                Math.max(0, Math.round(plan) - Math.round(real))
            ];
        });
        const total = Array(cabecalho.length).fill('');
        total[0] = 'TOTAL GERAL';
        [13,14,15,16].forEach(i => total[i] = linhas.reduce((s, l) => s + Number(l[i] || 0), 0));
        linhas.push(total);
        window.reCriarSheets('Entregas_CD_' + corte.replaceAll('-', ''),
            [{nome: 'Entregas_por_CD', cabecalho, linhas}], elemento);
    };

    window.pgAtualizarPeriodoEntregasCD = function(acao = 'periodo') {
        const modo = document.querySelector('input[name="visaoEntregasCD"]:checked')?.value || 'mes';
        const acumuladoGlobal = !!document.getElementById('acumuladaEntregasCD')?.checked;
        const mes = document.getElementById('mesEntregasCD');
        if (mes && !mes.value) mes.value = hojePortal().slice(0, 7);
        document.getElementById('periodoEntregasCD')?.classList.toggle('hidden', modo !== 'mes');

        const aplicarModoEmTodos = acao === 'modo-global' || acao === 'inicial';
        if (aplicarModoEmTodos) {
            acumuladoGeralEntregasCD = acumuladoGlobal;
            atualizarBotoesModoEntregaCD('modoGeralEntregasCD', acumuladoGeralEntregasCD);
        }

        sufixosAtivos.forEach(sufixo => {
            document.querySelectorAll('input[name="visaoColetaFunil' + sufixo + '"]').forEach(r => r.checked = r.value === modo);
            const chk = document.getElementById('acumuladaColetaFunil' + sufixo);
            if (aplicarModoEmTodos && chk) chk.checked = acumuladoGlobal;
            document.getElementById('mesColetaFunil' + sufixo).value = mes?.value || hojePortal().slice(0, 7);
            atualizarBotoesModoEntregaCD('modoIndividual' + sufixo, !!chk?.checked);
            window.renderColetaFinalFunil(sufixo);
        });
        window.pgRenderGraficoGeralEntregasCD();
    };

    window.processarEntregasCD = function() {
        const container = document.getElementById('graficosEntregasCD');
        if (!container) return;
        const origem = document.getElementById('pgFiltroOrigem')?.value || 'TODOS';
        const baseGlobal = window.pgBaseGeralReportExecutiva || window.dadosDestinoCDFinal || [];
        let base = typeof window.pgBaseForecastFiltrada === 'function'
            ? window.pgBaseForecastFiltrada(baseGlobal, origem, 'CD') : baseGlobal.slice();
        base = ajustarBaseEntregasCD(base, origem);

        const grupos = new Map();
        base.forEach(l => {
            const cd = cdFinalEntrega(l);
            if (!cd || ['-', 'N/A', 'NA', 'SEM CD', 'SEM DESTINO', 'A DEFINIR'].includes(cd)) return;
            if (!grupos.has(cd)) grupos.set(cd, []);
            grupos.get(cd).push(l);
        });
        gruposAtivosEntregasCD = grupos;
        baseAtivaEntregasCD = Array.from(grupos.values()).flat();
        const graficosAtuais = typeof graficos !== 'undefined' ? graficos : window.graficos;
        sufixosAtivos.forEach(sufixo => {
            const chave = 'coletaFinalFunil' + sufixo;
            if (graficosAtuais?.[chave]) {
                graficosAtuais[chave].destroy();
                delete graficosAtuais[chave];
            }
            delete window.pgContextosEntregasCD?.[sufixo];
            delete window.pgExtracaoColetaV35?.[sufixo];
        });
        sufixosAtivos = [];
        window.pgContextosEntregasCD = window.pgContextosEntregasCD || {};
        container.innerHTML = '';
        Array.from(grupos.keys()).sort((a, b) => a.localeCompare(b, 'pt-BR', {numeric: true})).forEach((cd, i) => {
            const sufixo = 'EntregasCD' + i;
            sufixosAtivos.push(sufixo);
            window.pgContextosEntregasCD[sufixo] = {base: grupos.get(cd), cd, entrega: true};
            const card = document.createElement('div');
            card.className = 'bg-white p-4 rounded-xl shadow-sm border border-slate-200';
            card.innerHTML = `<div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <h3 class="text-sm font-black text-slate-800">${escapar(cd)}</h3>
                <div class="flex flex-wrap items-center gap-2">
                    <div id="modoIndividual${sufixo}" class="inline-flex rounded-lg border border-slate-200 bg-slate-50 p-1 text-[11px] font-bold">
                        <button type="button" data-pg-modo="dia" onclick="window.pgDefinirModoIndividualEntregasCD('${sufixo}', false)" class="rounded-md px-3 py-1.5 transition-colors">Dia a dia</button>
                        <button type="button" data-pg-modo="acumulado" onclick="window.pgDefinirModoIndividualEntregasCD('${sufixo}', true)" class="rounded-md px-3 py-1.5 transition-colors">Acumulada</button>
                    </div>
                    <button type="button" class="text-xs font-bold text-slate-600 border border-slate-200 rounded px-3 py-1.5 hover:bg-slate-50" onclick="window.pgExtrairPontoColetaV35('${sufixo}', 0, 'base', this)">Baixar auditoria</button>
                </div>
                </div>
                <div style="display:none" aria-hidden="true">
                    ${['mes','30d','7d','semana'].map(m => `<input type="radio" name="visaoColetaFunil${sufixo}" value="${m}" ${m === 'mes' ? 'checked' : ''}>`).join('')}
                    <input type="checkbox" id="acumuladaColetaFunil${sufixo}" checked>
                    <div id="periodoColetaFunil${sufixo}"><input id="mesColetaFunil${sufixo}" type="month"></div>
                </div>
                <div id="resumoColetaFinalFunil${sufixo}" class="flex flex-wrap gap-4 text-xs text-slate-700 mb-4"></div>
                <div class="overflow-x-auto scroller"><div id="larguraColetaFunil${sufixo}">
                    <div class="relative h-80"><canvas id="grafColetaFinalFunil${sufixo}"></canvas></div>
                    <div id="diasColetaFunil${sufixo}" style="display:grid;padding:0 24px"></div>
                </div></div>
                <p id="notaColetaFinalFunil${sufixo}" class="text-xs text-slate-500 mt-3"></p>`;
            container.appendChild(card);
        });
        if (!sufixosAtivos.length) container.innerHTML = '<div class="bg-white p-4 rounded-xl text-sm text-slate-500">Nenhum CD nos filtros selecionados.</div>';
        window.pgAtualizarPeriodoEntregasCD('inicial');
    };
})();
</script>
