<div id="abaReportExecutiva" class="aba-conteudo hidden">
<style>
    #abaReportExecutiva {
        font-family: Arial, Helvetica, sans-serif;
        color: #111827;
        background: #ffffff;
    }

    #abaReportExecutiva .re-wrap {
        width: 100%;
        background: #ffffff;
        padding: 0 4px 18px 4px;
        box-sizing: border-box;
    }

    #abaReportExecutiva .re-title {
        margin: 0 0 26px 4px;
        padding-top: 0;
        font-size: 22px;
        line-height: 1.15;
        font-weight: 700;
        color: #111827;
    }
    #abaReportExecutiva .re-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 26px;
    }
    #abaReportExecutiva .re-title-row .re-title { margin-bottom: 0; }
    #abaReportExecutiva .re-capture {
        background: #FA4616;
        color: #ffffff;
        border: 0;
        border-radius: 10px;
        padding: 12px 16px;
        font: bold 12px Arial, sans-serif;
        cursor: pointer;
    }
    #abaReportExecutiva .re-capture:hover { background: #e13c11; }
    #abaReportExecutiva .re-capture:disabled { opacity: .65; cursor: wait; }

    #abaReportExecutiva .re-scroll {
        width: 100%;
        overflow-x: auto;
    }

    #abaReportExecutiva .re-table {
        width: 98%;
        min-width: 1040px;
        margin: 0 auto;
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 13px;
        color: #111827;
        background: #ffffff;
    }

    #abaReportExecutiva .re-table thead th {
        height: 30px;
        padding: 3px;
        box-sizing: border-box;
        background: #48659a;
        color: #ffffff;
        font-size: 12px;
        line-height: 1.15;
        font-weight: 700;
        text-align: center;
        white-space: normal;
        border-right: 1px solid rgba(255,255,255,.15);
    }

    #abaReportExecutiva .re-table tbody tr:nth-child(odd) { background: #ffffff; }
    #abaReportExecutiva .re-table tbody tr:nth-child(even) { background: #f4f4fb; }

    #abaReportExecutiva .re-table tbody td {
        height: 26px;
        padding: 3px;
        box-sizing: border-box;
        font-size: 13px;
        line-height: 1.1;
        text-align: center;
        border-bottom: 1px solid #ececf2;
        white-space: nowrap;
    }

    #abaReportExecutiva .re-table tbody td:first-child {
        text-align: left;
        padding-left: 4px;
    }

    #abaReportExecutiva .re-table tbody tr.re-total {
        background: #ffffff !important;
        font-weight: 700;
        border-top: 1px solid #7c8290;
    }

    #abaReportExecutiva .re-table tbody tr.re-total td { font-weight: 700; }
    #abaReportExecutiva .re-table .re-key-cell {
        position: sticky;
        left: 0;
        z-index: 2;
        white-space: normal;
        overflow-wrap: anywhere;
    }
    #abaReportExecutiva .re-table tbody .re-key-cell { background: inherit; }
    #abaReportExecutiva .re-table thead .re-key-cell { z-index: 3; }

    #abaReportExecutiva .re-status-cell {
        padding-left: 0 !important;
        padding-right: 0 !important;
        width: 30px;
    }

    #abaReportExecutiva .re-status-clickable {
        cursor: pointer;
    }

    #abaReportExecutiva .re-status-clickable:hover .re-dot {
        transform: scale(1.18);
    }

    #abaReportExecutiva .re-status-clickable:focus-visible {
        outline: 2px solid #48659a;
        outline-offset: -2px;
    }

    #abaReportExecutiva .re-dot {
        transition: transform .12s ease;
        display: inline-block;
        width: 16px;
        height: 16px;
        border-radius: 999px;
        vertical-align: middle;
        box-shadow: inset 0 -1px 2px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.03);
    }

    #abaReportExecutiva .re-dot-green {
        background: radial-gradient(circle at 35% 30%, #9bf2c5 0%, #46d695 45%, #1fb96e 100%);
    }

    #abaReportExecutiva .re-dot-yellow {
        background: radial-gradient(circle at 35% 30%, #ffe990 0%, #f6c845 50%, #dfa91d 100%);
    }

    #abaReportExecutiva .re-dot-red {
        background: radial-gradient(circle at 35% 30%, #ff8ba0 0%, #ee4764 48%, #cf2343 100%);
    }

    #abaReportExecutiva .re-empty {
        color: #6b7280;
        font-size: 13px;
        padding: 18px 6px;
    }

    #abaReportExecutiva .re-chart-section {
        margin-top: 42px;
        width: 100%;
        background: #ffffff;
        padding: 0 10px 8px 10px;
        box-sizing: border-box;
    }

    #abaReportExecutiva .re-chart-title {
        margin: 0 0 12px 0;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 32px;
        line-height: 1.1;
        font-weight: 400;
        color: #777777;
    }

    #abaReportExecutiva .re-chart-wrap {
        position: relative;
        width: 100%;
        height: 570px;
        background: #ffffff;
    }

    #abaReportExecutiva .re-chart-caption {
        margin-top: 4px;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 13px;
        color: #222222;
    }
</style>

<div class="re-wrap">
    <div class="re-title-row">
        <h2 class="re-title">Status de Produção e Entregas por Marca</h2>
        <button type="button" id="reScreenshot" class="re-capture" onclick="window.pgRECapturarTabela(this)" title="Baixa todas as linhas e etapas visíveis em PNG de alta resolução">📸 Capturar tabela completa (PNG)</button>
    </div>
    <div class="re-scroll">
        <table class="re-table">
            <colgroup>
                <col style="width:8%">
                <col class="re-group-acab" style="width:11%">
                <col class="re-group-acab" style="width:12%">
                <col class="re-group-acab" style="width:2.2%">
                <col class="re-group-kit" style="width:11%">
                <col class="re-group-kit" style="width:12%">
                <col class="re-group-kit" style="width:2.2%">
                <col class="re-group-enttodos" style="width:14%">
                <col class="re-group-enttodos" style="width:15%">
                <col class="re-group-enttodos" style="width:2.2%">
                <col class="re-group-entcd" style="width:11%">
                <col class="re-group-entcd" style="width:12.5%">
                <col class="re-group-entcd" style="width:2.2%">
                <col class="re-group-enttp" style="width:11%">
                <col class="re-group-enttp" style="width:12.5%">
                <col class="re-group-enttp" style="width:2.2%">
            </colgroup>
            <thead>
                <tr>
                    <th class="re-key-cell">Marca</th>
                    <th class="re-group-acab">Acabado (Real)</th>
                    <th class="re-group-acab" id="reThAcabPlan">Acabado (Plan.)</th>
                    <th class="re-group-acab"></th>
                    <th class="re-group-kit">Form. Kit (Real)</th>
                    <th class="re-group-kit" id="reThKitPlan">Form. Kit (Plan.)</th>
                    <th class="re-group-kit"></th>
                    <th class="re-group-enttodos">Coleta (Real)</th>
                    <th class="re-group-enttodos" id="reThEntTodosPlan">Coleta (Plan.)</th>
                    <th class="re-group-enttodos"></th>
                    <th class="re-group-entcd">Coleta (Real)</th>
                    <th class="re-group-entcd" id="reThEntCDPlan">Coleta (Plan.)</th>
                    <th class="re-group-entcd"></th>
                    <th class="re-group-enttp">Entrega TP (Real)</th>
                    <th class="re-group-enttp" id="reThEntTPPlan">Entrega TP (Plan.)</th>
                    <th class="re-group-enttp"></th>
                </tr>
            </thead>
            <tbody id="reTabelaMarcas">
                <tr><td colspan="16" class="re-empty">Carregando...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="re-chart-section">
        <h2 class="re-chart-title">Curva de Entregas Prevista</h2>
        <div class="re-chart-wrap">
            <canvas id="reCurvaEntregas"></canvas>
        </div>
        <div class="re-chart-caption">Curva de entrega</div>
    </div>
</div>
</div>
<script>
window.pgREFixarAgrupamento = function() {
    const tabela = document.querySelector('#abaReportExecutiva .re-table');
    if (!tabela) return;
    let esquerda = 0;
    const posicoes = Array.from(tabela.querySelectorAll('thead .re-key-cell')).map(th => {
        const atual = esquerda; esquerda += th.getBoundingClientRect().width; return atual;
    });
    tabela.querySelectorAll('tr').forEach(tr => {
        tr.querySelectorAll('.re-key-cell').forEach((celula, i) => {
            celula.style.left = (posicoes[i] || 0) + 'px';
        });
    });
};
window.addEventListener('resize', window.pgREFixarAgrupamento);
if (typeof ResizeObserver === 'function') {
    const tabelaRE = document.querySelector('#abaReportExecutiva .re-table');
    if (tabelaRE) new ResizeObserver(window.pgREFixarAgrupamento).observe(tabelaRE);
}
// Captura a tabela já calculada e os indicadores visíveis, incluindo toda a rolagem.
window.pgRECapturarTabela = async function(botao) {
    if (window.pgRECapturandoTabela) return;
    const tabela = document.querySelector('#abaReportExecutiva .re-table');
    const ths = tabela ? Array.from(tabela.querySelectorAll('thead th')) : [];
    const indices = ths.map((th, i) => window.getComputedStyle(th).display !== 'none' ? i : -1).filter(i => i >= 0);
    const trs = tabela ? Array.from(tabela.querySelectorAll('tbody tr[data-re-chave]')) : [];
    if (!indices.length || !trs.length) { window.alert('A tabela ainda não tem dados para capturar.'); return; }
    window.pgRECapturandoTabela = true;
    const anterior = botao ? botao.textContent : '';
    if (botao) { botao.disabled = true; botao.textContent = 'Gerando PNG…'; }
    try {
        await new Promise(resolve => setTimeout(resolve, 0));
        const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
        if (!ctx) throw new Error('Não foi possível preparar a imagem.');
        const texto = el => String(el && el.textContent || '').replace(/\s+/g, ' ').trim();
        const colunas = indices.map(i => ({ nome: texto(ths[i]), grupo: !ths[i].className.includes('re-group-') }));
        const linhas = trs.map(tr => ({
            total: tr.classList.contains('re-total'),
            cells: indices.map(i => {
                const td = tr.children[i], dot = td && td.querySelector('.re-dot');
                const cor = dot ? ['green', 'yellow', 'red'].find(c => dot.classList.contains('re-dot-' + c)) : null;
                return { texto: texto(td), cor: cor };
            })
        }));
        const margem = 0, topo = 0, escala = 2;
        ctx.font = 'bold 20px Arial, sans-serif';
        const larguras = colunas.map((c, j) => !c.nome ? 46 : c.grupo ?
            Math.min(420, Math.max(190, ...linhas.map(l => ctx.measureText(l.cells[j].texto).width + 28))) : 180);
        const largura = larguras.reduce((a, b) => a + b, 0);
        const quebrar = (valor, maximo) => {
            const resultado = []; let atual = '';
            for (const palavra of String(valor).split(' ')) {
                const junto = atual ? atual + ' ' + palavra : palavra;
                if (ctx.measureText(junto).width <= maximo) { atual = junto; continue; }
                if (atual) { resultado.push(atual); atual = ''; }
                for (const letra of Array.from(palavra)) {
                    if (atual && ctx.measureText(atual + letra).width > maximo) { resultado.push(atual); atual = ''; }
                    atual += letra;
                }
            }
            if (atual || !resultado.length) resultado.push(atual);
            return resultado;
        };
        const corte = window.pgREDataCorteV57 || '';
        ctx.font = 'bold 18px Arial, sans-serif';
        const headers = colunas.map((c, j) => quebrar(c.nome, larguras[j] - 20));
        const cabAltura = Math.max(76, ...headers.map(h => h.length * 23 + 20));
        linhas.forEach(l => {
            ctx.font = (l.total ? 'bold ' : '') + '20px Arial, sans-serif';
            l.textos = l.cells.map((c, j) => quebrar(c.texto, larguras[j] - 20));
            l.altura = Math.max(46, ...l.textos.map(t => t.length * 25 + 16));
        });
        // Divide recortes muito extensos em partes, mantendo sempre fonte e resolução.
        const alturaMaxima = Math.min(8000, Math.floor(16000000 / (largura * escala * escala)));
        const paginas = []; let pagina = [], altura = cabAltura;
        linhas.forEach(l => {
            if (pagina.length && altura + l.altura > alturaMaxima) { paginas.push(pagina); pagina = []; altura = cabAltura; }
            pagina.push(l); altura += l.altura;
        });
        if (pagina.length) paginas.push(pagina);
        const linhaTexto = (textos, x, y, w, h, esquerda, entre) => {
            ctx.textAlign = esquerda ? 'left' : 'center'; ctx.textBaseline = 'middle';
            textos.forEach((t, k) => ctx.fillText(t, esquerda ? x + 12 : x + w / 2, y + h / 2 + (k - (textos.length - 1) / 2) * entre));
        };
        for (let p = 0; p < paginas.length; p++) {
            const alturaPagina = cabAltura + paginas[p].reduce((a, l) => a + l.altura, 0);
            canvas.width = Math.ceil(largura * escala); canvas.height = Math.ceil(alturaPagina * escala);
            ctx.scale(escala, escala); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, largura, alturaPagina);
            ctx.fillStyle = '#48659a'; ctx.fillRect(margem, topo, largura - margem * 2, cabAltura);
            let x = margem;
            ctx.font = 'bold 18px Arial, sans-serif'; ctx.fillStyle = '#ffffff';
            headers.forEach((h, j) => { linhaTexto(h, x, topo, larguras[j], cabAltura, false, 23); x += larguras[j]; });
            let y = topo + cabAltura;
            paginas[p].forEach((l, i) => {
                ctx.fillStyle = l.total ? '#dceafa' : i % 2 ? '#f4f4fb' : '#ffffff';
                ctx.fillRect(margem, y, largura - margem * 2, l.altura);
                ctx.strokeStyle = '#dce5f0'; ctx.beginPath(); ctx.moveTo(margem, y + l.altura); ctx.lineTo(largura - margem, y + l.altura); ctx.stroke();
                x = margem;
                l.cells.forEach((c, j) => {
                    if (c.cor) {
                        ctx.fillStyle = { green: '#1fb96e', yellow: '#edbc2c', red: '#df3454' }[c.cor];
                        ctx.beginPath(); ctx.arc(x + larguras[j] / 2, y + l.altura / 2, 10, 0, Math.PI * 2); ctx.fill();
                    } else {
                        ctx.fillStyle = '#172B4D'; ctx.font = (l.total ? 'bold ' : '') + '20px Arial, sans-serif';
                        linhaTexto(l.textos[j], x, y, larguras[j], l.altura, colunas[j].grupo, 25);
                    }
                    x += larguras[j];
                });
                y += l.altura;
            });
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            if (!blob) throw new Error('Não foi possível gerar o PNG.');
            const url = URL.createObjectURL(blob), a = document.createElement('a');
            a.download = 'status-producao-entregas-' + corte + (paginas.length > 1 ? '-parte-' + (p + 1) : '') + '.png';
            a.href = url; a.click(); setTimeout(() => URL.revokeObjectURL(url), 10000);
        }
    } catch (e) {
        console.error('[REPORT] Captura PNG:', e); window.alert('Não foi possível capturar a tabela: ' + (e && e.message || e));
    } finally {
        window.pgRECapturandoTabela = false;
        if (botao) { botao.disabled = false; botao.textContent = anterior; }
    }
};
</script>
