<script>
(function () {
    'use strict';
    const cabecalho = ['KIT', 'SKU', 'Gráfica', 'Marca', 'CD destino',
        'Data Replan', 'Data realizada', 'Planejado', 'Realizado', 'Tiragem total',
        'Mapa solicitado', 'Data de coleta TP', 'Data de entrega TP', 'Tiragem entregue TP',
        'Replan formação de kit', 'Data realizada formação de kit', 'Planejado formação de kit',
        'Realizado formação de kit', 'Data mapa agendado', 'Mapa agendado',
        'Data planejada usada no portal', 'Data planejada kit usada no portal', 'Origem', 'Linha PCP',
        'Data de fechamento de setembro', 'Tiragem no fechamento de setembro'];
    const campo = (l, n) => window.pgCampoPrazoV35(l, n);
    const texto = v => {
        const s = String(v ?? '').trim();
        return !s || ['-', 'N/A', 'undefined', 'null'].includes(s) ? '' : s;
    };
    const numero = v => {
        const n = Number(v || 0);
        if (!Number.isFinite(n)) throw new Error('Quantidade inválida na base do portal.');
        return n;
    };
    const primeira = valores => valores.find(v => texto(v)) || '';
    function dataReplan(l, nome) {
        const valor = campo(l, nome);
        if (valor == null || String(valor).trim() === '') return '';
        const data = window.pgNormalizarDataColeta(valor, dtHojeISO);
        if (!data) throw new Error('Replan preenchido com data inválida em ' +
            (l._SOURCE || 'PCP') + ', linha ' + l._PG_TP_LINHA + ': ' + nome + '.');
        return data;
    }
    function identidade(l, eventos) {
        const kit = primeira(['KIT', 'COD KIT', 'CÓDIGO KIT', 'COD_KIT'].map(n => campo(l, n))) ||
            [...new Set(eventos.map(e => e.kit).filter(Boolean))].join(' / ') ||
            window.pgKitsMapaTPLinha(l).join(' / ');
        const destino = primeira([window.pgValorFiltroProducao(l, 'CD Destino'),
            l.CD_DESTINO_PCP_ORIGINAL, l.CD_DESTINO, campo(l, 'CD DESTINO'), l.CD_FINAL, l.CD, l.CK]);
        const valores = [texto(kit), texto(l.SKU_REAL || campo(l, 'SKU')),
            texto(l.GRAFICA_FINAL || campo(l, 'GRÁFICA') || l.GRAFICA),
            texto(l.MARCA_FINAL || campo(l, 'UNIDADE') || l.MARCA),
            texto(window.pgNormalizarDestinoFiltro(destino))];
        const ausentes = valores.map((v, i) => v ? '' : cabecalho[i]).filter(Boolean);
        if (ausentes.length) throw new Error('Campos obrigatórios ausentes na origem: ' +
            ausentes.join(', ') + ' — ' + (l._SOURCE || 'PCP') + ', linha ' + l._PG_TP_LINHA + '.');
        return valores;
    }
    window.pgMontarAuditoriaPortalSheets = function () {
        const hoje = dtHojeISO;
        const aba = document.querySelector('.aba-conteudo:not(.hidden)')?.id;
        const sufixo = aba === 'abaGiroSemanal' ? 'Giro' : 'FUNIL';
        const visao = ['abaFunil', 'abaGiroSemanal'].includes(aba)
            ? window.pgExtracaoColetaV35?.[sufixo] : null;
        const resumo = visao?.tipo === 'coleta' ? visao.resumo : window.pgObterResumoColeta();
        const kitFunil = window.pgKitFunilAuditoriaPortal;
        const kitReport = window.pgReportAuditoriaPortal?.kit;
        const kit = aba === 'abaReportExecutiva' ? kitReport :
            (kitFunil?.base === window.pgBaseGeralReportExecutiva ? kitFunil : kitReport);
        const registros = new Map();
        (resumo.registros || []).forEach(r => registros.set(r.linha || r.pcp, { coleta: r }));
        (kit?.linhas || []).forEach(r => {
            if (!registros.has(r.linha)) registros.set(r.linha, {});
            registros.get(r.linha).kit = r;
        });
        const linhas = [];
        const dias = new Map();
        const somarDia = (data, indicador, volume) => {
            if (!data || !volume) return;
            if (!dias.has(data)) dias.set(data, { plan: 0, real: 0, agenda: 0 });
            dias.get(data)[indicador] += volume;
        };
        let entregaEsperada = 0, planEsperado = 0, kitPlanEsperado = 0, fechamentoEsperado = 0;
        registros.forEach((registro, l) => {
            const r = registro.coleta, k = registro.kit;
            const volumes = r ? window.pgVolumesColetaUnificadosV37(l, hoje) : null;
            const coletas = r ? window.pgEventosRealRegistroTP(r).filter(e => e.data <= hoje) : [];
            const entregas = volumes ? volumes.eventosEntregaTP.filter(e => e.data <= hoje) : [];
            const agenda = r ? window.pgEventosAgendaRegistroTP(r) : [];
            const id = identidade(l, [...coletas, ...entregas, ...agenda]);
            const replan = dataReplan(l, 'Coleta/Internalização de estoque final (re) plan');
            const replanKit = dataReplan(l, 'Formação de kit/Encaixotamento Final (re) plan');
            const faseKit = FASES.find(f => f.id === 'kit');
            const realKit = k?.dtReal || (faseKit && window.pgDataRealFaseFunil(l, faseKit)) || '';
            const parcelas = new Map();
            function adicionar(tipo, eventos) {
                eventos.forEach((e, i) => {
                    // Coleta e entrega só compartilham a parcela quando a linha do mapa é a mesma.
                    // As datas legadas únicas pertencem à mesma linha agregada do PCP.
                    const chave = tipo === 'agenda' ? 'agenda:' + (e.linhaMapa || i) :
                        e.linhaMapa ? 'mapa:' + e.linhaMapa : eventos.length === 1 ? 'pcp' : tipo + ':' + i;
                    if (!parcelas.has(chave)) parcelas.set(chave, { coleta: 0, entrega: 0, agenda: 0,
                        dtColeta: '', dtEntrega: '', dtAgenda: '', dtFechamento: '', fechamento: 0 });
                    const p = parcelas.get(chave);
                    p[tipo] += numero(e.volume);
                    p[tipo === 'coleta' ? 'dtColeta' : tipo === 'entrega' ? 'dtEntrega' : 'dtAgenda'] = e.data;
                    if (tipo === 'coleta') {
                        const dataFechamento = window.pgDataFechamentoSetembroV60(l, e.data, hoje);
                        if (dataFechamento) {
                            p.dtFechamento = dataFechamento;
                            p.fechamento += numero(e.volume);
                            fechamentoEsperado += numero(e.volume);
                        }
                    }
                });
            }
            adicionar('coleta', coletas);
            adicionar('entrega', entregas);
            adicionar('agenda', agenda);
            if (!parcelas.size) parcelas.set('pcp', { coleta: 0, entrega: 0, agenda: 0,
                dtColeta: '', dtEntrega: '', dtAgenda: '' });
            const lista = Array.from(parcelas.values()).sort((a, b) =>
                (a.dtColeta || a.dtEntrega || a.dtAgenda || '9999').localeCompare(
                    b.dtColeta || b.dtEntrega || b.dtAgenda || '9999'));
            const volumeBase = r ? Math.max(0, window.reNumero(campo(l,
                window.pgEhFonteAcabadora(l) ? 'TIRAGEM A ENTREGAR (total por CD)' : 'TIRAGEM'))) : 0;
            lista.forEach((p, i) => {
                const primeiraParcela = i === 0;
                // Volumes agregados ficam na primeira parcela da linha, sem rateio inventado.
                // Replan permanece preenchido em todas as parcelas quando existe no PCP.
                const plan = primeiraParcela && r ? numero(r.tiragem) : 0;
                const kitPlan = primeiraParcela && k ? numero(k.volume) : 0;
                linhas.push([...id, replan, p.dtColeta, plan, p.coleta,
                    primeiraParcela ? volumeBase : 0,
                    primeiraParcela && r ? numero(r.mapaSolicitado) : 0,
                    p.dtColeta, p.dtEntrega, p.entrega, replanKit, realKit,
                    kitPlan, primeiraParcela && k ? numero(k.real) : 0,
                    p.dtAgenda, p.agenda, r?.dtPlan || '', k?.dtPlan || '',
                    window.pgEhFonteAcabadora(l) ? 'PCP Acabadora' : 'PCP', texto(l._PG_TP_LINHA),
                    p.dtFechamento || '', p.fechamento || 0]);
                somarDia(r?.dtPlan, 'plan', plan);
                somarDia(p.dtColeta, 'real', p.coleta);
                somarDia(p.dtAgenda, 'agenda', p.agenda);
            });
            entregaEsperada += volumes ? volumes.entrega : 0;
            planEsperado += r ? numero(r.tiragem) : 0;
            kitPlanEsperado += k ? numero(k.volume) : 0;
        });
        const soma = coluna => linhas.reduce((s, l) => s + numero(l[coluna]), 0);
        function conferir(nome, atual, esperado) {
            if (Math.abs(atual - numero(esperado)) > 0.000001) throw new Error(
                'A auditoria não conciliou ' + nome + ': diferença de ' + (atual - numero(esperado)) + '.');
        }
        conferir('Planejado', soma(7), planEsperado);
        conferir('Planejado até hoje', linhas.reduce((s, l) =>
            s + (l[20] && l[20] <= hoje ? numero(l[7]) : 0), 0), resumo.esperadoHoje);
        conferir('Realizado', soma(8), resumo.realizado);
        conferir('Tiragem total', soma(9), resumo.total);
        conferir('Mapa solicitado', soma(10), resumo.mapaSolicitado);
        conferir('Entrega TP', soma(13), entregaEsperada);
        conferir('Mapa agendado', soma(19), resumo.mapaAgendadoTotal);
        conferir('Planejado formação de kit', soma(16), kitPlanEsperado);
        conferir('Fechamento setembro', soma(25), fechamentoEsperado);
        if (kit) {
            conferir('Realizado formação de kit', soma(17), kit.total.real);
            conferir('Planejado formação de kit no corte do portal', linhas.reduce((s, l) =>
                s + (l[21] && calcDiffDiasISO(l[21], kit.corte || hoje) >= 3
                    ? numero(l[16]) : 0), 0), kit.total.plan);
        }
        (resumo.dias || new Map()).forEach((d, data) => {
            const exportado = dias.get(data) || { plan: 0, real: 0, agenda: 0 };
            conferir('Planejado em ' + data, exportado.plan, d.esperado);
            conferir('Realizado em ' + data, exportado.real, d.real);
            conferir('Mapa agendado em ' + data, exportado.agenda, d.agendado);
        });
        console.info('[AUDITORIA XLSX]', { abas: 1, linhas: linhas.length,
            planejado: soma(7), realizado: soma(8), tiragemTotal: soma(9), mapaSolicitado: soma(10),
            entregueTP: soma(13), mapaAgendado: soma(19), realizadoKit: soma(17) });
        return [{ nome: 'Auditoria Portal PG', cabecalho, linhas,
            colunasData: [5, 6, 11, 12, 14, 15, 18, 20, 21, 24],
            colunasNumero: [7, 8, 9, 10, 13, 16, 17, 19, 25] }];
    };
    window.pgBaixarAuditoriaPortalXlsx = async function (botao) {
        if (window.pgCarregamentoInicial || !window.dadosGlobais?.length) {
            alert('Aguarde o carregamento completo dos dados do portal.'); return;
        }
        if (!window.pgTPExportacaoPronta() || !window.pgStatusAgendaTP().disponivel) {
            if (!window.pgStatusAgendaTP().disponivel) alert(window.pgStatusAgendaTP().aviso);
            return;
        }
        if (botao.disabled) return;
        const rotulo = botao.textContent;
        botao.disabled = true; botao.textContent = 'Gerando XLSX…';
        try {
            await new Promise(resolve => setTimeout(resolve, 0));
            window.processarFunil();
            window.processarReportExecutiva();
            const abas = window.pgMontarAuditoriaPortalSheets();
            const arquivo = window.pgGerarExcelAbas(abas);
            const url = URL.createObjectURL(arquivo);
            const link = document.createElement('a');
            link.href = url; link.download = 'Auditoria_Portal_PG_' + dtHojeISO + '.xlsx';
            document.body.appendChild(link); link.click(); link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 60000);
        } catch (e) {
            alert('Não foi possível baixar a auditoria: ' + (e?.message || e));
        } finally {
            botao.disabled = false; botao.textContent = rotulo;
        }
    };
})();
</script>
